  a:`<p>An attribute directive changes the element it sits on. A structural directive decides whether and how often a piece of template is rendered, and it does that by injecting <code>TemplateRef</code> and <code>ViewContainerRef</code> instead of an element.</p><p>The asterisk is pure sugar: Angular rewrites <code>*appUnless="x"</code> into an <code>ng-template</code> with <code>[appUnless]="x"</code> on it. That is the whole secret, and it explains why the input has to be named after the selector.</p>`,
  code:`@Directive({ selector: '[appUnless]' })\nexport class Unless {\n  private readonly tpl = inject(TemplateRef);\n  private readonly container = inject(ViewContainerRef);\n  readonly appUnless = input.required<boolean>();\n\n  constructor() {\n    effect(() => {\n      this.container.clear();\n      if (!this.appUnless()) this.container.createEmbeddedView(this.tpl);\n    });\n  }\n}`,
  fq:`Should you write structural directives today?`,
  fa:`<p>Rarely. <code>@if</code>, <code>@for</code> and <code>@switch</code> are built in, faster, and need no import, and there is a migration that converts a whole codebase. Write one when you need your own repetition rule or your own template context, which is a genuine but uncommon requirement.</p>`
},
{
  d:'Medium', topic:'Templates',
  q:`Why can projected content not read the component's state?`,
  a:`<p>Because the nodes belong to the caller. Content passed into <code>ng-content</code> was written and bound in the caller's template, so its expressions resolve against the caller's class, and it is checked as part of the caller's view. The component only decides where those nodes land.</p><p>If the component needs to supply data to the caller's markup, projection is the wrong tool: take an <code>ng-template</code> as an input and render it with <code>ngTemplateOutlet</code> and a context. That is exactly how a table component lets a caller define a cell that receives the row.</p>`,
  fq:`What does a contentChild query give you then?`,
  fa:`<p>A handle on the projected component or element, so the container can coordinate it: a tab strip can query its projected tabs and decide which is active. That is coordination rather than data flow, and it is why compound components in Angular are built on content queries.</p>`
},
{
  d:'Medium', topic:'DI',
  q:`Explain the injector hierarchy. What changes if you provide a service on a component instead of the root?`,
  a:`<p>A component looks in its own injector, then its ancestors', then the route's, then the root, and the first provider found wins. <code>@Service()</code> or <code>providedIn: 'root'</code> gives one instance for the whole application.</p><p>Providing on a component gives one instance per component instance, so two of that component get two independent copies. That is a bug if you wanted a singleton and exactly right for per-instance state such as a form model. Providing on a route gives an instance created on entry and destroyed on leave, which is the useful middle ground.</p>`,
  code:`@Component({\n  selector: 'app-panel',\n  providers: [Draft]        // one Draft per <app-panel>\n})\n\n// route-scoped: created on entry, destroyed on leave\n{ path: 'admin', providers: [AdminState], loadComponent: () => import('./admin') }`,
  fq:`How do you provide something that is not a class?`,
  fa:`<p>An <code>InjectionToken</code>, which is a unique typed key: <code>new InjectionToken&lt;Config&gt;('CONFIG', { factory: () => defaults })</code>. The factory gives it a default and keeps it tree-shakable. A plain string would collide and is untyped, and an abstract class is the neat option when the value has an interface, because it is a type and a runtime token at once.</p>`
},
{
  d:'Medium', topic:'HTTP',
  q:`What does HttpClient give you over fetch, and what changed recently?`,
  a:`<p>Interceptors, typed responses, cancellation through unsubscription, a testing module that intercepts requests, and integration with server rendering and the transfer cache. A bare <code>fetch</code> gives you none of that and you end up rebuilding half of it.</p><p>Two recent changes: it has been provided in the root injector since v21, so <code>provideHttpClient()</code> is only needed to configure interceptors or the transport, and since v22 it uses <code>fetch</code> rather than <code>XMLHttpRequest</code>. <code>withXhr()</code> opts back in, and the only functional reason to is upload progress, which <code>fetch</code> cannot report.</p>`,
  code:`export const authInterceptor: HttpInterceptorFn = (req, next) => {\n  const token = inject(Session).token();\n  if (!token) return next(req);\n  return next(req.clone({ setHeaders: { Authorization: 'Bearer ' + token } }));\n};\n\nprovideHttpClient(withInterceptors([authInterceptor, retryInterceptor]))`,
  fq:`Why is the request cloned rather than modified?`,
  fa:`<p><code>HttpRequest</code> is immutable, so an interceptor clones and passes the clone to <code>next</code>. Order is the array order: requests travel down the list and responses come back up it, which is why a logging interceptor listed first measures the whole chain.</p>`
},
{
  d:'Medium', topic:'Resources',
  q:`What does resource() give you, and what does params returning undefined mean?`,
  a:`<p>Asynchronous state as signals: <code>value()</code>, <code>status()</code>, <code>isLoading()</code>, <code>hasValue()</code>, <code>error()</code> and <code>reload()</code>. The request function is reactive, so reading a signal in it makes the resource reload when that signal changes, and abandon the in-flight load. All three flavours, <code>resource</code>, <code>httpResource</code> and <code>rxResource</code>, are stable since v22.</p><p><code>params</code> returning <code>undefined</code> means "not ready": the resource stays idle and the loader is never called. That is how you express a request that depends on something the user has not chosen yet, and it keeps "pick an item" distinguishable from "loading".</p>`,
  code:`readonly detail = resource({\n  params: () => {\n    const id = this.selectedId();\n    return id === null ? undefined : { id };      // idle until something is picked\n  },\n  loader: ({ params }) => this.api.load(params.id)\n});`,
  fq:`What is chain() for?`,
  fa:`<p>Dependent requests, added in v22. <code>chain(userResource)</code> returns that resource's value when it has one, and otherwise propagates its idle, loading or error state into this resource, so you do not unpick two sets of states by hand. There is also an <code>id</code> option that caches a resource across server rendering so it arrives resolved rather than flashing a spinner.</p>`
},
{
  d:'Medium', topic:'Forms',
  q:`Signal Forms, reactive forms, and template-driven forms: what would you use and why?`,
  a:`<p>Template-driven forms put the model in the template with <code>[(ngModel)]</code>, and are fine for one field with no validation. Reactive forms build a <code>FormGroup</code> in the class, which is explicit and testable but is a parallel structure you sync with your data through <code>patchValue</code> and <code>form.value</code>.</p><p>Signal Forms, stable in v22, start from a signal holding your data, so the model is the single source of truth and the types come from it. For new work I would use them; for an existing codebase, new forms in the new API and old ones left alone until I am touching them anyway.</p>`,
  code:`readonly credentials = signal({ email: '', password: '' });\n\nreadonly loginForm = form(this.credentials, f => {\n  required(f.email, { message: 'Email is required' });\n  email(f.email);\n  minLength(f.password, 8);\n});\n\n// <input [formField]="loginForm.email" />\n// @let e = loginForm.email();\n// @if (e.touched() && e.getError('required')) { ... }`,
  fq:`What makes the reactive forms types awkward?`,
  fa:`<p>Two things. Every control includes <code>null</code> unless you use <code>fb.nonNullable</code>, because <code>reset()</code> sets controls to null. And <code>form.get('email')</code> takes a string that is not checked against the group's shape, so it returns <code>AbstractControl | null</code> and every template read needs optional chaining.</p>`
},
{
  d:'Medium', topic:'Forms',
  q:`How do you validate one field against another?`,
  a:`<p>In Signal Forms, with <code>validate()</code> on the field, reading whatever else it needs from the model. Because the model is a plain signal, a cross-field rule is an ordinary expression rather than a group-level validator with hand-rolled typing.</p><p>Two details make it usable in practice: gate the message on <code>touched()</code> so a pristine form does not shout, and call <code>markAsTouched()</code> on the form on submit, which in v22 cascades to every descendant so a blind submit reveals all the problems at once.</p>`,
  code:`readonly signUpForm = form(this.model, f => {\n  minLength(f.password, 8);\n  validate(f.confirm, ({ value }) =>\n    value() === this.model().password ? null : { kind: 'mismatch' });\n  // a checkbox that must be ticked is its own rule: false is still "present"\n  validate(f.terms, ({ value }) => (value() ? null : { kind: 'mustAgree' }));\n});`,
  fq:`How does async validation fit in?`,
  fa:`<p><code>validateAsync()</code> or <code>validateHttp()</code>, both with a reactive request shape and a <code>pending()</code> state. Debounce the field or the request, gate the submit button on <code>pending()</code> as well as <code>invalid()</code>, and use v22's <code>reloadValidation()</code> when you need to re-run the checks.</p>`
},
{
  d:'Medium', topic:'Routing',
  q:`How do route parameters reach a component, and how do you guard a route?`,
  a:`<p>With <code>withComponentInputBinding()</code>, route params, query params and resolved data arrive as ordinary component inputs, so the component declares <code>id = input.required&lt;string&gt;()</code> rather than injecting <code>ActivatedRoute</code>. v22 added options to that: <code>queryParams</code> to include or exclude them, and <code>unmatchedInputBehavior</code>.</p><p>A guard is a plain function that can <code>inject()</code>. It returns <code>true</code>, <code>false</code>, or a <code>UrlTree</code> from <code>router.createUrlTree()</code> to redirect, which is what you almost always want, because a bare <code>false</code> cancels the navigation and leaves the user on the old page wondering what happened.</p>`,
  code:`export const authGuard: CanActivateFn = (route, state) => {\n  const session = inject(Session);\n  const router = inject(Router);\n  return session.isSignedIn() ? true : router.createUrlTree(['/sign-in']);\n};\n\nexport const routes: Routes = [\n  { path: 'users/:id', canActivate: [authGuard],\n    loadComponent: () => import('./user').then(m => m.User) }\n];`,
  fq:`When would you use canMatch instead of canActivate?`,
  fa:`<p>When the condition should affect whether the route matches at all, so two routes can share a path and differ by role or feature flag, and a change re-evaluates rather than only being checked on navigation. Note that in v22 its third parameter, <code>currentSnapshot</code>, is mandatory, with a migration.</p>`
},
{
  d:'Medium', topic:'Signals',
  q:`Why is immutability important, and what exactly goes wrong if you mutate?`,
  a:`<p>Angular compares by reference, both for signal equality and for <code>OnPush</code> input checks, because comparing deep object contents on every change would be far too slow. The deal is that you produce new objects and arrays instead of editing the old ones.</p><p>Break it and you get the most confusing failure mode available: no error, no warning, and a screen that does not update, because the reference is identical. It also breaks anything downstream that relies on identity, including which rows <code>@for</code> can skip re-rendering.</p>`,
  code:`// silent no-ops\nthis.user().name = 'Grace';\nthis.items().push(x);\nthis.rows().sort((a, b) => a.n - b.n);   // sort mutates\n\n// correct\nthis.user.update(u => ({ ...u, name: 'Grace' }));\nthis.items.update(list => [...list, x]);\nthis.rows.update(list => [...list].sort((a, b) => a.n - b.n));`,
  fq:`Spreading is shallow. When does that bite?`,
  fa:`<p>When you copy the top level and then mutate something nested, because the copy shares those references: <code>{ ...user }</code> followed by <code>next.prefs.theme = 'dark'</code> changes the original. Copy the whole path you are editing, flatten the state, or use Immer.</p>`
},
{
  d:'Medium', topic:'Signals',
  q:`What causes NG0600, and what are the common causes of an infinite loop?`,
  a:`<p><code>NG0600</code> is writing to a signal from inside a <code>computed</code> or an <code>effect</code> where it is not allowed. A computation must be pure because Angular may re-run it, skip it, or order it differently.</p><p>Loops usually come from one of three things: an effect that writes a signal it also reads, a derivation implemented as an effect that triggers itself, or a computed that reads something rebuilt on every read so it never compares equal. The fix is nearly always to delete the effect and use a <code>computed</code> or a <code>linkedSignal</code>.</p>`,
  code:`// loops: reads total, writes total\neffect(() => this.total.set(this.total() + 1));\n\n// loops: derivation as an effect, feeding its own dependency\neffect(() => this.filtered.set(this.items().filter(...)));\n\n// correct\nreadonly filtered = computed(() => this.items().filter(...));`,
  fq:`How would you find which dependency is unstable?`,
  fa:`<p>The signal graph in Angular DevTools, which draws the incoming edges of a computed and usually shows one you did not expect. Nine times out of ten it is an object or array literal rebuilt on every read, which never compares equal by <code>Object.is</code>.</p>`
},
{
  d:'Medium', topic:'Testing',
  q:`How do you test a component, and what changed with zoneless?`,
  a:`<p><code>TestBed.configureTestingModule</code> to substitute dependencies, <code>TestBed.createComponent</code> to render it, then interact and assert on the rendered output. Standalone components need no declarations array; their own <code>imports</code> are used.</p><p>The zoneless change is that you <code>await fixture.whenStable()</code> instead of calling <code>detectChanges()</code>, which is what the CLI has generated since v21. It waits for the application to be genuinely idle rather than poking a synchronous check, which is both more honest and less flaky. Vitest is the default runner since v21, and v22 added <code>TestBed.getLastFixture()</code>.</p>`,
  code:`TestBed.configureTestingModule({\n  providers: [{ provide: Limits, useValue: { max: 2 } }, provideHttpClientTesting()]\n});\nconst fixture = TestBed.createComponent(Counter);\nawait fixture.whenStable();\n\nfixture.nativeElement.querySelector('button').click();\nawait fixture.whenStable();\nexpect(fixture.nativeElement.textContent).toContain('1 of 2');`,
  fq:`What about fakeAsync tests?`,
  fa:`<p>They depend on a patched Zone.js, so they do not work in a zoneless Vitest setup. v22 lets you add <code>zone.js/plugins/vitest-patch</code> to the test polyfills as a migration aid, and <code>ng g refactor-jasmine-vitest --fake-async</code> converts most of them to fake timers, which is the destination.</p>`
},
{
  d:'Medium', topic:'Performance',
  q:`What should never appear in a template, and why?`,
  a:`<p>Method calls and getters that do real work. They run on every refresh of that view, so a <code>filter()</code> in an interpolation is an O(n) operation per change detection pass, and it will not be obvious in a profile until the list is long.</p><p>Use a <code>computed</code>, which runs once per actual change and is cached. The same applies to building objects or arrays inline in a binding: a fresh reference on every read defeats <code>OnPush</code> on the child and any downstream memoisation.</p>`,
  code:`<!-- runs on every pass -->\n@for (t of tasks.filter(t => !t.done); track t.id) { ... }\n<app-chart [options]="{ unit: 'ms' }" />\n\n<!-- runs once per change -->\n@for (t of open(); track t.id) { ... }\n<app-chart [options]="OPTIONS" />`,
  fq:`Is a pipe an acceptable alternative?`,
  fa:`<p>For formatting, yes: a pure pipe is cached against its input and runs once per distinct value, which is why <code>| date</code> is safe in a thousand table cells. For filtering or sorting, no, which is precisely why Angular ships neither.</p>`
},
{
  d:'Medium', topic:'Templates',
  q:`What does @let add, and where is it worth using?`,
  a:`<p>A read-only local variable inside a template, re-evaluated when its dependencies change. It exists because the alternatives were worse: repeating a long expression three times, or inventing a class field for something that only matters in one corner of the markup.</p><p>The place it earns its keep most in modern code is reading a signal-based form field or a resource once and then using its state several times, instead of calling it four times in the same block.</p>`,
  code:`@let f = loginForm.email();\n@if (f.touched() && f.invalid()) {\n  @if (f.getError('required')) { <p>Email is required</p> }\n  @if (f.getError('email')) { <p>That is not an email</p> }\n}\n\n@let total = subtotal() + shipping();\n<p>{{ total }} ({{ total > 50 ? 'free delivery' : 'plus delivery' }})</p>`,
  fq:`How does it differ from @if with an alias?`,
  fa:`<p><code>@if (x(); as y)</code> both narrows the type and only exists inside the block, which is what you want when the value can be null. <code>@let</code> is unconditional and available for the rest of the template, so it is for naming rather than for guarding.</p>`
},
{
  d:'Medium', topic:'Components',
  q:`How would you build a compound component such as a tab strip in Angular?`,
  a:`<p>The container provides state through a context, and the parts read it. In Angular that means the outer component holds the signals and the parts either inject the outer component through DI or are queried with <code>contentChildren</code>.</p><p>Which of the two depends on who owns the coordination. Injecting the parent is tighter and fails clearly if the part is used outside its container; a content query lets the container drive the parts, which suits a widget where the container owns keyboard behaviour and decides which part is active.</p>`,
  code:`@Component({ selector: 'app-strip', template: \`<ng-content />\` })\nexport class Strip {\n  private readonly tabs = contentChildren(Tab);\n  readonly index = signal(0);\n\n  constructor() {\n    effect(() => {\n      const i = this.index();\n      this.tabs().forEach((t, n) => t.active.set(n === i));\n    });\n  }\n}\n\n@Component({ selector: 'app-tab', template: \`@if (active()) { <ng-content /> }\` })\nexport class Tab {\n  readonly label = input.required<string>();\n  readonly active = signal(false);\n}`,
  fq:`What would you take from a library instead of writing this?`,
  fa:`<p>The keyboard and ARIA contract. <code>@angular/aria</code>, generally available since v22, ships Tabs, Menu, ComboBox, Tree and others as headless directives built by the Material team, so you write the markup and styling and the arrow keys, roving tabindex, and ARIA attributes are maintained for you.</p>`
}
);
INTERVIEW.push(
{
  d:'Hard', topic:'Change detection',
  q:`Walk me through Angular's change detection in detail.`,
  a:`<p>Angular keeps a tree of views. Something marks a view dirty; the mark propagates up to the root so the traversal can reach it; then a pass walks down, refreshing views that are dirty or whose inputs changed and skipping the rest, and commits the DOM changes.</p><p>Zoneless removed the trigger rather than the traversal. Without Zone.js nothing schedules a pass on a whim: a signal write, a template event, an input change or a <code>markForCheck</code> notifies the scheduler, which coalesces notifications so ten writes in one tick produce one pass. With <code>OnPush</code> the default since v22, the cost of a change is proportional to what changed rather than to the size of the tree.</p>`,
  fq:`Ancestors are traversed but not refreshed. What does that mean in practice?`,
  fa:`<p>That a parent's bindings do not re-evaluate just because a child became dirty. The pass has to walk through the parent to reach the child, but it only refreshes views that were themselves marked or whose inputs changed. That is why a deep component updating does not cost you the whole path above it.</p>`
},
{
  d:'Hard', topic:'Change detection',
  q:`What did Zone.js do, why was it removed, and what breaks when you turn it off?`,
  a:`<p>It monkey-patched the browser: <code>setTimeout</code>, <code>addEventListener</code>, <code>Promise</code>, <code>XMLHttpRequest</code> and dozens more. Every patched callback told Angular that something might have changed, and Angular checked the entire application. That is why mutating any field from any callback used to update the screen.</p><p>It was removed because the costs accumulated: a large polyfill, patched APIs that confused debuggers and other libraries, change detection running far more often than necessary, and tests depending on a global notion of "settled". Signals made it unnecessary by naming the dependencies precisely.</p><p>What breaks is exactly one thing: a plain field mutated from an async callback no longer updates the view. The fix is a signal.</p>`,
  code:`// worked under Zone.js, does nothing zoneless\nconstructor() { setInterval(() => this.seconds++, 1000); }\n\n// zoneless\nreadonly seconds = signal(0);\nconstructor() {\n  const id = setInterval(() => this.seconds.update(n => n + 1), 1000);\n  inject(DestroyRef).onDestroy(() => clearInterval(id));\n}`,
  fq:`How do you integrate a third-party library that reports through callbacks?`,
  fa:`<p>Write the callback into a signal at the boundary, and everything downstream is ordinary reactive code. That one line replaces what Zone.js was doing by checking the whole application on every callback, and it is also where <code>markForCheck()</code> is genuinely justified if the value cannot be a signal.</p>`
},
{
  d:'Hard', topic:'Signals',
  q:`How does the signal graph behave: laziness, caching, and diamond dependencies?`,
  a:`<p>Dependencies are recorded by reading, per execution, so a computed that returns early does not depend on the signals it did not reach. A computed does not run until something reads it, and it returns the cached value when nothing it read has changed.</p><p>The graph is a directed graph rather than a tree, so a value shared by three computeds is calculated once per change, not three times, and consumers never observe an inconsistent intermediate state. That means a diamond, two computeds depending on one signal and a third depending on both, recomputes each node once.</p>`,
  code:`readonly a = signal(1);\nreadonly b = computed(() => this.a() * 2);\nreadonly c = computed(() => this.a() + 1);\nreadonly d = computed(() => this.b() + this.c());   // a computed once, not twice\n\n// laziness: this never runs while the @if is false\nreadonly expensive = computed(() => heavy(this.a()));`,
  fq:`What is untracked() for, and when is it a smell?`,
  fa:`<p>Reading a signal without depending on it, which is occasionally what you want inside a computation or an effect that should not re-run for that value. If you need it often, the dependencies are probably wrong: for the specific case of an effect reading something it should not react to, restructure rather than reaching for <code>untracked</code> everywhere.</p>`
},
{
  d:'Hard', topic:'Performance',
  q:`Design the loading strategy for a product page using @defer. Which trigger goes with which prefetch?`,
  a:`<p>Nothing above the fold is deferred: the gallery and the buy box are the reason the page exists, and deferring them means the user waits on a request to see what they asked for.</p><p>Below the fold, <code>on viewport</code> with <code>prefetch on idle</code>, because everyone eventually scrolls there so you may as well download while the browser is free. For something optional, <code>on interaction</code> with <code>prefetch on hover</code>, since a hover is a strong hint the click is coming. For something heavy and rarely used, an AR viewer or a spreadsheet export, <code>on interaction</code> with no prefetch, because guessing wrong costs real bandwidth for most users.</p>`,
  code:`@defer (on viewport; prefetch on idle) { <app-specs [sku]="sku()" /> }\n@placeholder { <div class="skeleton"></div> }\n\n@defer (on interaction; prefetch on hover) { <app-size-guide /> }\n@placeholder { <button>Size guide</button> }\n\n@defer (on interaction) { <app-ar-viewer /> }\n@placeholder { <button>View in your room</button> }\n@loading (after 100ms) { <p>Loading the viewer…</p> }\n@error { <p>The viewer is unavailable.</p> }`,
  fq:`What are the failure modes of @defer people hit?`,
  fa:`<p>A heavy placeholder, which ships in the main bundle and defeats the point. Using it as a conditional, when it loads once and stays. And deferring a component that is also used eagerly elsewhere, where the split saves nothing because the compiler can only move code used exclusively inside the block. v21 added compiler diagnostics for unreachable and duplicated triggers.</p>`
},
{
  d:'Hard', topic:'Performance',
  q:`When do you reach for a lazy route, @defer, or injectAsync?`,
  a:`<p>They split at three different levels, and the choice follows what the thing is. A lazy route is the biggest single win and the easiest boundary, so every route should be lazy, including the first. <code>@defer</code> splits a region of a template, for content that is below the fold or behind an interaction.</p><p><code>injectAsync</code>, new in v22, splits a service, which is the gap the other two leave: a PDF generator or a spreadsheet parser is a dependency of a button, not of a route or a template block. It lazy-loads through a dynamic import while still creating the instance with dependency injection, and can prefetch on idle.</p>`,
  code:`// route\n{ path: 'reports', loadComponent: () => import('./reports').then(m => m.Reports) }\n\n// template region\n@defer (on interaction; prefetch on idle) { <app-chart /> }\n\n// service, v22\nprivate readonly exporter = injectAsync(\n  () => import('./xlsx-exporter').then(m => m.XlsxExporter),\n  { prefetch: onIdle }\n);\nasync export() { (await this.exporter()).write(this.rows()); }`,
  fq:`What does the v22 chunk optimisation change about all this?`,
  fa:`<p>It merges very small lazy chunks and is enabled by default in production since v22, so fine-grained splitting no longer produces fifty requests with poor compression. That removes one of the reasons to be conservative about splitting, though deferring something on the critical path is still a mistake.</p>`
},
{
  d:'Hard', topic:'SSR',
  q:`What is hydration, what causes a mismatch, and what does incremental hydration change?`,
  a:`<p>Hydration is the client adopting server-rendered DOM: attaching listeners and taking ownership rather than rebuilding it, so you do not pay for the HTML twice. It requires the first client render to match the server's output exactly.</p><p>Mismatches come from values that differ between machines, dates, locales, time zones, <code>Math.random</code>, reading <code>window</code> or <code>localStorage</code> during construction, and from invalid HTML nesting that the browser silently repairs, so the DOM no longer matches what Angular rendered.</p><p>Incremental hydration, the default since v22, hydrates regions when they are needed rather than all at once, driven by <code>@defer (hydrate on ...)</code> triggers. The HTML is there from the server and the JavaScript activates on viewport or interaction, so a footer nobody scrolls to never runs.</p>`,
  code:`function safe() {\n  const value = signal<string | null>(null);\n  // never runs on the server, so the first render matches\n  afterNextRender(() => value.set(new Date().toLocaleTimeString()));\n  return value;\n}\n\n@defer (hydrate on viewport) { <app-comments /> }`,
  fq:`How do you debug a mismatch?`,
  fa:`<p>Read the warning, which names the element and both texts, then check the three categories in order: machine-dependent values, browser-only APIs read during construction, and invalid nesting. The generic fix for the first two is to render a server-safe value and upgrade in <code>afterNextRender</code>. Reaching for <code>ngSkipHydration</code> on a subtree hides it rather than fixing it.</p>`
},
{
  d:'Hard', topic:'SSR',
  q:`What is the transfer cache, and what changed in v22?`,
  a:`<p>HTTP responses fetched during server rendering are serialised into the page, so the client does not repeat the same requests immediately after hydrating. Without it, server rendering makes the first screen fast and then fires every request again.</p><p>v22 changed the default to skip cookie-bearing and <code>withCredentials</code> requests. That matters because a per-user response embedded in the HTML can be cached by a CDN and served to somebody else, which is a data leak rather than a performance issue. If you had custom transfer cache options, that is the one to review on upgrade.</p>`,
  code:`provideClientHydration(\n  withHttpTransferCacheOptions({ includePostRequests: false })\n);\n\n// v22: resources can be cached across the boundary too\nreadonly user = resource({ id: 'user', params: ..., loader: ... });`,
  fq:`How do you avoid a spinner on a server-rendered screen?`,
  fa:`<p>Give the resource an <code>id</code>, which is new in v22: the resolved value is cached across server rendering and hydration, so the client renders the data immediately rather than going through a loading state for data the server already had.</p>`
},
{
  d:'Hard', topic:'Security',
  q:`How do XSS vulnerabilities enter an Angular application?`,
  a:`<p>Not through ordinary templates. Interpolation is escaped, and binding to <code>[innerHTML]</code> is sanitised, so scripts and event handlers are stripped. Practically every real Angular XSS is somewhere a developer opted out.</p><p>The ways out are: <code>DomSanitizer.bypassSecurityTrust*</code> on content you did not produce, an unchecked URL in an <code>href</code> or <code>src</code> where a <code>javascript:</code> or <code>data:</code> URL executes, an iframe <code>src</code> where <code>RESOURCE_URL</code> cannot be sanitised at all, and injecting into the HTML shell around your application on the server.</p><p>v22 tightened sanitisation for dynamic <code>href</code> and <code>xlink:href</code> on SVG anchors, meta selectors and placeholder values, and the server package now rejects suspicious and protocol-relative URLs to guard against SSRF.</p>`,
  code:`// safe: escaped\n<p>{{ userInput }}</p>\n\n// sanitised: markup kept, scripts and onerror stripped\n<div [innerHTML]="fromCms"></div>\n\n// a URL is code until you allow-list the scheme\nreadonly href = computed(() =>\n  /^https?:\\/\\//i.test(this.url()) ? this.url() : null);`,
  fq:`Where do teams leak secrets, separately from XSS?`,
  fa:`<p>Client-side configuration. Anything the browser can read is public, so a key in an environment file or a <code>--define</code> value is in the bundle and visible in the network tab whatever it is called. Secrets live behind a server, and every permission the UI implies has to be re-checked there. Session tokens belong in httpOnly cookies, which an XSS cannot read.</p>`
},
{
  d:'Hard', topic:'Architecture',
  q:`Design the state and component architecture for a data-heavy dashboard with filters, charts, and live updates.`,
  a:`<p>I would split the state four ways and give each a different owner. Filters, paging and the selected view go in the URL, so the dashboard is shareable, survives a refresh, and the back button works. Server data goes in <code>httpResource</code> keyed on that URL state, so it reloads and abandons in-flight requests automatically and owns its own loading and error states. Genuinely shared client state, the session or a pinned metric, goes in a service with a read-only surface. Ephemeral UI state, an expanded row, stays local.</p><p>Structurally: a shell that stays mounted, one component per widget with its own error boundary, heavy chart libraries behind <code>@defer</code>. Live updates arrive on one socket at the top and are written into the resource rather than into component state, so every reader updates once and consistently.</p>`,
  fq:`Ten widgets on one socket, with a burst of messages. How do you stop thirty renders a second?`,
  fa:`<p>Batch at the boundary: accumulate messages in a ref and flush on an interval or with <code>requestAnimationFrame</code>, then write once. Signals then mark only the views that read the changed slice, so widgets reading other metrics are untouched. If a chart still cannot keep up, sample the data for display rather than rendering every point.</p>`
},
{
  d:'Hard', topic:'Architecture',
  q:`You are building a design system with its own visual language. What do you take from Angular's packages and what do you write?`,
  a:`<p>The dividing line is whether the difficulty is visual or behavioural. Buttons, chips, cards, inputs: write them, because a native element plus CSS is the whole job and you want exactly your design.</p><p>Take the behaviour. <code>@angular/aria</code>, generally available since v22, for menus, tabs, comboboxes, listboxes and trees, because those ARIA contracts are long, have many keyboard cases, and change over time. The CDK for overlays, focus traps, virtual scrolling and drag and drop. And never write a date picker: locales, time zones, keyboard and screen reader support make it a permanent maintenance job.</p><p>Angular Material is the fastest route to a working application and the slowest route to a distinctive one, since you adopt a design language with the behaviour.</p>`,
  fq:`How do you stop a shared component library becoming a fork of the product code?`,
  fa:`<p>Keep domain knowledge out of it: no data fetching, no domain vocabulary, no copy. A chip that knows what an invoice is has been put in the wrong library. Enforce that with a boundary, either a real library with a <code>public-api.ts</code> or lint-enforced tags in a monorepo, because a convention nobody enforces lasts about a month.</p>`
},
{
  d:'Hard', topic:'Forms',
  q:`How do you write a custom form control, and what changed with FormValueControl?`,
  a:`<p>The old interface was <code>ControlValueAccessor</code>: four methods and a provider registration. The new one, <code>FormValueControl</code>, is a signals interface: a <code>value</code> model, plus optionally <code>touched</code>, <code>disabled</code>, <code>errors</code> and a <code>reset</code> method.</p><p>Two v22 details matter. Custom controls now get a <code>touched</code> input and a <code>touch()</code> output rather than a two-way <code>touched</code> model, because the old shape let a control mark a field as no longer touched; that needs a manual change in existing code. And <code>FormValueControl</code> was made compatible with legacy reactive and template-driven forms, so a component can be migrated without touching its callers.</p>`,
  code:`@Component({ selector: 'app-rating', template: \`...\` })\nexport class Rating {                  // implements FormValueControl<number>\n  readonly value = model(0);\n  readonly touched = input(false);\n  readonly touch = output<void>();\n\n  pick(star: number) {\n    this.value.set(star);\n    this.touch.emit();\n  }\n}\n\n// works in all three form APIs:\n// <app-rating [formField]="reviewForm.score" />\n// <app-rating formControlName="score" />\n// <app-rating [(ngModel)]="score" />`,
  fq:`Is there any reason left to write a ControlValueAccessor?`,
  fa:`<p>Not for new code. Since v22 <code>FormValueControl</code> works with the legacy APIs, so the compatibility argument is gone, and v22 also made validation errors registered by old <code>NG_VALIDATORS</code> controls visible to signal forms, which was the last gap during a migration.</p>`
},
{
  d:'Hard', topic:'Forms',
  q:`Design async validation for a "username is taken" check.`,
  a:`<p>Four requirements: do not check on every keystroke, do not let a stale answer win, expose a pending state, and decide what a failed request means. Signal Forms give you the first three: <code>debounce</code> on the field or a <code>debounce</code> option on <code>validateHttp</code>, a reactive request that abandons the in-flight check when the value changes, and <code>pending()</code> on the field and the form.</p><p>The fourth is a product decision. A network error is not the same as "this username is taken", and silently blocking the user because your server was down is worse than letting them submit and failing server-side. I would surface it as a distinct state rather than an invalid value.</p>`,
  code:`readonly signUpForm = form(this.model, f => {\n  required(f.email);\n  email(f.email);\n  validateHttp(f.email, {\n    request: email => \`/api/users/check?email=\${email.value()}\`,\n    debounce: 400,\n    errors: taken => (taken ? { kind: 'taken' } : null)\n  });\n});\n\n// gate on pending too, not just invalid\n// <button [disabled]="signUpForm().invalid() || signUpForm().pending()">`,
  fq:`Why is gating on pending() as well as invalid() important?`,
  fa:`<p>Because <code>invalid()</code> is false while the check is still in flight, so a fast user submits a form that is about to fail. It is the async-validation equivalent of a race condition, and it is why the API exposes a pending state at all. v22 also added <code>reloadValidation()</code> for re-running the checks, which is the replacement for <code>updateValueAndValidity()</code>.</p>`
},
{
  d:'Hard', topic:'Components',
  q:`NgComponentOutlet versus createComponent: when do you need dynamic components at all?`,
  a:`<p>Usually you do not: a <code>@switch</code> over three widget types is clearer, fully type-checked, and needs no loose record of inputs. Go dynamic when the set is open, comes from configuration, or is chosen by the caller of a service.</p><p><code>NgComponentOutlet</code> is the declarative option: it takes the component class and a record of inputs, and keeps them in step. <code>createComponent</code> is for when there is no template to put an outlet in, which is what makes a generic dialog or toast service possible: the service holds no markup and callers pass the component they want shown.</p>`,
  code:`// declarative\n<ng-container [ngComponentOutlet]="w.type" [ngComponentOutletInputs]="w.inputs" />\n\n// imperative, in a service with no template\nconst ref = createComponent(type, {\n  environmentInjector: this.injector,\n  hostElement: panel\n});\nObject.entries(inputs).forEach(([k, v]) => ref.setInput(k, v));\nthis.appRef.attachView(ref.hostView);      // without this it never updates\n// later: ref.destroy()`,
  fq:`What do people get wrong with createComponent?`,
  fa:`<p>Three things: forgetting <code>attachView</code>, so the component renders once and never updates; forgetting <code>destroy</code>, so it lives until the page unloads; and expecting tree-shaking, when referencing the class in configuration puts it in the bundle. If avoiding the download was the point, combine it with a dynamic import.</p>`
},
{
  d:'Hard', topic:'Migration',
  q:`Plan the upgrade of a v19 application to v22.`,
  a:`<p>Three releases, not one. v19 to v20 with <code>ng update</code>, then ship. v20 to v21, where the migration adds <code>provideZoneChangeDetection()</code> so nothing breaks yet, and the real work is removing it, component tree by component tree, which means every async field mutation becomes a signal. Then Vitest, using the Karma and Jasmine migrations. Ship again. Then v21 to v22, which needs TypeScript 6 and Node 22 or later, and whose migration writes <code>ChangeDetectionStrategy.Eager</code> into every component without a strategy; removing those is the second half of the same job.</p><p>Two things to audit by hand. <code>paramsInheritanceStrategy</code> now defaults to <code>always</code> with no migration, so check every child route reading a parent param. And adopting resources and Signal Forms is a rewrite, not part of the upgrade: do not mix it in.</p>`,
  fq:`Why not go from v19 to v22 in one command?`,
  fa:`<p>The schematics are written to move between adjacent majors, so three sets of migrations would simply never run, and you inherit their work by hand with no tooling and no guidance. Shipping between majors also preserves your ability to bisect when something subtle breaks.</p>`
},
{
  d:'Hard', topic:'Architecture',
  q:`When does a service with signals stop being enough, and what would you reach for?`,
  a:`<p>A service with private writable signals, a read-only surface through <code>asReadonly()</code>, derived computeds, and named operations covers a great deal. Normalise entities by id rather than nesting them, and it scales further than people expect.</p><p>I would reach for a store when I can name the symptom: many entity types with overlapping slices read across features, a large surface of updates that need tracing, or a team that wants one enforced convention. <code>@ngrx/signals</code> and its SignalStore are the current shape, with <code>withEntities</code> and devtools, built on the same primitives.</p><p>What a store does not fix is server data. Pair it with the resource APIs rather than caching HTTP responses in it by hand.</p>`,
  code:`@Service()\nexport class Tasks {\n  private readonly byId = signal<Record<number, Task>>({});   // normalised\n  private readonly activeListId = signal(1);\n\n  readonly visible = computed(() =>\n    Object.values(this.byId()).filter(t => t.listId === this.activeListId()));\n  readonly remaining = computed(() => this.visible().filter(t => !t.done).length);\n\n  toggle(id: number) {\n    this.byId.update(m => ({ ...m, [id]: { ...m[id], done: !m[id].done } }));\n  }\n}`,
  fq:`What is the argument against adopting a store early?`,
  fa:`<p>You acquire a dependency and a set of conventions before you have the problem they solve, and a single global store that every component reads becomes impossible to reason about or delete from. Scope state to the feature that owns it and let the pain name the tool.</p>`
},
{
  d:'Hard', topic:'Architecture',
  q:`How would you enforce architectural boundaries in a large workspace?`,
  a:`<p>Turn the rule into a compile error. Inside one application nothing stops the checkout feature importing an admin service, and once that has happened a hundred times the features cannot be reasoned about or deleted separately.</p><p>A library boundary does that: <code>ng generate library</code> gives you a <code>public-api.ts</code>, which means anything not exported there can be refactored without touching a consumer. In a monorepo, Nx adds tagged module-boundary lint rules and affected-only builds, which is what makes the layering a fact rather than a diagram.</p><p>The layering I would use: applications may import anything; features may import domain, ui and util but never another feature; domain may import util; ui may import util only. Features are leaves nothing imports, which is the property that makes them deletable in one commit.</p>`,
  fq:`What is the cost, and when should you not split?`,
  fa:`<p>More configuration, more build steps, and a strong tendency to over-split. A library with one consumer is a folder with extra steps, so the rule of two applies: split when a second consumer appears or when you specifically need to enforce a boundary. Splitting by technical type, <code>libs/components</code> and <code>libs/services</code>, recreates the group-by-kind problem at a larger scale.</p>`
},
{
  d:'Hard', topic:'Performance',
  q:`An Angular application is slow. Walk me through your diagnosis.`,
  a:`<p>First I establish what slow means, because the fixes are unrelated: slow to load, slow to respond to an interaction, or janky while typing or scrolling. A Lighthouse run and a performance trace of the real journey answer that.</p><p>If it is load: the bundle report, then route-level splitting, <code>@defer</code> below the fold, and whether the first screen is waiting on a request that could come from the server. If it is interaction: the Angular DevTools profiler on a production build, reading the shape. One long pass means a single expensive component, usually a method call in a template that should be a computed. Many short passes means too much marking, so look at where the state lives. If a panel updates late, the signal graph shows whether it actually reads what changed.</p><p>Then fix one thing and measure again, because the second bottleneck is never the one you predicted.</p>`,
  fq:`Two panels disagree about the same data. Which tool?`,
  fa:`<p>The injector graph. It is almost always a duplicate provider: a stray <code>providers: [X]</code> on a component means one instance per component instance, so half the application sees different state. The graph shows where the token resolved from in seconds, where reading code can take an hour.</p>`
},
{
  d:'Hard', topic:'Performance',
  q:`What causes memory leaks in Angular, and how do you find them?`,
  a:`<p>Almost always a subscription that outlives its component: an event listener, an interval, an observer, a socket, or an RxJS subscription with no teardown. Each mount adds another, and each one keeps the component's closure and therefore its state alive. Others: an entry in a module-level cache or store that is never evicted, and a <code>ComponentRef</code> from <code>createComponent</code> that is never destroyed.</p><p>To find them, repeat the mount and unmount cycle, take heap snapshots between cycles, and compare retained size, looking for growing counts of your own component or listener objects and following the retainer path.</p>`,
  code:`// leaks\nconstructor() {\n  window.addEventListener('resize', this.onResize);\n  this.api.poll().subscribe(v => this.value.set(v));\n}\n\n// correct\nconstructor() {\n  const onResize = () => this.measure();\n  window.addEventListener('resize', onResize);\n  inject(DestroyRef).onDestroy(() => window.removeEventListener('resize', onResize));\n\n  this.api.poll().pipe(takeUntilDestroyed()).subscribe(v => this.value.set(v));\n}`,
  fq:`Which of these does moving to signals eliminate?`,
  fa:`<p>Most of the subscription class, because there is nothing to unsubscribe from: <code>toSignal</code> cleans itself up with its injection context, and a signal read in a template creates no long-lived handle. What remains is genuinely external, so timers, listeners and third-party widgets still need <code>DestroyRef</code>.</p>`
},
{
  d:'Hard', topic:'i18n',
  q:`Build-time or runtime internationalisation, and what do people get wrong?`,
  a:`<p>Angular's built-in i18n marks text with an <code>i18n</code> attribute, extracts it with <code>ng extract-i18n</code>, and compiles the translations into the template, producing one bundle per locale. Nothing is looked up at run time, so there is no flash of untranslated text and no translation bundle to download. That is the right default for a public site where each locale can be served from its own URL.</p><p>Its cost is the build and the deployment routing, and switching language means a page load. A runtime library such as Transloco loads JSON instead, which suits an internal tool where users flip between languages.</p><p>What people get wrong is treating it as a text problem. Concatenating translated fragments cannot work, because word order and plural categories differ; that is what ICU messages are for. Dates, numbers and currencies need the pipes or <code>Intl</code> rather than <code>toFixed</code> and a hand-written format. And right-to-left is layout, so logical CSS properties from the start rather than a retrofit.</p>`,
  code:`<p i18n="invoices status|Summary on the invoices screen">\n  {count, plural,\n    =0 {You have no unpaid invoices.}\n    =1 {You have one unpaid invoice, from {{ oldest | date: 'longDate' }}.}\n    other {You have {{ count }} unpaid invoices.}}\n</p>`,
  fq:`Give an example of a localisation bug that passes review.`,
  fa:`<p><code>date.toDateString()</code>. It produces "Thu Apr 02 2026" in every locale on earth, so it looks correct to an English-speaking reviewer and is wrong for most of the world. Anything user-facing goes through the date pipe, which reads <code>LOCALE_ID</code>.</p>`
},
{
  d:'Hard', topic:'Migration',
  q:`What happens to each key of an NgModule when you go standalone?`,
  a:`<p><code>declarations</code> disappears, because being imported is the declaration. <code>exports</code> becomes an ordinary TypeScript export. <code>imports</code> moves to the components that actually use each dependency, and <code>CommonModule</code> mostly disappears since control flow is built in and pipes are imported individually.</p><p><code>providers</code> is the interesting one: it has no single home. An application-wide service becomes <code>@Service()</code>; something that should live as long as a feature becomes route-level <code>providers</code>, which is a lifetime the module never actually gave you. And <code>loadChildren</code> survives, pointing at an exported routes array rather than a module, so the lazy boundary is unchanged.</p>`,
  code:`// before\n@NgModule({ declarations: [...], imports: [...], exports: [...], providers: [InvoicesApi] })\nexport class InvoicesModule {}\nexport const appRoutes: Routes = [\n  { path: 'invoices', loadChildren: () => import('./invoices.module').then(m => m.InvoicesModule) }\n];\n\n// after\nexport const invoicesRoutes: Routes = [{ path: '', component: InvoiceList }];\nexport const appRoutes2: Routes = [\n  { path: 'invoices', loadChildren: () => import('./invoices.routes').then(m => m.invoicesRoutes) }\n];`,
  fq:`What if a library only ships an NgModule of providers?`,
  fa:`<p><code>importProvidersFrom(SomeModule)</code> in the bootstrap providers is the bridge. Prefer a <code>provideX()</code> function when the library offers one, since it is tree-shakable and composable, and a library that still only offers a module is worth noting as an upgrade risk.</p>`
},
{
  d:'Hard', topic:'Versions',
  q:`How does Angular's release cadence work, and what is the cost of falling behind?`,
  a:`<p>From v22 it is a yearly major, every June, supported for two years, up from six months and eighteen. Minors ship every couple of months with features and no breaking changes. The deal Angular offers is frequent, small, automated breaking changes rather than rare, large, manual ones, and <code>ng update</code> runs schematics that rewrite your code.</p><p>It only works if you stay on it, because the migrations move between adjacent versions. Every skipped major is a set of schematics that never ran, so the work becomes yours to do by hand, all at once, without the tooling. And security fixes land only in supported majors: the three CVEs disclosed in late 2025, covering SSR data leakage, XSRF token exposure and stored XSS, were patched in v19, v20 and v21 and nothing older.</p>`,
  fq:`What usually blocks an upgrade in practice?`,
  fa:`<p>A third-party library. Material and the CDK track Angular's majors exactly and move with <code>ng update</code>; everything else is a risk you took. That is worth knowing when you choose a dependency, and it is why I would check a library's release history against Angular's before adopting it.</p>`
},
{
  d:'Hard', topic:'Change detection',
  q:`OnPush became the default in v22. What breaks, and how would you migrate a large codebase to it deliberately?`,
  a:`<p>What breaks is anything that relied on being checked without being marked: a field mutated in place rather than replaced, a value changed from an async callback, or a third-party widget writing to component fields. Under <code>Eager</code> those were caught by the next pass; under <code>OnPush</code> they are silent.</p><p>The migration wrote <code>ChangeDetectionStrategy.Eager</code> into every component without a strategy, so upgrading changed nothing. I would then remove those annotations feature by feature, in the same order as the zoneless work, because they are the same job: get the state into signals and the marking becomes correct by construction. Where a value genuinely cannot be a signal, usually a third-party integration, <code>markForCheck()</code> at that boundary is the honest fix.</p>`,
  fq:`How do you find the components that will break before shipping?`,
  fa:`<p>Turn <code>Eager</code> off for one feature at a time and exercise it, ideally with tests that assert on rendered output rather than on state, since those are the ones that fail. The CLI's <code>onpush_zoneless_migration</code> tool, added in v21, also analyses the codebase and points at the Zone.js dependencies and the components that rely on them.</p>`
},
{
  d:'Hard', topic:'Testing',
  q:`What does zoneless change about testing, and how do you handle time-dependent tests?`,
  a:`<p>The main change is that <code>await fixture.whenStable()</code> replaces <code>fixture.detectChanges()</code>. It waits for the application to be genuinely idle rather than poking a synchronous check, which is both more honest and less flaky, and it is what the CLI has generated since v21.</p><p>The casualty is <code>fakeAsync</code>, which depends on a patched Zone.js. v22 added <code>zone.js/plugins/vitest-patch</code> as a migration aid so those tests keep working under Vitest, and the destination is Vitest's fake timers, which <code>ng g refactor-jasmine-vitest --fake-async</code> converts for you.</p>`,
  code:`const fixture = TestBed.createComponent(Counter);\nawait fixture.whenStable();\n\nfixture.nativeElement.querySelector('button').click();\nawait fixture.whenStable();\nexpect(fixture.nativeElement.textContent).toContain('1 of 2');\n\n// time-dependent, without Zone.js\nvi.useFakeTimers();\nawait vi.advanceTimersByTimeAsync(500);\nawait fixture.whenStable();`,
  fq:`What makes a component test worth having?`,
  fa:`<p>That it asserts on rendered output, queried by role and label, with dependencies substituted through DI and the network mocked at the boundary only. A test that asserts on signals or mocks a child component couples itself to the implementation, so it survives a real regression and fails on a harmless refactor, which is the opposite of what you wanted.</p>`
},
{
  d:'Hard', topic:'Migration',
  q:`How would you introduce signals into a large RxJS-based Angular codebase?`,
  a:`<p>At the boundaries first, then inward. Every component that subscribes by hand becomes <code>toSignal</code>, which deletes the subscription, the lifetime management and the <code>markForCheck</code> in one change and cannot regress. That is a mechanical, low-risk win across hundreds of files.</p><p>Then the state: <code>BehaviorSubject</code> services become private writable signals with an <code>asReadonly()</code> surface and computed derivations. That is the highest-value change, and it is a design decision per service rather than a transformation. Then data fetching, screen by screen, to <code>httpResource</code>.</p><p>What I would leave alone is a tested pipeline using <code>switchMap</code>, <code>debounceTime</code> or <code>retry</code> well. Those are about time, which is what RxJS is for; bridge them with <code>toSignal</code> at the component and spend the effort where state is being kept in streams.</p>`,
  code:`// step 1, mechanical\nreadonly user = toSignal(this.session.user$, { initialValue: null });\n\n// step 2, a decision per service\nprivate readonly current = signal<User | null>(null);\nreadonly user = this.current.asReadonly();\nreadonly isSignedIn = computed(() => this.current() !== null);\n\n// step 3, screen by screen\nreadonly invoices = httpResource<Invoice[]>(() => \`/api/invoices?status=\${this.status()}\`);`,
  fq:`How do you keep a half-migrated codebase from being worse than either end state?`,
  fa:`<p>Make the boundary explicit rather than letting the styles interleave: a written rule that new code is signals, a lint rule where possible, and a list of what remains with a reason each. Mixed is fine if it is deliberate and shrinking; the failure mode is a codebase where nobody can tell which convention applies to the file they just opened.</p>`
},
{
  d:'Hard', topic:'Resources',
  q:`What does a resource give you that a hand-rolled fetch does not?`,
  a:`<p>Four states written correctly once, and the race condition solved by construction. Every hand-rolled version gets one of them slightly wrong: the previous error is not cleared when a new request starts, the empty state flashes before each load, or two responses arrive out of order and the older one wins with no error anywhere.</p><p>Because the request function is reactive, changing a signal it reads reloads the resource and abandons the in-flight load. On top of that, v22 added <code>chain()</code> so a dependent request inherits the parent's idle, loading and error states, and an <code>id</code> option so a server-rendered resource arrives resolved rather than flashing a spinner.</p>`,
  code:`readonly user = resource({\n  params: () => ({ id: this.id() }),         // reactive: reload and abandon\n  loader: ({ params, abortSignal }) => this.api.load(params.id, abortSignal)\n});\n\n// @switch (user.status()) { @case ('loading') ... @case ('error') ... }`,
  fq:`Is there anything a resource should not be used for?`,
  fa:`<p>Mutations. A resource is for reading, and its loader fires whenever a signal it reads changes, which is exactly wrong for a POST. Put the mutation in a method that calls the API and then calls <code>reload()</code> on the resource, and keep the optimistic update by writing to <code>value()</code>, which is writable for that purpose.</p>`
}
);

</script>

<script>
/* ============================================================
   APP ENGINE
   Deliberately plain DOM. Only the playgrounds use Angular, so the
   course still reads if the CDN is unreachable or the JIT path fails.
   ============================================================ */
(function () {
  'use strict';

  var TOTAL = 52;
  var PG_SRC = Object.create(null);
  var pgSeq = 0;

  var store = (function () {
    var mem = {};
    var ok = false;
    try { window.localStorage.setItem('__t', '1'); window.localStorage.removeItem('__t'); ok = true; } catch (e) { ok = false; }
    return {
      get: function (k) { try { return ok ? window.localStorage.getItem(k) : mem[k] || null; } catch (e) { return mem[k] || null; } },
      set: function (k, v) { try { if (ok) window.localStorage.setItem(k, v); else mem[k] = v; } catch (e) { mem[k] = v; } }
    };
  })();

  var flat = [];
  COURSE.forEach(function (m) {
    m.lessons.forEach(function (l) { flat.push({ mod: m, lesson: l }); });
  });

  var doneSet = new Set((store.get('ng.done') || '').split(',').filter(Boolean));

  var S = {
    tab: 'learn',
    id: store.get('ng.at') || flat[0].lesson.id,
    q: '',
    diff: 'all',
    topic: 'all'
  };
  if (!flat.some(function (e) { return e.lesson.id === S.id; })) S.id = flat[0].lesson.id;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function el(id) { return document.getElementById(id); }
  function pad(n) { return (Number(n) < 10 ? '0' : '') + n; }
  function idx(lessonId) {
    for (var i = 0; i < flat.length; i++) if (flat[i].lesson.id === lessonId) return i;
    return -1;
  }
  function pathOf(entry) {
    return entry.mod.dir + '/' + pad(entry.lesson.id) + '-' + entry.lesson.file;
  }
  function matches(entry) {
    if (!S.q) return true;
    var l = entry.lesson;
    var hay = (entry.mod.t + ' ' + l.t + ' ' + l.file + ' ' + (l.what || []).join(' ') + ' ' +
      (l.why || []).join(' ') + ' ' + (l.mm || '')).toLowerCase();
    return hay.indexOf(S.q.toLowerCase()) !== -1;
  }

  /* ---------- the workspace tree ---------- */
  function renderNav() {
    var nav = el('sidebar');
    var html = '<div class="tree"><div class="tree-head">' +
      doneSet.size + '/' + TOTAL + ' files read' +
      (window.__ngVersion ? '  \u00b7 angular ' + esc(window.__ngVersion) : '') +
      '</div>';
    var shownAny = false;
    var lastDoneIndex = -1;
    flat.forEach(function (e, i) { if (doneSet.has(e.lesson.id)) lastDoneIndex = i; });

    COURSE.forEach(function (m) {
      var rows = '';
      var doneHere = 0;
      m.lessons.forEach(function (l) {
        if (doneSet.has(l.id)) doneHere++;
        var entry = { mod: m, lesson: l };
        if (!matches(entry)) return;
        shownAny = true;
        var walked = idx(l.id) <= lastDoneIndex;
        var cls = 'file-b' + (doneSet.has(l.id) ? ' done' : '') +
          (l.id === S.id && S.tab === 'learn' ? ' here' : '');
        rows += '<li class="file' + (walked ? ' walked' : '') + '">' +
          '<button class="' + cls + '" data-goto="' + l.id + '">' +
          '<span class="tick"></span><span class="num">' + pad(l.id) + '</span>' +
          '<span class="t">' + esc(l.t) + '</span></button></li>';
      });
      if (!rows) return;
      html += '<section class="mod"><h3 class="mod-h">' +
        '<span class="mod-mark"></span>' +
        '<span>' + esc(m.dir) + '<span class="lvl">' + esc(m.t) + ', ' + esc(m.lvl) + '</span></span>' +
        '<span class="frac">' + doneHere + '/' + m.lessons.length + '</span>' +
        '</h3><ol class="files">' + rows + '</ol></section>';
    });

    PENDING.forEach(function (m) {
      var rows = '';
      m.lessons.forEach(function (title, i) {
        var num = m.from + i;
        if (S.q && (m.t + ' ' + title).toLowerCase().indexOf(S.q.toLowerCase()) === -1) return;
        shownAny = true;
        rows += '<li class="file"><button class="file-b" disabled>' +
          '<span class="tick"></span><span class="num">' + pad(num) + '</span>' +
          '<span class="t">' + esc(title) + '</span></button></li>';
      });
      if (!rows) return;
      html += '<section class="mod"><h3 class="mod-h">' +
        '<span class="mod-mark"></span>' +
        '<span>' + esc(m.dir) + '<span class="lvl">' + esc(m.t) + ', not built yet</span></span>' +
        '<span class="frac">0/' + m.lessons.length + '</span>' +
        '</h3><ol class="files">' + rows + '</ol></section>';
    });

    html += '</div>';
    if (!shownAny) html = '<p class="nav-empty">Nothing matches \u201c' + esc(S.q) + '\u201d.</p>';
    nav.innerHTML = html;
  }

  /* ---------- playground markup ---------- */
  function pg(code, label) {
    var id = 'pg' + (++pgSeq);
    PG_SRC[id] = code;
    return '<div class="pg" data-pg="' + id + '">' +
      '<div class="pg-bar">' +
      '<button class="btn btn-run" data-act="run">Run</button>' +
      '<button class="btn" data-act="reset">Reset</button>' +
      '<span class="hint">' + (label || 'Ctrl+Enter runs') + '</span>' +
      '</div><div class="pg-cols">' +
      '<textarea class="pg-code" spellcheck="false" aria-label="Editable example code">' + esc(code) + '</textarea>' +
      '<div class="pg-out" aria-live="polite"></div>' +
      '</div></div>';
  }

  /* ---------- lesson pane ---------- */
  function sect(label, body, extra) {
    return '<div class="sect' + (extra ? ' ' + extra : '') + '"><h3>' + label +
      '</h3><div class="body">' + body + '</div></div>';
  }
  /* prose is written with markdown-style `inline code`, because an API name
     set in mono is the whole point of the type contrast in this design */
  function md(s) {
    return String(s).replace(/`([^`]+)`/g, function (_, inner) {
      return '<code>' + esc(inner) + '</code>';
    });
  }
  function paras(arr) { return arr.map(function (p) { return '<p>' + md(p) + '</p>'; }).join(''); }

  function runtimeNotice() {
    var st = window.__ngStatus;
    if (st === 'ready') return '';
    if (st === 'nobabel') {
      return '<div class="notice"><b>The live examples cannot run.</b> Angular loaded, but the ' +
        'TypeScript transform (@babel/standalone) did not. Every lesson, snippet and answer ' +
        'below still reads normally.</div>';
    }
    if (st === 'failed') {
      return '<div class="notice"><b>The live examples cannot run.</b> Angular is loaded from a CDN ' +
        'and compiled in the browser, and that failed with: <code>' + esc(window.__ngError || 'unknown') +
        '</code>. Everything below still reads normally. If you are online and seeing this, the ' +
        'in-browser compiler path is the culprit rather than your setup.</div>';
    }
    return '<div class="notice"><b>Starting the in-browser Angular compiler\u2026</b> ' +
      'The first run downloads Angular from a CDN, so give it a moment.</div>';
  }

  function renderLesson() {
    var i = idx(S.id);
    var entry = flat[i];
    var l = entry.lesson;
    var h = runtimeNotice();

    h += '<p class="path">' + esc(entry.mod.dir) + '/<b>' + pad(l.id) + '-' + esc(l.file) + '</b>' +
      '  \u00b7  file ' + l.id + ' of ' + TOTAL + '</p>';
    h += '<h2 class="lesson-h">' + esc(l.t) + '</h2>';
    h += sect('What it is', paras(l.what));
    h += sect('Why it exists', paras(l.why));
    h += sect('Minimal example', pg(l.code));
    h += sect('Annotated walkthrough', '<dl class="anno">' + l.anno.map(function (a) {
      return '<div><dt>' + esc(a[0]) + '</dt><dd>' + md(a[1]) + '</dd></div>';
    }).join('') + '</dl>');
    h += sect('Common mistakes', l.mistakes.map(function (m) {
      return '<div class="mistake"><h4>' + esc(m[0]) + '</h4>' +
        (m[1] ? '<span class="msg">' + esc(m[1]) + '</span>' : '') +
        '<p>' + md(m[2]) + '</p></div>';
    }).join(''));
    h += sect('Exercise',
      '<p class="task">' + md(l.ex.task) + '</p>' + pg(l.ex.start, 'Your turn') +
      '<details class="sol"><summary>Show solution</summary><div class="sol-body">' +
      '<pre class="code">' + esc(l.ex.sol) + '</pre><p>' + md(l.ex.why) + '</p></div></details>');
    h += sect('Mental model', '<p class="stress">' + esc(l.mm) + '</p>');

    var prev = flat[i - 1], next = flat[i + 1];
    h += '<div class="lesson-foot">' +
      '<button class="fbtn mark' + (doneSet.has(l.id) ? ' on' : '') + '" data-mark="' + l.id + '">' +
      (doneSet.has(l.id) ? 'Read' : 'Mark read') + '</button>' +
      '<button class="fbtn" data-goto="' + (prev ? prev.lesson.id : '') + '"' + (prev ? '' : ' disabled') + '>' +
      (prev ? 'Back: ' + esc(prev.lesson.t) : 'Back') + '</button>' +
      '<button class="fbtn" data-goto="' + (next ? next.lesson.id : '') + '"' + (next ? '' : ' disabled') + '>' +
      (next ? 'Next: ' + esc(next.lesson.t) : 'That is file 52, the last one') + '</button>' +
      '</div>';
    return '<article class="lesson">' + h + '</article>';
  }

  /* ---------- interview pane ---------- */
  function topics() {
    var seen = {};
    INTERVIEW.forEach(function (q) { seen[q.topic] = 1; });
    return Object.keys(seen).sort();
  }

  function matchesQuestion(x) {
    if (!S.q) return true;
    var hay = (x.q + ' ' + x.a + ' ' + (x.code || '') + ' ' + x.fq + ' ' + x.fa + ' ' +
      x.topic + ' ' + x.d).toLowerCase();
    return hay.indexOf(S.q.toLowerCase()) !== -1;
  }

  function renderInterview() {
    var h = '<p class="path">interview/<b>how-to-answer.md</b>  \u00b7  ' +
      INTERVIEW.length + ' questions</p>' +
      '<h2 class="lesson-h">' + esc(HOW_TO_ANSWER.t) + '</h2>';

    h += sect('How to answer', HOW_TO_ANSWER.blocks.map(function (b) {
      return '<p><strong>' + b[0] + '.</strong> ' + md(b[1]) + '</p>';
    }).join(''));

    var counts = { Easy: 0, Medium: 0, Hard: 0 };
    INTERVIEW.forEach(function (x) { counts[x.d]++; });

    var bank = INTERVIEW.filter(function (x) {
      return (S.diff === 'all' || x.d === S.diff) &&
        (S.topic === 'all' || x.topic === S.topic) &&
        matchesQuestion(x);
    });

    h += '<div class="sect"><h3>Question bank</h3><div class="body">';
    h += '<div class="filters">' +
      [['all', 'Every level (' + INTERVIEW.length + ')'],
       ['Easy', 'Easy (' + counts.Easy + ')'],
       ['Medium', 'Medium (' + counts.Medium + ')'],
       ['Hard', 'Hard (' + counts.Hard + ')']].map(function (d) {
        return '<button class="chip" data-diff="' + d[0] + '" aria-pressed="' +
          (S.diff === d[0] ? 'true' : 'false') + '">' + d[1] + '</button>';
      }).join('') +
      '<label class="pick-wrap">Topic ' +
      '<select class="pick" id="topicPick" aria-label="Filter by topic">' +
      '<option value="all">Any topic</option>' +
      topics().map(function (t) {
        return '<option value="' + esc(t) + '"' + (S.topic === t ? ' selected' : '') + '>' +
          esc(t) + '</option>';
      }).join('') +
      '</select></label></div>';

    if (!bank.length) {
      h += '<div class="pending">No question matches that combination. ' +
        'Clear the search box, or choose another topic.</div>';
    } else {
      if (bank.length !== INTERVIEW.length) {
        h += '<p class="path">' + bank.length + ' of ' + INTERVIEW.length + ' shown</p>';
      }
      bank.forEach(function (x) {
        h += '<div class="qa">' +
          '<p class="q">' + esc(x.q) + '</p>' +
          '<p class="diff">' + x.d + ', ' + esc(x.topic) + '</p>' +
          '<details class="sol"><summary>Show answer</summary><div class="sol-body">' +
          x.a +
          (x.code ? '<pre class="code">' + esc(x.code) + '</pre>' : '') +
          '<div class="follow"><p class="fq">' + esc(x.fq) + '</p>' + x.fa + '</div>' +
          '</div></details></div>';
      });
    }
    h += '</div></div>';
    return h;
  }

  /* ---------- cheat sheet ---------- */
  function renderSheet() {
    var h = '<p class="path">reference/<b>cheat-sheet.md</b></p><h2 class="lesson-h">Cheat sheet</h2><div class="sheet">';
    SHEET.forEach(function (s) {
      var items = s.items.filter(function (it) {
        return !S.q || (it[0] + ' ' + it[1]).toLowerCase().indexOf(S.q.toLowerCase()) !== -1;
      });
      if (!items.length) return;
      h += '<section><h3>' + esc(s.t) + '</h3><dl>' + items.map(function (it) {
        return '<dt>' + esc(it[0]) + '</dt><dd>' + esc(it[1]) + '</dd>';
      }).join('') + '</dl></section>';
    });
    h += '</div><p class="pending" style="margin-top:20px">Injection, HTTP, forms, routing and ' +
      'testing sections land here as Modules 2 to 6 are built.</p>';
    return h;
  }

  /* ---------- render ---------- */
  function render() {
    var pane = el('paneInner');
    pane.innerHTML = S.tab === 'learn' ? renderLesson()
      : S.tab === 'interview' ? renderInterview() : renderSheet();
    renderNav();
    document.querySelectorAll('.tab').forEach(function (t) {
      t.setAttribute('aria-selected', t.dataset.tab === S.tab ? 'true' : 'false');
    });
    if (S.tab === 'learn') runAll(pane);
  }

  /* ---------- the Angular playground runner ---------- */
  function ready() { return window.__ngStatus === 'ready'; }

  /* Two transform configurations. The first is the one that should work;
     the second is a fallback in case the decorator plugin needs the older
     class-properties handling. Whichever compiles is remembered. */
  var TRANSFORMS = [
    {
      name: 'legacy decorators + loose fields',
      opts: {
        filename: 'example.ts',
        presets: [['typescript', { allExtensions: true, isTSX: false, onlyRemoveTypeImports: true }]],
        plugins: [
          ['proposal-decorators', { version: 'legacy' }],
          ['transform-class-properties', { loose: true }]
        ]
      }
    },
    {
      name: 'legacy decorators only',
      opts: {
        filename: 'example.ts',
        presets: [['typescript', { allExtensions: true, isTSX: false }]],
        plugins: [['proposal-decorators', { version: 'legacy' }]]
      }
    }
  ];
  var chosenTransform = null;

  function compile(src) {
    var order = chosenTransform ? [chosenTransform].concat(TRANSFORMS) : TRANSFORMS;
    var lastErr = null;
    for (var i = 0; i < order.length; i++) {
      try {
        var out = window.Babel.transform(src, order[i].opts).code;
        chosenTransform = order[i];
        return out;
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }

  function stripModules(src) {
    return src
      .replace(/^[ \t]*import[ \t][^\n]*\n?/gm, '')
      .replace(/^[ \t]*export[ \t]+default[ \t]+/gm, '')
      .replace(/^[ \t]*export[ \t]+/gm, '');
  }

  function scopeFor(collect, logFn, mountEl) {
    var ng = window.__ng;
    var c = ng.core, common = ng.common, http = ng.http, interop = ng.interop;
    var rx = ng.rxjs, ops = ng.operators;
    var forms = ng.forms || {}, sig = ng.signalForms || {};
    var pairs = [
      /* decorators */
      ['Component', c.Component], ['Directive', c.Directive], ['Pipe', c.Pipe],
      ['Injectable', c.Injectable], ['Service', c.Service || c.Injectable],
      ['Input', c.Input], ['Output', c.Output],
      ['HostListener', c.HostListener], ['HostBinding', c.HostBinding],
      /* signals */
      ['signal', c.signal], ['computed', c.computed], ['effect', c.effect],
      ['linkedSignal', c.linkedSignal], ['untracked', c.untracked], ['isSignal', c.isSignal],
      ['resource', c.resource], ['rxResource', interop && interop.rxResource],
      ['httpResource', http && http.httpResource],
      /* members */
      ['input', c.input], ['output', c.output], ['model', c.model],
      ['viewChild', c.viewChild], ['viewChildren', c.viewChildren],
      ['contentChild', c.contentChild], ['contentChildren', c.contentChildren],
      /* di + lifecycle */
      ['inject', c.inject], ['injectAsync', c.injectAsync], ['InjectionToken', c.InjectionToken],
      ['DestroyRef', c.DestroyRef], ['ElementRef', c.ElementRef],
      ['TemplateRef', c.TemplateRef], ['ViewContainerRef', c.ViewContainerRef],
      ['ChangeDetectorRef', c.ChangeDetectorRef], ['ApplicationRef', c.ApplicationRef],
      ['Injector', c.Injector], ['EnvironmentInjector', c.EnvironmentInjector],
      ['SecurityContext', c.SecurityContext], ['DomSanitizer', ng.pb.DomSanitizer],
      ['LOCALE_ID', c.LOCALE_ID], ['Profiler', c.Profiler],
      ['createComponent', c.createComponent], ['reflectComponentType', c.reflectComponentType],
      ['runInInjectionContext', c.runInInjectionContext], ['NgZone', c.NgZone],
      ['Renderer2', c.Renderer2], ['afterRenderEffect', c.afterRenderEffect],
      ['afterNextRender', c.afterNextRender], ['afterEveryRender', c.afterEveryRender],
      ['ChangeDetectionStrategy', c.ChangeDetectionStrategy],
      ['ViewEncapsulation', c.ViewEncapsulation], ['VERSION', c.VERSION],
      /* common */
      ['CommonModule', common.CommonModule], ['DatePipe', common.DatePipe],
      ['DecimalPipe', common.DecimalPipe], ['PercentPipe', common.PercentPipe],
      ['CurrencyPipe', common.CurrencyPipe], ['JsonPipe', common.JsonPipe],
      ['UpperCasePipe', common.UpperCasePipe], ['LowerCasePipe', common.LowerCasePipe],
      ['TitleCasePipe', common.TitleCasePipe], ['SlicePipe', common.SlicePipe],
      ['KeyValuePipe', common.KeyValuePipe], ['AsyncPipe', common.AsyncPipe],
      ['NgTemplateOutlet', common.NgTemplateOutlet], ['NgComponentOutlet', common.NgComponentOutlet],
      /* forms + http */
      ['FormsModule', forms.FormsModule], ['ReactiveFormsModule', forms.ReactiveFormsModule],
      ['FormBuilder', forms.FormBuilder], ['Validators', forms.Validators],
      ['FormControl', forms.FormControl], ['FormGroup', forms.FormGroup],
      ['FormArray', forms.FormArray], ['NgModel', forms.NgModel],
      ['HttpClient', http && http.HttpClient],
      /* rxjs, the handful that show up */
      ['of', rx.of], ['from', rx.from], ['interval', rx.interval], ['timer', rx.timer],
      ['Subject', rx.Subject], ['BehaviorSubject', rx.BehaviorSubject],
      ['firstValueFrom', rx.firstValueFrom],
      ['map', ops.map], ['filter', ops.filter], ['switchMap', ops.switchMap],
      ['debounceTime', ops.debounceTime], ['startWith', ops.startWith],
      ['toSignal', interop && interop.toSignal], ['toObservable', interop && interop.toObservable],
      /* playground helpers */
      ['provide', collect], ['log', logFn], ['host', mountEl]
    ];
    /* signal forms, when the subpath resolves */
    ['form', 'required', 'email', 'minLength', 'maxLength', 'min', 'max', 'pattern',
      'validate', 'validateAsync', 'validateHttp', 'disabled', 'readonly', 'hidden',
      'submit', 'apply', 'schema', 'FormField', 'Control', 'debounce', 'debounced',
      'minDate', 'maxDate'].forEach(function (n) {
      if (sig && sig[n]) pairs.push([n, sig[n]]);
      else if (c[n]) pairs.push([n, c[n]]);
    });
    var names = [], values = [], seen = {};
    pairs.forEach(function (p) {
      if (seen[p[0]]) return;
      seen[p[0]] = 1;
      names.push(p[0]);
      values.push(p[1]);
    });
    return { names: names, values: values };
  }

  function fmt(v) {
    if (typeof v === 'string') return v;
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }

  async function mount(src, mountEl, onError, logFn) {
    var ng = window.__ng;
    var collected = [];
    var collect = function (providers) {
      collected = collected.concat(providers || []);
    };
    var compiled = compile(stripModules(src));
    var scope = scopeFor(collect, logFn, mountEl);
    var factory = new Function(scope.names.join(','),
      '"use strict";\n' + compiled + '\n;return typeof App !== "undefined" ? App : null;');
    var App = factory.apply(null, scope.values);
    if (typeof App !== 'function') {
      throw new Error('No component class called App was found. Every example defines `class App`.');
    }
    var providers = collected.concat([
      { provide: ng.core.ErrorHandler, useValue: { handleError: onError } }
    ]);
    var app = await ng.pb.createApplication({ providers: providers });
    var ref = ng.core.createComponent(App, {
      environmentInjector: app.injector,
      hostElement: mountEl
    });
    app.attachView(ref.hostView);
    ref.changeDetectorRef.detectChanges();
    return app;
  }

  async function run(pgEl) {
    var ta = pgEl.querySelector('.pg-code');
    var out = pgEl.querySelector('.pg-out');

    if (pgEl.__app) {
      try { pgEl.__app.destroy(); } catch (e) { /* already gone */ }
      pgEl.__app = null;
    }
    out.textContent = '';

    if (!ready()) {
      out.innerHTML = '<pre class="pg-err">' + esc(
        window.__ngStatus === 'failed'
          ? 'Cannot run: ' + (window.__ngError || 'the in-browser Angular compiler failed to start.')
          : 'Cannot run: Angular has not finished loading from the CDN.'
      ) + '</pre>';
      return;
    }

    var logEl = document.createElement('pre');
    logEl.className = 'pg-log';
    var mountEl = document.createElement('div');
    out.appendChild(mountEl);

    function logFn() {
      var args = Array.prototype.slice.call(arguments);
      logEl.textContent += args.map(fmt).join(' ') + '\n';
      if (!logEl.parentNode) out.insertBefore(logEl, mountEl);
    }
    function fail(kind, message) {
      var p = document.createElement('pre');
      p.className = 'pg-err';
      p.textContent = kind + ': ' + message;
      out.appendChild(p);
    }

    try {
      pgEl.__app = await mount(ta.value, mountEl, function (err) {
        fail('Runtime error', (err && err.message) || String(err));
      }, logFn);
    } catch (e) {
      fail(e && e.name === 'SyntaxError' ? 'Compile error' : 'Error',
        (e && e.message) || String(e));
    }
  }

  function runAll(scope) {
    scope.querySelectorAll('.pg').forEach(function (p) { run(p); });
  }

  /* One real compile-and-mount at startup, so a broken JIT path reports
     itself instead of showing 50 mysterious empty panes. */
  async function selfTest() {
    if (window.__ngStatus !== 'loaded') return;
    var probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;left:-9999px;top:0';
    document.body.appendChild(probe);
    try {
      var app = await mount(
        "@Component({ selector: 'ng-probe', template: '{{ ok }}' })\n" +
        "class App { protected readonly ok = 'ok'; }",
        probe,
        function () {}, function () {}
      );
      var text = (probe.textContent || '').trim();
      app.destroy();
      if (text !== 'ok') throw new Error('a component mounted but rendered "' + text + '"');
      window.__ngStatus = 'ready';
      window.__ngTransform = chosenTransform && chosenTransform.name;
    } catch (e) {
      window.__ngStatus = 'failed';
      window.__ngError = (e && e.message) || String(e);
    } finally {
      probe.remove();
    }
    render();
  }

  /* ---------- events ---------- */
  function goto(id) {
    S.tab = 'learn';
    S.id = id;
    store.set('ng.at', id);
    render();
    el('main').focus();
    window.scrollTo({ top: 0, behavior: 'auto' });
    closeDrawer();
  }
  function closeDrawer() {
    el('sidebar').classList.remove('open');
    el('drawerBtn').setAttribute('aria-expanded', 'false');
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-goto],[data-act],[data-mark],[data-tab],[data-diff]');
    if (!t) return;
    if (t.dataset.goto) return goto(t.dataset.goto);
    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); return; }
    if (t.dataset.diff) { S.diff = t.dataset.diff; render(); return; }
    if (t.dataset.mark) {
      var id = t.dataset.mark;
      if (doneSet.has(id)) doneSet.delete(id); else doneSet.add(id);
      store.set('ng.done', Array.from(doneSet).join(','));
      t.classList.toggle('on');
      t.textContent = doneSet.has(id) ? 'Read' : 'Mark read';
      renderNav();
      return;
    }
    if (t.dataset.act) {
      var box = t.closest('.pg');
      if (t.dataset.act === 'reset') box.querySelector('.pg-code').value = PG_SRC[box.dataset.pg];
      run(box);
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'topicPick') {
      S.topic = e.target.value;
      render();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.classList.contains('pg-code')) {
      e.preventDefault();
      run(e.target.closest('.pg'));
    }
    if (e.key === 'Escape') closeDrawer();
  });

  el('drawerBtn').addEventListener('click', function () {
    var open = el('sidebar').classList.toggle('open');
    el('drawerBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  var findTimer;
  el('find').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(findTimer);
    findTimer = setTimeout(function () {
      S.q = v.trim();
      if (S.tab === 'learn') renderNav(); else render();
    }, 140);
  });

  window.addEventListener('ngstatus', function () { render(); selfTest(); });

  render();
  if (window.__ngStatus) selfTest();
  setTimeout(function () {
    if (typeof window.__ngStatus === 'undefined') {
      window.__ngStatus = 'failed';
      window.__ngError = 'the CDN request timed out after 12 seconds';
      render();
    }
  }, 12000);
})();
</script>
</body>
</html>
