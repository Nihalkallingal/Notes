      task:'Turn the fetch above into a method that cancels the previous request when a new one starts, and show which response won. Then say what the real HttpClient version would look like.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`// With the real HttpClient this problem does not arise: switchMap on the\n// observable cancels the previous request, and a resource (lesson 31) does\n// the same thing for you. Here we do it by hand to see the mechanism.\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <button (click)="search('slow')">Slow request (1200ms)</button>\n    <button (click)="search('fast')">Fast request (200ms)</button>\n    <p><small>Press slow then fast quickly: the fast answer must win.</small></p>\n    <p>status: {{ status() }}</p>\n    <p>result: {{ result() || '\u2014' }}</p>\n  \`\n})\nclass App {\n  protected readonly status = signal('idle');\n  protected readonly result = signal('');\n\n  private token = 0;                     // identifies the newest request\n\n  private fakeRequest(kind: string) {\n    const ms = kind === 'slow' ? 1200 : 200;\n    return new Promise<string>(resolve =>\n      setTimeout(() => resolve(kind + ' response after ' + ms + 'ms'), ms)\n    );\n  }\n\n  protected async search(kind: string) {\n    const mine = ++this.token;           // claim the latest slot\n    this.status.set('loading ' + kind);\n\n    const answer = await this.fakeRequest(kind);\n\n    if (mine !== this.token) return;     // a newer request started: discard\n    this.result.set(answer);\n    this.status.set('idle');\n  }\n}`,
      why:'The counter is the whole fix: each call claims a number, and on arrival a response checks whether it is still the newest before writing anything. Without it the slow response lands last and overwrites the fast one, so the screen shows an answer to a question the user has already replaced — no error, nothing in the console, which is why this bug survives code review. With the real `HttpClient` you would not write this: `switchMap` unsubscribes from the previous request, which actually cancels it rather than merely ignoring it, and `httpResource()` handles it plus the loading and error states. The reason to understand the manual version is that the same race appears anywhere you `await` in a handler, including with `fetch` directly.'
    },
    mm:'HttpClient is root-provided and on fetch now, and every request needs an answer to what happens if the user has moved on.'
  },
  {
    id:'30', file:'interceptors.ts', t:'Functional interceptors',
    what:[
      'An interceptor is a function that sees every outgoing request and every incoming response. You register them with `provideHttpClient(withInterceptors([...]))`, and they run in the order listed.',
      'The signature is `(req, next) => next(modifiedReq)`. Requests are immutable, so you clone with `req.clone({ ... })` and pass the clone on.'
    ],
    why:[
      'Some concerns belong to every request: an auth token, a correlation id, a base URL, a retry on 503, a loading counter, logging, error normalisation. Putting them in each service means forgetting one, and putting them in a wrapper class means every service depends on your wrapper.',
      'The functional form replaced class-based interceptors because it composes better and can use `inject()` directly, so an interceptor can reach the auth service without a constructor or a provider dance.',
      'The order matters and is worth thinking about once: the request travels down the list and the response comes back up it, so an interceptor listed first sees the request earliest and the response latest.'
    ],
    code:`// The real thing, for reference:\n//\n//   export const authInterceptor: HttpInterceptorFn = (req, next) => {\n//     const token = inject(Session).token();\n//     if (!token) return next(req);\n//     return next(req.clone({ setHeaders: { Authorization: 'Bearer ' + token } }));\n//   };\n//\n//   bootstrapApplication(App, {\n//     providers: [provideHttpClient(withInterceptors([authInterceptor, retryInterceptor]))]\n//   });\n//\n// There is no server here, so the snippet below runs the same composition\n// with plain functions: the chain, the cloning, and the ordering are real.\n\ninterface Req { url: string; headers: Record<string, string> }\ntype Next = (req: Req) => Promise<string>;\ntype Interceptor = (req: Req, next: Next) => Promise<string>;\n\n@Service()\nclass Session {\n  readonly token = signal<string | null>('abc123');\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <button (click)="send('/api/users')">GET /api/users</button>\n    <button (click)="send('/api/flaky')">GET /api/flaky (fails once)</button>\n    <button (click)="session.token.set(session.token() ? null : 'abc123')">\n      token: {{ session.token() ?? 'none' }}\n    </button>\n    <ol>@for (line of log(); track $index) { <li><code>{{ line }}</code></li> }</ol>\n  \`\n})\nclass App {\n  protected readonly session = inject(Session);\n  protected readonly log = signal<string[]>([]);\n  private note(line: string) { this.log.update(l => [...l, line].slice(-8)); }\n\n  // 1. adds a header, using an injected service\n  private readonly auth: Interceptor = (req, next) => {\n    const token = this.session.token();\n    if (!token) { this.note('auth: no token, passing through'); return next(req); }\n    this.note('auth: adding Authorization');\n    return next({ ...req, headers: { ...req.headers, Authorization: 'Bearer ' + token } });\n  };\n\n  // 2. logs on the way down and on the way back up\n  private readonly logging: Interceptor = async (req, next) => {\n    this.note('log: -> ' + req.url + ' ' + JSON.stringify(req.headers));\n    const res = await next(req);\n    this.note('log: <- ' + res);\n    return res;\n  };\n\n  // 3. retries once\n  private readonly retry: Interceptor = async (req, next) => {\n    try {\n      return await next(req);\n    } catch (e) {\n      this.note('retry: first attempt failed, retrying');\n      return next(req);\n    }\n  };\n\n  private attempts = 0;\n  private transport: Next = async req => {\n    if (req.url.includes('flaky') && this.attempts++ % 2 === 0) throw new Error('503');\n    return '200 OK from ' + req.url;\n  };\n\n  protected async send(url: string) {\n    this.log.set([]);\n    // requests travel down this list, responses come back up it\n    const chain = [this.auth, this.logging, this.retry].reduceRight<Next>(\n      (next, interceptor) => req => interceptor(req, next),\n      this.transport\n    );\n    try { await chain({ url, headers: {} }); }\n    catch (e) { this.note('failed: ' + (e as Error).message); }\n  }\n}`,
    anno:[
      ['(req, next) => next(req)','The whole contract. Call `next` to continue, return without calling it to short-circuit, and wrap the result to act on the response.'],
      ['req.clone({ setHeaders: { ... } })','How you modify a real `HttpRequest`, because they are immutable. `setHeaders` merges, `setParams` does the same for the query string.'],
      ['inject(Session) inside the function','Functional interceptors run in an injection context, so they can reach services directly. This is the main reason they replaced the class form.'],
      ['withInterceptors([a, b, c])','Order is the array order. `a` sees the request first and the response last, which is what makes a logging interceptor at the front measure the whole chain.'],
      ['Returning without calling next','Short-circuits: useful for serving from a cache or blocking a request outright.'],
      ['catchError / retry','On a real observable you would use RxJS operators here rather than try/catch. `retry({ count: 2, delay: 500 })` is the usual shape.'],
      ['withInterceptorsFromDi()','The bridge for legacy class-based interceptors registered through the `HTTP_INTERCEPTORS` multi token.']
    ],
    mistakes:[
      ['Mutating the request','','`req.headers.set(...)` returns a new headers object rather than changing it, and assigning to `req.url` is a type error. Clone and pass the clone.'],
      ['Forgetting to call next','','The request never goes anywhere and the caller waits for ever. If you short-circuit deliberately, return a response.'],
      ['Adding an auth token to every request','','Including the ones going to third parties, which leaks your token. Check the URL before adding credentials.'],
      ['Swallowing errors in an interceptor','','Catching and returning something benign hides failures from every caller. Normalise the error and rethrow it.']
    ],
    ex:{
      task:'Add an interceptor that counts requests in flight so a global spinner can read the number, and make sure the count returns to zero when a request fails.',
      start:`// extend the chain above with a fourth interceptor\n@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`// The real version, which is the point of the exercise:\n//\n//   @Service()\n//   class Busy {\n//     private readonly n = signal(0);\n//     readonly inFlight = this.n.asReadonly();\n//     readonly isBusy = computed(() => this.n() > 0);\n//     start() { this.n.update(x => x + 1); }\n//     stop()  { this.n.update(x => Math.max(0, x - 1)); }\n//   }\n//\n//   export const busyInterceptor: HttpInterceptorFn = (req, next) => {\n//     const busy = inject(Busy);\n//     busy.start();\n//     return next(req).pipe(finalize(() => busy.stop()));   // finalize, not tap\n//   };\n\n@Service()\nclass Busy {\n  private readonly n = signal(0);\n  readonly inFlight = this.n.asReadonly();\n  readonly isBusy = computed(() => this.n() > 0);\n  start() { this.n.update(x => x + 1); }\n  stop() { this.n.update(x => Math.max(0, x - 1)); }\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    @if (busy.isBusy()) { <p role="status">Loading ({{ busy.inFlight() }} in flight)\u2026</p> }\n    <button (click)="send(true)">One that succeeds</button>\n    <button (click)="send(false)">One that fails</button>\n    <p>last: {{ last() }}</p>\n  \`\n})\nclass App {\n  protected readonly busy = inject(Busy);\n  protected readonly last = signal('nothing yet');\n\n  private async transport(ok: boolean) {\n    await new Promise(r => setTimeout(r, 900));\n    if (!ok) throw new Error('503');\n    return '200 OK';\n  }\n\n  protected async send(ok: boolean) {\n    this.busy.start();\n    try {\n      this.last.set(await this.transport(ok));\n    } catch (e) {\n      this.last.set('failed: ' + (e as Error).message);\n    } finally {\n      this.busy.stop();        // the equivalent of finalize()\n    }\n  }\n}`,
      why:'The counter rather than a boolean is what makes this correct with several requests in flight: a boolean set to false by the first response hides a spinner that two other requests still need. The important line is the `finally`, which in the real interceptor is RxJS\u2019s `finalize` rather than `tap`, because `tap` only sees success and a failed request would leave the count permanently above zero and a spinner on screen for ever. Press the failing button a few times and watch the count return to zero each time. Note the state lives in an injectable service so any component can read `isBusy()`, which is the standard way to build a global loading indicator without a single global variable.'
    },
    mm:'An interceptor is a function wrapping every request, so cross-cutting concerns live in one place and requests travel down the list while responses come back up.'
  },
  {
    id:'31', file:'resources.ts', t:'resource(), httpResource(), rxResource()',
    what:[
      'A resource is asynchronous state as signals. You give it a request and a loader, and it gives you `value()`, `status()`, `isLoading()`, `error()`, `hasValue()`, and `reload()`.',
      'Three flavours, all stable since v22. `resource()` takes any promise-returning loader, `httpResource()` takes a URL and uses `HttpClient`, and `rxResource()` takes an observable.'
    ],
    why:[
      'Loading, error, data and empty are the same four states on every screen, and every hand-rolled version gets one of them slightly wrong: the previous error is not cleared, the empty state flashes before each load, or two responses arrive out of order and the old one wins. A resource is that boilerplate, written once, by the framework.',
      'The request is reactive. Read a signal in the request function and the resource reloads when it changes, and abandons the in-flight load, which is the race condition solved by construction rather than by discipline.',
      'v22 added `chain()` for dependent requests, so a resource whose request needs another resource\u2019s value propagates loading and error states instead of making you unpick them, and an `id` option so a resource rendered on the server arrives resolved on the client rather than flashing a spinner.'
    ],
    code:`// Real code first:\n//\n//   const user = httpResource<User>(() => \`/api/users/\${id()}\`);\n//   const posts = httpResource<Post[]>(({ chain }) => {\n//     const u = chain(user);                       // waits for and inherits state\n//     return u ? \`/api/posts?author=\${u.id}\` : undefined;\n//   });\n//\n// No server here, so this uses resource() with a fake loader. The states,\n// the reactive request and the reload are all the real thing.\n\ninterface User { id: number; name: string }\n\nfunction fakeLoad(id: number): Promise<User> {\n  return new Promise((resolve, reject) => setTimeout(() => {\n    if (id === 4) reject(new Error('user 4 is unavailable'));\n    resolve({ id, name: 'User ' + id });\n  }, 700));\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    @for (n of [1, 2, 3, 4]; track n) {\n      <button (click)="id.set(n)" [disabled]="n === id()">user {{ n }}</button>\n    }\n    <button (click)="user.reload()">Reload</button>\n\n    <p>status: <code>{{ user.status() }}</code></p>\n\n    @if (user.isLoading()) { <p role="status">Loading user {{ id() }}\u2026</p> }\n    @else if (user.error()) { <p class="err">{{ $any(user.error()).message }}</p> }\n    @else if (user.hasValue()) { <p>Loaded: {{ user.value()!.name }}</p> }\n\n    <p><small>Click through the users quickly: only the last one wins.</small></p>\n  \`,\n  styles: \`.err { color: #7A4E00; }\`\n})\nclass App {\n  protected readonly id = signal(1);\n\n  // the request is reactive: changing id() reloads and abandons the old load\n  protected readonly user = resource({\n    params: () => ({ id: this.id() }),\n    loader: ({ params }) => fakeLoad(params.id)\n  });\n}`,
    anno:[
      ['resource({ params, loader })','`params` is a reactive function: any signal it reads becomes a trigger. `loader` receives those params plus an `abortSignal` and a `chain` helper.'],
      ['status()','A union: `idle`, `loading`, `reloading`, `resolved`, `error`, or `local`. Reading it beats assembling the same information from three booleans.'],
      ['isLoading() and hasValue()','The two you use most. `hasValue()` narrows the type, which is what makes `value()!` safe inside the branch.'],
      ['value()','A writable signal, so you can set it for an optimistic update and let the next load replace it. That is what the `local` status means.'],
      ['reload()','Re-runs the loader with the same params. What a refresh button calls.'],
      ['params: () => undefined','Returning undefined means "not ready": the resource goes idle and the loader is not called. How you express a request that depends on something not yet chosen.'],
      ['chain(other)','New in v22. Returns the other resource\u2019s value when it has one, and otherwise propagates its idle, loading, or error state into this resource.'],
      ['{ id: \'user\' }','Caches the resolved value across server rendering and hydration, so a server-rendered resource does not re-fetch and flash a spinner on the client.'],
      ['httpResource / rxResource','The same API over `HttpClient` and over observables. `rxResource` exists so an RxJS-based API layer feeds a signals component without a rewrite.']
    ],
    mistakes:[
      ['Reading signals inside the loader instead of the params','','Only the params function is tracked. A signal read in the loader will not trigger a reload, and you get a stale request with no warning.'],
      ['Assuming value() is defined','','It is `T | undefined` unless you pass `defaultValue` or guard with `hasValue()`. Under `strictTemplates` the compiler tells you.'],
      ['Using a resource for a mutation','','Resources are for reading. A POST belongs in a method that calls the API and then reloads the resource, not in a loader that fires whenever a signal changes.'],
      ['Hand-rolling the four states next to a resource','','If you have a resource, do not also keep `loading` and `error` signals. That is two sources of truth for the same request.']
    ],
    ex:{
      task:'Build a master and detail pair where the detail resource depends on the selected item from the list resource, and both show their own loading and error states.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`interface Item { id: number; name: string }\ninterface Detail { id: number; note: string; owner: string }\n\nfunction loadList(): Promise<Item[]> {\n  return new Promise(r => setTimeout(() =>\n    r([{ id: 1, name: 'Mug' }, { id: 2, name: 'Poster' }, { id: 3, name: 'Broken' }]), 600));\n}\n\nfunction loadDetail(id: number): Promise<Detail> {\n  return new Promise((resolve, reject) => setTimeout(() => {\n    if (id === 3) reject(new Error('detail 3 is unavailable'));\n    resolve({ id, note: 'notes for item ' + id, owner: 'ada' });\n  }, 700));\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <h4>Items</h4>\n    @if (list.isLoading()) { <p role="status">Loading the list\u2026</p> }\n    @if (list.hasValue()) {\n      @for (i of list.value()!; track i.id) {\n        <button (click)="selectedId.set(i.id)" [disabled]="i.id === selectedId()">\n          {{ i.name }}\n        </button>\n      }\n    }\n\n    <h4>Detail</h4>\n    @switch (detail.status()) {\n      @case ('idle') { <p>Pick an item.</p> }\n      @case ('loading') { <p role="status">Loading the detail\u2026</p> }\n      @case ('error') { <p class="err">{{ $any(detail.error()).message }}\n        <button (click)="detail.reload()">Retry</button></p> }\n      @default {\n        @if (detail.hasValue()) {\n          <p>{{ detail.value()!.note }} (owner {{ detail.value()!.owner }})</p>\n        }\n      }\n    }\n  \`,\n  styles: \`.err { color: #7A4E00; }\`\n})\nclass App {\n  protected readonly selectedId = signal<number | null>(null);\n\n  protected readonly list = resource({\n    loader: () => loadList()\n  });\n\n  protected readonly detail = resource({\n    // undefined means "not ready": the resource stays idle and never loads\n    params: () => {\n      const id = this.selectedId();\n      return id === null ? undefined : { id };\n    },\n    loader: ({ params }) => loadDetail(params.id)\n  });\n}`,
      why:'Two resources, no loading flags, no error fields, and no effect keeping them in step. The detail\u2019s `params` returning `undefined` is the idiom worth memorising: it is how you say "there is nothing to load yet", and it keeps the resource in `idle` so the template can distinguish "pick something" from "loading". Clicking through the items quickly abandons the previous load rather than racing it. The `@switch` on `status()` is nicer than three overlapping `@if`s because the states are genuinely exclusive, and the `error` branch has its own `reload()` so a failure is recoverable in place. With a real API this is `httpResource` and the same shape, plus v22\u2019s `chain()` if the second request needs a value from the first rather than an id you already hold.'
    },
    mm:'A resource is a reactive request plus the four states, so the boilerplate and the race condition are the framework\u2019s problem rather than yours.'
  },
  {
    id:'32', file:'signal-forms.ts', t:'Signal Forms',
    what:[
      'Signal Forms are Angular\u2019s forms API for a signals codebase, stable since v22 in `@angular/forms/signals`. You start from a signal holding your data, wrap it with `form()`, and bind fields in the template with `[formField]`.',
      'Validation is declared in a schema function alongside the form, and the state of each field, its value, whether it is touched, valid, or has a particular error, is available as signals.'
    ],
    why:[
      'The two older APIs each traded something away. Template-driven forms were easy and untyped, with the model scattered across the template. Reactive forms were explicit and lived in a parallel universe of `FormGroup` objects that had to be kept in step with your actual data, with types that were bolted on later.',
      'Signal Forms start from the data. The model is a signal you already have, so there is one source of truth and no `patchValue` to remember, and the types come from the model rather than from a builder.',
      'Because everything is a signal, form state composes with the rest of your application: a submit button can be `[disabled]` from a computed, an error message can appear in a `@if`, and a validator can read another signal without an observable in sight.'
    ],
    code:`// Note on the import path: the package subpath is @angular/forms/signals.\n// If your editor cannot resolve it, check the exact spelling against your\n// installed version rather than trusting a snippet, including this one.\n\ninterface Credentials { email: string; password: string; age: number }\n\n@Component({\n  selector: 'app-root',\n  imports: [FormField],\n  template: \`\n    <label>\n      Email <input type="email" [formField]="loginForm.email" />\n    </label>\n    @let emailField = loginForm.email();\n    @if (emailField.touched() && emailField.invalid()) {\n      @if (emailField.getError('required')) { <p class="err">Email is required</p> }\n      @if (emailField.getError('email')) { <p class="err">That is not an email</p> }\n    }\n\n    <label>\n      Password <input type="password" [formField]="loginForm.password" />\n    </label>\n    @let pwField = loginForm.password();\n    @if (pwField.touched(); as touched) {\n      @if (pwField.getError('minLength'); as e) {\n        <p class="err">At least {{ e.minLength }} characters</p>\n      }\n    }\n\n    <label>Age <input type="number" [formField]="loginForm.age" /></label>\n\n    <button (click)="submit()" [disabled]="loginForm().invalid()">Sign in</button>\n    <p>model: <code>{{ credentials() | json }}</code></p>\n    <p>{{ sent() }}</p>\n  \`,\n  styles: \`\n    label { display: block; margin-bottom: 6px; }\n    .err { color: #7A4E00; font-size: 12px; margin: 2px 0; }\n  \`\n})\nclass App {\n  // the model is an ordinary signal: one source of truth\n  protected readonly credentials = signal<Credentials>({ email: '', password: '', age: 18 });\n\n  protected readonly loginForm = form(this.credentials, f => {\n    required(f.email, { message: 'Email is required' });\n    email(f.email);\n    required(f.password);\n    minLength(f.password, 8);\n    min(f.age, 16);\n    max(f.age, 120);\n  });\n\n  protected readonly sent = signal('');\n\n  protected submit() {\n    if (this.loginForm().invalid()) return;\n    this.sent.set('would send ' + JSON.stringify(this.credentials()));\n  }\n}`,
    anno:[
      ['form(model, schema)','Takes the model signal and a function declaring the rules. The returned object mirrors the shape of your data, so `loginForm.email` is the field for `credentials().email`.'],
      ['[formField]="loginForm.email"','The binding. It wires the value, the change handler, and the touched tracking, so there is no `[(ngModel)]` and no `formControlName` string to mistype.'],
      ['@let emailField = loginForm.email();','A field is a signal; calling it gives you the state object. Naming it with `@let` avoids calling it four times in the same block.'],
      ["getError('required')",'Added in v22. Returns that specific error, typed, so `getError(\'minLength\')` gives you an object with `minLength` on it. Before this you iterated over `errors`.'],
      ['touched()','True once the user has left the field. Gating messages on it is what stops a pristine form shouting "required" before anything has been typed.'],
      ['required, email, minLength, min, max','Validators applied to a field, each accepting a `message` that can be a string or a function of the field state.'],
      ['minDate() and maxDate()','New in v22, for date inputs, adding `minDate` and `maxDate` errors.'],
      ["disabled(f.age, { when: ({ valueOf }) => valueOf(f.isAdmin) })",'Dynamic behaviour. In v22 all of `disabled`, `readonly`, `hidden` and the validators take a `when` option; passing the function positionally still works and is deprecated.'],
      ['loginForm().invalid()','The form itself is a field too, so the whole-form state is read the same way as a single field\u2019s.']
    ],
    mistakes:[
      ['Keeping a second copy of the data','','The model signal is the truth. Reading values off the form and writing them into another signal reintroduces the sync problem reactive forms had.'],
      ['Showing errors before the field is touched','','Technically correct and hostile. Gate on `touched()`, and mark everything touched on submit so a blind submit reveals every problem at once.'],
      ['Expecting the old touched model to be writable','','v22 changed this: custom controls now get a `touched` input and a `touch()` output, rather than a two-way `touched` model, so a control can no longer un-touch a field. Existing code needs a manual change.'],
      ['Reaching for signal forms in a v21 project','','They were experimental in v21 and the API changed before stabilising in v22, including the `when` option and `markAsTouched()` now cascading to descendants. Check your version before copying a snippet.']
    ],
    ex:{
      task:'Build a sign-up form with a confirm-password field that must match, a terms checkbox that must be ticked, and a submit that marks everything touched before validating.',
      start:`interface SignUp { email: string; password: string; confirm: string; terms: boolean }\n\n@Component({\n  selector: 'app-root',\n  imports: [FormField],\n  template: \`<p>your template</p>\`\n})\nclass App {\n  protected readonly model = signal<SignUp>({ email: '', password: '', confirm: '', terms: false });\n}`,
      sol:`interface SignUp { email: string; password: string; confirm: string; terms: boolean }\n\n@Component({\n  selector: 'app-root',\n  imports: [FormField],\n  template: \`\n    <label>Email <input type="email" [formField]="signUpForm.email" /></label>\n    @let e = signUpForm.email();\n    @if (e.touched() && e.invalid()) { <p class="err">Enter a valid email.</p> }\n\n    <label>Password <input type="password" [formField]="signUpForm.password" /></label>\n    @let p = signUpForm.password();\n    @if (p.touched() && p.getError('minLength'); as err) {\n      <p class="err">At least {{ err.minLength }} characters.</p>\n    }\n\n    <label>Confirm <input type="password" [formField]="signUpForm.confirm" /></label>\n    @let c = signUpForm.confirm();\n    @if (c.touched() && c.invalid()) { <p class="err">The passwords do not match.</p> }\n\n    <label><input type="checkbox" [formField]="signUpForm.terms" /> I agree to the terms</label>\n    @let t = signUpForm.terms();\n    @if (t.touched() && t.invalid()) { <p class="err">You have to agree.</p> }\n\n    <button (click)="submit()">Create account</button>\n    <p>{{ status() }}</p>\n  \`,\n  styles: \`\n    label { display: block; margin-bottom: 6px; }\n    .err { color: #7A4E00; font-size: 12px; margin: 2px 0; }\n  \`\n})\nclass App {\n  protected readonly model = signal<SignUp>({ email: '', password: '', confirm: '', terms: false });\n  protected readonly status = signal('');\n\n  protected readonly signUpForm = form(this.model, f => {\n    required(f.email);\n    email(f.email);\n    required(f.password);\n    minLength(f.password, 8);\n\n    // a cross-field rule: the validator reads the whole model\n    validate(f.confirm, ({ value }) =>\n      value() === this.model().password ? null : { kind: 'mismatch' }\n    );\n\n    // a boolean that must be true is a custom rule, not required()\n    validate(f.terms, ({ value }) => (value() ? null : { kind: 'mustAgree' }));\n  });\n\n  protected submit() {\n    // reveal every problem at once rather than one at a time\n    this.signUpForm().markAsTouched();\n\n    if (this.signUpForm().invalid()) {\n      this.status.set('Fix the errors above.');\n      return;\n    }\n    this.status.set('Created account for ' + this.model().email);\n  }\n}`,
      why:'Three kinds of rule in one schema. The email and password rules are built-in validators. The confirm field needs a cross-field comparison, so it uses `validate()` with a function that reads the model, which is the case that made reactive forms awkward and here is three lines. The terms checkbox is worth noticing: `required()` is about a value being present, and `false` is present, so "must be ticked" is its own rule. On submit, `markAsTouched()` on the form marks every descendant, which is the v22 behaviour and exactly what you want here; before v22 it marked only the field it was called on, and you can still get that with `{ skipDescendants: true }`.'
    },
    mm:'Signal Forms start from a signal holding your data, so the model is the truth and the field state is just more signals.'
  },
  {
    id:'33', file:'signal-forms-advanced.ts', t:'Signal Forms: async validation and custom controls',
    what:[
      'Some rules need a server: is this email already taken, is this username free. Signal Forms handle that with `validateAsync()` and `validateHttp()`, both of which understand debouncing and produce a pending state.',
      'Your own input components join a form by implementing `FormValueControl`, which replaces `ControlValueAccessor` and is considerably smaller.'
    ],
    why:[
      'An async validator has states a synchronous one does not: in flight, resolved, failed. Doing it by hand means a subscription, a debounce, cancellation of the previous check, and a flag so the submit button waits. The API owns all of that, and `validateHttp` is built on `httpResource`, so it inherits the reload and abandon behaviour from lesson 31.',
      'Custom controls exist because a real design system has a rating widget, a date picker, a tag input. `ControlValueAccessor` required four methods and a provider registration to participate in a form; `FormValueControl` is an interface over signals, and v22 made it work with legacy reactive and template-driven forms too, so you can migrate a component without touching its callers.',
      'The v22 details worth knowing: `debounce` accepts `\'blur\'` as well as a delay, `validateHttp` takes its own `debounce`, and `reloadValidation()` re-runs the async validators of a field and its descendants, which is the equivalent of the old `updateValueAndValidity()`.'
    ],
    code:`// Real async validation looks like this:\n//\n//   validateHttp(f.email, {\n//     request: email => \`/api/users/check?email=\${email.value()}\`,\n//     debounce: 400,\n//     errors: taken => (taken ? { kind: 'taken' } : null)\n//   });\n//\n// There is no server here, so this uses validateAsync with a fake check.\n\nconst TAKEN = ['ada@example.com', 'grace@example.com'];\n\nfunction checkEmail(value: string): Promise<boolean> {\n  return new Promise(r => setTimeout(() => r(TAKEN.includes(value.toLowerCase())), 800));\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [FormField],\n  template: \`\n    <label>\n      Email <input type="email" [formField]="signUpForm.email" />\n    </label>\n    @let f = signUpForm.email();\n\n    @if (f.pending()) { <p role="status">Checking\u2026</p> }\n    @if (f.touched() && f.getError('email')) { <p class="err">Not a valid email.</p> }\n    @if (f.getError('taken')) { <p class="err">That email is already registered.</p> }\n\n    <button [disabled]="signUpForm().invalid() || signUpForm().pending()"\n            (click)="status.set('submitted')">Sign up</button>\n    <button (click)="f.reloadValidation()">Check again</button>\n\n    <p><small>Try ada&#64;example.com. Typing more abandons the previous check.</small></p>\n    <p>{{ status() }}</p>\n  \`,\n  styles: \`\n    label { display: block; margin-bottom: 6px; }\n    .err { color: #7A4E00; font-size: 12px; margin: 2px 0; }\n  \`\n})\nclass App {\n  protected readonly model = signal({ email: '' });\n  protected readonly status = signal('');\n\n  protected readonly signUpForm = form(this.model, f => {\n    required(f.email);\n    email(f.email);\n\n    // debounce the value changes, so we do not check on every keystroke\n    debounce(f.email, 400);\n\n    validateAsync(f.email, {\n      params: ({ value }) => (value().includes('@') ? value() : undefined),\n      factory: params => checkEmail(params),\n      errors: taken => (taken ? { kind: 'taken' } : null)\n    });\n  });\n}`,
    anno:[
      ['debounce(field, 400)','Delays the value changes of a field. v22 also accepts `\'blur\'`, so the value settles when the user leaves the field rather than after a timer.'],
      ['validateAsync({ params, factory, errors })','The same reactive-request shape as a resource: `params` returning `undefined` means "nothing to check", so the validator does not run on an empty or obviously invalid value.'],
      ['pending()','True while an async validator is in flight, on a field or on the whole form. This is what a submit button should also wait for, not just `invalid()`.'],
      ["validateHttp(f.email, { request, debounce })",'The HTTP version, built on `httpResource`. Its own `debounce` option, added in v22, debounces the request rather than the field\u2019s value.'],
      ['reloadValidation()','New in v22. Re-runs the async validators of this field and its descendants by reloading the underlying resources. The replacement for `updateValueAndValidity()`.'],
      ['FormValueControl','The interface for a custom control: a `value` model, and optionally `touched`, `disabled`, `errors`, and a `reset` method. Far smaller than `ControlValueAccessor`.'],
      ['touched input, touch() output','The v22 shape for custom controls. It used to be a two-way `touched` model, which allowed a control to un-touch a field; that was deliberately removed and needs a manual change.'],
      ['Legacy compatibility','v22 made `FormValueControl` work with `formControlName` and `[(ngModel)]`, and made `NG_VALIDATORS` errors from old `ControlValueAccessor` components visible to signal forms.']
    ],
    mistakes:[
      ['Checking on every keystroke','','A request per character, and the answer to a query the user has already replaced. Debounce the field or the request; both are one line.'],
      ['Enabling submit while validation is pending','','`invalid()` is false while an async check is still running, so a fast user submits a form that is about to fail. Gate on `pending()` too.'],
      ['Treating a failed check as an invalid value','','A network error is not the same as "this email is taken". Decide what a failed validator means, and do not silently block the user because your server was down.'],
      ['Reaching for ControlValueAccessor in new code','','`FormValueControl` is the current interface and now works with the legacy form APIs as well, so there is no compatibility reason left to choose the old one.']
    ],
    ex:{
      task:'Write a custom rating control with FormValueControl, use it in a signal form, and add an async rule that a rating below three needs a comment.',
      start:`@Component({\n  selector: 'app-rating',\n  template: \`<p>your template</p>\`\n})\nclass Rating {\n  // implement FormValueControl<number>\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [FormField, Rating],\n  template: \`<p>your template</p>\`\n})\nclass App {}`,
      sol:`// A custom control: a value model, plus touched in and touch out (v22 shape).\n@Component({\n  selector: 'app-rating',\n  template: \`\n    @for (star of [1, 2, 3, 4, 5]; track star) {\n      <button type="button" (click)="pick(star)" [attr.aria-pressed]="star <= value()">\n        {{ star <= value() ? '\u2605' : '\u2606' }}\n      </button>\n    }\n    <span>{{ value() }}/5</span>\n  \`\n})\nclass Rating {\n  // FormValueControl<number>: the form reads and writes this\n  readonly value = model(0);\n  readonly touched = input(false);\n  readonly touch = output<void>();\n\n  pick(star: number) {\n    this.value.set(star);\n    this.touch.emit();          // tell the form the user has interacted\n  }\n}\n\ninterface Review { score: number; comment: string }\n\n@Component({\n  selector: 'app-root',\n  imports: [FormField, Rating],\n  template: \`\n    <label>Score <app-rating [formField]="reviewForm.score" /></label>\n\n    <label>\n      Comment <input [formField]="reviewForm.comment" placeholder="required below 3 stars" />\n    </label>\n    @let c = reviewForm.comment();\n    @if (c.touched() && c.getError('needsReason')) {\n      <p class="err">Tell us what went wrong.</p>\n    }\n\n    <button [disabled]="reviewForm().invalid()" (click)="send()">Post review</button>\n    <p>model: <code>{{ model() | json }}</code></p>\n    <p>{{ status() }}</p>\n  \`,\n  styles: \`\n    label { display: block; margin-bottom: 6px; }\n    .err { color: #7A4E00; font-size: 12px; }\n  \`\n})\nclass App {\n  protected readonly model = signal<Review>({ score: 5, comment: '' });\n  protected readonly status = signal('');\n\n  protected readonly reviewForm = form(this.model, f => {\n    min(f.score, 1);\n\n    // a rule about one field that depends on another\n    validate(f.comment, ({ value }) =>\n      this.model().score < 3 && value().trim() === ''\n        ? { kind: 'needsReason' }\n        : null\n    );\n  });\n\n  protected send() {\n    if (this.reviewForm().invalid()) return;\n    this.status.set('posted a ' + this.model().score + '-star review');\n  }\n}`,
      why:'The control is three declarations: a `value` model that the form binds two ways, a `touched` input it can read, and a `touch` output it emits when the user interacts. That is the whole of `FormValueControl`, against four methods and a provider for `ControlValueAccessor`, and since v22 the same component also works with `formControlName` and `[(ngModel)]` if an older part of the app needs it. The conditional rule shows why starting from the model matters: the validator reads `this.model().score` directly, so a cross-field rule is an ordinary expression rather than a `FormGroup`-level validator with hand-rolled typing. Set the rating to two and the comment becomes required in the same render.'
    },
    mm:'Async validation is a reactive request with a pending state, and a custom control is a value model plus touched in and touch out.'
  },
  {
    id:'34', file:'legacy-forms.ts', t:'Legacy reactive and template-driven forms',
    what:[
      'Before signal forms there were two APIs, and both are still supported and everywhere. Template-driven forms use `[(ngModel)]` and put the model in the template. Reactive forms build a `FormGroup` of `FormControl` objects in the class and bind them with `formControlName`.',
      'You need to read both, because most existing Angular code uses one of them, and a rewrite is not always the right call.'
    ],
    why:[
      'Reactive forms won over template-driven because the form was a value you could test, compose, and validate in one place. Their weakness was that the `FormGroup` is a parallel structure: your data goes in with `patchValue`, comes out of `form.value`, and the types were retrofitted, so `form.value` is a partial of your interface and `get(\'email\')` returns a possibly-null control.',
      'Signal forms fix that by starting from the data, but they are new, so the honest position on an existing codebase is: new forms in the new API, old forms left alone until you are touching them anyway.',
      'v22 made the boundary practical. A custom control written against the new `FormValueControl` interface works with `formControlName` and `[(ngModel)]`, and validators registered by old controls through `NG_VALIDATORS` now surface in signal forms, so the two can coexist during a migration.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  imports: [FormsModule, ReactiveFormsModule],\n  template: \`\n    <h4>Template-driven</h4>\n    <input [(ngModel)]="note" name="note" placeholder="two-way, untyped" />\n    <p>note: {{ note || '(empty)' }}</p>\n\n    <h4>Reactive</h4>\n    <div [formGroup]="profile">\n      <input formControlName="email" placeholder="email" />\n      <input formControlName="age" type="number" placeholder="age" />\n    </div>\n\n    <p>valid: {{ profile.valid }}, dirty: {{ profile.dirty }}</p>\n\n    @if (email?.touched && email?.errors) {\n      <p class="err">{{ email?.errors?.['required'] ? 'Email is required' : 'Not an email' }}</p>\n    }\n\n    <button (click)="load()">patchValue from "the server"</button>\n    <button (click)="profile.reset()">Reset</button>\n    <p>value: <code>{{ profile.value | json }}</code></p>\n  \`,\n  styles: \`.err { color: #7A4E00; font-size: 12px; }\`\n})\nclass App {\n  protected note = '';\n\n  private readonly fb = inject(FormBuilder);\n\n  // nonNullable, or every control's type includes null\n  protected readonly profile = this.fb.nonNullable.group({\n    email: ['', [Validators.required, Validators.email]],\n    age: [18, [Validators.min(16), Validators.max(120)]]\n  });\n\n  protected get email() {\n    return this.profile.get('email');     // FormControl | null, hence the ?. above\n  }\n\n  protected load() {\n    // the data has to be pushed in: the form is a separate structure\n    this.profile.patchValue({ email: 'ada@example.com', age: 36 });\n  }\n}`,
    anno:[
      ['imports: [FormsModule]','Needed for `ngModel`; `ReactiveFormsModule` for the `formGroup` family. Importing them individually rather than `CommonModule` keeps the dependency honest.'],
      ['fb.nonNullable.group({...})','Without `nonNullable`, every control is `T | null`, because `reset()` sets controls to null. This one call removes most of the type noise people complain about.'],
      ["['', [Validators.required, Validators.email]]",'The builder shorthand: initial value, then synchronous validators, then async validators. Validators are functions returning an errors object or null.'],
      ["profile.get('email')",'Returns `AbstractControl | null`, because the string is not checked against the group\u2019s shape. Hence the `?.` chain in the template, and one reason signal forms exist.'],
      ['patchValue / setValue','`patchValue` updates the fields you pass; `setValue` requires the whole shape. Both are the sync step that signal forms remove by using your model directly.'],
      ['valid, dirty, touched, pristine','Control state as plain properties, read on every change detection pass rather than as signals.'],
      ['[(ngModel)]','Template-driven, and fine for a single field with no validation. Inside a `<form>` it registers with the form by `name`, which is why the attribute is there.'],
      ['valueChanges','An observable of the value. The usual bridge into a signals codebase is `toSignal(profile.valueChanges)`, lesson 17.']
    ],
    mistakes:[
      ['Forgetting nonNullable','Type \'string | null\' is not assignable to type \'string\'','Use `fb.nonNullable.group(...)`, or `new FormControl(\'\', { nonNullable: true })`.'],
      ['Keeping a signal and a FormGroup for the same data','','Two sources of truth and a sync step in both directions. Pick one owner; if you want signals, that is what signal forms are.'],
      ['Mixing formControlName and ngModel on one control','','A long-deprecated combination that Angular warns about. Choose one API per form.'],
      ['Rewriting every form to signal forms at once','','A large codebase has hundreds. New forms in the new API, and migrate the old ones when you are already changing them; v22\u2019s compatibility work exists to make that possible.']
    ],
    ex:{
      task:'Bridge a reactive form into a signals codebase: expose its value and validity as signals, and derive a summary from them without subscribing by hand.',
      start:`@Component({\n  selector: 'app-root',\n  imports: [ReactiveFormsModule],\n  template: \`<p>your template</p>\`\n})\nclass App {\n  private readonly fb = inject(FormBuilder);\n}`,
      sol:`@Component({\n  selector: 'app-root',\n  imports: [ReactiveFormsModule],\n  template: \`\n    <div [formGroup]="order">\n      <input formControlName="item" placeholder="item" />\n      <input formControlName="qty" type="number" placeholder="qty" />\n    </div>\n\n    <p>value as a signal: <code>{{ value() | json }}</code></p>\n    <p>{{ summary() }}</p>\n    <p>{{ valid() ? 'ready' : 'not ready' }}</p>\n  \`\n})\nclass App {\n  private readonly fb = inject(FormBuilder);\n\n  protected readonly order = this.fb.nonNullable.group({\n    item: ['Mug', [Validators.required]],\n    qty: [1, [Validators.min(1)]]\n  });\n\n  // the bridge: an observable of the value, read as a signal\n  protected readonly value = toSignal(this.order.valueChanges, {\n    initialValue: this.order.getRawValue()\n  });\n\n  // statusChanges gives validity as a stream; map it to a boolean\n  protected readonly valid = toSignal(\n    this.order.statusChanges.pipe(map(status => status === 'VALID')),\n    { initialValue: this.order.valid }\n  );\n\n  // from here on it is ordinary signals code\n  protected readonly summary = computed(() => {\n    const v = this.value();\n    return \`\${v.qty} \u00d7 \${v.item}\`;\n  });\n}`,
      why:'`toSignal` is the whole bridge, and the `initialValue` matters twice: `valueChanges` does not emit the current value on subscribe, so without it the summary would be undefined until the first keystroke, and `getRawValue()` rather than `value` is used because `value` omits disabled controls. Validity comes from `statusChanges` mapped to a boolean, since the stream emits a status string rather than a flag. Once both are signals, everything downstream is ordinary signals code with no subscription to unsubscribe and no `markForCheck`, which is the point: you can adopt signals in a component without rewriting the form it already has.'
    },
    mm:'Reactive forms keep a parallel structure you sync with your data; read them, keep them where they work, and bridge them with toSignal.'
  },
  {
    id:'35', file:'routing.ts', t:'Routing: params, guards, and lazy routes',
    what:[
      'The router maps URLs to components. You give `provideRouter` an array of routes, put a `<router-outlet />` where the matched component should appear, and navigate with `routerLink` or the `Router` service.',
      'Route parameters, query parameters, and route data can all arrive as component inputs, and a route can load its component lazily with `loadComponent`.'
    ],
    why:[
      'The URL is state the user owns. It can be bookmarked, shared, and reloaded, and the back button is an interface people expect to work. Keeping "which screen am I on" in a signal instead means no deep links and a refresh that always lands on the home page.',
      'Lazy routes are the single biggest bundle win available. `loadComponent: () => import(...)` means a user who never opens the admin section never downloads it, and the router handles the loading state.',
      'Guards exist because navigation is the natural place to enforce access: a functional `CanActivateFn` is a plain function that can `inject()` whatever it needs and return a boolean, a redirect, or a promise.'
    ],
    code:`// The real thing:\n//\n//   export const routes: Routes = [\n//     { path: '', component: Home },\n//     { path: 'users/:id', loadComponent: () => import('./user').then(m => m.User) },\n//     { path: 'admin', canActivate: [authGuard], providers: [AdminState],\n//       loadChildren: () => import('./admin/routes').then(m => m.adminRoutes) },\n//     { path: '**', component: NotFound }\n//   ];\n//\n//   export const authGuard: CanActivateFn = (route, state) => {\n//     const session = inject(Session);\n//     const router = inject(Router);\n//     return session.isSignedIn() ? true : router.createUrlTree(['/sign-in']);\n//   };\n//\n//   bootstrapApplication(App, {\n//     providers: [provideRouter(routes, withComponentInputBinding())]\n//   });\n//\n// A real router here would take over this page's URL, so the snippet below\n// is a 30-line stand-in. The concepts are the same; the API is not.\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <nav>\n      <button (click)="go('/')">Home</button>\n      <button (click)="go('/users/7?tab=drafts')">User 7</button>\n      <button (click)="go('/admin')">Admin (guarded)</button>\n      <button (click)="go('/nope')">Broken link</button>\n      <button (click)="signedIn.set(!signedIn())">\n        {{ signedIn() ? 'Sign out' : 'Sign in' }}\n      </button>\n    </nav>\n\n    <p class="url">url: <code>{{ url() }}</code></p>\n\n    @switch (match().route) {\n      @case ('home') { <p>Home.</p> }\n      @case ('user') {\n        <p>User {{ match().params.id }}, tab {{ match().query.tab ?? 'none' }}</p>\n      }\n      @case ('admin') { <p>Secret admin things.</p> }\n      @case ('sign-in') { <p>Please sign in first.</p> }\n      @default { <p>404: nothing at {{ url() }}</p> }\n    }\n  \`,\n  styles: \`nav { display: flex; gap: 4px; margin-bottom: 8px; } .url { font-size: 12px; }\`\n})\nclass App {\n  protected readonly signedIn = signal(false);\n  protected readonly url = signal('/');\n\n  protected go(to: string) {\n    // a guard: navigation can be redirected before it happens\n    if (to === '/admin' && !this.signedIn()) { this.url.set('/sign-in'); return; }\n    this.url.set(to);\n  }\n\n  protected readonly match = computed(() => {\n    const [path, qs = ''] = this.url().split('?');\n    const query = Object.fromEntries(new URLSearchParams(qs).entries());\n    const parts = path.split('/').filter(Boolean);\n\n    if (parts.length === 0) return { route: 'home', params: {} as Record<string, string>, query };\n    if (parts[0] === 'users' && parts[1]) return { route: 'user', params: { id: parts[1] }, query };\n    if (parts[0] === 'admin') return { route: 'admin', params: {}, query };\n    if (parts[0] === 'sign-in') return { route: 'sign-in', params: {}, query };\n    return { route: '404', params: {}, query };\n  });\n}`,
    anno:[
      ["{ path: 'users/:id', component: User }",'A route with a parameter. Paths have no leading slash, and `**` is the catch-all that must come last.'],
      ['loadComponent: () => import(...)','A lazy route. The chunk is fetched on first navigation. `loadChildren` does the same for a whole feature\u2019s route array.'],
      ['withComponentInputBinding()','Turns route params, query params, and resolved data into component inputs, so a component reads `id = input.required<string>()` instead of injecting `ActivatedRoute`. v22 added options: `queryParams` to include or exclude them, and `unmatchedInputBehavior` to control what happens to inputs that match nothing.'],
      ['canActivate: [authGuard]','A functional guard: `(route, state) => boolean | UrlTree | Promise<...>`. Returning a `UrlTree` from `router.createUrlTree([...])` is how you redirect.'],
      ['providers: [AdminState] on a route','Scopes a service to the route: created on entry, destroyed on leave. The middle ground from lesson 28.'],
      ['canMatch','Decides whether a route matches at all, so two routes can share a path and differ by condition. In v22 its third parameter, `currentSnapshot`, is mandatory, with a migration.'],
      ["paramsInheritanceStrategy: 'always'",'The v22 default: child routes inherit parent params. Set it back to `emptyOnly` for the old behaviour, and note there is no automatic migration for this one.'],
      ['<a routerLink="/users/7">','Renders a real anchor, so open-in-new-tab and middle-click work. v22 added a `browserUrl` input to show a different URL from the one that was matched.']
    ],
    mistakes:[
      ['Keeping the current screen in a signal instead of the URL','','No deep links, no back button, and a reload loses the user\u2019s place. If it should survive a refresh or be shareable, it belongs in the URL.'],
      ['A button where a link belongs','','It breaks open-in-new-tab, right-click, and crawlers. Use an anchor with `routerLink`, which handles the click for you.'],
      ['Putting the catch-all route first','','Routes match in order, so `**` first swallows everything. Order matters more in the router than anywhere else in Angular.'],
      ['A guard that returns false with no explanation','','The navigation is cancelled and the user sits on the old page wondering what happened. Redirect to a sign-in or an explanation page by returning a `UrlTree`.']
    ],
    ex:{
      task:'Add a nested route under the user page, keep a filter in the query string so it survives a refresh, and guard the nested route on a role.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`// The real route table this stands in for:\n//\n//   {\n//     path: 'users/:id',\n//     loadComponent: () => import('./user-shell').then(m => m.UserShell),\n//     children: [\n//       { path: '', component: UserProfile },\n//       { path: 'posts', component: UserPosts, canActivate: [editorGuard] }\n//     ]\n//   }\n\ntype Role = 'viewer' | 'editor';\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <nav>\n      <button (click)="go('/users/7')">Profile</button>\n      <button (click)="go('/users/7/posts?sort=new')">Posts (needs editor)</button>\n      <button (click)="role.set(role() === 'editor' ? 'viewer' : 'editor')">\n        role: {{ role() }}\n      </button>\n    </nav>\n\n    <p class="url">url: <code>{{ url() }}</code></p>\n\n    @if (m().id) {\n      <!-- the shell stays mounted while the child changes -->\n      <div class="shell">\n        <h4>User {{ m().id }}</h4>\n        @switch (m().child) {\n          @case ('posts') {\n            <p>Posts, sorted by {{ m().query.sort ?? 'default' }}.</p>\n          }\n          @case ('denied') { <p class="err">You need the editor role.</p> }\n          @default { <p>Profile.</p> }\n        }\n      </div>\n    } @else {\n      <p>Pick a user.</p>\n    }\n  \`,\n  styles: \`\n    nav { display: flex; gap: 4px; margin-bottom: 8px; }\n    .shell { border: 1px solid #CFCCD6; padding: 8px; }\n    .url { font-size: 12px; } .err { color: #7A4E00; }\n  \`\n})\nclass App {\n  protected readonly role = signal<Role>('viewer');\n  protected readonly url = signal('/users/7');\n\n  protected go(to: string) { this.url.set(to); }\n\n  protected readonly m = computed(() => {\n    const [path, qs = ''] = this.url().split('?');\n    const query = Object.fromEntries(new URLSearchParams(qs).entries());\n    const parts = path.split('/').filter(Boolean);\n    const id = parts[0] === 'users' ? parts[1] : undefined;\n\n    // the guard, evaluated as part of matching\n    let child = parts[2];\n    if (child === 'posts' && this.role() !== 'editor') child = 'denied';\n\n    return { id, child, query };\n  });\n}`,
      why:'Three ideas, each with a real router equivalent. Nesting is a shell component that stays mounted while the child changes, which is what `children` plus a `<router-outlet />` gives you, and it is why the user heading does not flicker when you switch tabs. The sort order lives in the query string rather than in a signal, so it survives a refresh and can be pasted to a colleague, which is the test for whether something belongs in the URL. The role check happens during matching, so switching to viewer while on the posts page re-evaluates immediately, which is the behaviour `canMatch` gives you and `canActivate` does not, since `canActivate` only runs on navigation.'
    },
    mm:'The URL is state the user owns: routes map it to components, guards decide before you get there, and lazy routes are the biggest bundle win you can buy.'
  }
  ]
});

    id:'36', file:'change-detection-internals.ts', t:'Change detection internals',
    what:[
      'Angular keeps a tree of views. Change detection is a traversal of that tree in which each view either updates its bindings or is skipped, followed by a commit of the DOM changes.',
      'Whether a view is visited depends on flags. Something marks a view dirty, that mark is propagated up to the root so the traversal can reach it, and the next pass refreshes it.'
    ],
    why:[
      'Knowing the mechanism turns performance work from guesswork into reading. Almost every "why did this not update" and "why is typing slow" question is answered by two facts: what marked this view, and how much of the tree the traversal had to visit.',
      'With `OnPush` the default since v22, the traversal is expected to skip most of the tree. A view is refreshed only if it was marked, so the cost of a change is proportional to what actually changed rather than to the size of the application.',
      'Zoneless removed the trigger, not the traversal. Without Zone.js nothing schedules a pass on a whim: a signal write, a template event, an input change, or an explicit `markForCheck` notifies the scheduler, which coalesces the notifications and runs one pass.'
    ],
    code:`@Component({\n  selector: 'app-leaf',\n  template: \`<span>{{ name() }}: refreshed {{ count() }} times</span>\`\n})\nclass Leaf {\n  readonly name = input('leaf');\n  readonly value = input(0);\n\n  // counts how many times THIS view was actually refreshed\n  private n = 0;\n  protected count() { return ++this.n; }\n}\n\n@Component({\n  selector: 'app-branch',\n  imports: [Leaf],\n  template: \`\n    <div class="box">\n      <p>branch, refreshed {{ count() }} times</p>\n      <app-leaf name="static" [value]="0" />\n      <app-leaf name="bound to a signal" [value]="shared()" />\n    </div>\n  \`,\n  styles: \`.box { border: 1px solid #CFCCD6; padding: 6px; margin-bottom: 6px; }\`\n})\nclass Branch {\n  readonly shared = input(0);\n  private n = 0;\n  protected count() { return ++this.n; }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Branch],\n  template: \`\n    <button (click)="local.update(n => n + 1)">Change only my own state</button>\n    <button (click)="shared.update(n => n + 1)">Change what the children read</button>\n    <p>local: {{ local() }}</p>\n\n    <app-branch [shared]="shared()" />\n    <app-branch [shared]="0" />\n\n    <p><small>\n      The second branch takes a constant, so nothing marks it and its counter\n      stops moving. That is OnPush skipping a subtree.\n    </small></p>\n  \`\n})\nclass App {\n  protected readonly local = signal(0);\n  protected readonly shared = signal(0);\n}`,
    anno:[
      ['Marking a view dirty','A signal read in its template changing, a template event firing in it, one of its inputs changing, or `ChangeDetectorRef.markForCheck()`. Nothing else.'],
      ['Propagation to the root','A dirty view marks its ancestors for traversal, so the pass can walk down to it. Ancestors are traversed but not necessarily refreshed, which is why a parent\u2019s bindings do not re-evaluate just because a child changed.'],
      ['OnPush','Skip this view unless it was marked. Since v22 this is the default; the old always-check behaviour is now called `Eager` and must be asked for.'],
      ['count() in the template','A method call, so it runs on every refresh of that view. Deliberately impure here, as instrumentation. In real code this is exactly what you must not do.'],
      ['The zoneless scheduler','Notifications are coalesced, so ten signal writes in one tick produce one pass. `ApplicationRef.tick()` runs a pass by hand; you should not need it outside tests.'],
      ['Signals are finer than views','A signal marks the views that read it. Two sibling components reading different signals are refreshed independently, which is why signals plus OnPush skip so much.'],
      ['Eager','Still available and occasionally correct: a component wrapping a non-Angular widget that mutates plain fields may genuinely need every pass. Prefer fixing the state.']
    ],
    mistakes:[
      ['Calling methods or getters from a template','','They run on every refresh of that view, so a `filter()` in an interpolation is an O(n) operation per pass. Use a `computed`, which runs once per change.'],
      ['Assuming a parent refresh refreshes everything below','','Under `OnPush` it does not: children are only refreshed if something marked them or an input changed. That is the optimisation, and it is why mutation is a silent bug.'],
      ['Reaching for detectChanges() in a component','','It forces a synchronous pass on that view and hides the real problem, which is state that is not reactive. In tests it is normal; in application code it is a smell.'],
      ['Profiling a development build','','Development Angular does extra work and StrictMode-style checks. Compare relative numbers there and measure absolute ones on a production build.']
    ],
    ex:{
      task:'Instrument a list so you can see which rows are refreshed, then make a change that refreshes exactly one row and a change that refreshes all of them. Explain the difference.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`interface Row { id: number; label: string }\n\n@Component({\n  selector: 'app-row',\n  template: \`<li>{{ row().label }} \u2014 refreshed {{ hits() }}\u00d7</li>\`\n})\nclass RowCmp {\n  readonly row = input.required<Row>();\n  private n = 0;\n  protected hits() { return ++this.n; }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [RowCmp],\n  template: \`\n    <ul>@for (r of rows(); track r.id) { <app-row [row]="r" /> }</ul>\n\n    <button (click)="renameOne()">Rename row 2 (one row refreshes)</button>\n    <button (click)="rebuildAll()">Rebuild the array (all rows refresh)</button>\n  \`\n})\nclass App {\n  protected readonly rows = signal<Row[]>([\n    { id: 1, label: 'one' },\n    { id: 2, label: 'two' },\n    { id: 3, label: 'three' }\n  ]);\n\n  // replaces one object, keeps the identity of the other two\n  protected renameOne() {\n    this.rows.update(list =>\n      list.map(r => (r.id === 2 ? { ...r, label: r.label + '!' } : r))\n    );\n  }\n\n  // replaces every object, so every input changed\n  protected rebuildAll() {\n    this.rows.update(list => list.map(r => ({ ...r })));\n  }\n}`,
      why:'Both buttons change the array, and only one of them refreshes every row. `renameOne` replaces a single object, so two of the three `[row]` inputs are still referentially equal and Angular skips those views entirely; the counters prove it. `rebuildAll` produces new objects for all three, so all three inputs changed and all three refresh even though the text is identical. This is the whole reason immutability is not just a signals rule but a performance one: what you keep the same identity of, Angular can skip. It is also why an API layer that rebuilds its objects on every poll makes a large table re-render completely, and why mapping a response onto existing objects by id is sometimes worth the trouble.'
    },
    mm:'Something marks a view, the mark propagates to the root, and the pass refreshes only what was marked, so identity decides what gets skipped.'

  {
    id:'37', file:'defer.ts', t:'@defer and deferrable views',
    what:[
      '`@defer` is a template block whose contents, and the code for them, are loaded only when a trigger fires. It comes with `@placeholder`, `@loading`, and `@error` blocks for the states in between.',
      'Triggers include `on idle`, `on viewport`, `on interaction`, `on hover`, `on timer`, `on immediate`, and `when <condition>`, and each can be paired with a `prefetch` of its own.'
    ],
    why:[
      'Everything in the initial bundle has to be downloaded, parsed, and executed before the page is interactive, including a comment section nobody scrolls to and a chart library only some users see. `@defer` moves that cost to the moment it is needed, and unlike a lazy route it works at the level of a piece of a page.',
      'It is a template feature rather than a code one, which is the interesting part: the compiler works out which components, directives and pipes are used only inside the block and splits them out for you. There is no `import()` to write and no manual loading state.',
      'The trade-off is a request at exactly the moment the user acts, which can feel slower than a slightly larger bundle. That is what `prefetch` is for: load on idle or on hover, render on interaction.'
    ],
    code:`// This is the feature, and it is a template block:\n//\n//   @defer (on viewport; prefetch on idle) {\n//     <app-comments [postId]="id()" />\n//   } @placeholder (minimum 300ms) {\n//     <p>Comments</p>\n//   } @loading (after 100ms; minimum 500ms) {\n//     <p>Loading comments\u2026</p>\n//   } @error {\n//     <p>Comments failed to load.</p>\n//   }\n//\n// Splitting the code requires a bundler, and this page has none, so the\n// snippet below drives the same triggers by hand. The trigger semantics\n// are real; the download is not.\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p>Trigger states, as @defer would see them:</p>\n    <table>\n      <tr><th>Trigger</th><th>Fired</th><th>What @defer does</th></tr>\n      @for (t of triggers(); track t.name) {\n        <tr>\n          <td><code>{{ t.name }}</code></td>\n          <td>{{ t.fired ? 'yes' : 'waiting' }}</td>\n          <td>{{ t.note }}</td>\n        </tr>\n      }\n    </table>\n\n    <button (click)="fire('on interaction')">Interact</button>\n    <span (mouseenter)="fire('on hover')" class="hover">hover me</span>\n    <button (click)="ready.set(true)">Make the condition true</button>\n\n    <p><small>on idle and on timer fire by themselves.</small></p>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; }\n    .hover { border-bottom: 1px dotted #B4005A; margin: 0 8px; }\n  \`\n})\nclass App {\n  protected readonly ready = signal(false);\n\n  private readonly fired = signal<Record<string, boolean>>({});\n\n  protected readonly triggers = computed(() => [\n    { name: 'on immediate', fired: true, note: 'as soon as the page is rendered' },\n    { name: 'on idle', fired: !!this.fired()['on idle'], note: 'requestIdleCallback; v22 adds a timeout, on idle(500ms)' },\n    { name: 'on timer(1s)', fired: !!this.fired()['on timer'], note: 'after a fixed delay' },\n    { name: 'on viewport', fired: !!this.fired()['on viewport'], note: 'IntersectionObserver; v21 added its options' },\n    { name: 'on interaction', fired: !!this.fired()['on interaction'], note: 'click or keydown on the placeholder' },\n    { name: 'on hover', fired: !!this.fired()['on hover'], note: 'mouseenter or focus' },\n    { name: 'when ready()', fired: this.ready(), note: 'any expression; once true it never goes back' }\n  ]);\n\n  protected fire(name: string) {\n    this.fired.update(f => ({ ...f, [name]: true }));\n  }\n\n  constructor() {\n    const idle = (globalThis as any).requestIdleCallback ?? setTimeout;\n    idle(() => this.fire('on idle'));\n    setTimeout(() => this.fire('on timer'), 1000);\n\n    afterNextRender(() => {\n      // what \`on viewport\` uses underneath\n      const io = new IntersectionObserver(entries => {\n        if (entries.some(e => e.isIntersecting)) { this.fire('on viewport'); io.disconnect(); }\n      });\n      io.observe(inject(ElementRef).nativeElement);\n    });\n  }\n}`,
    anno:[
      ['@defer (on viewport)','The block\u2019s dependencies are split into their own chunk and fetched when the placeholder scrolls into view. Nothing inside the block is in the initial bundle.'],
      ['@placeholder (minimum 300ms)','What is shown before the trigger fires. `minimum` stops a flash when the content arrives almost immediately. The placeholder is in the main bundle, so keep it cheap.'],
      ['@loading (after 100ms; minimum 500ms)','Shown while fetching. `after` avoids a flicker on a fast connection; `minimum` avoids a flash on a very fast one.'],
      ['prefetch on idle','Fetch early, render on the real trigger. This is what makes `on interaction` feel instant, and the pairing you will use most.'],
      ['when condition','Any expression. Once it becomes true the block is loaded and stays loaded; it is not a replacement for `@if`.'],
      ['on idle(500ms)','v22 added a timeout to the idle trigger, because a busy page may never be idle and the block would wait for ever.'],
      ['provideIdleServiceWith()','v22. Supply your own `IdleService` if you need to control what "idle" means, for instance in tests.'],
      ['Diagnostics','v21 added compiler warnings for unreachable, duplicated, or ineffective `@defer` triggers, which catches the common mistake of a trigger that can never fire.']
    ],
    mistakes:[
      ['Using @defer as a conditional','','It loads once and stays. If the content should come and go, that is `@if`; if it should keep state while hidden, that is not `@defer` either.'],
      ['A heavy placeholder','','The placeholder ships in the main bundle, so putting the real component there defeats the purpose. Keep it to a skeleton.'],
      ['Deferring something above the fold','','The user waits for a request to see the first screen. Defer what is below the fold, behind an interaction, or genuinely optional.'],
      ['Deferring a component that is also used eagerly elsewhere','','If the same component is in the main bundle for another screen, the split saves nothing. The compiler can only move code used exclusively inside the block.']
    ],
    ex:{
      task:'Decide a trigger and a prefetch for each region of a product page, and write the blocks. Justify each pairing in a comment.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`// The product page, region by region:\n//\n//   <!-- above the fold: not deferred at all -->\n//   <app-gallery [images]="images()" />\n//   <app-buy-box [sku]="sku()" />\n//\n//   <!-- below the fold, always eventually seen: viewport, prefetch on idle -->\n//   @defer (on viewport; prefetch on idle) {\n//     <app-specifications [sku]="sku()" />\n//   } @placeholder { <div class="skeleton"></div> }\n//\n//   <!-- expensive and optional: interaction, prefetch on hover -->\n//   @defer (on interaction; prefetch on hover) {\n//     <app-size-guide />\n//   } @placeholder { <button>Size guide</button> }\n//\n//   <!-- heavy, third-party, rarely used: interaction only, no prefetch -->\n//   @defer (on interaction) {\n//     <app-ar-viewer [sku]="sku()" />\n//   } @placeholder { <button>View in your room</button> }\n//   @loading (after 100ms) { <p>Loading the viewer\u2026</p> }\n//   @error { <p>The viewer is unavailable.</p> }\n//\n//   <!-- data-driven: when, once the user is known to be signed in -->\n//   @defer (when session.isSignedIn()) {\n//     <app-recommendations />\n//   }\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <table>\n      <tr><th>Region</th><th>Trigger</th><th>Why</th></tr>\n      @for (r of plan; track r.region) {\n        <tr><td>{{ r.region }}</td><td><code>{{ r.trigger }}</code></td><td>{{ r.why }}</td></tr>\n      }\n    </table>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; vertical-align: top; }\n  \`\n})\nclass App {\n  protected readonly plan = [\n    { region: 'Gallery and buy box', trigger: 'not deferred',\n      why: 'above the fold and the reason the page exists' },\n    { region: 'Specifications', trigger: 'on viewport; prefetch on idle',\n      why: 'everyone scrolls to it eventually, so pay the cost while the browser is free' },\n    { region: 'Size guide', trigger: 'on interaction; prefetch on hover',\n      why: 'optional, but a hover is a strong hint the click is coming' },\n    { region: 'AR viewer', trigger: 'on interaction',\n      why: 'very heavy and rarely used, so prefetching would waste most users bandwidth' },\n    { region: 'Recommendations', trigger: 'when session.isSignedIn()',\n      why: 'only meaningful for a known user' }\n  ];\n}`,
      why:'The pairing is the skill, not the syntax. The rule of thumb: `on viewport` for things everyone will eventually see, with `prefetch on idle` so the download happens while the browser is doing nothing; `on interaction` with `prefetch on hover` for optional things where a hover predicts the click; and `on interaction` with no prefetch for anything heavy enough that guessing wrong costs the user real bandwidth. Note the AR viewer is the only region with `@loading` and `@error` blocks, because it is the only one where the wait is long enough to need explaining and the failure is likely enough to plan for. Everything above the fold stays in the main bundle, which is the decision people get wrong most often.'
    },
    mm:'@defer splits a piece of a page out of the bundle and loads it on a trigger, and the trigger you pair with prefetch is the whole design.'

  {
    id:'38', file:'lazy-loading.ts', t:'Lazy loading and injectAsync()',
    what:[
      'Three levels of laziness. `loadComponent` and `loadChildren` split at the route, `@defer` splits a piece of a template, and `injectAsync()` splits a service.',
      '`injectAsync()` is new in v22: it lazy-loads a service through a dynamic import while still creating it with dependency injection, and can prefetch it when the browser is idle.'
    ],
    why:[
      'Route splitting is the biggest single win and the easiest to get right, because the boundary is obvious and the router owns the loading state. Most applications should do this before anything else.',
      '`injectAsync` closes a gap the other two leave. A heavy service, a PDF generator, a spreadsheet parser, a charting engine, is not tied to a route or a template block: it is needed when the user presses a button. Before v22 you wrote the dynamic import yourself and lost dependency injection for whatever the service needed.',
      'The prefetch options are what make lazy loading feel fast rather than merely small. Downloading during idle time costs the user nothing they notice; downloading on the click costs them a spinner.'
    ],
    code:`// Real code, all three levels:\n//\n//   // route level\n//   { path: 'reports', loadComponent: () => import('./reports').then(m => m.Reports) }\n//\n//   // template level\n//   @defer (on interaction; prefetch on idle) { <app-chart /> }\n//\n//   // service level, new in v22\n//   export class Admin {\n//     private readonly reports = injectAsync(\n//       () => import('./report.service').then(m => m.ReportService),\n//       { prefetch: onIdle }\n//     );\n//\n//     async exportPdf() {\n//       const service = await this.reports();     // resolved instance, from DI\n//       await service.exportPdf();\n//     }\n//   }\n//\n// A dynamic import needs a module graph, which this page does not have, so\n// the snippet below fakes the import and keeps the rest honest: the promise\n// is cached, the prefetch is real, and the button awaits an instance.\n\n@Service()\nclass Reporting {\n  private readonly clock = inject(Clock);      // it has its own dependencies\n  build(rows: number) { return \`report of \${rows} rows at \${this.clock.now()}\`; }\n}\n\n@Service()\nclass Clock {\n  now() { return new Date().toLocaleTimeString(); }\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <button (click)="run()" [disabled]="busy()">Export a report</button>\n    <button (click)="prefetch()">Prefetch it now</button>\n    <p>module: {{ loaded() ? 'loaded' : 'not loaded yet' }}</p>\n    <p>{{ output() }}</p>\n  \`\n})\nclass App {\n  private readonly injector = inject(EnvironmentInjector);\n\n  protected readonly loaded = signal(false);\n  protected readonly busy = signal(false);\n  protected readonly output = signal('nothing yet');\n\n  // stands in for () => import('./reporting').then(m => m.Reporting)\n  private promise: Promise<typeof Reporting> | null = null;\n  private load() {\n    if (!this.promise) {\n      this.promise = new Promise(resolve =>\n        setTimeout(() => { this.loaded.set(true); resolve(Reporting); }, 900)\n      );\n    }\n    return this.promise;                      // cached: hover then click is one load\n  }\n\n  protected prefetch() { this.load(); }\n\n  protected async run() {\n    this.busy.set(true);\n    const type = await this.load();\n    // created through DI, so its own inject() calls resolve\n    const service = runInInjectionContext(this.injector, () => new type());\n    this.output.set(service.build(120));\n    this.busy.set(false);\n  }\n}`,
    anno:[
      ['loadComponent: () => import(...)','Route-level splitting. The chunk is fetched on first navigation to that route, and the router shows nothing special while it loads.'],
      ['injectAsync(() => import(...))','v22. Returns a function you await to get the instance. Must be called from an injection context, like `inject`, so it goes in a field initialiser.'],
      ['{ prefetch: onIdle }','Starts the download when the browser is idle, so the later await resolves immediately. The service is still only instantiated when you call it.'],
      ['The service must be auto-provided','`injectAsync` needs `@Service()` or `@Injectable({ providedIn: \'root\' })`, because there is nothing to add to a providers array at build time.'],
      ['A default export','If the module default-exports the service, you can pass the import directly: `injectAsync(() => import(\'./report.service\'))`.'],
      ['The promise is cached','A dynamic import resolves once and the module registry keeps it, which is what makes prefetching on hover free rather than a second request.'],
      ['Preloading strategies','`provideRouter(routes, withPreloading(PreloadAllModules))` downloads every lazy route after the app starts. Blunt, and often the right call for an internal tool.'],
      ['Chunk optimisation','v22 enables the lazy-chunk merging from v18.1 by default in production, so a hundred tiny chunks become a sensible number. `NG_BUILD_OPTIMIZE_CHUNKS=0` turns it off.']
    ],
    mistakes:[
      ['Calling injectAsync in a handler','NG0203: inject() must be called from an injection context','Same rule as `inject`. Declare it as a field; await it in the handler.'],
      ['Splitting too finely','','Fifty small chunks means fifty requests and worse compression than one bundle. Split at routes, at heavy leaves, and at services that are genuinely large.'],
      ['Lazy loading something used on the first screen','','The user pays a request to see the page they asked for. Measure what is actually on the critical path before splitting it.'],
      ['Forgetting the failure case','','A chunk request can fail, especially after a deploy renames files. Handle the rejection, and consider a reload prompt rather than a dead button.']
    ],
    ex:{
      task:'Take a dashboard with four widgets and write the loading plan: which are eager, which are deferred, which service is lazy, and where prefetch goes.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
