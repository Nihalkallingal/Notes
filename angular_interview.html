  {
    id:'11', file:'signal.ts', t:'signal(): the reactive primitive',
    what:[
      'A signal is a value that knows who is reading it. You read it by calling it, `count()`, and you write it with `set()` or `update()`.',
      'When a signal changes, everything that read it is told: templates re-render, `computed()` values recalculate, and `effect()` functions run. Nothing else in the application is touched.'
    ],
    why:[
      'A plain field cannot tell anyone it changed, so a framework has only two options: check everything after every possible cause of a change, which is what Zone.js did, or make you say when something changed by hand. Neither scales well.',
      'A signal makes the dependency explicit at the moment of reading. That is what lets Angular update exactly the views that read the value that changed, and it is why applications are zoneless by default since v21: with signals there is nothing left to guess.',
      'Signals are stable since v20. They are not a competitor to RxJS; they describe state that has a current value, where RxJS describes events over time. Lesson 18 is the decision.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p>count is {{ count() }}, doubled is {{ count() * 2 }}</p>\n    <button (click)="count.set(0)">Reset</button>\n    <button (click)="count.update(n => n + 1)">+1</button>\n    <button (click)="addThree()">+3</button>\n\n    <p>name: {{ user().name }}, role: {{ user().role }}</p>\n    <button (click)="promote()">Promote</button>\n    <button (click)="renameBadly()">Rename by mutating (does nothing)</button>\n  \`\n})\nclass App {\n  protected readonly count = signal(0);\n  protected readonly user = signal({ name: 'Ada', role: 'member' });\n\n  protected addThree() {\n    // update() receives the current value, so three calls compose\n    this.count.update(n => n + 1);\n    this.count.update(n => n + 1);\n    this.count.update(n => n + 1);\n  }\n\n  protected promote() {\n    // a NEW object, so the signal sees a change\n    this.user.update(u => ({ ...u, role: 'admin' }));\n  }\n\n  protected renameBadly() {\n    // mutating in place: same reference, no notification, no re-render\n    this.user().name = 'Grace';\n  }\n}`,
    anno:[
      ['const count = signal(0)','Creates a WritableSignal<number>. The type is inferred from the initial value; signal<string | null>(null) is the form when inference is not enough.'],
      ['count()','Reading. Inside a template or a computed, this also registers a dependency, which is the whole mechanism. Outside those contexts it is just a getter.'],
      ['count.set(0)','Replaces the value. Use it when the new value does not depend on the old one.'],
      ['count.update(n => n + 1)','Derives the new value from the current one. Prefer it whenever the next value depends on the previous, exactly as you would with any other atomic update.'],
      ['this.user.update(u => ({ ...u, role: \'admin\' }))','Objects in signals follow the immutability rule: produce a new object. A spread is the usual way.'],
      ['this.user().name = \'Grace\'','The silent failure. The reference did not change, so the signal has nothing to report, and the screen keeps the old value until something unrelated re-renders. If a change does not appear, look for a mutation first.'],
      ['signal(v, { equal: fn })','A custom equality check. By default signals use Object.is, so setting a signal to a value that is already equal notifies nobody.'],
      ['readonly count = signal(0)','`readonly` on the field, not on the signal: it stops you reassigning the field, and the signal itself is still writable. This is the conventional declaration.']
    ],
    mistakes:[
      ['Forgetting the parentheses in a template','NG9: Type \'WritableSignal<number>\' is not assignable to type \'number\'.','`{{ count }}` renders the function, or fails template type checking. Signals are read by calling them.'],

      ['Calling set() inside a computed or a template expression','NG0600: Writing to signals is not allowed in a `computed` or an `effect` by default.','Reads happen during rendering; writes belong in event handlers and services. If you feel the need to write during a computation, you probably want `computed()` or `linkedSignal()`.'],
      ['Reaching for a signal for everything','','A value that never changes should be a plain readonly field. Signals cost a little machinery and a pair of parentheses, and they buy nothing for a constant.']
    ],
    ex:{
      task:'Build a to-do list held in one signal: add an item, toggle one by id, and remove one, all without mutating. Show the remaining count.',
      start:`interface Task { id: number; title: string; done: boolean }\n\n@Component({\n  selector: 'app-root',\n  template: \`<p>your template</p>\`\n})\nclass App {\n  protected readonly tasks = signal<Task[]>([\n    { id: 1, title: 'Read', done: false }\n  ]);\n}`,
      sol:`interface Task { id: number; title: string; done: boolean }\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <input #box placeholder="new task" (keyup.enter)="add(box.value); box.value = ''" />\n    <button (click)="add(box.value); box.value = ''">Add</button>\n\n    <ul>\n      @for (t of tasks(); track t.id) {\n        <li>\n          <label>\n            <input type="checkbox" [checked]="t.done" (change)="toggle(t.id)" />\n            {{ t.done ? '\u2014 ' + t.title : t.title }}\n          </label>\n          <button (click)="remove(t.id)">remove</button>\n        </li>\n      } @empty {\n        <li>Nothing left.</li>\n      }\n    </ul>\n    <p>{{ remaining() }} of {{ tasks().length }} still to do</p>\n  \`\n})\nclass App {\n  protected readonly tasks = signal<Task[]>([\n    { id: 1, title: 'Read', done: false },\n    { id: 2, title: 'Write', done: true }\n  ]);\n\n  // derived, so it can never disagree with the list\n  protected readonly remaining = computed(() =>\n    this.tasks().filter(t => !t.done).length\n  );\n\n  private nextId = 3;\n\n  protected add(title: string) {\n    if (!title.trim()) return;\n    this.tasks.update(list => [...list, { id: this.nextId++, title, done: false }]);\n  }\n\n  protected toggle(id: number) {\n    this.tasks.update(list =>\n      list.map(t => (t.id === id ? { ...t, done: !t.done } : t))\n    );\n  }\n\n  protected remove(id: number) {\n    this.tasks.update(list => list.filter(t => t.id !== id));\n  }\n}`,
      why:'Every mutation goes through `update()` and returns a new array, and the one object that changed is replaced with a copy while the others keep their identity. That last detail matters more than it looks: `track t.id` keeps the DOM rows stable, and unchanged objects mean a memoised child would see unchanged inputs. The count is a `computed()` rather than a second signal, which is lesson 12 and the single most useful habit in a signals codebase. Note `#box` and `(keyup.enter)`: a template reference variable plus a key-specific event binding, both plain template syntax rather than anything to do with signals.'
    },
    mm:'A signal is a value that reports its own changes to whoever read it, so state and its dependents stay in step without anyone checking.'
  },
  {
    id:'12', file:'computed.ts', t:'computed(): derived state',
    what:[
      '`computed()` creates a read-only signal from a function of other signals. It recalculates when one of the signals it read has changed, caches the result, and does nothing at all until something reads it.',
      'It is the answer to "I have a value that is a function of other values". Almost every field you were about to keep in step by hand is a computed.'
    ],
    why:[
      'Two pieces of state that describe the same thing can disagree, and eventually will. Storing `items` and `total` means every code path that changes one must remember the other; computing `total` from `items` makes disagreement impossible.',
      'Laziness and caching are what make it cheap. A computed that nothing reads never runs; a computed whose inputs have not changed returns the cached value without running. That is the difference from a getter or a method call in a template, which re-runs on every check.',
      'The dependencies are tracked at run time, per execution. A computed that returns early does not depend on the signals it did not reach, which is both powerful and the source of the one surprising behaviour: dependencies can change from one run to the next.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <input [value]="query()" (input)="query.set($any($event.target).value)" placeholder="filter" />\n    <label><input type="checkbox" [checked]="inStockOnly()" (change)="inStockOnly.set(!inStockOnly())" /> in stock only</label>\n\n    <ul>\n      @for (p of visible(); track p.id) {\n        <li>{{ p.name }} \u2014 \u00a3{{ p.price }} {{ p.stock ? '' : '(out of stock)' }}</li>\n      } @empty {\n        <li>No matches.</li>\n      }\n    </ul>\n\n    <p>{{ visible().length }} of {{ products().length }} shown, subtotal \u00a3{{ subtotal() }}</p>\n    <p>computed runs so far: {{ runs }}</p>\n    <button (click)="touch()">Change something unrelated</button>\n  \`\n})\nclass App {\n  protected readonly products = signal([\n    { id: 1, name: 'Mug', price: 8, stock: true },\n    { id: 2, name: 'Poster', price: 14, stock: false },\n    { id: 3, name: 'Mousemat', price: 12, stock: true }\n  ]);\n  protected readonly query = signal('');\n  protected readonly inStockOnly = signal(false);\n  protected unrelated = signal(0);\n  protected runs = 0;\n\n  // one derivation, two dependencies, recalculated only when they change\n  protected readonly visible = computed(() => {\n    this.runs++;\n    const q = this.query().toLowerCase();\n    return this.products().filter(p =>\n      p.name.toLowerCase().includes(q) && (!this.inStockOnly() || p.stock)\n    );\n  });\n\n  // a computed built on a computed: this is normal and cheap\n  protected readonly subtotal = computed(() =>\n    this.visible().reduce((sum, p) => sum + p.price, 0)\n  );\n\n  protected touch() {\n    this.unrelated.update(n => n + 1);\n  }\n}`,
    anno:[
      ['computed(() => ...)','Returns a Signal<T>, read-only. There is no set() on it, which is the point: the only way to change it is to change what it derives from.'],
      ['this.query()','Reading a signal inside the computation registers it as a dependency. No dependency array, no list to keep in step: the tracking is the reading.'],
      ['this.runs++','Instrumentation to make the caching visible. Press the unrelated button and the counter does not move, because nothing the computation read has changed.'],
      ['subtotal = computed(() => this.visible()...)','Computeds compose. Angular\u2019s graph is a directed graph, so a value shared by three computeds is calculated once, not three times.'],
      ['Lazy','A computed that nothing reads never runs. Wrap something expensive in a computed and hide it behind an `@if`, and the cost disappears while it is hidden.'],
      ['$any($event.target).value','A template escape hatch for the DOM event type. With `strictTemplates` on by default since v22, `$event.target.value` does not type check; `$any()` silences it, and lesson 32 shows the better way with signal forms.'],
      ['untracked(() => x())','Reads a signal without depending on it. Occasionally what you want inside a computation, and a smell if you need it often.']
    ],
    mistakes:[
      ['Keeping derived state in its own signal','','`total = signal(0)` next to an `items` signal is a bug that has not happened yet, plus an effect to keep them in step. Delete both and compute.'],
      ['Writing to a signal inside a computed','NG0600: Writing to signals is not allowed in a `computed` or an `effect` by default.','A computation must be pure. It may be re-run, skipped, or run in a different order, and Angular relies on that freedom.'],
      ['Side effects in a computation','','No HTTP, no logging you care about, no `Date.now()`. A computed is a cache: it must return the same output for the same inputs, or the cache is lying.'],
      ['Expecting a computed to run eagerly','','It runs when it is first read, not when its source changes. If you need something to happen the moment a value changes, that is an `effect()`, lesson 13.']
    ],
    ex:{
      task:'Build a form summary from three signals: a subtotal, a shipping cost that is free over \u00a350, and a total. Add a validity flag. Store nothing that can be derived.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your template</p>\`\n})\nclass App {\n  protected readonly items = signal([{ name: 'Mug', price: 8, qty: 2 }]);\n  protected readonly express = signal(false);\n}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    @for (i of items(); track i.name) {\n      <p>{{ i.name }} \u00d7 {{ i.qty }} = \u00a3{{ i.price * i.qty }}</p>\n    }\n    <button (click)="addMug()">Add a mug</button>\n    <label><input type="checkbox" [checked]="express()" (change)="express.set(!express())" /> express</label>\n\n    <hr />\n    <p>subtotal: \u00a3{{ subtotal() }}</p>\n    <p>shipping: {{ shipping() === 0 ? 'free' : '\u00a3' + shipping() }}</p>\n    <p><strong>total: \u00a3{{ total() }}</strong></p>\n    <p>{{ canCheckout() ? 'Ready to check out.' : 'Add something first.' }}</p>\n  \`\n})\nclass App {\n  protected readonly items = signal([{ name: 'Mug', price: 8, qty: 2 }]);\n  protected readonly express = signal(false);\n\n  protected readonly subtotal = computed(() =>\n    this.items().reduce((sum, i) => sum + i.price * i.qty, 0)\n  );\n\n  protected readonly shipping = computed(() => {\n    if (this.subtotal() === 0) return 0;\n    if (this.subtotal() > 50) return this.express() ? 5 : 0;\n    return this.express() ? 9 : 4;\n  });\n\n  protected readonly total = computed(() => this.subtotal() + this.shipping());\n  protected readonly canCheckout = computed(() => this.items().length > 0 && this.total() > 0);\n\n  protected addMug() {\n    this.items.update(list =>\n      list.map(i => (i.name === 'Mug' ? { ...i, qty: i.qty + 1 } : i))\n    );\n  }\n}`,
      why:'Two signals hold what the user changed; four computeds hold everything implied by it. Add a mug and the subtotal, the shipping band, the total, and the checkout flag all follow from one `update()` call, which is four bugs that no longer exist. Notice that `shipping` reads `subtotal`, and `total` reads both: the graph is calculated once per change, in dependency order, not once per reader. Notice also that `shipping` only reads `express()` on some paths, so when the subtotal is zero it genuinely does not depend on the checkbox, and toggling it recomputes nothing.'
    },
    mm:'If a value can be calculated from other signals, compute it: a computed is cached, lazy, and cannot fall out of step.'
  },
  {
    id:'13', file:'effect.ts', t:'effect(): and when not to use one',
    what:[
      '`effect()` runs a function when the signals it reads have changed. It is for making something outside Angular match your state: writing to storage, logging, driving a third-party library, calling a browser API.',
      'It is not for deriving values. If the output of the function is a value your app reads, you wanted `computed()`.'
    ],
    why:[
      'Rendering and computing must be pure, so there has to be one place where impure work is allowed. `effect()` is that place, and it runs after change detection, which means the DOM already reflects the state it is reacting to.',
      'The reason to be strict about the boundary is that effects have no return value and no caching, so a derivation written as an effect needs a second signal to hold the result, an extra render to publish it, and a moment where the two disagree. Every one of those is a defect waiting for a deadline.',
      'Angular no longer blocks writing to a signal from inside an effect: the `allowSignalWrites` flag was retired in v19. That makes it easier to write the wrong thing, so the discipline is now yours rather than the compiler\u2019s.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p>query: {{ query() }} (title and log are side effects)</p>\n    <input [value]="query()" (input)="query.set($any($event.target).value)" placeholder="type" />\n    <button (click)="pollMs.update(ms => ms === 1000 ? 300 : 1000)">\n      poll every {{ pollMs() }}ms\n    </button>\n    <p>ticks: {{ ticks() }}</p>\n    <pre>{{ history().join('\\n') }}</pre>\n  \`\n})\nclass App {\n  protected readonly query = signal('');\n  protected readonly pollMs = signal(1000);\n  protected readonly ticks = signal(0);\n  protected readonly history = signal<string[]>([]);\n\n  constructor() {\n    // 1. a side effect: something outside Angular must match our state\n    effect(() => {\n      document.title = this.query() ? 'Searching: ' + this.query() : 'Angular';\n      this.history.update(h => ['title \u2192 ' + document.title, ...h].slice(0, 4));\n    });\n\n    // 2. an effect that owns a resource, with cleanup\n    effect(onCleanup => {\n      const id = setInterval(() => this.ticks.update(n => n + 1), this.pollMs());\n      onCleanup(() => clearInterval(id));   // runs before the next run, and on destroy\n    });\n  }\n}`,
    anno:[
      ['effect(() => { ... })','Must be created in an injection context: a constructor or a field initialiser. Outside one, pass an injector: `effect(fn, { injector })`.'],
      ['document.title = this.query()','The shape of a legitimate effect: read state, push it somewhere Angular does not manage.'],
      ['effect(onCleanup => { ... })','The function receives a cleanup registration. Whatever you pass to `onCleanup` runs before the next execution and once more when the effect is destroyed.'],
      ['this.pollMs()','Read inside the effect, so changing the interval tears down the old timer and starts a new one. Dependencies are tracked by reading, exactly as in a computed.'],
      ['Destruction','An effect created in a component is destroyed with the component. That is why there is no `unsubscribe`, and why creating one outside an injection context is an error rather than a leak.'],
      ['Timing','Effects run after change detection, so the DOM is up to date when they run. For work that must read layout, use `afterNextRender`, lesson 19.'],
      ['this.ticks.update(...) inside an effect','Legal since v19 and worth a second look every time. Here the timer is genuinely an external source of change, so the effect is the right owner.']
    ],
    mistakes:[
      ['Using an effect to derive state','','`effect(() => this.total.set(sum(this.items())))` costs an extra signal, an extra render, and a window where total and items disagree. `computed()` costs nothing.'],
      ['Creating an effect outside an injection context','NG0203: effect() can only be used within an injection context such as a constructor, a factory function, a field initializer, or a function used with `runInInjectionContext`.','Move it to the constructor or a field initialiser, or pass `{ injector: inject(Injector) }` and create it later.'],
      ['Setting up a subscription with no cleanup','','Every mount adds another timer or listener. Use the `onCleanup` argument; it exists for exactly this.'],
      ['Reacting to a user event with an effect','','The click handler is already the right place. An effect watching a flag runs later, runs on the first pass too, and separates the cause from the consequence.']
    ],
    ex:{
      task:'Persist a preference to localStorage whenever it changes, read it back on startup, and make sure a storage failure cannot take the page down.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your template</p>\`\n})\nclass App {\n  protected readonly theme = signal<'light' | 'dark'>('light');\n}`,
      sol:`const KEY = 'ng-course.theme';\n\nfunction readTheme(): 'light' | 'dark' {\n  try {\n    return localStorage.getItem(KEY) === 'dark' ? 'dark' : 'light';\n  } catch {\n    return 'light';                      // private mode, quota, no storage\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <div [class.dark]="theme() === 'dark'" class="panel">\n      <p>theme is {{ theme() }} (reload the page: it is remembered)</p>\n      <button (click)="theme.set(theme() === 'dark' ? 'light' : 'dark')">Toggle</button>\n      <p class="note">{{ status() }}</p>\n    </div>\n  \`,\n  styles: \`\n    .panel { border: 1px solid #CFCCD6; padding: 10px; }\n    .panel.dark { background: #1A1922; color: #E3E1EA; }\n    .note { font-size: 12px; opacity: .8; }\n  \`\n})\nclass App {\n  // initial value comes from storage, not from an effect\n  protected readonly theme = signal<'light' | 'dark'>(readTheme());\n  protected readonly status = signal('loaded from storage');\n\n  constructor() {\n    effect(() => {\n      const value = this.theme();          // the dependency\n      try {\n        localStorage.setItem(KEY, value);\n        this.status.set('saved at ' + new Date().toLocaleTimeString());\n      } catch {\n        this.status.set('could not save: storage unavailable');\n      }\n    });\n  }\n}`,
      why:'The read happens once, in the initial value, because reading storage on startup is not a reaction to anything. The write is an effect, because it is a reaction and it touches something outside Angular. Both are wrapped, since `localStorage` throws rather than returning null in Safari private mode and when the quota is full, and a preference should never be able to break the page. Note that `status` is set from inside the effect and that is fine here: it reports on the side effect itself rather than deriving anything, so there is no second source of truth.'
    },
    mm:'An effect pushes state outward to things Angular does not manage; anything that produces a value your app reads is a computed instead.'
  },
  {
    id:'14', file:'linked-signal.ts', t:'linkedSignal(): state that follows a source',
    what:[
      '`linkedSignal()` creates a writable signal whose value resets from a source whenever that source changes. You can set it like any signal, and the next change to the source overwrites your value.',
      'It is the answer to a specific shape: local state that the user controls, but that should start again when the thing it belongs to changes.'
    ],
    why:[
      'A `computed()` cannot be written, and a plain `signal()` never follows anything. Between them sits a very common case: a selected row that should reset when the list is refetched, a quantity that should go back to one when the product changes, a page number that should return to the first page when the filter changes.',
      'Before this existed the pattern was an effect that watched the source and wrote to a signal, which meant an extra render, a moment of inconsistency, and a rule spread across two places. `linkedSignal` states the relationship where the state is declared.',
      'The two-argument form gives the computation both the new source value and the previous state, which is what you need when the reset should be conditional rather than absolute.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p>Shipping option resets when the country changes:</p>\n    <button (click)="country.set('UK')">UK</button>\n    <button (click)="country.set('FR')">FR</button>\n    <p>country: {{ country() }}</p>\n\n    @for (o of options(); track o) {\n      <button (click)="choice.set(o)" [style.font-weight]="o === choice() ? 600 : 400">\n        {{ o }}\n      </button>\n    }\n    <p>chosen: {{ choice() }}</p>\n\n    <hr />\n    <p>Quantity keeps your number if it still fits the new stock level:</p>\n    <button (click)="stock.set(3)">stock 3</button>\n    <button (click)="stock.set(20)">stock 20</button>\n    <p>stock: {{ stock() }}, quantity: {{ qty() }}</p>\n    <button (click)="qty.update(n => n + 1)">+1</button>\n  \`\n})\nclass App {\n  protected readonly country = signal<'UK' | 'FR'>('UK');\n\n  protected readonly options = computed(() =>\n    this.country() === 'UK' ? ['standard', 'next-day'] : ['standard', 'international']\n  );\n\n  // short form: reset to the first option whenever the options change\n  protected readonly choice = linkedSignal(() => this.options()[0]);\n\n  protected readonly stock = signal(20);\n\n  // long form: keep the previous value when it is still valid\n  protected readonly qty = linkedSignal<number, number>({\n    source: () => this.stock(),\n    computation: (stock, previous) =>\n      previous && previous.value <= stock ? previous.value : 1\n  });\n}`,
    anno:[
      ['linkedSignal(() => this.options()[0])','The short form. It behaves like a computed until you write to it, and the next change to anything the computation read discards your write.'],
      ['this.choice.set(o)','Writable, unlike a computed. Pick "next-day", then switch country: your choice is gone because the options changed, which is the behaviour you wanted.'],
      ['{ source, computation }','The long form. `source` is what triggers the reset; `computation` receives the new source value and a snapshot of the previous state.'],
      ['previous.value <= stock ? previous.value : 1','A conditional reset. Set the quantity to 2, switch stock from 20 to 3, and it survives; set it to 10 first and it falls back to 1. This is the case a plain reset cannot express.'],
      ['previous','Either undefined on the first run, or `{ source, value }` from the last time. Guarding for undefined is required.'],
      ['The effect version','`effect(() => this.choice.set(this.options()[0]))` looks equivalent and is worse: it publishes one render later, so for one frame the choice belongs to the old country.']
    ],
    mistakes:[
      ['Using it where a computed would do','','If nothing ever writes to the value, it is a computed. `linkedSignal` exists for values with two owners: the user and the source.'],
      ['Expecting a write to survive a source change','','It will not, by design. If your value should survive, that is what the `previous` argument in the long form is for.'],
      ['Forgetting the undefined case','TypeError: Cannot read properties of undefined (reading \'value\')','`previous` is undefined on the first computation. Guard it.'],
      ['Reaching for an effect to sync two signals','','That is the pattern `linkedSignal` replaced. If you find yourself writing a signal from an effect that reads another signal, this is the tool.']
    ],
    ex:{
      task:'Build a paged list where changing the filter resets to page one, but changing the page size keeps you on a page that still exists.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your template</p>\`\n})\nclass App {\n  protected readonly filter = signal('');\n  protected readonly pageSize = signal(3);\n}`,
      sol:`const ROWS = Array.from({ length: 23 }, (_, i) => 'row ' + (i + 1));\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <input [value]="filter()" (input)="filter.set($any($event.target).value)" placeholder="filter, try 1" />\n    <button (click)="pageSize.update(n => n === 3 ? 8 : 3)">page size {{ pageSize() }}</button>\n\n    <ul>\n      @for (r of pageRows(); track r) { <li>{{ r }}</li> }\n      @empty { <li>no matches</li> }\n    </ul>\n\n    <button (click)="page.update(p => Math.max(1, p - 1))" [disabled]="page() === 1">prev</button>\n    <span>page {{ page() }} of {{ pageCount() }}</span>\n    <button (click)="page.update(p => Math.min(pageCount(), p + 1))"\n            [disabled]="page() === pageCount()">next</button>\n  \`\n})\nclass App {\n  protected readonly filter = signal('');\n  protected readonly pageSize = signal(3);\n\n  protected readonly matches = computed(() =>\n    ROWS.filter(r => r.includes(this.filter()))\n  );\n  protected readonly pageCount = computed(() =>\n    Math.max(1, Math.ceil(this.matches().length / this.pageSize()))\n  );\n\n  // resets to 1 when the filter changes; clamps when the page count shrinks\n  protected readonly page = linkedSignal<{ f: string; count: number }, number>({\n    source: () => ({ f: this.filter(), count: this.pageCount() }),\n    computation: (source, previous) => {\n      if (!previous) return 1;\n      if (previous.source.f !== source.f) return 1;      // new filter, start again\n      return Math.min(previous.value, source.count);      // same filter, stay put\n    }\n  });\n\n  protected readonly pageRows = computed(() => {\n    const start = (this.page() - 1) * this.pageSize();\n    return this.matches().slice(start, start + this.pageSize());\n  });\n}`,
      why:'The source is an object holding both things the page depends on, so one `linkedSignal` expresses two different rules: a new filter is a new search and belongs on page one, while a bigger page size is the same search seen differently and should keep you roughly where you were. Comparing `previous.source.f` with the new one is how you tell which of the two changed, which is the reason the long form hands you the previous source and not just the previous value. Everything else is a computed, so there is exactly one writable piece of state on the screen that the user controls directly, and it cannot point at a page that does not exist.'
    },
    mm:'linkedSignal is writable state with a source: you own it until the source changes, and then the source wins.'
  },
  {
    id:'15', file:'change-detection.ts', t:'Change detection: OnPush and zoneless by default',
    what:[
      'Change detection is Angular walking the component tree and updating the DOM where a template\u2019s inputs have changed. Two defaults changed recently and both matter: applications are zoneless by default since v21, and components use `OnPush` by default since v22.',
      'Zoneless means Angular no longer patches browser APIs to guess when something happened. `OnPush` means a component is only checked when it has been marked dirty.'
    ],
    why:[
      'Zone.js worked by monkey-patching `setTimeout`, `addEventListener`, `Promise` and the rest, so that any callback anywhere triggered a check of the whole application. It was ingenious and it was expensive, unpredictable in tests, and impossible to reason about in a performance profile.',
      'Signals removed the need for it. A signal read in a template registers a dependency, so Angular can mark exactly the views that read a changed value. That is why zoneless became viable, and why `OnPush` could become the default without breaking everything: signals mark their own readers dirty.',
      'The practical consequence is the one thing to remember. A view is checked when a signal it read changes, when a template event fires in it, when an input changes, or when something calls `markForCheck()`. A plain field mutated from a `setTimeout` or a promise satisfies none of those, so the screen does not update. Under Zone.js it used to.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p>signal: {{ sig() }} \u2014 updates from anywhere</p>\n    <p>plain field: {{ plain }} \u2014 updates only when something marks this view</p>\n\n    <button (click)="bumpBoth()">Bump both, from a click</button>\n    <button (click)="bumpLater()">Bump both, from a setTimeout</button>\n    <button (click)="nudge()">Nudge the view (markForCheck)</button>\n\n    <p class="note">\n      After the timeout, the signal has moved and the plain field looks stuck.\n      Both were incremented. Press Nudge and the truth appears.\n    </p>\n  \`,\n  styles: \`.note { font-size: 12px; color: #55525F; }\`\n})\nclass App {\n  protected readonly sig = signal(0);\n  protected plain = 0;\n\n  private readonly cdr = inject(ChangeDetectorRef);\n\n  protected bumpBoth() {\n    this.sig.update(n => n + 1);\n    this.plain++;            // fine: the click already marks this view dirty\n  }\n\n  protected bumpLater() {\n    setTimeout(() => {\n      this.sig.update(n => n + 1);   // notifies its readers, so the view updates\n      this.plain++;                  // nothing knows, so the text stays stale\n    }, 400);\n  }\n\n  protected nudge() {\n    this.cdr.markForCheck();\n  }\n}`,
    anno:[
      ['Zoneless by default (v21)','`provideZoneChangeDetection()` is what you add to go back to Zone.js. New projects are generated zoneless, and the v21 migration adds that provider to existing apps that needed it.'],
      ['OnPush by default (v22)','A component with no `changeDetection` property now uses `OnPush`. The old `Default` strategy was renamed `Eager`, and the v22 migration writes `changeDetection: ChangeDetectionStrategy.Eager` into every component that did not specify one.'],
      ['What marks a view dirty','A signal read in its template changing, a template event binding firing, an input changing, an async pipe emitting, or an explicit `markForCheck()`.'],
      ['setTimeout(() => this.plain++)','The trap. No signal, no event binding, no input: nothing tells Angular. The value really did change; only the screen is out of date.'],
      ['inject(ChangeDetectorRef)','The escape hatch. `markForCheck()` marks this view and its ancestors for the next pass. Needing it regularly is a sign the state should be in a signal.'],
      ['fixture.whenStable()','The testing counterpart. Zoneless tests await stability instead of calling `detectChanges()`, which is why the CLI generates `await fixture.whenStable()` since v21.']
    ],
    mistakes:[
      ['Mutating a plain field from an async callback','','The most common zoneless surprise. Put the value in a signal; that is the fix, not `markForCheck()` sprinkled through the file.'],
      ['Assuming an old tutorial\u2019s change detection advice applies','','Anything about `NgZone.run()`, `ApplicationRef.tick()`, or "OnPush is an optimisation you opt into" describes a framework with different defaults from the one you are using.'],
      ['Reaching for detectChanges() in application code','','It forces a synchronous check of this view and is almost always a workaround for state that should be reactive. In tests it is fine; in a component it is a smell.'],
      ['Mutating an object inside a signal and blaming change detection','','`user().name = x` does not notify anyone, because the reference did not change. This looks identical to a change detection problem and is not one.']
    ],
    ex:{
      task:'Take a component that updates a plain field from an interval and make it work under zoneless change detection in two different ways. Say which you would ship.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>elapsed: {{ seconds }}s</p>\`\n})\nclass App {\n  protected seconds = 0;\n\n  constructor() {\n    setInterval(() => this.seconds++, 1000);   // never appears on screen\n  }\n}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p>signal version: {{ seconds() }}s</p>\n    <p>markForCheck version: {{ legacySeconds }}s</p>\n    <p class="note">Both tick. Only the first one is worth shipping.</p>\n  \`,\n  styles: \`.note { font-size: 12px; color: #55525F; }\`\n})\nclass App {\n  // fix 1: make the state reactive\n  protected readonly seconds = signal(0);\n\n  // fix 2: keep the plain field and tell Angular by hand\n  protected legacySeconds = 0;\n\n  private readonly cdr = inject(ChangeDetectorRef);\n  private readonly destroyRef = inject(DestroyRef);\n\n  constructor() {\n    const a = setInterval(() => this.seconds.update(n => n + 1), 1000);\n\n    const b = setInterval(() => {\n      this.legacySeconds++;\n      this.cdr.markForCheck();     // without this, the number never appears\n    }, 1000);\n\n    // one cleanup for both, tied to the component's lifetime\n    this.destroyRef.onDestroy(() => {\n      clearInterval(a);\n      clearInterval(b);\n    });\n  }\n}`,
      why:'The signal version is the one to ship. It says what is true, that the elapsed time is reactive state, and it needs no knowledge of change detection at all: any template reading it updates, including a parent or a sibling that reads it later. The `markForCheck` version works and encodes a rule about Angular\u2019s internals into a component that should only know about seconds. It also fails quietly the moment someone reads `legacySeconds` from a different component. Note `inject(DestroyRef)` with `onDestroy` rather than implementing `ngOnDestroy`: it works in a field initialiser or constructor and keeps setup and teardown next to each other, which is lesson 19.'
    },
    mm:'Nothing updates unless something marks the view: signals do it for you, and a plain field changed from an async callback does not.'
  },
  {
    id:'16', file:'shared-state.ts', t:'Sharing state: services with signals',
    what:[
      'A service is a class Angular can hand to whoever asks for it. Give it signals and it becomes the shared state of your application, with no library involved.',
      'The pattern is small: private writable signals inside, read-only signals exposed with `asReadonly()`, and methods as the only way to change anything.'
    ],
    why:[
      'Components come and go. State that must outlive one screen, the signed-in user, a shopping basket, an open filter set, cannot live in a component, and passing it through five layers of inputs is worse than not having it.',
      'The encapsulation matters more than it looks. If a service exposes a writable signal, any component can set it from anywhere, and a year later nobody can answer "what changes this". Exposing `asReadonly()` and a couple of methods means every possible change has a name and one implementation.',
      'This covers a surprising amount of what people install a state library for. Lesson 39 is about the point where you should reach for one instead.'
    ],
    code:`// @Service() is new in v22: shorthand for @Injectable({ providedIn: 'root' }).\n// It requires inject() for its own dependencies, which is what we use anyway.\n@Service()\nclass Basket {\n  // writable, and private: nothing outside can set it\n  private readonly items = signal<{ id: number; name: string; price: number }[]>([]);\n\n  // the public surface is read-only\n  readonly lines = this.items.asReadonly();\n  readonly count = computed(() => this.items().length);\n  readonly total = computed(() => this.items().reduce((s, i) => s + i.price, 0));\n  readonly isEmpty = computed(() => this.items().length === 0);\n\n  add(name: string, price: number) {\n    this.items.update(list => [...list, { id: Date.now() + list.length, name, price }]);\n  }\n\n  remove(id: number) {\n    this.items.update(list => list.filter(i => i.id !== id));\n  }\n\n  clear() {\n    this.items.set([]);\n  }\n}\n\n@Component({\n  selector: 'app-summary',\n  template: \`\n    <p><strong>{{ basket.count() }} items, \u00a3{{ basket.total() }}</strong></p>\n    @if (!basket.isEmpty()) {\n      <button (click)="basket.clear()">Empty the basket</button>\n    }\n  \`\n})\nclass Summary {\n  // the same instance as the one below: one root injector, one Basket\n  protected readonly basket = inject(Basket);\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Summary],\n  template: \`\n    <button (click)="basket.add('Mug', 8)">Add a mug</button>\n    <button (click)="basket.add('Tote', 12)">Add a tote</button>\n\n    <ul>\n      @for (line of basket.lines(); track line.id) {\n        <li>{{ line.name }} \u00a3{{ line.price }}\n          <button (click)="basket.remove(line.id)">remove</button>\n        </li>\n      } @empty { <li>Empty.</li> }\n    </ul>\n\n    <app-summary />\n  \`\n})\nclass App {\n  protected readonly basket = inject(Basket);\n}`,
    anno:[
      ['@Service()','New in v22, and the same as `@Injectable({ providedIn: \'root\' })`: one instance for the whole application, created the first time somebody injects it, and dropped from the bundle if nobody does. `ng generate service` emits it by default now.'],
      ['private readonly items = signal([])','The only writable reference, and it is private. This is the whole discipline.'],
      ['readonly lines = this.items.asReadonly()','Hands out a `Signal<T>` with no `set` or `update`. Callers can read and depend on it; only the service can change it.'],
      ['readonly total = computed(...)','Derived state belongs in the service too, so every screen gets the same total rather than three implementations of the same reduce.'],
      ['inject(Basket)','Two components, one instance, because both resolve to the root injector. Nothing is passed between them and neither knows the other exists.'],
      ['add(), remove(), clear()','The mutation API. Every change to the basket has a name, which makes the service testable without Angular and greppable a year later.'],
      ['@Injectable({ providedIn: \'root\' })','Still correct, and what you need for anything other than the root scope: lesson 28 covers component-level and route-level providers.']
    ],
    mistakes:[
      ['Exposing a writable signal from a service','','`readonly items = signal([])` lets any component call `set()`. Six months later the reason a value is wrong is "somewhere". Expose `asReadonly()`.'],
      ['Putting server data in a hand-rolled service','','Then you own caching, refetching, loading flags, and race conditions. Since v22 `httpResource()` does that: lesson 31.'],
      ['Providing the service in a component when you wanted a singleton','','Component-level `providers: [Basket]` creates one instance per component instance, so two screens get two baskets. Usually a bug, occasionally exactly right.'],
      ['A service that knows about the DOM or a component','','A service holding state should be plain TypeScript you can unit test without TestBed. If it reaches for `ElementRef`, the logic is in the wrong layer.']
    ],
    ex:{
      task:'Write a Session service holding a nullable user, with `signIn`, `signOut`, and derived `isSignedIn` and `initials`. Use it from two components that do not know about each other.',
      start:`interface User { name: string; email: string }\n\n@Service()\nclass Session {\n  // your code\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`<p>your template</p>\`\n})\nclass App {}`,
      sol:`interface User { name: string; email: string }\n\n@Service()\nclass Session {\n  private readonly current = signal<User | null>(null);\n\n  readonly user = this.current.asReadonly();\n  readonly isSignedIn = computed(() => this.current() !== null);\n  readonly initials = computed(() => {\n    const u = this.current();\n    if (!u) return '';\n    return u.name.split(' ').map(p => p[0]?.toUpperCase() ?? '').slice(0, 2).join('');\n  });\n\n  signIn(user: User) { this.current.set(user); }\n  signOut() { this.current.set(null); }\n}\n\n@Component({\n  selector: 'app-avatar',\n  template: \`\n    @if (session.isSignedIn()) {\n      <span class="avatar" [title]="session.user()!.email">{{ session.initials() }}</span>\n    } @else {\n      <span class="avatar muted">?</span>\n    }\n  \`,\n  styles: \`\n    .avatar { display: inline-flex; width: 28px; height: 28px; align-items: center;\n      justify-content: center; background: #B4005A; color: #FDF2F7; font-size: 12px; }\n    .muted { background: #CFCCD6; color: #55525F; }\n  \`\n})\nclass Avatar {\n  protected readonly session = inject(Session);\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Avatar],\n  template: \`\n    <app-avatar />\n    @if (session.isSignedIn()) {\n      <p>Signed in as {{ session.user()!.name }}</p>\n      <button (click)="session.signOut()">Sign out</button>\n    } @else {\n      <button (click)="session.signIn({ name: 'Ada Lovelace', email: 'ada@example.com' })">\n        Sign in\n      </button>\n    }\n  \`\n})\nclass App {\n  protected readonly session = inject(Session);\n}`,
      why:'The avatar and the root component share a user without either importing the other or passing a prop, because both ask the root injector for the same `Session`. The state is one nullable signal and everything else is derived, so `isSignedIn` and `initials` cannot lag behind the user. Two details worth stealing: the non-null assertion `session.user()!.name` is safe only because it sits inside the `@if (session.isSignedIn())` guard, and the two methods are named after events rather than fields, which is what stops the service turning into a bag of setters.'
    },
    mm:'A service with private writable signals and a read-only surface is shared state with exactly one place that can change it.'
  },
  {
    id:'17', file:'rxjs-interop.ts', t:'RxJS interop: toSignal and toObservable',
    what:[
      'Angular ships two bridges in `@angular/core/rxjs-interop`. `toSignal()` subscribes to an observable and exposes its latest value as a signal. `toObservable()` turns a signal into an observable that emits when it changes.',
      '`toSignal` also handles the unsubscribe: it tears down when the injection context that created it is destroyed.'
    ],
    why:[
      'RxJS is not going anywhere. `HttpClient` returns observables, the router exposes them, and a great deal of existing code and libraries are built on them, so a signals-first component still needs to read from a stream.',
      'The reason to bridge rather than to subscribe by hand is that a manual subscription in a component brings a lifetime problem, a stale-value problem, and a change detection problem. `toSignal` solves all three: the value is always current, the subscription dies with the component, and reading it in a template marks the view dirty.',
      '`toObservable` is the rarer direction. You need it when something downstream genuinely wants a stream: debouncing, `switchMap` to a request, combining with another observable, retry logic. Reaching for it to do something a `computed` could do is a sign of habit rather than need.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p>ticks from an interval: {{ ticks() }}</p>\n    <p>every other tick, doubled: {{ doubled() }}</p>\n\n    <hr />\n    <input [value]="query()" (input)="query.set($any($event.target).value)" placeholder="type fast" />\n    <p>live: {{ query() || '\u2014' }}</p>\n    <p>debounced through RxJS: {{ debouncedQuery() || '\u2014' }}</p>\n  \`\n})\nclass App {\n  // observable -> signal. initialValue avoids a T | undefined type.\n  protected readonly ticks = toSignal(interval(1000), { initialValue: 0 });\n\n  // a signal derived from a bridged signal: ordinary computed\n  protected readonly doubled = computed(() => this.ticks() * 2);\n\n  protected readonly query = signal('');\n\n  // signal -> observable -> operators -> signal again\n  protected readonly debouncedQuery = toSignal(\n    toObservable(this.query).pipe(debounceTime(400)),\n    { initialValue: '' }\n  );\n}`,
    anno:[
      ['toSignal(obs, { initialValue: 0 })','Subscribes immediately. Without `initialValue` the type is `T | undefined`, because there is nothing to show before the first emission.'],
      ['{ requireSync: true }','For observables that emit synchronously on subscribe, such as a `BehaviorSubject`. It removes the undefined from the type and throws if the observable does not actually emit in time.'],
      ['Destruction','`toSignal` must be called in an injection context so it knows when to unsubscribe, or you pass `{ injector }`. There is no `unsubscribe` to forget.'],
      ['toObservable(this.query)','Emits on change, using an effect under the hood, so emissions are not synchronous with the write. Do not rely on the timing for correctness.'],
      ['.pipe(debounceTime(400))','The reason to go back to RxJS: time. Debouncing, throttling, retrying, and racing are what streams are good at. v22 also added an experimental `debounced()` for the signal-only version.'],
      ['errors','An observable that errors makes `toSignal` throw on the next read. Handle failures in the pipe with `catchError` before they reach the bridge.'],
      ['toSignal on an HTTP call','Works, and a resource is usually better: it gives you loading and error states rather than just the value. Lesson 31.']
    ],
    mistakes:[
      ['Subscribing by hand in a component','','Then you own the unsubscribe, and a field holding the latest value, and telling Angular it changed. `toSignal` is three lines shorter and cannot leak.'],
      ['Calling toSignal outside an injection context','NG0203: toSignal() can only be used within an injection context','Declare it as a field or in the constructor, or pass `{ injector }`.'],
      ['Reaching for toObservable to combine two signals','','`computed(() => a() + b())` is the answer. Use the bridge only when you need an operator that is genuinely about time.'],
      ['Forgetting that an errored observable throws on read','','The error surfaces where the signal is read, which is often in a template. Add `catchError` and map failures into a value your template can render.']
    ],
    ex:{
      task:'Take a search box, debounce it through RxJS, switchMap it to a fake request, and expose the result as a signal with loading and error states handled.',
      start:`function fakeSearch(q: string) {\n  return timer(300).pipe(map(() => q.length + ' hits for \\'' + q + '\\''));\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`<p>your template</p>\`\n})\nclass App {\n  protected readonly query = signal('');\n}`,
      sol:`function fakeSearch(q: string) {\n  return timer(300).pipe(map(() => q.length + ' hits for \\'' + q + '\\''));\n}\n\ninterface SearchState { status: 'idle' | 'loading' | 'done'; result: string }\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <input [value]="query()" (input)="query.set($any($event.target).value)" placeholder="search" />\n    @switch (state().status) {\n      @case ('idle') { <p>Type something.</p> }\n      @case ('loading') { <p role="status">Searching\u2026</p> }\n      @case ('done') { <p>{{ state().result }}</p> }\n    }\n  \`\n})\nclass App {\n  protected readonly query = signal('');\n\n  protected readonly state = toSignal(\n    toObservable(this.query).pipe(\n      debounceTime(400),\n      // switchMap abandons the previous request when a new query arrives,\n      // which is what stops an old response overwriting a newer one\n      switchMap(q =>\n        q.trim() === ''\n          ? of<SearchState>({ status: 'idle', result: '' })\n          : fakeSearch(q).pipe(\n              map(result => ({ status: 'done', result }) as SearchState),\n              startWith({ status: 'loading', result: '' } as SearchState)\n            )\n      )\n    ),\n    { initialValue: { status: 'idle', result: '' } as SearchState }\n  );\n}`,
      why:'This is the case where RxJS earns its place: `debounceTime` and `switchMap` together solve debouncing and the race condition in two lines, and neither has a tidy signals-only equivalent today. `switchMap` is the important one, because it cancels the in-flight request when a new query arrives, so the answer on screen always belongs to the text in the box. Everything is folded into one state object with a status union so the template can be a `@switch` rather than three overlapping `@if`s, and `startWith` publishes the loading state without a separate signal. Once you are fetching real data over HTTP, `httpResource()` gives you this shape with the loading and error states built in, which is lesson 31.'
    },
    mm:'toSignal reads a stream as current state and cleans up after itself; toObservable is for when you genuinely need operators about time.'
  },
  {
    id:'18', file:'signals-or-rxjs.ts', t:'Signals or RxJS: how to choose',
    what:[
      'Signals model state: there is always a current value, reading it is synchronous, and dependents update when it changes. RxJS models events over time: there may be no value yet, values arrive later, and the interesting part is often the timing.',
      'A modern Angular application uses both, and the boundary is reasonably crisp once you look at what a value is rather than what it does.'
    ],
    why:[
      'Using one for the other\u2019s job is where the pain comes from. State in a `BehaviorSubject` means every reader needs a subscription, an initial value, and a lifetime; that is what `signal` does in one line. Events in a signal means you lose the events: a signal has a value, not a history, so two identical clicks in a row are indistinguishable.',
      'The team\u2019s direction is signals for state and RxJS where streams are genuinely the right model. That is why `resource()` and Signal Forms both landed as signal APIs in v22 with RxJS variants alongside rather than underneath.',
      'One practical rule settles most cases: if you would describe the value with a noun, it is a signal. If you would describe it with a verb in the past tense, it is an event, and RxJS or an output is the better fit.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <table>\n      <tr><th>Value</th><th>Reach for</th><th>Because</th></tr>\n      @for (row of guide; track row.what) {\n        <tr>\n          <td>{{ row.what }}</td>\n          <td><strong>{{ row.pick }}</strong></td>\n          <td>{{ row.because }}</td>\n        </tr>\n      }\n    </table>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; vertical-align: top; }\n  \`\n})\nclass App {\n  protected readonly guide = [\n    { what: 'the current user', pick: 'signal', because: 'it has a value at all times' },\n    { what: 'a filter or a selection', pick: 'signal', because: 'state the user owns' },\n    { what: 'anything derived from state', pick: 'computed', because: 'cached and cannot drift' },\n    { what: 'server data for a screen', pick: 'httpResource', because: 'value plus loading and error, v22' },\n    { what: 'a debounced search', pick: 'RxJS, then toSignal', because: 'debounceTime and switchMap' },\n    { what: 'websocket messages', pick: 'RxJS', because: 'a stream of events, not a value' },\n    { what: 'retry with backoff', pick: 'RxJS', because: 'operators about time' },\n    { what: 'a click or a submit', pick: 'output or a method', because: 'it is an event, not state' },\n    { what: 'persisting to storage', pick: 'effect', because: 'a push to the outside world' },\n    { what: 'local state that follows a source', pick: 'linkedSignal', because: 'writable, with a reset rule' }\n  ];\n}`,
    anno:[
      ['Noun or past-tense verb','"The selected row" is a signal. "The row was selected" is an event. The test is quick and it is right most of the time.'],
      ['BehaviorSubject as shared state','The pre-signals idiom, and a signal does it with no subscription, no initial-value ceremony, and no lifetime to manage. Migrating these is the highest-value change in an older codebase.'],
      ['Subject for events','Still fine, and often better than a signal, because a stream keeps every emission. An `output()` is usually better still when the consumer is a parent component.'],
      ['switchMap, debounceTime, retry, combineLatest','The operators with no signal equivalent worth having. When you need one, bridge with `toObservable` and come back with `toSignal`.'],
      ['httpResource and rxResource','Both stable since v22. The rx variant exists precisely so an RxJS-based API layer can feed a signals-based component without a rewrite.'],
      ['async pipe','Still works and still marks the view for check. In new code prefer `toSignal`, so the template reads one kind of thing.']
    ],
    mistakes:[
      ['Keeping application state in a BehaviorSubject in new code','','It works, and it is more code, more lifetime management, and a subscription in every reader. This is what signals replaced.'],
      ['Modelling events as signals','','A signal has no history and deduplicates equal values, so two identical events look like one. Use an output, a method call, or a Subject.'],
      ['Rewriting working RxJS for its own sake','','A stable, tested pipeline that uses operators well is not a defect. Convert at the boundary with `toSignal` and spend the effort where state is being kept in streams.'],
      ['Mixing both for the same value','','A signal and an observable holding the same state means two sources of truth and a sync step. Pick the owner, bridge at the edge.']
    ],
    ex:{
      task:'For a dashboard with a date filter, a live feed of events, a chart derived from both, and a save button, say which primitive owns each piece and write the declarations.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`interface Feed { at: string; text: string }\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p>range: {{ range() }}</p>\n    <button (click)="range.set('7d')">7d</button>\n    <button (click)="range.set('30d')">30d</button>\n\n    <p>points in the chart: {{ chart().length }} (recomputed, never stored)</p>\n    <p>latest event: {{ latest()?.text ?? 'waiting\u2026' }}</p>\n    <p>{{ savedAt() ? 'saved at ' + savedAt() : 'not saved' }}</p>\n    <button (click)="save()">Save this view</button>\n  \`\n})\nclass App {\n  // 1. user-owned state: a signal\n  protected readonly range = signal<'7d' | '30d'>('7d');\n\n  // 2. a stream of events from outside: RxJS, bridged for reading\n  private readonly feed = interval(1500).pipe(\n    map(n => ({ at: new Date().toLocaleTimeString(), text: 'event ' + (n + 1) } as Feed))\n  );\n  protected readonly latest = toSignal(this.feed);   // Feed | undefined, honestly\n\n  // 3. derived from both: a computed, cached, never stored\n  protected readonly chart = computed(() => {\n    const days = this.range() === '7d' ? 7 : 30;\n    const seed = this.latest()?.text.length ?? 0;\n    return Array.from({ length: days }, (_, i) => (i * 7 + seed) % 100);\n  });\n\n  // 4. an event with a consequence: a method, not an effect\n  protected readonly savedAt = signal<string | null>(null);\n  protected save() {\n    this.savedAt.set(new Date().toLocaleTimeString());\n  }\n}`,
      why:'Four values, four different owners, each chosen by asking what the value is. The range is a noun the user controls, so a signal. The feed is a series of things that happened, so RxJS, and `toSignal` without an `initialValue` leaves `Feed | undefined` in the type, which is honest: before the first event there is nothing. The chart is arithmetic on the other two, so a computed, and it recalculates when either changes without anyone wiring that up. Saving is a past-tense verb triggered by a click, so it belongs in a method: an effect watching a flag would run on the first pass too and put the cause and the consequence in different places.'
    },
    mm:'Nouns are signals, past-tense verbs are events, and RxJS earns its place where the question is about time.'
  }
  ]
});

</script>

<script>
COURSE.push({
  id:'m3', dir:'03-components', t:'Components in depth', lvl:'Medium',
  lessons:[
  {
    id:'19', file:'lifecycle.ts', t:'Lifecycle: ngOnInit, DestroyRef, afterNextRender',
    what:[
      'A component has a lifecycle: it is constructed, its inputs are set, it renders, it is checked repeatedly, and eventually it is destroyed. Angular offers hooks at each of those moments.',
      'In a signals codebase you need far fewer of them. The ones still worth knowing are `ngOnInit`, destruction through `DestroyRef`, and the render callbacks `afterNextRender` and `afterEveryRender`.'
    ],
    why:[
      'The constructor runs before inputs are set, so anything that depends on an input cannot go there. `ngOnInit` exists for that gap: it runs once, after the first set of inputs has arrived.',
      'Most of the rest have been replaced. `ngOnChanges` was how you reacted to an input changing; a `computed()` that reads the input does it with no hook and no `SimpleChanges` object to unpack. `ngAfterViewInit` was how you waited for a `@ViewChild`; a signal query is simply empty until it is not.',
      '`afterNextRender` fills the one gap signals cannot: work that needs the real DOM, laid out, in a browser. It never runs on the server, which is exactly why it is the right home for a chart library or a measurement.'
    ],
    code:`@Component({\n  selector: 'app-panel',\n  template: \`\n    <div class="panel">\n      <p>title from input: {{ title() }}</p>\n      <p>derived, no ngOnChanges needed: {{ shout() }}</p>\n      <p>measured after render: {{ width() }}px wide</p>\n      <p>log:</p>\n      <ol>@for (line of log(); track $index) { <li>{{ line }}</li> }</ol>\n    </div>\n  \`,\n  styles: \`.panel { border: 1px solid #CFCCD6; padding: 8px; }\`\n})\nclass Panel {\n  readonly title = input.required<string>();\n\n  // reacting to an input: a computed, not a lifecycle hook\n  protected readonly shout = computed(() => this.title().toUpperCase() + '!');\n\n  protected readonly width = signal(0);\n  protected readonly log = signal<string[]>([]);\n\n  private readonly host = inject(ElementRef);\n  private readonly destroyRef = inject(DestroyRef);\n\n  constructor() {\n    this.add('constructor: inputs are NOT set yet');\n\n    // needs the real DOM, so it waits for a render and never runs on the server\n    afterNextRender(() => {\n      this.width.set(Math.round(this.host.nativeElement.getBoundingClientRect().width));\n      this.add('afterNextRender: measured the element');\n    });\n\n    // teardown next to setup, no ngOnDestroy needed\n    const timer = setInterval(() => {}, 1000);\n    this.destroyRef.onDestroy(() => clearInterval(timer));\n  }\n\n  ngOnInit() {\n    this.add('ngOnInit: title is now "' + this.title() + '"');\n  }\n\n  private add(line: string) {\n    this.log.update(l => [...l, line]);\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Panel],\n  template: \`\n    <button (click)="alive.set(!alive())">{{ alive() ? 'Destroy' : 'Create' }} the panel</button>\n    <button (click)="title.set('renamed ' + (n = n + 1))">Rename</button>\n    @if (alive()) { <app-panel [title]="title()" /> }\n  \`\n})\nclass App {\n  protected readonly alive = signal(true);\n  protected readonly title = signal('Traffic');\n  protected n = 0;\n}`,
    anno:[
      ['constructor()','Runs before inputs are set. Use it for `inject()` calls, `effect()`, and `DestroyRef.onDestroy`. Reading a required input here throws.'],
      ['ngOnInit()','Runs once, after the first inputs. The place for setup that needs an input value and is not a derivation.'],
      ['computed(() => this.title()...)','What replaced `ngOnChanges`. If you do need the hook, note the parameter type is generic since v21: `ngOnChanges(changes: SimpleChanges<Panel>)`.'],
      ['inject(DestroyRef).onDestroy(fn)','Destruction as a callback rather than a method. It works in a constructor or a field initialiser, so setup and teardown sit next to each other, and it can be used inside a helper function or a custom hook-like utility.'],
      ['afterNextRender(() => ...)','Runs once, after the next render, in the browser only. For measuring, focusing, or handing an element to a non-Angular library.'],
      ['afterEveryRender(() => ...)','The repeating version, renamed from `afterRender` in v20. Runs after every render, so keep it cheap.'],
      ['{ phase: ... }','Both take a phase option to separate reads from writes and avoid layout thrashing: `earlyRead`, `write`, `mixedReadWrite`, `read`.'],
      ['ngAfterViewInit / ngAfterContentInit','Largely replaced by signal queries, lesson 20, which are simply empty until the view exists.']
    ],
    mistakes:[
      ['Reading a required input in the constructor','NG0950: Input is required but no value is available yet.','Move it to `ngOnInit`, or better, wrap the use in a `computed()` so the read happens when someone asks.'],
      ['Using ngOnChanges to keep a field in step with an input','','That is a derivation, so it is a `computed`. The hook version costs an extra field, an extra render, and a moment where the two disagree.'],
      ['Measuring the DOM in ngOnInit','','Nothing is rendered yet. Use `afterNextRender`, which also has the advantage of not existing on the server.'],
      ['Forgetting that afterEveryRender runs constantly','','Anything expensive in there runs after every render of the application. Prefer `afterNextRender` unless you genuinely need every frame.']
    ],
    ex:{
      task:'Build a component that focuses an input as soon as it appears, reports its own height, and cleans up a resize listener, using no `ngOnDestroy` and no `ngAfterViewInit`.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<input #box placeholder="should be focused" />\`\n})\nclass App {\n  // your code\n}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    <input #box placeholder="focused on render" />\n    <p>host is {{ size().w }} \u00d7 {{ size().h }} px \u2014 resize the window</p>\n  \`,\n  styles: \`:host { display: block; padding: 8px 0; }\`\n})\nclass App {\n  private readonly box = viewChild.required<ElementRef<HTMLInputElement>>('box');\n  private readonly host = inject(ElementRef);\n  private readonly destroyRef = inject(DestroyRef);\n\n  protected readonly size = signal({ w: 0, h: 0 });\n\n  constructor() {\n    // the DOM exists by now, and only in a browser\n    afterNextRender(() => {\n      this.box().nativeElement.focus();\n      this.measure();\n    });\n\n    const onResize = () => this.measure();\n    window.addEventListener('resize', onResize);\n    this.destroyRef.onDestroy(() => window.removeEventListener('resize', onResize));\n  }\n\n  private measure() {\n    const r = this.host.nativeElement.getBoundingClientRect();\n    this.size.set({ w: Math.round(r.width), h: Math.round(r.height) });\n  }\n}`,
      why:'Three lifecycle concerns and not one lifecycle method. The focus and the first measurement need a rendered DOM, so they go in `afterNextRender`, which also means they are skipped during server rendering where `focus()` would throw. The listener is registered in the constructor and removed through `DestroyRef`, so the two halves are three lines apart instead of at opposite ends of the class. The measurement lands in a signal, which is what makes the template update; writing to a plain field here would produce the zoneless bug from lesson 15, because a resize event outside Angular marks nothing dirty.'
    },
    mm:'The constructor is before inputs, ngOnInit is after them, DestroyRef owns teardown, and anything needing the real DOM waits for a render.'
  },
  {
    id:'20', file:'queries.ts', t:'Signal queries: viewChild and contentChild',
    what:[
      'A query gives a component a handle on something in its template. `viewChild()` finds one, `viewChildren()` finds all, and the `contentChild` pair does the same for content projected in from outside.',
      'They return signals. A `viewChild()` is `undefined` until the element exists; a `viewChild.required()` throws if it never does; `viewChildren()` returns an array that changes as the DOM does.'
    ],
    why:[
      'Most communication should be props and events, but some things genuinely need the object: focusing an input, calling `play()` on a video, reading a canvas context, or asking a child component for something only it knows.',
      'The signal versions replaced the decorators for the same reason inputs did. A `@ViewChild` was populated at a particular moment in the lifecycle, so you needed `ngAfterViewInit`, a `static: true` flag when you wanted it earlier, and care with anything behind an `@if`. A signal query is simply empty until it is not, so a `computed()` that reads it recalculates when the answer changes.',
      'That last part is the real gain: a query inside an `@if` or an `@for` now updates as the condition or the list changes, with no hook and no special case.'
    ],
    code:`@Component({\n  selector: 'app-row',\n  template: \`<span>{{ label() }}</span>\`\n})\nclass Row {\n  readonly label = input('row');\n  shout() { return this.label().toUpperCase(); }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Row],\n  template: \`\n    <input #box placeholder="click focus" />\n    <button (click)="focusBox()">Focus the input</button>\n\n    @if (showExtra()) {\n      <p #extra>An element behind an @if.</p>\n    }\n    <button (click)="showExtra.set(!showExtra())">Toggle the extra element</button>\n    <p>extra present: {{ extraPresent() }}</p>\n\n    @for (n of rows(); track n) { <app-row [label]="'row ' + n" /> }\n    <button (click)="rows.update(r => [...r, r.length + 1])">Add a row</button>\n    <p>{{ rowCount() }} child components: {{ shouted() }}</p>\n  \`\n})\nclass App {\n  // one element, by template reference name\n  private readonly box = viewChild.required<ElementRef<HTMLInputElement>>('box');\n\n  // a query that comes and goes with an @if\n  private readonly extra = viewChild<ElementRef<HTMLElement>>('extra');\n  protected readonly extraPresent = computed(() => this.extra() !== undefined);\n\n  // many child components, by type\n  private readonly rowCmps = viewChildren(Row);\n  protected readonly rowCount = computed(() => this.rowCmps().length);\n  protected readonly shouted = computed(() =>\n    this.rowCmps().map(r => r.shout()).join(' ')\n  );\n\n  protected readonly showExtra = signal(false);\n  protected readonly rows = signal([1, 2]);\n\n  protected focusBox() {\n    this.box().nativeElement.focus();\n  }\n}`,
    anno:[
      ["viewChild.required<ElementRef<HTMLInputElement>>('box')",'Queried by the template reference variable `#box`. `required` removes the undefined from the type, and throws if the element is genuinely absent.'],
      ['viewChild(Row)','Queried by component or directive type instead of by name. You get the component instance, so you can call its methods and read its signals.'],
      ['viewChildren(Row)','All matches, as an array signal. It updates when the `@for` grows, which is what makes the count and the joined string in this example work with no hook.'],
      ['{ read: ViewContainerRef }','Asks for something other than the default. `{ read: ElementRef }` on a component gives the host element rather than the instance, and `{ read: ViewContainerRef }` is how you get an insertion point, lesson 25.'],
      ['contentChild / contentChildren','The same, for nodes projected in by a parent through `<ng-content>`. `contentChildren(X, { descendants: true })` looks deeper than the immediate children.'],
      ['A query inside @if','Returns `undefined` while the condition is false and the element itself when it is true. Reading it in a `computed` is how you react to that.'],
      ['@ViewChild(\'box\', { static: true })','The decorator form. Still works; `static` existed because the timing was fixed, which is the problem signal queries removed.']
    ],
    mistakes:[
      ['Reading a query in the constructor','','It is empty: the view does not exist yet. Read it in `afterNextRender`, in an event handler, or inside a `computed` that something reads later.'],
      ['Using a query to pass data down','','If the parent wants the child to know something, that is an input. Queries are for the cases where you need the object itself, and every one of them couples the parent to the child\u2019s internals.'],
      ['Expecting viewChild to find projected content','','Content passed in by a parent belongs to `contentChild`. `viewChild` only sees this component\u2019s own template.'],
      ['Mutating a child component through a query','','Setting a child\u2019s field from the parent bypasses its inputs and its change detection contract. Call a method the child chose to expose, or use an input.']
    ],
    ex:{
      task:'Build a tab strip where the parent queries its projected tab components, tracks which is selected, and moves the selection with the arrow keys.',
      start:`@Component({\n  selector: 'app-tab',\n  template: \`<ng-content />\`\n})\nclass Tab {\n  readonly label = input.required<string>();\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Tab],\n  template: \`<p>your template</p>\`\n})\nclass App {}`,
      sol:`@Component({\n  selector: 'app-tab',\n  template: \`\n    @if (active()) { <div class="body"><ng-content /></div> }\n  \`,\n  styles: \`.body { border-top: 1px solid #CFCCD6; padding: 8px 0; }\`\n})\nclass Tab {\n  readonly label = input.required<string>();\n  readonly active = signal(false);      // the strip sets this\n}\n\n@Component({\n  selector: 'app-strip',\n  template: \`\n    <div role="tablist" (keydown)="onKey($event)" style="display:flex; gap:4px">\n      @for (t of tabs(); track t.label(); let i = $index) {\n        <button role="tab" [attr.aria-selected]="i === index()"\n                [tabindex]="i === index() ? 0 : -1"\n                (click)="index.set(i)"\n                [style.font-weight]="i === index() ? 600 : 400">\n          {{ t.label() }}\n        </button>\n      }\n    </div>\n    <ng-content />\n  \`\n})\nclass Strip {\n  // the tabs are projected in, so this is a CONTENT query\n  private readonly projected = contentChildren(Tab);\n  protected readonly tabs = this.projected;\n  protected readonly index = signal(0);\n\n  constructor() {\n    // one place decides which tab is open, whenever either input changes\n    effect(() => {\n      const i = this.index();\n      this.projected().forEach((t, n) => t.active.set(n === i));\n    });\n  }\n\n  protected onKey(e: KeyboardEvent) {\n    const last = this.projected().length - 1;\n    if (e.key === 'ArrowRight') { e.preventDefault(); this.index.update(i => (i === last ? 0 : i + 1)); }\n    if (e.key === 'ArrowLeft') { e.preventDefault(); this.index.update(i => (i === 0 ? last : i - 1)); }\n    if (e.key === 'Home') { e.preventDefault(); this.index.set(0); }\n    if (e.key === 'End') { e.preventDefault(); this.index.set(last); }\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Strip, Tab],\n  template: \`\n    <app-strip>\n      <app-tab label="Overview">Numbers go here. Use the arrow keys.</app-tab>\n      <app-tab label="History">A list of past events.</app-tab>\n      <app-tab label="Settings">Some checkboxes.</app-tab>\n    </app-strip>\n  \`\n})\nclass App {}`,
      why:'`contentChildren` rather than `viewChildren`, because the tabs are written by the caller and projected in, which is the distinction that trips people up most often. The strip owns one number and pushes `active` onto the tabs from a single effect, so there is exactly one rule deciding what is open; letting each tab work it out would mean three copies of the same comparison. This is a legitimate use of an effect, because it synchronises state into objects the strip does not own, and lesson 31 of the React course would call the same thing a controlled child. The roving `tabindex` and `aria-selected` are what make it a real tab strip rather than three buttons, and `@angular/aria` ships a `Tabs` directive that handles all of it for you, which is lesson 41.'
    },
    mm:'Queries give you the object when props are not enough, and because they are signals they update as the view does.'
  },
  {
    id:'21', file:'content-projection.ts', t:'Content projection with ng-content',
    what:[
      '`<ng-content />` marks the place where a component renders whatever a caller nested inside its tag. It is how you write a card, a dialog, or a layout that knows nothing about its contents.',
      'With a `select` attribute you can have several slots, each taking a different part of the caller\u2019s markup, and since v18 an `<ng-content>` can hold fallback content for when nothing matches.'
    ],
    why:[
      'The alternative to projection is a component with twenty inputs: `title`, `titleIcon`, `subtitle`, `footerButtonLabel`. Every new requirement adds another, the template fills with conditions, and eventually nobody dares touch it.',
      'A component that projects does not need to anticipate anything. The caller supplies a heading, a chart, or a form, and the component only supplies the frame. Fewer inputs, fewer conditions, fewer reasons to edit old code.',
      'The projected nodes belong to the caller, not to the component. They are created in the caller\u2019s context, so their bindings read the caller\u2019s state, and they are checked as part of the caller\u2019s view. That single fact explains everything surprising about projection.'
    ],
    code:`@Component({\n  selector: 'app-card',\n  template: \`\n    <section class="card">\n      <header>\n        <!-- one slot per named part, chosen by CSS selector -->\n        <ng-content select="[card-title]">\n          <strong>Untitled</strong>          <!-- fallback, since v18 -->\n        </ng-content>\n        <span class="spacer"></span>\n        <ng-content select="[card-actions]" />\n      </header>\n\n      <!-- everything that matched nothing above lands here -->\n      <div class="body"><ng-content /></div>\n    </section>\n  \`,\n  styles: \`\n    .card { border: 1px solid #CFCCD6; margin-bottom: 10px; }\n    header { display: flex; align-items: center; gap: 8px;\n             padding: 6px 10px; border-bottom: 1px solid #CFCCD6; }\n    .spacer { flex: 1; }\n    .body { padding: 10px; }\n  \`\n})\nclass Card {}\n\n@Component({\n  selector: 'app-root',\n  imports: [Card],\n  template: \`\n    <app-card>\n      <strong card-title>Traffic</strong>\n      <button card-actions (click)="clicks.set(clicks() + 1)">Export</button>\n      <p>The card has no idea what any of this is.</p>\n      <p>Exported {{ clicks() }} times \u2014 and this binding reads the CALLER's state.</p>\n    </app-card>\n\n    <app-card>\n      <p>No title given, so the fallback appears.</p>\n    </app-card>\n  \`\n})\nclass App {\n  protected readonly clicks = signal(0);\n}`,
    anno:[
      ['<ng-content />','The default slot. Everything not claimed by a `select` lands here. A component may have only one unselected `ng-content`.'],
      ['select="[card-title]"','Any CSS selector: an attribute, a class, or a tag name. Attributes are the usual choice because they do not constrain what element the caller uses.'],
      ['<ng-content select="...">fallback</ng-content>','Content shown when nothing matches the selector. Added in v18; before that you needed a `contentChild` and an `@if`.'],
      ['{{ clicks() }} inside the card','Bound in the caller\u2019s context. The projected node reads `App`, not `Card`, which is why a component cannot pass data into content it did not write.'],
      ['ngProjectAs="[card-title]"','Lets a wrapper element claim a slot it would not otherwise match, which is the escape hatch when the caller has to wrap something in an `ng-container`.'],
      ['contentChild(X)','How the component gets a handle on what was projected, when it needs to coordinate rather than just place it: lesson 20.'],
      ['A slot inside @if','Content is created once, in the caller. Putting `ng-content` inside an `@if` destroys and recreates it, which loses state in the projected nodes; prefer hiding with CSS or restructuring.']
    ],
    mistakes:[
      ['Expecting projected content to read the component\u2019s state','','It cannot. The nodes were written and bound by the caller. If the component must supply data to the content, use an `ng-template` with context instead, lesson 24.'],
      ['Two unselected ng-content slots','','Only the first receives anything. Give the others a `select`.'],
      ['Growing a component with boolean props instead of slots','','Three booleans that are never true together usually mean the caller should be supplying markup. A slot costs one line and never needs editing again.'],
