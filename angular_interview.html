<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angular, end to end</title>
<!--
  A self-contained Angular course. One file, no build step, no ng CLI.

  HOW THE LIVE EXAMPLES WORK, and said once so it is never mistaken for advice:
  Angular normally compiles ahead of time. This page instead loads Angular from
  a CDN as ES modules, imports @angular/compiler to enable the JIT compiler,
  strips the TypeScript with @babel/standalone in the browser, and mounts each
  component with createApplication + createComponent.

  That is a LEARNING-ONLY setup. JIT ships the compiler to the user, compiles on
  every run, and gives up every compile-time template check. Real projects use
  `ng build`, which is AOT. Never do this in production.

  One consequence you will see throughout: every example injects with the
  inject() function rather than through a constructor parameter. Constructor
  injection needs TypeScript's emitDecoratorMetadata, which the browser-side
  transform cannot produce. This is also current Angular style, and v22's
  @Service() decorator requires inject() anyway, so the constraint and the
  recommendation happen to agree.

  Angular is pinned to the 22.x line (v22.0 shipped 3 June 2026).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --paper:#F2F1F4;
  --raise:#FCFBFD;
  --ink:#1B1A22;
  --ink-2:#55525F;
  --rule:#CFCCD6;
  --signal:#B4005A;
  --signal-wash:#F7E6EE;
  --warn:#7A4E00;
  --warn-wash:#F4EEE2;
  --warn-ink:#5A3A00;
  --slab:#1A1922;
  --slab-2:#141319;
  --slab-ink:#E3E1EA;
  --slab-rule:#332F3D;

  --f-ui:Archivo,system-ui,-apple-system,sans-serif;
  --f-prose:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-code:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --s-12:.706rem; --s-13:.765rem; --s-14:.824rem; --s-16:.941rem; --s-17:1rem;
  --s-20:1.176rem; --s-24:1.412rem; --s-28:1.647rem; --s-34:2rem;

  --bar:56px;
  --nav-w:304px;
}
*{box-sizing:border-box}
html{font-size:17px}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 var(--s-17)/1.62 var(--f-prose);
  -webkit-font-smoothing:antialiased;
  /* prose here is full of long API names: let them break rather than
     pushing the page sideways on a phone */
  overflow-wrap:break-word;
}
h1,h2,h3,h4{font-family:var(--f-ui);font-weight:600;line-height:1.2;margin:0}
p{margin:0 0 .8em}
p:last-child{margin-bottom:0}
a{color:var(--signal);text-underline-offset:3px}
code{font:400 .88em/1.5 var(--f-code);background:#E7E5EC;padding:1px 4px;border-radius:2px}
pre.code code,.sheet code{background:none;padding:0}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:1px}
::selection{background:var(--signal-wash)}

.skip{position:absolute;left:-9999px;top:0;z-index:99;background:var(--signal);color:#fff;
  padding:8px 14px;font:600 var(--s-14) var(--f-ui)}
.skip:focus{left:8px;top:8px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;height:var(--bar);
  display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--paper);border-bottom:1px solid var(--rule);
}
.brand{
  font:500 var(--s-14) var(--f-code);letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0;
}
.brand b{color:var(--signal);font-weight:600}
.tabs{display:flex;gap:2px;margin-left:auto;flex:0 0 auto}
.tab{
  font:500 var(--s-14) var(--f-ui);color:var(--ink-2);background:none;border:0;
  padding:7px 11px;border-radius:2px;cursor:pointer;white-space:nowrap;
}
.tab:hover{color:var(--ink);background:var(--signal-wash)}
.tab[aria-selected=true]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--signal)}
.find{
  font:400 var(--s-14) var(--f-ui);color:var(--ink);
  background:var(--raise);border:1px solid var(--rule);border-radius:2px;
  padding:6px 9px;flex:0 1 180px;min-width:0;
}
.find::placeholder{color:var(--ink-2)}
.drawer-btn{
  display:none;font:500 var(--s-14) var(--f-ui);background:none;
  border:1px solid var(--rule);border-radius:2px;padding:5px 9px;cursor:pointer;color:var(--ink);
}
.drawer-btn .short{display:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr)}
.sidebar{
  border-right:1px solid var(--rule);
  height:calc(100vh - var(--bar));position:sticky;top:var(--bar);
  overflow-y:auto;overscroll-behavior:contain;padding:14px 0 60px;
}
.pane{min-width:0;padding:30px 30px 96px}
.pane-inner{max-width:1000px}

/* ---------- the workspace tree ---------- */
.tree{font-family:var(--f-ui)}
.tree-head{
  padding:0 14px 12px;font:400 var(--s-12) var(--f-code);color:var(--ink-2);
}
.mod{margin:0 0 2px}
.mod-h{
  display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:8px;
  padding:11px 14px 6px 10px;font-size:var(--s-14);font-weight:600;letter-spacing:-.005em;
}
.mod-mark{width:8px;height:8px;background:var(--ink-2);justify-self:center}
.mod-h .frac{font:400 var(--s-12) var(--f-code);color:var(--ink-2);font-weight:400}
.mod-h .lvl{display:block;font:400 var(--s-12) var(--f-code);color:var(--ink-2);font-weight:400}
.files{list-style:none;margin:0;padding:0}
.file{position:relative}
/* indent guide: one continuous line per module, tinted where you have been */
.file::before{
  content:"";position:absolute;left:19px;top:0;bottom:0;width:1px;background:var(--rule);
}
.file.walked::before{background:var(--signal)}
.file-b{
  display:grid;grid-template-columns:20px 26px 1fr;align-items:baseline;
  width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:5px 14px 5px 10px;color:var(--ink);font:400 var(--s-14)/1.35 var(--f-ui);
  border-radius:0 2px 2px 0;position:relative;
}
.file-b:hover{background:var(--signal-wash)}
.tick{
  grid-column:1;justify-self:center;align-self:center;
  width:9px;height:1px;background:var(--rule);position:relative;left:4px;
}
.file-b.done .tick,.file-b.here .tick{background:var(--signal)}
.num{font:400 var(--s-12) var(--f-code);color:var(--ink-2);align-self:center}
.file-b .t{padding-top:1px}
.file-b.done .t{color:var(--ink-2)}
.file-b.here{background:var(--signal-wash)}
.file-b.here .t{font-weight:600}
.file-b.here .num{color:var(--signal);font-weight:600}
.file-b[disabled]{cursor:default}
.file-b[disabled] .t{color:var(--ink-2);opacity:.7}
.nav-empty{padding:16px;color:var(--ink-2);font:400 var(--s-14) var(--f-ui)}

/* ---------- lesson ---------- */
.path{
  font:400 var(--s-13) var(--f-code);color:var(--ink-2);margin:0 0 8px;
  word-break:break-all;
}
.path b{color:var(--signal);font-weight:500}
.lesson-h{font-size:var(--s-34);letter-spacing:-.02em;max-width:27ch;margin:0 0 26px;font-weight:700}
.sect{padding:6px 0 22px}
.sect > h3{
  display:flex;align-items:center;gap:12px;
  font:500 var(--s-14) var(--f-code);color:var(--ink-2);
  margin:0 0 12px;letter-spacing:-.01em;
}
.sect > h3::after{content:"";flex:1 1 auto;height:1px;background:var(--rule)}
.sect p,.sect li{max-width:66ch}
.stress{font:400 var(--s-20)/1.5 var(--f-prose);max-width:58ch;margin:0;font-style:italic}

.body ul{margin:0 0 .8em;padding-left:1.1em}
.body li{margin-bottom:.35em}
.legacy{
  display:inline-block;font:500 var(--s-12) var(--f-code);color:var(--warn-ink);
  background:var(--warn-wash);border:1px solid #E2D6BE;padding:1px 6px;border-radius:2px;
}

/* code, static */
pre.code{
  margin:0 0 12px;background:var(--slab);color:var(--slab-ink);
  padding:13px 15px;border-radius:3px;overflow-x:auto;
  font:400 13px/1.65 var(--f-code);tab-size:2;
}

/* annotated walkthrough */
.anno{margin:0}
.anno > div{padding:10px 0;border-bottom:1px solid var(--rule);min-width:0}
.anno > div:last-child{border-bottom:0}
.anno dt{
  font:400 12.5px/1.6 var(--f-code);background:#E6E4EB;color:var(--ink);
  padding:4px 8px;border-radius:2px;display:block;width:fit-content;max-width:100%;
  overflow-x:auto;white-space:pre;
}
.anno dd{margin:6px 0 0;font-size:var(--s-16);max-width:64ch}

/* mistakes */
.mistake{border-left:2px solid var(--warn);padding-left:14px;margin-bottom:18px}
.mistake:last-child{margin-bottom:0}
.mistake h4{font-size:var(--s-16);font-weight:600;margin-bottom:6px}
.msg{
  display:block;font:400 12.5px/1.55 var(--f-code);
  background:var(--warn-wash);color:var(--warn-ink);
  padding:7px 9px;border-radius:2px;margin:7px 0;white-space:pre-wrap;
}
.mistake p{font-size:var(--s-16)}

/* exercise + solution */
.task{font-size:var(--s-16);margin-bottom:12px}
details.sol{border:1px solid var(--rule);border-radius:3px;background:var(--raise);margin-top:12px}
details.sol > summary{
  cursor:pointer;padding:9px 13px;font:600 var(--s-14) var(--f-ui);color:var(--signal);
  list-style:none;
}
details.sol > summary::-webkit-details-marker{display:none}
details.sol > summary::before{content:"+ ";font-family:var(--f-code)}
details.sol[open] > summary::before{content:"– "}
details.sol > summary:hover{background:var(--signal-wash)}
.sol-body{padding:2px 13px 14px;font-size:var(--s-16)}
.sol-body p{max-width:64ch}

/* ---------- playground ---------- */
.pg{border:1px solid var(--slab-rule);border-radius:3px;overflow:hidden;background:var(--slab);margin:0}
.pg-bar{
  display:flex;align-items:center;gap:7px;padding:7px 9px;
  background:var(--slab-2);border-bottom:1px solid var(--slab-rule);
}
.pg-bar .hint{margin-left:auto;font:400 var(--s-12) var(--f-code);color:#8A8398}
.btn{
  font:500 var(--s-12) var(--f-ui);color:var(--slab-ink);background:transparent;
  border:1px solid var(--slab-rule);padding:4px 10px;border-radius:2px;cursor:pointer;
}
.btn:hover{background:#26232F}
.btn-run{background:var(--signal);border-color:var(--signal);color:#FDF2F7}
.btn-run:hover{background:#C90F6A}
.pg-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pg-code{
  display:block;width:100%;min-height:230px;border:0;resize:vertical;
  background:var(--slab);color:var(--slab-ink);padding:13px 14px;
  font:400 13px/1.65 var(--f-code);tab-size:2;
}
.pg-code:focus{outline:2px solid var(--signal);outline-offset:-2px}
.pg-out{
  background:var(--raise);color:var(--ink);padding:13px 14px;overflow:auto;
  border-left:1px solid var(--slab-rule);
  font:400 var(--s-14)/1.5 var(--f-ui);min-height:230px;
}
.pg-err{
  margin:0;font:400 12.5px/1.55 var(--f-code);color:var(--warn-ink);
  background:var(--warn-wash);border-left:2px solid var(--warn);
  padding:8px 10px;white-space:pre-wrap;
}
.pg-log{margin:0 0 10px;padding:8px 10px;background:#EAE8EF;border-radius:2px;
  font:400 12.5px/1.55 var(--f-code);white-space:pre-wrap}
.pg-out h1,.pg-out h2,.pg-out h3{font-size:var(--s-17);margin:0 0 6px}
.pg-out p{margin:0 0 .5em}
.pg-out button{
  font:500 var(--s-12) var(--f-ui);border:1px solid var(--rule);background:var(--paper);
  color:var(--ink);padding:4px 10px;border-radius:2px;cursor:pointer;margin:0 4px 4px 0;
}
.pg-out button:hover{background:var(--signal-wash)}
.pg-out input,.pg-out select,.pg-out textarea{
  font:400 var(--s-14) var(--f-ui);border:1px solid var(--rule);background:#fff;
  color:var(--ink);padding:4px 7px;border-radius:2px;margin:0 4px 4px 0;
}
.pg-out ul,.pg-out ol{margin:0 0 .5em;padding-left:1.2em}
.pg-out label{display:inline-block;margin:0 6px 4px 0}
.pg-out table{border-collapse:collapse;font-size:var(--s-13)}
.pg-out th,.pg-out td{border:1px solid var(--rule);padding:2px 6px;text-align:left}
@media (max-width:760px){
  .pg-cols{grid-template-columns:1fr}
  .pg-out{border-left:0;border-top:1px solid var(--slab-rule);min-height:130px}
}

/* ---------- foot nav ---------- */
.lesson-foot{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border-top:1px solid var(--rule);margin-top:22px;padding-top:18px;
}
.fbtn{
  font:500 var(--s-14) var(--f-ui);background:var(--raise);border:1px solid var(--rule);
  color:var(--ink);padding:7px 13px;border-radius:2px;cursor:pointer;
}
.fbtn:hover{background:var(--signal-wash)}
.fbtn[disabled]{opacity:.45;cursor:default}
.fbtn.mark{margin-right:auto;border-color:var(--signal);color:var(--signal)}
.fbtn.mark.on{background:var(--signal);border-color:var(--signal);color:#FDF2F7}

/* ---------- notices ---------- */
.notice{
  border:1px solid #E2D6BE;background:var(--warn-wash);color:var(--warn-ink);
  padding:11px 14px;border-radius:3px;font-size:var(--s-16);margin-bottom:24px;
}
.notice b{font-family:var(--f-ui)}
.notice code{font-size:.86em;word-break:break-all}
.pending{
  border:1px dashed var(--rule);padding:16px 18px;border-radius:3px;
  color:var(--ink-2);font-size:var(--s-16);max-width:66ch;
}

/* ---------- interview + cheat sheet ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 22px}
.chip{
  font:500 var(--s-12) var(--f-ui);background:var(--raise);border:1px solid var(--rule);
  color:var(--ink-2);padding:4px 10px;border-radius:2px;cursor:pointer;
}
.chip[aria-pressed=true]{background:var(--signal);border-color:var(--signal);color:#FDF2F7}
.pick-wrap{font:400 var(--s-12) var(--f-ui);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.pick{font:400 var(--s-14) var(--f-ui);color:var(--ink);background:var(--raise);
  border:1px solid var(--rule);border-radius:2px;padding:4px 6px;max-width:170px}
.qa{border-top:1px solid var(--rule);padding:18px 0}
.qa .q{font:600 var(--s-20)/1.35 var(--f-ui);margin:0 0 8px;max-width:58ch}
.diff{font:400 var(--s-12) var(--f-code);color:var(--ink-2);margin:0 0 8px}
.qa details.sol:not([open]){width:fit-content}
.follow{border-top:1px solid var(--rule);margin-top:13px;padding-top:11px}
.follow .fq{font:600 var(--s-16) var(--f-ui);margin-bottom:6px;max-width:58ch}
.sheet{columns:2;column-gap:34px;max-width:1000px}
.sheet section{break-inside:avoid;margin-bottom:22px}
.sheet h3{font-size:var(--s-16);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.sheet dl{margin:0;font-size:var(--s-14)}
.sheet dt{font:500 12.5px var(--f-code);color:var(--signal);margin-top:8px}
.sheet dd{margin:2px 0 0;font-family:var(--f-prose)}
@media (max-width:900px){.sheet{columns:1}}

/* ---------- responsive ---------- */
@media (max-width:900px){
  html{font-size:16px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .drawer-btn{display:block}
  .sidebar{
    position:fixed;left:0;top:var(--bar);width:min(324px,88vw);z-index:25;
    background:var(--paper);transform:translateX(-101%);transition:transform .18s ease;
  }
  .sidebar.open{transform:translateX(0)}
  .pane{padding:22px 18px 90px}
  .lesson-h{font-size:var(--s-28)}
}
@media (max-width:620px){
  .topbar{gap:8px;padding:0 10px}
  .brand{display:none}
  .tabs{gap:0}
  .tab{font-size:var(--s-12);padding:7px 7px}
  .find{flex:0 1 96px}
  .drawer-btn{padding:5px 8px;font-size:var(--s-16);line-height:1}
  .drawer-btn .long{display:none}
  .drawer-btn .short{display:inline}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>

</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Curriculum"></nav>
  <main class="pane" id="main" tabindex="-1"><div class="pane-inner" id="paneInner"></div></main>
</div>

<script type="importmap">
{
  "imports": {
    "@angular/core": "https://esm.sh/@angular/core@22",
    "@angular/core/rxjs-interop": "https://esm.sh/@angular/core@22/rxjs-interop",
    "@angular/common": "https://esm.sh/@angular/common@22",
    "@angular/common/http": "https://esm.sh/@angular/common@22/http",
    "@angular/compiler": "https://esm.sh/@angular/compiler@22",
    "@angular/platform-browser": "https://esm.sh/@angular/platform-browser@22",
    "@angular/forms": "https://esm.sh/@angular/forms@22",
    "@angular/forms/signals": "https://esm.sh/@angular/forms@22/signals",
    "@angular/router": "https://esm.sh/@angular/router@22",
    "rxjs": "https://esm.sh/rxjs@7",
    "rxjs/operators": "https://esm.sh/rxjs@7/operators"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7.28.4/babel.min.js"></script>
<script type="module">
  /* Angular is ESM-only and needs the JIT compiler imported before anything is
     bootstrapped. If any of this fails, the course still works: every lesson,
     snippet, exercise and answer is plain text, and the playgrounds say why. */
  try {
    await import('@angular/compiler');          // must come first, enables JIT
    const core = await import('@angular/core');
    const common = await import('@angular/common');
    const http = await import('@angular/common/http');
    const interop = await import('@angular/core/rxjs-interop');
    const rxjs = await import('rxjs');
    const operators = await import('rxjs/operators');
    let forms = null, signalForms = null;
    try { forms = await import('@angular/forms'); } catch (e) { /* optional */ }
    try { signalForms = await import('@angular/forms/signals'); } catch (e) { /* optional */ }

    window.__ng = { core: core, common: common, http: http, interop: interop,
                    rxjs: rxjs, operators: operators, forms: forms, signalForms: signalForms };
    window.__ngVersion = (core.VERSION && core.VERSION.full) || 'unknown';
    window.__ngStatus = window.Babel ? 'loaded' : 'nobabel';
  } catch (err) {
    window.__ngStatus = 'failed';
    window.__ngError = String((err && err.message) || err);
  }
  window.dispatchEvent(new Event('ngstatus'));
</script>
<script>
/* ============================================================
   CURRICULUM DATA
   Lesson shape:
     id, t (title), file (the path shown in the header)
     what[], why[]                    prose paragraphs
     code                             starter code for the lesson playground
     anno[[snippet, note]]            annotated walkthrough
     mistakes[[title, message, fix]]  message may be ''
     ex {task, start, sol, why}
     mm                               one-sentence mental model
   ============================================================ */
const COURSE = [
{
  id:'m1', dir:'01-foundations', t:'Foundations', lvl:'Easy',
  lessons:[
  {
    id:'1', file:'what-angular-is.ts', t:'What Angular is, and when not to use it',
    what:[
      'Angular is a framework for building web applications, written in and designed around TypeScript. You build a tree of components, each one a class with a template, and Angular keeps the DOM in step with your data.',
      'It is a framework rather than a library, which means the answers come in the box: routing, HTTP, forms, testing, a build system, and a code generator are all first-party and versioned together.'
    ],
    why:[
      'Writing UI by hand means writing instructions: find this element, set its text, add a class, remove that row. Every state your app can be in multiplies the transitions you have to get right, and the bugs live in the transitions you forgot. Angular lets you describe the result instead, and works out the updates.',
      'The framework part solves a different problem, which is agreement. On a team of thirty over five years, the expensive question is not which router is best but whether every feature uses the same one, tested the same way, upgraded on the same day. Angular trades some freedom for that, and provides `ng update` to move the whole thing forward at once.',
      'When not to use it: a landing page, a blog, a widget dropped into someone else\u2019s page. The runtime and the build step are real costs, and a framework whose value is long-term consistency has little to offer a project with no long term. Angular pays off on applications that are large, long-lived, and maintained by more than one person.'
    ],
    code:`// Data in, UI out. Change the numbers and press Run.\n@Component({\n  selector: 'app-root',\n  template: \`\n    <h3>Hours studied</h3>\n    @for (day of days; track day.name) {\n      <div class="row">\n        <span class="bar" [style.width.px]="day.hours * 7"></span>\n        {{ day.name }}: {{ day.hours }}h\n      </div>\n    }\n    <p>Total: {{ total }}h</p>\n  \`,\n  styles: \`\n    .row { display: flex; gap: 8px; align-items: center; }\n    .bar { height: 12px; background: #B4005A; }\n  \`\n})\nclass App {\n  days = [\n    { name: 'Mon', hours: 7 },\n    { name: 'Tue', hours: 9 },\n    { name: 'Wed', hours: 14 }\n  ];\n\n  get total() {\n    return this.days.reduce((sum, d) => sum + d.hours, 0);\n  }\n}`,
    anno:[
      ['@Component({ ... })','A decorator. It attaches configuration to the class, and the Angular compiler reads that configuration to generate the rendering code. The class is an ordinary class; the decorator is what makes it a component.'],
      ["selector: 'app-root'",'The tag name this component answers to. Used in another template as <app-root></app-root>, or as the root element of the whole application.'],
      ['template: `...`','The markup, inline here. In a real project this is usually templateUrl pointing at an .html file, and either is normal.'],
      ['@for (day of days; track day.name)','Built-in control flow, part of the template language since Angular 17. track is mandatory and tells Angular how to identify a row across updates, which is lesson 6.'],
      ['[style.width.px]="day.hours * 7"','A property binding. The square brackets mean "the right-hand side is an expression, evaluate it", and the .px suffix supplies the unit.'],
      ['{{ day.name }}','Interpolation. Anything public on the class is reachable from the template, which is the only connection between the two.'],
      ['get total()','A getter, computed on demand. It works, and it runs on every check; lesson 12 replaces it with computed(), which does not.']
    ],
    mistakes:[
      ['Expecting Angular to be small','','It is not, and it is not trying to be. If the size of the runtime is your main constraint, that is a real reason to choose something else rather than to fight Angular.'],
      ['Bringing AngularJS knowledge','','AngularJS, meaning any 1.x version, is a different framework with a different mental model, and it reached end of life in 2022. $scope, directives with link functions, and two-way binding everywhere have no equivalent here. Tutorials that mention them are fifteen years old.'],
      ['Reading a tutorial written for NgModules','','Anything with @NgModule, app.module.ts, and declarations arrays is pre-v14 style. Standalone components are the default now, and lesson 44 explains what modules were for.']
    ],
    ex:{
      task:'Add a fourth day, then add a column showing each day as a percentage of the total. Keep the total derived rather than stored.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`\n    @for (day of days; track day.name) {\n      <p>{{ day.name }}: {{ day.hours }}h</p>\n    }\n  \`\n})\nclass App {\n  days = [\n    { name: 'Mon', hours: 7 },\n    { name: 'Tue', hours: 9 },\n    { name: 'Wed', hours: 14 }\n  ];\n}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    <table>\n      <tr><th>Day</th><th>Hours</th><th>Share</th></tr>\n      @for (day of days; track day.name) {\n        <tr>\n          <td>{{ day.name }}</td>\n          <td>{{ day.hours }}</td>\n          <td>{{ share(day.hours) }}%</td>\n        </tr>\n      }\n      <tr><td>Total</td><td>{{ total }}</td><td>100%</td></tr>\n    </table>\n  \`\n})\nclass App {\n  days = [\n    { name: 'Mon', hours: 7 },\n    { name: 'Tue', hours: 9 },\n    { name: 'Wed', hours: 14 },\n    { name: 'Thu', hours: 5 }\n  ];\n\n  get total() {\n    return this.days.reduce((sum, d) => sum + d.hours, 0);\n  }\n\n  share(hours: number) {\n    return Math.round((hours / this.total) * 100);\n  }\n}`,
      why:'Adding a day changes four numbers on screen and you edited one array, which is the whole point of a declarative template. The share is a method rather than a stored field, so it cannot disagree with the hours it describes. Note that a method called from a template runs on every change detection pass, which is fine for arithmetic on four rows and is exactly what you must stop doing on four thousand; lesson 12 and lesson 36 cover the fix and the reason.'
    },
    mm:'Angular is a framework that renders your data and supplies the rest of the answers in the box, at the price of size and structure.'
  },
  {
    id:'2', file:'typescript-you-need.ts', t:'The TypeScript you actually need first',
    what:[
      'Angular is TypeScript-first. Templates are type-checked against your classes, the CLI generates TypeScript, and the framework\u2019s own APIs are built out of generics.',
      'This lesson is the shortlist: the handful of features that appear in the first hour of any Angular codebase. If you can read the snippet below, you can read Angular.'
    ],
    why:[
      'The types are not decoration. `strictTemplates` is on by default since v22, so a typo in a template binding is a build error rather than a blank space on the page, and a required input that you forget to pass fails at compile time. That safety only exists because the types are real.',
      'The one piece of syntax with no JavaScript equivalent is the decorator. Angular uses decorators to attach metadata to classes, and everything else you will meet is ordinary modern JavaScript with types written next to it.'
    ],
    code:`// Everything here shows up constantly in Angular code.\n\n// 1. Interfaces describe the shape of data\ninterface User {\n  id: number;\n  name: string;\n  role: 'admin' | 'member';   // a union of literals, not just string\n  email?: string;             // optional\n}\n\n// 2. Generics: one function, any item type\nfunction firstOf<T>(items: T[]): T | undefined {\n  return items[0];\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p>{{ greeting }}</p>\n    <p>first user: {{ first?.name ?? 'none' }}</p>\n    <p>admins: {{ adminNames.join(', ') }}</p>\n    <p>email: {{ users[0].email ?? 'not given' }}</p>\n  \`\n})\nclass App {\n  // 3. readonly and explicit types on the boundary\n  readonly users: User[] = [\n    { id: 1, name: 'Ada', role: 'admin' },\n    { id: 2, name: 'Grace', role: 'member', email: 'g@example.com' }\n  ];\n\n  // 4. inference: no annotation needed, this is User | undefined\n  readonly first = firstOf(this.users);\n\n  // 5. array methods and arrow functions\n  readonly adminNames = this.users\n    .filter(u => u.role === 'admin')\n    .map(u => u.name);\n\n  // 6. template literals\n  readonly greeting = \`\${this.users.length} users loaded\`;\n}`,
    anno:[
      ['interface User { ... }','A description of a shape, erased at build time. Nothing checks it at runtime, which matters the moment data arrives from an API: lesson 43.'],
      ["role: 'admin' | 'member'",'A union of string literals rather than string. Now a typo is a compile error and your editor offers the two valid values.'],
      ['email?: string','Optional, so the type is string | undefined and TypeScript makes you handle the undefined case.'],
      ['function firstOf<T>(items: T[]): T | undefined','A generic. T is inferred at the call site, so the return type is User | undefined here without you saying so. Angular\u2019s own APIs, signal<T>, input<T>, HttpClient.get<T>, all work this way.'],
      ['readonly users: User[] = [ ... ]','readonly stops reassignment of the field. It does not freeze the array\u2019s contents, which is a common misreading.'],
      ["first?.name ?? 'none'",'Optional chaining and nullish coalescing, both supported in templates. Since v22 the template semantics match TypeScript: project?.author is undefined, not null, when project is missing.'],
      ['@Component (a decorator)','The one non-JavaScript piece. A function applied to a class with @, which attaches metadata the compiler reads. You will write @Component, @Directive, @Pipe, @Injectable and @Service, and almost never write your own.']
    ],
    mistakes:[
      ['Reaching for any','','It switches off the checker exactly where you were confused, and in Angular it also switches off template checking for anything derived from it. unknown plus a narrowing check is the honest version.'],
      ['Believing types exist at runtime','','They are erased. Data crossing a boundary, an HTTP response or a form submission, needs a real runtime check; typing HttpClient.get<User>() is a promise you are making to yourself, not a validation.'],
      ['Using private on a field the template needs','Property \'total\' is private and only accessible within class \'App\'.','Templates can only read what is accessible to them. The convention is `protected readonly` for anything used only by the template, and public for a real API.'],
      ['Forgetting that a getter runs repeatedly','','A getter or method called from a template is re-evaluated on every check. Correct, and a performance trap at scale.']
    ],
    ex:{
      task:'Type a Product interface with an optional discount and a status union, then render only the in-stock products with their final price. Use a generic helper to sum any numeric field.',
      start:`interface Product {\n  // your types\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`<p>your template</p>\`\n})\nclass App {\n  // your code\n}`,
      sol:`interface Product {\n  id: string;\n  name: string;\n  price: number;\n  status: 'in-stock' | 'backorder' | 'discontinued';\n  discount?: number;                       // a fraction, 0.1 = 10% off\n}\n\nfunction sumBy<T>(items: T[], pick: (item: T) => number): number {\n  return items.reduce((total, item) => total + pick(item), 0);\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <ul>\n      @for (p of available; track p.id) {\n        <li>{{ p.name }}: \u00a3{{ finalPrice(p) }}</li>\n      }\n    </ul>\n    <p>Total if you bought one of each: \u00a3{{ total }}</p>\n  \`\n})\nclass App {\n  protected readonly products: Product[] = [\n    { id: 'a', name: 'Mug', price: 8, status: 'in-stock' },\n    { id: 'b', name: 'Poster', price: 14, status: 'discontinued' },\n    { id: 'c', name: 'Tote', price: 12, status: 'in-stock', discount: 0.25 }\n  ];\n\n  protected readonly available = this.products.filter(p => p.status === 'in-stock');\n\n  protected finalPrice(p: Product) {\n    return Math.round(p.price * (1 - (p.discount ?? 0)));\n  }\n\n  protected get total() {\n    return sumBy(this.available, p => this.finalPrice(p));\n  }\n}`,
      why:'The union type means status cannot be misspelt, and the optional discount forces the `?? 0` that stops one missing field producing NaN across the page. sumBy is generic in the item type and takes a function to pick the number, so it works for prices, quantities, or anything else without an overload per field. Everything the template reads is `protected`, which is the current Angular convention: it keeps the class\u2019s public surface to what other code actually calls.'
    },
    mm:'Angular is TypeScript with decorators, so the types are load-bearing and the only new syntax is the @ on a class.'
  },
  {
    id:'3', file:'first-component.ts', t:'Your first standalone component',
    what:[
      'A component is a class with an @Component decorator. The decorator says which tag it answers to, what markup it renders, and what other components or directives its template is allowed to use.',
      'Since Angular 14 components are standalone: they declare their own dependencies in an `imports` array and need no NgModule. Since v19 that is the default and the `standalone: true` flag is no longer written.'
    ],
    why:[
      'The class holds state and behaviour; the template describes the result. Keeping them in one file, side by side, means a change to what appears on screen and a change to the data behind it happen in the same place.',
      'The `imports` array exists because Angular templates are compiled, not interpreted. The compiler must know at build time which tag maps to which component, so it can generate the calls and type-check the bindings. That is also why an unimported component silently renders as an unknown element rather than throwing at runtime.',
      'Standalone replaced NgModules because a module was a second, parallel place to declare dependencies, which duplicated information the component already had and made lazy loading harder than it needed to be.'
    ],
    code:`// A child component, imported by the one below it.\n@Component({\n  selector: 'app-badge',\n  template: \`<span class="badge">{{ label }}</span>\`,\n  styles: \`\n    .badge {\n      background: #F7E6EE; color: #B4005A;\n      padding: 1px 8px; border-radius: 999px; font-size: 12px;\n    }\n  \`\n})\nclass Badge {\n  label = 'stable';\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Badge],              // the template may now use <app-badge>\n  template: \`\n    <h3>{{ title }}</h3>\n    <p>Signals <app-badge /> and forms <app-badge /></p>\n    <p>Angular {{ version }}</p>\n  \`\n})\nclass App {\n  protected readonly title = 'My first component';\n  protected readonly version = 22;\n}`,
    anno:[
      ['@Component({ ... })','Everything the compiler needs, in one object. The four keys you will use constantly are selector, template or templateUrl, styles or styleUrl, and imports.'],
      ['imports: [Badge]','Standalone dependencies. Without this line <app-badge> is an unknown element: no error, nothing rendered. Only add what the template actually uses, since anything listed here is part of this component\u2019s dependency graph.'],
      ['<app-badge />','Self-closing component tags are allowed in Angular templates since v15.1. <app-badge></app-badge> is the same thing.'],
      ['styles: `...`','Styles scoped to this component. Angular rewrites the selectors so .badge here cannot affect a .badge elsewhere: lesson 8.'],
      ['protected readonly title','The convention for state the template reads and nothing else touches. Templates cannot see `private` members.'],
      ['changeDetection','Not specified here, which since v22 means OnPush. In v21 and earlier the default was Eager, renamed from Default. Lesson 15 explains what changed and why it matters.'],
      ["standalone: true",'No longer written. It was required in v14 to v18, defaulted to true in v19, and any tutorial that includes it predates that.']
    ],
    mistakes:[
      ['Forgetting to import a component you use','NG8001: \'app-badge\' is not a known element. If \'app-badge\' is an Angular component, then verify that it is included in the @Component.imports of this component.','Add it to imports. The error is a compile-time one with the CLI, which is exactly why the array exists.'],
      ['A selector that collides with an HTML element','','Selectors are prefixed by convention, app- by default, precisely so that <card> or <button> never means two things. The CLI enforces a prefix per project.'],
      ['Writing an NgModule for a new component','','You do not need one. If you are following a tutorial that creates app.module.ts, it was written before v15 and every later decision in it will be dated too.'],
      ['Putting the class before the decorator','Decorators are not valid here.','The decorator sits immediately above the class it decorates, with no blank line requirement but no statement in between.']
    ],
    ex:{
      task:'Build a Stat component that renders a label and a value, then use it three times from App with different content. Give it scoped styles and prove they do not leak.',
      start:`@Component({\n  selector: 'app-stat',\n  template: \`<p>your template</p>\`\n})\nclass Stat {\n  // your code\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Stat],\n  template: \`<app-stat />\`\n})\nclass App {}`,
      sol:`@Component({\n  selector: 'app-stat',\n  template: \`\n    <div class="stat">\n      <span class="label">{{ label }}</span>\n      <strong>{{ value }}{{ unit }}</strong>\n    </div>\n  \`,\n  styles: \`\n    .stat { border: 1px solid #CFCCD6; padding: 6px 10px; margin-bottom: 6px; }\n    .label { color: #55525F; font-size: 12px; display: block; }\n  \`\n})\nclass Stat {\n  label = 'Metric';\n  value = 0;\n  unit = '';\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Stat],\n  template: \`\n    <app-stat />\n    <app-stat />\n    <p class="label">This paragraph also has class="label" and is unaffected.</p>\n  \`\n})\nclass App {}`,
      why:'Two instances of Stat, one class definition: that is the point of a component. The paragraph in App carries the same class name as the one inside Stat and does not pick up its colour, because component styles are scoped by default. What is still missing is a way for App to give each Stat different content, since the fields have fixed values here and Angular has no mechanism for setting them from a template without declaring them as inputs. That is lesson 7, and it is the moment a component stops being a snippet and becomes reusable.'
    },
    mm:'A component is a class plus a decorator that tells the compiler its tag, its markup, and what its template is allowed to use.'
  },
  {
    id:'4', file:'bootstrapping.ts', t:'Bootstrapping an application',
    what:[
      'Something has to start the application: create the root injector, compile the root component, and attach it to an element in index.html. That is `bootstrapApplication`.',
      'It takes the root component and an optional configuration object holding the application\u2019s providers, which is where router, HTTP options, and your own services are registered.'
    ],
    why:[
      'Angular needs one boundary between the page it manages and the page it does not, and one place where application-wide services live. The bootstrap call is both.',
      'It also replaced a lot of ceremony. The old path was platformBrowserDynamic().bootstrapModule(AppModule), with an NgModule listing declarations, imports, and providers. Now the root component declares its own dependencies and the providers array is a flat list of functions.',
      'Those `provideX()` functions are the modern shape of configuration. `provideRouter(routes)`, `provideHttpClient(withInterceptors([...]))`, `provideZoneChangeDetection()`: each is a plain function returning providers, which is tree-shakable and composable in a way that importing a module never was.'
    ],
    code:`// In a real project this is main.ts, and it looks exactly like this:\n//\n//   import { bootstrapApplication } from '@angular/platform-browser';\n//   import { provideRouter } from '@angular/router';\n//   import { App } from './app/app';\n//   import { routes } from './app/app.routes';\n//\n//   bootstrapApplication(App, {\n//     providers: [\n//       provideRouter(routes),\n//       // provideHttpClient() is only needed to CONFIGURE the client:\n//       // since v21 HttpClient is provided in the root injector already.\n//     ]\n//   });\n//\n// This playground mounts your component into the output pane with\n// createApplication + createComponent, which is the same thing with an\n// explicit host element instead of a selector match in index.html.\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p>Bootstrapped. Angular version: {{ version }}</p>\n    <p>Zone.js present: {{ zonePresent }}</p>\n  \`\n})\nclass App {\n  protected readonly version = VERSION.full;\n  // Angular applications are zoneless by default since v21.\n  protected readonly zonePresent = typeof (globalThis as any).Zone !== 'undefined';\n}`,
    anno:[
      ["bootstrapApplication(App, { providers: [...] })",'The whole entry point. It returns a promise resolving to an ApplicationRef, which you rarely need.'],
      ['<app-root></app-root> in index.html','The host. bootstrapApplication finds the element matching the root component\u2019s selector. If it is missing, the app silently renders nothing, which is a five-minute mystery the first time.'],
      ['providers: [provideRouter(routes)]','Application-wide providers, in the root injector. Everything in the app can inject them; lesson 27 covers what that means.'],
      ['provideZoneChangeDetection()','Only needed if you want Zone.js back. Applications have been zoneless by default since v21, and the migration adds this call for existing apps that relied on Zone.js.'],
      ['createApplication() + createComponent()','What this playground uses, from @angular/core, because it can mount into a DOM node you hand it. Useful in real apps too, when Angular is one widget on a page it does not own.'],
      ['platformBrowserDynamic().bootstrapModule(AppModule)','The legacy path. Correct for an app still built on NgModules, and a signal that any surrounding advice is from before 2022.']
    ],
    mistakes:[
      ['No element matching the root selector','','A blank page with no error. Check that index.html contains the tag your root component\u2019s selector names.'],
      ['Calling provideHttpClient just to use HttpClient','','Since v21 it is unnecessary: HttpClient is available from the root injector by default. Call it only to configure interceptors or to opt back into XHR with withXhr().'],
      ['Putting providers on the root component instead of the bootstrap config','','Component-level providers create a new instance per component instance. For an application-wide singleton that is almost never what you meant; lesson 28 covers the difference.'],
      ['Expecting bootstrap to be synchronous','','It returns a promise. Code that must run after the app exists belongs in an APP_INITIALIZER-style provider or in the root component, not after the call.']
    ],
    ex:{
      task:'Provide a value through the bootstrap configuration and read it in the component with inject(). Use an InjectionToken so the value has a name and a type.',
      start:`// A token stands in for a config value provided at bootstrap.\nconst API_URL = new InjectionToken<string>('API_URL');\n\n@Component({\n  selector: 'app-root',\n  template: \`<p>your template</p>\`\n})\nclass App {\n  // your code\n}`,
      sol:`const API_URL = new InjectionToken<string>('API_URL');\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p>API base: <code>{{ apiUrl }}</code></p>\n    <p>Provided at bootstrap, injected here, never imported.</p>\n  \`\n})\nclass App {\n  // inject(), not a constructor parameter\n  protected readonly apiUrl = inject(API_URL);\n}\n\n// The playground passes these providers to createApplication for you,\n// which is what the real bootstrap call would do:\nprovide([\n  { provide: API_URL, useValue: 'https://api.example.com/v2' }\n]);`,
      why:'The component never imports the value, it asks for a token, and something above it decides what that token means. That indirection is what lets a test provide a fake URL and production provide the real one without touching the component. Note `inject(API_URL)` in a field initialiser rather than a constructor parameter: it is the current style, it is required by v22\u2019s @Service() decorator, and it is the only form this playground can support at all, since constructor injection depends on TypeScript metadata that a browser-side transform cannot emit. The `provide([...])` call is this playground\u2019s stand-in for the bootstrap providers array.'
    },
    mm:'bootstrapApplication starts one root component with one root injector, and provideX() functions are how you configure it.'
  },
  {
    id:'5', file:'template-syntax.ts', t:'Template syntax: bindings and @let',
    what:[
      'Four kinds of binding cover almost everything. `{{ }}` interpolates a value into text, `[prop]` sets a property from an expression, `(event)` runs a statement when an event fires, and `[(prop)]` does both at once.',
      'A template expression is a small, restricted language: no assignments, no `new`, no chained statements, and no access to anything outside the component instance. `@let` declares a local variable inside the template.'
    ],
    why:[
      'The restrictions are deliberate. A template that cannot assign or call arbitrary globals is one the compiler can type-check, optimise, and re-evaluate safely on every change, and one where the interesting logic is forced into the class where it can be tested.',
      'The bracket syntax carries information that HTML attributes cannot. `value="count"` passes the string "count"; `[value]="count"` passes the number. That distinction is invisible in a template language that guesses, and explicit here.',
      '`@let` was added because the alternative was worse: repeating a long expression three times, or inventing a class field for something that only matters in one corner of the markup.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  imports: [FormsModule],\n  template: \`\n    <!-- 1. interpolation -->\n    <p>Hello {{ name }}, {{ name.length }} characters.</p>\n\n    <!-- 2. property binding: an expression, not a string -->\n    <input [value]="name" [disabled]="locked" [attr.aria-label]="'Name for ' + name" />\n\n    <!-- 3. event binding, with the event object as $event -->\n    <input (input)="onInput($event)" placeholder="type to rename" />\n    <button (click)="locked = !locked">{{ locked ? 'Unlock' : 'Lock' }}</button>\n\n    <!-- 4. two-way binding, on a directive that supports it -->\n    <input [(ngModel)]="note" placeholder="two-way" />\n    <p>note is: {{ note || '(empty)' }}</p>\n\n    <!-- @let: a local, computed once per pass -->\n    @let shout = name.toUpperCase() + '!';\n    <p>{{ shout }} / {{ shout.length }}</p>\n  \`\n})\nclass App {\n  protected name = 'Ada';\n  protected note = '';\n  protected locked = false;\n\n  protected onInput(event: Event) {\n    this.name = (event.target as HTMLInputElement).value || 'Ada';\n  }\n}`,
    anno:[
      ['{{ name.length }}','Any expression the restricted language allows: property access, arithmetic, calls, ternaries, pipes. No statements.'],
      ['[disabled]="locked"','Sets the DOM property. Without the brackets, disabled="locked" is the string "locked", which is truthy, so the input would be permanently disabled. This is the single most common binding bug.'],
      ["[attr.aria-label]=\"'Name for ' + name\"",'Some things are attributes rather than properties, notably aria-* and colspan. The attr. prefix targets the attribute explicitly.'],
      ['(input)="onInput($event)"','An event binding. $event is the DOM event, and the right-hand side is a statement, so assignment is allowed here even though it is not in an interpolation.'],
      ['(click)="locked = !locked"','Legal, and fine for a toggle this small. Anything with a condition in it belongs in a method.'],
      ['[(ngModel)]="note"','The banana-in-a-box. It expands to [ngModel]="note" (ngModelChange)="note = $event", so it is not magic, and it only works on a directive that exposes that pair. FormsModule must be imported.'],
      ["@let shout = name.toUpperCase() + '!';",'A template local, in scope for the rest of the template block. It is read-only, and it is re-evaluated when its dependencies change.']
    ],
    mistakes:[
      ['Forgetting the brackets','','disabled="false" disables the button, because a non-empty string is truthy. Write [disabled]="false".'],
      ['Calling a method in an interpolation and expecting it to run once','','It runs on every change detection pass. For anything expensive, use a computed signal: lesson 12.'],
      ['Reaching for a global in a template','NG9: Property \'Math\' does not exist on type \'App\'.','Template expressions can only see the component instance. Expose what you need as a field or a method.'],
      ['Two-way binding on a plain property','NG8002: Can\'t bind to \'ngModel\' since it isn\'t a known property of \'input\'.','Import FormsModule, or use the two separate bindings. In new code prefer signal forms, lesson 32, or model() for your own components, lesson 7.']
    ],
    ex:{
      task:'Build a temperature converter: one input bound two ways to a celsius field, and the fahrenheit value shown with @let. Add a button that resets it, and disable the button when it is already zero.',
      start:`@Component({\n  selector: 'app-root',\n  imports: [FormsModule],\n  template: \`<p>your template</p>\`\n})\nclass App {\n  protected celsius = 20;\n}`,
      sol:`@Component({\n  selector: 'app-root',\n  imports: [FormsModule],\n  template: \`\n    <label>\n      \u00b0C <input type="number" [(ngModel)]="celsius" />\n    </label>\n\n    @let f = celsius * 9 / 5 + 32;\n    <p>{{ celsius }}\u00b0C is {{ f }}\u00b0F, which is {{ f > 80 ? 'warm' : 'cool' }}.</p>\n\n    <button (click)="reset()" [disabled]="celsius === 0">Reset to 0</button>\n  \`\n})\nclass App {\n  protected celsius = 20;\n\n  protected reset() {\n    this.celsius = 0;\n  }\n}`,
      why:'One value is stored and the other is derived in the template, so the two can never disagree; storing both would mean keeping them in step by hand. @let f names the conversion once and uses it three times, which is exactly the itch it was added to scratch. [disabled]="celsius === 0" is a real boolean expression rather than a string, and the reset lives in a method because a statement in a template should be short enough to read at a glance. In a signals codebase celsius would be a signal and f a computed, which is lesson 11 onwards; the binding syntax does not change.'
    },
    mm:'Square brackets pass values in, parentheses send events out, and everything a template can see belongs to its component.'
  },
  {
    id:'6', file:'control-flow.ts', t:'Built-in control flow: @if, @for, @switch',
    what:[
      'Angular templates have their own control flow blocks. `@if` with optional `@else if` and `@else`, `@for` with a mandatory `track` and an optional `@empty`, and `@switch` with `@case` and `@default`.',
      'They are part of the template language, compiled directly, and they replaced the older structural directives `*ngIf`, `*ngFor`, and `*ngSwitch`.'
    ],
    why:[
      'The directives worked but cost you something at every level. They had to be imported, they were built on a general-purpose mechanism that was slower than necessary, and the syntax hid what was happening: `*ngIf` silently wrapped your element in a template and an embedded view.',
      'The blocks need no import, generate less code, and are faster, because the compiler knows what they mean. They also read as control flow, which matters in a template with three nested conditions.',
      '`track` is mandatory in `@for` because Angular has to know how to identify a row across updates. Without an identity, it cannot tell "this row moved" from "every row changed", so it destroys and rebuilds DOM it could have moved, and any state inside a row goes to the wrong item.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <!-- @if, with else if and else -->\n    @if (status === 'loading') {\n      <p>Loading\u2026</p>\n    } @else if (status === 'error') {\n      <p>Something went wrong.</p>\n    } @else {\n      <!-- @for, with track and an empty case -->\n      <ul>\n        @for (task of tasks; track task.id) {\n          <li>\n            {{ $index + 1 }}. {{ task.title }}\n            @if ($first) { <em>(first)</em> }\n            @if ($last) { <em>(last)</em> }\n            <input placeholder="note" />\n          </li>\n        } @empty {\n          <li>Nothing to do. Enjoy the quiet.</li>\n        }\n      </ul>\n    }\n\n    <!-- @switch -->\n    @switch (view) {\n      @case ('list') { <p>Showing a list.</p> }\n      @case ('grid') { <p>Showing a grid.</p> }\n      @default { <p>Unknown view.</p> }\n    }\n\n    <button (click)="shuffle()">Reverse the list</button>\n    <button (click)="tasks = []">Empty it</button>\n    <button (click)="view = view === 'list' ? 'grid' : 'list'">Toggle view</button>\n  \`\n})\nclass App {\n  protected status: 'loading' | 'error' | 'ready' = 'ready';\n  protected view: 'list' | 'grid' = 'list';\n  protected tasks = [\n    { id: 1, title: 'Read' },\n    { id: 2, title: 'Write' },\n    { id: 3, title: 'Run' }\n  ];\n\n  protected shuffle() {\n    // type into the first note, then reverse: the note follows its row,\n    // because track uses the id rather than the position\n    this.tasks = [...this.tasks].reverse();\n  }\n}`,
    anno:[
      ['@if (cond) { } @else if (cond) { } @else { }','No import, no asterisk, and real else branches. The old *ngIf needed an ng-template and an `; else` reference to do the same thing.'],
      ['@for (task of tasks; track task.id)','track is required. Use a stable identifier from the data. `track task` tracks by object identity, which works when the objects are never replaced; `track $index` is the position, which is wrong for anything reorderable.'],
      ['$index, $first, $last, $even, $odd, $count','Implicit variables inside @for. In *ngFor these had to be aliased by hand with `let i = index`.'],
      ['@empty { }','Renders when the collection is empty. It replaces the usual pattern of a second @if next to the loop, and cannot get out of step with it.'],
      ['@switch (view) { @case (\'list\') { } }','Compiles to a switch. Note there is no fall-through, so no break, and @default is optional.'],
      ['@default never;','Since v21.2. Instead of a runtime fallback, it makes the compiler prove every case of a union is handled, so adding a value to the union breaks the build rather than the page. v22 extends it to nested discriminants with @default never(data).'],
      ['*ngIf and *ngFor','Legacy. They still work, they need CommonModule or their own imports, and `ng generate @angular/core:control-flow` migrates a whole codebase automatically.']
    ],
    mistakes:[
      ['Tracking by index on a reorderable list','','The keys stay 0, 1, 2 while the data moves, so Angular concludes each row merely changed its text. Any DOM state inside the row, typed text, a checked box, an open menu, stays behind with the wrong item.'],
      ['A track expression that is not unique','NG0955: The provided track expression resulted in duplicated keys for a given collection.','Two rows share the tracked value. Either the data has a real duplicate or you are tracking a non-unique field such as a name.'],
      ['Tracking a freshly built object','','`track task` compares by reference, so if the list is rebuilt from an API response on every poll, every row looks new and the whole list re-renders. Track the id.'],
      ['Mixing blocks and directives in one template','','Legal but confusing. Run the migration and use the blocks everywhere; a half-migrated template is the worst of both.']
    ],
    ex:{
      task:'Render a list of users grouped by a status union with @switch, show a count with @empty handling, and prove that a good track keeps input state with its row.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your template</p>\`\n})\nclass App {\n  protected users = [\n    { id: 'u1', name: 'Ada', status: 'active' as const },\n    { id: 'u2', name: 'Grace', status: 'invited' as const },\n    { id: 'u3', name: 'Alan', status: 'active' as const }\n  ];\n}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p>{{ users.length }} users</p>\n    <ul>\n      @for (u of users; track u.id) {\n        <li>\n          <input placeholder="note" />\n          {{ u.name }} \u2014\n          @switch (u.status) {\n            @case ('active') { <strong>active</strong> }\n            @case ('invited') { <em>invited, not signed in</em> }\n            @default { <span>unknown</span> }\n          }\n        </li>\n      } @empty {\n        <li>No users yet.</li>\n      }\n    </ul>\n    <button (click)="reverse()">Reverse</button>\n    <button (click)="users = []">Clear</button>\n  \`\n})\nclass App {\n  protected users = [\n    { id: 'u1', name: 'Ada', status: 'active' as const },\n    { id: 'u2', name: 'Grace', status: 'invited' as const },\n    { id: 'u3', name: 'Alan', status: 'active' as const }\n  ];\n\n  protected reverse() {\n    this.users = [...this.users].reverse();\n  }\n}`,
      why:'Type into Ada\u2019s note and press Reverse: the note travels with Ada, because `track u.id` gives Angular an identity and it moves the DOM node rather than rewriting it. Change the track to $index and the notes stay in position one, two, three while the names move under them, which is data corruption that looks like a rendering bug. Note `[...this.users].reverse()` rather than `this.users.reverse()`: reverse mutates, and while a plain field tolerates that today, it stops working the moment this becomes a signal, which is lesson 11. The @switch inside the loop is fine, and @default is the honest fallback until you can use @default never to make the compiler check the union for you.'
    },
    mm:'Control flow is part of the template language now, and @for needs a stable track because identity is what lets Angular move a row instead of rebuilding it.'
  },
  {
    id:'7', file:'inputs-outputs.ts', t:'Inputs, outputs, and model',
    what:[
      'A parent passes data down with inputs and receives events up with outputs. In modern Angular both are declared as class fields: `input()`, `input.required()`, and `output()`.',
      '`model()` declares a two-way bindable value, so a parent can write `[(value)]="x"` against your component.'
    ],
    why:[
      'Inputs are what make a component reusable: one definition, many instances with different data. Outputs are how a child reports something without knowing who is listening, which keeps the dependency pointing one way.',
      'The function-based declarations replaced the `@Input()` and `@Output()` decorators for a specific reason: an input declared with `input()` is a signal. Reading it tracks it, so a `computed()` that depends on an input recalculates when the input changes, with no lifecycle hook and no `ngOnChanges`.',
      '`input.required()` closes a hole that the decorator version left open. A required input has no initial value and no `undefined` in its type, and since v21 reading one before it is set is a compile-time error rather than a runtime one.'
    ],
    code:`@Component({\n  selector: 'app-counter',\n  template: \`\n    <div class="box">\n      <strong>{{ label() }}</strong>\n      <span>step {{ step() }}</span>\n      <button (click)="dec()">\u2212</button>\n      <span>{{ value() }}</span>\n      <button (click)="inc()">+</button>\n      @if (value() >= max()) { <em>at the maximum</em> }\n    </div>\n  \`,\n  styles: \`.box { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }\`\n})\nclass Counter {\n  readonly label = input.required<string>();      // must be provided\n  readonly step = input(1);                       // optional, default 1\n  readonly max = input(10, { alias: 'ceiling' }); // bound as [ceiling]\n  readonly value = model(0);                      // two-way bindable\n  readonly limitHit = output<number>();           // event out\n\n  inc() {\n    const next = Math.min(this.max(), this.value() + this.step());\n    this.value.set(next);\n    if (next === this.max()) this.limitHit.emit(next);\n  }\n\n  dec() {\n    this.value.set(Math.max(0, this.value() - this.step()));\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Counter],\n  template: \`\n    <app-counter label="Slow" [(value)]="a" (limitHit)="log('slow hit ' + $event)" />\n    <app-counter label="Fast" [step]="3" [ceiling]="12" [(value)]="b"\n                 (limitHit)="log('fast hit ' + $event)" />\n    <p>parent sees a = {{ a }}, b = {{ b }}</p>\n    <ul>@for (line of lines; track $index) { <li>{{ line }}</li> }</ul>\n  \`\n})\nclass App {\n  protected a = 0;\n  protected b = 0;\n  protected lines: string[] = [];\n  protected log(line: string) { this.lines = [line, ...this.lines].slice(0, 4); }\n}`,
    anno:[
      ['readonly label = input.required<string>();','A required input. No default, and the type has no undefined in it, so the template can use label() without a guard. Omitting it in a parent template is a compile error.'],
      ['readonly step = input(1);','An optional input with a default. The type is inferred from the default, so <string> is unnecessary here.'],
      ['label()','Inputs are signals: you call them to read. That is what lets a computed depend on an input, and it is the main practical difference from the @Input() decorator.'],
      ["input(10, { alias: 'ceiling' })",'The public name differs from the field name. Useful for a rename without breaking callers; note v22 errors if two members end up exposing the same public name.'],
      ['readonly value = model(0);','A model is a writable signal that also emits a change event, so [(value)]="a" works in the parent. It expands to [value] plus (valueChange).'],
      ['readonly limitHit = output<number>();','An output. Call emit() to fire it, and the parent listens with (limitHit)="handler($event)". Outputs are not signals; they are events.'],
      ['@Input() and @Output()','The decorator forms, still supported. `ng generate @angular/core:signal-input-migration` and the matching output migration convert a codebase automatically.']
    ],
    mistakes:[
      ['Reading an input in a field initialiser','NG0950: Input is required but no value is available yet.','Field initialisers run before inputs are set. Use computed() so the read happens lazily, or read it in ngOnInit. Since v21 the compiler catches many of these at build time.'],
      ['Writing to an input','','Inputs are read-only signals: there is no set(). If the child owns the value, use model(). If the parent owns it, send an output and let the parent decide.'],
      ['Forgetting the parentheses in the template','NG9: Type \'InputSignal<string>\' is not assignable to type \'string\'.','{{ label }} renders the signal object, or fails type checking. Signals are read by calling them: {{ label() }}.'],
      ['An output named the same as a model','NG1054: Input \'user\' is bound to both \'user\' and \'user2\'.','v22 rejects duplicate public names, including a model and an output that collide. The migration rewrites it as an input plus a linkedSignal.']
    ],
    ex:{
      task:'Build a Rating component with a required max input, a two-way model for the current value, and an output that fires only when the rating changes to a new value. Use it twice.',
      start:`@Component({\n  selector: 'app-rating',\n  template: \`<p>your template</p>\`\n})\nclass Rating {\n  // your inputs, model and output\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Rating],\n  template: \`<app-rating [max]="5" [(value)]="score" />\`\n})\nclass App {\n  protected score = 0;\n}`,
      sol:`@Component({\n  selector: 'app-rating',\n  template: \`\n    @for (star of stars(); track star) {\n      <button (click)="choose(star)" [attr.aria-pressed]="star <= value()">\n        {{ star <= value() ? '\u2605' : '\u2606' }}\n      </button>\n    }\n    <span>{{ value() }} / {{ max() }}</span>\n  \`\n})\nclass Rating {\n  readonly max = input.required<number>();\n  readonly value = model(0);\n  readonly changed = output<number>();\n\n  // derived from an input: recomputes if max ever changes\n  readonly stars = computed(() =>\n    Array.from({ length: this.max() }, (_, i) => i + 1)\n  );\n\n  choose(star: number) {\n    if (star === this.value()) return;      // no event for a no-op\n    this.value.set(star);\n    this.changed.emit(star);\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Rating],\n  template: \`\n    <p>Food</p>\n    <app-rating [max]="5" [(value)]="food" (changed)="last = 'food: ' + $event" />\n    <p>Service</p>\n    <app-rating [max]="3" [(value)]="service" (changed)="last = 'service: ' + $event" />\n    <p>parent state: food {{ food }}, service {{ service }}</p>\n    <p>last event: {{ last }}</p>\n  \`\n})\nclass App {\n  protected food = 0;\n  protected service = 0;\n  protected last = 'none';\n}`,
      why:'Three declarations, three jobs. max is required, so a caller cannot forget it and the template can call max() without a guard. value is a model, so the parent binds it two ways and both sides stay in step without the child knowing who owns the number. changed is an output rather than a second model, because "the user picked a rating" is an event with a meaning of its own, and the early return means it does not fire when someone clicks the star that is already selected. The stars list is a computed derived from an input, which is the pay-off of inputs being signals: no lifecycle hook is involved, and if max changed the list would follow.'
    },
    mm:'input() flows data down as a signal, output() sends events up, and model() is the pair bundled for two-way binding.'
  },
  {
    id:'8', file:'styling.ts', t:'Styling and view encapsulation',
    what:[
      'A component\u2019s styles are scoped to that component. Angular rewrites your selectors and adds a generated attribute to the elements, so `.row` in one component cannot affect `.row` in another.',
      'For dynamic styling, bind `class` and `style` directly: `[class.active]`, `[class]`, `[style.width.px]`. These bindings are the recommended approach, and have been since the v20 style guide.'
    ],
    why:[
      'CSS is global, which in a component-based app means every class name is a potential collision and no component can be moved safely. Scoping makes a component self-contained: its styles arrive with it and leave with it.',
      'The emulated encapsulation is a deliberate compromise. It gives you scoping in every browser with plain CSS and no Shadow DOM quirks, at the cost of not being real isolation: global styles still reach in, which is usually what you want for a design system\u2019s resets and fonts.',
      'The class and style bindings replaced NgClass and NgStyle because they need no import, generate less code, and are checked by the compiler. The directives still work and there are automatic migrations for both.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <!-- single class, toggled by a boolean -->\n    <p class="row" [class.on]="on">\n      class.on is {{ on }}\n    </p>\n\n    <!-- a whole class string or record -->\n    <p [class]="{ row: true, on: on, wide: width > 60 }">record binding</p>\n\n    <!-- style with a unit suffix -->\n    <div class="track">\n      <div class="fill" [style.width.%]="width"></div>\n    </div>\n\n    <!-- style record -->\n    <p [style]="{ color: on ? '#B4005A' : '#55525F', fontWeight: on ? 600 : 400 }">\n      styled by record\n    </p>\n\n    <button (click)="on = !on">Toggle</button>\n    <button (click)="width = width >= 100 ? 20 : width + 20">Grow</button>\n  \`,\n  styles: \`\n    .row { padding: 4px 8px; border: 1px solid #CFCCD6; margin-bottom: 6px; }\n    .row.on { border-color: #B4005A; color: #B4005A; }\n    .wide { letter-spacing: .08em; }\n    .track { height: 10px; background: #E6E4EB; margin-bottom: 6px; }\n    .fill { height: 10px; background: #B4005A; }\n    :host { display: block; }\n  \`\n})\nclass App {\n  protected on = false;\n  protected width = 40;\n}`,
    anno:[
      ['styles: `...`','Inline styles, scoped to this component. styleUrl: \'./thing.css\' or styleUrls: [...] point at real files, which is the norm in a project.'],
      ['[class.on]="on"','One class, one boolean. The clearest form when there is a single condition, and it composes with a static class attribute on the same element.'],
      ['[class]="{ row: true, on: on }"','A record binding. Also accepts a string or an array. This is what NgClass did, without the directive.'],
      ['[style.width.%]="width"','A single style property with an explicit unit. .px, .%, .em and friends all work, and they remove the string concatenation that used to be needed.'],
      [':host { display: block; }','Styles the component\u2019s own element. A component element is inline by default, which surprises people the first time a width has no effect.'],
      ['::ng-deep','The escape hatch for styling inside a child component. Deprecated for years and still the only option in places; prefer exposing a CSS custom property from the child instead.'],
      ['encapsulation: ViewEncapsulation.None / ShadowDom','None makes the styles global; ShadowDom uses real Shadow DOM. v21 added an experimental ExperimentalIsolatedShadowDom that also blocks global styles from leaking in.']
    ],
    mistakes:[
      ['Expecting component styles to reach into a child','','They cannot. Emulated encapsulation scopes selectors to this component\u2019s own elements. Style the child from inside the child, pass a class as an input, or expose a custom property.'],
      ['Setting a width on a component tag and seeing nothing','','The host element is display: inline unless you say otherwise. Add :host { display: block } in the child.'],
      ['Reaching for ::ng-deep','','It leaks out of the component and is on a very long deprecation path. It is a last resort, not a technique.'],
      ['Building class strings by hand in the class','','[class]="\'row \' + (on ? \'on\' : \'\')" works and is worse than [class.on]="on". Keep the condition in the binding where the compiler can see it.']
    ],
    ex:{
      task:'Build a Chip component with a tone input of \u2018info\u2019, \u2018warn\u2019 or \u2018ok\u2019 that styles itself from that input, plus a removable flag. Prove the styles do not leak into the parent.',
      start:`@Component({\n  selector: 'app-chip',\n  template: \`<span>your template</span>\`\n})\nclass Chip {\n  readonly tone = input<'info' | 'warn' | 'ok'>('info');\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Chip],\n  template: \`<app-chip />\`\n})\nclass App {}`,
      sol:`@Component({\n  selector: 'app-chip',\n  template: \`\n    <span class="chip" [class]="'tone-' + tone()">\n      <ng-content />\n      @if (removable()) {\n        <button class="x" (click)="remove.emit()" aria-label="Remove">\u00d7</button>\n      }\n    </span>\n  \`,\n  styles: \`\n    .chip {\n      display: inline-flex; gap: 6px; align-items: center;\n      padding: 2px 9px; border-radius: 999px; font-size: 12px;\n      border: 1px solid currentColor;\n    }\n    .tone-info { color: #55525F; }\n    .tone-warn { color: #7A4E00; background: #F4EEE2; }\n    .tone-ok   { color: #B4005A; background: #F7E6EE; }\n    .x { border: 0; background: none; color: inherit; cursor: pointer; padding: 0; }\n  \`\n})\nclass Chip {\n  readonly tone = input<'info' | 'warn' | 'ok'>('info');\n  readonly removable = input(false);\n  readonly remove = output<void>();\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Chip],\n  template: \`\n    <app-chip>plain</app-chip>\n    <app-chip tone="warn">flaky</app-chip>\n    <app-chip tone="ok" [removable]="true" (remove)="removed = removed + 1">passing</app-chip>\n    <p class="chip">This paragraph has class="chip" and is not styled like one.</p>\n    <p>removed: {{ removed }}</p>\n  \`\n})\nclass App {\n  protected removed = 0;\n}`,
      why:'The tone becomes a class name, so the CSS holds the three variants and the template holds one binding, which scales better than a style record with three ternaries in it. The paragraph in the parent carries class="chip" and gets none of the chip styling, which is emulated encapsulation doing its job. Two details worth stealing: `border: 1px solid currentColor` means each tone only has to set `color` once, and `<ng-content />` lets the caller supply the label instead of passing it as an input, which is lesson 21. Note also that `tone="warn"` is a plain string attribute, valid because the input\u2019s type is a string union; a number or boolean input would need square brackets.'
    },
    mm:'Component styles are scoped by default, and anything dynamic belongs in a class or style binding rather than in a directive.'
  },
  {
    id:'9', file:'pipes.ts', t:'Pipes: formatting in the template',
    what:[
      'A pipe transforms a value for display: `{{ price | currency:\'GBP\' }}`. Angular ships pipes for dates, numbers, currency, percentages, case, JSON, and slicing.',
      'You can write your own: a class with a `@Pipe` decorator and a `transform` method. Pipes are pure by default, which means Angular only re-runs them when the input value changes.'
    ],
    why:[
      'Formatting is presentation, and putting it in the template keeps the class holding data rather than strings. The same number can then appear as currency in one place and a raw value in another without a second field.',
      'Purity is the important part. A pure pipe is a cached function of its inputs, so it runs once per changed value rather than on every change detection pass, which is what makes `| date` on a table of a thousand rows viable.',
      'The limit is that a pipe is for formatting, not for fetching or filtering. Angular deliberately ships no sorting or filtering pipe, because a filter in a template hides an O(n) operation inside a template pass and defeats change detection; the framework wants that work in the class where you can control it.'
    ],
    code:`@Pipe({ name: 'initials' })\nclass InitialsPipe implements PipeTransform {\n  transform(name: string, max = 2): string {\n    return name\n      .split(' ')\n      .slice(0, max)\n      .map(part => part[0]?.toUpperCase() ?? '')\n      .join('');\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [InitialsPipe, DecimalPipe, PercentPipe, DatePipe, UpperCasePipe, JsonPipe],\n  template: \`\n    <p>{{ user.name }} \u2192 <strong>{{ user.name | initials }}</strong></p>\n    <p>with an argument: {{ user.name | initials: 3 }}</p>\n\n    <p>{{ 1234567.891 | number: '1.0-2' }}</p>\n    <p>{{ 0.4271 | percent: '1.1-1' }}</p>\n    <p>{{ today | date: 'longDate' }}</p>\n    <p>{{ user.name | uppercase }}</p>\n\n    <!-- chained, left to right -->\n    <p>{{ user.name | initials | uppercase }}</p>\n\n    <!-- for debugging only -->\n    <pre>{{ user | json }}</pre>\n  \`\n})\nclass App {\n  protected readonly user = { name: 'ada lovelace king', id: 7 };\n  protected readonly today = new Date();\n}`,
    anno:[
      ["@Pipe({ name: 'initials' })",'The name is what the template uses. Pipes are standalone by default now, so they go in the consuming component\u2019s imports array like any other dependency.'],
      ['implements PipeTransform','Optional but conventional: it makes TypeScript check that transform exists with a sane signature.'],
      ['transform(name: string, max = 2)','The first parameter is the piped value; the rest come from the template after colons. Default values work as they do anywhere.'],
      ["{{ value | number: '1.0-2' }}",'The digits string is minIntegerDigits.minFractionDigits-maxFractionDigits. Worth memorising, because it is the answer to "why does my price show six decimal places".'],
      ['{{ a | b | c }}','Chained left to right, so the output of one is the input of the next.'],
      ['imports: [DecimalPipe, DatePipe]','Import the individual pipes. Importing CommonModule also works and pulls in everything; v21 added a migration to convert those imports to individual ones.'],
      ['pure: false','Makes the pipe run on every change detection pass. Occasionally necessary, usually a mistake, and almost always slower than doing the work in the class.']
    ],
    mistakes:[
      ['Writing a filter or sort pipe','','Angular ships neither on purpose. A pipe cannot know when your array mutated unless it is impure, and an impure pipe runs on every pass. Filter and sort in the class, ideally in a computed().'],
      ['Forgetting to import the pipe','NG8004: No pipe found with name \'initials\'.','Add it to imports. Note the same error appears when you import CommonModule but the pipe is your own.'],
      ['Doing async work in transform','','A pipe is synchronous and may be called at any time. For asynchronous values use a resource, lesson 31, or toSignal, lesson 17.'],

      task:'Write a `duration` pipe that turns a number of seconds into "1h 04m 09s", dropping empty leading units, and use it in a small table.',
      start:`@Pipe({ name: 'duration' })\nclass DurationPipe implements PipeTransform {\n  transform(seconds: number): string {\n    // your code\n    return '';\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [DurationPipe],\n  template: \`<p>{{ 3849 | duration }}</p>\`\n})\nclass App {}`,
      sol:`@Pipe({ name: 'duration' })\nclass DurationPipe implements PipeTransform {\n  transform(seconds: number | null | undefined): string {\n    if (seconds == null || seconds < 0) return '\u2014';\n\n    const h = Math.floor(seconds / 3600);\n    const m = Math.floor((seconds % 3600) / 60);\n    const s = Math.floor(seconds % 60);\n    const pad = (n: number) => String(n).padStart(2, '0');\n\n    if (h > 0) return \`\${h}h \${pad(m)}m \${pad(s)}s\`;\n    if (m > 0) return \`\${m}m \${pad(s)}s\`;\n    return \`\${s}s\`;\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [DurationPipe],\n  template: \`\n    <table>\n      <tr><th>Track</th><th>Length</th></tr>\n      @for (t of tracks; track t.id) {\n        <tr><td>{{ t.title }}</td><td>{{ t.seconds | duration }}</td></tr>\n      }\n      <tr><td>Total</td><td>{{ total | duration }}</td></tr>\n    </table>\n  \`\n})\nclass App {\n  protected readonly tracks = [\n    { id: 1, title: 'Opening', seconds: 42 },\n    { id: 2, title: 'Middle', seconds: 605 },\n    { id: 3, title: 'Finale', seconds: 3849 },\n    { id: 4, title: 'Missing', seconds: null as number | null }\n  ];\n\n  protected get total() {\n    return this.tracks.reduce((sum, t) => sum + (t.seconds ?? 0), 0);\n  }\n}`,
