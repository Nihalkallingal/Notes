      ['Hand-rolling an overlay','','Positioning, flipping at the viewport edge, scroll blocking, and focus restoration are more cases than they look. `cdk/overlay` has them.'],
      ['Copying an aria pattern from a blog post','','ARIA patterns have many keyboard cases and the specifications change. Take the directive and let it be maintained for you.']
    ],
    ex:{
      task:'For a design system with its own visual language, decide what to take from these packages and what to write. Justify each line.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    <table>\n      <tr><th>Component</th><th>Decision</th><th>Why</th></tr>\n      @for (r of decisions; track r.component) {\n        <tr>\n          <td>{{ r.component }}</td>\n          <td [class.take]="r.decision !== 'write it'">{{ r.decision }}</td>\n          <td>{{ r.why }}</td>\n        </tr>\n      }\n    </table>\n    <p><small>\n      The rule: write anything whose difficulty is visual, take anything whose\n      difficulty is behavioural.\n    </small></p>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; vertical-align: top; }\n    .take { color: #B4005A; }\n  \`\n})\nclass App {\n  protected readonly decisions = [\n    { component: 'Button, chip, badge, card', decision: 'write it',\n      why: 'a button element and CSS. No behaviour to get wrong.' },\n    { component: 'Text input, textarea', decision: 'write it',\n      why: 'native elements plus signal forms. A label and an id is the whole job.' },\n    { component: 'Dialog', decision: 'cdk/overlay + cdk/a11y',\n      why: 'positioning, scroll blocking, focus trap and restoration' },\n    { component: 'Menu, select, combobox, tabs, tree', decision: '@angular/aria',\n      why: 'long keyboard and ARIA contracts that change over time' },\n    { component: 'Tooltip and popover', decision: 'cdk/overlay',\n      why: 'flipping at the viewport edge and following on scroll' },\n    { component: 'Long list', decision: 'cdk/scrolling',\n      why: 'virtual scrolling, and it interacts badly with find-in-page if hand-rolled' },\n    { component: 'Data table', decision: 'cdk/table',\n      why: 'unstyled, and sorting and paging are more cases than they look' },\n    { component: 'Date picker', decision: 'a library, or Material',\n      why: 'locales, time zones, keyboard, and a11y. Never write one.' },\n    { component: 'Charts', decision: 'a third party, lazily loaded',\n      why: 'not a framework concern, and heavy: @defer or injectAsync' }\n  ];\n}`,
      why:'The dividing line is whether the difficulty is visual or behavioural. A button is entirely visual, so writing it costs an hour and gives you exactly the design you want. A combobox is almost entirely behavioural, and the ARIA pattern has more keyboard cases than any team will discover from a design review, so taking `@angular/aria` and styling it is both faster and more correct. The date picker is the clearest case in the table: it combines locales, time zones, keyboard navigation, and screen reader announcements, and the number of teams who should write their own is approximately zero. Note the last row: charts are also a lazy-loading decision, which is where lesson 38 comes back.'
    },
    mm:'Write what is visually hard and take what is behaviourally hard: Material for speed, the CDK and aria for your own design system.'
  },
  {
    id:'48', file:'i18n.ts', t:'Internationalisation',
    what:[
      'Angular\u2019s built-in i18n marks text in templates with an `i18n` attribute, extracts it into a translation file with `ng extract-i18n`, and builds one bundle per locale at compile time.',
      'The alternative is a runtime library such as Transloco or ngx-translate, which loads translations as JSON and switches language without a rebuild.'
    ],
    why:[
      'The built-in approach compiles the translated strings into the template, so there is no runtime lookup, no flash of untranslated text, and no translation bundle to download. That is why it is the fastest option and why it is the right default for a public site where each locale can be served from its own URL.',
      'Its cost is the build: one bundle per locale, and a deployment that routes to the right one. Switching language in the browser means a page load, which is fine for a marketing site and awkward for an internal tool where users flip between languages.',
      'Localisation is more than text. Dates, numbers, currencies and plurals differ, which is what the built-in pipes and the ICU message syntax are for, and a translated string with a hard-coded date format is only half done.'
    ],
    code:`// The built-in approach, in a template:\n//\n//   <h1 i18n="site header|The main page title">Invoices</h1>\n//   <p i18n>You have {{ count }} unpaid invoices.</p>\n//\n//   <!-- plurals and selects, with ICU syntax -->\n//   <p i18n>{count, plural, =0 {no invoices} =1 {one invoice} other {{{count}} invoices}}</p>\n//\n//   <!-- attributes too -->\n//   <img [src]="logo" i18n-alt alt="Company logo" />\n//\n//   // in code\n//   const message = $localize\\\`Saved \\\${count}:count: invoices\\\`;\n//\n//   ng extract-i18n --output-path src/locale     # produces messages.xlf\n//   ng build --localize                          # one bundle per locale\n//\n// The locale-aware pipes work without any of that, so the snippet below is\n// runnable and shows the part people forget: formatting is localisation too.\n\n@Component({\n  selector: 'app-root',\n  imports: [DecimalPipe, CurrencyPipe, DatePipe, PercentPipe],\n  template: \`\n    <p>Formatting is half of localisation, and Intl does it for you:</p>\n    <table>\n      <tr><th>Locale</th><th>Number</th><th>Currency</th><th>Date</th></tr>\n      @for (l of locales; track l.tag) {\n        <tr>\n          <td><code>{{ l.tag }}</code></td>\n          <td>{{ fmtNumber(l.tag, 1234567.891) }}</td>\n          <td>{{ fmtCurrency(l.tag, l.currency, 1234.5) }}</td>\n          <td>{{ fmtDate(l.tag) }}</td>\n        </tr>\n      }\n    </table>\n\n    <p>Angular's pipes use the application's locale:</p>\n    <p>{{ 1234567.891 | number: '1.0-2' }} \u2014 {{ 0.4271 | percent }} \u2014 {{ today | date: 'longDate' }}</p>\n\n    <p><small>Note the decimal separators, the currency position, and the day and month order.</small></p>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; margin-bottom: 8px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; }\n  \`\n})\nclass App {\n  protected readonly today = new Date();\n\n  protected readonly locales = [\n    { tag: 'en-GB', currency: 'GBP' },\n    { tag: 'de-DE', currency: 'EUR' },\n    { tag: 'fr-FR', currency: 'EUR' },\n    { tag: 'ja-JP', currency: 'JPY' },\n    { tag: 'ar-EG', currency: 'EGP' }\n  ];\n\n  protected fmtNumber(tag: string, n: number) {\n    return new Intl.NumberFormat(tag).format(n);\n  }\n  protected fmtCurrency(tag: string, currency: string, n: number) {\n    return new Intl.NumberFormat(tag, { style: 'currency', currency }).format(n);\n  }\n  protected fmtDate(tag: string) {\n    return new Intl.DateTimeFormat(tag, { dateStyle: 'medium' }).format(this.today);\n  }\n}`,
    anno:[
      ['i18n="meaning|description"','The attribute that marks text for extraction. The meaning and description go to the translator, and the same meaning plus text produces one shared translation unit.'],
      ['$localize`...`','Marks a string in TypeScript rather than a template. Needs `@angular/localize` in the polyfills.'],
      ['ICU plurals and selects','`{count, plural, =0 {...} other {...}}`. Necessary because languages have different plural categories: some have one form, Arabic has six.'],
      ['ng extract-i18n','Produces an XLIFF or XMB file for translators. Run it as part of the workflow, not once.'],
      ['One bundle per locale','`ng build --localize` with an `i18n` block in `angular.json`. Each locale gets its own output directory, served from its own path or subdomain.'],
      ['LOCALE_ID','The token holding the active locale, which the pipes read. You can provide it, but with the built-in approach the build sets it.'],
      ['Runtime libraries','Transloco and ngx-translate load JSON at runtime, so language can change without a reload. The trade is a lookup, a bundle, and handling the first paint.'],
      ['Direction','Right-to-left is layout, not text: `dir="rtl"`, logical CSS properties such as `margin-inline-start`, and mirrored icons. Translation alone does not do it.']
    ],
    mistakes:[
      ['Concatenating translated strings','','\'You have \' + n + \' invoices\' cannot be translated correctly, because word order and plural rules differ. Use one message with a placeholder and ICU plurals.'],
      ['Hard-coding a date or number format','','`toFixed(2)` and a manual `DD/MM/YYYY` are wrong in most of the world. Use the pipes or `Intl`, which already know every locale.'],
      ['Forgetting attributes and aria labels','','`i18n-alt`, `i18n-title`, `i18n-aria-label`. An untranslated alt text is invisible to sighted reviewers and the only text a screen reader user gets.'],
      ['Treating right-to-left as a translation problem','','The layout has to mirror. Use logical properties from the start; retrofitting them across a codebase is far more work than writing them.']
    ],
    ex:{
      task:'Take a status line with a count and a date and make it translatable and locale-correct. Say which parts a translator sees.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p>You have {{ count }} unpaid invoices, oldest from {{ oldest.toDateString() }}.</p>\n  \`\n})\nclass App {\n  protected readonly count = 3;\n  protected readonly oldest = new Date('2026-04-02');\n}`,
      sol:`// The translatable version, as it would appear in a real template:\n//\n//   <p i18n="invoices status|Summary on the invoices screen">\n//     {count, plural,\n//       =0 {You have no unpaid invoices.}\n//       =1 {You have one unpaid invoice, from {{ oldest | date: 'longDate' }}.}\n//       other {You have {{ count }} unpaid invoices, the oldest from\n//              {{ oldest | date: 'longDate' }}.}}\n//   </p>\n//\n// The translator receives one unit per plural case, with the placeholders\n// intact and reorderable. They never see a date format, because the pipe\n// resolves that from LOCALE_ID at build time.\n\n@Component({\n  selector: 'app-root',\n  imports: [DatePipe],\n  template: \`\n    <p>Locale-correct, and shaped so a translator can reorder it:</p>\n    @switch (count()) {\n      @case (0) { <p>You have no unpaid invoices.</p> }\n      @case (1) { <p>You have one unpaid invoice, from {{ oldest | date: 'longDate' }}.</p> }\n      @default {\n        <p>You have {{ count() }} unpaid invoices, the oldest from\n           {{ oldest | date: 'longDate' }}.</p>\n      }\n    }\n\n    <button (click)="count.update(n => (n + 1) % 4)">count: {{ count() }}</button>\n\n    <p><small>\n      The date goes through a pipe rather than toDateString(), so it follows the\n      application locale instead of always being American English.\n    </small></p>\n  \`\n})\nclass App {\n  protected readonly count = signal(3);\n  protected readonly oldest = new Date('2026-04-02');\n}`,
      why:'Two problems fixed. The plural cases are separate messages, so a translator can write the right form for their language and put the number wherever their grammar needs it, which string concatenation makes impossible. And `toDateString()` is replaced by the date pipe, which reads `LOCALE_ID`; `toDateString` produces "Thu Apr 02 2026" in every locale on earth, which is a bug that never shows up in review because it looks fine to an English-speaking reviewer. The `@switch` here is the runnable stand-in for ICU syntax; in a real template you would write the ICU message and let the extractor produce one unit per case, so the branching lives in the translation rather than in your component.'
    },
    mm:'Mark whole messages rather than fragments, let ICU handle plurals, and let the pipes handle every date, number, and currency.'
  },
  {
    id:'49', file:'libraries.ts', t:'Libraries, monorepos, and boundaries',
    what:[
      'The CLI can build libraries as well as applications: `ng generate library` creates a buildable package with `ng-packagr`, which you can publish to npm or consume inside the same workspace.',
      'A workspace can hold several applications and libraries, and Nx extends that with a dependency graph, affected-only builds, and lint rules that enforce which library may import which.'
    ],
    why:[
      'The reason to split is not tidiness, it is enforcement. Inside one application, nothing stops a component in the checkout feature importing a service from the admin feature, and once that has happened a hundred times the features cannot be reasoned about or deleted separately.',
      'A library boundary is a compile-time wall. If checkout cannot import admin because the build does not allow it, then the rule is a fact rather than a convention nobody enforces at review time.',
      'The cost is real: more configuration, more build steps, and a tendency to over-split. A shared library with one consumer is worse than a folder, so the rule of two applies here as much as anywhere.'
    ],
    code:`// The commands:\n//\n//   ng generate library ui            # projects/ui, buildable with ng-packagr\n//   ng build ui                       # produces dist/ui, publishable\n//   ng generate application admin     # a second app in the same workspace\n//\n// tsconfig paths make it importable by name inside the workspace:\n//\n//   "paths": { "@acme/ui": ["projects/ui/src/public-api.ts"] }\n//\n// then, from an app:  import { Chip } from '@acme/ui';\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p><strong>A layered workspace, and the rule for each layer:</strong></p>\n    <ul class="tree">\n      @for (n of layers; track n.path) {\n        <li [style.padding-left.px]="n.depth * 16">\n          <code>{{ n.path }}</code>\n          <span class="note">\u2014 {{ n.rule }}</span>\n        </li>\n      }\n    </ul>\n\n    <p><strong>What may import what:</strong></p>\n    <table>\n      <tr><th>From</th><th>May import</th></tr>\n      @for (r of rules; track r.from) {\n        <tr><td><code>{{ r.from }}</code></td><td>{{ r.may }}</td></tr>\n      }\n    </table>\n  \`,\n  styles: \`\n    .tree { list-style: none; padding: 0; font-size: 13px; }\n    .note { color: #55525F; }\n    table { border-collapse: collapse; font-size: 13px; margin-top: 8px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; }\n  \`\n})\nclass App {\n  protected readonly layers = [\n    { depth: 0, path: 'apps/shop', rule: 'an application: composes features, owns routing' },\n    { depth: 0, path: 'apps/admin', rule: 'a second application, sharing libraries' },\n    { depth: 0, path: 'libs/feature-checkout', rule: 'a feature: routes and screens, lazy loaded' },\n    { depth: 0, path: 'libs/feature-catalogue', rule: 'a feature: knows nothing about checkout' },\n    { depth: 0, path: 'libs/domain-orders', rule: 'types, validation, and API access for one domain' },\n    { depth: 0, path: 'libs/ui', rule: 'presentational components, no domain knowledge' },\n    { depth: 0, path: 'libs/util-format', rule: 'pure functions and pipes' }\n  ];\n\n  protected readonly rules = [\n    { from: 'apps/*', may: 'any library' },\n    { from: 'libs/feature-*', may: 'domain, ui, util \u2014 never another feature' },\n    { from: 'libs/domain-*', may: 'util \u2014 never ui, never a feature' },\n    { from: 'libs/ui', may: 'util only. A chip that knows what an invoice is is misplaced.' },\n    { from: 'libs/util-*', may: 'nothing in the workspace' }\n  ];\n}`,
    anno:[
      ['ng generate library','Creates a project built with `ng-packagr`, with a `public-api.ts` that defines exactly what consumers can import. Everything not exported there is private by construction.'],
      ['public-api.ts','The library\u2019s front door. The single most useful thing about a library boundary: you can refactor anything not listed there without touching a consumer.'],
      ['tsconfig paths','How a workspace app imports a library by name rather than by relative path, so the import looks the same as it would from npm.'],
      ['Secondary entry points','`@acme/ui/table` as a separate entry point, so a consumer importing one component does not pull in the whole library.'],
      ['Nx module boundaries','A lint rule that fails the build when a tagged project imports something it should not. This is what turns the table above from documentation into enforcement.'],
      ['affected builds','Nx computes the dependency graph and builds or tests only what a change can affect, which is what makes a large monorepo tolerable in CI.'],
      ['One-way dependencies','Features may depend on domain and ui; the reverse is always a mistake. A cycle between libraries is a design error the build should reject.'],
      ['When not to split','A library with one consumer is a folder with extra steps. Split when a second consumer appears or when you need to enforce a boundary.']
    ],
    mistakes:[
      ['Splitting by technical type','','`libs/components`, `libs/services`, `libs/models` recreates the group-by-kind problem at a larger scale, and every change spans three libraries.'],
      ['A shared library that becomes a dumping ground','','If only one feature imports it, it belongs in that feature. `ui` and `util` earn their names by having several consumers.'],
      ['Domain knowledge in the ui library','','A component that knows what an invoice is cannot be reused and drags the domain types into every consumer. Presentational means presentational.'],
      ['Publishing internal libraries to npm just to share them','','Inside a workspace, path mappings are enough. Publish when someone outside the repository needs it.']
    ],
    ex:{
      task:'Two applications need to share a design system, a currency formatter, and an orders API, but must not share their feature code. Lay out the workspace and the rules.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`interface Node { depth: number; path: string; note: string }\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <ul class="tree">\n      @for (n of tree; track n.path) {\n        <li [style.padding-left.px]="n.depth * 14">\n          <code>{{ n.path }}</code>\n          @if (n.note) { <span class="note">{{ n.note }}</span> }\n        </li>\n      }\n    </ul>\n    <p><small>\n      The rule that does the work: features are leaves. Nothing imports a feature\n      except an application, so a feature can be deleted in one commit.\n    </small></p>\n  \`,\n  styles: \`\n    .tree { list-style: none; padding: 0; font-size: 13px; }\n    .note { color: #55525F; margin-left: 6px; }\n  \`\n})\nclass App {\n  protected readonly tree: Node[] = [\n    { depth: 0, path: 'apps/shop', note: 'routes, shell, bootstrap' },\n    { depth: 0, path: 'apps/back-office', note: 'a different shell, same libraries' },\n\n    { depth: 0, path: 'libs/ui', note: 'the design system. Imports util only.' },\n    { depth: 1, path: 'src/public-api.ts', note: 'the front door: only what consumers may use' },\n    { depth: 1, path: 'src/lib/chip.ts', note: '' },\n    { depth: 1, path: 'src/lib/dialog.ts', note: 'built on cdk/overlay' },\n\n    { depth: 0, path: 'libs/util-format', note: 'the currency formatter. Pure, imports nothing.' },\n\n    { depth: 0, path: 'libs/domain-orders', note: 'Order type, validation, and the API service' },\n    { depth: 1, path: 'src/lib/order.ts', note: 'the interface, shared by both apps' },\n    { depth: 1, path: 'src/lib/orders-api.ts', note: '@Service(), httpResource-based' },\n\n    { depth: 0, path: 'libs/feature-checkout', note: 'shop only. May import domain, ui, util.' },\n    { depth: 0, path: 'libs/feature-refunds', note: 'back-office only. Must not import checkout.' },\n\n    { depth: 0, path: 'eslint boundary tags', note: 'type:app > type:feature > type:domain > type:ui > type:util' }\n  ];\n}`,
      why:'The three shared things land in three different libraries because they have different dependency rules: `util-format` imports nothing, `ui` imports only util, and `domain-orders` imports util and is allowed to know about HTTP. Keeping them separate is what stops the design system dragging the orders API into a marketing page. The features are deliberately leaves that no library imports, which is the property that makes them deletable: when refunds moves to another product, one directory and one route entry go with it. The last line is the part that makes it real, since without lint-enforced tags this is a diagram that will be violated within a month.'
    },
    mm:'A library boundary turns an architectural rule into a compile error, and features should be leaves nothing else imports.'
  },
  {
    id:'50', file:'devtools.ts', t:'Angular DevTools',
    what:[
      'Angular DevTools is a browser extension with three main panels: a component tree with the current state of each component\u2019s inputs and properties, a profiler that records change detection, and, more recently, graphs of your signals and your injectors.',
      'Since v22 a development build also exposes the signal graph and the dependency injection graph to Chrome DevTools as third-party tools.'
    ],
    why:[
      'Angular\u2019s two hardest questions to answer by reading code are "why did this component re-render" and "which instance of this service am I looking at". The profiler answers the first by recording every change detection pass and what triggered it; the injector graph answers the second by showing the resolution path.',
      'The signal graph is the newer one and the most useful in a signals codebase: it shows which signals a computed depends on and what it in turn feeds, which turns an invisible dependency network into a picture. A computed that recalculates too often is usually one unexpected edge in that graph.',
      'Because the graphs are exposed to Chrome DevTools, an agent connected through the Chrome DevTools MCP can read them, which is v22\u2019s answer to "the AI cannot see my running application".'
    ],
    code:`// DevTools is an extension, so this cannot demonstrate it. What it CAN do\n// is show the instrumentation you would use to confirm what DevTools tells\n// you, which is worth having in a scratch component anyway.\n\n@Component({\n  selector: 'app-watched',\n  template: \`<p>{{ label() }}: refreshed {{ hits() }}\u00d7, value {{ value() }}</p>\`\n})\nclass Watched {\n  readonly label = input('child');\n  readonly value = input(0);\n\n  private n = 0;\n  protected hits() { return ++this.n; }   // instrumentation only\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Watched],\n  template: \`\n    <button (click)="a.update(n => n + 1)">change a</button>\n    <button (click)="b.update(n => n + 1)">change b</button>\n\n    <app-watched label="reads a" [value]="a()" />\n    <app-watched label="reads b" [value]="b()" />\n    <app-watched label="reads the sum" [value]="sum()" />\n\n    <p>computed runs: sum {{ sumRuns() }}, expensive {{ expensiveRuns() }}</p>\n    <button (click)="showExpensive.set(!showExpensive())">\n      {{ showExpensive() ? 'Hide' : 'Show' }} the expensive value\n    </button>\n    @if (showExpensive()) { <p>expensive: {{ expensive() }}</p> }\n\n    <p><small>\n      The expensive computed does not run at all until something reads it.\n      That is laziness, and the signal graph in DevTools shows the same thing.\n    </small></p>\n  \`\n})\nclass App {\n  protected readonly a = signal(1);\n  protected readonly b = signal(1);\n  protected readonly showExpensive = signal(false);\n\n  private sumCount = 0;\n  private expensiveCount = 0;\n  protected readonly sumRuns = signal(0);\n  protected readonly expensiveRuns = signal(0);\n\n  protected readonly sum = computed(() => {\n    this.sumRuns.set(++this.sumCount);\n    return this.a() + this.b();\n  });\n\n  protected readonly expensive = computed(() => {\n    this.expensiveRuns.set(++this.expensiveCount);\n    let total = 0;\n    for (let i = 0; i < 200000; i++) total += i % 7;\n    return total + this.a();\n  });\n}`,
    anno:[
      ['The Components panel','The tree, with each component\u2019s inputs and properties, editable live. The fastest way to answer "what does this component actually think its input is".'],
      ['The Profiler','Records change detection. Each bar is a pass, and selecting one shows which components were checked and how long each took, plus what triggered the pass.'],
      ['The signal graph','Nodes for signals and computeds, edges for dependencies. An unexpected edge is usually the reason something recalculates more than you thought.'],
      ['The injector graph','Shows the injector hierarchy and where a token resolved from, which is how you diagnose "why are there two instances of this service".'],
      ['Chrome DevTools integration','v22 registers the signal and DI graphs as third-party tools in Chrome DevTools for development builds, which also makes them reachable by an agent through `chrome-devtools-mcp`.'],
      ['Development builds only','The instrumentation is stripped from production, so profile a production build for real timings and use a development build for the "why" questions.'],
      ['ng.getComponent($0)','The global debug API. With an element selected in the elements panel, this gives you its component instance in the console; `ng.applyChanges` forces a check.'],
      ['Instrumentation like this','A counter in a template is impure and should never ship. As a temporary measure while you read a profile, it is faster than reasoning.']
    ],
    mistakes:[
      ['Optimising without a profile','','The most common waste of effort. Record the interaction first; the answer is frequently a network request or a layout thrash rather than change detection.'],
      ['Trusting development timings','','Development Angular is several times slower and does extra checking. Use it for relative comparisons and the "why did this render" answers, and measure a production build for absolute numbers.'],
      ['Chasing pass counts','','Sixty cheap passes are better than one that takes 200ms. The unit is milliseconds and dropped frames.'],
      ['Leaving instrumentation in','','A method call in a template runs on every refresh, so the counter that helped you diagnose the problem becomes a small permanent one.']
    ],
    ex:{
      task:'Write down the diagnostic path for three complaints: the app is slow to load, typing is laggy, and one panel updates late. Say which tool answers each.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    <table>\n      <tr><th>Complaint</th><th>Tool</th><th>What you are looking for</th><th>Likely fix</th></tr>\n      @for (r of paths; track r.complaint) {\n        <tr>\n          <td>{{ r.complaint }}</td>\n          <td><code>{{ r.tool }}</code></td>\n          <td>{{ r.look }}</td>\n          <td>{{ r.fix }}</td>\n        </tr>\n      }\n    </table>\n    <p><small>\n      In every row the first step is the same: reproduce it and record it. The\n      second bottleneck is never the one you predicted.\n    </small></p>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; vertical-align: top; }\n  \`\n})\nclass App {\n  protected readonly paths = [\n    {\n      complaint: 'Slow to load',\n      tool: 'Lighthouse, then the bundle report',\n      look: 'transfer size, and whether the first screen waits on a request',\n      fix: 'lazy routes, @defer below the fold, SSR, or moving data to the server'\n    },\n    {\n      complaint: 'Typing is laggy',\n      tool: 'Angular DevTools Profiler',\n      look: 'one long pass, or many passes per keystroke, and which component dominates',\n      fix: 'a computed instead of a method in the template, or move the fast-changing state down'\n    },\n    {\n      complaint: 'A panel updates late or not at all',\n      tool: 'the signal graph, then the Components panel',\n      look: 'whether the panel actually reads the signal that changed',\n      fix: 'a mutated object, or a plain field changed from an async callback: put it in a signal'\n    },\n    {\n      complaint: 'Two panels disagree',\n      tool: 'the injector graph',\n      look: 'whether the service resolved to the root or to a component injector',\n      fix: 'remove a stray providers array, or scope it deliberately'\n    },\n    {\n      complaint: 'A computed recalculates constantly',\n      tool: 'the signal graph',\n      look: 'an unexpected incoming edge',\n      fix: 'an object rebuilt every read, or a signal read that should be untracked'\n    }\n  ];\n}`,
      why:'Each complaint has a different tool, and picking the wrong one wastes the afternoon: profiling change detection tells you nothing about a slow first load, and a bundle report tells you nothing about a laggy keystroke. The two rows people skip are the last two, which are the ones the newer graphs made easy. "Two panels disagree" is nearly always a duplicate provider, and the injector graph shows it in seconds where reading code can take an hour. "A computed recalculates constantly" is nearly always one edge you did not know about, usually an object literal rebuilt on every read, and the signal graph draws it. The instruction at the bottom is the one that matters most: fix one thing and measure again.'
    },
    mm:'The Profiler answers why something re-rendered, the signal graph answers why something recalculated, and the injector graph answers why there are two of something.'
  },
  {
    id:'51', file:'upgrade-treadmill.ts', t:'The upgrade treadmill',
    what:[
      'Angular releases a major version on a fixed schedule and supports each one for a fixed period. From v22 the cadence is yearly, every June, and majors are supported for two years, up from six months and eighteen.',
      '`ng update` is the mechanism: it bumps the packages and runs schematics that rewrite your code for the breaking changes between adjacent versions.'
    ],
    why:[
      'The schedule is the deal Angular offers: frequent, small, automated breaking changes instead of rare, large, manual ones. It only works if you stay on it, because the migrations are written to move between neighbouring versions.',
      'Falling behind compounds. Each skipped major is a set of schematics that never ran, so the work does not disappear, it just becomes yours to do by hand, all at once, without the tooling. Teams stuck on old versions are usually there because an upgrade was deferred until it looked daunting.',
      'The other reason is security. Vulnerabilities are fixed in the supported majors only, and the three CVEs disclosed in late 2025 covering SSR data leakage, XSRF token exposure, and stored XSS were patched in v19, v20 and v21 and not in anything older. Running an unsupported version is also an audit finding under most compliance regimes.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p><strong>The schedule, and where the line currently sits:</strong></p>\n    <table>\n      <tr><th>Version</th><th>Released</th><th>Headline</th><th>Status</th></tr>\n      @for (v of versions; track v.v) {\n        <tr>\n          <td><code>v{{ v.v }}</code></td>\n          <td>{{ v.released }}</td>\n          <td>{{ v.headline }}</td>\n          <td [class.eol]="v.status === 'end of life'">{{ v.status }}</td>\n        </tr>\n      }\n    </table>\n\n    <p><strong>The routine:</strong></p>\n    <ol>\n      @for (s of routine; track s) { <li>{{ s }}</li> }\n    </ol>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; vertical-align: top; }\n    .eol { color: #7A4E00; }\n    li { font-size: 13px; margin-bottom: 3px; }\n  \`\n})\nclass App {\n  // Angular versions and their headline changes, as of this course being written.\n  protected readonly versions = [\n    { v: 17, released: 'Nov 2023', headline: 'built-in control flow, @defer, angular.dev', status: 'end of life' },\n    { v: 18, released: 'May 2024', headline: 'zoneless preview, @let, material 3', status: 'end of life' },\n    { v: 19, released: 'Nov 2024', headline: 'standalone by default, incremental hydration, linkedSignal', status: 'end of life' },\n    { v: 20, released: 'May 2025', headline: 'signals and effect stable, new style guide, CLI MCP server', status: 'supported' },\n    { v: 21, released: 'Nov 2025', headline: 'zoneless by default, Vitest default, signal forms preview, @angular/aria', status: 'supported' },\n    { v: 22, released: 'Jun 2026', headline: 'OnPush default, signal forms and resources stable, fetch by default, @Service, TypeScript 6', status: 'current' },\n    { v: 23, released: 'Jun 2027', headline: 'first release of the yearly cadence', status: 'not yet released' }\n  ];\n\n  protected readonly routine = [\n    'Check the release notes and the update guide for the version you are moving to.',\n    'Run ng update @angular/core@N @angular/cli@N, one major at a time, never skipping.',\n    'Read every diff the schematics produce. That is where the three exceptions live.',\n    'Update Material, the CDK, and any third-party library in the same commit: a lagging library is the usual blocker.',\n    'Run the test suite, then click through the app: schematics cannot know your product.',\n    'Put the next two end-of-life dates in the roadmap, so the upgrade is scheduled rather than discovered.'\n  ];\n}`,
    anno:[
      ['Yearly majors from v22','v23 is due June 2027 rather than November 2026. Fewer releases containing breaking changes, not fewer breaking changes: they are grouped rather than reduced.'],
      ['Two years of support','Up from eighteen months, which gives a team a realistic annual upgrade window rather than a twice-yearly scramble.'],
      ['Minor releases','Every couple of months, four to six a year, carrying features and fixes with no breaking changes. Take those continuously.'],
      ['ng update one major at a time','The schematics are written for adjacent versions. v18 to v22 in one command is not a supported path, and doing it by hand means four sets of migrations you never ran.'],
      ['angular-cli-diff','A community project showing exactly what changed in a generated project between two CLI versions, which is the fastest way to fix your configuration.'],
      ['Third-party libraries','Material and the CDK track Angular exactly. Everything else is a risk you took, and it is the most common reason an upgrade stalls.'],
      ['TypeScript versions','Each major requires a minimum: v22 needs TypeScript 6 and dropped Node 20. Check the runtime requirements before planning the work.'],
      ['Extended support','Commercial support exists for versions past end of life. It is a bridge for a stranded application, not a strategy.']
    ],
    mistakes:[
      ['Deferring the upgrade until it is a project','','That is how applications end up five majors behind. An upgrade taken on schedule is an afternoon; taken late it is a quarter.'],
      ['Skipping versions','','The migrations only run between neighbours, so the transformations you skipped become manual work with no tooling and no guidance.'],
      ['Rubber-stamping the schematic diff','','The migrations are good and they are mechanical. The interesting failures are in the few places your code did something the schematic did not expect.'],
      ['Ignoring the runtime requirements','','A major can require a new TypeScript and drop a Node version. Discovering that in CI on the day of the upgrade is avoidable.']
    ],
    ex:{
      task:'Plan the upgrade of an application on v19 to the current version. Say what runs automatically, what needs a decision, and where you would stop and test.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    <ol>\n      @for (s of steps; track s.step) {\n        <li>\n          <strong>{{ s.step }}</strong> \u2014 {{ s.what }}\n          <br /><small [class.decision]="s.kind === 'decision'">{{ s.kind }}: {{ s.note }}</small>\n        </li>\n      }\n    </ol>\n    <p><small>\n      Three separate releases, not one. Each one ships, and the risky behaviour\n      changes are isolated from the mechanical ones.\n    </small></p>\n  \`,\n  styles: \`\n    li { font-size: 13px; margin-bottom: 8px; }\n    .decision { color: #7A4E00; }\n  \`\n})\nclass App {\n  protected readonly steps = [\n    { step: 'v19 to v20', what: 'ng update @angular/core@20 @angular/cli@20',\n      kind: 'automatic', note: 'signals and effect become stable; the style guide changes file naming, which is optional' },\n    { step: 'Ship it', what: 'test, release, and let it sit for a sprint',\n      kind: 'decision', note: 'never stack two majors in one release: you lose the ability to bisect' },\n    { step: 'v20 to v21', what: 'ng update @angular/core@21 @angular/cli@21',\n      kind: 'automatic', note: 'the migration adds provideZoneChangeDetection() so nothing breaks yet' },\n    { step: 'Zoneless', what: 'remove that provider, component tree by component tree',\n      kind: 'decision', note: 'the real work: every async field mutation becomes a signal. Use the onpush_zoneless_migration tool for a plan' },\n    { step: 'Vitest', what: 'migrate-karma-to-vitest, then refactor-jasmine-vitest',\n      kind: 'automatic', note: 'fakeAsync tests need rewriting; --fake-async converts most of them' },\n    { step: 'Ship it', what: 'test, release',\n      kind: 'decision', note: 'zoneless is a behaviour change and deserves its own release' },\n    { step: 'v21 to v22', what: 'ng update @angular/core@22 @angular/cli@22',\n      kind: 'automatic', note: 'needs TypeScript 6 and Node 22 or later. The migration writes ChangeDetectionStrategy.Eager into every component that had no strategy' },\n    { step: 'OnPush', what: 'remove those Eager annotations, feature by feature',\n      kind: 'decision', note: 'the second half of the same job as zoneless, and much easier once state is in signals' },\n    { step: 'paramsInheritanceStrategy', what: 'check every child route that reads a parent param',\n      kind: 'decision', note: 'the v22 default changed to always and there is no migration for it' },\n    { step: 'New APIs', what: 'adopt resources and signal forms in new code only',\n      kind: 'decision', note: 'not part of the upgrade. Do not mix a rewrite into a version bump' }\n  ];\n}`,
      why:'The plan alternates between mechanical steps and decisions, and ships between them, which is the part teams get wrong by trying to land three majors in one release. Notice that both v21 and v22 add a compatibility provider so the upgrade itself does not change behaviour: `provideZoneChangeDetection()` and `ChangeDetectionStrategy.Eager` are the framework buying you time, and the real work is removing them afterwards, deliberately, with tests. The `paramsInheritanceStrategy` line is the one to circle, because it is a silent behaviour change with no migration, so it needs a manual audit rather than a green build. And the last line is a discipline point: adopting resources and Signal Forms is a rewrite, and mixing a rewrite into a version bump makes both harder to review and impossible to bisect.'
    },
    mm:'Take every major on schedule, one at a time, ship between them, and treat the compatibility providers the migrations add as work to be removed rather than as the destination.'
  },
  {
    id:'52', file:'shipping.ts', t:'Shipping: budgets, config, and a checklist',
    what:[
      '`ng build` produces a production bundle by default, with optimisation, hashing, and budgets enforced from `angular.json`. Configuration comes from the build rather than from a runtime file, and secrets do not come from the client at all.',
      'This lesson is the checklist: what to have in place before an Angular application goes in front of users, and what to keep checking after.'
    ],
    why:[
      'Most of what makes an application maintainable a year later is set up in the first week and is very expensive to retrofit: budgets, strict types, lint rules, error reporting, and a test seam. None of it is urgent and all of it compounds.',
      'Budgets deserve a specific mention because they are the only automatic defence against bundle creep. A budget that fails the build when the initial bundle grows past a number is the difference between noticing in a pull request and noticing in a quarterly performance review.',
      'The configuration boundary is where teams leak secrets. Anything the browser can read is public, whatever the file it came from is called, so the only safe place for a key is a server you control.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p><strong>The checklist. Click a line for the reason.</strong></p>\n    <ul>\n      @for (item of list; track item.k) {\n        <li>\n          <button (click)="open.set(open() === item.k ? null : item.k)"\n                  [attr.aria-expanded]="open() === item.k">\n            {{ open() === item.k ? '\u2212' : '+' }} {{ item.k }}\n          </button>\n          @if (open() === item.k) { <p class="why">{{ item.v }}</p> }\n        </li>\n      }\n    </ul>\n  \`,\n  styles: \`\n    ul { list-style: none; padding: 0; }\n    li { margin-bottom: 3px; }\n    button { border: 0; background: none; font: inherit; cursor: pointer; text-align: left;\n             color: #1B1A22; padding: 2px 0; }\n    .why { margin: 2px 0 8px 18px; font-size: 13px; color: #55525F; max-width: 62ch; }\n  \`\n})\nclass App {\n  protected readonly open = signal<string | null>('Budgets');\n\n  protected readonly list = [\n    { k: 'Budgets',\n      v: 'In angular.json, a bundle budget with a warning and an error threshold on the initial bundle. It is the only thing that fails a build when someone imports a 300kB date library. Check the output sizes on every release.' },\n    { k: 'Strict everything',\n      v: 'TypeScript strict mode, plus strictTemplates, which is on by default since v22. Add a runtime schema check such as Zod at every boundary where external data enters, because types are erased.' },\n    { k: 'Lint the framework rules',\n      v: 'angular-eslint, with the rules about component selectors, lifecycle interfaces, and template accessibility. It catches the things review misses on a busy day.' },\n    { k: 'Lazy by default',\n      v: 'Every route lazy, including the first. @defer below the fold and behind interactions. injectAsync for heavy services. Then look at the bundle report to see whether it worked.' },\n    { k: 'Configuration, not secrets',\n      v: 'Build-time values through the define option or an environment file, and only for public values. Anything secret lives behind a server. A key in the client bundle is a published key.' },\n    { k: 'Error reporting',\n      v: 'A global ErrorHandler wired to your reporting service, plus boundaries around independently failing regions. Include the Angular version and the route in the report.' },\n    { k: 'Accessibility pass',\n      v: 'Keyboard-only walk through every flow, real labels, focus moved on navigation and into dialogs. Automated audits catch about half of it.' },\n    { k: 'SSR decision',\n      v: 'If the app needs indexing or a fast first paint on slow networks, server-render it and keep the transfer cache in mind. If it is behind a login, client rendering is often the right call.' },\n    { k: 'Security',\n      v: 'No bypassSecurityTrustHtml on anything you did not sanitise. Allow-list URL schemes. Tokens in httpOnly cookies, never localStorage. A Content-Security-Policy, with ngCspNonce if you need Angular\\u2019s inline styles.' },\n    { k: 'Stay on the treadmill',\n      v: 'One major per year, taken on schedule, with the two next end-of-life dates in the roadmap. Security fixes only land in supported versions.' }\n  ];\n}`,
    anno:[
      ['ng build','Production by default: optimisation, minification, hashed filenames, and budgets. There is no separate `--prod` flag any more.'],
      ['budgets in angular.json','`{ type: "initial", maximumWarning: "500kB", maximumError: "1MB" }`. Set them from where you are today, not from an aspiration, and tighten over time.'],
      ['--define and environment files','Build-time substitution for public values. `ng serve --define VERSION="\'1.2.3\'"` works since v21, so a version string can come from CI.'],
      ['ErrorHandler','Provide your own to route uncaught errors to a reporting service. Pair it with boundaries so one failing region does not take the page.'],
      ['Source maps','Upload them to your error reporter and do not serve them publicly, so stack traces are readable to you and not to everyone.'],
      ['subresourceIntegrity','Adds integrity hashes; since v22 it also generates an import map with hashes for lazy chunks, which closes the gap for code-split applications.'],
      ['Chunk optimisation','Enabled by default in production since v22, merging tiny lazy chunks. `NG_BUILD_OPTIMIZE_CHUNKS=0` disables it if you need to.'],
      ['Prerendering','`ng build` can prerender routes at build time, which is the cheapest way to get static-fast pages for content that does not change per user.']
    ],
    mistakes:[
      ['An API key in an environment file','','It ships in the bundle and is visible in the network tab. Environment files are for public configuration; secrets require a server.'],
      ['No budgets','','Bundle size grows by accident, one convenient import at a time, and nobody notices until a performance review. A budget makes it a build failure.'],
      ['Serving a development build','','Several times slower, with development-only checks included. Deploy the output of `ng build`, and look at the sizes it printed.'],
      ['Deferring the accessibility pass','','It is the item most often postponed and the most expensive to retrofit, because the fixes are structural: focus management, real labels, and markup that means something.']
    ],
    ex:{
      task:'Write the deployment checklist for the application you would build after this course, with a specific decision on each line rather than a principle.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    <table>\n      <tr><th>Area</th><th>Decision</th></tr>\n      @for (r of decisions; track r.area) {\n        <tr><td>{{ r.area }}</td><td>{{ r.decision }}</td></tr>\n      }\n    </table>\n    <p><small>\n      Specific choices, not principles. A checklist that says be careful about\n      security has never prevented anything.\n    </small></p>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; }\n    td, th { border: 1px solid #CFCCD6; padding: 4px 8px; text-align: left; vertical-align: top; }\n    td:first-child { white-space: nowrap; font-weight: 600; }\n  \`\n})\nclass App {\n  protected readonly decisions = [\n    { area: 'Version', decision: 'v22, upgraded every June, with the v20 and v21 end-of-life dates in the roadmap.' },\n    { area: 'Rendering', decision: 'SSR with incremental hydration for the public pages; client rendering behind the login.' },\n    { area: 'State', decision: 'signals locally, a service with asReadonly() for shared state, httpResource for server data, the URL for filters and paging.' },\n    { area: 'Forms', decision: 'Signal Forms for everything new. No new reactive forms.' },\n    { area: 'Change detection', decision: 'zoneless, OnPush everywhere, zone.js not in the polyfills.' },\n    { area: 'Bundles', decision: 'every route lazy, @defer below the fold, budgets at 400kB warning and 600kB error on the initial bundle.' },\n    { area: 'Types', decision: 'TypeScript strict, strictTemplates, and Zod at every network and form boundary.' },\n    { area: 'Testing', decision: 'Vitest with Browser Mode, queries by role and label, network mocked at the boundary only.' },\n    { area: 'Accessibility', decision: '@angular/aria for menus, tabs and comboboxes; a keyboard-only pass in the definition of done.' },\n    { area: 'Security', decision: 'httpOnly cookies, a CSP with no unsafe-inline, allow-listed URL schemes, no bypassSecurityTrust* anywhere in the repository.' },\n    { area: 'Errors', decision: 'a custom ErrorHandler reporting to a service, with source maps uploaded and not served.' },\n    { area: 'Structure', decision: 'group by feature, core for singletons, shared on the rule of two, lint-enforced boundaries if it becomes a monorepo.' }\n  ];\n}`,
      why:'Every line is a decision someone could disagree with, which is what makes it a checklist rather than a poster. Three are worth defending in an interview. Budgets have numbers, because a budget without a number is a comment. "No new reactive forms" is a policy rather than a preference, since the expensive outcome is a codebase with three forms APIs and no rule about which to use. And "no bypassSecurityTrust* anywhere in the repository" is enforceable by a lint rule, which turns a security principle into a build failure. Notice what is deliberately absent: no state management library, because a service with signals plus resources covers this application, and adding one before you can name the symptom it fixes is how you acquire a dependency nobody can remove.'
    },
    mm:'Set budgets, strictness, error reporting and the lazy boundaries in the first week, keep secrets on a server, and stay on the release train.'
  }
  ]
});

<script>
/* ============================================================
   INTERVIEW BANK
   d = difficulty, topic = grouping, q = question, a = model answer,
   code = snippet where code clarifies it, fq/fa = likely follow-up
   ============================================================ */
INTERVIEW.push(
{
  d:'Easy', topic:'Basics',
  q:`What is Angular, and what problems does it solve?`,
  a:`<p>Angular is a TypeScript framework for building applications out of components, where you describe what the screen should look like for the current data and the framework keeps the DOM in step. The declarative part solves the same problem React does: without it, every new piece of state multiplies the transitions you have to get right.</p><p>The part that distinguishes it is that it is a framework rather than a library. Routing, HTTP, forms, testing, a build system and a code generator are first-party and versioned together, and <code>ng update</code> migrates your code across breaking changes. You trade some freedom for long-term consistency, which is why it suits large, long-lived applications and is poor value for a landing page.</p>`,
  fq:`When would you choose something else?`,
  fa:`<p>A marketing site, a blog, or a widget dropped into a page someone else owns. The runtime and the build step are real costs, and a framework whose value is long-term agreement has little to offer a project with no long term.</p>`
},
{
  d:'Easy', topic:'Components',
  q:`What is a component, and what does the @Component decorator configure?`,
  a:`<p>A class with an <code>@Component</code> decorator. The decorator tells the compiler which tag the component answers to, what markup it renders, what styles belong to it, and which other components, directives and pipes its template is allowed to use.</p><p>The keys you touch daily are <code>selector</code>, <code>template</code> or <code>templateUrl</code>, <code>styles</code> or <code>styleUrl</code>, and <code>imports</code>. The class holds the state and behaviour; the template describes the result.</p>`,
  code:`@Component({\n  selector: 'app-badge',\n  imports: [DatePipe],\n  template: \`<span>{{ label() }} at {{ now | date: 'shortTime' }}</span>\`,\n  styles: \`span { color: #B4005A; }\`\n})\nexport class Badge {\n  readonly label = input.required<string>();\n  protected readonly now = new Date();\n}`,
  fq:`Why does the imports array exist at all?`,
  fa:`<p>Because templates are compiled, not interpreted. The compiler has to know at build time which tag maps to which component so it can generate the calls and type-check the bindings. It is also why an unimported component renders as an unknown element rather than failing at run time.</p>`
},
{
  d:'Easy', topic:'Components',
  q:`Standalone components versus NgModules.`,
  a:`<p>A standalone component declares its own dependencies in an <code>imports</code> array. An NgModule was a separate container that declared which components belonged to it, what it imported, what it exported, and which providers it contributed.</p><p>Standalone won because a module was a second place to declare information the component already had, with three chances to get it wrong, and because the unit of lazy loading was a module rather than a component. It has been the default since v19, so <code>standalone: true</code> is no longer written.</p>`,
  fq:`How do the two interoperate during a migration?`,
  fa:`<p>Both directions work. A standalone component can import an NgModule, which is how you consume a module-based library, and a module can list a standalone component in its <code>imports</code> rather than its <code>declarations</code>. There is also a three-step <code>ng generate @angular/core:standalone</code> migration that does most of the mechanical work.</p>`
},
{
  d:'Easy', topic:'Templates',
  q:`What are the kinds of data binding?`,
  a:`<p>Four. Interpolation puts a value into text. A property binding in square brackets sets a property from an expression. An event binding in parentheses runs a statement when something happens. And the two combined, in the banana-in-a-box, is two-way binding.</p><p>The important detail is that square brackets mean "evaluate this as an expression". <code>disabled="false"</code> passes the string "false", which is truthy, so the button stays disabled; <code>[disabled]="false"</code> passes a boolean. That is the single most common binding bug.</p>`,
  code:`{{ name }}                    <!-- interpolation -->\n[value]="name"                 <!-- property -->\n(input)="onInput($event)"      <!-- event -->\n[(ngModel)]="name"             <!-- two-way: [ngModel] plus (ngModelChange) -->\n[class.active]="isActive()"    <!-- class binding -->\n[attr.aria-label]="label()"    <!-- a real attribute, not a property -->`,
  fq:`What is two-way binding actually doing?`,
  fa:`<p>Nothing magic: <code>[(x)]="v"</code> expands to <code>[x]="v" (xChange)="v = $event"</code>. That is why it only works on a directive or component exposing that pair, which for your own components means declaring the member with <code>model()</code>.</p>`
},
{
  d:'Easy', topic:'Templates',
  q:`Why is track mandatory in @for, and what breaks without a good one?`,
  a:`<p><code>track</code> tells Angular how to identify a row across updates. Without an identity, position is the only information available, so it cannot tell "this row moved" from "every row changed its content".</p><p>Tracking by index means the key is the position, so reordering leaves the keys unchanged while the data moves underneath. Angular concludes each row merely changed its text, keeps the existing DOM and any state inside it, and now a typed value or a ticked checkbox belongs to the wrong item. Track something stable from the data, normally an id.</p>`,
  code:`<!-- wrong: identity is the position -->\n@for (item of items(); track $index) { <app-row [item]="item" /> }\n\n<!-- right: identity comes from the data -->\n@for (item of items(); track item.id) { <app-row [item]="item" /> }`,
  fq:`When is tracking by index acceptable, and what about tracking the object itself?`,
  fa:`<p>Index is fine for a static list that never reorders and only appends at the end. <code>track item</code> compares by reference, which works while the objects are stable, and fails quietly if the list is rebuilt from an API response on every poll, because every row then looks new and the whole list re-renders.</p>`
},
{
  d:'Easy', topic:'Components',
  q:`How do you declare inputs and outputs in modern Angular?`,
  a:`<p>As class fields: <code>input()</code>, <code>input.required()</code>, and <code>output()</code>. <code>model()</code> declares a value that is both an input and an output, so a parent can bind it two ways.</p><p>The reason for the change from the <code>@Input()</code> decorator is that an input declared with <code>input()</code> is a signal. Reading it tracks it, so a <code>computed</code> that depends on an input recalculates when the input changes, with no <code>ngOnChanges</code> involved. Required inputs also have no <code>undefined</code> in their type, and forgetting to pass one is a compile error.</p>`,
  code:`readonly label = input.required<string>();\nreadonly step = input(1);\nreadonly max = input(10, { alias: 'ceiling' });\nreadonly value = model(0);            // two-way bindable\nreadonly limitHit = output<number>();`,
  fq:`Can you write to an input?`,
  fa:`<p>No: inputs are read-only signals with no <code>set</code>. If the child owns the value, use <code>model()</code>. If the parent owns it, emit an output and let the parent decide. There are migrations for all three: <code>signal-input-migration</code>, <code>output-migration</code>, and <code>signal-queries-migration</code>.</p>`
},
{
  d:'Easy', topic:'Signals',
  q:`What is a signal?`,
  a:`<p>A value that knows who is reading it. You read it by calling it and write it with <code>set</code> or <code>update</code>, and when it changes, everything that read it is told: templates re-render, computeds recalculate, effects run.</p><p>That explicit dependency is what lets Angular update exactly the views that read the changed value, and it is why applications are zoneless by default since v21. Signals have been stable since v20.</p>`,
  code:`readonly count = signal(0);\ncount();                      // read, and register a dependency\ncount.set(0);                 // replace\ncount.update(n => n + 1);     // derive from the current value`,
  fq:`What happens if you mutate an object inside a signal?`,
  fa:`<p>Nothing, which is the worst failure mode available. <code>user().name = 'x'</code> keeps the same reference, so the signal has nothing to report and the screen shows the old value with no error. Produce a new object: <code>user.update(u => ({ ...u, name: 'x' }))</code>.</p>`
},
{
  d:'Easy', topic:'Signals',
  q:`Why use computed() instead of a getter or a method call in the template?`,
  a:`<p>A <code>computed</code> is cached and lazy. It recalculates only when one of the signals it read has changed, and it does not run at all until something reads it. A getter or a method in a template re-runs on every refresh of that view.</p><p>So a filter in an interpolation is an O(n) operation per change detection pass, and the same filter in a computed runs once per actual change. It also cannot go stale, which is the correctness argument for deriving rather than storing.</p>`,
  fq:`Can a computed write to a signal?`,
  fa:`<p>No, and Angular throws <code>NG0600</code> if you try. A computation must be pure because it may be re-run, skipped, or ordered differently. If you feel the need to write during a computation, you probably want <code>linkedSignal</code>.</p>`
},
{
  d:'Easy', topic:'Templates',
  q:`What is a pipe, and why does Angular ship no filter or sort pipe?`,
  a:`<p>A pipe transforms a value for display, and it is pure by default, so Angular only re-runs it when the input value changes. That caching is what makes <code>| date</code> viable in every cell of a large table.</p><p>Filtering and sorting were deliberately left out because a pipe cannot know that your array was mutated in place unless it is impure, and an impure pipe runs on every change detection pass. The framework wants that work in the class, ideally in a <code>computed</code>, where you control it.</p>`,
  fq:`When is an impure pipe justified?`,
  fa:`<p>Rarely, and almost never for performance. If you are reaching for <code>pure: false</code> because your pipe is not updating, the real problem is that the input is being mutated rather than replaced, which is the same immutability rule signals depend on.</p>`
},
{
  d:'Easy', topic:'DI',
  q:`What is dependency injection, and why inject() rather than a constructor parameter?`,
  a:`<p>A class asks for what it needs instead of constructing it, and something above decides which instance it gets. That buys two things: substitution, so a test can hand the component a fake, and lifetime, so one instance can be shared without a global variable.</p><p><code>inject()</code> replaced constructor parameters because it works in field initialisers, so dependencies read as ordinary fields; it composes into plain functions, which is what makes functional guards and interceptors possible; and it needs no TypeScript metadata. v22's <code>@Service()</code> decorator requires it.</p>`,
  code:`@Service()                     // v22: @Injectable({ providedIn: 'root' })\nexport class Basket {\n  private readonly api = inject(BasketApi);\n  private readonly items = signal<Line[]>([]);\n  readonly lines = this.items.asReadonly();\n}`,
  fq:`What does the NullInjectorError tell you?`,
  fa:`<p>That nothing provides the token it names. Either the class has no <code>@Service()</code> or <code>@Injectable({ providedIn: 'root' })</code>, or you are asking from an injector that cannot reach the provider. The error names the token, which is the fastest debugging tool Angular gives you.</p>`
},
{
  d:'Easy', topic:'Styling',
  q:`How does view encapsulation work?`,
  a:`<p>By default Angular rewrites a component's style selectors and adds a generated attribute to its elements, so <code>.row</code> in one component cannot affect <code>.row</code> in another. That is emulated encapsulation, and it works in every browser with plain CSS.</p><p>It is scoping rather than isolation: global styles still reach in, which is usually what you want for a design system's resets and fonts. <code>ViewEncapsulation.None</code> makes the styles global and <code>ShadowDom</code> uses real Shadow DOM.</p>`,
  fq:`How do you style inside a child component?`,
  fa:`<p>Ideally you do not: style the child from inside the child, pass a class as an input, or have the child expose a CSS custom property. <code>::ng-deep</code> works, leaks out of the component, and has been on a deprecation path for years, so it is a last resort rather than a technique.</p>`
},
{
  d:'Easy', topic:'Templates',
  q:`ng-content versus ng-template versus ng-container.`,
  a:`<p><code>ng-content</code> is a slot: it places markup the caller wrote, bound in the caller's context. <code>ng-template</code> is markup that is defined but not rendered until something renders it, so it can be passed as a value and rendered with data the component supplies. <code>ng-container</code> renders its children with no element of its own.</p><p>The distinction that matters: projection cannot pass data into the caller's markup, because those nodes belong to the caller. A template with context can, which is why every list or table component with a customisable row takes a <code>TemplateRef</code>.</p>`,
  code:`<!-- projection: the caller owns the bindings -->\n<ng-content select="[card-title]">Untitled</ng-content>\n\n<!-- a template rendered with the component's data -->\n<ng-container [ngTemplateOutlet]="row()"\n              [ngTemplateOutletContext]="{ $implicit: item, index: $index }" />`,
  fq:`When does an ng-container matter rather than a div?`,
  fa:`<p>Whenever the parent cares about its direct children: a flex or grid container, a table where a <code>tr</code> must sit inside a <code>tbody</code>, a <code>ul</code> expecting <code>li</code> elements. It is also the only way to put a directive on such an element without adding a wrapper.</p>`
},
{
  d:'Easy', topic:'Versions',
  q:`Which Angular defaults have changed recently, and why does it matter?`,
  a:`<p>Four worth knowing. Standalone became the default in v19. Applications became zoneless by default in v21, and Vitest became the default test runner. In v22 <code>OnPush</code> became the default change detection strategy, the HTTP client moved to <code>fetch</code>, and Signal Forms and the resource APIs became stable. <code>HttpClient</code> has been provided in the root injector since v21.</p><p>It matters because the same question has different answers per version. "How do I share state" or "why is my view not updating" depends entirely on whether the app is zoneless, and a snippet from a v18 tutorial will be wrong in ways that are not obvious.</p>`,
  fq:`What is the most visible consequence of zoneless for a newcomer?`,
  fa:`<p>A plain field mutated from a <code>setTimeout</code> or a promise no longer updates the screen. Nothing marked the view. Under Zone.js the patched timer triggered a check of the whole application; now the value changes and the DOM does not. The fix is to put it in a signal.</p>`
},
{
  d:'Easy', topic:'Basics',
  q:`What is the difference between AngularJS and Angular?`,
  a:`<p>They are different frameworks. AngularJS is any 1.x version, released in 2010, built on <code>$scope</code>, directives with link functions, and dirty-checking two-way binding. It reached end of life at the end of 2021.</p><p>Angular is the 2016 rewrite in TypeScript, with components, dependency injection, an ahead-of-time compiler, and now signals. There is no upgrade path in the ordinary sense, only a hybrid bridge that no longer matters. The practical value of knowing this is spotting a fifteen-year-old tutorial from its vocabulary.</p>`,
  fq:`What do you look for to date an Angular tutorial quickly?`,
  fa:`<p><code>app.module.ts</code> means pre-v15. <code>*ngIf</code> means pre-v17. <code>@Input()</code> decorators and constructor injection mean pre-v19 style. <code>standalone: true</code> written explicitly means v14 to v18. Any of those and I would check the surrounding advice rather than copying it.</p>`
}
);
INTERVIEW.push(
{
  d:'Medium', topic:'Change detection',
  q:`How does change detection work now, and what marks a view for checking?`,
  a:`<p>Angular keeps a tree of views. Change detection is a traversal in which each view either refreshes its bindings or is skipped, followed by a commit of the DOM changes. Since v22 <code>OnPush</code> is the default, so a view is refreshed only if it was marked dirty, and the mark propagates up to the root so the traversal can reach it.</p><p>Four things mark a view: a signal it read changing, a template event binding firing in it, one of its inputs changing, or an explicit <code>markForCheck()</code>. The async pipe does it too. Nothing else does, which is the whole of zoneless behaviour in one sentence.</p>`,
  fq:`So what happens to a plain field mutated in a setTimeout?`,
  fa:`<p>The field changes and the screen does not. No signal, no event binding, no input: nothing told Angular. The fix is to put the value in a signal, not to scatter <code>markForCheck()</code>, which encodes knowledge of change detection into a component that should only know about its own data.</p>`
},
{
  d:'Medium', topic:'Change detection',
  q:`What does OnPush actually skip, and why is mutation a silent bug under it?`,
  a:`<p>It skips refreshing a view whose inputs are referentially unchanged and which nothing marked. So a parent re-rendering does not automatically re-render its children, which is the optimisation and the reason the cost of a change is proportional to what changed rather than to the size of the tree.</p><p>Mutation is silent because the comparison is by reference. Push onto an array held in an input and the reference is identical, so the child is skipped, the data is genuinely different, and there is no warning anywhere. Replace the value instead.</p>`,
  code:`// child is skipped: same array reference\nthis.items.push(next);\n\n// child refreshes: a new array\nthis.items = [...this.items, next];\nthis.items.update(list => [...list, next]);   // with a signal`,
  fq:`Angular v22 made OnPush the default. What did the migration do to existing code?`,
  fa:`<p>It wrote <code>changeDetection: ChangeDetectionStrategy.Eager</code> into every component that did not specify a strategy, so upgrading changed nothing. <code>Eager</code> is the old <code>Default</code>, renamed. Removing those annotations feature by feature is the actual work, and it is much easier once the state is in signals.</p>`
},
{
  d:'Medium', topic:'Signals',
  q:`signal() versus BehaviorSubject for shared state.`,
  a:`<p>A <code>BehaviorSubject</code> works and costs every reader a subscription, an initial value, and a lifetime to manage. A signal is read synchronously by calling it, has a current value by construction, tells Angular precisely which views depend on it, and needs no unsubscribe.</p><p>So for state, signals win, and converting <code>BehaviorSubject</code> services is the highest-value manual change in an older codebase. RxJS keeps the jobs that are about time: debouncing, switching, retrying, combining streams of events.</p>`,
  code:`// before\nprivate readonly user$ = new BehaviorSubject<User | null>(null);\nreadonly user = this.user$.asObservable();\n\n// after\nprivate readonly current = signal<User | null>(null);\nreadonly user = this.current.asReadonly();\nreadonly isSignedIn = computed(() => this.current() !== null);`,
  fq:`How do you decide, in general?`,
  fa:`<p>If you would describe the value with a noun, it is a signal: the current user, the selected row, the filter. If you would describe it with a past-tense verb, it is an event, and a stream or an <code>output()</code> fits better. A signal has no history and deduplicates equal values, so two identical events look like one.</p>`
},
{
  d:'Medium', topic:'Signals',
  q:`When do you use effect(), and when is it the wrong tool?`,
  a:`<p><code>effect()</code> is for pushing state outward to things Angular does not manage: writing to storage, setting <code>document.title</code>, driving a third-party library, wiring up a browser API. It runs after change detection, so the DOM already reflects the state it is reacting to, and it takes an <code>onCleanup</code> callback for anything it owns.</p><p>It is wrong for deriving values. An effect that sets another signal costs an extra signal, an extra render, and a window where the two disagree, and a <code>computed</code> costs none of that. Angular no longer blocks signal writes inside an effect, since <code>allowSignalWrites</code> was retired in v19, so the discipline is yours.</p>`,
  code:`effect(onCleanup => {\n  const id = setInterval(() => this.ticks.update(n => n + 1), this.pollMs());\n  onCleanup(() => clearInterval(id));   // before the next run, and on destroy\n});`,
  fq:`Where must an effect be created, and why?`,
  fa:`<p>In an injection context: a constructor or a field initialiser, or with an explicit <code>{ injector }</code>. That is how it knows when to destroy itself, which is why there is no <code>unsubscribe</code> and why creating one outside a context is an error rather than a leak.</p>`
},
{
  d:'Medium', topic:'Signals',
  q:`What problem does linkedSignal() solve?`,
  a:`<p>Writable state that should reset when a source changes. A <code>computed</code> cannot be written and a plain <code>signal</code> never follows anything, and between them sits a very common case: a selected row that should reset when the list is refetched, a page number that should return to one when the filter changes.</p><p>Before it existed you wrote an effect watching the source and writing to a signal, which published one render late and split the rule across two places. The long form gives the computation the new source value and the previous state, so the reset can be conditional.</p>`,
  code:`// resets to the first option whenever the options change\nreadonly choice = linkedSignal(() => this.options()[0]);\n\n// keeps the previous value if it is still valid\nreadonly qty = linkedSignal<number, number>({\n  source: () => this.stock(),\n  computation: (stock, prev) => (prev && prev.value <= stock ? prev.value : 1)\n});`,
  fq:`How is that different from just using an effect?`,
  fa:`<p>Timing and locality. The effect version publishes one render after the source changed, so for a frame the value belongs to the old source, and the rule lives away from the declaration. <code>linkedSignal</code> states the relationship where the state is declared and is consistent within the same render.</p>`
},
{
  d:'Medium', topic:'RxJS',
  q:`How do you bridge between signals and RxJS, and when is RxJS still the better model?`,
  a:`<p><code>toSignal()</code> subscribes to an observable and exposes the latest value as a signal, unsubscribing when its injection context is destroyed. <code>toObservable()</code> goes the other way. Both are in <code>@angular/core/rxjs-interop</code>.</p><p>RxJS still wins whenever the question is about time: debouncing, throttling, retry with backoff, and above all <code>switchMap</code>, which cancels the previous request when a new one starts. There is no signals-only equivalent worth having, so the idiom is signal, out to an observable, through operators, back to a signal.</p>`,
  code:`readonly ticks = toSignal(interval(1000), { initialValue: 0 });\n\nreadonly results = toSignal(\n  toObservable(this.query).pipe(\n    debounceTime(400),\n    switchMap(q => this.api.search(q))     // abandons the previous request\n  ),\n  { initialValue: [] }\n);`,
  fq:`What does initialValue change, and when would you use requireSync?`,
  fa:`<p>Without <code>initialValue</code> the type is <code>T | undefined</code>, because there is nothing to show before the first emission, which is honest and sometimes what you want. <code>requireSync: true</code> is for observables that emit on subscribe, such as a <code>BehaviorSubject</code>: it removes the undefined and throws if the observable does not actually emit in time.</p>`
},
{
  d:'Medium', topic:'Components',
  q:`Which lifecycle hooks still matter in a signals codebase?`,
  a:`<p>Very few. <code>ngOnInit</code> for setup that needs an input value, because the constructor runs before inputs are set. Destruction through <code>inject(DestroyRef).onDestroy()</code>, which works in a field initialiser so setup and teardown sit together. And <code>afterNextRender</code> for anything that needs the real DOM, which never runs on the server.</p><p>The rest have been replaced. <code>ngOnChanges</code> becomes a <code>computed</code> that reads the input. <code>ngAfterViewInit</code> becomes a signal query, which is simply empty until it is not.</p>`,
  code:`constructor() {\n  afterNextRender(() => this.box().nativeElement.focus());\n\n  const onResize = () => this.measure();\n  window.addEventListener('resize', onResize);\n  inject(DestroyRef).onDestroy(() => window.removeEventListener('resize', onResize));\n}\n\nngOnInit() { this.load(this.id()); }   // needs an input`,
  fq:`What happens if you read a required input in the constructor?`,
  fa:`<p><code>NG0950</code>: the input is required but no value is available yet. Inputs are set after construction. Either move the read to <code>ngOnInit</code>, or wrap it in a <code>computed</code> so the read happens lazily, which is usually better. Since v21 the compiler catches many of these at build time.</p>`
},
{
  d:'Medium', topic:'Components',
  q:`Signal queries versus @ViewChild, and what happened to the static flag?`,
  a:`<p><code>viewChild()</code>, <code>viewChildren()</code>, <code>contentChild()</code> and <code>contentChildren()</code> return signals. A <code>viewChild()</code> is <code>undefined</code> until the element exists, and <code>viewChild.required()</code> throws if it never does.</p><p>The <code>static</code> flag existed because a decorator query was populated at a fixed moment in the lifecycle, so you needed <code>ngAfterViewInit</code> and a special case for anything behind a condition. A signal query has no fixed moment: reading it in a <code>computed</code> or an effect means the code runs when the answer changes, including when an <code>@if</code> toggles.</p>`,
  code:`private readonly box = viewChild.required<ElementRef<HTMLInputElement>>('box');\nprivate readonly rows = viewChildren(Row);\nprotected readonly rowCount = computed(() => this.rows().length);\n\n// projected content is a CONTENT query, not a view query\nprivate readonly tabs = contentChildren(Tab);`,
  fq:`When should you not reach for a query?`,
  fa:`<p>When props would do. A query couples the parent to the child's internals, so it is for the cases where you need the object itself: focusing an input, calling <code>play()</code>, measuring something. Setting a child's field through a query bypasses its inputs and its change detection contract entirely.</p>`
},
{
  d:'Medium', topic:'Components',
  q:`How do you bind to a component's own host element?`,
  a:`<p>Through the <code>host</code> object in the decorator: static attributes, class and style bindings, and event listeners, all evaluated against the class instance. The current style guide prefers it over the <code>@HostBinding</code> and <code>@HostListener</code> decorators, which do the same thing one member at a time.</p><p>It matters because a component that cannot style or instrument its own element is only half a component. <code>role</code> and <code>aria-*</code> belong on the host, and so does a class reflecting state, because a caller styling <code>app-card.selected</code> needs it where they can see it.</p>`,
  code:`@Directive({\n  selector: '[appPressable]',\n  host: {\n    'class': 'pressable',\n    'tabindex': '0',\n    '[class.pressed]': 'pressed()',\n    '[attr.aria-pressed]': 'pressed()',\n    '(pointerdown)': 'pressed.set(true)',\n    '(keydown.enter)': 'toggle()'\n  }\n})\nexport class Pressable {\n  readonly pressed = signal(false);\n  toggle() { this.pressed.update(p => !p); }\n}`,
  fq:`Why does a width on a component tag often appear to do nothing?`,
  fa:`<p>Because a component's host element is <code>display: inline</code> unless you say otherwise. Add <code>:host { display: block }</code> in the component's own styles. It is the first thing to check when layout on a custom element behaves oddly.</p>`
},
{
  d:'Medium', topic:'Directives',
  q:`Attribute versus structural directives, and what does the asterisk mean?`,
