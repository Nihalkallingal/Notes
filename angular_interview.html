      ['Assuming content is not created when hidden','','An `ng-content` that is never rendered still had its nodes created by the caller. That matters if the content is expensive; `@defer` or an `ng-template` is the answer.']
    ],
    ex:{
      task:'Build a Field component with slots for a label, a hint, and an error, where the error slot only appears when an `invalid` input is true, and the hint has fallback text.',
      start:`@Component({\n  selector: 'app-field',\n  template: \`<p>your template</p>\`\n})\nclass Field {\n  readonly invalid = input(false);\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Field],\n  template: \`<app-field />\`\n})\nclass App {}`,
      sol:`@Component({\n  selector: 'app-field',\n  template: \`\n    <div class="field" [class.invalid]="invalid()">\n      <label><ng-content select="[field-label]">Field</ng-content></label>\n\n      <div class="control"><ng-content /></div>\n\n      @if (invalid()) {\n        <p class="error"><ng-content select="[field-error]">Something is wrong.</ng-content></p>\n      } @else {\n        <p class="hint"><ng-content select="[field-hint]">Optional.</ng-content></p>\n      }\n    </div>\n  \`,\n  styles: \`\n    .field { margin-bottom: 10px; }\n    label { display: block; font-size: 12px; color: #55525F; }\n    .error { color: #7A4E00; font-size: 12px; margin: 2px 0 0; }\n    .hint { color: #55525F; font-size: 12px; margin: 2px 0 0; }\n    .invalid .control input { border-color: #7A4E00; }\n  \`\n})\nclass Field {\n  readonly invalid = input(false);\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Field],\n  template: \`\n    <app-field [invalid]="!email().includes('@')">\n      <span field-label>Email address</span>\n      <input [value]="email()" (input)="email.set($any($event.target).value)" />\n      <span field-hint>We will not share it.</span>\n      <span field-error>That needs an @ in it.</span>\n    </app-field>\n\n    <app-field>\n      <input placeholder="no label, no hint given" />\n    </app-field>\n  \`\n})\nclass App {\n  protected readonly email = signal('ada');\n}`,
      why:'Four slots, no inputs except the one boolean that changes the frame, and the caller decides what a label or an error looks like. The fallbacks matter: the second field supplies only an input and still renders sensibly, which is what makes the component safe to use in a hurry. One subtlety worth noticing is that both the hint and the error are projected even though only one is shown at a time, because the caller created both sets of nodes; the `@if` chooses which slot is rendered, not which content exists. If the error message were expensive to produce, that would be the moment to pass an `ng-template` instead and render it lazily.'
    },
    mm:'ng-content places markup the caller wrote and the component never sees, which is why a slot beats another boolean prop.'
  },
  {
    id:'22', file:'host-bindings.ts', t:'Host bindings and host listeners',
    what:[
      'The host element is the element a component or directive lives on: `<app-card>` itself, rather than anything inside its template. The `host` property in the decorator sets attributes, classes, styles, and event listeners on it.',
      'The current style guide prefers the `host` object over the `@HostBinding` and `@HostListener` decorators, which do the same thing one member at a time.'
    ],
    why:[
      'A component that cannot style or instrument its own element is only half a component. Accessibility attributes such as `role` and `aria-disabled` belong on the host, not on a wrapper div, and so does a class that reflects state, because a caller styling `app-card.selected` needs that class where they can see it.',
      'The `host` object won over the decorators because it puts everything about the element in one place, next to the selector and the template, instead of scattered through the class body. It also reads as configuration, which is what it is.',
      'For directives it is more than convenience. A directive has no template, so the host is the only thing it can touch, and `host` is most of its API.'
    ],
    code:`@Directive({\n  selector: '[appPressable]',\n  host: {\n    'class': 'pressable',\n    'tabindex': '0',\n    '[class.pressed]': 'pressed()',\n    '[attr.aria-pressed]': 'pressed()',\n    '(pointerdown)': 'pressed.set(true)',\n    '(pointerup)': 'pressed.set(false)',\n    '(pointerleave)': 'pressed.set(false)',\n    '(keydown.enter)': 'toggle()'\n  }\n})\nclass Pressable {\n  readonly pressed = signal(false);\n  toggle() { this.pressed.update(p => !p); }\n}\n\n@Component({\n  selector: 'app-badge',\n  host: {\n    '[class.tone-warn]': 'tone() === \\'warn\\'',\n    '[style.--pad]': 'pad() + \\'px\\'',\n    'role': 'status'\n  },\n  template: \`<ng-content />\`,\n  styles: \`\n    :host { display: inline-block; padding: var(--pad, 2px) 8px;\n            border: 1px solid #CFCCD6; font-size: 12px; }\n    :host(.tone-warn) { color: #7A4E00; background: #F4EEE2; }\n  \`\n})\nclass Badge {\n  readonly tone = input<'info' | 'warn'>('info');\n  readonly pad = input(2);\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Pressable, Badge],\n  template: \`\n    <div appPressable>Press me, or focus me and hit Enter.</div>\n    <p>\n      <app-badge>info</app-badge>\n      <app-badge tone="warn" [pad]="6">warn, and padded</app-badge>\n    </p>\n  \`,\n  styles: \`\n    .pressable { border: 1px solid #CFCCD6; padding: 8px; cursor: pointer; }\n    .pressable.pressed { background: #F7E6EE; border-color: #B4005A; }\n  \`\n})\nclass App {}`,
    anno:[
      ["host: { 'class': 'pressable' }",'A static value. Written once, merged with whatever the caller puts on the element rather than replacing it.'],
      ["'[class.pressed]': 'pressed()'",'A binding. The value is a template expression evaluated against the class instance, which is why it can call a signal.'],
      ["'(pointerdown)': 'pressed.set(true)'",'A listener, again as a template statement. `$event` is available, and key modifiers such as `keydown.enter` work exactly as in a template.'],
      [':host and :host(.tone-warn)','The CSS side. `:host` styles the element itself; `:host(...)` styles it conditionally on its own classes, which is how the badge reacts to the class its own host binding set.'],
      ["'[style.--pad]': 'pad() + \\'px\\''",'A CSS custom property on the host, which is the tidy way to let an input influence styles without the component knowing about every rule.'],
      ['@HostBinding / @HostListener','The decorator equivalents. Still supported, and the style guide now prefers the `host` object, so new code should use it and there is nothing to migrate urgently.'],
      ['A directive on a component','`<app-badge appPressable>` works: directives and components compose on the same element, which is why the host is a shared surface and static classes merge.']
    ],
    mistakes:[
      ['Wrapping everything in a div to style it','','The host element is already there. A wrapper adds a node, breaks flex and grid layouts in the parent, and hides the component from CSS that targets its tag.'],
      ['Forgetting :host { display: block }','','A component element is inline by default, so widths and vertical padding appear to do nothing.'],
      ['Setting the host class imperatively through ElementRef','','`nativeElement.classList.add(...)` bypasses Angular and will fight the bindings. A host binding is declarative and reversible.'],
      ['Expecting a host binding to override the caller','','Static classes merge, and a binding wins over a static attribute of the same name. Assuming you control the element completely leads to surprises when a caller adds their own class.']
    ],
    ex:{
      task:'Write a directive that makes any element a drop target: it adds a class while a drag is over it, sets the right ARIA attributes, and emits the dropped text.',
      start:`@Directive({\n  selector: '[appDropTarget]',\n  host: {\n    // your host bindings\n  }\n})\nclass DropTarget {\n  readonly dropped = output<string>();\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [DropTarget],\n  template: \`<div appDropTarget>drop here</div>\`\n})\nclass App {}`,
      sol:`@Directive({\n  selector: '[appDropTarget]',\n  host: {\n    'class': 'drop',\n    'role': 'region',\n    'aria-label': 'Drop text here',\n    '[class.over]': 'over()',\n    '[attr.aria-busy]': 'over()',\n    '(dragover)': 'onOver($event)',\n    '(dragleave)': 'over.set(false)',\n    '(drop)': 'onDrop($event)'\n  }\n})\nclass DropTarget {\n  readonly dropped = output<string>();\n  readonly over = signal(false);\n\n  onOver(e: DragEvent) {\n    e.preventDefault();          // without this the browser refuses the drop\n    this.over.set(true);\n  }\n\n  onDrop(e: DragEvent) {\n    e.preventDefault();\n    this.over.set(false);\n    this.dropped.emit(e.dataTransfer?.getData('text/plain') ?? '');\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [DropTarget],\n  template: \`\n    <p draggable="true" (dragstart)="$any($event).dataTransfer.setData('text/plain', 'a dragged sentence')">\n      Drag this sentence\u2026\n    </p>\n    <div appDropTarget (dropped)="last.set($event)">\u2026 and drop it here</div>\n    <p>last dropped: {{ last() || 'nothing yet' }}</p>\n  \`,\n  styles: \`\n    .drop { border: 1px dashed #CFCCD6; padding: 14px; margin: 8px 0; }\n    .drop.over { border-color: #B4005A; background: #F7E6EE; }\n  \`\n})\nclass App {\n  protected readonly last = signal('');\n}`,
      why:'Everything the directive does to its element is declared in one object: two static attributes for accessibility, two bindings driven by one signal, and three listeners. Nothing here needs a template, which is exactly when a directive rather than a component is the right shape. The `preventDefault()` in `dragover` is the detail that makes drag and drop work at all, since the browser\u2019s default is to reject the drop, and it is the kind of thing worth putting in a directive precisely so nobody has to remember it twice. The result composes: the same attribute can be added to a div, a list item, or a component\u2019s host element without changing any of them.'
    },
    mm:'The host object is where a component or directive declares everything it does to its own element, including the accessibility attributes.'
  },
  {
    id:'23', file:'directives.ts', t:'Attribute and structural directives',
    what:[
      'A directive is a class with behaviour and no template of its own. An attribute directive changes the element it sits on. A structural directive changes whether and how often a piece of template is rendered.',
      'Both are standalone and go in a component\u2019s `imports` array, exactly like a component.'
    ],
    why:[
      'A component owns a piece of the screen; a directive adds a capability to something that already exists. Tooltips, autofocus, drag targets, click-outside, permission checks: all of these want to apply to any element rather than to replace it, and all of them would be wrong as components.',
      'Directives are also composable in a way components are not: three of them can sit on the same element, whereas one element is one component. That makes them the right unit for cross-cutting behaviour.',
      'Structural directives were how `*ngIf` and `*ngFor` worked, and the built-in blocks have replaced almost all of that. Writing one is now rare, and worth understanding anyway, because it is the only way to render a template several times with your own context, and because it explains what the asterisk was always doing.'
    ],
    code:`// 1. an attribute directive: behaviour on an existing element\n@Directive({\n  selector: '[appAutoGrow]',\n  host: { '(input)': 'grow()', 'style': 'overflow: hidden; resize: none' }\n})\nclass AutoGrow {\n  private readonly el = inject<ElementRef<HTMLTextAreaElement>>(ElementRef);\n\n  constructor() {\n    afterNextRender(() => this.grow());\n  }\n\n  grow() {\n    const node = this.el.nativeElement;\n    node.style.height = 'auto';                     // reset, or it only grows\n    node.style.height = node.scrollHeight + 'px';\n  }\n}\n\n// 2. a structural directive: it decides whether the template renders\n@Directive({ selector: '[appUnless]' })\nclass Unless {\n  private readonly tpl = inject(TemplateRef);\n  private readonly container = inject(ViewContainerRef);\n\n  readonly appUnless = input.required<boolean>();\n\n  constructor() {\n    effect(() => {\n      this.container.clear();\n      if (!this.appUnless()) this.container.createEmbeddedView(this.tpl);\n    });\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [AutoGrow, Unless],\n  template: \`\n    <textarea appAutoGrow rows="1" style="width: 100%"\n      [value]="text()" (input)="text.set($any($event.target).value)"></textarea>\n\n    <button (click)="locked.set(!locked())">{{ locked() ? 'Unlock' : 'Lock' }}</button>\n\n    <p *appUnless="locked()">Visible only while unlocked.</p>\n\n    <!-- the asterisk is sugar for this: -->\n    <ng-template [appUnless]="locked()">\n      <p>The same thing, written out.</p>\n    </ng-template>\n  \`\n})\nclass App {\n  protected readonly text = signal('type several lines\\nand watch it grow');\n  protected readonly locked = signal(false);\n}`,
    anno:[
      ["selector: '[appAutoGrow]'",'An attribute selector, which is what makes it usable on any element. The prefix is a convention that keeps it from colliding with a future HTML attribute.'],
      ['inject<ElementRef<HTMLTextAreaElement>>(ElementRef)','A directive\u2019s handle on its element. Typing the generic is what lets you reach `scrollHeight` without a cast.'],
      ['inject(TemplateRef)','Only injectable inside an `ng-template`, which is what makes a directive structural: it receives the template rather than an element.'],
      ['inject(ViewContainerRef)','The insertion point next to the template. `createEmbeddedView(tpl)` renders it, `clear()` removes it.'],
      ['*appUnless="locked()"','The asterisk is pure sugar. Angular rewrites it into the `ng-template` form below it, which is the whole secret of structural directives.'],
      ['readonly appUnless = input.required<boolean>()','The input named after the selector is what the microsyntax binds to. That naming rule is why `*ngIf="x"` sets an input called `ngIf`.'],
      ['effect(() => ...) to re-render','With a signal input, an effect is the simplest way to react. The decorator-era version used a setter on the input.']
    ],
    mistakes:[
      ['Writing a structural directive where a block would do','','`@if`, `@for` and `@switch` are faster, need no import, and read better. Write one only when you need your own context or your own repetition rule.'],
      ['Forgetting the asterisk','','Without it, `appUnless` is an attribute directive on a real element and `TemplateRef` cannot be injected, so it fails at construction.'],
      ['A directive selector with no prefix','','`[tooltip]` will collide with a library or a future platform attribute. Prefix everything.'],
      ['Reaching for ElementRef to do what a host binding does','','`nativeElement.classList.add()` fights Angular and is not reversible. Use `host: { \'[class.x]\': \'...\' }` unless you genuinely need the imperative API.']
    ],
    ex:{
      task:'Write a `clickOutside` attribute directive that emits when a click lands anywhere else, and use it to close a menu. Clean up the document listener.',
      start:`@Directive({ selector: '[appClickOutside]' })\nclass ClickOutside {\n  readonly clickedOutside = output<void>();\n  // your code\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [ClickOutside],\n  template: \`<p>your template</p>\`\n})\nclass App {}`,
      sol:`@Directive({ selector: '[appClickOutside]' })\nclass ClickOutside {\n  readonly clickedOutside = output<void>();\n\n  private readonly el = inject<ElementRef<HTMLElement>>(ElementRef);\n  private readonly destroyRef = inject(DestroyRef);\n\n  constructor() {\n    const onDocClick = (e: MouseEvent) => {\n      if (!this.el.nativeElement.contains(e.target as Node)) {\n        this.clickedOutside.emit();\n      }\n    };\n    // capture phase, so a stopPropagation inside the page cannot hide the click\n    document.addEventListener('click', onDocClick, true);\n    this.destroyRef.onDestroy(() =>\n      document.removeEventListener('click', onDocClick, true)\n    );\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [ClickOutside],\n  template: \`\n    <div class="wrap" appClickOutside (clickedOutside)="open.set(false)">\n      <button (click)="open.update(o => !o)" [attr.aria-expanded]="open()">\n        Menu\n      </button>\n      @if (open()) {\n        <ul class="menu">\n          <li><button (click)="pick('Rename')">Rename</button></li>\n          <li><button (click)="pick('Delete')">Delete</button></li>\n        </ul>\n      }\n    </div>\n    <p>last action: {{ last() || 'none' }} \u2014 click anywhere else to close the menu</p>\n  \`,\n  styles: \`\n    .wrap { display: inline-block; position: relative; }\n    .menu { position: absolute; margin: 4px 0 0; padding: 4px; list-style: none;\n            border: 1px solid #CFCCD6; background: #FCFBFD; }\n  \`\n})\nclass App {\n  protected readonly open = signal(false);\n  protected readonly last = signal('');\n\n  protected pick(action: string) {\n    this.last.set(action);\n    this.open.set(false);\n  }\n}`,
      why:'The directive knows nothing about menus, which is the point: the same attribute closes a dropdown, dismisses a popover, or commits an inline editor. Using the capture phase means a `stopPropagation()` somewhere else in the page cannot swallow the click and leave the menu stuck open, which is the bug most hand-rolled versions ship with. The listener is on `document` and removed through `DestroyRef`, so it dies with the element rather than accumulating one per mount. Note that `contains` is checked against `e.target`, so a click on the button itself counts as inside and the toggle keeps working instead of closing and reopening.'
    },
    mm:'A directive adds behaviour to an element you already have, and a structural one receives the template instead, which is all the asterisk ever meant.'
  },
  {
    id:'24', file:'templates.ts', t:'ng-template, ng-container, and ngTemplateOutlet',
    what:[
      '`<ng-template>` is markup that is defined but not rendered. Something has to render it: a structural directive, `ngTemplateOutlet`, or `ViewContainerRef`.',
      '`<ng-container>` is the opposite: it renders its children and produces no element of its own, so it is a place to hang a directive or group nodes without adding a div.'
    ],
    why:[
      'A template lets you pass markup as a value. That is the missing half of content projection: `ng-content` places nodes the caller wrote and bound, whereas an `ng-template` can be rendered by the component, several times, with data the component supplies. Every list, table, and picker component with a customisable row uses this.',
      '`ng-container` exists because HTML makes you nest, and a wrapper element is not always allowed or harmless: a `<tr>` cannot live inside a div, and a flex container styles its direct children.',
      'Together they are the mechanism under the built-in blocks. `@if` and `@for` compile to templates rendered by a container, which is why understanding these two makes the whole template system legible.'
    ],
    code:`@Component({\n  selector: 'app-list',\n  imports: [NgTemplateOutlet],\n  template: \`\n    <ul>\n      @for (item of items(); track item.id) {\n        <li>\n          <!-- render the caller's template, with OUR data as context -->\n          <ng-container\n            [ngTemplateOutlet]="row()"\n            [ngTemplateOutletContext]="{ $implicit: item, index: $index }" />\n        </li>\n      } @empty {\n        <li><ng-container [ngTemplateOutlet]="empty() ?? fallback" /></li>\n      }\n    </ul>\n\n    <ng-template #fallback><em>Nothing here.</em></ng-template>\n  \`\n})\nclass List {\n  readonly items = input.required<{ id: number; name: string; price: number }[]>();\n  readonly row = input.required<TemplateRef<{ $implicit: { name: string; price: number }; index: number }>>();\n  readonly empty = input<TemplateRef<unknown>>();\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [List],\n  template: \`\n    <!-- the caller decides what a row looks like, using data from the list -->\n    <ng-template #row let-item let-i="index">\n      <strong>{{ i + 1 }}.</strong> {{ item.name }} \u2014 \u00a3{{ item.price }}\n      @if (item.price > 10) { <span class="tag">pricey</span> }\n    </ng-template>\n\n    <app-list [items]="items()" [row]="row" />\n    <app-list [items]="[]" [row]="row" />\n\n    <button (click)="items.update(i => [...i, { id: i.length + 1, name: 'Extra', price: 20 }])">\n      Add one\n    </button>\n  \`,\n  styles: \`.tag { color: #B4005A; font-size: 12px; }\`\n})\nclass App {\n  protected readonly items = signal([\n    { id: 1, name: 'Mug', price: 8 },\n    { id: 2, name: 'Poster', price: 14 }\n  ]);\n}`,
    anno:[
      ['<ng-template #row let-item let-i="index">','Defined, not rendered. `let-item` binds the context\u2019s `$implicit` value; `let-i="index"` binds a named context property.'],
      ['[row]="row"','A `TemplateRef` passed as an ordinary input. The template reference variable evaluates to the TemplateRef, so this is just a value.'],
      ['[ngTemplateOutlet]="row()"','Renders it. From `@angular/common`, so `NgTemplateOutlet` goes in `imports`.'],
      ['[ngTemplateOutletContext]="{ $implicit: item, index: $index }"','The data the component supplies to the caller\u2019s markup. This is the thing `ng-content` cannot do.'],
      ['TemplateRef<{ $implicit: ...; index: number }>','Typing the context, so a caller writing `let-item` gets a typed `item` under `strictTemplates`.'],
      ['<ng-container>','No element in the output. Here it hosts a directive; it is also how you group several nodes inside an `@if` without a wrapper, and the only way to put a directive on a `<tr>` without breaking the table.'],
      ['empty() ?? fallback','A default template held in the component itself, used when the caller supplies none. The same idea as fallback content in `ng-content`.']
    ],
    mistakes:[
      ['Expecting an ng-template to render on its own','','It never does. If nothing renders it, nothing appears, and there is no error to tell you so.'],
      ['Using a div where an ng-container belongs','','It breaks table markup, flex and grid layouts, and CSS selectors like `> *`. If you only need a place to hang a directive, use the container.'],
      ['Reaching for a template when ng-content is enough','','If the caller\u2019s markup needs no data from the component, projection is simpler and cheaper. Templates are for when you must pass context in.'],
      ['Leaving the context untyped','','`let-item` on an untyped `TemplateRef` gives you `any`, which quietly switches off template type checking for that whole block.']
    ],
    ex:{
      task:'Build a table component that takes a column definition list, where each column supplies a header string and a cell template that receives the row.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`interface Person { id: number; name: string; age: number; admin: boolean }\ninterface Column { header: string; cell: TemplateRef<{ $implicit: Person }> }\n\n@Component({\n  selector: 'app-table',\n  imports: [NgTemplateOutlet],\n  template: \`\n    <table>\n      <thead>\n        <tr>@for (c of columns(); track c.header) { <th>{{ c.header }}</th> }</tr>\n      </thead>\n      <tbody>\n        @for (row of rows(); track row.id) {\n          <tr>\n            @for (c of columns(); track c.header) {\n              <td>\n                <ng-container [ngTemplateOutlet]="c.cell"\n                              [ngTemplateOutletContext]="{ $implicit: row }" />\n              </td>\n            }\n          </tr>\n        }\n      </tbody>\n    </table>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; }\n    th, td { border: 1px solid #CFCCD6; padding: 3px 8px; text-align: left; }\n  \`\n})\nclass DataTable {\n  readonly rows = input.required<Person[]>();\n  readonly columns = input.required<Column[]>();\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [DataTable],\n  template: \`\n    <ng-template #nameCell let-p><strong>{{ p.name }}</strong></ng-template>\n    <ng-template #ageCell let-p>{{ p.age }} years</ng-template>\n    <ng-template #roleCell let-p>\n      @if (p.admin) { <span class="tag">admin</span> } @else { member }\n    </ng-template>\n\n    <app-table [rows]="people" [columns]="columns()" />\n  \`,\n  styles: \`.tag { color: #B4005A; }\`\n})\nclass App {\n  protected readonly people: Person[] = [\n    { id: 1, name: 'Ada', age: 36, admin: true },\n    { id: 2, name: 'Grace', age: 45, admin: false }\n  ];\n\n  private readonly nameCell = viewChild.required<TemplateRef<{ $implicit: Person }>>('nameCell');\n  private readonly ageCell = viewChild.required<TemplateRef<{ $implicit: Person }>>('ageCell');\n  private readonly roleCell = viewChild.required<TemplateRef<{ $implicit: Person }>>('roleCell');\n\n  protected readonly columns = computed<Column[]>(() => [\n    { header: 'Name', cell: this.nameCell() },\n    { header: 'Age', cell: this.ageCell() },\n    { header: 'Role', cell: this.roleCell() }\n  ]);\n}`,
      why:'The table owns the loop, the markup, and the keys; the caller owns what a cell looks like and gets the row handed to it. That is the division every serious table component makes, and it is only possible because a template can be passed as a value and rendered with context. The columns are assembled in a `computed` that reads three `viewChild.required` queries, which works precisely because signal queries are signals: the computed recalculates once the templates exist, so nothing has to wait for `ngAfterViewInit`. Typing the context as `TemplateRef<{ $implicit: Person }>` is what keeps `let-p` typed inside the caller\u2019s markup rather than silently becoming `any`.'
    },
    mm:'ng-template is markup as a value that something else renders with context, and ng-container is a place to stand with no element.'
  },
  {
    id:'25', file:'dynamic-components.ts', t:'Dynamic components',
    what:[
      'Sometimes the component to render is decided at run time: a dashboard of widgets from a configuration, a form built from a schema, a dialog service that can show anything.',
      'Two ways to do it. `NgComponentOutlet` is the declarative one, a directive that takes a component class and its inputs. `ViewContainerRef.createComponent()` is the imperative one, for when there is no template to put the outlet in.'
    ],
    why:[
      'A template is static: `<app-chart />` names one component. When the choice comes from data, the options are a long `@switch` listing every possibility, or a value that holds the component itself.',
      'The `@switch` is often correct and is easier to follow, so the honest rule is to use it while the set is small and known. The dynamic version earns its place when the set is open, when it comes from configuration, or when the caller of a service decides.',
      '`createComponent` is what makes a generic dialog or toast service possible: the service holds no markup, and callers pass the component they want shown.'
    ],
    code:`@Component({\n  selector: 'app-chart',\n  template: \`<p class="w">[chart of {{ points() }} points]</p>\`,\n  styles: \`.w { border: 1px solid #CFCCD6; padding: 8px; }\`\n})\nclass Chart {\n  readonly points = input(0);\n}\n\n@Component({\n  selector: 'app-notes',\n  template: \`<p class="w">Notes: {{ text() }}</p>\`,\n  styles: \`.w { border: 1px solid #CFCCD6; padding: 8px; }\`\n})\nclass Notes {\n  readonly text = input('');\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [NgComponentOutlet],\n  template: \`\n    <!-- 1. declarative: the class and its inputs as values -->\n    @for (w of widgets(); track w.id) {\n      <ng-container [ngComponentOutlet]="w.type" [ngComponentOutletInputs]="w.inputs" />\n    }\n\n    <button (click)="add()">Add a widget from configuration</button>\n\n    <!-- 2. imperative: an insertion point with no markup of its own -->\n    <ng-container #slot />\n    <button (click)="spawn()">Create one imperatively</button>\n    <button (click)="clear()">Clear those</button>\n  \`\n})\nclass App {\n  // the component class is just a value in the data\n  protected readonly widgets = signal([\n    { id: 1, type: Chart, inputs: { points: 24 } as Record<string, unknown> }\n  ]);\n\n  private readonly slot = viewChild.required('slot', { read: ViewContainerRef });\n\n  protected add() {\n    this.widgets.update(list => [\n      ...list,\n      list.length % 2\n        ? { id: list.length + 1, type: Chart, inputs: { points: 40 + list.length } }\n        : { id: list.length + 1, type: Notes, inputs: { text: 'added at ' + new Date().toLocaleTimeString() } }\n    ]);\n  }\n\n  protected spawn() {\n    const ref = this.slot().createComponent(Notes);\n    ref.setInput('text', 'created with createComponent');\n    // ref.destroy() removes it; the container is cleared below\n  }\n\n  protected clear() {\n    this.slot().clear();\n  }\n}`,
    anno:[
      ['[ngComponentOutlet]="w.type"','Takes the component class itself. From `@angular/common`, so `NgComponentOutlet` goes in `imports`.'],
      ['[ngComponentOutletInputs]="w.inputs"','A record of input names to values, applied and kept in step. Before this existed you had to reach for `setInput` by hand.'],
      ["viewChild.required('slot', { read: ViewContainerRef })",'The `read` option is what turns a template reference into an insertion point rather than an `ElementRef`.'],
      ['slot().createComponent(Notes)','Creates the component and inserts it after the anchor. Returns a `ComponentRef` with `setInput`, `instance`, `destroy`, and `location`.'],
      ['ref.setInput(\'text\', value)','The imperative way to set an input. It marks the component for check, so the update appears.'],
      ['{ environmentInjector, projectableNodes }','Options on `createComponent`: which injector the component resolves against, and content to project into its `ng-content` slots.'],
      ['@switch (kind) { @case (\'chart\') { <app-chart /> } }','The alternative. Simpler to read and type-check, and the right choice while the set of components is small and known at build time.']
    ],
    mistakes:[
      ['Reaching for dynamic components too early','','A `@switch` over three widget types is clearer, fully type-checked, and needs no `Record<string, unknown>`. Go dynamic when the set is open, not when it is merely more than one.'],
      ['Forgetting to destroy what you created','','A `ComponentRef` from `createComponent` lives until you destroy it or clear the container. Inside a component, tie it to `DestroyRef`.'],
      ['Losing type safety in the inputs record','','`ngComponentOutletInputs` is a loose record, so a typo in an input name fails silently. Keep the configuration typed at the point where it is written.'],
      ['Expecting tree-shaking','','Referencing a component class in configuration means it is in the bundle. If the point was to avoid loading it, combine this with `@defer` or a dynamic `import()`, lesson 38.']
    ],
    ex:{
      task:'Write a tiny dialog service that shows any component in an overlay, passes it inputs, and destroys it on close. Use `createComponent` with an explicit environment injector.',
      start:`@Component({\n  selector: 'app-confirm',\n  template: \`<p>{{ message() }}</p>\`\n})\nclass Confirm {\n  readonly message = input('Are you sure?');\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`<p>your template</p>\`\n})\nclass App {}`,
      sol:`@Component({\n  selector: 'app-confirm',\n  template: \`\n    <p>{{ message() }}</p>\n    <button (click)="answered.emit(true)">Yes</button>\n    <button (click)="answered.emit(false)">No</button>\n  \`\n})\nclass Confirm {\n  readonly message = input('Are you sure?');\n  readonly answered = output<boolean>();\n}\n\n@Service()\nclass Dialog {\n  private readonly injector = inject(EnvironmentInjector);\n  private readonly appRef = inject(ApplicationRef);\n\n  // open any component, in an overlay this service owns\n  open<T>(type: new () => T, inputs: Record<string, unknown> = {}) {\n    const backdrop = document.createElement('div');\n    backdrop.setAttribute('style',\n      'position:fixed; inset:0; background:rgba(27,26,34,.45); display:flex;' +\n      'align-items:center; justify-content:center; z-index:50');\n    const panel = document.createElement('div');\n    panel.setAttribute('style', 'background:#FCFBFD; border:1px solid #CFCCD6; padding:16px');\n    backdrop.appendChild(panel);\n    document.body.appendChild(backdrop);\n\n    const ref = createComponent(type, {\n      environmentInjector: this.injector,\n      hostElement: panel\n    });\n    Object.entries(inputs).forEach(([k, v]) => ref.setInput(k, v));\n    this.appRef.attachView(ref.hostView);\n\n    const close = () => {\n      ref.destroy();\n      backdrop.remove();\n    };\n    backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });\n    return { ref, close };\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <button (click)="ask()">Delete the thing</button>\n    <p>answer: {{ answer() }}</p>\n  \`\n})\nclass App {\n  private readonly dialog = inject(Dialog);\n  protected readonly answer = signal('none yet');\n\n  protected ask() {\n    const { ref, close } = this.dialog.open(Confirm, { message: 'Delete three files?' });\n    ref.instance.answered.subscribe((yes: boolean) => {\n      this.answer.set(yes ? 'confirmed' : 'cancelled');\n      close();\n    });\n  }\n}`,
      why:'The service contains no markup for the dialog\u2019s contents, so it can show anything, which is the whole reason to go dynamic. Three pieces make it work: `createComponent` with an explicit `hostElement` puts the component in a DOM node the service created, `attachView` puts it into change detection so it actually updates, and `destroy` plus removing the backdrop is the teardown, which is easy to half-do and then wonder why memory grows. The outputs of a dynamically created component are ordinary observables on `ref.instance`, hence the `subscribe`; in production Angular Material\u2019s CDK overlay does all of this properly, including focus trapping and scroll blocking, which is lesson 41.'
    },
    mm:'A component class is a value: NgComponentOutlet renders one declaratively, createComponent does it where there is no template to put an outlet in.'
  },
  {
    id:'26', file:'communication.ts', t:'Component communication, reviewed',
    what:[
      'By now there are six ways for two components to exchange something. Inputs and outputs, two-way `model`, content projection, template context, a shared service, and querying a child directly.',
      'They are not interchangeable. Each one implies a different direction, a different coupling, and a different answer to "who owns this".'
    ],
    why:[
      'Almost every structural problem in an Angular application is a communication choice made for the wrong reason: a service invented to avoid passing an input two levels, a query used because an output felt like more typing, an input threaded through five components that do not care about it.',
      'The default should be the most local option that works, because locality is what makes a component readable on its own. Reach further only when the distance or the lifetime genuinely demands it.',
      'The escalation, in order: input and output; then `model` if it is genuinely one value with two owners; then projection or a template if the parent should supply markup rather than data; then a shared service when the state outlives the screen or the distance is large; and a query only when you need the object itself.'
    ],
    code:`@Service()\nclass Filters {\n  private readonly q = signal('');\n  readonly query = this.q.asReadonly();\n  setQuery(v: string) { this.q.set(v); }\n}\n\n// 1 + 2: input down, output up\n@Component({\n  selector: 'app-search-box',\n  template: \`\n    <input [value]="value()" (input)="changed.emit($any($event.target).value)"\n           [placeholder]="hint()" />\n  \`\n})\nclass SearchBox {\n  readonly value = input('');\n  readonly hint = input('search');\n  readonly changed = output<string>();\n}\n\n// 4: the parent supplies markup, not data\n@Component({\n  selector: 'app-toolbar',\n  template: \`<div class="bar"><ng-content /></div>\`,\n  styles: \`.bar { display: flex; gap: 8px; align-items: center;\n                 border: 1px solid #CFCCD6; padding: 6px; }\`\n})\nclass Toolbar {}\n\n// 5: far away, and reads the same state without being passed anything\n@Component({\n  selector: 'app-status',\n  template: \`<small>filtering on \u201c{{ filters.query() || 'everything' }}\u201d</small>\`\n})\nclass Status {\n  protected readonly filters = inject(Filters);\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [SearchBox, Toolbar, Status],\n  template: \`\n    <app-toolbar>\n      <app-search-box [value]="filters.query()" (changed)="filters.setQuery($event)" />\n      <button (click)="filters.setQuery('')">Clear</button>\n    </app-toolbar>\n\n    <p>{{ matches().length }} matches: {{ matches().join(', ') || '\u2014' }}</p>\n    <app-status />\n  \`\n})\nclass App {\n  protected readonly filters = inject(Filters);\n  private readonly all = ['mug', 'poster', 'tote', 'mousemat'];\n\n  protected readonly matches = computed(() =>\n    this.all.filter(x => x.includes(this.filters.query()))\n  );\n}`,

      ['input + output','The default. Explicit, type-checked, and visible in the parent\u2019s template, so the data flow can be read off the markup.'],

    ex:{
      task:'Take a screen with a list, a detail panel, and a footer count, and choose a mechanism for each connection. Justify each choice in a comment.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`interface Item { id: number; name: string; note: string }\n\n// state that outlives any one panel, and is read in three places: a service\n@Service()\nclass Items {\n  private readonly all = signal<Item[]>([\n    { id: 1, name: 'Mug', note: 'chipped' },\n    { id: 2, name: 'Poster', note: 'rolled' }\n  ]);\n  private readonly selectedId = signal<number | null>(1);\n\n  readonly list = this.all.asReadonly();\n  readonly selected = computed(() =>\n    this.all().find(i => i.id === this.selectedId()) ?? null\n  );\n  readonly count = computed(() => this.all().length);\n\n  select(id: number) { this.selectedId.set(id); }\n  updateNote(id: number, note: string) {\n    this.all.update(list => list.map(i => (i.id === id ? { ...i, note } : i)));\n  }\n}\n\n// a leaf that is told what to show and reports one event: input + output\n@Component({\n  selector: 'app-row',\n  template: \`\n    <button (click)="chosen.emit()" [style.font-weight]="active() ? 600 : 400">\n      {{ item().name }}\n    </button>\n  \`\n})\nclass Row {\n  readonly item = input.required<Item>();\n  readonly active = input(false);\n  readonly chosen = output<void>();\n}\n\n// edits one value with two owners: a model would be right if the parent held it,\n// but the service owns it, so this is an input plus an explicit event\n@Component({\n  selector: 'app-detail',\n  template: \`\n    @if (items.selected(); as sel) {\n      <p>{{ sel.name }}</p>\n      <input [value]="sel.note" (input)="items.updateNote(sel.id, $any($event.target).value)" />\n    } @else {\n      <p>Nothing selected.</p>\n    }\n  \`\n})\nclass Detail {\n  protected readonly items = inject(Items);\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Row, Detail],\n  template: \`\n    @for (i of items.list(); track i.id) {\n      <app-row [item]="i" [active]="i.id === items.selected()?.id"\n               (chosen)="items.select(i.id)" />\n    }\n    <app-detail />\n    <footer><small>{{ items.count() }} items</small></footer>\n  \`\n})\nclass App {\n  protected readonly items = inject(Items);\n}`,
      why:'Three connections, three different answers. The row is a leaf that should work anywhere, so it takes an input and emits an output and knows nothing about the service; that is what makes it testable in isolation. The detail panel injects the service instead, because it needs the selection and the update method and threading both through the root would be prop drilling for no benefit. The footer count is derived in the service, so every reader gets the same number. Note `@if (items.selected(); as sel)`, which binds the result once and narrows away the null, so the block reads `sel.name` without repeating the call or asserting non-null.'
    },
    mm:'Use the most local mechanism that works: input and output first, a service when state outlives the screen, a query only when you need the object.'
  }

    what:[

ignal<string | null>(null);\n\n  protected async load() {\n    this.loading.set(true);\n    this.error.set(null);\n    try {\n      this.users.set(await this.api.list(this.q()));\n    } catch (e) {\n      this.error.set((e as Error).message);\n    } finally {\n      this.loading.set(false);\n    }\n  }\n}`,
    anno:[
      ['inject(HttpClient)','No provider needed since v21. Call `provideHttpClient()` only to configure interceptors or to change the transport.'],
