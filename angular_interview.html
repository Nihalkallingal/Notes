      sol:`// src/app/app.routes.ts\n//   { path: '', loadComponent: () => import('./dashboard').then(m => m.Dashboard) },\n//   { path: 'admin', canActivate: [adminGuard],\n//     loadChildren: () => import('./admin/routes').then(m => m.adminRoutes) }\n//\n// dashboard.ts template:\n//   <app-kpis [data]="kpis.value()" />                  <!-- eager: the point of the page -->\n//\n//   @defer (on viewport; prefetch on idle) {\n//     <app-trend-chart [series]="trend.value()" />      <!-- charting library, below the fold -->\n//   } @placeholder { <div class="skeleton h-40"></div> }\n//\n//   @defer (on interaction; prefetch on hover) {\n//     <app-audit-log />                                 <!-- optional, opened by some users -->\n//   } @placeholder { <button>Show the audit log</button> }\n//\n//   @defer (when session.isAdmin()) {\n//     <app-cost-breakdown />                            <!-- only meaningful for admins -->\n//   }\n//\n// dashboard.ts class:\n//   private readonly exporter = injectAsync(\n//     () => import('./xlsx-exporter').then(m => m.XlsxExporter),\n//     { prefetch: onIdle }                               // 400kB, used by a minority\n//   );\n//   async export() { (await this.exporter()).write(this.kpis.value()); }\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <table>\n      <tr><th>Piece</th><th>Strategy</th><th>Reason</th></tr>\n      @for (p of plan; track p.piece) {\n        <tr><td>{{ p.piece }}</td><td><code>{{ p.how }}</code></td><td>{{ p.why }}</td></tr>\n      }\n    </table>\n    <p><small>Everything eager is on the critical path. Everything else pays only when used.</small></p>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; vertical-align: top; }\n  \`\n})\nclass App {\n  protected readonly plan = [\n    { piece: 'The dashboard route', how: 'loadComponent', why: 'every route lazy by default, including the first' },\n    { piece: 'KPI tiles', how: 'eager', why: 'above the fold and the reason the user came' },\n    { piece: 'Trend chart', how: '@defer on viewport; prefetch on idle', why: 'brings a charting library, sits below the fold' },\n    { piece: 'Audit log', how: '@defer on interaction; prefetch on hover', why: 'optional; a hover predicts the click' },\n    { piece: 'Cost breakdown', how: '@defer when isAdmin()', why: 'most users can never see it' },\n    { piece: 'XLSX exporter service', how: 'injectAsync with prefetch onIdle', why: 'large, not tied to a route or a template block' },\n    { piece: 'Admin section', how: 'loadChildren + guard', why: 'a whole feature most users never open' }\n  ];\n}`,
      why:'Three mechanisms, chosen by what the thing is rather than by preference. The route split is free and should be the default even for the first route. The chart and the audit log are template regions, so they are `@defer` decisions, and they differ only in trigger because one is inevitable and the other is optional. The exporter is neither a route nor a region: it is a dependency of a button, which is exactly the gap `injectAsync` fills, and prefetching it on idle means the click is instant while a user who never exports never downloads 400kB. Note that lazy loading the admin route and guarding it are separate concerns doing similar-looking work: the guard is security, the lazy import is bundle size, and neither substitutes for the other.'
    },
    mm:'Split at routes first, at template regions with @defer second, and at services with injectAsync when the dependency belongs to a button rather than a screen.'
  },
  {
    id:'39', file:'state-at-scale.ts', t:'State management at scale',
    what:[
      'Most state is local and `signal()` covers it. What is left divides into three different problems: state shared across screens, data that lives on a server, and state that belongs in the URL.',
      'Angular\u2019s built-in answers are a service with signals, the resource APIs, and the router. A store library is a fourth option for a specific set of symptoms.'
    ],
    why:[
      'The common mistake is one tool for all three. Putting fetched data in a hand-rolled service means writing caching, refetching, and invalidation yourself, which is the work `httpResource` already did. Putting a filter in a service instead of the URL means it cannot be shared or survive a refresh.',
      'So the question is never "which state library" but "which problem do I have". Server data needs staleness and revalidation. Shared client state needs one owner and a read-only surface. URL state needs the router.',
      'A store earns its place when a service with signals starts to hurt in identifiable ways: many entities keyed by id, a large surface of updates that need naming and tracing, several features reading overlapping slices, or a team that needs the discipline of a convention. `@ngrx/signals` and its SignalStore are the current shape of that in Angular, and they are the same primitives you already know with structure and devtools around them.'
    ],
    code:`// A service with signals, taken as far as it sensibly goes: entities keyed\n// by id, derived views, and named operations. Past this point a store\n// library is doing the same thing with conventions and devtools.\n\ninterface Task { id: number; title: string; done: boolean; listId: number }\n\n@Service()\nclass Tasks {\n  // normalised: a map by id, not a nested tree\n  private readonly byId = signal<Record<number, Task>>({\n    1: { id: 1, title: 'Read', done: false, listId: 1 },\n    2: { id: 2, title: 'Write', done: true, listId: 1 },\n    3: { id: 3, title: 'Ship', done: false, listId: 2 }\n  });\n  private readonly activeListId = signal(1);\n\n  readonly all = computed(() => Object.values(this.byId()));\n  readonly visible = computed(() => this.all().filter(t => t.listId === this.activeListId()));\n  readonly remaining = computed(() => this.visible().filter(t => !t.done).length);\n  readonly listId = this.activeListId.asReadonly();\n\n  // every change has a name and one implementation\n  selectList(id: number) { this.activeListId.set(id); }\n\n  toggle(id: number) {\n    this.byId.update(map => ({ ...map, [id]: { ...map[id], done: !map[id].done } }));\n  }\n\n  add(title: string) {\n    this.byId.update(map => {\n      const id = Math.max(0, ...Object.keys(map).map(Number)) + 1;\n      return { ...map, [id]: { id, title, done: false, listId: this.activeListId() } };\n    });\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <button (click)="tasks.selectList(1)" [disabled]="tasks.listId() === 1">List 1</button>\n    <button (click)="tasks.selectList(2)" [disabled]="tasks.listId() === 2">List 2</button>\n\n    <ul>\n      @for (t of tasks.visible(); track t.id) {\n        <li>\n          <label>\n            <input type="checkbox" [checked]="t.done" (change)="tasks.toggle(t.id)" />\n            {{ t.done ? '\u2014 ' + t.title : t.title }}\n          </label>\n        </li>\n      } @empty { <li>Empty list.</li> }\n    </ul>\n\n    <input #box placeholder="new task" (keyup.enter)="tasks.add(box.value); box.value = ''" />\n    <p>{{ tasks.remaining() }} remaining in this list, {{ tasks.all().length }} in total</p>\n  \`\n})\nclass App {\n  protected readonly tasks = inject(Tasks);\n}`,
    anno:[
      ['Record<number, Task>','Normalised state. Updating one task touches one key rather than mapping a whole array, and two features can hold ids without duplicating the objects.'],
      ['readonly all = computed(...)','Derived views live next to the state, so every screen agrees on what "visible" and "remaining" mean.'],
      ['asReadonly()','The public surface is read-only and the writable signals are private, which is the discipline from lesson 16 and the thing a store library enforces for you.'],
      ['Named operations','`selectList`, `toggle`, `add`. Every change has a name, which is what makes the service greppable and testable without Angular.'],
      ['When to reach for a store','Many entity types, updates worth tracing, overlapping slices across features, or a team that wants one convention. `@ngrx/signals` gives you `signalStore`, `withEntities`, and devtools.'],
      ['What a store does not fix','Server data. Pair any store with the resource APIs rather than caching HTTP responses in it by hand.'],
      ['URL state','Filters, sort orders, and the open tab belong in query parameters, so they survive a refresh and can be shared. That is lesson 35, not this one.']
    ],
    mistakes:[
      ['Putting server data in a store or a service by hand','','You will reimplement caching, refetch, retries, and invalidation. Use `httpResource` and keep the store for genuinely client-side state.'],
      ['One global store for everything','','A single object every component reads becomes impossible to reason about or delete from. Scope state to the feature that owns it.'],
      ['Reaching for a library before feeling the pain','','A service with signals covers a lot. Adopt a store when you can name the symptom it fixes, not because the app is "big now".'],
      ['Nested state','','A tree of arrays inside objects makes every update a deep copy. Normalise by id, which also makes derived views cheap.']
    ],
    ex:{
      task:'Split a screen\u2019s state four ways: local UI state, shared client state, server data, and URL state. Say which primitive owns each and why.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`// An invoices screen, split by what each value actually is:\n//\n//   URL          ?status=overdue&page=2&sort=due\n//                the filter, the page, the sort order. Shareable, survives a\n//                refresh, and the back button works. Router, not signals.\n//\n//   SERVER       invoices = httpResource<Invoice[]>(() =>\n//                  \`/api/invoices?status=\${status()}&page=\${page()}\`)\n//                reads the URL state, reloads when it changes, owns loading\n//                and error. Never copied into a signal.\n//\n//   SHARED       @Service() Session { user, permissions }\n//                one instance, read by the header, the guard, and this screen.\n//                Outlives every screen, so it cannot live in a component.\n//\n//   LOCAL        expandedRowId = signal<number | null>(null)\n//                which row is open. Nobody else needs it, it should not\n//                survive navigation, and it should not be in the URL.\n\ninterface Invoice { id: number; ref: string; overdue: boolean }\n\n@Service()\nclass Session {\n  private readonly u = signal({ name: 'Ada', canVoid: true });\n  readonly user = this.u.asReadonly();\n  readonly canVoid = computed(() => this.u().canVoid);\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p>signed in as {{ session.user().name }}</p>\n\n    <!-- stands in for query params -->\n    <button (click)="status.set('all')">all</button>\n    <button (click)="status.set('overdue')">overdue</button>\n    <p>url would be: <code>?status={{ status() }}</code></p>\n\n    @if (invoices.isLoading()) { <p role="status">Loading\u2026</p> }\n    @if (invoices.hasValue()) {\n      <ul>\n        @for (i of invoices.value()!; track i.id) {\n          <li>\n            <button (click)="toggleRow(i.id)">{{ i.ref }}</button>\n            @if (expandedRowId() === i.id) {\n              <span> \u2014 overdue: {{ i.overdue }}\n                @if (session.canVoid()) { <button>Void</button> }\n              </span>\n            }\n          </li>\n        }\n      </ul>\n    }\n  \`\n})\nclass App {\n  protected readonly session = inject(Session);\n\n  // URL state, stood in for by a signal here\n  protected readonly status = signal<'all' | 'overdue'>('all');\n\n  // local UI state\n  protected readonly expandedRowId = signal<number | null>(null);\n  protected toggleRow(id: number) {\n    this.expandedRowId.update(cur => (cur === id ? null : id));\n  }\n\n  // server data, keyed on the URL state\n  protected readonly invoices = resource({\n    params: () => ({ status: this.status() }),\n    loader: ({ params }) => new Promise<Invoice[]>(r => setTimeout(() => r(\n      [{ id: 1, ref: 'INV-1', overdue: true }, { id: 2, ref: 'INV-2', overdue: false }]\n        .filter(i => params.status === 'all' || i.overdue)\n    ), 500))\n  });\n}`,
      why:'Four values, four owners, and the test for each is a question rather than a preference. Should it survive a refresh or be shareable? Then it is URL state. Does it come from a server? Then a resource owns it, including its loading and error states, and copying it into a signal would create a second truth. Does it outlive this screen or get read somewhere far away? Then a service. Otherwise it is local, and `expandedRowId` is the example: putting it in the URL would be absurd and putting it in a service would leak between screens. Notice that the resource reads the URL state and reloads itself, so there is no effect and no refresh button wiring; that dependency direction, URL to server data, is the one that keeps this shape simple as the screen grows.'
    },
    mm:'Sort the state before choosing a tool: local, shared, server, or URL, because each has a different right answer.'
  },
  {
    id:'40', file:'testing.ts', t:'Testing with TestBed and Vitest',
    what:[
      '`TestBed` builds a miniature Angular application for a test: it configures providers, creates a component, and gives you a fixture with the component instance and its DOM.',
      'Since v21 Vitest is the default test runner for new projects, and since v21 applications are zoneless, so tests `await fixture.whenStable()` instead of calling `detectChanges()`.'
    ],
    why:[
      'A component is a class plus a template plus a set of dependencies, and only the class is testable without Angular. `TestBed` exists so the template and the injection are exercised too, which is where most component bugs live.',
      'The runner changed because Karma was deprecated and the ecosystem moved. Vitest is faster, works with the same tooling as the build, and its Browser Mode runs tests in a real browser with a `Locator` API, so a test can look like a user rather than like a DOM traversal.',
      'The zoneless change matters more than it sounds. `detectChanges()` was a synchronous poke that happened to work because Zone.js knew when things settled; `await fixture.whenStable()` waits for the application to be genuinely idle, which is both more honest and less flaky.'
    ],
    code:`// Tests need a runner, which this page does not have. Below is the\n// component under test, written so that it is easy to test, and the spec\n// file is in the walkthrough and the solution.\n//\n//   import { TestBed } from '@angular/core/testing';\n//   import { provideHttpClientTesting } from '@angular/common/http/testing';\n//\n//   describe('Counter', () => {\n//     it('counts up and reports the total', async () => {\n//       TestBed.configureTestingModule({\n//         providers: [{ provide: Limits, useValue: { max: 3 } }]\n//       });\n//       const fixture = TestBed.createComponent(Counter);\n//       await fixture.whenStable();                       // zoneless: not detectChanges\n//\n//       const button = fixture.nativeElement.querySelector('button');\n//       button.click();\n//       await fixture.whenStable();\n//\n//       expect(fixture.nativeElement.textContent).toContain('1 of 3');\n//     });\n//   });\n\n@Service()\nclass Limits {\n  readonly max = 5;\n}\n\n@Component({\n  selector: 'app-counter',\n  template: \`\n    <button (click)="inc()" [disabled]="atMax()">Add one</button>\n    <p>{{ n() }} of {{ limits.max }}</p>\n    @if (atMax()) { <p role="status">That is the limit.</p> }\n  \`\n})\nclass Counter {\n  protected readonly limits = inject(Limits);\n  readonly n = signal(0);\n  readonly atMax = computed(() => this.n() >= this.limits.max);\n  readonly reached = output<void>();\n\n  inc() {\n    if (this.atMax()) return;\n    this.n.update(x => x + 1);\n    if (this.atMax()) this.reached.emit();\n  }\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [Counter],\n  template: \`\n    <app-counter (reached)="note.set('limit reached')" />\n    <p>{{ note() }}</p>\n    <p><small>The limit comes from an injected service, so a test can replace it.</small></p>\n  \`\n})\nclass App {\n  protected readonly note = signal('');\n}`,
    anno:[
      ['TestBed.configureTestingModule({ providers })','Where you substitute dependencies. This is why `inject(Limits)` rather than `new Limits()` matters: it is the seam that makes the test possible.'],
      ['TestBed.createComponent(Counter)','Compiles and creates the component. Standalone components need no declarations array; their own `imports` are used.'],
      ['await fixture.whenStable()','The zoneless way to let the application settle. Generated tests use this instead of `fixture.detectChanges()`, which is what the CLI has emitted since v21.'],
      ['TestBed.getLastFixture()','v22. Fetches the fixture created in a `beforeEach` without keeping a variable for it.'],
      ['provideHttpClientTesting()','Intercepts requests so a test can flush responses. Since v21 you use it alone; pairing it with `provideHttpClient()` is no longer necessary.'],
      ['Vitest Browser Mode','Runs the test in a real browser and gives you a `Locator` API, so assertions read as `await expect.element(page.getByRole(\'button\')).toBeDisabled()`.'],
      ['Component harnesses','From the CDK. A harness is an API over a component for tests, so a test manipulates a date picker through its harness rather than through its DOM.'],
      ['fakeAsync','Depends on a patched Zone.js. v22 lets you use it under Vitest by adding `zone.js/plugins/vitest-patch` to the test polyfills, which is a migration aid rather than a destination.'],
      ['Migrations','`ng g @schematics/angular:migrate-karma-to-vitest` moves the setup, and `ng g refactor-jasmine-vitest --fake-async` converts the specs, including fake timers.']
    ],
    mistakes:[
      ['Testing the class and calling it a component test','','A class test cannot catch a template typo, a missing import, or a binding to a private field. If the component has a template, render it.'],
      ['Calling detectChanges in a zoneless test','','It still exists, and `await fixture.whenStable()` is what the current templates use and what actually waits for the application to settle.'],
      ['Querying by CSS class','','A class is a styling decision and will change. Query by role, label, or text, which is also how you find out whether the component is accessible at all.'],
      ['Mocking a child component','','It couples the test to the tree shape. Prefer rendering the real children and mocking only the network or a service at the edge.']
    ],
    ex:{
      task:'Write the spec for the counter above: the disabled state at the limit, the output firing exactly once, and a substituted limit service.',
      start:`// sketch the spec file\n@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`// counter.spec.ts\n//\n// import { TestBed } from '@angular/core/testing';\n// import { Counter, Limits } from './counter';\n//\n// function setup(max = 2) {\n//   TestBed.configureTestingModule({\n//     providers: [{ provide: Limits, useValue: { max } }]\n//   });\n//   const fixture = TestBed.createComponent(Counter);\n//   const click = async () => {\n//     fixture.nativeElement.querySelector('button').click();\n//     await fixture.whenStable();\n//   };\n//   return { fixture, click, text: () => fixture.nativeElement.textContent };\n// }\n//\n// it('shows the injected limit', async () => {\n//   const { fixture, text } = setup(2);\n//   await fixture.whenStable();\n//   expect(text()).toContain('0 of 2');\n// });\n//\n// it('disables the button at the limit and announces it', async () => {\n//   const { fixture, click, text } = setup(2);\n//   await fixture.whenStable();\n//   await click();\n//   await click();\n//\n//   expect(fixture.nativeElement.querySelector('button').disabled).toBe(true);\n//   expect(fixture.nativeElement.querySelector('[role=status]')).not.toBeNull();\n//   expect(text()).toContain('2 of 2');\n// });\n//\n// it('emits reached exactly once', async () => {\n//   const { fixture, click } = setup(1);\n//   const seen: void[] = [];\n//   fixture.componentInstance.reached.subscribe(() => seen.push(undefined));\n//\n//   await fixture.whenStable();\n//   await click();      // hits the limit: emits\n//   await click();      // already at the limit: must not emit again\n//\n//   expect(seen.length).toBe(1);\n// });\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p>Three tests, no implementation details:</p>\n    <ul>\n      <li>the limit is injected, so the test sets it to 2 and runs in four clicks instead of five</li>\n      <li>assertions read the rendered output, not the signals</li>\n      <li>the output is asserted for count, because "fires once" is the actual rule</li>\n    </ul>\n  \`\n})\nclass App {}`,
      why:'Substituting `Limits` is what makes the tests short: a real limit of five means five clicks per test and a slow suite for no extra coverage. Each assertion reads the DOM rather than the signals, so the tests survive a rewrite of the internals and fail if the template stops rendering the count, which is the behaviour a user depends on. The third test is the one worth copying: "emits once" is a rule with an off-by-one failure mode, so counting the emissions catches the version that fires on every click past the limit, which an assertion of "was called" would pass. Note the `setup` helper returning a `click` that awaits stability, which keeps every test free of the zoneless ceremony.'
    },
    mm:'TestBed renders the component with substitutable dependencies, and in a zoneless app you await stability rather than poking change detection.'
  },
  {
    id:'41', file:'accessibility.ts', t:'Accessibility and @angular/aria',
    what:[
      'Most accessibility in Angular is correct HTML: a `button` for an action, a `label` tied to its input, headings in order, and ARIA attributes derived from state through host or attribute bindings.',
      'The hard parts are the widgets HTML does not provide: menus, comboboxes, tabs, trees, listboxes. `@angular/aria`, generally available since v22, ships headless directives that implement those patterns.'
    ],
    why:[
      'Native elements come with keyboard behaviour, focus handling, and a role for free. A `div` with a click handler has none of it, so every one is a decision to reimplement, badly, what the browser already did.',
      'For the composite widgets there is no native element, and the ARIA specifications are long: a combobox has rules for arrow keys, typeahead, `aria-activedescendant`, and what happens on Escape. Getting that right and keeping it right is not a good use of a product team\u2019s time, which is why the Angular Material team built the package and why it is worth using rather than copying.',
      'The Angular-specific responsibility is focus, because components mount and unmount underneath the user. Open a dialog and focus stays behind; close one that removed its trigger and focus falls to the body, losing the user\u2019s place entirely.'
    ],
    code:`// @angular/aria gives you these as directives:\n//\n//   import { Combobox, Listbox, Option } from '@angular/aria';\n//\n//   <div ngCombobox>\n//     <input ngComboboxInput [(value)]="query" />\n//     <ul ngListbox>\n//       @for (o of options(); track o) { <li ngOption [value]="o">{{ o }}</li> }\n//     </ul>\n//   </div>\n//\n// It is not in this page's import map, and the exact selectors belong to\n// your installed version rather than to a snippet, so the example below is\n// the same widget by hand. Reading it is the point: this is what the\n// package saves you, and v22 made these directives work with signal forms.\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <label for="fruit">Find a fruit</label>\n    <input id="fruit" role="combobox" autocomplete="off"\n           [attr.aria-expanded]="results().length > 0"\n           aria-controls="fruit-list"\n           [attr.aria-activedescendant]="activeId()"\n           [value]="query()"\n           (input)="onInput($any($event.target).value)"\n           (keydown)="onKey($event)" />\n\n    <!-- announced politely, without stealing focus -->\n    <p role="status" class="count">{{ results().length }} matches</p>\n\n    <ul id="fruit-list" role="listbox">\n      @for (f of results(); track f; let i = $index) {\n        <li [id]="'opt-' + f" role="option" [attr.aria-selected]="i === active()"\n            [class.active]="i === active()" (mousedown)="choose(f)">\n          {{ f }}\n        </li>\n      }\n    </ul>\n\n    @if (chosen()) { <p>chosen: {{ chosen() }}</p> }\n  \`,\n  styles: \`\n    ul { list-style: none; padding: 0; margin: 4px 0; }\n    li { padding: 2px 6px; cursor: pointer; }\n    li.active { background: #F7E6EE; }\n    .count { font-size: 12px; color: #55525F; }\n  \`\n})\nclass App {\n  private readonly all = ['apple', 'apricot', 'banana', 'blackberry', 'cherry'];\n\n  protected readonly query = signal('');\n  protected readonly active = signal(0);\n  protected readonly chosen = signal('');\n\n  protected readonly results = computed(() =>\n    this.all.filter(f => f.startsWith(this.query().toLowerCase()))\n  );\n  // what tells a screen reader which option is current, without moving focus\n  protected readonly activeId = computed(() => {\n    const f = this.results()[this.active()];\n    return f ? 'opt-' + f : null;\n  });\n\n  protected onInput(value: string) {\n    this.query.set(value);\n    this.active.set(0);\n  }\n\n  protected onKey(e: KeyboardEvent) {\n    const last = this.results().length - 1;\n    if (e.key === 'ArrowDown') { e.preventDefault(); this.active.update(i => Math.min(last, i + 1)); }\n    if (e.key === 'ArrowUp') { e.preventDefault(); this.active.update(i => Math.max(0, i - 1)); }\n    if (e.key === 'Home') { e.preventDefault(); this.active.set(0); }\n    if (e.key === 'End') { e.preventDefault(); this.active.set(last); }\n    if (e.key === 'Enter') { const f = this.results()[this.active()]; if (f) this.choose(f); }\n    if (e.key === 'Escape') { this.query.set(''); this.active.set(0); }\n  }\n\n  protected choose(f: string) {\n    this.chosen.set(f);\n    this.query.set(f);\n  }\n}`,
    anno:[
      ['@angular/aria','Introduced in v21 as a developer preview and generally available in v22. Headless directives built on the CDK: Accordion, Autocomplete, ComboBox, Grid, ListBox, Menu, Multiselect, Select, Tabs, Toolbar, Tree.'],
      ['aria-activedescendant','What lets focus stay in the input while a screen reader announces the highlighted option. Derived from state here, so it cannot go stale.'],
      ['role="status"','A polite live region: the match count is announced on change without interrupting typing. It is the accessible equivalent of the number a sighted user reads for free.'],
      ['label with a matching for and id','What makes the field announce its name. A placeholder is not a label: it disappears, is read inconsistently, and usually fails contrast.'],
      ['Keyboard handling','Arrows, Home, End, Enter, Escape. This is the minimum the ARIA combobox pattern requires, and it is most of the code above.'],
      ['onMouseDown rather than onClick','Fires before the input loses focus, which keeps the selection working. The kind of detail a library has already found.'],
      ['CDK a11y','`cdkTrapFocus` for dialogs, `LiveAnnouncer` for imperative announcements, `FocusMonitor` for how an element was focused. Useful even if you do not use Material components.'],
      ['Focus across navigation','Moving focus to the new heading after a route change is the Angular-specific duty nobody remembers, and it is what makes a single-page app usable by keyboard.']
    ],
    mistakes:[
      ['A div with a click handler','','No keyboard, no role, no focus. Use a `button` and restyle it. If you truly cannot, you owe it `role="button"`, `tabindex="0"`, and handlers for Enter and Space.'],
      ['Removing focus outlines','','`outline: none` with no replacement makes the application unusable by keyboard. Style `:focus-visible` instead.'],
      ['ARIA that can go stale','','An `aria-expanded` set once, imperatively, is worse than none, because it actively misinforms. Bind it to state so it cannot drift.'],
      ['Trusting an automated audit','','axe and Lighthouse find missing labels and contrast. They cannot tell you the focus order is nonsense or that a custom widget is unusable. Unplug the mouse and try the flow.']
    ],
    ex:{
      task:'Make a dialog accessible: move focus in on open, trap it, return it on close, and label the dialog. Use no library.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<button (click)="open.set(true)">Open</button>\`\n})\nclass App {\n  protected readonly open = signal(false);\n}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    <button #trigger (click)="open.set(true)">Delete the thing</button>\n\n    @if (open()) {\n      <div class="backdrop" (click)="close()">\n        <div #panel class="panel" role="dialog" aria-modal="true"\n             aria-labelledby="dlg-title" tabindex="-1"\n             (click)="$event.stopPropagation()" (keydown)="onKey($event)">\n          <h4 id="dlg-title">Are you sure?</h4>\n          <p>Tab around: focus cannot leave. Escape closes and returns focus.</p>\n          <button (click)="close()">Cancel</button>\n          <button (click)="close()">Confirm</button>\n        </div>\n      </div>\n    }\n  \`,\n  styles: \`\n    .backdrop { position: fixed; inset: 0; background: rgba(27,26,34,.45);\n                display: flex; align-items: center; justify-content: center; }\n    .panel { background: #FCFBFD; border: 1px solid #CFCCD6; padding: 16px; max-width: 320px; }\n  \`\n})\nclass App {\n  protected readonly open = signal(false);\n\n  private readonly trigger = viewChild.required<ElementRef<HTMLButtonElement>>('trigger');\n  private readonly panel = viewChild<ElementRef<HTMLElement>>('panel');\n\n  constructor() {\n    // the query is a signal, so this runs when the panel appears or disappears\n    effect(() => {\n      const panel = this.panel();\n      if (panel) panel.nativeElement.focus();\n      else this.trigger().nativeElement.focus();   // returned on close\n    });\n  }\n\n  protected close() { this.open.set(false); }\n\n  protected onKey(e: KeyboardEvent) {\n    if (e.key === 'Escape') { this.close(); return; }\n    if (e.key !== 'Tab') return;\n\n    const items = this.panel()!.nativeElement.querySelectorAll<HTMLElement>(\n      'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'\n    );\n    if (items.length === 0) return;\n    const first = items[0], last = items[items.length - 1];\n    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }\n    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }\n  }\n}`,
      why:'The focus handling is an effect reading a signal query, which is the Angular-specific part worth stealing: because `viewChild` is a signal, one effect covers both directions, focusing the panel when it appears and returning focus to the trigger when it goes, with no lifecycle hook and no flag. `tabindex="-1"` on the panel is what makes a div focusable at all, and the three ARIA attributes tell a screen reader that this is a modal dialog and what it is called. The trap is eight lines and handles the common case; a real one has to deal with disabled elements, elements hidden by CSS, shadow DOM, and iframes, which is exactly why `cdkTrapFocus` and `@angular/aria` exist and why the honest recommendation is to use them.'
    },
    mm:'Use the native element, derive every ARIA attribute from state, manage focus across mounts, and take the composite widgets from @angular/aria.'
  },
  {
    id:'42', file:'ssr-hydration.ts', t:'SSR, hydration, and the transfer cache',
    what:[
      'Server-side rendering runs your application on the server and sends HTML, so the first paint is real content. Hydration is the client then adopting that DOM: attaching event listeners and taking ownership rather than rebuilding it.',
      'Since v22 incremental hydration is the default strategy, so parts of the page hydrate as they are needed rather than all at once.'
    ],
    why:[
      'A client-rendered application sends an empty shell, so the user watches a spinner while the bundle downloads and the first request goes out. SSR moves that first paint forward, which matters for perceived speed and for anything that needs to be indexed.',
      'Hydration exists so you do not pay for the HTML twice. Without it the client would throw away the server\u2019s DOM and rebuild it, producing a visible flash and wasted work.',
      'Incremental hydration goes further: combined with `@defer (hydrate on ...)` triggers, a region stays inert until it is scrolled to or interacted with, so the JavaScript for the footer never runs for a user who does not scroll. The cost is that the first client render must match the server exactly, which is the one rule everything surprising follows from.'
    ],
    code:`// The configuration, for reference:\n//\n//   // app.config.ts\n//   providers: [\n//     provideClientHydration(\n//       // incremental hydration is the default since v22;\n//       // withNoIncrementalHydration() goes back to hydrating everything at once\n//       withHttpTransferCacheOptions({ includePostRequests: false })\n//     )\n//   ]\n//\n//   // server.ts\n//   provideServerRendering({ maxResponseBodySize: 2 * 1024 * 1024 }, withRoutes(serverRoutes));\n//\n//   // a region that hydrates only when it is needed\n//   @defer (hydrate on viewport) { <app-comments /> }\n//\n// There is no server here, so the snippet shows the pattern that keeps a\n// client-only value from breaking hydration.\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p>Rendered on the server and the client: <strong>{{ title }}</strong></p>\n\n    <!-- safe: identical on both, then upgraded after mount -->\n    <p>Local time: {{ time() ?? '\u2014' }}</p>\n\n    <!-- unsafe if server-rendered: the two would differ -->\n    <p>A value that must not be rendered on the server: {{ unsafe }}</p>\n\n    <p>hydrated: {{ hydrated() ? 'yes' : 'not yet' }}</p>\n  \`\n})\nclass App {\n  protected readonly title = 'Invoices';\n\n  protected readonly time = signal<string | null>(null);\n  protected readonly hydrated = signal(false);\n\n  // Math.random, Date, locale formatting, window, localStorage: all differ\n  protected readonly unsafe = 'would be a mismatch';\n\n  constructor() {\n    // afterNextRender never runs on the server, which is exactly the guard\n    afterNextRender(() => {\n      this.time.set(new Date().toLocaleTimeString());\n      this.hydrated.set(true);\n    });\n  }\n}`,
    anno:[
      ['provideClientHydration()','Turns hydration on. Without it the client discards the server DOM and re-renders, which is the flash people mistake for a slow app.'],
      ['Incremental hydration','The default since v22. `withIncrementalHydration()` is deprecated and unnecessary; the migration adds `withNoIncrementalHydration()` if you were not using it.'],
      ['@defer (hydrate on viewport)','A hydration trigger rather than a loading one: the HTML is there from the server and the JavaScript activates when the region is needed.'],
      ['The transfer cache','HTTP responses fetched during server rendering are serialised into the page, so the client does not repeat them. v22 stopped caching credentialed requests, so authenticated responses no longer leak into transferred state.'],
      ['resource({ id })','v22. Caches a resource\u2019s resolved value across the boundary, so a server-rendered resource arrives resolved instead of flashing a spinner.'],
      ['afterNextRender','The idiomatic guard for browser-only work. It never runs on the server, so `window`, `localStorage`, and `focus()` are safe inside it.'],
      ['Mismatch causes','Dates, locales and time zones, `Math.random`, reading `window` during construction, and invalid HTML nesting that the browser silently repairs.'],
      ['provideServerRendering(options, withRoutes(...))','v22 accepts options; `maxResponseBodySize` defaults to 1MB. Server routes let you choose per route between server rendering, prerendering, and client rendering.']
    ],
    mistakes:[
      ['Touching window or document during construction','ReferenceError: window is not defined','The server has no DOM. Move it into `afterNextRender`, or guard with `typeof window !== \'undefined\'` and accept that the first render must not use it.'],
      ['Formatting dates or currency on both sides','','The server and the browser have different locales and time zones, so the text differs and hydration complains. Format after mount, or pass an explicit locale and time zone.'],
      ['Invalid HTML nesting','','A `div` inside a `p`, or a `tr` outside a `tbody`. The browser repairs it, so the DOM no longer matches what Angular rendered, and hydration breaks in a way that looks unrelated.'],
      ['Caching credentialed responses in the transfer cache','','v22 changed the default for good reason: a per-user response embedded in the page can be served to someone else by a CDN. Review any custom transfer cache options.']
    ],
    ex:{
      task:'Take a component that reads localStorage and the current time, and make it safe to server-render without losing the server\u2019s HTML for the parts that can be rendered.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p>{{ greeting }}</p>\n    <p>{{ theme }}</p>\n  \`\n})\nclass App {\n  protected readonly greeting = 'Good ' + (new Date().getHours() < 12 ? 'morning' : 'afternoon');\n  protected readonly theme = localStorage.getItem('theme') ?? 'light';\n}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    <!-- server data: rendered on the server, indexed, no flash -->\n    <p>Hello, {{ name }}.</p>\n\n    <!-- client-only: a stable placeholder first, upgraded after hydration -->\n    <p>{{ greeting() }}</p>\n    <p>theme: {{ theme() }}</p>\n\n    <p><small>{{ hydrated() ? 'upgraded on the client' : 'server output' }}</small></p>\n  \`\n})\nclass App {\n  // comes with the HTML, so it belongs in the server render\n  protected readonly name = 'Ada';\n\n  // both of these depend on the reader's machine, so they start neutral\n  protected readonly greeting = signal('Welcome back.');\n  protected readonly theme = signal('light');\n  protected readonly hydrated = signal(false);\n\n  constructor() {\n    afterNextRender(() => {\n      const hour = new Date().getHours();\n      this.greeting.set(\n        'Good ' + (hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening') + '.'\n      );\n\n      try {\n        this.theme.set(localStorage.getItem('theme') ?? 'light');\n      } catch {\n        // private mode, quota, or no storage: a preference must never break the page\n      }\n    });\n  }\n}`,
      why:'The split is by where the value comes from. The name is server data, so rendering it on the client only would cost a flash of empty space and lose the SEO benefit. The greeting depends on the reader\u2019s clock and the theme on their storage, and neither exists on the server, so both start with a neutral value that the server and the first client render agree on, then upgrade one frame later inside `afterNextRender`. That guard is better than `typeof window` checks because it also fixes the timing: the code runs after hydration rather than during it. The `try` around `localStorage` is there because it throws rather than returning null in Safari private mode, and a theme preference should never be able to take down a page.'
    },
    mm:'SSR sends real HTML and hydration adopts it, so the first client render must match the server and anything browser-only waits for afterNextRender.'
  },
  {
    id:'43', file:'security.ts', t:'Security: sanitisation and XSS',
    what:[
      'Angular escapes interpolated values by default, so `{{ userInput }}` renders tags as text and cannot execute anything. Binding to `[innerHTML]` sanitises the value instead of escaping it, stripping scripts and event handlers.',
      'The ways to get hurt are the deliberate bypasses: `DomSanitizer.bypassSecurityTrust*`, unchecked URLs in `href` or `src`, and injecting into the page around your application.'
    ],
    why:[
      'The framework picked safe defaults because escaping is a decision that should not be made per binding. That is why ordinary Angular templates are essentially immune to XSS, and why every real vulnerability in an Angular app is a place where someone opted out.',
      'Sanitisation rather than escaping for `innerHTML` exists because sometimes you genuinely have HTML: a CMS field, a rendered markdown blob. Angular strips what is dangerous and keeps the markup, which is a better default than either escaping it into gibberish or trusting it.',
      'v22 tightened this further. Sanitisation is stricter across dynamic `href` and `xlink:href` on SVG anchors, `meta` selectors, and placeholder values, and the server package now rejects suspicious and protocol-relative URLs to guard against server-side request forgery. Those came alongside the late-2025 CVEs, which were fixed only in the supported versions, which is the practical argument for staying on the treadmill.'
    ],
    code:`const untrusted = '<img src=x onerror="alert(1)"> and <b>bold</b> and <script>bad()<\\/script>';\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p><strong>Escaped by default.</strong> Tags render as text:</p>\n    <p class="mono">{{ untrusted }}</p>\n\n    <p><strong>Bound to innerHTML.</strong> Angular sanitises: the bold survives,\n       the script and the onerror do not.</p>\n    <div [innerHTML]="untrusted"></div>\n\n    <p><strong>A URL from a user is code until you check it.</strong></p>\n    <input [value]="url()" (input)="url.set($any($event.target).value)" style="width:100%" />\n    @if (safeUrl()) {\n      <p><a [href]="safeUrl()" rel="noreferrer noopener" target="_blank">Allowed link</a></p>\n    } @else {\n      <p class="warn">Blocked: only http and https are allowed.</p>\n    }\n  \`,\n  styles: \`\n    .mono { font-family: monospace; font-size: 12px; word-break: break-all; }\n    .warn { color: #7A4E00; }\n  \`\n})\nclass App {\n  protected readonly untrusted = untrusted;\n  protected readonly url = signal('javascript:alert(1)');\n\n  // an allow-list, not a deny-list\n  protected readonly safeUrl = computed(() =>\n    /^https?:\\/\\//i.test(this.url()) ? this.url() : null\n  );\n}`,
    anno:[
      ['{{ value }}','Escaped. There is no way to make interpolation execute markup, which is why the overwhelming majority of Angular templates are safe by construction.'],
      ['[innerHTML]="value"','Sanitised, not escaped: markup is kept, scripts and event handlers are removed. Angular also logs a warning in development when it strips something.'],
      ['DomSanitizer.bypassSecurityTrustHtml(v)','The opt-out, named to make you think. Only ever call it on a value you produced or sanitised yourself, and never on something a user or a third-party API supplied.'],
      ['Security contexts','HTML, STYLE, SCRIPT, URL, and RESOURCE_URL. Angular sanitises the first four; `RESOURCE_URL`, as in an iframe `src`, cannot be sanitised at all and must be bypassed explicitly, which is the loudest possible hint to validate it yourself.'],
      ['An allow-list for URLs','Check the scheme against `http` and `https`. A deny-list of `javascript:` misses `data:`, `vbscript:`, and whatever comes next.'],
      ['ngCspNonce','Lets Angular\u2019s inline styles work under a strict Content-Security-Policy, so a successful injection has nowhere to go.'],
      ['Client-side secrets','Anything the browser can read is public. A key in a build-time environment file ships in the bundle regardless of what it is called.'],
      ['Stay patched','The three CVEs disclosed in late 2025, covering SSR data leakage, XSRF token exposure, and stored XSS, were fixed in the supported majors only. An end-of-life version does not get the fix.']
    ],
    mistakes:[
      ['bypassSecurityTrustHtml on user content','','The classic Angular XSS. If the content comes from a user, a CMS, or an API you do not own, sanitise it with something like DOMPurify, or render structured data rather than HTML.'],
      ['Trusting a deny-list of URL schemes','','Blocking `javascript:` and nothing else leaves `data:`, which can carry a whole HTML document. Allow-list instead.'],
      ['Session tokens in localStorage','','Any XSS on the page can read them. An httpOnly cookie cannot be read by JavaScript, which is the entire point of it.'],
      ['Assuming the client can enforce a rule','','Hidden fields, disabled buttons, and role checks in the UI are conveniences. Every one of them must be re-checked on the server.']
    ],
    ex:{
      task:'Render a CMS field that legitimately contains HTML, as safely as possible, and write down what you would put in place around it.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<div [innerHTML]="fromCms"></div>\`\n})\nclass App {\n  protected readonly fromCms = '<p>Copy with <b>markup</b>.</p>';\n}`,
      sol:`// What goes around this in a real application:\n//   1. sanitise on the way IN, on the server, when the CMS field is saved,\n//      with an allow-list of tags and attributes (DOMPurify or equivalent);\n//   2. keep Angular's own sanitiser on the way out, which means binding to\n//      [innerHTML] and never calling bypassSecurityTrustHtml;\n//   3. a Content-Security-Policy with no unsafe-inline, so an injection that\n//      gets through has nowhere to execute;\n//   4. session tokens in httpOnly cookies, so an XSS cannot read them;\n//   5. prefer structured data over HTML wherever the design allows it.\n\ninterface Block { kind: 'text' | 'html' | 'link'; value: string; label?: string }\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    @for (b of blocks; track b.value) {\n      @switch (b.kind) {\n        <!-- structured content: escaped, and nothing can go wrong -->\n        @case ('text') { <p>{{ b.value }}</p> }\n\n        <!-- genuinely HTML: Angular sanitises, and we never bypass -->\n        @case ('html') { <div [innerHTML]="b.value"></div> }\n\n        <!-- a URL: allow-listed scheme, and a safe rel -->\n        @case ('link') {\n          @if (safe(b.value); as href) {\n            <p><a [href]="href" rel="noreferrer noopener">{{ b.label ?? href }}</a></p>\n          } @else {\n            <p class="warn">A link was blocked.</p>\n          }\n        }\n      }\n    }\n  \`,\n  styles: \`.warn { color: #7A4E00; font-size: 12px; }\`\n})\nclass App {\n  protected readonly blocks: Block[] = [\n    { kind: 'text', value: 'A heading the editor typed, with <b>no</b> markup allowed.' },\n    { kind: 'html', value: '<p>Rich copy with <b>bold</b> and an <img src=x onerror="alert(1)"> attempt.</p>' },\n    { kind: 'link', value: 'https://angular.dev', label: 'the docs' },\n    { kind: 'link', value: 'javascript:alert(1)' }\n  ];\n\n  protected safe(url: string) {\n    return /^https?:\\/\\//i.test(url) ? url : null;\n  }\n}`,
      why:'The design decision that does the most work is the `kind` discriminator: most CMS content is text or a link, and only some of it is genuinely HTML, so the majority of the page never goes near a sanitiser. Where HTML is unavoidable, the value is bound to `[innerHTML]` and never bypassed, so Angular strips the `onerror` even though the bold survives, which you can see by running it. Links are allow-listed by scheme, so the `javascript:` block renders as a refusal rather than a working attack. Sanitising on the way in as well as on the way out is defence in depth: the input sanitiser can be more restrictive because it knows the editorial rules, and Angular\u2019s output sanitiser catches anything that predates it in the database.'
    },
    mm:'Interpolation is escaped and innerHTML is sanitised, so every Angular XSS is somewhere a developer opted out or trusted a URL.'
  }
  ]
});

COURSE.push({
  id:'m6', dir:'06-shipping', t:'Modern Angular and shipping', lvl:'Hard',
  lessons:[
  {
    id:'44', file:'ngmodules.ts', t:'NgModules: what they were, why standalone won',
    what:[
      'An `@NgModule` was a container that declared which components belonged to it, which other modules it imported, what it exported for others, and which providers it contributed.',
      'Standalone components made it unnecessary: a component declares its own `imports` array. Standalone has been the default since v19, and `standalone: true` is no longer written.'
    ],
    why:[
      'A module was a second place to declare something the component already knew. You wrote the component, then remembered to add it to `declarations`, then remembered to `export` it, then imported the module somewhere else. Three chances to get it wrong for information the component already contained.',
      'It also made lazy loading harder than it needed to be. The unit of laziness was a module, so splitting off one screen meant inventing a module for it, and the compiler could not see which dependencies a single component actually used.',
      'You still need to read them, because a large amount of Angular code and many libraries are module-based, and because the interop goes both ways: a standalone component can import an NgModule, and a module can import a standalone component.'
    ],
    code:`// What a module-based app looked like, for recognition:\n//\n//   @NgModule({\n//     declarations: [UserList, UserDetail, HighlightDirective],  // yours\n//     imports: [CommonModule, RouterModule.forChild(routes)],     // other modules\n//     exports: [UserList],                                        // visible outside\n//     providers: [UsersApi]\n//   })\n//   export class UsersModule {}\n//\n//   platformBrowserDynamic().bootstrapModule(AppModule);\n//\n// The same thing today: no module, and each component states what it uses.\n\n@Component({\n  selector: 'app-user-row',\n  template: \`<li>{{ name() }}</li>\`\n})\nclass UserRow {\n  readonly name = input.required<string>();\n}\n\n@Component({\n  selector: 'app-root',\n  imports: [UserRow, DatePipe],        // exactly what this template uses\n  template: \`\n    <ul>@for (n of names; track n) { <app-user-row [name]="n" /> }</ul>\n    <p>rendered at {{ now | date: 'mediumTime' }}</p>\n    <table>\n      <tr><th>NgModule</th><th>Standalone</th></tr>\n      @for (r of mapping; track r.old) {\n        <tr><td><code>{{ r.old }}</code></td><td><code>{{ r.new }}</code></td></tr>\n      }\n    </table>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; margin-top: 8px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; }\n  \`\n})\nclass App {\n  protected readonly names = ['Ada', 'Grace', 'Alan'];\n  protected readonly now = new Date();\n\n  protected readonly mapping = [\n    { old: 'declarations', new: 'nothing: a component declares itself' },\n    { old: 'imports', new: 'imports on the component that uses them' },\n    { old: 'exports', new: 'nothing: export the class from its file' },\n    { old: 'providers', new: 'bootstrap providers, route providers, or providedIn' },\n    { old: 'bootstrapModule(AppModule)', new: 'bootstrapApplication(App, { providers })' },\n    { old: 'RouterModule.forRoot(routes)', new: 'provideRouter(routes)' },\n    { old: 'HttpClientModule', new: 'nothing since v21; provideHttpClient() to configure' },\n    { old: 'BrowserAnimationsModule', new: 'provideAnimationsAsync()' },\n    { old: 'loadChildren: () => SomeModule', new: 'loadComponent, or loadChildren of a routes array' }\n  ];\n}`,
    anno:[
      ['declarations','Where your own components, directives and pipes were registered. Standalone components need no equivalent: being imported is the declaration.'],
      ['exports','A module\u2019s public surface. Now an ordinary TypeScript export, which is one fewer concept and searchable by your editor.'],
      ['imports on a component','Only what this template uses. The compiler can therefore see the real dependency graph, which is what makes fine-grained lazy loading possible.'],
      ['importProvidersFrom(SomeModule)','The bridge when a library only ships an NgModule of providers, so you can use it from `bootstrapApplication`. Prefer a `provideX()` function when the library offers one.'],
      ['A standalone component in a module','Add it to that module\u2019s `imports`, not its `declarations`. This is how you migrate a codebase one component at a time.'],
      ['ng generate @angular/core:standalone','A three-step migration: convert components, remove the modules, then switch the bootstrap. It does most of the work mechanically.'],
      ['CommonModule','Now rarely needed: the control flow blocks are built in, and pipes are imported individually. v21 added a migration to convert `CommonModule` imports to the individual directives and pipes.']
    ],
    mistakes:[
      ['Following a tutorial with app.module.ts','','It predates v15, and every other decision in it will be dated too: `*ngIf`, constructor injection, `HttpClientModule`, `@Input()`. Check the date before the content.'],
      ['Writing standalone: true','','Redundant since v19 and removed from generated code. Harmless, and a tell that the file has not been touched in a while.'],
      ['Importing a whole module for one pipe','','`CommonModule` brings everything. Import `DatePipe` or `DecimalPipe` directly so the dependency is honest.'],
      ['Recreating modules as "barrel" imports','','A file that re-exports twenty components rebuilds the problem: everything that touches one thing depends on all twenty, and tree-shaking suffers.']
    ],
    ex:{
      task:'Convert a module-based feature to standalone: say what happens to each key of the NgModule and what the route table becomes.',
      start:`@Component({\n  selector: 'app-root',\n  template: \`<p>your code</p>\`\n})\nclass App {}`,
      sol:`// BEFORE\n//   @NgModule({\n//     declarations: [InvoiceList, InvoiceDetail, CurrencyCellDirective],\n//     imports: [CommonModule, ReactiveFormsModule, RouterModule.forChild(routes)],\n//     exports: [InvoiceList],\n//     providers: [InvoicesApi]\n//   })\n//   export class InvoicesModule {}\n//\n//   // app.routes.ts\n//   { path: 'invoices', loadChildren: () => import('./invoices/invoices.module')\n//       .then(m => m.InvoicesModule) }\n//\n// AFTER\n//   // invoice-list.ts\n//   @Component({\n//     selector: 'app-invoice-list',\n//     imports: [CurrencyCellDirective, DecimalPipe],   // only what the template uses\n//     template: \\\`...\\\`\n//   })\n//   export class InvoiceList {}\n//\n//   // invoices-api.ts\n//   @Service()                                          // was a module provider\n//   export class InvoicesApi {}\n//\n//   // invoices.routes.ts\n//   export const invoicesRoutes: Routes = [\n//     { path: '', component: InvoiceList },\n//     { path: ':id', component: InvoiceDetail }\n//   ];\n//\n//   // app.routes.ts\n//   { path: 'invoices', loadChildren: () => import('./invoices/invoices.routes')\n//       .then(m => m.invoicesRoutes) }\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <table>\n      <tr><th>Was</th><th>Becomes</th></tr>\n      @for (r of steps; track r.was) {\n        <tr><td><code>{{ r.was }}</code></td><td>{{ r.becomes }}</td></tr>\n      }\n    </table>\n    <p><small>The route now lazy-loads an array of routes rather than a module.</small></p>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; vertical-align: top; }\n  \`\n})\nclass App {\n  protected readonly steps = [\n    { was: 'declarations', becomes: 'deleted: each component imports what it needs' },\n    { was: 'imports: CommonModule', becomes: 'deleted: control flow is built in, pipes imported individually' },\n    { was: 'imports: ReactiveFormsModule', becomes: 'moved to the components that have forms' },\n    { was: 'imports: RouterModule.forChild', becomes: 'an exported Routes array' },\n    { was: 'exports: [InvoiceList]', becomes: 'an ordinary TypeScript export' },\n    { was: 'providers: [InvoicesApi]', becomes: '@Service(), or route providers to scope it to the feature' },\n    { was: 'loadChildren of a module', becomes: 'loadChildren of a routes array, or loadComponent' }\n  ];\n}`,
      why:'Every key of the module has a home, and most of them are "delete it". The interesting one is `providers`: moving `InvoicesApi` to `@Service()` makes it a root singleton, which is usually right, but if it holds feature state you want discarded when the user leaves, route-level `providers` is the better target and gives you a lifetime the module never actually provided. The other detail worth noticing is that `loadChildren` still exists and now points at a routes array rather than a module, so the lazy boundary survives the migration unchanged; people often assume standalone means giving up module-level lazy loading, and it does not. Run `ng generate @angular/core:standalone` before doing any of this by hand.'
    },
    mm:'A module was a second place to declare what a component already knew, so standalone deleted the concept and kept the lazy boundary.'
  },
  {
    id:'45', file:'zonejs.ts', t:'Zone.js: what it did and why it is gone',
    what:[
      'Zone.js patched the browser: `setTimeout`, `addEventListener`, `Promise`, `XMLHttpRequest` and dozens more. Every patched callback told Angular that something might have changed, and Angular ran change detection over the whole application.',
      'Applications are zoneless by default since v21. `provideZoneChangeDetection()` brings it back, and the v21 migration adds that call to existing apps.'
    ],
    why:[
      'It solved a real problem elegantly: you could mutate any field from any callback and the screen updated, with no annotations and no reactive primitives. That is why Angular felt effortless for years.',
      'The costs accumulated. It shipped a large polyfill, patched APIs in ways that confused debuggers and other libraries, ran change detection far more often than necessary, and made tests depend on a global notion of "settled" that produced the flakiness everyone remembers as `fakeAsync`.',
      'Signals removed the need. A signal tells Angular precisely which views depend on it, so the framework no longer has to guess from the fact that a timer fired. What you lose is the free update of a plain field mutated asynchronously, which is the one behavioural difference that matters in a migration.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p><strong>What Zone.js used to do for you, and what does it now:</strong></p>\n    <table>\n      <tr><th>Cause of a change</th><th>Under Zone.js</th><th>Zoneless</th></tr>\n      @for (r of rows; track r.cause) {\n        <tr>\n          <td>{{ r.cause }}</td>\n          <td>{{ r.zone }}</td>\n          <td>{{ r.zoneless }}</td>\n        </tr>\n      }\n    </table>\n\n    <p>Live: a plain field and a signal, both changed from a setTimeout.</p>\n    <p>plain field: {{ plain }} \u2014 signal: {{ sig() }}</p>\n    <button (click)="bump()">Change both after 400ms</button>\n    <p><small>Only the signal moves. Both values really changed.</small></p>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; vertical-align: top; }\n  \`\n})\nclass App {\n  protected plain = 0;\n  protected readonly sig = signal(0);\n\n  protected bump() {\n    setTimeout(() => { this.plain++; this.sig.update(n => n + 1); }, 400);\n  }\n\n  protected readonly rows = [\n    { cause: 'a template event, (click)', zone: 'full app check', zoneless: 'marks that view: still works' },\n    { cause: 'a signal write', zone: 'full app check', zoneless: 'marks the views that read it' },\n    { cause: 'an input change', zone: 'full app check', zoneless: 'marks the child: still works' },\n    { cause: 'setTimeout mutating a field', zone: 'full app check', zoneless: 'nothing happens' },\n    { cause: 'a promise resolving into a field', zone: 'full app check', zoneless: 'nothing happens' },\n    { cause: 'a native addEventListener handler', zone: 'full app check', zoneless: 'nothing happens' },\n    { cause: 'an async pipe emitting', zone: 'full app check', zoneless: 'marks that view: still works' }\n  ];\n}`,
    anno:[
      ['provideZoneChangeDetection()','What you add to go back. The v21 migration adds it automatically, which is why upgrading did not break existing applications.'],
      ['NgZone.runOutsideAngular(fn)','The old escape hatch: run something without triggering change detection, for animation loops and high-frequency events. Meaningless in a zoneless app, and a marker of Zone-era code.'],
      ['zone.js in polyfills','A zoneless project does not include it at all, which is a measurable bundle saving as well as one fewer thing patching your runtime.'],
      ['What still triggers a pass','Template events, signal writes, input changes, `markForCheck`, and the async pipe. Everything else is now your responsibility, which in practice means "put it in a signal".'],
      ['fakeAsync','Depends on a patched Zone.js, so it does not work in a zoneless Vitest setup. v22 added `zone.js/plugins/vitest-patch` as a migration aid; the destination is fake timers.'],
      ['onpush_zoneless_migration','A tool in the CLI\u2019s MCP server, added in v21, that analyses a codebase and produces a step-by-step plan for moving to OnPush and zoneless.'],
      ['Third-party widgets','A non-Angular library mutating fields in its callbacks used to update the screen by accident. Zoneless means you wrap the callback and write to a signal.']
    ],
    mistakes:[
      ['Assuming a zoneless app is broken when a value does not appear','','It is behaving as designed. The value changed and nothing marked the view. Put it in a signal, which is the fix in almost every case.'],
      ['Sprinkling markForCheck to fix it','','It works and encodes knowledge of change detection into components that should only know about their own data. Reach for it when integrating a third-party library, not as a habit.'],
      ['Keeping Zone.js because tests use fakeAsync','','A legitimate reason to stage the migration, and not a reason to stop. Migrate the application, then the tests, using the v22 Vitest zone patch in between.'],
      ['Migrating to zoneless without OnPush first','','The two go together, and the order that hurts less is OnPush by component, then zoneless once the tree is honest about what marks it.']
    ],
    ex:{
      task:'Integrate a fake third-party widget that reports changes through a callback, so that a zoneless application updates correctly. Then say what you would have written under Zone.js.',
      start:`// a "library" that knows nothing about Angular\nfunction createTicker(onTick: (n: number) => void) {\n  let n = 0;\n  const id = setInterval(() => onTick(++n), 500);\n  return { stop: () => clearInterval(id) };\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`<p>ticks: {{ ticks }}</p>\`\n})\nclass App {\n  protected ticks = 0;\n}`,
      sol:`function createTicker(onTick: (n: number) => void) {\n  let n = 0;\n  const id = setInterval(() => onTick(++n), 500);\n  return { stop: () => clearInterval(id) };\n}\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p>ticks: {{ ticks() }} (a signal, so the view is marked)</p>\n    <p>doubled: {{ doubled() }} (derived, and free)</p>\n    <p><small>\n      Under Zone.js this worked with a plain field, because the patched\n      setInterval triggered a full application check on every tick.\n    </small></p>\n  \`\n})\nclass App {\n  // the boundary: the library's callback writes into a signal\n  protected readonly ticks = signal(0);\n  protected readonly doubled = computed(() => this.ticks() * 2);\n\n  private readonly destroyRef = inject(DestroyRef);\n\n  constructor() {\n    const ticker = createTicker(n => this.ticks.set(n));\n    this.destroyRef.onDestroy(() => ticker.stop());\n  }\n}`,
      why:'One line does the work: the callback writes to a signal instead of a field, so the library\u2019s ignorance of Angular stops mattering. Everything downstream is then ordinary reactive code, and the `computed` costs nothing extra. The comparison is the lesson: under Zone.js the plain-field version worked, but it worked by checking the entire application twice a second whether or not anything had changed, which is the trade the framework has now stopped making on your behalf. Note the `DestroyRef` teardown: Zone.js never helped with that, and a widget that keeps ticking after its component is gone is a leak in either world.'
    },
    mm:'Zone.js guessed that something changed by patching the browser; signals say so precisely, which is why it is gone and why async field mutations no longer update.'
  },
  {
    id:'46', file:'migrating-to-signals.ts', t:'Migrating a codebase to signals',
    what:[
      'Angular ships schematics for most of the mechanical work: converting `@Input()` to `input()`, `@Output()` to `output()`, `@ViewChild` to `viewChild()`, `*ngIf` to `@if`, `NgClass` to class bindings, and `CommonModule` imports to individual ones.',
      'What the schematics cannot do is redesign your state. Turning a `BehaviorSubject` service into signals, or an `ngOnChanges` into a `computed`, is a decision rather than a transformation.'
    ],
    why:[
      'A large Angular codebase has three overlapping generations in it, and a rewrite is not on the table. The migrations exist so that the boring 80% is a command rather than a quarter of someone\u2019s time.',
      'The order matters. Control flow and standalone first, because they are purely mechanical and unlock the rest. Then inputs, outputs and queries, which change types and so surface real errors. Then OnPush and zoneless, which change behaviour. Then state, which changes design.',
      'The reason to do it at all is not fashion. Signals plus OnPush plus zoneless is measurably less work per interaction, the types are better, and the new APIs, resources and Signal Forms, are only available in that world.'
    ],
    code:`@Component({\n  selector: 'app-root',\n  template: \`\n    <p><strong>What a command can do, and what it cannot:</strong></p>\n    <table>\n      <tr><th>Step</th><th>How</th><th>Risk</th></tr>\n      @for (s of plan; track s.step) {\n        <tr>\n          <td>{{ s.step }}</td>\n          <td><code>{{ s.how }}</code></td>\n          <td [class.manual]="s.risk !== 'mechanical'">{{ s.risk }}</td>\n        </tr>\n      }\n    </table>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; vertical-align: top; }\n    .manual { color: #7A4E00; }\n  \`\n})\nclass App {\n  protected readonly plan = [\n    { step: '1. Upgrade one major at a time',\n      how: 'ng update @angular/core@N @angular/cli@N',\n      risk: 'mechanical' },\n    { step: '2. Built-in control flow',\n      how: 'ng g @angular/core:control-flow',\n      risk: 'mechanical' },\n    { step: '3. Standalone components',\n      how: 'ng g @angular/core:standalone',\n      risk: 'mechanical, three passes' },\n    { step: '4. class and style bindings',\n      how: 'ng g @angular/core:ngclass-to-class-migration',\n      risk: 'mechanical' },\n    { step: '5. Drop CommonModule',\n      how: 'ng g @angular/core:common-to-standalone',\n      risk: 'mechanical' },\n    { step: '6. Signal inputs, outputs, queries',\n      how: 'ng g @angular/core:signal-input-migration',\n      risk: 'types change: expect real errors' },\n    { step: '7. OnPush, then zoneless',\n      how: 'the onpush_zoneless_migration MCP tool, then remove zone.js',\n      risk: 'behaviour changes: needs testing' },\n    { step: '8. Services to signals',\n      how: 'by hand, feature by feature',\n      risk: 'design decision, not a transformation' },\n    { step: '9. Data fetching to resources',\n      how: 'by hand, screen by screen',\n      risk: 'design decision' },\n    { step: '10. Forms to Signal Forms',\n      how: 'by hand, new forms first',\n      risk: 'a rewrite per form' }\n  ];\n}`,
    anno:[
      ['ng update','Runs the schematics between adjacent majors, which is why skipping versions is expensive: those transformations never ran and you inherit their work.'],
      ['signal-input-migration','Converts `@Input()` fields to `input()`, including updating every read to a call. Expect compile errors afterwards where code read an input before it was set.'],
      ['signal-queries-migration and output-migration','The matching schematics for queries and outputs. Run them separately so each diff is reviewable.'],
      ['Review every diff','A migration is a large mechanical change. Reading it is how you find the three places where the assumption did not hold.'],
      ['onpush_zoneless_migration','A CLI MCP tool from v21 that analyses the codebase, points at the Zone.js dependencies, and produces a staged plan rather than a patch.'],
      ['BehaviorSubject to signal','The highest-value manual change: a signal removes the subscription, the initial-value ceremony, and the lifetime management from every reader.'],
      ['ngOnChanges to computed','The second: a derivation expressed as a hook costs a field, a render, and a moment of inconsistency.'],
      ['Leave working RxJS alone','A tested pipeline using `switchMap` and `retry` well is not a defect. Bridge it with `toSignal` at the component boundary and spend the effort where state is kept in streams.']
    ],
    mistakes:[
      ['Skipping majors to catch up faster','','The schematics only know how to move between adjacent versions, so a jump means doing their work by hand, in the dark, all at once.'],
      ['Running every migration in one commit','','An unreviewable diff across a thousand files. One schematic, one commit, one review.'],
      ['Migrating state before behaviour','','Converting services to signals while components still rely on Zone.js hides which components were actually broken. Get the tree honest first.'],
      ['Rewriting every form because Signal Forms exist','','A large app has hundreds. New forms in the new API, and old ones when you are already changing them; v22\u2019s compatibility work exists to make coexistence possible.']
    ],
    ex:{
      task:'Convert a decorator-era component to modern Angular by hand, and mark which of your changes a schematic would have made.',
      start:`@Component({\n  selector: 'app-old',\n  template: \`\n    <div *ngIf="user" [ngClass]="{ admin: user.admin }">\n      {{ label }}\n    </div>\n  \`,\n  changeDetection: ChangeDetectionStrategy.OnPush\n})\nclass Old implements OnChanges, OnDestroy {\n  @Input() user!: { name: string; admin: boolean } | null;\n  @Output() picked = new EventEmitter<string>();\n  @ViewChild('box') box!: ElementRef;\n\n  label = '';\n  private sub = new Subscription();\n\n  ngOnChanges() {\n    this.label = this.user ? this.user.name.toUpperCase() : 'nobody';\n  }\n\n  ngOnDestroy() {\n    this.sub.unsubscribe();\n  }\n}`,
      sol:`@Component({\n  selector: 'app-root',\n  template: \`\n    <!-- (schematic: control-flow) -->\n    @if (user(); as u) {\n      <!-- (schematic: ngclass-to-class) -->\n      <div [class.admin]="u.admin" #box>{{ label() }}</div>\n    }\n    <button (click)="picked.emit(label())">Pick</button>\n  \`\n  // changeDetection removed: OnPush is the default since v22 (by hand)\n})\nclass App {\n  // (schematic: signal-input-migration)\n  readonly user = input<{ name: string; admin: boolean } | null>(null);\n\n  // (schematic: output-migration)\n  readonly picked = output<string>();\n\n  // (schematic: signal-queries-migration)\n  private readonly box = viewChild<ElementRef<HTMLElement>>('box');\n\n  // BY HAND: ngOnChanges was a derivation, so it becomes a computed\n  protected readonly label = computed(() => {\n    const u = this.user();\n    return u ? u.name.toUpperCase() : 'nobody';\n  });\n\n  // BY HAND: the Subscription and ngOnDestroy disappear entirely, because\n  // whatever it was subscribing to should now be a signal or use\n  // takeUntilDestroyed() / DestroyRef.\n  private readonly destroyRef = inject(DestroyRef);\n\n  constructor() {\n    this.destroyRef.onDestroy(() => { /* nothing left to clean up */ });\n  }\n}`,
      why:'Five of the seven changes are a command: control flow, the class binding, the input, the output, and the query. Two are decisions. The `ngOnChanges` becomes a `computed`, which is the highest-value manual change in any migration, because it deletes a field, a hook, and the window where the label disagreed with the user. The `Subscription` plus `ngOnDestroy` pattern disappears rather than being converted, which is the pattern to look for: if the thing being subscribed to becomes a signal there is nothing to unsubscribe, and where an observable genuinely remains, `takeUntilDestroyed()` replaces the field. Note that removing `changeDetection: OnPush` is safe only on v22, where it is the default; on v21 removing it would silently switch the component back to checking on every pass.'
    },
    mm:'Run the schematics for the mechanical 80%, then convert state by hand feature by feature, and never skip a major version.'
  },
  {
    id:'47', file:'material-cdk.ts', t:'Angular Material, the CDK, and aria',
    what:[
      'Three first-party packages, at three levels. Angular Material is a styled component library implementing Material Design. The CDK is the unstyled behaviour underneath it. `@angular/aria`, generally available since v22, is a set of headless directives for ARIA patterns.',
      'You can use any of them without the others, and which one you want depends on how much of the appearance you intend to own.'
    ],
    why:[
      'The behaviour in these widgets is where the time goes. An accessible overlay needs positioning, scroll blocking, focus trapping, and an escape hatch for the document click; a data table needs sorting, paging, and virtual scrolling. None of that is visual, all of it is fiddly, and all of it has been done.',
      'Material is the fastest route to a working application and the slowest route to a distinctive one, because you are adopting a design language along with the behaviour. Theming can take you a long way, and fighting it past a point is a known trap.',
      'The CDK and the aria package exist precisely for teams with their own design system: take the overlay, the focus trap, the tree keyboard handling, and the ARIA wiring, and write your own markup and CSS. That is the combination most product teams should reach for.'
    ],
    code:`// None of these packages are in this page's import map, so the snippet\n// below is a decision table rather than a demo. The imports look like:\n//\n//   import { MatButtonModule } from '@angular/material/button';\n//   import { Overlay, OverlayModule } from '@angular/cdk/overlay';\n//   import { CdkTrapFocus, LiveAnnouncer } from '@angular/cdk/a11y';\n//   import { CdkVirtualScrollViewport } from '@angular/cdk/scrolling';\n//   import { Menu, Tabs, ComboBox } from '@angular/aria';\n\n@Component({\n  selector: 'app-root',\n  template: \`\n    <p><strong>Which package do you want?</strong></p>\n    <table>\n      <tr><th>You want</th><th>Reach for</th><th>You still own</th></tr>\n      @for (r of guide; track r.want) {\n        <tr><td>{{ r.want }}</td><td><code>{{ r.pick }}</code></td><td>{{ r.own }}</td></tr>\n      }\n    </table>\n\n    <p><strong>CDK pieces worth knowing by name:</strong></p>\n    <ul>\n      @for (p of cdk; track p.name) {\n        <li><code>{{ p.name }}</code> \u2014 {{ p.what }}</li>\n      }\n    </ul>\n  \`,\n  styles: \`\n    table { border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }\n    td, th { border: 1px solid #CFCCD6; padding: 3px 7px; text-align: left; vertical-align: top; }\n    li { font-size: 13px; margin-bottom: 3px; }\n  \`\n})\nclass App {\n  protected readonly guide = [\n    { want: 'A working app quickly, Material look acceptable', pick: '@angular/material', own: 'theming and layout' },\n    { want: 'Your own design system', pick: '@angular/cdk + @angular/aria', own: 'all markup and CSS' },\n    { want: 'One accessible widget, nothing else', pick: '@angular/aria', own: 'markup, CSS, and composition' },\n    { want: 'Only an overlay or a focus trap', pick: '@angular/cdk', own: 'everything visual' },\n    { want: 'A charting or grid feature Angular does not ship', pick: 'a third party', own: 'the upgrade risk' }\n  ];\n\n  protected readonly cdk = [\n    { name: 'cdk/overlay', what: 'positioned, scroll-aware panels: the basis of every menu and dialog' },\n    { name: 'cdk/a11y', what: 'FocusTrap, FocusMonitor, LiveAnnouncer, and the roving tabindex helpers' },\n    { name: 'cdk/scrolling', what: 'virtual scrolling for very long lists' },\n    { name: 'cdk/drag-drop', what: 'dragging, sorting, and drop lists' },\n    { name: 'cdk/portal', what: 'rendering a template or component somewhere else in the DOM' },\n    { name: 'cdk/table', what: 'the unstyled data table Material\\u2019s table is built on' },\n    { name: 'cdk/testing', what: 'component harnesses, so tests drive a widget through an API' }\n  ];\n}`,
    anno:[
      ['@angular/material','Components with Material Design applied. Theming is via CSS custom properties and Sass; the components are built on the CDK, so anything Material can do you can do yourself.'],
      ['@angular/cdk','Behaviour without appearance. The overlay and a11y packages are worth knowing even if you never install Material.'],
      ['@angular/aria','Headless directives for the ARIA patterns: Accordion, Autocomplete, ComboBox, Grid, ListBox, Menu, Multiselect, Select, Tabs, Toolbar, Tree. Developer preview in v21, generally available in v22, and updated in v22 to work with signal forms.'],
      ['Component harnesses','From `cdk/testing`. A test drives a date picker through its harness rather than through its DOM, so the test survives an internal change to the widget.'],
      ['LiveAnnouncer','Announces a message to assistive technology imperatively, for the cases where a `role="status"` region is awkward.'],
      ['Versioning','Material and the CDK track Angular\u2019s majors exactly, so they upgrade with `ng update`. A lagging third-party library is the most common upgrade blocker.'],
      ['Theming versus fighting','Material can be themed a long way. If you find yourself overriding internal selectors, that is the signal to drop to the CDK instead.']
    ],
    mistakes:[
      ['Installing Material for one button','','You have adopted a design language and a large dependency. Style your own button, and take the CDK if you need behaviour.'],
      ['Overriding Material internals with ::ng-deep','','It breaks on the next minor release. Theme through the supported API, or use the CDK and own the markup.'],
