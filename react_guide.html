<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React, end to end</title>
<!--
  A self-contained React course. One file, no build step.

  IMPORTANT, and said once so it is never mistaken for advice:
  this page transpiles JSX in the browser with @babel/standalone.
  That is a LEARNING-ONLY setup. It ships a compiler to the user and
  compiles on every run. In a real project you compile ahead of time
  with Vite, Next.js, or similar. Never do this in production.

  React is pinned to 19.2.8 (latest 19.x patch). React 19 removed the
  UMD builds, so React is loaded as ES modules through an import map.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --paper:#EDEFE9;
  --raise:#FBFCFA;
  --ink:#17211D;
  --ink-2:#4E5A54;
  --rule:#C7CDC3;
  --pine:#2F6B57;
  --pine-wash:#E3EBE6;
  --ochre:#8C5A12;
  --ochre-wash:#F4EEE1;
  --ochre-ink:#5E3C08;
  --slab:#141C19;
  --slab-2:#0F1614;
  --slab-ink:#DFE7E1;
  --slab-rule:#2C3A34;

  --f-ui:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;
  --f-prose:Literata,Georgia,"Times New Roman",serif;
  --f-code:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --s-12:.706rem; --s-14:.824rem; --s-16:.941rem; --s-17:1rem;
  --s-20:1.176rem; --s-24:1.412rem; --s-28:1.647rem; --s-36:2.118rem;

  --bar:56px;
  --nav-w:298px;
}
*{box-sizing:border-box}
html{font-size:17px}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 var(--s-17)/1.65 var(--f-prose);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-ui);font-weight:600;line-height:1.2;margin:0}
p{margin:0 0 .8em}
p:last-child{margin-bottom:0}
a{color:var(--pine);text-underline-offset:3px}
code{font:400 .88em/1.5 var(--f-code)}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:1px}
::selection{background:var(--pine-wash)}

.skip{position:absolute;left:-9999px;top:0;z-index:99;background:var(--pine);color:#fff;
  padding:8px 14px;font:600 var(--s-14) var(--f-ui)}
.skip:focus{left:8px;top:8px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;height:var(--bar);
  display:flex;align-items:center;gap:14px;padding:0 16px;
  background:var(--paper);border-bottom:1px solid var(--rule);
}
.brand{font:800 var(--s-16) var(--f-ui);letter-spacing:-.015em;white-space:nowrap;margin-right:2px;
  overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.brand span{color:var(--pine)}
.tabs{display:flex;gap:2px;margin-left:auto;flex:0 0 auto}
.tab{
  font:600 var(--s-14) var(--f-ui);color:var(--ink-2);background:none;border:0;
  padding:7px 11px;border-radius:2px;cursor:pointer;white-space:nowrap;
}
.tab:hover{color:var(--ink);background:var(--pine-wash)}
.tab[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--pine)}
.find{
  font:400 var(--s-14) var(--f-ui);color:var(--ink);
  background:var(--raise);border:1px solid var(--rule);border-radius:2px;
  padding:6px 9px;width:180px;
}
.find::placeholder{color:var(--ink-2)}
.find{flex:0 1 180px;min-width:0}
.drawer-btn .short{display:none}
.drawer-btn{
  display:none;font:600 var(--s-14) var(--f-ui);background:none;
  border:1px solid var(--rule);border-radius:2px;padding:5px 9px;cursor:pointer;color:var(--ink);
}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr)}
.sidebar{
  border-right:1px solid var(--rule);
  height:calc(100vh - var(--bar));position:sticky;top:var(--bar);
  overflow-y:auto;overscroll-behavior:contain;padding:18px 0 60px;
}
.pane{min-width:0;padding:34px 30px 96px}
.pane-inner{max-width:1000px}

/* ---------- the spine ---------- */
.curric{position:relative}
.spine{position:absolute;left:16px;top:14px;bottom:14px;width:1px;background:var(--rule)}
.spine-fill{position:absolute;left:0;top:0;width:1px;background:var(--pine)}
.mod{margin:0 0 6px}
.mod-h{
  display:grid;grid-template-columns:33px 1fr;align-items:center;
  font-size:var(--s-14);font-weight:700;letter-spacing:-.01em;
  padding:14px 16px 8px 0;position:relative;
}
.mod-mark{width:9px;height:9px;background:var(--paper);border:1px solid var(--ink-2);justify-self:center}
.mod-h .lvl{font-weight:400;color:var(--ink-2);font-size:var(--s-12)}
.less{list-style:none;margin:0;padding:0}
.less-b{
  display:grid;grid-template-columns:33px 24px 1fr;align-items:baseline;gap:0;
  width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:5px 14px 5px 0;color:var(--ink);font:400 var(--s-14)/1.35 var(--f-ui);
  border-radius:0 2px 2px 0;
}
.less-b:hover{background:var(--pine-wash)}
.dot{
  width:7px;height:7px;border-radius:50%;background:var(--paper);
  border:1px solid var(--rule);justify-self:center;align-self:center;
}
.num{font:400 var(--s-12) var(--f-code);color:var(--ink-2);align-self:center}
.less-b .t{padding-top:1px}
.less-b.done .dot{background:var(--pine);border-color:var(--pine)}
.less-b.done .t{color:var(--ink-2)}
.less-b.here{background:var(--pine-wash)}
.less-b.here .t{font-weight:700}
.less-b.here .dot{background:var(--pine);border-color:var(--pine);box-shadow:0 0 0 3px var(--pine-wash)}
.less-b.here .num{color:var(--pine)}
.nav-empty{padding:16px;color:var(--ink-2);font:400 var(--s-14) var(--f-ui)}
.nav-count{padding:0 16px 10px 33px;font:400 var(--s-12) var(--f-code);color:var(--ink-2)}

/* ---------- lesson ---------- */
.where{font:400 var(--s-12) var(--f-code);color:var(--ink-2);margin:0 0 6px}
.lesson-h{font-size:var(--s-36);letter-spacing:-.03em;max-width:26ch;margin:0 0 30px;font-weight:700}
.sect{padding:22px 0;border-top:1px solid var(--rule)}
.sect > h3{
  font-size:var(--s-14);font-weight:600;color:var(--ink-2);
  margin:0 0 10px;letter-spacing:-.005em;
}
.sect > .body{min-width:0}
.sect p,.sect li{max-width:64ch}
@media (min-width:1080px){
  .sect{display:grid;grid-template-columns:132px minmax(0,1fr);gap:28px;align-items:start}
  .sect > h3{text-align:right;margin:2px 0 0;position:sticky;top:calc(var(--bar) + 16px)}
}
.sect.pin > h3{position:static}
.stress{font:italic 400 var(--s-20)/1.5 var(--f-prose);max-width:58ch;margin:0}

/* prose furniture */
.body ul{margin:0 0 .8em;padding-left:1.1em}
.body li{margin-bottom:.35em}
.tip{border-left:2px solid var(--pine);padding:2px 0 2px 14px;font-size:var(--s-16);color:var(--ink-2)}
.legacy{
  display:inline-block;font:600 var(--s-12) var(--f-ui);color:var(--ochre-ink);
  background:var(--ochre-wash);border:1px solid #E3D6BC;padding:1px 6px;border-radius:2px;
}

/* code, static */
pre.code{
  margin:0 0 12px;background:var(--slab);color:var(--slab-ink);
  padding:13px 15px;border-radius:2px;overflow-x:auto;
  font:400 13px/1.65 var(--f-code);tab-size:2;
}
pre.code b{color:#8FD3B6;font-weight:400}

/* annotated walkthrough */
.anno{margin:0}
.anno > div{padding:10px 0;border-bottom:1px dotted var(--rule);min-width:0}
.anno > div:last-child{border-bottom:0}
.anno dt{
  font:400 12.5px/1.6 var(--f-code);background:#E3E6DF;color:var(--ink);
  padding:4px 8px;border-radius:2px;display:block;width:fit-content;max-width:100%;
  overflow-x:auto;white-space:pre;
}
.anno dd{margin:6px 0 0;font-size:var(--s-16);max-width:62ch}

/* mistakes */
.mistake{border-left:2px solid var(--ochre);padding-left:14px;margin-bottom:18px}
.mistake:last-child{margin-bottom:0}
.mistake h4{font-size:var(--s-16);font-weight:600;margin-bottom:6px}
.msg{
  display:block;font:400 12.5px/1.55 var(--f-code);
  background:var(--ochre-wash);color:var(--ochre-ink);
  padding:7px 9px;border-radius:2px;margin:7px 0;white-space:pre-wrap;
}
.mistake p{font-size:var(--s-16)}

/* exercise + solution */
.task{font-size:var(--s-16);margin-bottom:12px}
details.sol{border:1px solid var(--rule);border-radius:2px;background:var(--raise);margin-top:12px}
details.sol > summary{
  cursor:pointer;padding:9px 13px;font:600 var(--s-14) var(--f-ui);color:var(--pine);
  list-style:none;
}
details.sol > summary::-webkit-details-marker{display:none}
details.sol > summary::before{content:"+ ";font-family:var(--f-code)}
details.sol[open] > summary::before{content:"– "}
details.sol > summary:hover{background:var(--pine-wash)}
.sol-body{padding:2px 13px 14px;font-size:var(--s-16)}
.sol-body p{max-width:62ch}

/* ---------- playground ---------- */
.pg{border:1px solid var(--slab-rule);border-radius:2px;overflow:hidden;background:var(--slab);margin:0}
.pg-bar{
  display:flex;align-items:center;gap:7px;padding:7px 9px;
  background:var(--slab-2);border-bottom:1px solid var(--slab-rule);
}
.pg-bar .hint{margin-left:auto;font:400 var(--s-12) var(--f-code);color:#7C8C85}
.btn{
  font:600 var(--s-12) var(--f-ui);color:var(--slab-ink);background:transparent;
  border:1px solid var(--slab-rule);padding:4px 10px;border-radius:2px;cursor:pointer;
}
.btn:hover{background:#1E2B26}
.btn-run{background:var(--pine);border-color:var(--pine);color:#F2F7F4}
.btn-run:hover{background:#3A806A}
.pg-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pg-code{
  display:block;width:100%;min-height:210px;border:0;resize:vertical;
  background:var(--slab);color:var(--slab-ink);padding:13px 14px;
  font:400 13px/1.65 var(--f-code);tab-size:2;
}
.pg-code:focus{outline:2px solid var(--pine);outline-offset:-2px}
.pg-out{
  background:var(--raise);color:var(--ink);padding:13px 14px;overflow:auto;
  border-left:1px solid var(--slab-rule);
  font:400 var(--s-14)/1.5 var(--f-ui);min-height:210px;
}
.pg-err{
  margin:0;font:400 12.5px/1.55 var(--f-code);color:var(--ochre-ink);
  background:var(--ochre-wash);border-left:2px solid var(--ochre);
  padding:8px 10px;white-space:pre-wrap;
}
.pg-log{margin:0 0 10px;padding:8px 10px;background:#E9ECE6;border-radius:2px;
  font:400 12.5px/1.55 var(--f-code);white-space:pre-wrap}
.pg-out h1,.pg-out h2,.pg-out h3{font-size:var(--s-17);margin:0 0 6px}
.pg-out p{margin:0 0 .5em}
.pg-out button{
  font:600 var(--s-12) var(--f-ui);border:1px solid var(--rule);background:var(--paper);
  color:var(--ink);padding:4px 10px;border-radius:2px;cursor:pointer;margin:0 4px 4px 0;
}
.pg-out button:hover{background:var(--pine-wash)}
.pg-out input,.pg-out select,.pg-out textarea{
  font:400 var(--s-14) var(--f-ui);border:1px solid var(--rule);background:#fff;
  color:var(--ink);padding:4px 7px;border-radius:2px;margin:0 4px 4px 0;
}
.pg-out ul,.pg-out ol{margin:0 0 .5em;padding-left:1.2em}
.pg-out label{display:inline-block;margin:0 6px 4px 0}
@media (max-width:760px){
  .pg-cols{grid-template-columns:1fr}
  .pg-out{border-left:0;border-top:1px solid var(--slab-rule);min-height:130px}
}

/* ---------- foot nav ---------- */
.lesson-foot{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border-top:1px solid var(--rule);margin-top:26px;padding-top:18px;
}
.fbtn{
  font:600 var(--s-14) var(--f-ui);background:var(--raise);border:1px solid var(--rule);
  color:var(--ink);padding:7px 13px;border-radius:2px;cursor:pointer;
}
.fbtn:hover{background:var(--pine-wash)}
.fbtn[disabled]{opacity:.45;cursor:default}
.fbtn.mark{margin-right:auto;border-color:var(--pine);color:var(--pine)}
.fbtn.mark.on{background:var(--pine);border-color:var(--pine);color:#F2F7F4}

/* ---------- notices ---------- */
.notice{
  border:1px solid #E3D6BC;background:var(--ochre-wash);color:var(--ochre-ink);
  padding:11px 14px;border-radius:2px;font-size:var(--s-16);margin-bottom:24px;
}
.notice b{font-family:var(--f-ui)}
.pending{
  border:1px dashed var(--rule);padding:16px 18px;border-radius:2px;
  color:var(--ink-2);font-size:var(--s-16);max-width:64ch;
}

/* ---------- interview + cheat sheet ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 22px}
.chip{
  font:600 var(--s-12) var(--f-ui);background:var(--raise);border:1px solid var(--rule);
  color:var(--ink-2);padding:4px 10px;border-radius:2px;cursor:pointer;
}
.chip[aria-pressed=true]{background:var(--pine);border-color:var(--pine);color:#F2F7F4}
.qa{border-top:1px solid var(--rule);padding:18px 0}
.qa .q{font:600 var(--s-20)/1.35 var(--f-ui);margin:0 0 8px;max-width:58ch}
.diff{font:600 var(--s-12) var(--f-code);color:var(--ink-2)}
.qa .diff{margin:0 0 8px}
.qa details.sol:not([open]){width:fit-content}
.pick-wrap{font:400 var(--s-12) var(--f-ui);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.pick{font:400 var(--s-14) var(--f-ui);color:var(--ink);background:var(--raise);
  border:1px solid var(--rule);border-radius:2px;padding:4px 6px;max-width:160px}
.follow{border-top:1px dotted var(--rule);margin-top:13px;padding-top:11px}
.follow .fq{font:600 var(--s-16) var(--f-ui);margin-bottom:6px;max-width:58ch}
.follow p{max-width:62ch}
.sheet{columns:2;column-gap:34px;max-width:1000px}
.sheet section{break-inside:avoid;margin-bottom:22px}
.sheet h3{font-size:var(--s-16);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.sheet dl{margin:0;font-size:var(--s-14)}
.sheet dt{font:600 12.5px var(--f-code);color:var(--pine);margin-top:8px}
.sheet dd{margin:2px 0 0;font-family:var(--f-prose)}
@media (max-width:900px){.sheet{columns:1}}

/* ---------- responsive ---------- */
@media (max-width:900px){
  html{font-size:16px}
  .shell{grid-template-columns:minmax(0,1fr)}
  .drawer-btn{display:block}
  .find{width:110px}
  .brand{font-size:var(--s-14)}
  .tab{padding:7px 8px}
  .sidebar{
    position:fixed;left:0;top:var(--bar);width:min(320px,86vw);z-index:25;
    background:var(--paper);transform:translateX(-101%);
    transition:transform .18s ease;box-shadow:0 0 0 100vmax rgba(23,33,29,0);
  }
  .sidebar.open{transform:translateX(0)}
  .pane{padding:24px 18px 90px}
  .lesson-h{font-size:var(--s-28)}
}
@media (max-width:620px){
  .topbar{gap:8px;padding:0 10px}
  .brand{display:none}
  .tabs{gap:0}
  .tab{font-size:var(--s-12);padding:7px 7px}
  .find{flex:0 1 96px}
  .drawer-btn{padding:5px 8px;font-size:var(--s-16);line-height:1}
  .drawer-btn .long{display:none}
  .drawer-btn .short{display:inline}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to lesson</a>

<header class="topbar">
  <button class="drawer-btn" id="drawerBtn" aria-expanded="false" aria-controls="sidebar" aria-label="Contents"><span class="long">Contents</span><span class="short" aria-hidden="true">&#9776;</span></button>
  <div class="brand">React, <span>end to end</span></div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-learn" aria-selected="true" data-tab="learn">Learn</button>
    <button class="tab" role="tab" id="tab-interview" aria-selected="false" data-tab="interview">Interview</button>
    <button class="tab" role="tab" id="tab-sheet" aria-selected="false" data-tab="sheet">Cheat sheet</button>
  </nav>
  <input class="find" id="find" type="search" placeholder="Find" aria-label="Filter lessons and questions">
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Curriculum"></nav>
  <main class="pane" id="main" tabindex="-1"><div class="pane-inner" id="paneInner"></div></main>
</div>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.8",
    "react-dom": "https://esm.sh/react-dom@19.2.8",
    "react-dom/client": "https://esm.sh/react-dom@19.2.8/client"
  }
}
</script>
<script src="https://unpkg.com/@babel/standalone@7.28.4/babel.min.js"></script>
<script type="module">
  // Load React 19 as ES modules. React 19 no longer ships UMD builds.
  try {
    const rmod = await import('react');
    const cmod = await import('react-dom/client');
    const dmod = await import('react-dom');
    const R = (rmod.default && rmod.default.createElement) ? rmod.default : rmod;
    if (!R || !R.createElement) throw new Error('react loaded but createElement is missing');
    window.React = R;
    window.__createRoot = cmod.createRoot;
    const dm = (dmod.default && dmod.default.createPortal) ? dmod.default : dmod;
    window.__createPortal = dm.createPortal;
    window.__useFormStatus = dm.useFormStatus;
    window.__flushSync = dm.flushSync;
    window.__reactStatus = window.Babel ? 'ready' : 'nobabel';
  } catch (err) {
    window.__reactStatus = 'failed';
    window.__reactError = String(err && err.message || err);
  }
  window.dispatchEvent(new Event('reactstatus'));
</script>
<script>
/* ============================================================
   CURRICULUM DATA
   Lesson shape:
     id, t (title)
     what[], why[]            prose paragraphs
     code                     starter code for the lesson playground
     anno[[snippet, note]]    annotated walkthrough
     mistakes[[title, message, fix]]   message may be '' 
     ex {task, start, sol, why}
     mm                       one-sentence mental model
   ============================================================ */
const COURSE = [
{
  id:'m1', t:'Foundations', lvl:'Easy',
  lessons:[
  {
    id:'1', t:'What React is, and when not to use it',
    what:[
      'React is a JavaScript library for building user interfaces out of small, reusable functions called components. You describe what the screen should look like for a given set of data, and React figures out which parts of the real page to change.',
      'It is a library, not a framework. It handles rendering and nothing else. Routing, data fetching, and styling are all choices you make separately, or get bundled for you by a framework like Next.js.'
    ],
    why:[
      'Writing UI by hand means writing instructions: find this element, change its text, add a class, remove that row. This is imperative code. Every new state your app can be in multiplies the number of transitions you have to get right, and bugs live in the transitions you forgot.',
      'React lets you write declarative code instead: given this data, the screen looks like this. There are no transitions to forget, because you never write them. You change the data and re-describe the whole thing; React works out the minimal set of DOM edits.',
      'When not to use React: a static marketing page, a blog, or anything where the interaction is a few event handlers. Plain HTML with a little JavaScript loads faster and has no build step. React earns its cost when you have a lot of state changing over time and a lot of UI that has to stay in sync with it.'
    ],
    code:`// Data in, UI out. Change the numbers and press Run.\nconst hours = [7, 9, 14, 3, 11];\n\nfunction Bar({ value }) {\n  return (\n    <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>\n      <span style={{ width: 90, height: 14, background: '#E3E6DF' }}>\n        <span style={{\n          display: 'block',\n          width: value * 6,\n          height: 14,\n          background: '#2F6B57'\n        }} />\n      </span>\n      <span>{value}h</span>\n    </div>\n  );\n}\n\nfunction App() {\n  return (\n    <div>\n      <h3>Hours studied</h3>\n      {hours.map((h, i) => <Bar key={i} value={h} />)}\n      <p>Total: {hours.reduce((a, b) => a + b, 0)}h</p>\n    </div>\n  );\n}`,
    anno:[
      ['const hours = [7, 9, 14, 3, 11];','The only source of truth. Nothing in the UI is written by hand, so nothing can drift out of sync with it.'],
      ['function Bar({ value }) { ... }','A component: a plain function whose name starts with a capital letter and which returns markup. Capitalisation is not a style choice; it is how React tells your components apart from HTML tags.'],
      ['<span style={{ width: value * 6 }} />','Curly braces switch from markup back into JavaScript. The doubled braces are one pair for the expression and one for the object literal inside it.'],
      ['{hours.map((h, i) => <Bar key={i} value={h} />)}','Five bars from five numbers. Add a sixth number and a sixth bar appears. You never wrote code to add a bar.'],
      ['{hours.reduce((a, b) => a + b, 0)}h','The total is computed at render time, so it cannot disagree with the bars above it.']
    ],
    mistakes:[
      ['Treating React as the whole app','','React renders. It does not route, fetch, validate, or store. Beginners expect a "React way" to do all of it and get lost looking for one. Learn the rendering model first; pick the rest of the stack later and deliberately.'],
      ['Reaching for React because it is the default','','If your page is text with three interactive widgets, React means a build step, a bundle, and a hydration story you did not need. Being able to say why you chose it is part of knowing it.'],
      ['Lowercase component names','Warning: <bar /> is using incorrect casing. Use PascalCase for React components.','React reads a lowercase tag as a literal DOM element, so it renders an unknown <bar> element and your function never runs. Rename it Bar.']
    ],
    ex:{
      task:'Add a label to each bar so it reads like "Mon 7h". Keep the labels in a second array and read them by index inside map.',
      start:`const hours = [7, 9, 14];\nconst days = ['Mon', 'Tue', 'Wed'];\n\nfunction App() {\n  return (\n    <ul>\n      {/* your code */}\n    </ul>\n  );\n}`,
      sol:`const hours = [7, 9, 14];\nconst days = ['Mon', 'Tue', 'Wed'];\n\nfunction App() {\n  return (\n    <ul>\n      {hours.map((h, i) => (\n        <li key={days[i]}>{days[i]} {h}h</li>\n      ))}\n    </ul>\n  );\n}`,
      why:'map gives you the index as its second argument, which lets you look up the matching day. Using days[i] as the key is better than i here, because the day name identifies the row even if the array is reordered later. Note that two parallel arrays is a smell: an array of objects like { day: "Mon", hours: 7 } would be the real fix, and you will see that shape everywhere from Module 2 onward.'
    },
    mm:'React is a function from data to a description of the screen; you change the data, never the screen.'
  },
  {
    id:'2', t:'The JavaScript you actually need first',
    what:[
      'React is just JavaScript. Almost everything that confuses beginners about React turns out to be modern JavaScript syntax they have not met yet, not React itself.',
      'This lesson is the shortlist: the seven or eight features that appear in the first hour of any React codebase. If you can read all of the snippet below, you are ready.'
    ],
    why:[
      'React has no template language of its own. There is no v-if, no ng-repeat, no {{#each}}. Where another framework gives you a directive, React expects you to use a JavaScript expression, so your fluency in JavaScript expressions is your fluency in React.',
      'That is a real trade: one less language to learn, but nowhere to hide from arrow functions and destructuring.'
    ],
    code:`// Everything here shows up constantly in React code.\nconst user = {\n  name: 'Ada',\n  role: 'admin',\n  prefs: { theme: 'dark' },\n  tags: ['founder', 'maths']\n};\n\n// 1. Destructuring: pull fields out by name\nconst { name, role } = user;\n\n// 2. Optional chaining: read deep without crashing\nconst theme = user.prefs?.theme;\nconst missing = user.address?.city;  // undefined, not an error\n\n// 3. Spread: copy, then override\nconst guest = { ...user, role: 'guest' };\n\n// 4. Arrow functions + map/filter\nconst shouty = user.tags.map(t => t.toUpperCase());\nconst short = user.tags.filter(t => t.length < 7);\n\n// 5. Template literals\nconst greeting = \`Hi \${name}, you are \${role}\`;\n\n// 6. Ternary and short-circuit &&\nconst badge = role === 'admin' ? 'star' : 'none';\n\nfunction App() {\n  return (\n    <ul>\n      <li>{greeting}</li>\n      <li>theme: {theme}, address: {String(missing)}</li>\n      <li>guest role: {guest.role} (original still {user.role})</li>\n      <li>{shouty.join(', ')} / short: {short.join(', ')}</li>\n      <li>badge: {badge}</li>\n      {role === 'admin' && <li>admin tools</li>}\n    </ul>\n  );\n}`,
    anno:[
      ['const { name, role } = user;','Destructuring. Creates two variables from two properties of the same name. You will see this in every component signature: function Card({ title, body }).'],
      ['user.prefs?.theme','Optional chaining. If user.prefs is null or undefined, the whole expression is undefined instead of throwing. Essential when rendering data that has not arrived yet.'],
      ['{ ...user, role: \'guest\' }','Spread copies every property of user into a new object, then role overrides. Later keys win. This is how you update state without mutating it, which is Module 2, lesson 12.'],
      ['user.tags.map(t => t.toUpperCase())','map builds a new array by transforming each item. In React you use it to turn an array of data into an array of elements.'],
      ['role === \'admin\' && <li>admin tools</li>','Short-circuit &&. If the left side is truthy the expression is the right side, so the element renders. If it is falsy the expression is that falsy value, and React renders nothing for false, null, or undefined. Watch out for 0, which React does render, covered in lesson 6.']
    ],
    mistakes:[
      ['Confusing = , == and ===','','Use === for comparison, always. == coerces types, so \'1\' == 1 is true and you will lose an hour to it. Use = only for assignment.'],
      ['Expecting an arrow function to return an object','',"() => { theme: 'dark' } returns undefined, because the braces are read as a function body and theme: is a label. Wrap the object in parentheses: () => ({ theme: 'dark' })."],
      ['Mutating instead of copying','','user.tags.push(\'x\') changes the original array. React relies on you making new objects and arrays, so prefer [...user.tags, \'x\']. This is the single most common source of "why did my UI not update".']
    ],
    ex:{
      task:'Given an array of objects, render only the items in stock, formatted as "Name — £price". Use filter, map, and a template literal.',
      start:`const items = [\n  { id: 'a', name: 'Mug', price: 8, inStock: true },\n  { id: 'b', name: 'Poster', price: 14, inStock: false },\n  { id: 'c', name: 'Tote', price: 12, inStock: true }\n];\n\nfunction App() {\n  return <ul>{/* your code */}</ul>;\n}`,
      sol:`const items = [\n  { id: 'a', name: 'Mug', price: 8, inStock: true },\n  { id: 'b', name: 'Poster', price: 14, inStock: false },\n  { id: 'c', name: 'Tote', price: 12, inStock: true }\n];\n\nfunction App() {\n  return (\n    <ul>\n      {items\n        .filter(item => item.inStock)\n        .map(item => (\n          <li key={item.id}>{\`\${item.name} — £\${item.price}\`}</li>\n        ))}\n    </ul>\n  );\n}`,
      why:'filter runs first and returns a shorter array; map then turns each surviving object into an element. Chaining reads top to bottom in the order the data flows. The key comes from item.id, a stable identifier that belongs to the data rather than to its position. You could also write {item.name} — £{item.price} directly and skip the template literal; both are fine, and the JSX version is usually easier to read.'
    },
    mm:'React syntax is JavaScript expressions in markup, so gaps in your JavaScript will look like gaps in your React.'
  },
  {
    id:'3', t:'Your first component and the rules of JSX',
    what:[
      'A component is a JavaScript function that returns markup. Call it by writing it as a tag: <Greeting />.',
      'The markup itself is JSX: an extension to JavaScript that lets you write tag syntax inside code. It is not HTML and not a string. Before it runs, a compiler turns every tag into a function call.'
    ],
    why:[
      'Rendering logic and markup are the same concern. Which rows appear depends on the data, the class depends on the state, the label depends on the locale. Splitting them into separate template files means every change touches two places.',
      'JSX puts them in one place while keeping the full power of JavaScript, because it is JavaScript. The cost is a compile step and a handful of rules where JSX and HTML disagree.'
    ],
    code:`// JSX rules, all in one component.\nfunction Profile() {\n  const user = { first: 'Grace', last: 'Hopper', admin: true };\n  const fullName = user.first + ' ' + user.last;\n\n  return (\n    <>\n      {/* this is a JSX comment */}\n      <h3 className="title">{fullName}</h3>\n      <label htmlFor="nick">Nickname</label>\n      <input id="nick" defaultValue={user.first} />\n      <br />\n      <p>Characters in name: {fullName.length}</p>\n      <p>{user.admin ? 'Administrator' : 'Member'}</p>\n    </>\n  );\n}\n\nfunction App() {\n  return <Profile />;\n}`,
    anno:[
      ['function Profile() {','PascalCase name, no arguments yet. A component takes no arguments other than its props object.'],
      ['return ( ... );','The parentheses let the markup start on the next line. Without them, JavaScript inserts a semicolon after return and your component returns undefined.'],
      ['<> ... </>','A Fragment. A component must return one element, and this groups several without adding a wrapper div to the page. The long form is <React.Fragment>, which you need when you want to give it a key.'],
      ['{/* this is a JSX comment */}','Comments inside markup are a JavaScript comment inside braces. // on its own line inside JSX renders as text.'],
      ['className="title"','class is a reserved word in JavaScript, so JSX uses className. Likewise htmlFor instead of for.'],
      ['<input id="nick" defaultValue={user.first} />','Every tag must close. In HTML <input> and <br> may dangle; in JSX they must be self-closing, because each tag becomes a function call and the compiler needs to know where the arguments end.'],
      ['{fullName.length}','Braces take any JavaScript expression: a variable, a call, arithmetic, a ternary. Not a statement, so no if or for in there. That constraint is why ternaries and && are everywhere in React.']
    ],
    mistakes:[
      ['Returning two sibling elements','Adjacent JSX elements must be wrapped in an enclosing tag. Did you want a JSX fragment <>...</>?','A return can only produce one value. Wrap the siblings in <>...</> or a div.'],
      ['Using class instead of className','Warning: Invalid DOM property `class`. Did you mean `className`?','Rename it. The same applies to for on a label, which becomes htmlFor.'],
      ['A blank line after return','','return\\n  <p>hi</p> becomes return; followed by unreachable markup, and your component renders nothing. Put the opening bracket or a parenthesis on the same line as return.'],
      ['Putting an if inside braces','Unexpected token','Braces hold an expression, and if is a statement. Use a ternary inside the markup, or an if above the return.']
    ],
    ex:{
      task:'Write a Card component that renders a title, a subtitle, and a checkbox with a working label, using a fragment as its root. Then render two Cards from App.',
      start:`function Card() {\n  // your code\n}\n\nfunction App() {\n  return <Card />;\n}`,
      sol:`function Card() {\n  return (\n    <>\n      <h3 className="card-title">Kepler-16b</h3>\n      <p>A circumbinary planet</p>\n      <input id="fav" type="checkbox" />\n      <label htmlFor="fav">Favourite</label>\n    </>\n  );\n}\n\nfunction App() {\n  return (\n    <div>\n      <Card />\n      <Card />\n    </div>\n  );\n}`,
      why:'The fragment groups four elements without adding a wrapper element to the DOM. htmlFor="fav" matched to id="fav" is what makes clicking the word "Favourite" toggle the box, which matters for both usability and accessibility. Rendering <Card /> twice shows the point of components: one definition, many instances. It also exposes a bug worth noticing, since both cards now use the id "fav" and duplicate ids are invalid; lesson 5 fixes it with props, and useId later gives you generated unique ids.'
    },
    mm:'A component is a function returning one element, and JSX is JavaScript wearing tags.'
  },
  {
    id:'4', t:'Rendering with createRoot',
    what:[
      'Components do not put themselves on the page. You pick one DOM element to hand over to React, create a root for it, and render your top component into it.',
      'From then on React owns everything inside that element. You never touch it with document.querySelector again.'
    ],
    why:[
      'React needs one boundary between the part of the page it manages and the part it does not. That boundary is the root. It gives React somewhere to store the internal tree it compares against on every update, which is what lets it change only what differs.',
      'One root at the top of the app is the normal case. Several small roots is how you add React to a page you do not otherwise control, one widget at a time.'
    ],
    code:`// The playground normally renders your App for you.\n// Here, do it by hand. 'mount' is this output pane's DOM node,\n// standing in for document.getElementById('root').\n\nfunction App() {\n  return <p>Rendered by hand into a root.</p>;\n}\n\nconst root = createRoot(mount);\nroot.render(<App />);`,
    anno:[
      ['import { createRoot } from \'react-dom/client\';','In a real project this is the import. Note the package: react holds the component API, react-dom holds everything that knows about a browser.'],
      ['const root = createRoot(document.getElementById(\'root\'))','Creates the root once, against an empty element that lives in your index.html. Creating it twice for the same element is a bug; keep the call at module top level so it runs once.'],
      ['root.render(<App />)','Renders, and re-renders on later calls. You almost never call this more than once, because after the first render, state changes drive everything.'],
      ['<StrictMode><App /></StrictMode>','The usual wrapper in development. It double-invokes some functions on purpose to surface bugs. Lesson 20 explains why that is a feature.'],
      ['root.unmount()','Tears the whole tree down and runs every cleanup function. You need it when React is a widget inside a non-React page.']
    ],
    mistakes:[
      ['Using ReactDOM.render','ReactDOM.render is no longer supported in React 18. Use createRoot instead.','ReactDOM.render was removed in React 19. Any tutorial that uses it predates 2022. The replacement is createRoot from react-dom/client.'],
      ['The container does not exist yet','Uncaught TypeError: Cannot read properties of null (reading \'appendChild\')','getElementById returned null. Either the id is misspelt or the script runs before the element exists. Put the script tag at the end of the body, or give it the defer attribute.'],
      ['Creating a second root for the same element','Warning: You are calling ReactDOMClient.createRoot() on a container that has already been passed to createRoot() before.','Keep a single root variable and call root.render again, rather than calling createRoot again.']
    ],
    ex:{
      task:'Render two independent roots into the same output pane, each with its own component. Append two child divs to mount yourself, then create a root for each.',
      start:`function Clock() { return <p>Widget A</p>; }\nfunction Rating() { return <p>Widget B</p>; }\n\n// your code`,
      sol:`function Clock() { return <p>Widget A</p>; }\nfunction Rating() { return <p>Widget B</p>; }\n\nconst a = document.createElement('div');\nconst b = document.createElement('div');\nmount.append(a, b);\n\ncreateRoot(a).render(<Clock />);\ncreateRoot(b).render(<Rating />);`,
      why:'Two roots means two independent React trees on one page. They share no state and cannot pass props to each other, which is exactly the trade-off when you sprinkle React onto a server-rendered page: cheap to add, but the widgets are islands. If they need to talk, they either share a plain JavaScript module or become one tree with one root.'
    },
    mm:'One root marks the border of React territory; inside it, React owns the DOM.'
  },
  {
    id:'5', t:'Props: passing data down',
    what:[
      'Props are the arguments you pass to a component. You write them as attributes on the tag, and the component receives them as one object.',
      'They are read-only. A component may read its props and must never assign to them. Data flows one way: from the component that renders you, to you.'
    ],
    why:[
      'Without props, a component could only ever render one fixed thing, and you would copy and paste it for every variation. Props are what make a component reusable: one Button definition, forty buttons.',
      'One-way flow is the constraint that makes a React app followable. When something on screen is wrong, the value came from exactly one place, the parent, so you walk up the tree until you find where it went wrong.'
    ],
    code:`function Stat({ label, value, unit = 'ms', children }) {\n  return (\n    <div style={{ marginBottom: 12 }}>\n      <strong>{label}</strong>: {value}{unit}\n      {children}\n    </div>\n  );\n}\n\nfunction App() {\n  const rows = { render: 4.2, fetch: 310 };\n  return (\n    <div>\n      <Stat label="Render" value={rows.render} />\n      <Stat label="Fetch" value={rows.fetch} />\n      <Stat label="Budget" value={16} unit="ms">\n        <em> (per frame)</em>\n      </Stat>\n    </div>\n  );\n}`,
    anno:[
      ['function Stat({ label, value }) {','Destructuring the props object in the signature. The long form is function Stat(props) and then props.label. Destructuring is the convention because it documents what the component accepts.'],
      ['unit = \'ms\'','A default value, using plain JavaScript default parameters. This is how you set defaults on a function component. The old defaultProps property is deprecated for function components and does nothing you need.'],
      ['value={rows.render}','Braces pass a real JavaScript value: a number here. Quotes pass a string. value="16" and value={16} are different types, and that difference will bite you the first time you do arithmetic on it.'],
      ['{children}','Whatever you nest between the opening and closing tags arrives as the children prop. It lets a component wrap content it knows nothing about, which is the basis of every layout, card, and modal component you will write.'],
      ['<Stat label="Budget" value={16} unit="ms">','Passing unit overrides the default. Omit it and the default applies.']
    ],
    mistakes:[
      ['Assigning to a prop','TypeError: Assignment to constant variable. / Cannot assign to read only property','props.label = \'x\' is not how you change anything. If a value needs to change, it belongs in state, owned by whoever is allowed to change it. Lesson 14 covers where that owner should live.'],
      ['Forgetting the braces around props','','render={() => doThing()} passes a function; render="() => doThing()" passes a string that will never run. Similarly disabled="false" is a non-empty string and therefore truthy, so the button stays disabled. Use disabled={false}.'],
      ['Spreading props blindly','Warning: React does not recognize the `onSubmitForm` prop on a DOM element.','<div {...props} /> forwards everything, including props meant for you rather than for the DOM. Pull out what you use and spread only the rest: const { label, ...rest } = props.']
    ],
    ex:{
      task:'Build an Avatar component taking name and size props, defaulting size to 32. Render the first letter of the name in a square of that size. Then render three at different sizes.',
      start:`function Avatar({ /* your props */ }) {\n  // your code\n}\n\nfunction App() {\n  return <Avatar name="Ada" />;\n}`,
      sol:`function Avatar({ name, size = 32 }) {\n  return (\n    <span\n      title={name}\n      style={{\n        display: 'inline-flex',\n        alignItems: 'center',\n        justifyContent: 'center',\n        width: size,\n        height: size,\n        marginRight: 6,\n        background: '#2F6B57',\n        color: '#F2F7F4',\n        fontSize: size / 2\n      }}\n    >\n      {name[0].toUpperCase()}\n    </span>\n  );\n}\n\nfunction App() {\n  return (\n    <div>\n      <Avatar name="Ada" />\n      <Avatar name="Grace" size={48} />\n      <Avatar name="linus" size={64} />\n    </div>\n  );\n}`,
      why:'size is a number, so it can be used in arithmetic for the font size. That is the reason to pass {32} rather than "32". The default lives in the signature, so a caller who does not care about size does not have to think about it. Note the component decides how to present the name, uppercasing the initial rather than requiring every caller to remember.'
    },
    mm:'Props are function arguments that flow one way down the tree, and the receiver may read them but never write them.'
  },
  {
    id:'6', t:'Conditional rendering',
    what:[
      'There is no special syntax for conditions in JSX. You use the JavaScript you already have: a ternary, a logical &&, or an early return.',
      'React renders nothing at all for null, undefined, true, and false. It does render 0 and the empty string, which is the source of one very common bug.'
    ],
    why:[
      'Because JSX braces hold an expression rather than a statement, an if cannot live inside markup. Rather than inventing a template directive, React leans on the expression forms JavaScript already has.',
      'The pay-off is that there is nothing new to learn and nothing that can only be done the framework\'s way. The cost is knowing which falsy values render.'
    ],
    code:`function Inbox({ count, user, error }) {\n  // 1. Early return for the whole-component case\n  if (error) return <p>Could not load the inbox.</p>;\n\n  return (\n    <div>\n      {/* 2. Ternary when there are two branches */}\n      <p>{user ? \`Signed in as \${user}\` : 'Signed out'}</p>\n\n      {/* 3. && when there is one branch */}\n      {count > 0 && <p>{count} unread</p>}\n\n      {/* 4. The 0 footgun: count is 0, so 0 is rendered */}\n      <p>Broken version: {count && <span>{count} unread</span>}</p>\n\n      {/* 5. null renders nothing */}\n      {count === 0 ? null : <p>Go and read something.</p>}\n    </div>\n  );\n}\n\nfunction App() {\n  return <Inbox count={0} user="ada" error={false} />;\n}`,
    anno:[
      ['if (error) return <p>...</p>;','An early return. Use it when the whole component becomes something else. Cheaper to read than wrapping the entire body in a ternary.'],
      ['{user ? \`Signed in as \${user}\` : \'Signed out\'}','A ternary. Two outcomes, both present, so the reader sees both without hunting.'],
      ['{count > 0 && <p>{count} unread</p>}','The idiomatic one-branch form. Note the explicit comparison: it forces the left side to be a boolean.'],
      ['{count && <span>...</span>}','The footgun. When count is 0 the expression evaluates to 0, and React renders the number 0 on your page. Always compare, or coerce with Boolean(count), or use count ? ... : null.'],
      ['{condition ? null : <p>...</p>}','null is the explicit "render nothing". Returning null from the component itself is also legal and normal.']
    ],
    mistakes:[
      ['A stray 0 on the page','','Caused by {items.length && <List />} with an empty array. Write {items.length > 0 && <List />}.'],
      ['Deeply nested ternaries','','a ? b : c ? d : e is unreadable within a week. Pull it into a variable above the return, or into a small function, or use early returns.'],
      ['Hiding with CSS when the component should not run','','Rendering an expensive component and setting display:none still mounts it, runs its effects, and fetches its data. If it should not exist, do not render it. If it should keep its state while hidden, that is what <Activity> in React 19.2 is for, covered in Module 6.']
    ],
    ex:{
      task:'Render a list of notifications with three states: an error message, an empty state, and the list. Handle all three without a nested ternary.',
      start:`function Notifications({ items, error }) {\n  // your code\n}\n\nfunction App() {\n  return <Notifications items={[]} error={null} />;\n}`,
      sol:`function Notifications({ items, error }) {\n  if (error) return <p>Could not load notifications.</p>;\n  if (items.length === 0) return <p>Nothing new. Enjoy the quiet.</p>;\n\n  return (\n    <ul>\n      {items.map(n => <li key={n.id}>{n.text}</li>)}\n    </ul>\n  );\n}\n\nfunction App() {\n  return (\n    <div>\n      <Notifications items={[]} error={null} />\n      <Notifications items={[{ id: 1, text: 'Build finished' }]} error={null} />\n      <Notifications items={[]} error="500" />\n    </div>\n  );\n}`,
      why:'Two early returns handle the exceptional cases and leave the happy path unindented at the bottom, which is the shape you want in every component that can fail or be empty. It reads as a checklist rather than a puzzle. Note also that items.length === 0 is explicit: !items.length works but invites the 0 bug next time someone edits the line.'
    },
    mm:'Conditions in JSX are ordinary JavaScript expressions, and only 0 and the empty string surprise you by rendering.'
  },
  {
    id:'7', t:'Lists and the key prop',
    what:[
      'To render a list, map an array of data to an array of elements. React accepts an array anywhere it accepts an element.',
      'Each element in that array needs a key: a string or number that identifies this item among its siblings, and that stays the same across renders. Keys are not passed to your component; they are a hint to React.'
    ],
    why:[
      'When the list changes, React compares the new array against the old one to decide what to do with each DOM node and each piece of component state. Position alone is not enough information: if you delete the first row, everything shifts, and React cannot tell "row 1 was removed" from "every row changed its text".',
      'The key answers that question. With stable keys, React moves and removes nodes. Without them, it reuses node number 1 for whatever now sits in position 1, and any state inside it, including the text you had typed into an input, stays behind with the wrong item.'
    ],
    code:`function Row({ item }) {\n  return (\n    <li>\n      {item.name} <input placeholder="type here" />\n    </li>\n  );\n}\n\nfunction App() {\n  const [items, setItems] = useState([\n    { id: 'a', name: 'Alpha' },\n    { id: 'b', name: 'Beta' },\n    { id: 'c', name: 'Gamma' }\n  ]);\n\n  // Type into Alpha's input, then remove Alpha, and compare.\n  return (\n    <div>\n      <p><b>Keyed by id</b> (correct)</p>\n      <ul>{items.map(i => <Row key={i.id} item={i} />)}</ul>\n\n      <p><b>Keyed by index</b> (broken)</p>\n      <ul>{items.map((i, idx) => <Row key={idx} item={i} />)}</ul>\n\n      <button onClick={() => setItems(items.slice(1))}>Remove first</button>\n    </div>\n  );\n}`,
    anno:[
      ['items.map(i => <Row key={i.id} item={i} />)','key sits on the element produced inside map, not on anything inside Row. If you move the map into a helper component, the key moves with the element.'],
      ['key={i.id}','An id that comes from the data. Stable across reorders, deletions, and re-fetches. This is what you want in essentially every real list.'],
      ['key={idx}','The index. Stable only if the list never reorders and items are never inserted or removed anywhere but the end. Fine for a static list you wrote by hand; wrong for anything the user can edit.'],
      ['setItems(items.slice(1))','slice returns a new array without mutating. Press the button and watch: the id-keyed inputs keep their text with the right rows, and the index-keyed ones do not.'],
      ['<React.Fragment key={x}>','When each item renders several siblings you need a keyed fragment, and the shorthand <> cannot take a key.']
    ],
    mistakes:[
      ['No key at all','Warning: Each child in a list should have a unique "key" prop.','Add one from your data. If the data genuinely has no id, generate one when you create the item, not at render time.'],
      ['Math.random() as a key','','A new key every render means React throws away every DOM node and every piece of state in the list on every render. It silences the warning and produces the worst possible behaviour.'],
      ['Duplicate keys','Warning: Encountered two children with the same key, `a`. Keys should be unique so that components maintain their identity across updates.','Two items share an id. Either the data is wrong or you are keying by a non-unique field like name.'],
      ['Reading the key inside the component','props.key is undefined','key is consumed by React and never reaches your props. If the component needs the id, pass it again as a normal prop: <Row key={i.id} id={i.id} />.']
    ],
    ex:{
      task:'Render a to-do list where each row has a checkbox, and add a button that reverses the order. Prove that a bad key loses checkbox state and a good one does not.',
      start:`function App() {\n  const [todos, setTodos] = useState([\n    { id: 1, text: 'Read' },\n    { id: 2, text: 'Write' },\n    { id: 3, text: 'Run' }\n  ]);\n  // your code\n}`,
      sol:`function App() {\n  const [todos, setTodos] = useState([\n    { id: 1, text: 'Read' },\n    { id: 2, text: 'Write' },\n    { id: 3, text: 'Run' }\n  ]);\n\n  const reverse = () => setTodos([...todos].reverse());\n\n  return (\n    <div>\n      <button onClick={reverse}>Reverse</button>\n      <p>Keyed by id:</p>\n      <ul>\n        {todos.map(t => (\n          <li key={t.id}><input type="checkbox" /> {t.text}</li>\n        ))}\n      </ul>\n      <p>Keyed by index:</p>\n      <ul>\n        {todos.map((t, i) => (\n          <li key={i}><input type="checkbox" /> {t.text}</li>\n        ))}\n      </ul>\n    </div>\n  );\n}`,
      why:'Tick "Read" in both lists and press Reverse. In the id-keyed list the tick travels with Read, because React matches the element by key and moves the DOM node. In the index-keyed list the tick stays in position one, now next to Run, because as far as React knows element 0 simply changed its text. Note [...todos].reverse() rather than todos.reverse(): reverse mutates in place, and mutating state is the subject of lesson 12. The checkbox here is uncontrolled, so its state lives in the DOM node, which is what makes the bug so visible.'

    why:[

    code:`function App() {\n  const [log, setLog] = useState([]);\n  const add = (msg) => setLog(prev => [msg, ...prev].slice(0, 5));\n\n  function handleSubmit(e) {\n    e.preventDefault();               // stop the page reloading\n    const value = e.target.elements.q.value;\n    add('submitted: ' + (value || '(empty)'));\n  }\n\n  return (\n    <div>\n      {/* passing the function, not calling it */}\n      <button onClick={() => add('clicked')}>Click</button>\n\n      {/* passing an argument needs a wrapper arrow */}\n      <button onClick={() => add('deleted 42')}>Delete 42</button>\n\n      <form onSubmit={handleSubmit}>\n        <input name="q" placeholder="search" />\n        <button type="submit">Search</button>\n      </form>\n\n      <div onClick={() => add('outer div')}>\n        <button onClick={(e) => { e.stopPropagation(); add('inner, not outer'); }}>\n          Stop bubbling\n        </button>\n      </div>\n\n      <ul>{log.map((l, i) => <li key={i}>{l}</li>)}</ul>\n    </div>\n  );\n}`,

    mistakes:[
      ['Calling the handler during render','Warning: Too many re-renders. React limits the number of renders to prevent an infinite loop.','onClick={setOpen(true)} runs setOpen during render, which triggers a render, which runs it again. Write onClick={() => setOpen(true)}.'],
      ['Forgetting preventDefault on a form','','The page reloads, your state resets, and it looks as if nothing happened. The first line of a submit handler is nearly always e.preventDefault().'],

    ex:{
      task:'Build a list of three items, each with a Remove button, so that clicking a button removes only that item. Pass the id through to the handler.',
      start:`function App() {\n  const [items, setItems] = useState(['pen', 'ink', 'paper']);\n  // your code\n}`,
      sol:`function App() {\n  const [items, setItems] = useState(['pen', 'ink', 'paper']);\n\n  function handleRemove(name) {\n    setItems(prev => prev.filter(i => i !== name));\n  }\n\n  return (\n    <ul>\n      {items.map(name => (\n        <li key={name}>\n          {name}{' '}\n          <button onClick={() => handleRemove(name)}>Remove</button>\n        </li>\n      ))}\n    </ul>\n  );\n}`,
      why:'The arrow function in onClick is what lets you pass name. It closes over the value from this render, which is exactly what you want here. handleRemove uses the updater form of setItems, prev => ..., so it never reads a possibly stale items; lesson 13 explains why that habit pays off. filter returns a new array rather than mutating, which is lesson 12. {\' \'} is the usual way to force a space between an expression and an element, because JSX collapses the whitespace you would otherwise rely on.'

  {

    what:[
      'Two everyday options. The style prop takes a JavaScript object with camelCased properties, and className takes a string of CSS classes exactly as in HTML.',
      'React has no opinion beyond that. Everything else, from CSS modules to Tailwind to styled-components, is a library layered on those two props.'

    why:[
      'style is useful for values computed at runtime: a bar\'s width, a transform, a colour from data. It cannot do pseudo-classes, media queries, or keyframes, and it produces no reusable rules.',
      'className is where real styling belongs, because it is real CSS with all of CSS\'s features and caching. Conditional classes are then just string building, which is why so many small helper libraries exist to build those strings tidily.'

    code:`function Pill({ tone, children }) {\n  // conditional class as plain string building\n  const cls = 'pill ' + (tone === 'warn' ? 'pill-warn' : 'pill-ok');\n  return <span className={cls}>{children}</span>;\n}\n\nfunction App() {\n  const [pct, setPct] = useState(40);\n  const [on, setOn] = useState(false);\n\n  return (\n    <div>\n      <style>{\`\n        .pill { padding: 2px 8px; border-radius: 999px; font-size: 12px; }\n        .pill-ok { background: #E3EBE6; color: #2F6B57; }\n        .pill-warn { background: #F4EEE1; color: #8C5A12; }\n        .row { display: flex; gap: 8px; align-items: center; }\n        .row.is-on { outline: 2px solid #2F6B57; }\n      \`}</style>\n\n      <div className={on ? 'row is-on' : 'row'}>\n        <Pill tone="ok">passing</Pill>\n        <Pill tone="warn">flaky</Pill>\n        <button onClick={() => setOn(!on)}>Toggle outline</button>\n      </div>\n\n      {/* style prop earns its place for computed values */}\n      <div style={{ height: 10, background: '#E3E6DF', marginTop: 10 }}>\n        <div style={{ width: pct + '%', height: 10, background: '#2F6B57' }} />\n      </div>\n      <button onClick={() => setPct(p => Math.min(100, p + 10))}>Grow</button>\n    </div>\n  );\n}`,
    anno:[
      ['style={{ height: 10 }}','Two braces: the outer pair enters JavaScript, the inner pair is an object literal. Numbers get px added automatically for length properties, so height: 10 means 10px. Unitless properties like lineHeight and zIndex stay unitless.'],

    ex:{
      task:'Build a Button that takes a variant prop of "primary" or "quiet" and a disabled prop, and composes its className from all three states without nesting ternaries.',
      start:`function Button({ variant = 'quiet', disabled, children }) {\n  // your code\n}\n\nfunction App() {\n  return <Button variant="primary">Save</Button>;\n}`,
      sol:`function Button({ variant = 'quiet', disabled, children }) {\n  const cls = ['btn', 'btn-' + variant, disabled && 'btn-off']\n    .filter(Boolean)\n    .join(' ');\n\n  return (\n    <button className={cls} disabled={disabled}>\n      <style>{\`\n        .btn { padding: 5px 12px; border-radius: 3px; border: 1px solid #C7CDC3; }\n        .btn-primary { background: #2F6B57; color: #F2F7F4; border-color: #2F6B57; }\n        .btn-quiet { background: #FBFCFA; color: #17211D; }\n        .btn-off { opacity: .5; }\n      \`}</style>\n      {children}\n    </button>\n  );\n}\n\nfunction App() {\n  return (\n    <div>\n      <Button variant="primary">Save</Button>\n      <Button>Cancel</Button>\n      <Button variant="primary" disabled>Saving…</Button>\n    </div>\n  );\n}`,
      why:'An array of candidate classes, filtered and joined, scales to any number of conditions and stays readable. filter(Boolean) removes the false that disabled && ... leaves behind when disabled is undefined. This is precisely what the clsx package does in one function call, and knowing the pattern means you can decide whether the dependency is worth it. Note disabled={disabled} passes a real boolean to the DOM, unlike disabled="false" which would be truthy.'
    },
    mm:'className is for CSS you write, and the style prop is for numbers you compute.'
  },
  {
    id:'10', t:'Composition, and where files go',
    what:[
      'Composition means building big components by nesting small ones, and letting a component accept arbitrary content through children rather than trying to anticipate every variation with props.',
      'React has no inheritance story for components. You never extend a Button to make a PrimaryButton. You wrap, you pass props, you pass children.'
    ],
    why:[
      'The alternative to composition is a component with twenty boolean props: hasIcon, isModal, showFooter. Every new requirement adds another, the render body fills with conditions, and eventually nobody dares touch it.',
      'A component that accepts children does not need to know what goes inside it. A Card can be a layout with a border, used for a chart in one place and a form in another, and it never changes. Fewer props, fewer conditions, fewer reasons to edit old code.',
      'File layout follows the same logic. Group by feature, not by kind, so that everything you need to change together lives together.'
    ],
    code:`// A layout that knows nothing about its contents.\nfunction Panel({ title, actions, children }) {\n  return (\n    <section style={{ border: '1px solid #C7CDC3', borderRadius: 3, marginBottom: 12 }}>\n      <header style={{\n        display: 'flex', justifyContent: 'space-between',\n        padding: '6px 10px', borderBottom: '1px solid #C7CDC3'\n      }}>\n        <strong>{title}</strong>\n        <span>{actions}</span>\n      </header>\n      <div style={{ padding: 10 }}>{children}</div>\n    </section>\n  );\n}\n\nfunction Chart() { return <p>[a chart]</p>; }\n\nfunction App() {\n  return (\n    <div>\n      <Panel title="Traffic" actions={<button>Export</button>}>\n        <Chart />\n      </Panel>\n\n      <Panel title="Notes">\n        <p>Panel has no idea what any of this is.</p>\n      </Panel>\n    </div>\n  );\n}`,
    anno:[
      ['function Panel({ title, actions, children })','Three slots. title takes a string, actions and children take elements. A prop holding an element is often called a render slot, and it is how you get several "children" in different places.'],
      ['actions={<button>Export</button>}','Elements are ordinary values. You can put one in a prop, an array, or a variable. This is the whole trick behind most flexible component APIs.'],
      ['<Panel title="Traffic"><Chart /></Panel>','Nesting reads like HTML and produces the children prop. Panel decides where children land; the caller decides what they are.'],
      ['<Panel title="Notes">','No actions passed, so actions is undefined and React renders nothing in that span. Optional slots need no special handling.']
    ],
    mistakes:[
      ['Growing a component by adding boolean props','','Three or more booleans that are never true together usually mean two or three components, or one component with a children slot. isCompact and isWide next to each other is a design smell.'],
      ['Grouping files by kind','','components/, hooks/, utils/ scales badly: a change to one feature touches four directories. Prefer features/invoices/InvoiceList.jsx, features/invoices/useInvoices.js, and keep a shared components/ folder only for things genuinely used everywhere.'],
      ['One component per file, always','','A small component used only by its neighbour can live in the same file. Splitting it out adds an import and a filename to invent, for no benefit. Split when it is reused or when the file stops fitting on a screen.']
    ],
    ex:{
      task:'Refactor a component with hasHeader and hasFooter booleans into one that uses children plus two optional element props, then render it three ways.',
      start:`// Before: too many booleans\nfunction Box({ hasHeader, hasFooter, title, children }) {\n  return (\n    <div>\n      {hasHeader && <h4>{title}</h4>}\n      {children}\n      {hasFooter && <small>footer</small>}\n    </div>\n  );\n}\n\nfunction App() {\n  return <Box hasHeader title="x">body</Box>;\n}`,
      sol:`function Box({ header, footer, children }) {\n  return (\n    <div style={{ border: '1px solid #C7CDC3', padding: 8, marginBottom: 8 }}>\n      {header}\n      {children}\n      {footer}\n    </div>\n  );\n}\n\nfunction App() {\n  return (\n    <div>\n      <Box header={<h4>With a header</h4>}>body only</Box>\n      <Box footer={<small>and a footer</small>}>body and footer</Box>\n      <Box>just a body</Box>\n    </div>\n  );\n}`,
      why:'The booleans and the title prop collapse into one element-valued prop each. Box has no conditions left, because an absent prop is undefined and React renders nothing for it. The caller gained power too: the header can now be a heading, a row of tabs, or an image, and Box needs no change to allow it. The trade-off is that Box no longer controls how a header looks, so if consistency matters, export a matching BoxHeader component and let callers use it, which is the compound component pattern in Module 4.'
    },
    mm:'Prefer passing content over adding flags: a component that accepts children never has to be edited to allow a new use.'
  }
  ]

  {
    id:'11', t:'useState, and the render as a snapshot',
    what:[
      'State is memory that belongs to one instance of one component and survives between renders. useState gives you the current value and a function to set it.',
      'Setting state does not change the variable you are holding. It asks React to render the component again, and the new render gets a new value.',
      'That is the whole mental model: each render sees its own frozen copy of state, like a photograph. The value in your handler is the value from the render that created the handler.'
    ],
    why:[
      'A plain variable inside a component is recreated on every render, so it cannot remember anything. A variable outside the component is shared by every instance, so two counters would move together. State is the memory that is both persistent and per-instance.',
      'The snapshot rule exists so that a render is consistent. Everything you read during one render, props, state, derived values, comes from the same moment in time, so the screen can never show half of one update and half of the next.'

    code:`function App() {\n  const [n, setN] = useState(0);\n  const [seen, setSeen] = useState('nothing yet');\n\n  function triple() {\n    setN(n + 1);   // all three read the same n\n    setN(n + 1);\n    setN(n + 1);   // so this is +1 in total, not +3\n  }\n\n  function capture() {\n    // this closure captured n from THIS render\n    setTimeout(() => setSeen('the click saw n = ' + n), 1500);\n  }\n\n  return (\n    <div>\n      <p>n is {n}</p>\n      <button onClick={() => setN(n + 1)}>+1</button>\n      <button onClick={triple}>+1 three times</button>\n      <button onClick={capture}>Capture n, report in 1.5s</button>\n      <p>{seen}</p>\n      <p><small>Press Capture, then press +1 twice quickly.</small></p>\n    </div>\n  );\n}`,
    anno:[
      ['const [n, setN] = useState(0);','Array destructuring of the pair useState returns: the current value, and the setter. The names are yours; the convention is x and setX.'],
      ['useState(0)','The argument is the initial value, used on the first render of this component instance only. On every later render it is ignored.'],
      ['setN(n + 1)','Requests a re-render with a new value. It does not assign to n. If you log n on the next line you will still see the old number, and that is correct rather than a bug.'],
      ['function triple() { setN(n + 1); ... }','Three calls, one n. Each reads the same snapshot, so all three compute the same result and the last one wins. Lesson 13 fixes this with the updater form.'],
      ['setTimeout(() => setSeen(... + n), 1500)','The arrow closes over n from the render in which the click happened. Later renders create new closures; this one keeps its snapshot forever. Interviewers call this a stale closure and ask about it constantly.']

      ['Calling a hook conditionally','React has detected a change in the order of Hooks called by App. This will lead to bugs and errors if not fixed.','if (loading) { const [x, setX] = useState(0); } is illegal. Hooks must be called in the same order on every render, because React matches them to their stored values by call order. Lesson 27 explains why.'],
      ['Initialising from a prop and expecting it to follow','','useState(props.value) reads the prop once and then ignores it forever. That is either what you want, in which case name the state accordingly, or a bug; lesson 17 covers the fix.'],
      ['Running an expensive function as the initial value','','useState(buildHugeList()) calls the function on every render and throws the result away. Pass the function itself: useState(buildHugeList), and React calls it once.']

    ex:{
      task:'Build a toggle that shows either "on" or "off", plus a click counter, using two pieces of state. Then predict what the counter shows if you call its setter twice in one handler.',
      start:`function App() {\n  // your code\n}`,
      sol:`function App() {\n  const [on, setOn] = useState(false);\n  const [clicks, setClicks] = useState(0);\n\n  function handleClick() {\n    setOn(!on);\n    setClicks(clicks + 1);\n    setClicks(clicks + 1);   // still only +1\n  }\n\n  return (\n    <div>\n      <button onClick={handleClick}>Toggle</button>\n      <p>Lamp is {on ? 'on' : 'off'}, clicked {clicks} times</p>\n    </div>\n  );\n}`,

    mm:'Each render is a photograph: state is a value fixed for that render, and setting it schedules a new photograph rather than editing this one.'

  {
    id:'12', t:'State is immutable: objects and arrays',
    what:[
      'React compares the old state value with the new one to decide whether anything changed. For objects and arrays it compares references, not contents.',
      'So editing an object in place and passing it back does nothing: the reference is identical, React concludes nothing changed, and your screen does not update. You must create a new object or array.'

    why:[

    code:`function App() {\n  const [user, setUser] = useState({ name: 'Ada', prefs: { theme: 'light' } });\n  const [list, setList] = useState(['pen', 'ink']);\n\n  return (\n    <div>\n      <p>{user.name} likes {user.prefs.theme}</p>\n\n      {/* WRONG: same reference, no re-render */}\n      <button onClick={() => { user.name = 'Grace'; setUser(user); }}>\n        Broken rename\n      </button>\n\n      {/* RIGHT: new object, old fields spread in */}\n      <button onClick={() => setUser({ ...user, name: 'Grace' })}>\n        Rename\n      </button>\n\n      {/* nested: copy every level you change */}\n      <button onClick={() => setUser({\n        ...user,\n        prefs: { ...user.prefs, theme: 'dark' }\n      })}>\n        Dark theme\n      </button>\n\n      <p>{list.join(', ')}</p>\n      <button onClick={() => setList([...list, 'paper'])}>Add</button>\n      <button onClick={() => setList(list.filter(i => i !== 'ink'))}>Remove ink</button>\n      <button onClick={() => setList(list.map(i => i === 'pen' ? 'PEN' : i))}>\n        Shout pen\n      </button>\n    </div>\n  );\n}`,

    mistakes:[

      ['Deep-copying with JSON.parse(JSON.stringify(x))','','It works and is occasionally pragmatic, but it drops Dates, Maps, undefined, and functions, and it copies parts you did not change. Prefer copying only the path you are editing.'],

    ex:{

      sol:`function App() {\n  const [tasks, setTasks] = useState([\n    { id: 1, text: 'Read', done: false },\n    { id: 2, text: 'Write', done: true }\n  ]);\n\n  function toggle(id) {\n    setTasks(prev =>\n      prev.map(t => (t.id === id ? { ...t, done: !t.done } : t))\n    );\n  }\n\n  return (\n    <ul>\n      {tasks.map(t => (\n        <li key={t.id}>\n          <label>\n            <input type="checkbox" checked={t.done} onChange={() => toggle(t.id)} />\n            {t.done ? <s>{t.text}</s> : t.text}\n          </label>\n        </li>\n      ))}\n    </ul>\n  );\n}`,

  {
    id:'13', t:'Updater functions and batching',
    what:[
      'A setter accepts either a value or a function. The function form receives the latest pending state and returns the next one: setCount(c => c + 1).',
      'React batches state updates. Several setter calls in the same tick are collected and applied in one re-render, in order. Since React 18 this includes calls inside timeouts, promises, and native event handlers.'
