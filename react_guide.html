  fa:`<p>Two copies means two truths, plus an extra render per change and a window where they disagree. It also fails as soon as a third component appears. One owner, one value.</p>`
},
{
  d:'Medium', topic:'Context',
  q:`Build a theme context with a light and dark toggle. What is the re-render cost of context, and how do you mitigate it?`,
  a:`<p>Create the context, hold the state in a provider component, and expose it through a named hook so consumers do not import the context directly and get a useful error when the provider is missing.</p><p>The cost is that every consumer re-renders whenever the provider's value changes, and there is no way to subscribe to part of the value. Three mitigations: memoise the value object so it is not new on every provider render, split the context so the stable half, usually the dispatch or api, is separate from the changing half, and keep fast-changing state out of a wide context entirely.</p>`,
  code:`const ThemeContext = createContext(null);\n\nfunction ThemeProvider({ children }) {\n  const [dark, setDark] = useState(false);\n  const value = useMemo(\n    () => ({ dark, toggle: () => setDark(d => !d) }),\n    [dark]\n  );\n  return <ThemeContext.Provider value={value}>{children}</ThemeContext.Provider>;\n}\n\nfunction useTheme() {\n  const ctx = useContext(ThemeContext);\n  if (!ctx) throw new Error('useTheme needs a ThemeProvider');\n  return ctx;\n}`,
  fq:`Why does the useMemo matter if dark has not changed?`,
  fa:`<p>Because the provider re-renders for other reasons too, for example when its own parent renders. Without the memo, value is a new object each time and every consumer re-renders even though the theme is identical.</p>`
},
{
  d:'Medium', topic:'Performance',
  q:`useMemo versus useCallback versus React.memo. When does each actually help?`,
  a:`<p>useMemo caches a value, useCallback caches a function, React.memo skips a component render when its props are shallowly equal. All three are caches keyed on a dependency array, and all three cost memory and a comparison.</p><p>useMemo helps for a computation you have measured as expensive, or when the result's identity feeds a dependency array or a memoised child. useCallback helps when the function is passed to a memoised child or listed as a dependency. React.memo helps when a component re-renders often because of a parent you do not control and its own props rarely change. Everywhere else they make the code longer and slightly slower.</p>`,
  fq:`Would you reach for them if the React Compiler is enabled?`,
  fa:`<p>Not for identity plumbing, which is exactly what the compiler automates. I would keep them for a measured expensive computation where the cache should be explicit and reviewable, for a stable reference demanded by a non-React API, and where identity is semantics rather than performance.</p>`
},
{
  d:'Medium', topic:'Performance',
  q:`Why does React.memo not help if you pass a new inline callback prop?`,
  a:`<p>Because memo compares props by reference with Object.is, and an arrow function created in the parent's body is a new object on every render. The comparison always fails, so the child re-renders and you have paid for the comparison as well.</p><p>The same applies to object and array literals, and to children, since JSX creates a new element object each render. Either stabilise the prop with useCallback or useMemo, hoist it if it is constant, or accept the re-render, which is usually the right answer.</p>`,
  code:`const Row = memo(function Row({ item, onPick }) { /* ... */ });\n\n// memo can never hit: new function every render\n<Row item={item} onPick={id => setPicked(id)} />\n\n// memo works\nconst onPick = useCallback(id => setPicked(id), []);\n<Row item={item} onPick={onPick} />`,
  fq:`How would you confirm the memo is actually working?`,
  fa:`<p>The Profiler in React DevTools, with "record why each component rendered" turned on: it names the prop that changed. Comparing actualDuration with baseDuration on a Profiler boundary tells you whether the memoisation is buying anything at all.</p>`
},
{
  d:'Medium', topic:'Effects',
  q:`useEffect versus useLayoutEffect.`,
  a:`<p>Same signature, same cleanup, different timing. useEffect runs after the browser has painted; useLayoutEffect runs after the DOM is updated but before the paint, so anything it changes is included in the frame the user sees.</p><p>Use the layout version only to read layout and immediately adjust it: positioning a tooltip, autosizing a textarea, restoring scroll. It blocks painting, so slow work in one is felt directly as jank. It also does not run on the server, and React warns if it is in server-rendered code.</p>`,
  fq:`What is the visible symptom of using the wrong one?`,
  fa:`<p>A one-frame flicker: the element is painted in its unadjusted position and then snaps. It is most obvious with a tooltip flipping above a trigger, or a growing textarea jumping on each keystroke.</p>`
},
{
  d:'Medium', topic:'Hooks',
  q:`useRef versus state. When is a re-render undesirable?`,
  a:`<p>State is what the screen is made of: change it and React re-renders. A ref is a mutable box that survives renders and never triggers one, so it is for values the render output does not depend on.</p><p>The clear cases are a timer or request id, a previous value kept for comparison, a mutable flag, and a handle on a DOM node. The test is simple: if the UI must change when the value changes, it is state; if nothing on screen depends on it, a ref avoids pointless renders.</p>`,
  code:`const timer = useRef(null);\n\nfunction start() {\n  if (timer.current !== null) return;   // already running\n  timer.current = setInterval(() => setMs(t => t + 100), 100);\n}\nfunction stop() {\n  clearInterval(timer.current);\n  timer.current = null;\n}`,
  fq:`Why should you not read or write a ref during render?`,
  fa:`<p>It makes render impure, and under concurrent rendering React may render, discard, and re-render, so the value is unreliable. Refs are for handlers and effects. The exceptions are lazily initialising one when it is null, and DOM refs, which are only attached after commit and are null during the first render.</p>`
},
{
  d:'Medium', topic:'Effects',
  q:`What is a stale closure? Show one and fix it three ways.`,
  a:`<p>A stale closure is a function that captured props or state from an old render and keeps using them. It happens because every render creates new closures, and anything long-lived, a timer, a subscription, an effect with an empty dependency array, holds on to the one it was created with.</p><p>Three fixes, in the order I would consider them: make the code read nothing stale, usually with an updater function; list the value as a dependency and accept the re-subscription; or keep the latest value in a ref, and in React 19.2 use useEffectEvent, which is the same idea with lint support and no plumbing.</p>`,
  code:`// stale: logs the first filter forever\nuseEffect(() => {\n  const id = setInterval(() => console.log(filter), 1000);\n  return () => clearInterval(id);\n}, []);\n\n// fix 1: depend on it, and accept that the timer restarts\nuseEffect(() => {\n  const id = setInterval(() => console.log(filter), 1000);\n  return () => clearInterval(id);\n}, [filter]);\n\n// fix 2: a ref holds the latest value, timer keeps running\nconst filterRef = useRef(filter);\nfilterRef.current = filter;\nuseEffect(() => {\n  const id = setInterval(() => console.log(filterRef.current), 1000);\n  return () => clearInterval(id);\n}, []);\n\n// fix 3: React 19.2, an effect event\nconst report = useEffectEvent(() => console.log(filter));\nuseEffect(() => {\n  const id = setInterval(report, 1000);\n  return () => clearInterval(id);\n}, []);`,
  fq:`How do you decide between depending on the value and using useEffectEvent?`,
  fa:`<p>By asking whether a change should restart the effect. If switching rooms should reconnect the socket, the room id is reactive and belongs in the array. If the effect merely reads the current theme when it logs something, that is not reactive, and an effect event says so without lying to the linter.</p>`
},
{
  d:'Medium', topic:'Hooks',
  q:`What makes something a custom hook, and do two components using the same hook share state?`,
  a:`<p>A hook is a function whose name starts with use and which calls other hooks. The prefix is not decoration: it is how the lint rules and the compiler know the call has hook semantics, so rules of hooks apply inside it.</p><p>They do not share state. Each call site gets its own independent state, exactly as two useState calls would. Hooks share logic; sharing state needs a common parent, a context, or a store. That misunderstanding is a very common source of confusion, so saying it plainly is worth marks.</p>`,
  code:`function useToggle(initial = false) {\n  const [on, setOn] = useState(initial);\n  return [on, useCallback(() => setOn(o => !o), [])];\n}\n\n// two independent booleans\nconst [menuOpen, toggleMenu] = useToggle();\nconst [modalOpen, toggleModal] = useToggle();`,
  fq:`When is extracting a hook premature?`,
  fa:`<p>When there is exactly one caller and the component was readable. A hook used once is often just indirection with a new filename. Extract on the second caller, or when the component has grown hard to follow.</p>`
},
{
  d:'Medium', topic:'Errors',
  q:`Error boundaries: what do they catch, and what do they not?`,
  a:`<p>They catch errors thrown during rendering, in lifecycle methods, and in constructors of the subtree below them, and render a fallback instead of letting the error reach the root and unmount everything.</p><p>They do not catch errors in event handlers, in asynchronous code such as a promise rejection or a setTimeout callback, during server rendering, or thrown by the boundary itself. Those need ordinary try/catch and a failure state. They are also still class components, because getDerivedStateFromError and componentDidCatch have no hook equivalent.</p>`,
  code:`class ErrorBoundary extends React.Component {\n  state = { error: null };\n  static getDerivedStateFromError(error) { return { error }; }   // render phase\n  componentDidCatch(error, info) { report(error, info.componentStack); }  // commit phase\n  render() {\n    return this.state.error\n      ? <Fallback onRetry={this.props.onReset} />\n      : this.props.children;\n  }\n}`,
  fq:`Where do you put boundaries, and how do you make a retry actually work?`,
  fa:`<p>Around each region that can fail independently, so a broken chart does not cost the navigation, plus one at the root for the unexpected. Clearing the boundary's own error re-renders the same broken child, so the retry must fix the cause and then remount, usually by bumping a value used as the boundary's key.</p>`
},
{
  d:'Medium', topic:'Internals',
  q:`How does React decide whether to update a component or remount it?`,
  a:`<p>Three things: the element type, the position in the tree, and the key. Same type in the same position with the same key means React keeps the instance, keeps its state, keeps the DOM node, and updates the props. Change the type or the key and it unmounts the subtree and builds a new one.</p><p>That is why wrapping a component in a conditional div clears its state, why swapping one component for another at the same position resets everything, and why changing a key is the deliberate way to force a reset.</p>`,
  code:`// state survives: same type, same position\n<Box label={renamed ? 'b' : 'a'} />\n\n// remounts: the type at this position changed\n{cond ? <Box /> : <section><Box /></section>}\n\n// remounts on purpose\n<Notes key={userId} userId={userId} />`,
  fq:`Two different components happen to sit at the same position on alternate renders. What happens to the DOM?`,
  fa:`<p>The whole subtree is torn down and rebuilt: nodes destroyed, effects cleaned up, state lost, refs detached and reattached. If they are structurally similar and you want to keep the DOM, render one component with different props instead.</p>`
},
{
  d:'Medium', topic:'State',
  q:`How do you reset a child component's state when a prop changes?`,
  a:`<p>Give the child a key derived from the prop. Changing the key makes React unmount the old instance and mount a fresh one, so its state starts from the initial value, and the child needs no code at all.</p><p>The alternatives are worse. An effect that watches the prop and calls setters renders twice and leaves a moment where the old state is shown with the new prop. Mirroring the prop into state with useState(props.value) freezes it on the first render and then ignores the prop.</p>`,
  code:`// the whole fix\n<Notes key={userId} userId={userId} />\n\n// what people write instead\nuseEffect(() => { setText(''); }, [userId]);   // extra render, stale frame`,
  fq:`When is the key trick the wrong tool?`,
  fa:`<p>When only part of the state should reset, or when remounting is expensive: a mount means new effects, refetching, and losing scroll position. Then reset explicitly during the event that caused the change, or split the component so only the resettable part is keyed.</p>`
},
{
  d:'Medium', topic:'Hooks',
  q:`Debounce a search input. Now do it as a reusable hook.`,
  a:`<p>Debouncing means waiting for a pause before acting. In React the tidiest version is a hook that holds a delayed copy of a value: an effect sets a timer whenever the value changes, and the cleanup cancels the previous timer, so only a pause produces an update.</p><p>Then you type against the live state, which keeps the input responsive, and fetch against the debounced value. The alternative, debouncing the callback itself, needs a stable reference and a cleanup on unmount, and gets tangled quickly.</p>`,
  code:`function useDebounce(value, delay = 400) {\n  const [debounced, setDebounced] = useState(value);\n  useEffect(() => {\n    const id = setTimeout(() => setDebounced(value), delay);\n    return () => clearTimeout(id);   // cancels the pending timer\n  }, [value, delay]);\n  return debounced;\n}\n\nconst [text, setText] = useState('');\nconst query = useDebounce(text, 300);\nuseEffect(() => { if (query) search(query); }, [query]);`,
  fq:`Debounce, throttle, or useDeferredValue?`,
  fa:`<p>Debounce when the expensive part is a request and you want one per pause. Throttle when you want a steady rate during a continuous stream, such as scroll or resize. useDeferredValue when the expensive part is rendering rather than fetching, since it keeps the stale UI on screen and lets React interrupt the new render instead of guessing a delay.</p>`
},
{
  d:'Medium', topic:'Performance',
  q:`Render a list of 10,000 items efficiently.`,
  a:`<p>Do not render 10,000 items. Virtualise: render only the rows in the viewport plus a small buffer, and give the scroll container a spacer with the full height so the scrollbar still behaves. Twenty nodes get recycled as the user scrolls.</p><p>In production I would use TanStack Virtual or react-window rather than hand-rolling it, because variable row heights, scroll-to-index, sticky headers, and find-in-page are where the effort actually goes. And I would ask first whether the user needs 10,000 rows at all: search, filters, or pagination is often the better answer, and filtering that many rows on the client is usually work that belongs on the server.</p>`,
  code:`const first = Math.max(0, Math.floor(scrollTop / ROW_H) - BUFFER);\nconst slice = rows.slice(first, first + visibleCount);\n\n<div onScroll={e => setScrollTop(e.currentTarget.scrollTop)}\n     style={{ height: VIEW_H, overflowY: 'auto' }}>\n  <div style={{ height: rows.length * ROW_H, position: 'relative' }}>\n    {slice.map((row, i) => (\n      <div key={row.id} style={{ position: 'absolute', top: (first + i) * ROW_H }}>\n        {row.name}\n      </div>\n    ))}\n  </div>\n</div>`,
  fq:`What does virtualisation break?`,
  fa:`<p>Anything that assumes the rows exist: the browser's find-in-page, tabbing to an off-screen control, and screen reader navigation unless you supply the right ARIA grid roles. Provide a search so users are not relying on find-in-page, and use a library that handles the roles.</p>`
},
{
  d:'Medium', topic:'Patterns',
  q:`Portals: what problem do they solve, and how do events bubble through them?`,
  a:`<p>They solve CSS containment. A parent with overflow hidden clips a dropdown, a transform breaks position fixed, and a stacking context traps z-index, and none of that is fixable from inside the component. createPortal renders the children into another DOM node, usually document.body, so the overlay escapes all of it.</p><p>The child stays in the React tree, so props, state, and context work normally, and React events bubble through the tree rather than the DOM: a click inside the portal reaches the handlers of its React ancestors even though the node is elsewhere in the document.</p>`,
  code:`return createPortal(\n  <div className="overlay" onClick={onClose}>\n    <div role="dialog" aria-modal="true" onClick={e => e.stopPropagation()}>\n      {children}\n    </div>\n  </div>,\n  document.body\n);`,
  fq:`Where does that bubbling behaviour surprise people?`,
  fa:`<p>With native listeners. A handler added with addEventListener on an ancestor DOM node will not see portal clicks, because the portal node is not its descendant. Only React's synthetic events follow the tree, which also means a click-outside handler on document fires for clicks inside the portal.</p>`
},
{
  d:'Medium', topic:'Performance',
  q:`How would you code-split a route with lazy and Suspense?`,
  a:`<p>Declare the component with lazy at module level, pointing at a dynamic import, and render it inside a Suspense boundary with a fallback shaped like the content. The bundler splits the import into its own chunk automatically, so the code is fetched the first time that route renders.</p><p>Route level is the biggest win and the easiest boundary. Two refinements matter in practice: preload the chunk on hover or focus of the link, so the click feels instant, and wrap the boundary in an error boundary, because a chunk request can fail after a deploy changes the file names.</p>`,
  code:`const Reports = lazy(() => import('./Reports'));   // module level, not in render\n\nconst page = (\n  <ErrorBoundary>\n    <Suspense fallback={<Skeleton />}>\n      {route === 'reports' && <Reports />}\n    </Suspense>\n  </ErrorBoundary>\n);\n\n// warm the cache before the click\nconst link = (\n  <a onMouseEnter={() => import('./Reports')} href="/reports">Reports</a>\n);`,
  fq:`What goes wrong if you call lazy inside the component?`,
  fa:`<p>You create a new lazy component on every render, so React sees a different type each time: it remounts, refetches, and the fallback flashes forever. The module registry caches the import promise, which is what makes preloading on hover free, but only if the lazy call itself is stable.</p>`
},
{
  d:'Medium', topic:'TypeScript',
  q:`How do you type a component's props, children, and event handlers?`,
  a:`<p>Annotate the destructured props object with an interface, let inference handle state and return values, and type children as React.ReactNode. Handlers are typed by signature, and DOM events use React's generics, such as React.ChangeEvent&lt;HTMLInputElement&gt;.</p><p>Two things I avoid: React.FC, because it adds an implicit children prop whether the component accepts one or not and interacts badly with generics, and any, which switches the checker off exactly where I was unsure.</p>`,
  code:`interface CardProps {\n  title: string;\n  count?: number;\n  status: 'idle' | 'loading' | 'error';\n  onSelect: (id: string) => void;\n  children?: React.ReactNode;\n}\n\nfunction Card({ title, count = 0, status, onSelect, children }: CardProps) {\n  const inputRef = useRef<HTMLInputElement>(null);\n  const [picked, setPicked] = useState<string | null>(null);\n\n  function handleChange(e: React.ChangeEvent<HTMLInputElement>) {\n    onSelect(e.target.value);\n  }\n  // ...\n}`,
  fq:`How would you type a component that must have either onClick or href, never both?`,
  fa:`<p>A discriminated union of two interfaces, with href?: never in the click variant and onClick?: never in the link variant, then narrow inside with the in operator. It makes the impossible combination a compile error, and it usually reveals that you had two components wearing one name.</p>`
},
{
  d:'Medium', topic:'State',
  q:`Why is immutability important to React?`,
  a:`<p>React decides whether something changed by comparing references with Object.is, not by comparing contents. Comparing a deep object tree on every keystroke would be far too slow, so the deal is that you produce new objects and arrays instead of editing the old ones.</p><p>Break the deal and you get the most confusing failure mode in React: no error, no warning, and a screen that does not update, because the reference is identical. The same rule powers memoisation comparisons, dependency arrays, and features like undo history and time-travel debugging.</p>`,
  code:`// silent no-op: same reference\nuser.name = 'Grace';\nsetUser(user);\n\n// correct\nsetUser({ ...user, name: 'Grace' });\n\n// nested: copy every level you change\nsetUser({ ...user, prefs: { ...user.prefs, theme: 'dark' } });\n\n// arrays: map, filter, slice, concat, toSorted — never push, splice, sort, reverse`,
  fq:`Spreading is shallow. When does that bite?`,
  fa:`<p>When you copy the top level and then mutate something nested, because the copy shares those references: const next = { ...user }; next.prefs.theme = "dark" changes the original. Copy the whole path you are editing, flatten the state, or use Immer.</p>`
},
{
  d:'Medium', topic:'Effects',
  q:`What are the common causes of an infinite re-render loop?`,
  a:`<p>Four, in rough order of frequency. Calling a setter during render, including onClick={setOpen(true)} without an arrow. An effect that sets state with no dependency array, so every render triggers another. An effect whose dependency has a new identity every render, usually an object, array, or function literal. And a getSnapshot in useSyncExternalStore that returns a fresh object each call.</p><p>The error message names it: "Too many re-renders", or "Maximum update depth exceeded" with a hint about useEffect dependencies. The fix is never to delete the dependency, because that converts a visible loop into an invisible stale value.</p>`,
  code:`// during render\nconst wrong = <button onClick={setOpen(true)}>Open</button>;   // calls it now\nconst right = <button onClick={() => setOpen(true)}>Open</button>;\n\n// no dependency array\nuseEffect(() => { setTotal(sum(items)); });        // loops\nconst total = sum(items);                          // just compute it\n\n// unstable dependency\nuseEffect(() => {}, [{ min: 0 }]);   // new object each render\nuseEffect(() => {}, [range.min]);    // primitive`,
  fq:`How do you find which dependency is unstable?`,
  fa:`<p>Log the dependencies in the effect, or diff them against a ref holding the previous array. In DevTools, the Profiler's "why did this render" tells you which prop or state changed. Nine times out of ten it is a literal in the parent's render body or a function that should have been hoisted or wrapped.</p>`
},
{
  d:'Medium', topic:'Testing',
  q:`How would you test a component that fetches data?`,
  a:`<p>Mock at the network boundary, not inside the component, then assert on what the user sees at each stage: the loading state, the rendered data, and the error state. React Testing Library queries by role and label, and findBy queries wait for the asynchronous update without arbitrary timeouts.</p><p>I prefer MSW over stubbing fetch, because it intercepts at the network level, so the component keeps using the real fetch and the same handlers work for tests and local development. Mocking the component's own hooks or children couples the test to the implementation and passes when the feature is broken.</p>`,
  code:`test('shows users, then handles a failure', async () => {\n  server.use(http.get('/api/users', () => HttpResponse.json([{ id: 1, name: 'Ada' }])));\n  render(<UserList />);\n\n  expect(screen.getByText(/loading/i)).toBeInTheDocument();\n  expect(await screen.findByRole('listitem')).toHaveTextContent('Ada');\n\n  server.use(http.get('/api/users', () => new HttpResponse(null, { status: 500 })));\n  await userEvent.click(screen.getByRole('button', { name: /refresh/i }));\n  expect(await screen.findByRole('alert')).toBeInTheDocument();\n});`,
  fq:`What causes the "not wrapped in act" warning, and how do you avoid it?`,
  fa:`<p>A state update that happened after the test had moved on, typically an unawaited async resolution. Awaiting userEvent interactions and findBy queries handles act for you. Adding act by hand usually hides the real problem, which is that the test asserted before the update landed.</p>`
}
);
INTERVIEW.push(
{
  d:'Hard', topic:'Internals',
  q:`Walk through React's render and commit phases.`,
  a:`<p>Render phase: React calls your components and builds a tree of element objects, then reconciles it against the previous tree to work out what changed. This phase must be pure, because React may call a component twice, pause between components, or throw the work away and start again. Nothing is on screen yet.</p><p>Commit phase: React applies the changes to the DOM in one synchronous pass, attaches refs, runs layout effects, lets the browser paint, then runs passive effects. It is synchronous and uninterruptible because a half-applied DOM is not a valid state to show anyone.</p><p>That split is the whole basis of concurrent React: an interruptible description phase and an atomic application phase.</p>`,
  fq:`Given that split, why is a ref null during render?`,
  fa:`<p>Because refs are attached during commit, and the render that would read them happens before the DOM exists. The same reason explains why measuring layout belongs in useLayoutEffect and why side effects in the render body run at unpredictable times.</p>`
},
{
  d:'Hard', topic:'Concurrency',
  q:`What is concurrent rendering, and what does useTransition solve that useState cannot?`,
  a:`<p>Concurrent rendering means React can prepare a render in the background, pause it, abandon it, and keep the current UI interactive meanwhile. Updates carry a priority: a keystroke is urgent, a large filtered list re-rendering because of that keystroke is not.</p><p>Plain useState makes every update urgent, so one long render blocks the browser, including the keystroke that caused it. useTransition marks the expensive update as interruptible and gives you an isPending flag, so the input commits immediately, the expensive part renders in the background, and a second keystroke abandons the in-flight render instead of queueing behind it.</p>`,
  code:`const [isPending, startTransition] = useTransition();\n\nfunction onChange(e) {\n  setText(e.target.value);                              // urgent\n  startTransition(() => setQuery(e.target.value));      // interruptible\n}\n\n<div style={{ opacity: isPending ? 0.6 : 1 }}>\n  <ExpensiveResults query={query} />\n</div>`,
  fq:`Does a transition make the render faster?`,
  fa:`<p>No. It changes the ordering and allows interruption. If the list takes 200ms it still takes 200ms; the difference is that the app stays responsive while it happens. If the render is slow, the actual fixes are doing less work, memoising the computation, or virtualising.</p>`
},
{
  d:'Hard', topic:'Concurrency',
  q:`useDeferredValue versus useTransition. When do you reach for each?`,
  a:`<p>Both mark work as non-urgent; they differ in what you have access to. useTransition wraps a state update, so you need to own the event that causes it, and it gives you a pending flag. useDeferredValue takes a value and returns a lagging copy, so it works when the value arrives as a prop and you cannot touch the setter.</p><p>The other difference is what the user sees. A transition keeps the old UI while the new one renders. useDeferredValue explicitly hands you a stale value to render, which is also the way to avoid a Suspense fallback replacing content that is already on screen.</p>`,
  code:`// I own the setter: transition, with a pending flag\nstartTransition(() => setTab(next));\n\n// the value comes in as a prop: defer it\nfunction Results({ query }) {\n  const deferred = useDeferredValue(query);\n  const stale = deferred !== query;\n  return <div style={{ opacity: stale ? 0.6 : 1 }}><List query={deferred} /></div>;\n}`,
  fq:`Is it worth using useDeferredValue on a cheap component?`,
  fa:`<p>No: it costs two renders instead of one for no benefit. It only pays when the render it defers is genuinely expensive, which means it should follow a profile rather than an instinct.</p>`
},
{
  d:'Hard', topic:'Performance',
  q:`What does the React Compiler do, and does it make useMemo and useCallback obsolete?`,
  a:`<p>It is a build-time tool, stable since 1.0 in October 2025, that inserts memoisation automatically. It understands data flow and mutability well enough to cache components, values, and functions where you would have written React.memo, useMemo, and useCallback, including on conditional paths manual memoisation cannot reach. It also runs validation passes encoding the Rules of React, surfaced through eslint-plugin-react-hooks.</p><p>It makes the identity plumbing obsolete, which is most of what people write. Three cases survive: a measured expensive computation where an explicit, reviewable cache is worth having; a stable reference demanded by a non-React API such as an observer or a map library; and a value used in a dependency array, where identity is semantics rather than performance.</p>`,
  fq:`What are the prerequisites, and what can it not fix?`,
  fa:`<p>It relies on your components obeying the rules, so mutating props, writing to module state during render, or reading a ref in the render body can break under automatic memoisation. That is why the linter matters more than the compiler. It also cannot virtualise a list, split a bundle, or make a slow algorithm fast.</p>`
},
{
  d:'Hard', topic:'Server',
  q:`Server Components versus Client Components: what is the boundary, what serialises across it, and what breaks?`,
  a:`<p>A Server Component runs only on the server, never ships to the browser, and can be async and await data directly. It has no state, no effects, and no event handlers. The 'use client' directive marks a file as an entry point into client code, and everything that file imports joins the client bundle.</p><p>What crosses is serialisable data: strings, numbers, plain objects and arrays, Dates, Maps, Sets, null, promises, JSX elements, and references to Server Functions. What does not: functions, class instances with methods, and anything holding a DOM node or a connection.</p><p>The direction is one-way. Server Components can render Client Components and pass them props; a Client Component cannot import a Server Component, but it can receive server-rendered output as children. That is the key trick: an interactive client tab bar can wrap server-rendered panels, so the markdown renderer never reaches the browser.</p>`,
  code:`// app/page.jsx  — Server Component, no directive\nexport default async function Page() {\n  const article = await db.article.find();     // no effect, no loading state\n  return (\n    <Tabs labels={['Article', 'Comments']}>    {/* client island */}\n      <ArticleBody html={render(article.md)} /> {/* server-rendered child */}\n      <CommentBox />                            {/* client island */}\n    </Tabs>\n  );\n}\n\n// components/Tabs.jsx\n'use client';\nexport function Tabs({ labels, children }) { /* useState here */ }`,
  fq:`Are Server Components the same as server-side rendering?`,
  fa:`<p>No, and conflating them is a common mistake. SSR renders your client tree to HTML for the first paint, then hydrates it. Server Components decide which components exist on the client at all, and are never hydrated because they never ship. A framework typically does both, and Server Components are what actually cut the bundle.</p>`
},
{
  d:'Hard', topic:'React 19',
  q:`Explain Actions in React 19, and implement an optimistic like button with useOptimistic.`,
  a:`<p>An action is an async function passed to a form's action prop, or run inside a transition. React manages the pending state, the ordering, and the errors, which removes the four pieces of state every hand-rolled submit handler grows: pending, error, result, and an optimistic copy.</p><p>useOptimistic shows an assumed value while the action is in flight and drops it when the action settles. The important consequence is that the failure path needs no rollback code: the optimistic value only ever existed for the duration of the transition, so when it ends React renders from real state again.</p>`,
  code:`function LikeButton({ initial }) {\n  const [likes, setLikes] = useState(initial);\n  const [optimistic, addOptimistic] = useOptimistic(likes, (n, delta) => n + delta);\n  const [isPending, startTransition] = useTransition();\n\n  function like() {\n    startTransition(async () => {\n      addOptimistic(1);                 // instant\n      try {\n        setLikes(await saveLike(likes + 1));\n      } catch {\n        setFailed(true);                // React drops the optimistic value for us\n      }\n    });\n  }\n\n  return <button onClick={like} disabled={isPending}>♥ {optimistic}</button>;\n}`,
  fq:`Why is that safer than setting real state and undoing it in a catch?`,
  fa:`<p>Because manual rollback breaks under interleaving. Two rapid clicks, one failing and one succeeding, and your undo subtracts from a number that has already moved on, leaving the count permanently wrong. React ties the optimistic value to the lifetime of the action, so there is nothing to undo.</p>`
},
{
  d:'Hard', topic:'React 19',
  q:`How do useActionState and useFormStatus relate to form actions?`,
  a:`<p>They are two views of the same mechanism. useActionState wraps an action and returns [state, dispatch, isPending]: the action receives the previous state and the FormData, and whatever it returns becomes the new state, which is why validation errors are returned rather than thrown. You pass the dispatch to the form's action prop.</p><p>useFormStatus is for descendants. It reads the nearest ancestor form's pending state, so a shared design-system submit button can disable itself without every form threading a pending prop down to it. It comes from react-dom, not react, and it returns nothing useful in the component that renders the form itself.</p>`,
  code:`const [error, submit, isPending] = useActionState(async (prev, formData) => {\n  const text = formData.get('note');\n  if (!text) return 'Write something first.';    // returned, not thrown\n  try { await save(text); return null; }\n  catch (e) { return e.message; }\n}, null);\n\nfunction SubmitButton() {\n  const { pending } = useFormStatus();           // from 'react-dom'\n  return <button type="submit" disabled={pending}>{pending ? 'Saving…' : 'Save'}</button>;\n}\n\n<form action={submit}><input name="note" /><SubmitButton /></form>`,
  fq:`What happens if you throw from an action instead of returning the error?`,
  fa:`<p>It propagates to the nearest error boundary and unmounts the form, losing whatever the user typed. Return expected failures as state; throw only for genuine bugs. The same reasoning as never using a boundary for a 404.</p>`
},
{
  d:'Hard', topic:'React 19',
  q:`The use hook: how is it different from other hooks, and what is the promise-caching pitfall?`,
  a:`<p>use reads a promise or a context during render. If the promise is pending the component suspends and the nearest Suspense boundary shows its fallback; when it resolves React renders again and use returns the value. Unlike every other hook it stores nothing in the hook list, so it may be called conditionally or in a loop.</p><p>The pitfall is that rendering is not a one-off. Create the promise during render and every attempt creates a new one, which suspends again immediately: an infinite loop. The promise must be created outside render and cached, which in practice means a framework, a query library, or your own cache keyed by the request.</p>`,
  code:`const cache = new Map();\n\nfunction fetchUser(id) {\n  if (!cache.has(id)) cache.set(id, fetch('/api/users/' + id).then(r => r.json()));\n  return cache.get(id);   // same promise for the same id\n}\n\nfunction UserName({ id }) {\n  const user = use(fetchUser(id));   // suspends, then returns\n  return <p>{user.name}</p>;\n}\n\n// wrong: a new promise on every render attempt\nconst user = use(fetch('/api/users/' + id).then(r => r.json()));`,
  fq:`Does this replace a query library?`,
  fa:`<p>No. There is no invalidation, no refetching, no deduplication across components, no stale-while-revalidate, and a rejected promise stays rejected in your cache until you evict it, so a retry needs a cache.delete plus a remount. Those gaps are exactly what TanStack Query exists to fill. You also need an error boundary beside the Suspense boundary, since a rejection throws from use.</p>`
},
{
  d:'Hard', topic:'Server',
  q:`What is hydration? What causes a mismatch and how do you debug one?`,
  a:`<p>Hydration is React adopting server-rendered HTML: instead of building the DOM, it walks the existing nodes, attaches event handlers, and takes ownership. That is what makes the first paint real content and the next moment a working app.</p><p>It requires the first client render to match the server's output. Mismatches come from values that differ between machines, dates, locales, time zones, Math.random, reading window or localStorage during render, and from invalid HTML nesting that the browser silently repairs, such as a div inside a p. Debugging: read the warning, which names the element and both texts, then check those three categories in order. The generic fix for browser-only values is to render the server-safe version first and upgrade after mount.</p>`,
  code:`function useMounted() {\n  const [mounted, setMounted] = useState(false);\n  useEffect(() => setMounted(true), []);\n  return mounted;\n}\n\nfunction LocalTime() {\n  const mounted = useMounted();\n  if (!mounted) return <span>—</span>;              // matches the server\n  return <span>{new Date().toLocaleTimeString()}</span>;\n}`,
  fq:`When is suppressHydrationWarning acceptable?`,
  fa:`<p>For a single element whose text legitimately differs, such as a timestamp, and only after you know the structure matches. It silences the warning for that element's content and fixes nothing else, so using it on a structural mismatch leaves hydration broken and the interactivity subtly wrong.</p>`
},
{
  d:'Hard', topic:'Server',
  q:`Selective and progressive hydration: what do they buy the user?`,
  a:`<p>Progressive hydration means the page becomes interactive in pieces as their code and data arrive, rather than all at once when the last chunk lands. Selective hydration means React prioritises the piece the user just interacted with: click a button in a section that has not hydrated yet, and React hydrates that subtree first, then replays the event.</p><p>The user-visible effect is a much shorter gap between "looks ready" and "responds", and no dependency on the slowest part of the page. Suspense boundaries are the unit for both, which is a good reason to place them around independently useful regions rather than only at the root.</p>`,
  fq:`How does streaming SSR fit in?`,
  fa:`<p>renderToPipeableStream sends HTML as it is produced, with Suspense fallbacks in the markup and the real content patched in as slower parts resolve. So the first byte does not wait for the slowest query, and the same boundaries then drive hydration order. Streaming and selective hydration are the send side and the receive side of one design.</p>`
},
{
  d:'Hard', topic:'Server',
  q:`SSR, SSG, ISR, CSR: pick one for a dashboard, a blog, and an e-commerce catalogue, and defend each.`,
  a:`<p>Dashboard: SSR for the shell, or CSR behind the login. It is per-user, changes constantly, nothing is cacheable, and it is behind auth so indexing is irrelevant. Stream the shell for a fast first paint and load the data per request.</p><p>Blog: SSG. Identical for every reader, changes when an author publishes, and wants to be indexed. Build once, serve from a CDN, rebuild on publish.</p><p>Catalogue: ISR. Shared across users, too large to rebuild on every deploy, and prices and stock change hourly. Serve static, revalidate on an interval or on a tag when inventory changes, and fall back to SSR for the pages that must be exact, such as the basket and checkout.</p><p>The reasoning is the same each time: who is this page for, how often does it change, and does anyone need to index it.</p>`,
  fq:`What is the failure mode of ISR nobody mentions?`,
  fa:`<p>Stale content served confidently. The first visitor after the window gets the old page while regeneration happens in the background, so a price change can be visible in one place and not another. Anything money-critical needs on-demand revalidation on the write, or a server render at the point of purchase.</p>`
},
{
  d:'Hard', topic:'Architecture',
  q:`Design the component and state architecture for a data-heavy dashboard with filters, charts, and live updates.`,
  a:`<p>I would separate four kinds of state and give each its own home. Filters and the selected view go in the URL, so a dashboard is shareable, bookmarkable, and survives a reload. Server data goes in a query library, keyed by the filters, which gives caching, deduplication between widgets asking for the same thing, and refetch on focus for free. Ephemeral UI state, an open menu or a hovered series, stays local. Genuinely shared client state, a comparison basket or a pinned metric, goes in a small store with selectors so a change wakes only the widgets that read it.</p><p>Structurally: a layout shell that stays mounted, one component per widget with its own Suspense and error boundary so a failing chart does not cost the page, and heavy chart libraries lazily loaded. Live updates arrive on one socket at the top and are written into the query cache rather than into component state, so every widget reading that key updates once and consistently. Filter changes go through a transition with the previous data left visible and dimmed, which reads far better than every chart flashing to a spinner.</p>`,
  fq:`Ten widgets on one socket: how do you stop a burst of messages causing ten renders a second?`,
  fa:`<p>Batch at the boundary: accumulate messages in a ref and flush on an interval or with requestAnimationFrame, then write once into the cache. Selectors mean each widget only re-renders if its own slice changed, and a transition keeps the flush interruptible. If a chart still cannot keep up, sample the data for display rather than rendering every point.</p>`
},
{
  d:'Hard', topic:'Architecture',
  q:`How would you build a design-system component library: API design, composition, theming, accessibility?`,
  a:`<p>API design: small props, no boolean explosion. Where a component has genuinely different modes, a discriminated union rather than optional props that must not be combined. Every component forwards its ref and spreads the rest of its props onto the underlying element, so consumers are never blocked by something I did not anticipate. An as or asChild escape hatch for changing the rendered element.</p><p>Composition: compound components for anything with internal coordination, Tabs, Select, Accordion, so the consumer writes the markup and I own only the state and the keyboard behaviour.</p><p>Theming: CSS custom properties, so a theme is cascade rather than context, works without JavaScript, and does not re-render anything on change. Design tokens as the single source of truth.</p><p>Accessibility: build on an unstyled accessible primitive library rather than maintaining my own ARIA contracts, because focus traps, typeahead, and roving tabindex have more edge cases than a component library team can carry. Then test with the keyboard and a screen reader, not only with axe.</p>`,
  fq:`How do you keep it from turning into a fork of the app's product code?`,
  fa:`<p>By keeping product logic out: no data fetching, no domain vocabulary, no copy. If a component knows what an invoice is, it belongs in the app. That plus a versioning and deprecation policy, and visual regression tests, so consumers can upgrade without auditing every screen.</p>`
},
{
  d:'Hard', topic:'Patterns',
  q:`Build a Tabs component using the compound component pattern with full keyboard support.`,
  a:`<p>The outer component owns the selected value and provides it through context; TabList, Tab, and TabPanel read it. The consumer writes the structure, so a tab can contain an icon or a badge without the API growing a prop for each.</p><p>Keyboard support is the part people skip and the part the ARIA tabs pattern requires: one tab stop for the whole list using a roving tabindex, arrow keys to move between tabs, Home and End to jump to the ends, and aria-selected plus aria-controls derived from state so they cannot go stale.</p>`,
  code:`const TabsContext = createContext(null);\n\nfunction Tabs({ defaultValue, children }) {\n  const [value, setValue] = useState(defaultValue);\n  const ctx = useMemo(() => ({ value, setValue }), [value]);\n  return <TabsContext.Provider value={ctx}>{children}</TabsContext.Provider>;\n}\n\nfunction TabList({ children }) {\n  const { value, setValue } = useContext(TabsContext);\n  const values = React.Children.toArray(children).map(c => c.props.value);\n\n  function onKeyDown(e) {\n    const i = values.indexOf(value);\n    const go = n => { e.preventDefault(); setValue(values[n]); };\n    if (e.key === 'ArrowRight') go((i + 1) % values.length);\n    if (e.key === 'ArrowLeft') go((i - 1 + values.length) % values.length);\n    if (e.key === 'Home') go(0);\n    if (e.key === 'End') go(values.length - 1);\n  }\n\n  return <div role="tablist" onKeyDown={onKeyDown}>{children}</div>;\n}\n\nfunction Tab({ value: mine, children }) {\n  const { value, setValue } = useContext(TabsContext);\n  const selected = value === mine;\n  return (\n    <button role="tab" aria-selected={selected} aria-controls={'panel-' + mine}\n            tabIndex={selected ? 0 : -1} onClick={() => setValue(mine)}>\n      {children}\n    </button>\n  );\n}\n\nfunction TabPanel({ value: mine, children }) {\n  const { value } = useContext(TabsContext);\n  return value === mine\n    ? <div role="tabpanel" id={'panel-' + mine}>{children}</div>\n    : null;\n}`,
  fq:`Why context rather than cloning the children with extra props?`,
  fa:`<p>cloneElement only reaches one level, so it breaks the moment a consumer wraps a Tab in a div or a tooltip. Context reaches any depth and does not constrain the markup, which is the whole point of the pattern. It also means arrow-key focus should follow the selection, so a real implementation keeps refs to the tabs and calls focus after setValue.</p>`
},
{
  d:'Hard', topic:'State',
  q:`Implement useUndoRedo for a form.`,
  a:`<p>The state is three things: a past stack, the present value, and a future stack. A change pushes the present onto the past and clears the future. Undo pops from the past and pushes the present onto the future; redo does the mirror. A reducer is the natural fit, because every one of those transitions touches all three fields together.</p><p>Two details make it usable: cap the history so a long editing session does not grow without bound, and coalesce rapid changes, so typing a word is one undo step rather than five.</p>`,
  code:`function reducer(state, action) {\n  const { past, present, future } = state;\n  switch (action.type) {\n    case 'set':\n      if (action.value === present) return state;\n      return { past: [...past, present].slice(-50), present: action.value, future: [] };\n    case 'undo':\n      if (past.length === 0) return state;\n      return {\n        past: past.slice(0, -1),\n        present: past[past.length - 1],\n        future: [present, ...future]\n      };\n    case 'redo':\n      if (future.length === 0) return state;\n      return { past: [...past, present], present: future[0], future: future.slice(1) };\n    default:\n      throw new Error('unknown: ' + action.type);\n  }\n}\n\nfunction useUndoRedo(initial) {\n  const [state, dispatch] = useReducer(reducer, { past: [], present: initial, future: [] });\n  return {\n    value: state.present,\n    set: value => dispatch({ type: 'set', value }),\n    undo: () => dispatch({ type: 'undo' }),\n    redo: () => dispatch({ type: 'redo' }),\n    canUndo: state.past.length > 0,\n    canRedo: state.future.length > 0\n  };\n}`,
  fq:`Why does this pattern depend on immutability?`,
  fa:`<p>Because the past stack holds references to previous values. If a change mutated the object in place, every entry in the history would point at the same mutated object and undo would restore the current state. Storing snapshots only works if nothing edits them.</p>`
},
{
  d:'Hard', topic:'Performance',
  q:`How do you diagnose a slow React app? Walk me through your profiling process.`,
  a:`<p>First I establish what "slow" means, because the fixes are unrelated: slow to load, slow to respond to an interaction, or janky while scrolling or typing. A Lighthouse or performance-panel trace of the real journey answers that.</p><p>If it is load: bundle analysis, then route-level splitting, then whether the data could come from the server instead of a waterfall of client requests.</p><p>If it is interaction: the React DevTools Profiler on a production build, with "record why each component rendered" on. I read the shape. One long commit means a single expensive component: do less work, memoise the computation, or virtualise. Many short commits means too many renders: look at where the state lives and move it down. A stream of nested-update entries means an effect is setting state after render, which is usually a derived value that should be computed instead.</p><p>Then I fix one thing and measure again, because the second bottleneck is rarely what you predicted. React 19.2 also emits its work to the browser's performance timeline, so React renders line up with network and paint in the same trace.</p>`,
  fq:`Why insist on a production build for the timings?`,
  fa:`<p>Development React is several times slower and StrictMode double-renders, so the absolute numbers are fiction and the ranking can be wrong. Development is still where I read "why did this render", since that instrumentation only exists there.</p>`
},
{
  d:'Hard', topic:'Effects',
  q:`What causes memory leaks in React, and how do you find them?`,
  a:`<p>Almost always a subscription that outlives its component: an event listener, interval, observer, socket, or animation frame with no cleanup. Each mount adds another, and every one keeps the component's closure, and therefore its props and state, alive. Others: an object retained in a module-level cache or store that is never evicted, a closure held by a long-lived timer, and detached DOM nodes kept by a ref you stored somewhere global.</p><p>To find them: repeat the mount and unmount cycle, take heap snapshots in Chrome between cycles, and compare retained size. Look for growing counts of your own component or listener objects, and use the retainer path to see what is holding them. StrictMode's double mount surfaces the missing-cleanup class immediately, which is the cheapest detector available.</p>`,
  code:`// leaks: nothing removes the listener\nuseEffect(() => {\n  window.addEventListener('resize', onResize);\n}, []);\n\n// correct\nuseEffect(() => {\n  window.addEventListener('resize', onResize);\n  return () => window.removeEventListener('resize', onResize);\n}, []);`,
  fq:`Is "cannot update state on an unmounted component" a leak?`,
  fa:`<p>That warning was removed in React 18, because setting state after unmount is a no-op rather than a leak. It was a signal of one, though: it usually meant an uncancelled request or an uncleaned subscription, so the underlying habit still matters.</p>`
},
{
  d:'Hard', topic:'State',
  q:`How did batching across setTimeout and promises change in React 18?`,
  a:`<p>Before 18, React batched updates only inside its own event handlers. Updates from a setTimeout, a promise callback, a native event listener, or any other non-React context were applied one at a time, so two setters meant two renders and the user could see a half-updated screen.</p><p>React 18 introduced automatic batching everywhere: any set of updates in the same tick is collected into one re-render, whatever triggered them. The escape hatch is flushSync from react-dom, which forces a synchronous render, and you need it roughly never, typically only to measure the DOM immediately after an update.</p>`,
  code:`// React 17: two renders. React 18+: one.\nsetTimeout(() => {\n  setCount(c => c + 1);\n  setFlag(f => !f);\n}, 0);\n\n// opt out deliberately\nflushSync(() => setOpen(true));\nmeasure(node);   // the DOM is already updated here`,
  fq:`Did that break anything?`,
  fa:`<p>Code that relied on reading the DOM between two updates in an async callback, or that expected a render in the middle of a function. Both were already fragile. The framing worth remembering is that batching is why the value form of a setter can be stale, and why the updater form is the safe default.</p>`
},
{
  d:'Hard', topic:'Architecture',
  q:`How would you migrate a large React 17 class-component codebase to modern React incrementally?`,
  a:`<p>Nothing about this is a rewrite. First, upgrade the version without changing style: React 17 to 18 means swapping ReactDOM.render for createRoot and dealing with automatic batching, then 18 to 19 means removing the APIs that were deleted, string refs, defaultProps on function components, legacy context, and running the codemods React ships. Classes keep working throughout.</p><p>Then convert by feature, not by file count, and only files you are already touching for product reasons. Start with leaves, which are usually presentational and convert in minutes. Extract lifecycle logic into custom hooks as you go, since that is where the real value is: a subscription spread across three lifecycle methods becomes one testable hook that the remaining classes can use through a small wrapper.</p><p>Add StrictMode early to a subtree at a time, because it surfaces the missing cleanups the class code was hiding. Turn on eslint-plugin-react-hooks immediately, so new code cannot regress. And leave error boundaries as classes, because they still have to be.</p>`,
  fq:`How do you keep a half-migrated codebase from being worse than either end state?`,
  fa:`<p>By making the boundary explicit rather than letting the two styles interleave: a written rule that new code is function components, a lint rule to enforce it, and a list of the classes that remain with a reason each. Mixed is fine if it is deliberate and shrinking; the failure mode is a codebase where nobody can tell which convention applies to the file they opened.</p>`
},
{
  d:'Hard', topic:'Context',
  q:`What are the trade-offs of context versus an external store at scale?`,
  a:`<p>Context is transport, not state management, and it has one structural limitation: every consumer re-renders when the provider value changes, and there is no way to subscribe to part of the value. That is fine for a theme or the current user, and it is the wrong shape for anything that changes often and is read widely.</p><p>An external store, Zustand, Jotai, Redux Toolkit, or your own on top of useSyncExternalStore, lets a component select a slice, so a change wakes only the components whose slice actually changed. You also get state that survives unmounting, easier testing, and access from outside React. The costs are a dependency, state that is no longer scoped to a subtree, and the discipline to keep selectors returning stable values.</p><p>The mitigations for context are real, though, and worth trying first: memoise the value, and split the context so the stable half, usually the dispatch or api, is separate from the changing half.</p>`,
  code:`// context, split so action-only consumers never re-render\nconst tree = (\n  <ToastApiContext.Provider value={api}>          {/* stable: useMemo with [] */}\n    <ToastListContext.Provider value={toasts}>   {/* changes often */}\n      {children}\n    </ToastListContext.Provider>\n  </ToastApiContext.Provider>\n);\n\n// store: subscribe to a slice, and prefer primitives\nconst loud = useStore(s => s.count * 2 > 10);   // re-renders twice, not every tick`,
  fq:`What breaks if a selector returns a new object?`,
  fa:`<p>React warns that the result of getSnapshot should be cached, and you get an infinite re-render loop, because a fresh object never compares equal. Select primitives separately, or use the library's shallow comparison. It is the store equivalent of the unstable-dependency bug.</p>`
},
{
  d:'Hard', topic:'Internals',
  q:`Explain key as a remount mechanism, and a case where you would use it deliberately.`,
  a:`<p>Identity in React comes from type, position, and key. Change the key and React treats it as a different element: it unmounts the old instance, runs its cleanups, discards its state, and mounts a fresh one. Within a list that mechanism preserves identity as items move; outside a list it is a deliberate reset button.</p><p>The everyday use is resetting a form when the thing it edits changes: &lt;ProfileForm key={userId} /&gt; guarantees no field from the previous user leaks into the next. I also use it to reset an error boundary after a retry, since clearing the boundary's own state would just re-render the same broken child.</p>`,
  code:`// reset a subtree's state with no code inside it\nconst form = <ProfileForm key={userId} userId={userId} />;\n\n// reset an error boundary and its child together\nconst panel = (\n  <ErrorBoundary key={attempt} onRetry={() => setAttempt(a => a + 1)}>\n    <Chart />\n  </ErrorBoundary>\n);`,
  fq:`What is the cost, and when would you not use it?`,
  fa:`<p>A remount is not free: effects re-run, data may refetch, scroll position and focus are lost, and animations restart. If only part of the state should reset, or the mount is expensive, reset explicitly in the handler that caused the change, or split the component so only the resettable part carries the key.</p>`
},
{
  d:'Hard', topic:'Security',
  q:`How do XSS vulnerabilities enter a React app?`,
  a:`<p>React escapes any string you interpolate into JSX, so ordinary rendering is safe by default. Vulnerabilities come from the ways you opt out of that, and there are only a few.</p><p>dangerouslySetInnerHTML with content from a user, a CMS, or a third-party API is the classic. A URL from untrusted input in an href or src, where a javascript: or data: URL executes on click. Injecting into a script or style tag, or spreading unvalidated props onto an element. And on the server, interpolating data into the HTML shell around your app.</p><p>The defences: sanitise with DOMPurify rather than a regular expression, allow-list URL schemes to http and https, prefer rendering structured data over HTML, keep session tokens in httpOnly cookies so an XSS cannot read them, and set a Content-Security-Policy so a successful injection has nowhere to go.</p>`,
  code:`// safe: escaped, so tags render as text\nconst safeText = <p>{userContent}</p>;\n\n// dangerous unless sanitised\nconst risky = <div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(html) }} />;\n\n// a URL is code until you check the scheme\nconst href = /^https?:\\/\\//i.test(url) ? url : null;\nconst link = href ? <a href={href} rel="noreferrer noopener">link</a> : null;`,
  fq:`Where do people leak secrets in a React app, separately from XSS?`,
  fa:`<p>Client-side environment variables. Anything the browser can read is public, so a key in a VITE_ or NEXT_PUBLIC_ variable is in the bundle and visible in the network tab regardless of the name. Secrets live behind a server you control, reached through a Server Function or an API route, and every permission the UI implies has to be re-checked there.</p>`
},
{
  d:'Hard', topic:'React 19',
  q:`When would you use Activity rather than unmounting or hiding with CSS?`,
  a:`<p>There were only ever two ways to hide something and both are wrong sometimes. Unmounting loses the state: the half-typed form, the scroll position. Hiding with display: none keeps everything, including the effects, timers, subscriptions, and polling of a screen nobody is looking at.</p><p>Activity, stable in 19.2, is the third option: keep the state, clean up the effects, and pre-render the hidden subtree at low priority so revealing it is instant. That is what I want for a tab the user will come back to, a route they just left, or the steps of a wizard. It is not a default, because every hidden subtree is retained memory, so unmounting is still right for something expensive and unlikely to be revisited.</p>`,
  code:`<Activity mode={tab === 'a' ? 'visible' : 'hidden'}>\n  <Panel />        {/* state kept, effects cleaned up, ready instantly */}\n</Activity>\n\n{tab === 'b' && <Panel />}   {/* the old way: state lost on every switch */}`,
  fq:`If effects are cleaned up while hidden, where does a background subscription belong?`,
  fa:`<p>Above the Activity boundary, in a component that stays visible, and the hidden subtree reads it from context or a store when it comes back. Effects also re-run on becoming visible again, so they still need to be safe to re-run, which is the same discipline StrictMode enforces.</p>`
},
{
  d:'Hard', topic:'Accessibility',
  q:`What does React specifically make you responsible for in accessibility, beyond writing correct HTML?`,
  a:`<p>Two things, because React owns the DOM. Focus management, since components mount and unmount underneath the user: opening a dialog leaves focus behind on the trigger, and closing one that removed its trigger drops focus to the body, which loses the user's place entirely. And keeping ARIA state in step with React state, since an aria-expanded that never updates actively misinforms.</p><p>Everything else really is just correct HTML, and the discipline is to use the native element: a button for an action, a label tied to its input, headings in order. A div with an onClick is a decision to reimplement keyboard support, focus, and roles badly. The other React-specific habit is announcing changes that a sighted user reads for free, such as a result count in a role="status" region.</p>`,
  code:`useEffect(() => {\n  if (!open) return;\n  const returnTo = document.activeElement;   // remember\n  panelRef.current?.focus();                 // move in (needs tabIndex={-1})\n  return () => returnTo?.focus();            // and put it back\n}, [open]);\n\n// aria state derived from React state, so it cannot go stale\nconst trigger = <button aria-expanded={open} aria-controls="menu">Menu</button>;`,
  fq:`Is an automated audit enough?`,
  fa:`<p>No. axe and Lighthouse find missing labels, bad contrast, and invalid ARIA. They cannot tell you that the focus order is nonsense, that a modal has no trap, or that a custom combobox is unusable. Unplug the mouse and go through the flow, then try it with a screen reader.</p>`
}
);

</script>

<script>
/* ============================================================
   APP ENGINE
   Deliberately plain DOM. Only the playgrounds use React, so the
   course still works if the CDN is unreachable.
   ============================================================ */
(function () {
  'use strict';

  var TOTAL = 52;
  var PG_SRC = Object.create(null);
  var pgSeq = 0;
  var Boundary = null;

  var store = (function () {
    var mem = {};
    var ok = false;
    try { window.localStorage.setItem('__t', '1'); window.localStorage.removeItem('__t'); ok = true; } catch (e) { ok = false; }
    return {
      get: function (k) { try { return ok ? window.localStorage.getItem(k) : mem[k] || null; } catch (e) { return mem[k] || null; } },
      set: function (k, v) { try { if (ok) window.localStorage.setItem(k, v); else mem[k] = v; } catch (e) { mem[k] = v; } }
    };
  })();

  var flat = [];
  COURSE.forEach(function (m) {
    m.lessons.forEach(function (l) { flat.push({ mod: m, lesson: l }); });
  });

  var doneSet = new Set((store.get('rc.done') || '').split(',').filter(Boolean));

  var S = {
    tab: 'learn',
    id: store.get('rc.at') || flat[0].lesson.id,
    q: '',
    diff: 'all',
    topic: 'all'
  };
  if (!flat.some(function (e) { return e.lesson.id === S.id; })) S.id = flat[0].lesson.id;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function el(id) { return document.getElementById(id); }
  function idx(lessonId) {
    for (var i = 0; i < flat.length; i++) if (flat[i].lesson.id === lessonId) return i;
    return -1;
  }
  function blob(entry) {
    var l = entry.lesson;
    return (entry.mod.t + ' ' + l.t + ' ' + (l.what || []).join(' ') + ' ' +
      (l.why || []).join(' ') + ' ' + (l.mm || '')).toLowerCase();
  }
  function matches(entry) {
    if (!S.q) return true;
    return blob(entry).indexOf(S.q.toLowerCase()) !== -1;
  }

  /* ---------- sidebar ---------- */
  function renderNav() {
    var nav = el('sidebar');
    var html = '<div class="curric"><div class="spine"><span class="spine-fill" style="height:0"></span></div>';
    var shownAny = false;
    var n = 0;

    html += '<div class="nav-count">' + doneSet.size + ' of ' + TOTAL + ' lessons done</div>';

    COURSE.forEach(function (m) {
      var rows = '';
      m.lessons.forEach(function (l) {
        n++;
        var entry = { mod: m, lesson: l };
        if (!matches(entry)) return;
        shownAny = true;
        var cls = 'less-b' + (doneSet.has(l.id) ? ' done' : '') + (l.id === S.id && S.tab === 'learn' ? ' here' : '');
        rows += '<li><button class="' + cls + '" data-goto="' + l.id + '">' +
          '<span class="dot"></span><span class="num">' + l.id + '</span>' +
          '<span class="t">' + esc(l.t) + '</span></button></li>';
      });
      if (!rows) return;
      html += '<section class="mod"><h3 class="mod-h"><span class="mod-mark"></span>' +
        '<span>' + esc(m.t) + ' <span class="lvl">' + esc(m.lvl) + '</span></span></h3>' +
        '<ol class="less">' + rows + '</ol></section>';
    });

    PENDING.forEach(function (m) {
      var rows = '';
      m.lessons.forEach(function (title, i) {
        var num = m.from + i;
        if (S.q && (m.t + ' ' + title).toLowerCase().indexOf(S.q.toLowerCase()) === -1) return;
        shownAny = true;
        rows += '<li><button class="less-b" data-soon="1" disabled>' +
          '<span class="dot"></span><span class="num">' + num + '</span>' +
          '<span class="t">' + esc(title) + '</span></button></li>';
      });
      if (!rows) return;
      html += '<section class="mod"><h3 class="mod-h"><span class="mod-mark"></span>' +
        '<span>' + esc(m.t) + ' <span class="lvl">' + esc(m.lvl) + ', not built yet</span></span></h3>' +
        '<ol class="less">' + rows + '</ol></section>';
    });

    html += '</div>';
    if (!shownAny) html = '<p class="nav-empty">Nothing matches “' + esc(S.q) + '”.</p>';
    nav.innerHTML = html;
    fillSpine(nav);
  }

  /* The spine is filled to the last lesson you finished, not to a percentage:
     it should read as a position in the curriculum, not a score. */
  function fillSpine(nav) {
    var spine = nav.querySelector('.spine');
    var fill = nav.querySelector('.spine-fill');
    if (!spine || !fill) return;
    var dots = nav.querySelectorAll('.less-b.done .dot');
    if (!dots.length) { fill.style.height = '0'; return; }
    var last = dots[dots.length - 1].getBoundingClientRect();
    var top = spine.getBoundingClientRect().top;
    fill.style.height = Math.max(0, Math.round(last.top + last.height / 2 - top)) + 'px';
  }

  /* ---------- playground markup ---------- */
  function pg(code, label) {
    var id = 'pg' + (++pgSeq);
    PG_SRC[id] = code;
    return '<div class="pg" data-pg="' + id + '">' +
      '<div class="pg-bar">' +
      '<button class="btn btn-run" data-act="run">Run</button>' +
      '<button class="btn" data-act="reset">Reset</button>' +
      '<span class="hint">' + (label || 'Ctrl+Enter runs') + '</span>' +
      '</div><div class="pg-cols">' +
      '<textarea class="pg-code" spellcheck="false" aria-label="Editable example code">' + esc(code) + '</textarea>' +
      '<div class="pg-out" aria-live="polite"></div>' +
      '</div></div>';
  }

  /* ---------- lesson pane ---------- */
  function sect(label, body, extraClass) {
    return '<div class="sect' + (extraClass ? ' ' + extraClass : '') + '"><h3>' + label +
      '</h3><div class="body">' + body + '</div></div>';
  }
  function paras(arr) {
    return arr.map(function (p) { return '<p>' + p + '</p>'; }).join('');
  }

  function renderLesson() {
    var i = idx(S.id);
    var entry = flat[i];
    var l = entry.lesson;
    var h = '';

    if (window.__reactStatus === 'failed' || window.__reactStatus === 'nobabel') {
      h += '<div class="notice"><b>The live playgrounds are offline.</b> ' +
        'React and Babel are loaded from a CDN, and that request did not succeed' +
        (window.__reactError ? ' (' + esc(window.__reactError) + ')' : '') +
        '. Every lesson, code sample, and exercise below still reads normally.</div>';
    }

    h += '<p class="where">' + esc(entry.mod.t) + ', lesson ' + l.id + ' of ' + TOTAL + '</p>';
    h += '<h2 class="lesson-h">' + esc(l.t) + '</h2>';
    h += sect('What it is', paras(l.what));
    h += sect('Why it exists', paras(l.why));
    h += sect('Minimal example', pg(l.code), 'pin');
    h += sect('Annotated walkthrough', '<dl class="anno">' + l.anno.map(function (a) {
      return '<div><dt>' + esc(a[0]) + '</dt><dd>' + a[1] + '</dd></div>';
    }).join('') + '</dl>');
    h += sect('Common mistakes', l.mistakes.map(function (m) {
      return '<div class="mistake"><h4>' + esc(m[0]) + '</h4>' +
        (m[1] ? '<span class="msg">' + esc(m[1]) + '</span>' : '') +
        '<p>' + m[2] + '</p></div>';
    }).join(''));
    h += sect('Exercise',
      '<p class="task">' + l.ex.task + '</p>' + pg(l.ex.start, 'Your turn') +
      '<details class="sol"><summary>Show solution</summary><div class="sol-body">' +
      '<pre class="code">' + esc(l.ex.sol) + '</pre><p>' + l.ex.why + '</p></div></details>', 'pin');
    h += sect('Mental model', '<p class="stress">' + esc(l.mm) + '</p>');

    var prev = flat[i - 1], next = flat[i + 1];
    h += '<div class="lesson-foot">' +
      '<button class="fbtn mark' + (doneSet.has(l.id) ? ' on' : '') + '" data-mark="' + l.id + '">' +
      (doneSet.has(l.id) ? 'Done' : 'Mark done') + '</button>' +
      '<button class="fbtn" data-goto="' + (prev ? prev.lesson.id : '') + '"' + (prev ? '' : ' disabled') + '>' +
      (prev ? 'Back: ' + esc(prev.lesson.t) : 'Back') + '</button>' +
      '<button class="fbtn" data-goto="' + (next ? next.lesson.id : '') + '"' + (next ? '' : ' disabled') + '>' +
      (next ? 'Next: ' + esc(next.lesson.t) : 'That is lesson 52, the last one') + '</button>' +
      '</div>';

    return '<article class="lesson">' + h + '</article>';
  }

  /* ---------- interview pane ---------- */
  function topics() {
    var seen = {};
    INTERVIEW.forEach(function (q) { seen[q.topic] = (seen[q.topic] || 0) + 1; });
    return Object.keys(seen).sort();
  }

  function matchesQuestion(x) {
    if (!S.q) return true;
    var hay = (x.q + ' ' + x.a + ' ' + (x.code || '') + ' ' + x.fq + ' ' + x.fa + ' ' +
      x.topic + ' ' + x.d).toLowerCase();
    return hay.indexOf(S.q.toLowerCase()) !== -1;
  }

  function renderInterview() {
    var h = '<p class="where">Interview preparation, ' + INTERVIEW.length + ' questions</p>' +
      '<h2 class="lesson-h">Answering React interview questions</h2>';

    h += sect('How to answer', HOW_TO_ANSWER.blocks.map(function (b) {
      return '<p><strong>' + b[0] + '.</strong> ' + b[1] + '</p>';
    }).join(''));

    var bank = INTERVIEW.filter(function (x) {
      return (S.diff === 'all' || x.d === S.diff) &&
        (S.topic === 'all' || x.topic === S.topic) &&
        matchesQuestion(x);
    });

    var counts = { Easy: 0, Medium: 0, Hard: 0 };
    INTERVIEW.forEach(function (x) { counts[x.d]++; });

    h += '<div class="sect pin"><h3>Question bank</h3><div class="body">';
    h += '<div class="filters">' +
      [['all', 'Every level (' + INTERVIEW.length + ')'],
       ['Easy', 'Easy (' + counts.Easy + ')'],
       ['Medium', 'Medium (' + counts.Medium + ')'],
       ['Hard', 'Hard (' + counts.Hard + ')']].map(function (d) {
        return '<button class="chip" data-diff="' + d[0] + '" aria-pressed="' +
          (S.diff === d[0] ? 'true' : 'false') + '">' + d[1] + '</button>';
      }).join('') +
      '<label class="pick-wrap">Topic ' +
      '<select class="pick" id="topicPick" aria-label="Filter by topic">' +
      '<option value="all">Any topic</option>' +
      topics().map(function (t) {
        return '<option value="' + esc(t) + '"' + (S.topic === t ? ' selected' : '') + '>' +
          esc(t) + '</option>';
      }).join('') +
      '</select></label>' +
      '</div>';

    if (!bank.length) {
      h += '<div class="pending">No question matches that combination. ' +
        'Clear the search box, or choose another topic.</div>';
    } else {
      if (bank.length !== INTERVIEW.length) {
        h += '<p class="where">' + bank.length + ' of ' + INTERVIEW.length + ' shown</p>';
      }
      bank.forEach(function (x) {
        h += '<div class="qa">' +
          '<p class="q">' + esc(x.q) + '</p>' +
          '<p class="diff">' + x.d + ', ' + esc(x.topic) + '</p>' +
          '<details class="sol"><summary>Show answer</summary><div class="sol-body">' +
          x.a +
          (x.code ? '<pre class="code">' + esc(x.code) + '</pre>' : '') +
          '<div class="follow"><p class="fq">' + esc(x.fq) + '</p>' + x.fa + '</div>' +
          '</div></details></div>';
      });
    }
    h += '</div></div>';
    return h;
  }

  /* ---------- cheat sheet ---------- */
  function renderSheet() {
    var h = '<p class="where">Reference</p><h2 class="lesson-h">Cheat sheet</h2><div class="sheet">';
    SHEET.forEach(function (s) {
      var items = s.items.filter(function (it) {
        return !S.q || (it[0] + ' ' + it[1]).toLowerCase().indexOf(S.q.toLowerCase()) !== -1;
      });
      if (!items.length) return;
      h += '<section><h3>' + esc(s.t) + '</h3><dl>' + items.map(function (it) {
        return '<dt>' + esc(it[0]) + '</dt><dd>' + esc(it[1]) + '</dd>';
      }).join('') + '</dl></section>';
    });
    h += '</div><p class="pending" style="margin-top:20px">All 52 lessons and all ' +
      INTERVIEW.length + ' interview questions are built. The search box at the top ' +
      'filters this sheet, the lessons, and the question bank at once.</p>';
    return h;
  }

  /* ---------- render ---------- */
  function render() {
    var pane = el('paneInner');
    pane.innerHTML = S.tab === 'learn' ? renderLesson()
      : S.tab === 'interview' ? renderInterview() : renderSheet();
    renderNav();
    document.querySelectorAll('.tab').forEach(function (t) {
      t.setAttribute('aria-selected', t.dataset.tab === S.tab ? 'true' : 'false');
    });
    if (S.tab === 'learn') runAll(pane);
  }

  /* ---------- the playground runner ---------- */
  function ready() { return window.__reactStatus === 'ready'; }

  function getBoundary() {
    if (Boundary) return Boundary;
    Boundary = class extends window.React.Component {
      constructor(p) { super(p); this.state = { err: null }; }
      static getDerivedStateFromError(err) { return { err: err }; }
      render() {
        if (this.state.err) {
          return window.React.createElement('pre', { className: 'pg-err' },
            'Error while rendering: ' + (this.state.err.message || String(this.state.err)));
        }
        return this.props.children;
      }
    };
    return Boundary;
  }

  function fmt(v) {
    if (typeof v === 'string') return v;
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }

  function run(pgEl) {
    var ta = pgEl.querySelector('.pg-code');
    var out = pgEl.querySelector('.pg-out');

    if (pgEl.__roots) {
      pgEl.__roots.forEach(function (r) { try { r.unmount(); } catch (e) {} });
    }
    pgEl.__roots = [];
    out.textContent = '';

    if (!ready()) {
      out.innerHTML = '<pre class="pg-err">This example cannot run: React or Babel did not load from the CDN.\n' +
        'Reconnect and reload the page, and the Run button will work.</pre>';
      return;
    }

    var React = window.React;
    var logEl = document.createElement('pre');
    logEl.className = 'pg-log';
    var mountEl = document.createElement('div');
    out.appendChild(mountEl);

    function log() {
      var args = Array.prototype.slice.call(arguments);
      logEl.textContent += args.map(fmt).join(' ') + '\n';
      if (!logEl.parentNode) out.insertBefore(logEl, mountEl);
    }
    function fail(kind, message) {
      var p = document.createElement('pre');
      p.className = 'pg-err';
      p.textContent = kind + ': ' + message;
      out.appendChild(p);
    }

    /* strip module syntax so the snippet can run inside a function */
    var src = ta.value
      .replace(/^[ \t]*import[ \t][^\n]*\n?/gm, '')
      .replace(/^[ \t]*export[ \t]+default[ \t]+/gm, '')
      .replace(/^[ \t]*export[ \t]+/gm, '');

    var compiled;
    try {
      compiled = window.Babel.transform(src, {
        presets: [
          ['react', { runtime: 'classic' }],
          /* lesson 35 is written in TypeScript. Babel strips the types; it does
             not check them, which the lesson says out loud. */
          ['typescript', { isTSX: true, allExtensions: true, onlyRemoveTypeImports: true }]
        ],
        filename: 'example.tsx'
      }).code;
    } catch (e) {
      fail('Syntax error', e.message);
      return;
    }

    var manual = false;
    function makeRoot(node) {
      manual = true;
      var r = window.__createRoot(node, {
        onUncaughtError: function (err) { fail('Uncaught error', err.message || String(err)); }
      });
      pgEl.__roots.push(r);
      return r;
    }

    var names = ['React', 'useState', 'useEffect', 'useLayoutEffect', 'useRef', 'useMemo',
      'useCallback', 'useReducer', 'useContext', 'useId', 'useTransition', 'useDeferredValue',
      'useSyncExternalStore', 'useOptimistic', 'useActionState', 'createContext', 'memo',
      'lazy', 'Suspense', 'StrictMode', 'Fragment', 'createPortal', 'createRoot', 'render',
      'mount', 'log', 'useEffectEvent', 'Activity', 'useImperativeHandle', 'forwardRef',
      'Profiler', 'useFormStatus', 'flushSync', 'startTransition'];

    var rendered = null;
    var values = [React, React.useState, React.useEffect, React.useLayoutEffect, React.useRef,
      React.useMemo, React.useCallback, React.useReducer, React.useContext, React.useId,
      React.useTransition, React.useDeferredValue, React.useSyncExternalStore,
      React.useOptimistic, React.useActionState, React.createContext, React.memo,
      React.lazy, React.Suspense, React.StrictMode, React.Fragment, window.__createPortal,
      makeRoot,
      function (element) { manual = true; rendered = element; },
      mountEl, log,
      React.useEffectEvent, React.Activity, React.useImperativeHandle, React.forwardRef,
      React.Profiler, window.__useFormStatus, window.__flushSync, React.startTransition];

    var Comp;
    try {
      var fn = new Function(names.join(','),
        '"use strict";\n' + compiled + '\n;return typeof App !== "undefined" ? App : null;');
      Comp = fn.apply(null, values);
    } catch (e) {
      fail(e.name || 'Error', e.message);
      return;
    }

    var B = getBoundary();
    try {
      if (rendered) {
        makeRoot(mountEl).render(React.createElement(B, null, rendered));
      } else if (!manual && typeof Comp === 'function') {
        makeRoot(mountEl).render(React.createElement(B, null, React.createElement(Comp)));
      } else if (!manual) {
        out.appendChild(document.createTextNode('Nothing rendered yet. Define a component called App, or call createRoot(mount).render(<App />) yourself.'));
      }
    } catch (e) {
      fail('Error', e.message);
    }
  }

  function runAll(scope) {
    scope.querySelectorAll('.pg').forEach(run);
  }

  /* ---------- events ---------- */
  function goto(id) {
    S.tab = 'learn';
    S.id = id;
    store.set('rc.at', id);
    render();
    el('main').focus();
    window.scrollTo({ top: 0, behavior: 'auto' });
    closeDrawer();
  }

  function closeDrawer() {
    el('sidebar').classList.remove('open');
    el('drawerBtn').setAttribute('aria-expanded', 'false');
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-goto],[data-act],[data-mark],[data-tab],[data-diff]');
    if (!t) return;

    if (t.dataset.goto) return goto(t.dataset.goto);

    if (t.dataset.tab) {
      S.tab = t.dataset.tab;
      render();
      return;
    }
    if (t.dataset.diff) {
      S.diff = t.dataset.diff;
      render();
      return;
    }
    if (t.dataset.mark) {
      var id = t.dataset.mark;
      if (doneSet.has(id)) doneSet.delete(id); else doneSet.add(id);
      store.set('rc.done', Array.from(doneSet).join(','));
      t.classList.toggle('on');
      t.textContent = doneSet.has(id) ? 'Done' : 'Mark done';
      renderNav();
      return;
    }
    if (t.dataset.act) {
      var box = t.closest('.pg');
      if (t.dataset.act === 'reset') {
        box.querySelector('.pg-code').value = PG_SRC[box.dataset.pg];
      }
      run(box);
    }
  });

  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'topicPick') {
      S.topic = e.target.value;
      render();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.classList.contains('pg-code')) {
      e.preventDefault();
      run(e.target.closest('.pg'));
    }
    if (e.key === 'Escape') closeDrawer();
  });

  el('drawerBtn').addEventListener('click', function () {
    var open = el('sidebar').classList.toggle('open');
    el('drawerBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  var findTimer;
  el('find').addEventListener('input', function (e) {
    var v = e.target.value;
    clearTimeout(findTimer);
    findTimer = setTimeout(function () {
      S.q = v.trim();
      if (S.tab === 'learn') renderNav(); else render();
    }, 140);
  });

  window.addEventListener('reactstatus', function () { render(); });

  render();
  /* If the CDN scripts are slow or blocked, say so rather than sitting blank. */
  setTimeout(function () {
    if (typeof window.__reactStatus === 'undefined') {
      window.__reactStatus = 'failed';
      window.__reactError = 'timed out after 8 seconds';
      render();
    }
  }, 8000);
})();
</script>
</body>
</html>
