    why:[
      'Batching means one render for one user action, no matter how many pieces of state that action touches. Without it, a handler that updated four things would render four times and could paint a half-updated screen.',
      'The consequence is that the value form of a setter is computed from a snapshot that may already be out of date by the time it is applied. The updater form is not, because React hands it the value produced by the previous update in the queue. So: use the updater form whenever the next state depends on the current state.'
    ],
    code:`function App() {\n  const [a, setA] = useState(0);\n  const [b, setB] = useState(0);\n  const [renders, setRenders] = useState(0);\n\n  function valueForm() {\n    setA(a + 1);\n    setA(a + 1);\n    setA(a + 1);        // +1 in total\n  }\n\n  function updaterForm() {\n    setB(x => x + 1);\n    setB(x => x + 1);\n    setB(x => x + 1);    // +3, queued in order\n  }\n\n  function inATimeout() {\n    setTimeout(() => {\n      setA(x => x + 1);\n      setB(x => x + 1);  // batched together since React 18\n    }, 300);\n  }\n\n  return (\n    <div>\n      <p>value form a = {a}, updater form b = {b}</p>\n      <button onClick={valueForm}>a += 1 three times</button>\n      <button onClick={updaterForm}>b += 1 three times</button>\n      <button onClick={inATimeout}>both, in a timeout</button>\n    </div>\n  );\n}`,
    anno:[
      ['setA(a + 1)','The value form. a is this render\'s snapshot, so three calls compute the same number three times.'],
      ['setB(x => x + 1)','The updater form. x is the value after the previous queued update, so the three calls compose. Nothing else changes: it is the same setter.'],
      ['inside setTimeout','Both setters still cause one render. Before React 18, updates outside React event handlers were not batched and this would have rendered twice. If an interviewer asks what changed in React 18, automatic batching everywhere is the answer.'],
      ['flushSync(() => setA(1))','From react-dom. Opts out of batching and renders synchronously. You need it roughly once a year, usually to measure the DOM immediately after an update.'],
      ['setA(a) with the same value','If the new state is identical by Object.is, React may skip the re-render entirely. Do not rely on it for correctness, but it is why setting a boolean to its current value is cheap.']
    ],
    mistakes:[
      ['Using the value form for a counter','','Two clicks in the same tick, or a double-invoked handler, and you lose an increment. If the new value is derived from the old one, use the updater form. It is never wrong to.'],
      ['Doing side effects inside an updater','','The updater must be pure: no fetching, no logging you care about, no setting other state. React may call it more than once, especially in StrictMode, to check that it is pure.'],
      ['Expecting a render between two setters','','setStep(2); console.log(step) logs the old step. There is no render in the middle of your function. Compute the value into a local variable if you need it twice.'],
      ['Reaching for flushSync to fix ordering','Warning: flushSync was called from inside a lifecycle method.','Almost always the wrong tool. It forces a synchronous render, undoing the performance work React does for you. Fix the logic instead.']
    ],
    ex:{
      task:'Write an "add three" button whose counter reliably goes up by three, and a second button that adds one after a 500ms delay, still correctly if you press it three times fast.',
      start:`function App() {\n  const [n, setN] = useState(0);\n  // your code\n}`,
      sol:`function App() {\n  const [n, setN] = useState(0);\n\n  const addThree = () => {\n    setN(x => x + 1);\n    setN(x => x + 1);\n    setN(x => x + 1);\n  };\n\n  const addLater = () => {\n    setTimeout(() => setN(x => x + 1), 500);\n  };\n\n  return (\n    <div>\n      <p>n = {n}</p>\n      <button onClick={addThree}>Add three</button>\n      <button onClick={addLater}>Add one in 500ms</button>\n    </div>\n  );\n}`,
      why:'Both rely on the same property: the updater receives the latest pending value rather than a snapshot. In the delayed case that matters most, because three rapid presses create three timeouts that all fire against a state that has moved on since their click. With the value form you would end up at one instead of three. This is the single habit that prevents the largest number of state bugs, so make it your default and use the value form only when the next state genuinely has nothing to do with the current one.'
    },
    mm:'If the next state depends on the current state, pass a function; React applies queued updaters in order, not against your stale snapshot.'
  },
  {
    id:'14', t:'Lifting state up',
    what:[
      'When two components need the same piece of state, move it to their closest common parent. The parent owns the value and passes it down as a prop, along with a function to change it.',
      'This is called lifting state up, and it is the default answer to "how do these two components talk to each other".'
    ],
    why:[
      'Props only flow downward, so siblings have no channel between them. If each keeps its own copy of the value, the copies drift apart and you get two truths.',
      'One owner means one truth. The children become simpler at the same time, because a component that receives its value and its setter has no state of its own to keep in sync. That pattern has a name: a controlled component, and lesson 15 is about the version of it that comes with form inputs.',
      'The cost is prop drilling when the owner is far above the users. Lesson 28 is about context, which solves the plumbing without changing who owns the state.'
    ],
    code:`function Slider({ label, value, onChange }) {\n  return (\n    <label style={{ display: 'block' }}>\n      {label}\n      <input\n        type="range" min="0" max="100"\n        value={value}\n        onChange={e => onChange(Number(e.target.value))}\n      />\n      {value}\n    </label>\n  );\n}\n\nfunction Total({ a, b }) {\n  return <p><b>Total: {a + b}</b> of 200</p>;\n}\n\nfunction App() {\n  // the parent owns what the siblings share\n  const [a, setA] = useState(30);\n  const [b, setB] = useState(50);\n\n  return (\n    <div>\n      <Slider label="Fixed " value={a} onChange={setA} />\n      <Slider label="Variable " value={b} onChange={setB} />\n      <Total a={a} b={b} />\n      <button onClick={() => { setA(0); setB(0); }}>Reset both</button>\n    </div>\n  );\n}`,
    anno:[
      ['const [a, setA] = useState(30);','State lives in App because both the sliders and the total need it. Push it down into Slider and Total cannot see it; push it further up and App gets props it does not need.'],
      ['<Slider value={a} onChange={setA} />','Value down, event up. The two props always travel together, and that pair is the signature of a controlled component.'],
      ['onChange={e => onChange(Number(e.target.value))}','The DOM gives you a string. Converting at the boundary means the rest of the app deals in numbers, so a + b adds instead of concatenating.'],
      ['onChange={setA}','You can pass a setter directly when the callback\'s argument is already the new value. It is a normal function.'],
      ['onClick={() => { setA(0); setB(0); }}','Two setters, one render, thanks to batching. The reset can only exist here, because only App can change both.']
    ],
    mistakes:[
      ['Keeping a copy of the prop in state','','const [local, setLocal] = useState(props.value) creates a second truth that stops following the first. If the parent owns it, read the prop. See lesson 17.'],
      ['Lifting state higher than necessary','','Every level between the owner and the user has to forward the props, and every state change re-renders the whole subtree. Keep state as low as the components that need it allow.'],
      ['Passing setState down many levels','','Two levels is fine. Five is a sign you want context, a reducer with a dispatch in context, or a store. Do not solve it by adding state at every level.'],
      ['Mixing owners','','An input whose value comes from a prop but whose changes are also kept locally will fight itself. Pick one owner per value.']
    ],
    ex:{
      task:'Two panels, each showing a temperature in a different unit, that stay in sync. Type in either and the other updates. Keep one number in the parent.',
      start:`function Field({ label, value, onChange }) {\n  return (\n    <label>{label} <input value={value} onChange={e => onChange(e.target.value)} /></label>\n  );\n}\n\nfunction App() {\n  // your code\n}`,
      sol:`function Field({ label, value, onChange }) {\n  return (\n    <label style={{ display: 'block' }}>\n      {label}{' '}\n      <input value={value} onChange={e => onChange(e.target.value)} />\n    </label>\n  );\n}\n\nfunction App() {\n  const [celsius, setCelsius] = useState('20');\n\n  const fahrenheit = celsius === '' ? '' : String(Number(celsius) * 9 / 5 + 32);\n\n  return (\n    <div>\n      <Field label="°C" value={celsius} onChange={setCelsius} />\n      <Field\n        label="°F"\n        value={fahrenheit}\n        onChange={f => setCelsius(f === '' ? '' : String((Number(f) - 32) * 5 / 9))}\n      />\n    </div>\n  );\n}`,
      why:'One number is stored; the other is computed on the way out and converted back on the way in. Storing both would give you two truths and a rounding fight, where typing in one field slowly corrupts the other. This is the same principle as lesson 17, derived state: if a value can be computed from another, compute it. The empty-string checks exist because an input can legitimately be empty, and Number("") is 0, which would otherwise jump the other field to 32.'
    },
    mm:'Shared state belongs to the nearest common parent, and travels back down as a value plus a callback.'
  },
  {
    id:'15', t:'Controlled inputs and forms',
    what:[
      'A controlled input is one whose displayed value comes from React state, and whose every keystroke goes through your onChange handler back into that state.',
      'The state is the single source of truth. The DOM node is only a view of it.'
    ],
    why:[
      'Because the value lives in state, you can do things to it while the user types: validate, format, force uppercase, cap the length, enable a button, mirror it somewhere else on the page. None of that is possible if the value only exists inside the input.',
      'The cost is a render per keystroke. That is almost always fine, and Module 5 covers what to do on the rare occasion it is not.'
    ],
    code:`function App() {\n  const [form, setForm] = useState({ name: '', email: '', plan: 'free', terms: false });\n  const [sent, setSent] = useState(null);\n\n  // one handler for every field, keyed by the input's name\n  function update(e) {\n    const { name, value, type, checked } = e.target;\n    setForm(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));\n  }\n\n  const emailLooksOk = form.email.includes('@');\n  const canSubmit = form.name.trim() !== '' && emailLooksOk && form.terms;\n\n  function handleSubmit(e) {\n    e.preventDefault();\n    setSent(form);\n  }\n\n  return (\n    <form onSubmit={handleSubmit}>\n      <input name="name" value={form.name} onChange={update} placeholder="Name" />\n      <input name="email" value={form.email} onChange={update} placeholder="Email" />\n      {form.email !== '' && !emailLooksOk && <p>Needs an @.</p>}\n\n      <select name="plan" value={form.plan} onChange={update}>\n        <option value="free">Free</option>\n        <option value="pro">Pro</option>\n      </select>\n\n      <label>\n        <input name="terms" type="checkbox" checked={form.terms} onChange={update} />\n        I agree\n      </label>\n\n      <button type="submit" disabled={!canSubmit}>Send</button>\n      {sent && <pre>{JSON.stringify(sent, null, 2)}</pre>}\n    </form>\n  );\n}`,
    anno:[
      ['value={form.name} onChange={update}','The two halves of control. value makes React the source of truth; onChange is the only way the truth can change.'],
      ['const { name, value } = e.target;','Read the input\'s name attribute to know which field changed. One handler, any number of text fields.'],
      ['[name]: value','A computed property name: the key is whatever the string name holds. This is plain JavaScript, and it is how one handler updates the right field.'],
      ['type === \'checkbox\' ? checked : value','Checkboxes report their state on checked, not value, and use checked={} rather than value={}. Radios use checked too, compared against their own value.'],
      ['const canSubmit = ...','Derived on every render from state. No extra state, nothing to keep in sync, and it cannot be wrong.'],
      ['e.preventDefault()','Without it the browser does a full page navigation and everything you typed disappears.']
    ],
    mistakes:[
      ['value without onChange','Warning: You provided a `value` prop to a form field without an `onChange` handler. This will render a read-only field.','React holds the value fixed, so typing does nothing. Add onChange, or use defaultValue for an uncontrolled field, or add readOnly if that was the intent.'],
      ['value={undefined} on first render','Warning: A component is changing an uncontrolled input to be controlled.','Initialise text state to an empty string, never undefined or null. useState(\'\') is the fix.'],
      ['Mutating the state object in the handler','','form.name = value; setForm(form) does nothing at all: same reference. Spread into a new object.'],
      ['checked={value} on a checkbox','Warning: Invalid value for prop `value` on <input> tag / it stays unchecked','Checkboxes and radios are controlled through checked. Reaching for value here is the most common mix-up in forms.']
    ],
    ex:{
      task:'Build a sign-up form with an email field, a password field, and a confirm field. Show a live error when the passwords differ, and disable the button until everything is valid. Keep all three fields in one state object.',
      start:`function App() {\n  const [form, setForm] = useState({ email: '', pw: '', pw2: '' });\n  // your code\n}`,
      sol:`function App() {\n  const [form, setForm] = useState({ email: '', pw: '', pw2: '' });\n\n  const update = e =>\n    setForm(prev => ({ ...prev, [e.target.name]: e.target.value }));\n\n  const mismatch = form.pw2 !== '' && form.pw !== form.pw2;\n  const valid =\n    form.email.includes('@') && form.pw.length >= 8 && form.pw === form.pw2;\n\n  return (\n    <form onSubmit={e => { e.preventDefault(); alert('ok'); }}>\n      <input name="email" value={form.email} onChange={update} placeholder="Email" />\n      <input name="pw" type="password" value={form.pw} onChange={update} placeholder="Password" />\n      <input name="pw2" type="password" value={form.pw2} onChange={update} placeholder="Confirm" />\n      {mismatch && <p>Passwords do not match.</p>}\n      {form.pw !== '' && form.pw.length < 8 && <p>At least 8 characters.</p>}\n      <button type="submit" disabled={!valid}>Create account</button>\n    </form>\n  );\n}`,
      why:'One state object plus one handler scales to any number of text fields, and the input\'s own name attribute does the routing. Every validation result is derived at render time rather than stored, so there is no possibility of a stale error message. The mismatch check waits until the confirm field is non-empty, because showing an error before the user has typed anything is hostile. For a form with fifteen fields, cross-field rules, and async checks, this hand-rolled approach starts to hurt, which is when React Hook Form earns its place: lesson 34.'
    },
    mm:'A controlled input renders from state and writes back through onChange, making state the only truth.'
  },
  {
    id:'16', t:'Uncontrolled inputs, and when to prefer them',
    what:[
      'An uncontrolled input keeps its own value in the DOM. You give it a defaultValue if you want a starting point, and read it when you need it, usually on submit.',
      'You read it either from the form itself, through e.target.elements, or with a ref pointing at the node.'
    ],
    why:[
      'Not every value needs to be watched. A twelve-field form where you only care about the answers at submit time does not benefit from twelve pieces of state and a render per keystroke; it just costs more code.',
      'Uncontrolled inputs are also the honest choice for things the browser already does well: file inputs, which cannot be controlled at all, and native validation. And a controlled input becomes genuinely awkward once a value is expensive to compute on every keystroke, though the usual answer there is debouncing rather than giving up control.',
      'Use controlled when the UI reacts as the user types. Use uncontrolled when it does not.'
    ],
    code:`function App() {\n  const nameRef = useRef(null);\n  const [result, setResult] = useState(null);\n\n  function handleSubmit(e) {\n    e.preventDefault();\n    const data = new FormData(e.target);            // everything at once\n    setResult(Object.fromEntries(data.entries()));\n  }\n\n  return (\n    <div>\n      <form onSubmit={handleSubmit}>\n        <input name="name" defaultValue="Ada" ref={nameRef} />\n        <input name="colour" defaultValue="green" />\n        <select name="size" defaultValue="m">\n          <option value="s">Small</option>\n          <option value="m">Medium</option>\n        </select>\n        <button type="submit">Read all fields</button>\n      </form>\n\n      <button onClick={() => nameRef.current.focus()}>Focus the name</button>\n      <button onClick={() => setResult({ name: nameRef.current.value })}>\n        Read just the name\n      </button>\n\n      {result && <pre>{JSON.stringify(result, null, 2)}</pre>}\n    </div>\n  );\n}`,
    anno:[
      ['defaultValue="Ada"','The initial value only. React sets it once and then leaves the node alone. Using value here instead would make the field read-only unless you also add onChange.'],
      ['new FormData(e.target)','The browser collects every named field for you. Object.fromEntries turns it into a plain object. No state, no handlers, no per-keystroke renders.'],
      ['ref={nameRef}','A direct handle on the DOM node. In React 19 ref is an ordinary prop, so you can pass it to your own components without forwardRef. Lesson 26 covers refs properly.'],
      ['nameRef.current.value','Reading the DOM. Fine on demand, in an event handler. Reading it during render would be wrong, because the value can change without a render and React would show stale output.'],
      ['defaultChecked','The checkbox and radio equivalent of defaultValue.']
    ],
    mistakes:[
      ['Switching between controlled and uncontrolled','Warning: A component is changing a controlled input to be uncontrolled.','Caused by value={maybeUndefined}. Decide once per input and keep it. If the value can be absent, coerce: value={x ?? \'\'}.'],
      ['Both value and defaultValue','Warning: <input> elements must be either controlled or uncontrolled. Decide between using a controlled or uncontrolled input element.','Remove one. defaultValue is ignored when value is present.'],
      ['Trying to control a file input','','It cannot be done, for security reasons: only the user may set a file input\'s value. Use a ref, or read it in onChange from e.target.files.'],
      ['Reading a ref during render','','nameRef.current.value in the render body gives you a value React did not cause and will not track. Read refs in handlers and effects.']
    ],
    ex:{
      task:'Build a search form with three uncontrolled fields that logs all of them on submit, plus a Clear button that resets the form without touching state.',
      start:`function App() {\n  // your code\n}`,
      sol:`function App() {\n  const formRef = useRef(null);\n  const [shown, setShown] = useState(null);\n\n  function handleSubmit(e) {\n    e.preventDefault();\n    setShown(Object.fromEntries(new FormData(e.target).entries()));\n  }\n\n  return (\n    <div>\n      <form ref={formRef} onSubmit={handleSubmit}>\n        <input name="q" defaultValue="react" placeholder="Query" />\n        <input name="author" placeholder="Author" />\n        <input name="year" type="number" defaultValue="2026" />\n        <button type="submit">Search</button>\n        <button type="button" onClick={() => { formRef.current.reset(); setShown(null); }}>\n          Clear\n        </button>\n      </form>\n      {shown && <pre>{JSON.stringify(shown, null, 2)}</pre>}\n    </div>\n  );\n}`,
      why:'Zero renders while typing, and the whole form is read in one line at submit time. Clear uses the DOM form\'s own reset method, which restores every defaultValue: the browser already implements what would otherwise be a loop over your state. Note type="button" on the Clear button, since a button inside a form defaults to type="submit" and would otherwise submit the form. The trade-off is that nothing on the page can react as the user types, so the moment you need a live character count or an enabled/disabled button, that field becomes controlled.'
    },
    mm:'Control an input when the UI must respond while typing; otherwise let the DOM hold the value and read it when you need it.'
  },
  {
    id:'17', t:'Derived state: compute, do not store',
    what:[
      'If a value can be calculated from existing state or props, calculate it during render. Do not put it in its own piece of state.',
      'The related rule: do not copy a prop into state unless you specifically want a value that starts from the prop and then goes its own way.'
    ],
    why:[
      'Two pieces of state that describe the same thing can disagree, and eventually will. Storing both items and itemCount means every code path that changes one must remember the other. Computing itemCount from items makes disagreement impossible.',
      'Fewer pieces of state also means fewer effects. Most useEffect calls that beginners write exist to keep one piece of state in step with another, which is a problem that disappears when the second piece stops existing. That is the subject of lesson 25.'
    ],
    code:`function App() {\n  const [items, setItems] = useState([\n    { id: 1, name: 'Mug', price: 8, qty: 2 },\n    { id: 2, name: 'Tote', price: 12, qty: 1 }\n  ]);\n  const [query, setQuery] = useState('');\n\n  // all derived: no state, no effects, never stale\n  const visible = items.filter(i =>\n    i.name.toLowerCase().includes(query.toLowerCase())\n  );\n  const count = items.reduce((n, i) => n + i.qty, 0);\n  const total = items.reduce((n, i) => n + i.qty * i.price, 0);\n  const isEmpty = count === 0;\n\n  return (\n    <div>\n      <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Filter" />\n      <ul>\n        {visible.map(i => (\n          <li key={i.id}>\n            {i.name} × {i.qty}\n            <button onClick={() => setItems(prev =>\n              prev.map(p => p.id === i.id ? { ...p, qty: p.qty + 1 } : p)\n            )}>+</button>\n          </li>\n        ))}\n      </ul>\n      <p>{count} items, £{total}{isEmpty && ' — cart is empty'}</p>\n    </div>\n  );\n}`,
    anno:[
      ['const visible = items.filter(...)','Computed fresh on every render. Adding an item or typing in the box changes the result automatically, because the result is not stored anywhere.'],
      ['const total = items.reduce(...)','The classic candidate for accidental extra state. Stored, it needs updating in four places. Derived, it cannot be wrong.'],
      ['setItems(prev => prev.map(...))','One update to one array, and count, total, visible, and isEmpty all follow. That is four bugs that no longer exist.'],
      ['useMemo(() => items.filter(...), [items, query])','Wrap a derivation only if it is genuinely expensive and you have measured it. Filtering a hundred rows is not. Module 5 covers when it is.'],
      ['const [total, setTotal] = useState(0)','The anti-pattern. If you see this next to an items array, you have found a bug that has not happened yet.']
    ],
    mistakes:[
      ['Syncing state with an effect','','useEffect(() => setTotal(sum(items)), [items]) works but renders twice per change, and adds a moment where total and items disagree. Delete the state and the effect, and compute total in the body.'],
      ['Mirroring a prop into state','','useState(props.value) freezes the initial prop. When the parent sends a new one, your copy ignores it. If you meant "initial value", rename the prop to initialValue so the next reader knows. If you meant "follow the prop", read the prop.'],
      ['Storing the selected object instead of its id','','Keep selectedId in state and look the object up during render. Storing the object leaves you holding a stale copy after the list refreshes.'],
      ['Resetting state with an effect when a prop changes','','The idiomatic fix is a key on the child, which makes React remount it and discard its state. Lesson 25 shows it.']
    ],
    ex:{
      task:'A list with a text filter and a sort toggle. Store only the raw list, the query, and the sort direction; derive everything else.',
      start:`function App() {\n  const [people] = useState([\n    { id: 1, name: 'Ada', age: 36 },\n    { id: 2, name: 'Grace', age: 45 },\n    { id: 3, name: 'Alan', age: 41 }\n  ]);\n  // your code\n}`,
      sol:`function App() {\n  const [people] = useState([\n    { id: 1, name: 'Ada', age: 36 },\n    { id: 2, name: 'Grace', age: 45 },\n    { id: 3, name: 'Alan', age: 41 }\n  ]);\n  const [query, setQuery] = useState('');\n  const [asc, setAsc] = useState(true);\n\n  const shown = people\n    .filter(p => p.name.toLowerCase().startsWith(query.toLowerCase()))\n    .sort((a, b) => (asc ? a.age - b.age : b.age - a.age));\n\n  return (\n    <div>\n      <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Starts with" />\n      <button onClick={() => setAsc(a => !a)}>\n        Age {asc ? 'ascending' : 'descending'}\n      </button>\n      <p>{shown.length} of {people.length}</p>\n      <ul>{shown.map(p => <li key={p.id}>{p.name}, {p.age}</li>)}</ul>\n    </div>\n  );\n}`,
      why:'Three pieces of state, three independent reasons to change, and nothing that can fall out of step. Notice that sort is safe here even though it mutates, because filter has already returned a fresh array; calling people.sort() directly would mutate state and is the bug lesson 12 warns about. The count in the summary line is shown.length rather than a stored number, so it can never lag behind the list it describes.'
    },
    mm:'State is for what the user changed; everything implied by it is a calculation, not a fact to store.'
  },
  {
    id:'18', t:'useReducer, when transitions get tangled',
    what:[
      'useReducer moves state changes out of your handlers and into one function. You dispatch an action describing what happened, and the reducer decides what the next state should be.',
      'It is the same state, stored the same way and batched the same way. What changes is where the logic lives.'
    ],
    why:[
      'With several useState calls, the rules for a single event get scattered across the handlers that touch them. A "submit failed" event might need to set an error, clear a loading flag, keep the draft, and increment a retry count. Written across four setters in three handlers, the invalid combinations become reachable.',
      'A reducer puts every transition in one place, as a switch you can read top to bottom, test without React, and reason about as a state machine. It also stops dispatch changing identity between renders, which removes a whole class of dependency problems in effects and memoised children.',
      'Reach for it when several pieces of state change together, when the next state depends on the previous in non-trivial ways, or when you catch yourself writing the same three setters in more than one handler.'
    ],

      ['return () => controller.abort();','The cleanup cancels. React runs it when id changes, so clicking through the buttons quickly leaves exactly one live request: the newest.'],
      ['if (err.name === \'AbortError\') return;','An abort rejects the promise. That is not an error the user should see, so it is swallowed. Forgetting this line is why aborted requests show up as scary error messages.'],
      ['setLoading(true); setError(null);','Reset the previous outcome as the new request starts, or the user sees last request\'s error under this request\'s spinner.'],
      ['let ignore = false; ... return () => { ignore = true; };','The alternative pattern, when you cannot cancel: guard every setState with if (!ignore). It fixes the race but still lets the request finish.'],
      ['}, [id]);','The whole fetch keyed on what it depends on. Any other value the request uses belongs in this array too.']
    ],
    mistakes:[
      ['Treating "no data" and "not loaded yet" as the same state','','data === null then means both, and the empty state flashes before every load. Keep loading separate, and render the empty state only when a request has finished with nothing.'],
      ['An async effect function','Warning: An effect function must not return anything besides a function, which is used for clean-up. It looks like you wrote useEffect(async () => ...).','An async function returns a promise, and React expects a cleanup function. Declare the async function inside the effect and call it, or use .then as above.'],
      ['No cancellation','','Type fast in a search box and the result you see is whichever request happened to be slowest. Abort, or use an ignore flag. This is the bug interviewers ask about most.'],
      ['Fetching in an effect on every render','','No dependency array means fetch, setState, render, fetch. Watch your network tab if a page feels slow for no reason.']
    ],
    ex:{
      task:'Build a search box that fetches as you type, with loading and error states, and make sure the last thing you typed always wins. Reuse fakeApi and treat the query length as the id.',
      start:`function fakeApi(q, signal) {\n  return new Promise((resolve, reject) => {\n    const t = setTimeout(() => resolve({ q, hits: q.length * 3 }), 200 + Math.random() * 1000);\n    if (signal) signal.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('Aborted', 'AbortError')); });\n  });\n}\n\nfunction App() {\n  const [q, setQ] = useState('');\n  // your code\n}`,
      sol:`function fakeApi(q, signal) {\n  return new Promise((resolve, reject) => {\n    const t = setTimeout(() => resolve({ q, hits: q.length * 3 }), 200 + Math.random() * 1000);\n    if (signal) signal.addEventListener('abort', () => { clearTimeout(t); reject(new DOMException('Aborted', 'AbortError')); });\n  });\n}\n\nfunction App() {\n  const [q, setQ] = useState('');\n  const [res, setRes] = useState(null);\n  const [loading, setLoading] = useState(false);\n  const [error, setError] = useState(null);\n\n  useEffect(() => {\n    if (q.trim() === '') { setRes(null); setLoading(false); return; }\n\n    const controller = new AbortController();\n    setLoading(true);\n    setError(null);\n\n    fakeApi(q, controller.signal)\n      .then(r => { setRes(r); setLoading(false); })\n      .catch(e => {\n        if (e.name === 'AbortError') return;\n        setError(e.message); setLoading(false);\n      });\n\n    return () => controller.abort();\n  }, [q]);\n\n  return (\n    <div>\n      <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search" />\n      {loading && <p>Searching…</p>}\n      {error && <p>{error}</p>}\n      {!loading && res && <p>{res.hits} hits for “{res.q}”</p>}\n      {!loading && !res && !error && <p>Type something.</p>}\n    </div>\n  );\n}`,
      why:'Every keystroke aborts the previous request, so at most one is ever live and the answer on screen always belongs to the text in the box. The early return for an empty query is a small thing that matters: it stops a pointless request and resets the result, and returning before creating the controller means there is nothing to clean up. What is still missing is debouncing, so this fires a request per character; lesson 27 adds useDebounce, and in production TanStack Query would give you cancellation, caching, and deduplication for free.'
    },
    mm:'Every fetch in an effect needs an answer to one question: what happens if the user has moved on before the response arrives?'
  },
  {
    id:'22', t:'Dependency gotchas and stale closures',
    what:[
      'An effect closes over the props, state, and functions from the render that created it. If a value it uses is not in the dependency array, the effect keeps using the old one forever. That is a stale closure.',
      'The opposite problem is a dependency that changes identity on every render, such as an object or a function created in the body, which makes the effect re-run constantly.'
    ],
    why:[
      'The dependency array is your description of what the effect reads. React cannot inspect the closure, so it trusts the list. A missing entry is a promise you broke, and the linter in eslint-plugin-react-hooks exists to catch it.',
      'The identity problem is the same rule seen from the other side: React compares with Object.is, and {} is never Object.is-equal to another {}. So the fix for a re-running effect is almost never to delete the dependency; it is to stop creating a new value every render, or to depend on the primitive inside it.'
    ],
    code:`function Broken() {\n  const [n, setN] = useState(0);\n\n  useEffect(() => {\n    const id = setInterval(() => setN(n + 1), 1000);   // n is frozen at 0\n    return () => clearInterval(id);\n  }, []);                                              // lying: it reads n\n\n  return <p>Broken, sticks at 1: {n}</p>;\n}\n\nfunction FixedWithUpdater() {\n  const [n, setN] = useState(0);\n\n  useEffect(() => {\n    const id = setInterval(() => setN(x => x + 1), 1000);  // reads nothing\n    return () => clearInterval(id);\n  }, []);\n\n  return <p>Fixed with an updater: {n}</p>;\n}\n\nfunction FixedWithDep() {\n  const [n, setN] = useState(0);\n\n  useEffect(() => {\n    const id = setTimeout(() => setN(n + 1), 1000);   // honest about n\n    return () => clearTimeout(id);\n  }, [n]);                                            // re-arms each time\n\n  return <p>Fixed by depending on n: {n}</p>;\n}\n\nfunction App() {\n  return <div><Broken /><FixedWithUpdater /><FixedWithDep /></div>;\n}`,
    anno:[
      ['setInterval(() => setN(n + 1), 1000)','The arrow captures n from the first render, which is 0. Every tick computes 0 + 1, so the display reaches 1 and stops.'],
      ['}, []);','The lie. The effect does read n, so an empty array tells React it never needs to re-run and the closure is never refreshed.'],
      ['setN(x => x + 1)','The best fix here: the updater form reads nothing from the closure, so the effect genuinely has no dependencies and the empty array becomes true.'],
      ['}, [n]);','The other honest fix: list n and let the effect tear down and set up on every change. Correct, but with an interval it means clearing and recreating a timer every second.'],
      ['}, [{ min: 0 }]);','A new object literal every render, so the effect runs every render. Depend on the primitive instead: [range.min].'],
      ['}, [onDone]);','A function prop recreated by the parent has the same problem. The parent wraps it in useCallback, or the effect stops depending on it with useEffectEvent, lesson 24.']
    ],
    mistakes:[
      ['Silencing the linter','','// eslint-disable-next-line react-hooks/exhaustive-deps above an effect is a note saying "I know this is wrong". Occasionally justified, and always worth a comment explaining which value you are deliberately freezing.'],
      ['Deleting a dependency to stop a loop','','The loop is information: something in the array changes every render. Find out what, and stabilise it. Removing it converts a visible loop into an invisible stale value.'],
      ['Putting a whole object in the array','Effect re-runs on every render for no visible reason','[user] where user is rebuilt from a fetch each render never compares equal. Use [user.id].'],
      ['Depending on state you only write','','If the effect only calls setCount, it does not read count, so count is not a dependency. Use the updater form and the array can stay empty and honest.']
    ],
    ex:{
      task:'This component is meant to log the current filter once a second. It logs the first filter forever. Fix it two ways: once by adding the dependency, once by making the effect read nothing stale.',
      start:`function App() {\n  const [filter, setFilter] = useState('all');\n  const [seen, setSeen] = useState([]);\n\n  useEffect(() => {\n    const id = setInterval(() => {\n      setSeen(prev => [...prev, filter].slice(-4));\n    }, 1000);\n    return () => clearInterval(id);\n  }, []);\n\n  return (\n    <div>\n      <button onClick={() => setFilter('done')}>done</button>\n      <button onClick={() => setFilter('todo')}>todo</button>\n      <p>last seen: {seen.join(', ')}</p>\n    </div>\n  );\n}`,
      sol:`function App() {\n  const [filter, setFilter] = useState('all');\n  const [seen, setSeen] = useState([]);\n  const filterRef = useRef(filter);\n  filterRef.current = filter;   // fix 2: a mutable box the effect reads at tick time\n\n  // fix 1: be honest, and accept that the timer restarts on every change\n  useEffect(() => {\n    const id = setInterval(() => {\n      setSeen(prev => [...prev, filter].slice(-4));\n    }, 1000);\n    return () => clearInterval(id);\n  }, [filter]);\n\n  // fix 2, same idea without restarting the timer:\n  // useEffect(() => {\n  //   const id = setInterval(() => {\n  //     setSeen(prev => [...prev, filterRef.current].slice(-4));\n  //   }, 1000);\n  //   return () => clearInterval(id);\n  // }, []);\n\n  return (\n    <div>\n      <button onClick={() => setFilter('done')}>done</button>\n      <button onClick={() => setFilter('todo')}>todo</button>\n      <p>filter: {filter}, last seen: {seen.join(', ')}</p>\n    </div>\n  );\n}`,
      why:'Fix one is the default: list what you read, and let React re-run the effect. Its cost is visible here, because the interval resets and the next log is a full second away from the click. Fix two keeps the timer running by reading the latest value out of a ref at the moment of the tick, which works because a ref is a stable box whose contents are not part of the closure. Both are legitimate. The third and now preferred option for this exact shape, an effect that should not re-run but must see the latest value, is useEffectEvent in the next lesson.'
    },
    mm:'The dependency array is a promise about what the effect reads, and a stale closure is what a broken promise looks like.'
  },
  {
    id:'23', t:'useEffect versus useLayoutEffect',
    what:[
      'Both take a function and a dependency array and both accept a cleanup. The only difference is when they run.',
      'useEffect runs after the browser has painted. useLayoutEffect runs after React has changed the DOM but before the paint, so anything it writes is included in the same frame the user sees.'
    ],
    why:[
      'If you measure an element and then move it in useEffect, the user briefly sees the unmoved version. One frame at 60Hz is 16ms, which is enough to read as a flicker or a jump, particularly for tooltips, dropdowns, and autosized text areas.',
      'useLayoutEffect closes that gap by blocking the paint until it has finished. That is also its cost: slow work in a layout effect delays the frame and the page feels unresponsive. So the rule is narrow: reach for it only to read layout and immediately adjust it, and use useEffect for everything else.',
      'It also does not run during server rendering, since there is no layout on a server, and React warns if you use one in code that gets server-rendered.'
    ],
    code:`function Tooltip({ text }) {\n  const boxRef = useRef(null);\n  const [above, setAbove] = useState(false);\n\n  // measure and flip before the browser paints\n  useLayoutEffect(() => {\n    const rect = boxRef.current.getBoundingClientRect();\n    setAbove(rect.bottom > window.innerHeight - 40);\n  }, [text]);\n\n  return (\n    <span style={{ position: 'relative', display: 'inline-block' }}>\n      trigger\n      <span\n        ref={boxRef}\n        style={{\n          position: 'absolute', left: 0, whiteSpace: 'nowrap',\n          [above ? 'bottom' : 'top']: '100%',\n          background: '#141C19', color: '#DFE7E1', padding: '2px 6px', fontSize: 12\n        }}\n      >\n        {text} ({above ? 'flipped above' : 'below'})\n      </span>\n    </span>\n  );\n}\n\nfunction App() {\n  const [n, setN] = useState(1);\n  return (\n    <div style={{ paddingTop: 30 }}>\n      <Tooltip text={'measured ' + n} />\n      <p><button onClick={() => setN(n + 1)}>Re-measure</button></p>\n    </div>\n  );\n}`,
    anno:[
      ['useLayoutEffect(() => { ... }, [text])','Runs after the DOM exists but before paint. The setAbove here causes a second render that also completes before the frame is shown, so no intermediate position is ever visible.'],
      ['boxRef.current.getBoundingClientRect()','Reading real geometry, which only exists after the DOM update. This is the one job that genuinely needs the earlier timing.'],
      ['[above ? \'bottom\' : \'top\']: \'100%\'','A computed key in the style object, so one property flips the tooltip. Plain JavaScript, no special React feature.'],
      ['useEffect instead, here','Try swapping it. On a slow machine, or with a big enough jump, the tooltip is drawn in the wrong place for one frame and then snaps.'],
      ['ref={boxRef}','A ref is the only way to reach a DOM node for measurement, and lesson 26 covers it properly.']
    ],
    mistakes:[
      ['Reaching for useLayoutEffect by default','','It blocks painting. Most effects, including fetching, subscriptions, logging, and title changes, do not affect layout and belong in useEffect.'],
      ['Doing expensive work in a layout effect','','Long loops, big DOM reads and writes, or a synchronous setState cascade all delay the frame directly. The user feels this as jank.'],
      ['Using it on the server','Warning: useLayoutEffect does nothing on the server, because its effect cannot be encoded into the renderer\'s output.','Expected but noisy. Either move the work to useEffect, or gate the component so it only renders on the client.'],
      ['Measuring in the render body','','Reading getBoundingClientRect during render is both impure and wrong: the DOM you are measuring is the previous one, or does not exist yet.']
    ],
    ex:{
      task:'Build a textarea that grows to fit its content with no visible flicker as you type, using a layout effect to set its height from scrollHeight.',
      start:`function Grower() {\n  const ref = useRef(null);\n  const [text, setText] = useState('type a few lines\\nlike this');\n  // your layout effect\n  return <textarea ref={ref} value={text} onChange={e => setText(e.target.value)} rows={1} style={{ width: '100%', resize: 'none', overflow: 'hidden' }} />;\n}\n\nfunction App() { return <Grower />; }`,
      sol:`function Grower() {\n  const ref = useRef(null);\n  const [text, setText] = useState('type a few lines\\nlike this');\n\n  useLayoutEffect(() => {\n    const node = ref.current;\n    node.style.height = 'auto';                    // reset, or it only ever grows\n    node.style.height = node.scrollHeight + 'px';  // then size to content\n  }, [text]);\n\n  return (\n    <textarea\n      ref={ref}\n      value={text}\n      onChange={e => setText(e.target.value)}\n      rows={1}\n      style={{ width: '100%', resize: 'none', overflow: 'hidden' }}\n    />\n  );\n}\n\nfunction App() { return <Grower />; }`,
      why:'This is the textbook case for useLayoutEffect: the height depends on the rendered content, so it can only be computed after the DOM update, and it must be applied before the paint or every keystroke shows a one-frame jump. The height reset to auto first is the detail people miss, because scrollHeight of an already-tall box is its current height, so without it the textarea can grow but never shrink. Writing straight to node.style rather than to state is deliberate: it avoids a second render per keystroke, and nothing else in the component needs to know the height.'
    },
    mm:'useLayoutEffect is for measuring and adjusting before the frame is shown; everything else waits until after paint.'
  },
  {
    id:'24', t:'useEffectEvent, for the value an effect should not depend on',
    what:[
      'useEffectEvent wraps a function so that it always sees the latest props and state, while not counting as a dependency of the effects that call it.',
      'It is stable in React 19.2, and it is imported from react like any other hook. It may only be called from inside an effect, never during render, and never passed to a child as a prop.'
    ],
    why:[
      'Effects mix two kinds of value. Some are reactive: change the room id and you genuinely want to disconnect and reconnect. Others are not: the effect reads the current theme when it logs a message, but a theme change should not tear down the socket.',
      'Before this hook there were only bad options: list the non-reactive value and suffer needless re-runs, omit it and get a stale closure, or keep it in a ref and write the plumbing by hand. useEffectEvent names the distinction directly, which is why the lint rule can stop arguing with you.',
      'The mental split is worth keeping: reactive values belong in the dependency array; the latest-value-at-the-time-it-happens belongs in an effect event.'
    ],
    code:`function Chat({ roomId, theme }) {\n  const [log, setLog] = useState([]);\n\n  // not reactive: reads the latest theme, never re-runs the effect\n  const onConnected = useEffectEvent(() => {\n    setLog(prev => [...prev, 'joined ' + roomId + ' in ' + theme + ' mode'].slice(-4));\n  });\n\n  useEffect(() => {\n    // pretend to open a socket\n    const id = setTimeout(onConnected, 300);\n    return () => clearTimeout(id);\n  }, [roomId]);        // only roomId reconnects. theme is not listed, and should not be.\n\n  return (\n    <div>\n      <p>room {roomId}, {theme}</p>\n      <ul>{log.map((l, i) => <li key={i}>{l}</li>)}</ul>\n    </div>\n  );\n}\n\nfunction App() {\n  const [room, setRoom] = useState('general');\n  const [theme, setTheme] = useState('light');\n  return (\n    <div>\n      <button onClick={() => setRoom(room === 'general' ? 'random' : 'general')}>\n        Switch room (reconnects)\n      </button>\n      <button onClick={() => setTheme(theme === 'light' ? 'dark' : 'light')}>\n        Switch theme (does not reconnect)\n      </button>\n      <Chat roomId={room} theme={theme} />\n    </div>\n  );\n}`,
    anno:[
      ['const onConnected = useEffectEvent(() => { ... })','Returns a stable function. Its body is re-created every render behind the scenes, so it always closes over the current props and state.'],
      ['}, [roomId]);','theme is used by the effect, through onConnected, and is deliberately not a dependency. The lint rule understands this and will not ask for it.'],
      ['setTimeout(onConnected, 300)','Calling an effect event from inside an effect is the intended use. Press the theme button and no reconnect happens; press the room button and one does.'],
      ['Not allowed: onClick={onConnected}','Effect events are not general callbacks. Passing one to a child or using it as an event handler is a violation the linter reports.'],
      ['The ref alternative','A ref updated on every render gives the same latest-value behaviour with more code and no lint support. That is what people wrote before 19.2, and what you will still see in older codebases.']
    ],
    mistakes:[
      ['Calling it during render','','It reads values that only make sense at the moment the effect fires, so React forbids calling it in the render body. Use a plain function or useCallback for anything render-time.'],
      ['Using it to silence a dependency you actually want to react to','','If a change should restart the effect, the value is reactive and belongs in the array. Effect events are for values the effect merely reads.'],
      ['Passing it down as a prop','','A child cannot know when it is safe to call. Keep effect events private to the component that declares them.'],
      ['Assuming it exists in older React','TypeError: (0 , _react.useEffectEvent) is not a function','It is new in 19.2. On earlier versions use the ref pattern, and note there was an experimental useEvent proposal with a different name and behaviour.']
    ],
    ex:{
      task:'A component polls a fake endpoint every two seconds and reports the result together with the currently selected units. Changing units must not restart the poll.',
      start:`function App() {\n  const [units, setUnits] = useState('C');\n  const [readings, setReadings] = useState([]);\n  // your effect and effect event\n}`,
      sol:`function App() {\n  const [units, setUnits] = useState('C');\n  const [readings, setReadings] = useState([]);\n  const [poll, setPoll] = useState(2000);\n\n  const record = useEffectEvent(() => {\n    const c = Math.round(15 + Math.random() * 10);\n    const value = units === 'C' ? c + '°C' : Math.round(c * 9 / 5 + 32) + '°F';\n    setReadings(prev => [...prev, value].slice(-5));\n  });\n\n  useEffect(() => {\n    const id = setInterval(record, poll);\n    return () => clearInterval(id);\n  }, [poll]);   // only the interval length is reactive\n\n  return (\n    <div>\n      <button onClick={() => setUnits(u => (u === 'C' ? 'F' : 'C'))}>Units: {units}</button>\n      <button onClick={() => setPoll(p => (p === 2000 ? 500 : 2000))}>Every {poll}ms</button>\n      <p>{readings.join('  ')}</p>\n    </div>\n  );\n}`,
      why:'Two values, two treatments. The poll interval is reactive: changing it must clear the old timer and start a new one, so it is in the dependency array. The units are not: the next reading should use whatever is selected when it happens, and switching units mid-poll should not lose the timer\'s place. Without useEffectEvent you would either restart the interval on every unit change, which visibly delays the next reading, or capture a stale unit and label your readings wrongly. Reach for this hook whenever an effect needs the current value of something it should not react to.'
    },
    mm:'Dependencies are for values that should restart the effect; useEffectEvent is for values the effect merely reads when something happens.'
  },
  {
    id:'25', t:'You might not need an effect',
    what:[
      'Effects synchronise React with something outside it. If both sides of your synchronisation are inside React, the effect is usually the wrong tool.',
      'Four patterns cover almost every unnecessary effect: transforming data for rendering, responding to a user event, resetting state when a prop changes, and initialising state from a prop.'
    ],
    why:[
      'Every effect that sets state costs an extra render, and creates a moment where the screen is internally inconsistent. It also has to be kept in step with a dependency array by hand, which is one more thing to get wrong when the code changes.',
      'The alternatives are all cheaper. A value computed during render cannot be stale. Logic in an event handler runs once, in the place the reader will look for it. A key on a child resets its state without any code at all.'
    ],
    code:`// 1. NOT an effect: derive during render\nfunction Cart({ items }) {\n  const total = items.reduce((n, i) => n + i.price, 0);   // no state, no effect\n  return <p>{items.length} items, £{total}</p>;\n}\n\n// 2. NOT an effect: do it in the handler\nfunction Buy({ items }) {\n  const [receipt, setReceipt] = useState(null);\n\n  function handleBuy() {\n    // this belongs to the click, not to a state change\n    setReceipt({ at: new Date().toLocaleTimeString(), n: items.length });\n  }\n\n  return (\n    <div>\n      <button onClick={handleBuy}>Buy</button>\n      {receipt && <p>Bought {receipt.n} at {receipt.at}</p>}\n    </div>\n  );\n}\n\n// 3. NOT an effect: reset with a key\nfunction Notes({ userId }) {\n  const [text, setText] = useState('');   // fresh per user, because of the key below\n  return (\n    <textarea\n      value={text}\n      onChange={e => setText(e.target.value)}\n      placeholder={'notes for user ' + userId}\n      style={{ width: '100%' }}\n    />\n  );\n}\n\nfunction App() {\n  const [userId, setUserId] = useState(1);\n  const items = [{ price: 8 }, { price: 12 }];\n\n  return (\n    <div>\n      <Cart items={items} />\n      <Buy items={items} />\n      <button onClick={() => setUserId(id => (id === 1 ? 2 : 1))}>\n        Switch user (now {userId})\n      </button>\n      <Notes key={userId} userId={userId} />\n    </div>\n  );\n}`,
    anno:[
      ['const total = items.reduce(...)','Case one. The effect-and-state version, useEffect(() => setTotal(...), [items]), renders twice and can show a stale total for one frame.'],
      ['function handleBuy() { setReceipt(...) }','Case two. An effect watching a "bought" flag would run on mount too, and would separate the cause from the consequence by a render.'],
      ['<Notes key={userId} />','Case three. Changing the key makes React unmount the old Notes and mount a fresh one, so its state resets with no effect and no code inside the child.'],
      ['useState(props.value)','Case four. Legal, but it only reads the prop once. If you want it to follow the prop, read the prop; if you want an initial value, name it initialValue.'],
      ['The one thing that still needs an effect','Anything genuinely external: sockets, timers, browser APIs, analytics, non-React widgets, and fetching if you are not using a library.']
    ],
    mistakes:[
      ['Chaining effects to compute state','','An effect that sets state, which triggers an effect that sets more state, is very hard to follow and renders once per link. Compute the whole thing in one place, or use a reducer so one action makes every change.'],
      ['An effect to sync a prop into state','','This is the mirroring bug in disguise. It leaves a render where the copy and the prop disagree, and it double-renders every parent update.'],
      ['An effect to notify a parent','','useEffect(() => onChange(value), [value]) fires after the fact, including on mount. Call onChange in the same handler that changed the value.'],
      ['An effect with no dependency array to "run on every change"','','That is what the render body is. If it does not touch anything external, it is not an effect.']
    ],
    ex:{
      task:'Rewrite this component to remove both effects. The filtered list should be derived, and the reset when the category changes should happen without an effect.',
      start:`function App() {\n  const [category, setCategory] = useState('fruit');\n  const [query, setQuery] = useState('');\n  const [visible, setVisible] = useState([]);\n\n  const all = [\n    { id: 1, name: 'apple', cat: 'fruit' },\n    { id: 2, name: 'apricot', cat: 'fruit' },\n    { id: 3, name: 'leek', cat: 'veg' }\n  ];\n\n  useEffect(() => {\n    setVisible(all.filter(i => i.cat === category && i.name.includes(query)));\n  }, [category, query]);\n\n  useEffect(() => { setQuery(''); }, [category]);\n\n  return <div>…</div>;\n}`,
      sol:`const ALL = [\n  { id: 1, name: 'apple', cat: 'fruit' },\n  { id: 2, name: 'apricot', cat: 'fruit' },\n  { id: 3, name: 'leek', cat: 'veg' }\n];\n\nfunction Browser({ category }) {\n  const [query, setQuery] = useState('');   // resets, because App gives us a key\n\n  const visible = ALL.filter(\n    i => i.cat === category && i.name.includes(query)\n  );\n\n  return (\n    <div>\n      <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Filter" />\n      <ul>{visible.map(i => <li key={i.id}>{i.name}</li>)}</ul>\n      {visible.length === 0 && <p>Nothing matches.</p>}\n    </div>\n  );\n}\n\nfunction App() {\n  const [category, setCategory] = useState('fruit');\n  return (\n    <div>\n      <button onClick={() => setCategory(c => (c === 'fruit' ? 'veg' : 'fruit'))}>\n        Category: {category}\n      </button>\n      <Browser key={category} category={category} />\n    </div>\n  );\n}`,
      why:'The first effect and the visible state both disappear, because a filtered list is a calculation. The second effect disappears too: extracting a child and keying it on the category means React throws the old instance away and the new one starts with an empty query, which is precisely what the effect was trying to arrange. Notice that the data moved out of the component to a module constant, because rebuilding the array on every render made it a new reference each time, which is the sort of thing that quietly breaks dependency arrays and memoisation later.'
    },
    mm:'If both sides of the synchronisation live inside React, compute it, handle it, or key it, and delete the effect.'

  {

    what:[
      'useRef returns an object with a single mutable property, current, that survives every render and never triggers one when you change it.',

    code:`// React 19: ref is just a prop, no forwardRef needed\nfunction Field({ label, ref, ...rest }) {\n  return (\n    <label style={{ display: 'block', marginBottom: 6 }}>\n      {label}{' '}\n      <input ref={ref} {...rest} />\n    </label>\n  );\n}\n\nfunction App() {\n  const inputRef = useRef(null);      // a DOM node\n  const runsRef = useRef(0);          // a value that must not cause renders\n  const [n, setN] = useState(0);\n\n  runsRef.current++;                  // fine: no re-render, no state\n\n  return (\n    <div>\n      <Field label="Name" ref={inputRef} placeholder="click the button" />\n      <button onClick={() => inputRef.current.focus()}>Focus the field</button>\n      <button onClick={() => inputRef.current.select()}>Select its text</button>\n      <p>renders: {n}, times this body ran: {runsRef.current}</p>\n      <button onClick={() => setN(x => x + 1)}>Re-render</button>\n    </div>\n  );\n}`,
    anno:[
      ['const inputRef = useRef(null);','null is the initial current. React sets it to the DOM node after commit and back to null on unmount.'],

    ex:{
      task:'Build a stopwatch with start, stop, and reset. Keep the interval id in a ref, the elapsed time in state, and make sure starting twice cannot create two timers.',
      start:`function App() {\n  const [ms, setMs] = useState(0);\n  const timer = useRef(null);\n  // your code\n}`,
      sol:`function App() {\n  const [ms, setMs] = useState(0);\n  const timer = useRef(null);\n\n  function start() {\n    if (timer.current !== null) return;      // already running\n    timer.current = setInterval(() => setMs(t => t + 100), 100);\n  }\n\n  function stop() {\n    clearInterval(timer.current);\n    timer.current = null;\n  }\n\n  useEffect(() => stop, []);                 // clear on unmount\n\n  return (\n    <div>\n      <p style={{ fontVariantNumeric: 'tabular-nums' }}>{(ms / 1000).toFixed(1)}s</p>\n      <button onClick={start}>Start</button>\n      <button onClick={stop}>Stop</button>\n      <button onClick={() => { stop(); setMs(0); }}>Reset</button>\n    </div>\n  );\n}`,
      why:'The interval id is the perfect ref: the display must not change when it changes, and it must survive renders so that stop can find it. Storing it in state would re-render on every start and stop for nothing, and a plain local variable would be lost on the next render, leaving an unstoppable timer. The null check in start is what makes double-clicking safe, and using null as the "not running" marker means one value answers both questions. useEffect(() => stop, []) returns stop itself as the cleanup, which is a neat way to guarantee the timer dies with the component.'
