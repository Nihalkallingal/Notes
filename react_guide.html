  {
    id:'38', t:'React.memo, useMemo, useCallback',
    what:[
      'React.memo wraps a component so React skips re-rendering it when its props are shallowly equal to last time. useMemo caches a computed value between renders. useCallback caches a function.',
      'All three are caches keyed on a dependency array, and all three cost memory and a comparison. They are optimisations, never correctness fixes.'
    ],
    why:[
      'The classic trap: you wrap a child in React.memo, and it still re-renders every time, because the parent passes it a fresh arrow function or object literal. Shallow equality compares by reference, and a new function is a new reference, so the memo can never hit.',
      'That is why useCallback and useMemo exist alongside memo: they stabilise the props you pass to a memoised child. On their own, wrapping a value in useMemo changes nothing for the user, which is why sprinkling them everywhere makes code worse rather than faster.',
      'There is one case where useMemo is close to correctness: a value used in a dependency array. An object rebuilt every render will re-run every effect that depends on it, forever.'
    ],
    code:`const Row = memo(function Row({ item, onPick }) {\n  console.log('rendering row', item.id);\n  return (\n    <li>\n      {item.name} <button onClick={() => onPick(item.id)}>pick</button>\n    </li>\n  );\n});\n\nfunction App() {\n  const [items] = useState([{ id: 1, name: 'Mug' }, { id: 2, name: 'Tote' }]);\n  const [tick, setTick] = useState(0);\n  const [picked, setPicked] = useState(null);\n  const [stable, setStable] = useState(true);\n\n  // stable identity across renders, so memo can do its job\n  const onPickStable = useCallback(id => setPicked(id), []);\n  // a new function every render: memo is defeated\n  const onPickFresh = id => setPicked(id);\n\n  return (\n    <div>\n      <button onClick={() => setTick(t => t + 1)}>Re-render the parent ({tick})</button>\n      <button onClick={() => setStable(s => !s)}>\n        callback: {stable ? 'useCallback (memo works)' : 'inline (memo defeated)'}\n      </button>\n      <p>picked: {picked ?? 'nothing'}</p>\n      <ul>\n        {items.map(item => (\n          <Row key={item.id} item={item} onPick={stable ? onPickStable : onPickFresh} />\n        ))}\n      </ul>\n      <p><small>Open the console, then press “Re-render the parent” in both modes.</small></p>\n    </div>\n  );\n}`,
    anno:[
      ['memo(function Row({ item, onPick }) { ... })','Wraps the component. React now compares each prop with Object.is before rendering, and skips the render if they all match.'],
      ['useCallback(id => setPicked(id), [])','Returns the same function object on every render, because the dependency array is empty and the body only uses a setter, which is stable.'],
      ['const onPickFresh = id => setPicked(id);','A new function object every render. Shallow comparison sees a changed prop, so memo re-renders and you paid for the comparison as well.'],
      ['item={item}','Also needs to be stable. items lives in state and is never rebuilt here, so each item keeps its identity. Rebuilding the array in the render body would defeat the memo in the same way.'],
      ['useMemo(() => heavy(a), [a])','Caches a value. Worth it when heavy is genuinely slow, or when the result feeds a dependency array or a memoised child.'],
      ['areEqual, the second argument to memo','A custom comparison. Almost always a sign that the props are the wrong shape; fix the shape instead.']
    ],
    mistakes:[
      ['memo with an inline callback prop','','The single most common wasted optimisation. Either useCallback the handler, or accept the re-render, which is usually fine.'],
      ['Wrapping everything in useMemo and useCallback','','Each one adds a closure, an array, and a comparison on every render, plus noise in the code. Without a measurement you have probably made it slower.'],
      ['Using useMemo for correctness','','React may discard a cache. If your code breaks when the value is recomputed, it was broken already. The exception is identity for dependency arrays, and there the right answer is often to restructure.'],
      ['Memoising a component that takes children','','<Card>{...}</Card> passes a new element object every render, so a memoised Card never hits unless the children are memoised too.']
    ],
    ex:{
      task:'A memoised chart re-renders on every keystroke because of two unstable props. Find both and fix them, then say why the third prop was already fine.',
      start:`const Chart = memo(function Chart({ series, options, title }) {\n  console.log('chart render');\n  return <p>{title}: {series.join(', ')} ({options.unit})</p>;\n});\n\nfunction App() {\n  const [text, setText] = useState('');\n  const raw = [3, 1, 4];\n\n  return (\n    <div>\n      <input value={text} onChange={e => setText(e.target.value)} />\n      <Chart series={raw.map(n => n * 2)} options={{ unit: 'ms' }} title="Latency" />\n    </div>\n  );\n}`,
      sol:`const Chart = memo(function Chart({ series, options, title }) {\n  console.log('chart render');\n  return <p>{title}: {series.join(', ')} ({options.unit})</p>;\n});\n\nconst RAW = [3, 1, 4];                    // hoisted: one array for the module\nconst OPTIONS = { unit: 'ms' };           // constant, so no hook needed at all\n\nfunction App() {\n  const [text, setText] = useState('');\n  const [scale, setScale] = useState(2);\n\n  // depends on scale, so it must be memoised rather than hoisted\n  const series = useMemo(() => RAW.map(n => n * scale), [scale]);\n\n  return (\n    <div>\n      <input value={text} onChange={e => setText(e.target.value)} placeholder="type: no chart render" />\n      <button onClick={() => setScale(s => s + 1)}>Scale ×{scale}</button>\n      <Chart series={series} options={OPTIONS} title="Latency" />\n    </div>\n  );\n}`,
      why:'Both bugs were fresh references: raw.map(...) built a new array on every render, and { unit: \'ms\' } a new object. The fixes differ, and the difference is the lesson. The options object never varies, so it belongs outside the component as a constant, which is cheaper and clearer than useMemo. The series does vary with scale, so it needs a cache keyed on scale. The title prop was fine all along because "Latency" is a string, and strings compare by value, so a literal is stable by definition. Typing now logs nothing, and changing the scale logs exactly one chart render.'
    },
    mm:'Memoisation compares references, so it only pays off when the props you pass are stable too.'
  },
  {
    id:'39', t:'The React Compiler',
    what:[
      'React Compiler is a build-time tool that adds memoisation to your code automatically. It reached its first stable release, 1.0, in October 2025, and works with both React and React Native.',
      'It understands data flow and mutability well enough to cache components, values, and functions where a human would have written React.memo, useMemo, and useCallback, including on conditional paths that manual memoisation cannot reach.'
    ],
    why:[
      'Manual memoisation is tedious, easy to get wrong, and rots. A dependency array drifts out of step with the code above it, a memo is defeated by one inline arrow, and nobody deletes the useMemo that is no longer needed. The compiler does the same job from the source of truth, on every build.',
      'It also ships validation. The compiler encodes the Rules of React and reports where they are broken, which surfaces real latent bugs; those diagnostics arrive through eslint-plugin-react-hooks, whose recommended presets now include the compiler-powered rules. You can use the linter without installing the compiler.',
      'What this changes about the advice in lesson 38: with the compiler on, do not write useMemo and useCallback for identity or for cheap values. Keep them where you have measured a genuinely expensive computation, or where a third-party API requires a stable reference. Without the compiler, the old advice stands.'
    ],
    code:`// This playground does not run the compiler, so the code below is what\n// you would WRITE with it enabled: no memo, no useMemo, no useCallback.\n\nfunction Row({ item, onPick }) {\n  return <li>{item.name} <button onClick={() => onPick(item.id)}>pick</button></li>;\n}\n\nfunction App() {\n  const [items] = useState([{ id: 1, name: 'Mug' }, { id: 2, name: 'Tote' }]);\n  const [text, setText] = useState('');\n  const [picked, setPicked] = useState(null);\n\n  // with the compiler: an ordinary function, memoised for you\n  const onPick = id => setPicked(id);\n\n  // with the compiler: an ordinary calculation, cached for you\n  const names = items.map(i => i.name.toUpperCase());\n\n  return (\n    <div>\n      <input value={text} onChange={e => setText(e.target.value)} placeholder="type here" />\n      <p>picked: {picked ?? 'nothing'} / {names.join(', ')}</p>\n      <ul>{items.map(i => <Row key={i.id} item={i} onPick={onPick} />)}</ul>\n    </div>\n  );\n}`,
    anno:[
      ['const onPick = id => setPicked(id);','Written plainly. The compiler gives it a stable identity where that matters, so the equivalent of useCallback happens without the ceremony.'],
      ['const names = items.map(...)','Cached against items automatically. You write the calculation; the compiler decides what to remember.'],
      ['No React.memo on Row','The compiler memoises the component itself where it can prove that is safe, which is why the manual wrapper mostly disappears.'],
      ['npm i -D babel-plugin-react-compiler','How you enable it, as a Babel or SWC plugin. There are first-party templates for Vite, Next.js, and Expo, and an incremental adoption guide for existing codebases.'],
      ['eslint-plugin-react-hooks','The compiler\'s diagnostics arrive here, in the recommended presets, and work without the compiler installed. Turn this on first, whatever else you decide.'],
      ['"use no memo"','A directive to opt one component out, for the rare case where the compiler\'s memoisation exposes a bug in code that was already breaking the rules.']
    ],
    mistakes:[
      ['Expecting it to fix impure components','','It relies on the Rules of React. Mutating props, writing to a module variable during render, or reading a ref in the render body can all break under automatic memoisation, which is why the linter matters more than the compiler.'],
      ['Adding it and keeping every manual memo','','Harmless but noisy. Delete identity-only memoisation as you touch files, and keep the ones that guard measured expensive work.'],
      ['Assuming it makes performance work unnecessary','','It removes one category of waste. It cannot virtualise a list, split a bundle, or make a slow algorithm fast.'],
      ['Treating it as required','','It is opt-in per project. React works exactly as before without it, and the manual tools are not deprecated.']
    ],
    ex:{
      task:'Take the memoised chart from lesson 38 and rewrite it as you would with the compiler enabled. Then list which of the original optimisations you would still keep, and why.',
      start:`// rewrite without memo, useMemo, or useCallback\nfunction App() {\n  return <p>your code</p>;\n}`,
      sol:`function Chart({ series, options, title }) {\n  return <p>{title}: {series.join(', ')} ({options.unit})</p>;\n}\n\nfunction App() {\n  const [text, setText] = useState('');\n  const [scale, setScale] = useState(2);\n\n  const series = [3, 1, 4].map(n => n * scale);   // compiler caches this\n  const options = { unit: 'ms' };                 // and this\n\n  // Still worth keeping by hand, even with the compiler:\n  //  1. a genuinely expensive computation you have measured, where you want\n  //     the cache to be explicit and reviewable;\n  //  2. a stable reference demanded by a non-React API, such as a map library\n  //     or an IntersectionObserver callback;\n  //  3. a value used inside a dependency array, where identity is semantics\n  //     rather than performance.\n\n  return (\n    <div>\n      <input value={text} onChange={e => setText(e.target.value)} placeholder="type here" />\n      <button onClick={() => setScale(s => s + 1)}>Scale ×{scale}</button>\n      <Chart series={series} options={options} title="Latency" />\n    </div>\n  );\n}`,
      why:'The code is shorter and reads as what it does rather than as a set of instructions to React. Note what did not change: hoisting a truly constant array to module scope is still better than letting anything memoise it, because a constant needs no cache at all. The three exceptions in the comment are the ones worth being able to say out loud in an interview, since "the compiler makes useMemo obsolete" is only true of the identity-plumbing cases, and a senior answer names the ones that survive.'
    },
    mm:'The compiler automates the memoisation you used to write by hand, on the condition that your components obey the rules.'
  },
  {
    id:'40', t:'Virtualising long lists',
    what:[
      'Virtualisation, or windowing, means rendering only the rows that are currently visible plus a small buffer, and faking the height of the rest so that scrolling still behaves.',
      'Ten thousand rows becomes about twenty DOM nodes that are recycled as you scroll.'
    ],
    why:[
      'Every row costs a component render, DOM nodes, style recalculation, and memory. At a few thousand rows the first paint takes seconds and scrolling stutters, and no amount of memoisation helps, because the work is real: you asked for ten thousand rows.',
      'The user can only see twenty of them. Windowing aligns the work with what is visible, which turns an O(n) problem into an O(viewport) one.',
      'In production use TanStack Virtual or react-window rather than the code below. They handle variable row heights, horizontal windowing, scroll-to-index, sticky headers, and the awkward interaction with keyboard navigation and find-in-page. The version here exists so you know what they do.'
    ],
    code:`const ROWS = Array.from({ length: 10000 }, (_, i) => ({\n  id: i, name: 'Row ' + i, value: (i * 37) % 100\n}));\n\nconst ROW_H = 24;\nconst VIEW_H = 200;\nconst BUFFER = 4;\n\nfunction VirtualList({ rows }) {\n  const [scrollTop, setScrollTop] = useState(0);\n\n  const first = Math.max(0, Math.floor(scrollTop / ROW_H) - BUFFER);\n  const visibleCount = Math.ceil(VIEW_H / ROW_H) + BUFFER * 2;\n  const slice = rows.slice(first, first + visibleCount);\n\n  return (\n    <div>\n      <div\n        onScroll={e => setScrollTop(e.currentTarget.scrollTop)}\n        style={{ height: VIEW_H, overflowY: 'auto', border: '1px solid #C7CDC3' }}\n      >\n        {/* the spacer gives the scrollbar the full height */}\n        <div style={{ height: rows.length * ROW_H, position: 'relative' }}>\n          {slice.map((row, i) => (\n            <div\n              key={row.id}\n              style={{\n                position: 'absolute',\n                top: (first + i) * ROW_H,\n                height: ROW_H, left: 0, right: 0,\n                display: 'flex', gap: 8, alignItems: 'center', padding: '0 6px'\n              }}\n            >\n              <span style={{ width: 80 }}>{row.name}</span>\n              <span>{row.value}</span>\n            </div>\n          ))}\n        </div>\n      </div>\n      <p><small>{rows.length} rows in the data, {slice.length} in the DOM.</small></p>\n    </div>\n  );\n}\n\nfunction App() { return <VirtualList rows={ROWS} />; }`,
    anno:[
      ['const ROWS = Array.from({ length: 10000 })','Built once at module level. Rebuilding it in the render body would be the actual performance problem.'],
      ['Math.floor(scrollTop / ROW_H)','Which row is at the top of the viewport. Fixed row height is what makes this arithmetic possible; variable heights need measurement and a cache, which is most of what a library adds.'],
      ['height: rows.length * ROW_H','The spacer. Without it the scrollbar would reflect twenty rows and the user could not reach row 9,000.'],
      ['position: \'absolute\', top: (first + i) * ROW_H','Each visible row is placed at its true offset, so the window appears to be a slice of a very long list.'],
      ['BUFFER','Extra rows above and below, so a fast scroll does not show blank space before the next render lands.'],
      ['key={row.id}','Still from the data. Keying by the position within the slice would recycle rows incorrectly and lose any per-row state.']
    ],
    mistakes:[
      ['Reaching for virtualisation before pagination','','Ten thousand rows is often a design problem. Search, filters, and pagination may serve the user better than a very long scroll.'],
      ['Breaking find-in-page and accessibility','','Rows that are not in the DOM cannot be found by the browser\'s search, or read by a screen reader, or tabbed to. Provide a search, and use the ARIA grid roles a library gives you.'],
      ['Setting state on every scroll event without care','','A render per scroll event is usually fine at this size, but the handler must stay trivial. Heavy work per row is what makes windowing feel worse than it should.'],
      ['Variable row heights with fixed maths','','If one row wraps to two lines, every offset below it is wrong. Measure, or force a fixed height, or use a library that measures for you.']
    ],
    ex:{
      task:'Add a filter box above the list that narrows the ten thousand rows, and make sure the window resets to the top when the filter changes.',
      start:`// reuse ROWS, ROW_H, VIEW_H from the example\nfunction App() {\n  const [query, setQuery] = useState('');\n  // your code\n}`,
      sol:`const ROWS = Array.from({ length: 10000 }, (_, i) => ({ id: i, name: 'Row ' + i }));\nconst ROW_H = 24;\nconst VIEW_H = 200;\n\nfunction VirtualList({ rows }) {\n  const [scrollTop, setScrollTop] = useState(0);\n  const first = Math.max(0, Math.floor(scrollTop / ROW_H) - 4);\n  const slice = rows.slice(first, first + Math.ceil(VIEW_H / ROW_H) + 8);\n\n  return (\n    <div\n      onScroll={e => setScrollTop(e.currentTarget.scrollTop)}\n      style={{ height: VIEW_H, overflowY: 'auto', border: '1px solid #C7CDC3' }}\n    >\n      <div style={{ height: rows.length * ROW_H, position: 'relative' }}>\n        {slice.map((row, i) => (\n          <div key={row.id} style={{\n            position: 'absolute', top: (first + i) * ROW_H, height: ROW_H,\n            left: 0, right: 0, padding: '0 6px'\n          }}>{row.name}</div>\n        ))}\n      </div>\n    </div>\n  );\n}\n\nfunction App() {\n  const [query, setQuery] = useState('');\n\n  const rows = useMemo(\n    () => (query === '' ? ROWS : ROWS.filter(r => r.name.includes(query))),\n    [query]\n  );\n\n  return (\n    <div>\n      <input value={query} onChange={e => setQuery(e.target.value)} placeholder="filter, e.g. 42" />\n      <p><small>{rows.length} matching rows</small></p>\n      {/* the key resets the scroll position by remounting the window */}\n      <VirtualList key={query} rows={rows} />\n    </div>\n  );\n}`,
      why:'Two things worth noticing. The filter is wrapped in useMemo because it walks ten thousand rows on every keystroke, which is the rare case where the cost is real and measurable, so this is memoisation with a reason rather than by reflex. The scroll reset uses key={query}, which remounts the list and therefore discards both the scrollTop state and the DOM scroll position; setting scrollTop back to zero in state would not move the actual scrollbar, so the key is doing genuine work here. It is the same remount mechanism as lesson 25, used deliberately. In production, filtering ten thousand rows on the client is itself the smell: that work usually belongs on the server.'
    },
    mm:'Render what fits on the screen and fake the height of the rest.'
  },
  {
    id:'41', t:'Code splitting with lazy and Suspense',
    what:[
      'lazy takes a function that returns a dynamic import and gives you back a component. The first time it renders, the browser fetches that chunk; until it arrives, the nearest Suspense boundary shows its fallback.',
      'Your bundler sees the dynamic import and splits the code into a separate file automatically.'
    ],
    why:[
      'Everything in the main bundle has to be downloaded, parsed, and executed before the page is interactive, including the settings dialog nobody opens and the chart library only admins see. Splitting moves that cost to the moment it is needed.',
      'Route level is the obvious boundary and the biggest win: a user who visits three pages downloads three pages. Component level is for heavy things behind an interaction, such as an editor, a map, or a PDF viewer.',
      'The trade-off is a request at exactly the moment the user acts, which can feel slower than a slightly bigger bundle. Preloading on hover or intent, and keeping fallbacks the same shape as the content, is what makes splitting invisible.'
    ],
    code:`// A real app writes: const Editor = lazy(() => import('./Editor'));\n// The playground has no module loader, so this fakes the same promise.\nfunction Editor() {\n  return (\n    <div style={{ border: '1px solid #C7CDC3', padding: 8 }}>\n      <p>A heavy editor, loaded on demand.</p>\n      <textarea defaultValue="type something" style={{ width: '100%' }} />\n    </div>\n  );\n}\n\nconst LazyEditor = lazy(() =>\n  new Promise(resolve => setTimeout(() => resolve({ default: Editor }), 1200))\n);\n\nfunction Skeleton() {\n  return (\n    <div style={{ border: '1px dashed #C7CDC3', padding: 8, color: '#4E5A54' }}>\n      Loading the editor…\n    </div>\n  );\n}\n\nfunction App() {\n  const [open, setOpen] = useState(false);\n\n  return (\n    <div>\n      <p>The rest of the page is interactive while the chunk downloads.</p>\n      <button onClick={() => setOpen(o => !o)}>\n        {open ? 'Hide' : 'Open'} the editor\n      </button>\n      {open && (\n        <Suspense fallback={<Skeleton />}>\n          <LazyEditor />\n        </Suspense>\n      )}\n      <p><small>Toggle it twice: the second time is instant, because the chunk is cached.</small></p>\n    </div>\n  );\n}`,
    anno:[
      ['lazy(() => import(\'./Editor\'))','The import must be a dynamic import of a module with a default export, and the call must live outside the component, at module level, so the promise is created once.'],
      ['resolve({ default: Editor })','What a dynamic import resolves to: a module object. Naming that here is the only reason this demo can work without a bundler.'],
      ['<Suspense fallback={<Skeleton />}>','The boundary. Any lazy component below it that has not loaded shows this instead. Without a boundary, React throws an error telling you to add one.'],
      ['{open && <Suspense>...</Suspense>}','Nothing is fetched until the component renders for the first time, which is the whole point.'],
      ['Fallback shape','A skeleton the same size as the content prevents the layout jumping when it arrives. A centred spinner in a full-page boundary is usually a downgrade.'],
      ['import(\'./Editor\') on hover','Calling the import early, in an onMouseEnter, warms the cache so the click feels instant. Routers do this for links in the viewport.']
    ],
    mistakes:[
      ['Calling lazy inside a component','','A new lazy component every render means a new download and a remount every time. Declare it at module level.'],
      ['No Suspense boundary','A component suspended while responding to synchronous input. This will cause the UI to be replaced with a loading indicator.','Wrap it in Suspense, or in React 19 use a transition so the old UI stays while the new one loads.'],
      ['Splitting too finely','','Fifty tiny chunks means fifty requests and worse compression than one bundle. Split at routes and at genuinely heavy components.'],
      ['Forgetting the failure case','','A chunk request can fail, particularly after a deploy invalidates old file names. An error boundary around the Suspense boundary, with a reload, is the standard answer.']
    ],
    ex:{
      task:'Split two routes so each loads on demand, share one Suspense boundary, and preload the second route when the user hovers its link.',
      start:`function Reports() { return <p>Reports, a big chunk.</p>; }\nfunction Settings() { return <p>Settings, another chunk.</p>; }\n\n// your code\nfunction App() { return <p>your code</p>; }`,
      sol:`function Reports() { return <p>Reports, a big chunk.</p>; }\nfunction Settings() { return <p>Settings, another chunk.</p>; }\n\n// stands in for () => import('./Reports')\nfunction fakeImport(component, ms) {\n  let promise = null;\n  const load = () => {\n    if (!promise) {\n      promise = new Promise(r => setTimeout(() => r({ default: component }), ms));\n    }\n    return promise;                 // cached: hover then click does not refetch\n  };\n  return { load, Lazy: lazy(load) };\n}\n\nconst reports = fakeImport(Reports, 900);\nconst settings = fakeImport(Settings, 900);\n\nfunction App() {\n  const [route, setRoute] = useState('home');\n\n  return (\n    <div>\n      <nav style={{ display: 'flex', gap: 6 }}>\n        <button onClick={() => setRoute('home')}>Home</button>\n        <button onClick={() => setRoute('reports')}>Reports</button>\n        <button\n          onMouseEnter={settings.load}\n          onFocus={settings.load}\n          onClick={() => setRoute('settings')}\n        >\n          Settings (preloads on hover)\n        </button>\n      </nav>\n\n      <div style={{ borderTop: '1px solid #C7CDC3', marginTop: 8, paddingTop: 8 }}>\n        <Suspense fallback={<p>Loading…</p>}>\n          {route === 'reports' && <reports.Lazy />}\n          {route === 'settings' && <settings.Lazy />}\n          {route === 'home' && <p>Home is in the main bundle.</p>}\n        </Suspense>\n      </div>\n    </div>\n  );\n}`,
      why:'The loader is memoised inside fakeImport, which is exactly what a real dynamic import does: the module registry caches the promise, so calling it on hover and again on click produces one request. That is what makes preloading safe to attach to a hover. One shared Suspense boundary is enough because only one route renders at a time, and putting the boundary outside the switch keeps the navigation visible while the chunk loads rather than replacing the whole page with a spinner. Hover over Settings, wait a second, then click: it appears instantly, while Reports still shows the fallback.'
    },
    mm:'lazy defers a download until first render, and Suspense decides what the user looks at while it happens.'
  },
  {
    id:'42', t:'Concurrent React: transitions and deferred values',
    what:[
      'React can treat some updates as urgent and others as interruptible. Typing in an input is urgent. Re-rendering a large filtered list because of that typing is not.',
      'useTransition marks an update as non-urgent and gives you an isPending flag. useDeferredValue lets a component keep rendering a stale value while React prepares the new one in the background.'
    ],
    why:[
      'Before concurrent rendering, one long render blocked everything, including the keystroke that caused it, so a slow list made the input feel broken. There was no way to say "finish showing the letter I typed first".',
      'Transitions give React permission to interrupt. The urgent update, the input value, commits immediately; the expensive one is rendered in the background and can be abandoned if another keystroke arrives.',
      'Choosing between them: useTransition when you own the event and can wrap the setState, which also gives you a pending flag for a spinner. useDeferredValue when the value arrives as a prop, or when you want the old UI to stay on screen rather than showing a fallback.'
    ],
    code:`function SlowList({ query }) {\n  // pretend each render is expensive\n  const items = [];\n  for (let i = 0; i < 200; i++) {\n    let waste = 0;\n    for (let j = 0; j < 4000; j++) waste += j % 3;\n    items.push(query + ' result ' + i + ' (' + waste + ')');\n  }\n  return <ul>{items.slice(0, 6).map(t => <li key={t}>{t}</li>)}</ul>;\n}\n\nfunction App() {\n  const [text, setText] = useState('a');\n  const [committed, setCommitted] = useState('a');\n  const [isPending, startTransition] = useTransition();\n  const deferred = useDeferredValue(text);\n\n  function onChange(e) {\n    setText(e.target.value);                 // urgent: the input must keep up\n    startTransition(() => setCommitted(e.target.value));  // interruptible\n  }\n\n  return (\n    <div>\n      <input value={text} onChange={onChange} placeholder="type quickly" />\n      <p>\n        input: {text} / transition: {committed} / deferred: {deferred}\n        {isPending && <span> (updating…)</span>}\n      </p>\n      <div style={{ opacity: isPending ? 0.6 : 1 }}>\n        <SlowList query={deferred} />\n      </div>\n    </div>\n  );\n}`,
    anno:[
      ['const [isPending, startTransition] = useTransition()','isPending is true while the transition is rendering, which is how you show a spinner or dim the stale content without blocking anything.'],
      ['startTransition(() => setCommitted(...))','Everything set inside the callback is marked non-urgent. The callback must be synchronous; for async work, React 19 lets you await inside an action, which is lesson 45.'],
      ['setText outside the transition','Deliberate. The input\'s own value must be urgent, or the letters lag behind the keyboard, which is the exact problem this feature solves.'],
      ['const deferred = useDeferredValue(text)','Returns the previous value while a render with the new one happens in the background. No event handler needed, so it works on a prop you were given.'],
      ['opacity: isPending ? 0.6 : 1','The convention for stale content: show the old list, dimmed, rather than a fallback. Users prefer stale data to a spinner.'],
      ['startTransition imported from react','The standalone version, for when you have no component to hold the pending flag.']
    ],
    mistakes:[
      ['Wrapping the input\'s own state in a transition','','The value the user is typing must be urgent. Wrapping it makes the field feel laggy, which is the opposite of the goal.'],
      ['Expecting a transition to make rendering faster','','It does not. It changes the order and lets React interrupt. If the list is slow, it is still slow; virtualise it or do less work.'],
      ['Async work inside startTransition\'s callback','','Anything after an await in a plain startTransition callback is no longer part of the transition. Use an action or useActionState for asynchronous flows.'],
      ['Using useDeferredValue on a cheap component','','Two renders instead of one, for no benefit. It earns its place only when the render it defers is genuinely expensive.']
    ],
    ex:{
      task:'Build a tab switcher where one tab is slow to render, so that clicking it keeps the tab bar responsive and shows a pending state on the tab being opened.',
      start:`function Slow() {\n  let waste = 0;\n  for (let i = 0; i < 3_000_000; i++) waste += i % 5;\n  return <p>Slow tab rendered ({waste})</p>;\n}\n\nfunction App() {\n  const [tab, setTab] = useState('home');\n  // your code\n}`,
      sol:`function Slow() {\n  let waste = 0;\n  for (let i = 0; i < 3_000_000; i++) waste += i % 5;\n  return <p>Slow tab rendered ({waste})</p>;\n}\n\nfunction App() {\n  const [tab, setTab] = useState('home');\n  const [isPending, startTransition] = useTransition();\n\n  function select(next) {\n    startTransition(() => setTab(next));   // the tab change is interruptible\n  }\n\n  const tabs = ['home', 'slow', 'about'];\n\n  return (\n    <div>\n      <div role="tablist" style={{ display: 'flex', gap: 4 }}>\n        {tabs.map(t => (\n          <button\n            key={t}\n            role="tab"\n            aria-selected={tab === t}\n            onClick={() => select(t)}\n            style={{ borderBottom: tab === t ? '2px solid #2F6B57' : '2px solid transparent' }}\n          >\n            {t}{isPending && t === 'slow' && ' …'}\n          </button>\n        ))}\n      </div>\n      <div style={{ paddingTop: 8, opacity: isPending ? 0.6 : 1 }}>\n        {tab === 'slow' ? <Slow /> : <p>{tab} tab, cheap to render.</p>}\n      </div>\n    </div>\n  );\n}`,
      why:'Without the transition, clicking the slow tab freezes the page: the button does not even appear pressed until the render finishes, because the click and the render are the same blocking task. With it, React commits the urgent part immediately and renders the slow tab in the background, so the tab bar stays alive and you can change your mind and click "about" mid-flight, which abandons the slow render entirely. The pending flag then lets the UI say what is happening, which is the difference between an app that feels slow and one that feels honest. Dimming the old content rather than unmounting it is the same instinct.'
    },
    mm:'Urgent updates go straight through; transitions and deferred values let expensive renders happen in the background and be interrupted.'
  },
  {
    id:'43', t:'Profiling: measure before you optimise',
    what:[
      'React DevTools has a Profiler tab. You press record, interact with the app, and get a flame chart of every commit: which components rendered, how long each took, and why they rendered.',
      'The Profiler component does the same measurement in code, calling an onRender callback with timings for its subtree.'

    why:[
      'Intuition about React performance is unreliable. The component that looks expensive is usually cheap, the cost is usually one function nobody suspected, and half of the memoisation in a typical codebase optimises renders that were already sub-millisecond.',
      'Measurement also tells you which of the fixes to reach for. A long single commit means one slow component: do less work, or memoise the computation. Many short commits mean too many renders: look at where the state lives. A slow first paint means bundle size: split it.',
      'React 19.2 also emits its work to the browser\'s own performance timeline, so React renders appear alongside network and paint in Chrome\'s tracks, which is where you look for the interaction that missed a frame.'
    ],
    code:`function Child({ n }) {\n  let waste = 0;\n  for (let i = 0; i < n * 200000; i++) waste += i % 3;\n  return <p>Child with n={n} ({waste})</p>;\n}\n\nfunction App() {\n  const [n, setN] = useState(1);\n  const [show, setShow] = useState(false);\n  const log = useRef([]);\n\n  function onRender(id, phase, actualDuration, baseDuration) {\n    log.current = [\n      { id, phase, actual: actualDuration.toFixed(1), base: baseDuration.toFixed(1) },\n      ...log.current\n    ].slice(0, 6);\n  }\n\n  return (\n    <div>\n      <Profiler id="child-tree" onRender={onRender}>\n        <Child n={n} />\n      </Profiler>\n\n      <button onClick={() => setN(x => x + 1)}>Make it heavier ({n})</button>\n      <button onClick={() => setShow(s => !s)}>Show measurements</button>\n\n      {show && (\n        <table style={{ fontSize: 12, borderCollapse: 'collapse' }}>\n          <thead><tr><th>id</th><th>phase</th><th>actual ms</th><th>base ms</th></tr></thead>\n          <tbody>\n            {log.current.map((r, i) => (\n              <tr key={i}>\n                <td>{r.id}</td><td>{r.phase}</td><td>{r.actual}</td><td>{r.base}</td>\n              </tr>\n            ))}\n          </tbody>\n        </table>\n      )}\n    </div>\n  );\n}`,
    anno:[
      ['<Profiler id="child-tree" onRender={onRender}>','Measures its subtree. It has a small cost, so keep it out of production builds unless you are deliberately sampling.'],
      ['phase','"mount" for the first render, "update" afterwards, and "nested-update" when an effect caused another render. A stream of nested-update entries points at an effect that sets state.'],
      ['actualDuration','How long this commit took for the subtree. The number to watch: anything over about 16ms risks a dropped frame.'],
      ['baseDuration','How long it would take with no memoisation at all. Comparing the two tells you whether your memoisation is doing anything.'],
      ['log.current = [...]','Written to a ref, not to state, because setting state inside onRender would cause another render and another measurement, forever.'],
      ['DevTools: "Why did this render?"','Turn on "Record why each component rendered" in the Profiler settings. It names the prop, state, or context that changed, which is usually the whole answer.']
    ],
    mistakes:[
      ['Optimising without a profile','','The most common waste of effort in React work. Take the measurement first; the result is frequently that the problem is a network request, not a render.'],
      ['Profiling a development build and trusting the numbers','','Development React is much slower, and StrictMode double-renders. Use it for relative comparisons and the "why did it render" answers, and profile a production build for real timings.'],
      ['Setting state in onRender','Warning: Maximum update depth exceeded','Each measurement triggers a render which triggers a measurement. Collect into a ref and display it on demand.'],
      ['Chasing render counts','','Sixty cheap renders are better than one that takes 200ms. The unit of performance is milliseconds and dropped frames.']
    ],
    ex:{
      task:'Instrument two sibling subtrees separately, make one of them slow, and use the measurements to decide which fix from Module 5 applies.',
      start:`function App() {\n  return <p>your code</p>;\n}`,
      sol:`const ROWS = Array.from({ length: 400 }, (_, i) => 'row ' + i);\n\nfunction Cheap({ tick }) {\n  return <p>Cheap subtree, tick {tick}</p>;\n}\n\nfunction Expensive({ tick }) {\n  // 400 rows, each doing a little pointless work\n  return (\n    <ul style={{ maxHeight: 90, overflow: 'auto', margin: 0 }}>\n      {ROWS.map(r => {\n        let waste = 0;\n        for (let i = 0; i < 2000; i++) waste += i % 3;\n        return <li key={r}>{r} ({waste}) at tick {tick}</li>;\n      })}\n    </ul>\n  );\n}\n\nfunction App() {\n  const [tick, setTick] = useState(0);\n  const timings = useRef({});\n\n  const record = (id, phase, actual) => {\n    timings.current[id] = actual.toFixed(1);\n  };\n\n  const [, force] = useState(0);\n\n  return (\n    <div>\n      <button onClick={() => setTick(t => t + 1)}>Tick ({tick})</button>\n      <button onClick={() => force(f => f + 1)}>Read the timings</button>\n      <p>\n        cheap: {timings.current.cheap ?? '—'}ms, expensive: {timings.current.expensive ?? '—'}ms\n      </p>\n\n      <Profiler id="cheap" onRender={record}><Cheap tick={tick} /></Profiler>\n      <Profiler id="expensive" onRender={record}><Expensive tick={tick} /></Profiler>\n    </div>\n  );\n}`,
      why:'Two boundaries turn a vague "the page is slow" into a number per subtree, and the numbers usually differ by an order of magnitude, which immediately tells you where to spend your afternoon. Read the shape of the answer: the expensive subtree is slow in a single commit and the cost scales with the row count, so the fix is windowing from lesson 40, not React.memo, which would prevent nothing here because the tick prop genuinely changes every time. Had the timing instead shown many small commits, the fix would have been to move the fast-changing state down. Note the deliberately ugly force state used only to re-render the display: measurements go in a ref, and you pull them out when you want them.'
    },
    mm:'Profile first, then pick the fix that matches the shape of the problem: fewer renders, cheaper renders, or fewer rows.'
  }
  ]

  {
    id:'44', t:'Suspense for data fetching and the use hook',
    what:[
      'use reads a promise during render. If the promise is pending, the component suspends and the nearest Suspense boundary shows its fallback; when it resolves, React renders again and use returns the value.',
      'It is not a hook in the usual sense. You may call it inside a condition or a loop, because it does not store anything in the hook list.'
    ],
    why:[
      'The effect-based fetch from lesson 21 puts the loading state in every component that loads anything. Suspense moves it up: the child declares what it needs, and an ancestor decides what the waiting looks like. Several children can share one fallback, and the whole tree appears at once instead of in a cascade of spinners.',
      'The pitfall is the promise itself. Rendering is not a one-off, so if you create the promise during render you create a new one on every attempt, which suspends again immediately and loops. The promise must be created outside render and cached, which in practice means a framework, a query library, or your own cache keyed by the request.',
      'In a Server Component you can await directly and never need use. On the client, use is for a promise handed down as a prop or read from a cache.'
    ],
    code:`// The cache is the important part: one promise per key, created outside render.\nconst cache = new Map();\n\nfunction fetchUser(id) {\n  if (!cache.has(id)) {\n    cache.set(id, new Promise(resolve =>\n      setTimeout(() => resolve({ id, name: 'User ' + id }), 900)\n    ));\n  }\n  return cache.get(id);\n}\n\nfunction UserName({ id }) {\n  const user = use(fetchUser(id));   // suspends until resolved\n  return <p>Loaded: {user.name}</p>;\n}\n\nfunction Slow() {\n  const other = use(fetchUser(99));\n  return <p>Also loaded: {other.name}</p>;\n}\n\nfunction App() {\n  const [id, setId] = useState(1);\n\n  return (\n    <div>\n      <button onClick={() => setId(n => n + 1)}>Load the next user ({id})</button>\n      <Suspense fallback={<p>Loading both…</p>}>\n        <UserName id={id} />\n        <Slow />\n      </Suspense>\n      <p><small>Go back to a user you have already seen: it is instant, because the promise is cached.</small></p>\n    </div>\n  );\n}`,
    anno:[
      ['const cache = new Map();','Module level. The same id always returns the same promise object, which is what stops the render loop.'],
      ['use(fetchUser(id))','Reads the promise. On the first attempt it throws internally to suspend; React retries the component when the promise settles.'],
      ['<Suspense fallback={...}>','One boundary for two suspending children, so the user sees one fallback and then both results together, rather than two spinners resolving separately.'],
      ['use(context)','It also reads context, which is the one case where reading a context conditionally is allowed.'],
      ['Creating the promise in the body','fetchUser would be a bug if it built a new promise each call: suspend, retry, new promise, suspend, forever. Interviewers ask about exactly this.'],
      ['Errors','A rejected promise throws from use, so an error boundary is the other half of the pattern: Suspense handles pending, the boundary handles failed.']
    ],
    mistakes:[
      ['Creating the promise during render','','The loop described above. Cache it, or let a library own it. This is the single most common mistake with use.'],
      ['No error boundary around a suspending tree','','A rejected fetch takes down the tree with an unhandled error. Pair every Suspense boundary that reads data with an error boundary.'],
      ['Expecting use to replace a query library','','There is no cache invalidation, no refetching, no deduplication across components, and no stale-while-revalidate. Those are why TanStack Query still exists.'],
      ['Using use in an event handler','','It only works during render. Handlers use await like any other asynchronous code.']
    ],
    ex:{
      task:'Add an error boundary so a failing request shows a retry, and make the cache evictable so the retry actually re-requests.',
      start:`const cache = new Map();\n\nfunction load(id) {\n  if (!cache.has(id)) {\n    cache.set(id, new Promise((resolve, reject) =>\n      setTimeout(() => (id === 2 ? reject(new Error('user 2 is unavailable')) : resolve({ id })), 700)\n    ));\n  }\n  return cache.get(id);\n}\n\nfunction App() {\n  return <p>your code</p>;\n}`,
      sol:`const cache = new Map();\n\nfunction load(id) {\n  if (!cache.has(id)) {\n    cache.set(id, new Promise((resolve, reject) =>\n      setTimeout(() => (id === 2 ? reject(new Error('user 2 is unavailable')) : resolve({ id })), 700)\n    ));\n  }\n  return cache.get(id);\n}\n\nclass Boundary extends React.Component {\n  constructor(p) { super(p); this.state = { error: null }; }\n  static getDerivedStateFromError(error) { return { error }; }\n  render() {\n    if (this.state.error) {\n      return (\n        <div style={{ border: '1px solid #8C5A12', padding: 8 }}>\n          <p>{this.state.error.message}</p>\n          <button onClick={() => { this.props.onRetry(); this.setState({ error: null }); }}>\n            Retry\n          </button>\n        </div>\n      );\n    }\n    return this.props.children;\n  }\n}\n\nfunction User({ id }) {\n  const user = use(load(id));\n  return <p>Loaded user {user.id}</p>;\n}\n\nfunction App() {\n  const [id, setId] = useState(1);\n  const [attempt, setAttempt] = useState(0);\n\n  function retry() {\n    cache.delete(id);          // evict, or use() replays the same rejection\n    setAttempt(a => a + 1);\n  }\n\n  return (\n    <div>\n      <button onClick={() => setId(1)}>User 1 (works)</button>\n      <button onClick={() => setId(2)}>User 2 (fails)</button>\n\n      <Boundary key={id + ':' + attempt} onRetry={retry}>\n        <Suspense fallback={<p>Loading user {id}…</p>}>\n          <User id={id} />\n        </Suspense>\n      </Boundary>\n    </div>\n  );\n}`,
      why:'The eviction is the point. A cached rejected promise is permanently rejected, so without cache.delete the retry button would replay the same failure instantly and look broken. Bumping an attempt counter and using it in the boundary\'s key remounts the boundary and the suspending child together, which is the reset pattern from lesson 29 doing real work here. Note the layering: the error boundary sits outside the Suspense boundary, so a rejection replaces the whole unit rather than being swallowed inside a fallback that never resolves. This is the shape every data library implements for you, which is a reasonable thing to say when an interviewer asks whether you would hand-roll it.'
    },
    mm:'use suspends on a promise you did not create during render, so the cache is not an optimisation but part of the mechanism.'
  },
  {
    id:'45', t:'Actions: useActionState, useFormStatus, useOptimistic',
    what:[
      'An action is an async function passed to a form\'s action prop, or run inside a transition. React manages the pending state, the errors, and the ordering for you.',
      'Three hooks are three views of that one mechanism. useActionState wraps an action and gives you its latest result plus a pending flag. useFormStatus lets a descendant read the enclosing form\'s pending state. useOptimistic shows an assumed result while the action is in flight.'
    ],
    why:[
      'Hand-rolled submit handlers all grow the same four pieces of state: pending, error, result, and an optimistic copy of the data. Actions make that the framework\'s job, which removes a whole class of bugs: double submits, a spinner that never stops, an error from a previous attempt shown under a new one.',
      'The design also degrades well. A form with an action works before JavaScript has loaded, because it is still a form, which is what makes the same code usable in a server-rendered app.',
      'useFormStatus exists so that a submit button, which is often a shared design-system component several levels down, can disable itself without every form passing a pending prop down to it. Note that it is imported from react-dom, not react, and it only reads the form above it.'
    ],
    code:`function fakeSave(text) {\n  return new Promise((resolve, reject) =>\n    setTimeout(() => (text.includes('!') ? reject(new Error('No exclamation marks')) : resolve(text)), 800)\n  );\n}\n\n// a descendant reads the enclosing form's state: no props needed\nfunction SubmitButton({ children }) {\n  const { pending } = useFormStatus();\n  return <button type="submit" disabled={pending}>{pending ? 'Saving…' : children}</button>;\n}\n\nfunction App() {\n  const [notes, setNotes] = useState(['first note']);\n  const [optimistic, addOptimistic] = useOptimistic(\n    notes,\n    (current, pendingText) => [...current, pendingText + ' (saving)']\n  );\n\n  const [error, submit, isPending] = useActionState(async (prevError, formData) => {\n    const text = formData.get('note');\n    if (!text) return 'Write something first.';\n    addOptimistic(text);                 // shown immediately\n    try {\n      const saved = await fakeSave(text);\n      setNotes(list => [...list, saved]);\n      return null;                       // no error\n    } catch (e) {\n      return e.message;                  // becomes the new state\n    }\n  }, null);\n\n  return (\n    <div>\n      <form action={submit}>\n        <input name="note" placeholder="try one with an ! to fail" />\n        <SubmitButton>Add note</SubmitButton>\n      </form>\n      {error && <p style={{ color: '#8C5A12' }}>{error}</p>}\n      <ul>{optimistic.map((n, i) => <li key={i}>{n}</li>)}</ul>\n      <p><small>{isPending ? 'in flight' : 'idle'}</small></p>\n    </div>\n  );\n}`,
    anno:[
      ['<form action={submit}>','React 19 accepts a function here. On submit it calls your action with the FormData, resets the form on success, and manages pending state. No onSubmit, no preventDefault.'],
      ['useActionState(async (prev, formData) => ..., null)','Returns [state, dispatch, isPending]. The action receives the previous state first and the form data second; whatever it returns becomes the new state, which is why errors are returned rather than thrown.'],
      ['useFormStatus()','From react-dom. Reads the nearest form ancestor, so a shared button component knows it is submitting. It returns nothing useful if called in the same component that renders the form.'],
      ['useOptimistic(notes, (current, pending) => ...)','The second argument merges the assumed change into the current value. The optimistic value lasts only while the action runs, then React drops it and shows the real state.'],
      ['addOptimistic(text)','Called inside the action. On failure nothing needs undoing: React discards the optimistic value automatically, which is the part that hand-rolled optimistic updates always get wrong.'],
      ['startTransition(async () => ...)','Actions outside a form. In React 19 an async function inside startTransition is an action, with the same pending semantics.']
    ],
    mistakes:[
      ['Importing useFormStatus from react','TypeError: (0 , _react.useFormStatus) is not a function','It lives in react-dom, because it is about DOM forms.'],
      ['Calling useFormStatus beside the form instead of inside it','','It reads an ancestor form. In the component that renders the <form>, use the isPending from useActionState instead.'],
      ['Throwing from an action to show a validation error','','A thrown error goes to the error boundary and unmounts the form. Return the message as state; throw only for genuine failures.'],
      ['Undoing an optimistic update by hand','','React reverts it when the action settles. Extra rollback code fights the mechanism and usually double-reverts.'],
      ['Assuming actions need a server','','They are a client-side mechanism that also works with server functions. A plain fetch inside an action is perfectly normal.']
