  {
    id:'31', t:'Compound components, render props, and HOCs',
    what:[
      'Compound components are a set of components designed to work together, sharing state through a context that the outer one provides: think Tabs with Tab and TabPanel.',
      'Render props and higher-order components are two older ways to share behaviour. A render prop passes a function that returns markup; an HOC is a function that takes a component and returns a wrapped one.'
    ],
    why:[
      'A single component with a config prop, like items={[{label, content}]}, controls the markup completely. That is fine until a caller wants an icon in one tab, a badge in another, and a different layout on mobile, at which point the prop list grows for ever.',
      'Compound components hand the markup back to the caller and keep only the coordination: which tab is selected, and what happens on arrow keys. The caller composes freely, and the API stays small.',
      'Render props and HOCs solved the same sharing problem before hooks, and hooks replaced almost all of it: a hook shares behaviour without adding a component to the tree or renaming your props. You still need to read them, because every mature codebase contains them, and libraries still use render props where the caller needs to decide the markup for each item.'
    ],
    code:`const TabsContext = createContext(null);\n\nfunction Tabs({ children, defaultValue }) {\n  const [value, setValue] = useState(defaultValue);\n  const ctx = useMemo(() => ({ value, setValue }), [value]);\n  return <TabsContext.Provider value={ctx}>{children}</TabsContext.Provider>;\n}\n\nfunction TabList({ children }) {\n  const items = React.Children.toArray(children);\n  const { value, setValue } = useContext(TabsContext);\n  const values = items.map(c => c.props.value);\n\n  function onKeyDown(e) {\n    const i = values.indexOf(value);\n    if (e.key === 'ArrowRight') setValue(values[(i + 1) % values.length]);\n    if (e.key === 'ArrowLeft') setValue(values[(i - 1 + values.length) % values.length]);\n  }\n\n  return <div role="tablist" onKeyDown={onKeyDown} style={{ display: 'flex', gap: 4 }}>{children}</div>;\n}\n\nfunction Tab({ value: mine, children }) {\n  const { value, setValue } = useContext(TabsContext);\n  const selected = value === mine;\n  return (\n    <button\n      role="tab"\n      aria-selected={selected}\n      tabIndex={selected ? 0 : -1}\n      onClick={() => setValue(mine)}\n      style={{ borderBottom: selected ? '2px solid #2F6B57' : '2px solid transparent' }}\n    >{children}</button>\n  );\n}\n\nfunction TabPanel({ value: mine, children }) {\n  const { value } = useContext(TabsContext);\n  if (value !== mine) return null;\n  return <div role="tabpanel" style={{ paddingTop: 8 }}>{children}</div>;\n}\n\n// a render prop: the caller decides the markup, we decide the data\nfunction List({ items, renderItem }) {\n  return <ul>{items.map(i => <li key={i}>{renderItem(i)}</li>)}</ul>;\n}\n\nfunction App() {\n  return (\n    <Tabs defaultValue="one">\n      <TabList>\n        <Tab value="one">First</Tab>\n        <Tab value="two">Second ★</Tab>\n      </TabList>\n      <TabPanel value="one">\n        <List items={['a', 'b']} renderItem={x => <code>{x.toUpperCase()}</code>} />\n      </TabPanel>\n      <TabPanel value="two">Anything at all can go here.</TabPanel>\n    </Tabs>\n  );\n}`,
    anno:[
      ['<Tabs><TabList><Tab/></TabList><TabPanel/></Tabs>','The caller writes the structure. Tabs contributes nothing visual; it owns the selected value and passes it through context.'],
      ['const ctx = useMemo(() => ({ value, setValue }), [value]);','Memoised for the reason in lesson 28: a fresh object would re-render every Tab and Panel on every keystroke elsewhere in the app.'],
      ['React.Children.toArray(children)','Reads the children as data, which is how TabList learns the order of values for arrow-key navigation. Use it sparingly: it couples the parent to what the caller wrote.'],
      ['tabIndex={selected ? 0 : -1}','The roving tabindex pattern. One stop for the whole tablist, arrows move within it, which is what the ARIA guidance for tabs requires.'],
      ['renderItem={x => <code>{x.toUpperCase()}</code>}','A render prop. The component owns the loop and the keys; the caller owns the markup for one item.'],
      ['const withLogging = C => props => <C {...props} />','The HOC shape, for recognition. It adds a layer to the tree and obscures the props, which is why hooks won.']
    ],
    mistakes:[
      ['Requiring an exact child structure','','If TabList must be the first child and nothing may wrap it, the API is brittle. Look values up from context rather than from positions where you can.'],
      ['Passing state through cloneElement','','React.cloneElement to inject props into children only works one level deep and breaks the moment a caller wraps a Tab in a div. Context reaches any depth.'],
      ['Forgetting keyboard support','','A tab list that only responds to clicks fails its own ARIA contract. Arrow keys, Home and End, and a single tab stop are the baseline.'],
      ['Reaching for an HOC in new code','','Almost anything an HOC did, a hook does with less indirection. Read them, do not write them.']
    ],
    ex:{
      task:'Build an Accordion as compound components, where several sections can be open at once, with a context holding the set of open ids.',
      start:`const AccordionContext = createContext(null);\n\nfunction Accordion({ children }) {\n  // your code\n}\n\nfunction App() {\n  return <Accordion>{/* Section and its children */}</Accordion>;\n}`,
      sol:`const AccordionContext = createContext(null);\n\nfunction Accordion({ children }) {\n  const [open, setOpen] = useState(() => new Set());\n\n  const ctx = useMemo(() => ({\n    isOpen: id => open.has(id),\n    toggle: id => setOpen(prev => {\n      const next = new Set(prev);          // copy: never mutate state\n      if (next.has(id)) next.delete(id); else next.add(id);\n      return next;\n    })\n  }), [open]);\n\n  return <AccordionContext.Provider value={ctx}>{children}</AccordionContext.Provider>;\n}\n\nfunction Section({ id, title, children }) {\n  const { isOpen, toggle } = useContext(AccordionContext);\n  const expanded = isOpen(id);\n\n  return (\n    <div style={{ borderTop: '1px solid #C7CDC3' }}>\n      <h4 style={{ margin: 0 }}>\n        <button\n          aria-expanded={expanded}\n          aria-controls={'panel-' + id}\n          onClick={() => toggle(id)}\n          style={{ width: '100%', textAlign: 'left' }}\n        >\n          {expanded ? '−' : '+'} {title}\n        </button>\n      </h4>\n      {expanded && <div id={'panel-' + id} style={{ padding: '6px 0' }}>{children}</div>}\n    </div>\n  );\n}\n\nfunction App() {\n  return (\n    <Accordion>\n      <Section id="a" title="What it does">Holds open ids in a Set.</Section>\n      <Section id="b" title="Why a Set">Membership tests read better than array indexOf.</Section>\n      <Section id="c" title="Anything here">Even <strong>markup the Accordion never knew about</strong>.</Section>\n    </Accordion>\n  );\n}`,
      why:'The container owns one piece of state and exposes two functions; every section decides its own markup, so a caller can put a chart or a form inside one without touching the Accordion. Copying the Set before mutating is the immutability rule from lesson 12 applied to a Set: new Set(prev) then mutate the copy. The context value is memoised on open, so a section only re-renders when the open set actually changes. aria-expanded and aria-controls are what make this a real disclosure widget rather than a div that hides things, and they cost two attributes.'
    },
    mm:'Give the caller the markup and keep the coordination: compound components trade a long prop list for a small context.'
  },
  {
    id:'32', t:'Routing: the concepts behind React Router',
    what:[
      'Client-side routing means the URL changes and the app swaps components, without a request to the server for a new document. The router reads the URL, matches it against a set of routes, and renders the match.',
      'The vocabulary is small: a route matches a path pattern to an element; route params are the variable parts, like /users/:id; nested routes render a child route inside a parent layout through an outlet; and lazy routes load a route\'s code only when it is first visited.'
    ],
    why:[
      'The URL is state that the user can edit, bookmark, and share, and the back button is an interface people expect to work. Storing "which page am I on" in useState instead means no deep links, no history, and a reload that always returns you to the start.',
      'Nesting exists because layouts nest. A dashboard has a shell with navigation, and the routes inside it change while the shell stays mounted, keeping its scroll position and state. Expressing that as a tree of routes rather than a flat list is what makes the shell reusable.',
      'React has no router of its own. React Router is the common choice, TanStack Router is the type-safe one, and frameworks like Next.js provide their own file-based routing.'
    ],
    code:`// A 40-line router, to show what the concepts are. Use React Router in real work.\nconst RouteContext = createContext({ path: '/', navigate: () => {} });\n\nfunction Router({ children }) {\n  const [path, setPath] = useState('/');\n  const [history, setHistory] = useState(['/']);\n\n  const value = useMemo(() => ({\n    path,\n    navigate: to => { setPath(to); setHistory(h => [...h, to]); },\n    back: () => setHistory(h => {\n      if (h.length < 2) return h;\n      const next = h.slice(0, -1);\n      setPath(next[next.length - 1]);\n      return next;\n    })\n  }), [path]);\n\n  return <RouteContext.Provider value={value}>{children}</RouteContext.Provider>;\n}\n\nfunction Link({ to, children }) {\n  const { navigate } = useContext(RouteContext);\n  // a real Link renders an <a href> and calls preventDefault, so middle-click still works\n  return <button onClick={() => navigate(to)}>{children}</button>;\n}\n\n// '/users/:id' against '/users/7' -> { id: '7' }, or null for no match\nfunction match(pattern, path) {\n  const p = pattern.split('/'), a = path.split('/');\n  if (p.length !== a.length) return null;\n  const params = {};\n  for (let i = 0; i < p.length; i++) {\n    if (p[i].startsWith(':')) params[p[i].slice(1)] = a[i];\n    else if (p[i] !== a[i]) return null;\n  }\n  return params;\n}\n\nfunction Routes({ routes }) {\n  const { path } = useContext(RouteContext);\n  for (const r of routes) {\n    const params = match(r.path, path);\n    if (params) return r.render(params);\n  }\n  return <p>404: nothing at {path}</p>;\n}\n\nfunction Shell({ children }) {\n  const { back } = useContext(RouteContext);\n  return (\n    <div>\n      <nav style={{ display: 'flex', gap: 4, marginBottom: 8 }}>\n        <Link to="/">Home</Link>\n        <Link to="/users/7">User 7</Link>\n        <Link to="/nope">Broken link</Link>\n        <button onClick={back}>Back</button>\n      </nav>\n      <div style={{ borderTop: '1px solid #C7CDC3', paddingTop: 8 }}>{children}</div>\n    </div>\n  );\n}\n\nfunction App() {\n  return (\n    <Router>\n      <Shell>\n        <Routes routes={[\n          { path: '/', render: () => <p>Home. The shell above stays mounted.</p> },\n          { path: '/users/:id', render: ({ id }) => <p>User {id}, read from a route param.</p> }\n        ]} />\n      </Shell>\n    </Router>\n  );\n}`,
    anno:[
      ['const [path, setPath] = useState(\'/\')','The demo keeps the path in state. A real router keeps it in window.history and listens for popstate, which is what makes the browser\'s back button work.'],
      ['function match(pattern, path)','Route matching in twelve lines. Real routers add wildcards, optional segments, and a ranking system so that /users/new beats /users/:id.'],
      ['r.render(params)','Params are extracted from the URL and handed to the route. In React Router you read them with useParams() instead.'],
      ['<Shell>{children}</Shell>','Nesting by composition: the shell renders the matched route inside itself. React Router expresses the same idea with nested route objects and an <Outlet />.'],
      ['<Link to="/">','A real Link renders an anchor with a genuine href and calls preventDefault on click, so the link is still a link: hoverable, copyable, middle-clickable, and visible to crawlers.'],
      ['lazy: () => import(\'./Reports\')','Lazy routes. The bundler splits the route into its own chunk, and Suspense shows a fallback while it loads: lesson 41.']
    ],
    mistakes:[
      ['Using a button or a div as a link','','It breaks open-in-new-tab, right-click, keyboard conventions, and search engines. Render an anchor with an href and intercept the click.'],
      ['Keeping the current page in state instead of the URL','','No deep links, no back button, and a reload loses the user\'s place. If it should survive a refresh or be shareable, it belongs in the URL.'],
      ['Forgetting to reset scroll on navigation','','A single-page app keeps the scroll position when the content changes, so a long page followed by a short one looks blank. Routers give you a ScrollRestoration helper for this.'],
      ['Not handling the no-match case','','Every route table needs a catch-all, or a typo in a URL renders nothing at all with no explanation.']
    ],
    ex:{
      task:'Add a nested route so /users/:id/posts renders inside the user page, and a query-string filter such as /users/7?tab=drafts that the page reads.',
      start:`// extend the router above: add a second level of matching\nfunction App() {\n  return <p>your code</p>;\n}`,
      sol:`const RouteContext = createContext({ path: '/', navigate: () => {} });\n\nfunction Router({ children }) {\n  const [url, setUrl] = useState('/users/7?tab=drafts');\n  const value = useMemo(() => {\n    const [path, query = ''] = url.split('?');\n    const params = new URLSearchParams(query);\n    return { path, query: Object.fromEntries(params.entries()), navigate: setUrl };\n  }, [url]);\n  return <RouteContext.Provider value={value}>{children}</RouteContext.Provider>;\n}\n\nfunction Link({ to, children }) {\n  const { navigate } = useContext(RouteContext);\n  return <button onClick={() => navigate(to)}>{children}</button>;\n}\n\nfunction UserLayout({ id, children }) {\n  const { query } = useContext(RouteContext);\n  return (\n    <div style={{ border: '1px solid #C7CDC3', padding: 8 }}>\n      <h4 style={{ margin: 0 }}>User {id}</h4>\n      <p>tab from the query string: {query.tab || 'none'}</p>\n      {children}\n    </div>\n  );\n}\n\nfunction Screen() {\n  const { path } = useContext(RouteContext);\n  const segments = path.split('/').filter(Boolean);   // ['users','7','posts']\n\n  if (segments[0] !== 'users' || !segments[1]) return <p>Home</p>;\n\n  const id = segments[1];\n  return (\n    <UserLayout id={id}>\n      {segments[2] === 'posts'\n        ? <p>Posts for user {id}, nested inside the layout.</p>\n        : <p>Profile for user {id}.</p>}\n    </UserLayout>\n  );\n}\n\nfunction App() {\n  return (\n    <Router>\n      <nav style={{ display: 'flex', gap: 4, marginBottom: 8 }}>\n        <Link to="/">Home</Link>\n        <Link to="/users/7?tab=drafts">Profile</Link>\n        <Link to="/users/7/posts?tab=published">Posts</Link>\n      </nav>\n      <Screen />\n    </Router>\n  );\n}`,
      why:'Two ideas, made concrete. Nesting is just a layout component that renders the deeper match as its children, so switching between the profile and the posts leaves the user header mounted. The query string is parsed with URLSearchParams rather than by hand, and kept separate from the path, because it is a different kind of state: the path says which resource, the query says how you are looking at it. React Router gives you useParams and useSearchParams for these two, and the distinction is worth getting right early, since filters, sort orders, and open tabs belong in the query where they survive a refresh and can be shared.'
    },
    mm:'Routing is matching the URL to a component tree, and the URL is state the user owns.'
  },
  {
    id:'33', t:'The state management landscape',
    what:[
      'Most state is local, and useState covers it. What is left divides into three quite different problems: shared client state, server data, and transport.',
      'Context transports a value down a tree. Redux Toolkit, Zustand, and Jotai hold shared client state outside the tree. TanStack Query manages data that lives on a server and is only cached on the client.'
    ],
    why:[
      'The common mistake is using one tool for all three. Putting fetched data in Redux means writing caching, refetching, and invalidation by hand, which is the work TanStack Query already did. Putting a theme in a store adds a dependency for something context does in ten lines.',
      'So the question is never "which library is best", it is "which problem do I have". Server data needs caching, deduplication, staleness, and revalidation. Shared client state needs subscriptions with selectors, so that a change wakes only the components that read the part that changed, which is exactly what context cannot do.',
      'Redux Toolkit gives structure, devtools, and time-travel, at the price of ceremony; it suits large teams and complex flows. Zustand is a small hook-based store with selectors. Jotai is bottom-up: many small atoms that compose. Under all of them sits useSyncExternalStore, the React API for subscribing to something outside React, which is what the example below builds by hand.'
    ],
    code:`// A 20-line store with selectors: the shape every library provides.\nfunction createStore(initial) {\n  let state = initial;\n  const listeners = new Set();\n  return {\n    getState: () => state,\n    setState(patch) {\n      state = { ...state, ...(typeof patch === 'function' ? patch(state) : patch) };\n      listeners.forEach(l => l());\n    },\n    subscribe(l) { listeners.add(l); return () => listeners.delete(l); }\n  };\n}\n\nconst store = createStore({ count: 0, user: 'ada' });\n\n// the selector is what context cannot do: subscribe to part of the state\nfunction useStore(selector) {\n  const get = () => selector(store.getState());\n  return useSyncExternalStore(store.subscribe, get, get);   // third arg: the server snapshot\n}\n\nfunction Count() {\n  const count = useStore(s => s.count);\n  return <p>count: {count}</p>;\n}\n\nfunction User() {\n  const user = useStore(s => s.user);\n  const renders = useRef(0);\n  renders.current++;\n  return <p>user: {user} (this component has rendered {renders.current} times)</p>;\n}\n\nfunction App() {\n  return (\n    <div>\n      <Count />\n      <User />\n      <button onClick={() => store.setState(s => ({ count: s.count + 1 }))}>\n        Increment count\n      </button>\n      <button onClick={() => store.setState({ user: 'grace' })}>Rename user</button>\n      <p><small>Press increment repeatedly: the user line does not re-render.</small></p>\n    </div>\n  );\n}`,
    anno:[
      ['useSyncExternalStore(subscribe, getSnapshot, getServerSnapshot)','The official way to read from a store outside React. It handles tearing under concurrent rendering, which a hand-rolled useEffect subscription does not. The third argument is used during server rendering and hydration; omit it and React warns.'],
      ['() => selector(store.getState())','The snapshot must be referentially stable when nothing relevant changed, or React re-renders forever. Returning a primitive is safe; returning a fresh object needs a memoised or shallow-comparing selector.'],
      ['useStore(s => s.count)','The selector. Only components whose selected slice changed re-render, which is the performance difference between a store and a context.'],
      ['store.setState(s => ({ count: s.count + 1 }))','The same updater-function idea as useState, for the same reason.'],
      ['renders.current++','Instrumentation, to make the point visible: incrementing the count leaves the user component untouched.'],
      ['create((set) => ({ count: 0, inc: () => set(...) }))','Zustand\'s API, which is this store plus devtools, middleware, and persistence. Recognising the shape makes any of these libraries a short read.']
    ],
    mistakes:[
      ['Putting server data in a client store','','You will reimplement caching, refetch on focus, retries, and invalidation. Use a query library and keep the store for genuinely client-side state.'],
      ['Reaching for Redux by default','','Ask what it buys you here. Many apps need one small store, or nothing beyond local state and a query library.'],
      ['Returning a new object from a selector','Warning: The result of getSnapshot should be cached to avoid an infinite loop','s => ({ a: s.a, b: s.b }) is a new object every call. Select primitives separately, or use the library\'s shallow comparison.'],
      ['One global store for everything','','A single object that every component reads becomes impossible to reason about and to delete from. Scope state to the feature that owns it.']
    ],
    ex:{
      task:'Add a derived selector for the count doubled, and a second component that only re-renders when the doubled value crosses ten. Then say which library you would reach for and why.',
      start:`// extend the store above\nfunction App() {\n  return <p>your code</p>;\n}`,
      sol:`function createStore(initial) {\n  let state = initial;\n  const listeners = new Set();\n  return {\n    getState: () => state,\n    setState(patch) {\n      state = { ...state, ...(typeof patch === 'function' ? patch(state) : patch) };\n      listeners.forEach(l => l());\n    },\n    subscribe(l) { listeners.add(l); return () => listeners.delete(l); }\n  };\n}\n\nconst store = createStore({ count: 0 });\n\nfunction useStore(selector) {\n  const get = () => selector(store.getState());\n  return useSyncExternalStore(store.subscribe, get, get);   // third arg: the server snapshot\n}\n\nfunction Doubled() {\n  const doubled = useStore(s => s.count * 2);      // derived, still a primitive\n  return <p>doubled: {doubled}</p>;\n}\n\nfunction Alarm() {\n  const loud = useStore(s => s.count * 2 > 10);    // a boolean: changes twice, not often\n  const renders = useRef(0);\n  renders.current++;\n  return <p>{loud ? 'over ten' : 'under ten'} (renders: {renders.current})</p>;\n}\n\nfunction App() {\n  return (\n    <div>\n      <Doubled />\n      <Alarm />\n      <button onClick={() => store.setState(s => ({ count: s.count + 1 }))}>+1</button>\n    </div>\n  );\n}`,
      why:'Selecting a boolean rather than the number is the whole trick: the Alarm component re-renders only when the answer changes, so clicking from 0 to 5 renders it once, not five times. That is derived state at the subscription level, and it is the reason selectors matter more than the library around them. As for which tool: for a widget like this, nothing, because the state is local. For shared client state in a medium app, Zustand, because this is its entire API and the bundle cost is tiny. For anything fetched, TanStack Query, because cache invalidation is a real problem and hand-rolling it is how apps end up with three copies of the same stale user object.'
    },
    mm:'Sort the problem first: local state, transport, shared client state, or server cache, because each has a different right answer.'
  },
  {
    id:'34', t:'Forms at scale and validation',
    what:[
      'A large form has more than fields and values. It has validation rules, error messages, touched and dirty flags, submit state, server-side errors, and rules that span several fields.',
      'Hand-rolled controlled inputs handle this up to a point. Beyond it, libraries like React Hook Form take over, usually by going uncontrolled and registering inputs with refs so that typing does not re-render the form.'
    ],
    why:[
      'The controlled approach re-renders the whole form on every keystroke. With fifteen fields, validation on each, and a few expensive children, that becomes noticeable, and the usual fix is to make each field its own component with its own state, which then makes cross-field rules awkward.',
      'React Hook Form inverts it: inputs stay uncontrolled, the library holds values in a ref, and only the components that display a given error re-render. You describe rules once, often as a schema with Zod or Yup, and get typed values and errors out.',
      'The other thing scale teaches is when to validate. Validating on every keystroke shouts at people while they type; validating only on submit hides problems until the end. The usual compromise is to validate a field once it has been touched and left, and everything on submit.'
    ],
    code:`// Rules as data, so they can be shared, tested, and reordered.\nconst rules = {\n  email: v => (!v ? 'Email is required'\n    : !v.includes('@') ? 'That does not look like an email' : null),\n  password: v => (v.length < 8 ? 'At least 8 characters' : null),\n  confirm: (v, all) => (v !== all.password ? 'Passwords do not match' : null)\n};\n\nfunction validate(values) {\n  const errors = {};\n  for (const key of Object.keys(rules)) {\n    const message = rules[key](values[key] ?? '', values);\n    if (message) errors[key] = message;\n  }\n  return errors;\n}\n\nfunction Field({ name, label, type = 'text', values, errors, touched, onChange, onBlur }) {\n  const show = touched[name] && errors[name];\n  return (\n    <label style={{ display: 'block', marginBottom: 8 }}>\n      <span style={{ display: 'block', fontSize: 13 }}>{label}</span>\n      <input\n        name={name} type={type} value={values[name] ?? ''}\n        onChange={onChange} onBlur={onBlur}\n        aria-invalid={show ? 'true' : undefined}\n        aria-describedby={show ? name + '-error' : undefined}\n      />\n      {show && <span id={name + '-error'} style={{ color: '#8C5A12', fontSize: 12 }}> {errors[name]}</span>}\n    </label>\n  );\n}\n\nfunction App() {\n  const [values, setValues] = useState({ email: '', password: '', confirm: '' });\n  const [touched, setTouched] = useState({});\n  const [status, setStatus] = useState('editing');\n\n  const errors = validate(values);              // derived, never stored\n  const isValid = Object.keys(errors).length === 0;\n\n  const onChange = e => setValues(v => ({ ...v, [e.target.name]: e.target.value }));\n  const onBlur = e => setTouched(t => ({ ...t, [e.target.name]: true }));\n\n  function onSubmit(e) {\n    e.preventDefault();\n    setTouched({ email: true, password: true, confirm: true });   // reveal everything\n    if (!isValid) return;\n    setStatus('saving');\n    setTimeout(() => setStatus('saved'), 700);\n  }\n\n  const shared = { values, errors, touched, onChange, onBlur };\n\n  return (\n    <form onSubmit={onSubmit} noValidate>\n      <Field name="email" label="Email" {...shared} />\n      <Field name="password" label="Password" type="password" {...shared} />\n      <Field name="confirm" label="Confirm password" type="password" {...shared} />\n      <button type="submit" disabled={status === 'saving'}>\n        {status === 'saving' ? 'Saving…' : 'Create account'}\n      </button>\n      {status === 'saved' && <p>Saved.</p>}\n    </form>\n  );\n}`,
    anno:[
      ['const rules = { email: v => ... }','Validation as a map of pure functions. Testable without React, and the shape a schema library produces for you.'],
      ['confirm: (v, all) => v !== all.password','A cross-field rule, which is why every rule receives all the values. This is the case that field-local state makes painful.'],
      ['const errors = validate(values);','Derived on every render, so an error can never be stale, and there is no second copy of the truth. Lesson 17, applied to forms.'],
      ['touched[name] && errors[name]','The compromise on timing: the rule fails immediately, but the message waits until the user has left the field.'],
      ['setTouched({ email: true, ... }) on submit','Marks everything touched so that submitting an untouched form reveals all its problems at once.'],
      ['aria-invalid and aria-describedby','What links the message to the input for a screen reader. Colour alone is not an error message.']
    ],
    mistakes:[
      ['Storing errors in state','','Then you need an effect to keep them in step with the values, and there will be a render where they disagree. Compute them.'],
      ['Validating on every keystroke from the first character','','The user sees "Email is required" before typing a letter. Gate on touched, or validate on blur.'],
      ['Trusting client validation','','It is a convenience, not a control. The server must validate everything again, and the form has to be able to display errors that come back from it.'],
      ['Disabling submit on an invalid form and nothing else','','A disabled button with no explanation leaves people stuck with no idea which field is wrong. Prefer submitting, then showing every error.']
    ],
    ex:{
      task:'Add a server error that arrives after submit and attaches to one field, plus a dirty check so the submit button is disabled until something changes.',
      start:`// extend the form above with:\n//   const [serverErrors, setServerErrors] = useState({});\n//   a fake submit that rejects the email 'taken@example.com'\nfunction App() {\n  return <p>your code</p>;\n}`,
      sol:`const rules = {\n  email: v => (!v ? 'Email is required' : !v.includes('@') ? 'That does not look like an email' : null)\n};\n\nfunction validate(values) {\n  const errors = {};\n  for (const k of Object.keys(rules)) {\n    const m = rules[k](values[k] ?? '', values);\n    if (m) errors[k] = m;\n  }\n  return errors;\n}\n\nconst INITIAL = { email: '' };\n\nfunction fakeSave(values) {\n  return new Promise((resolve, reject) => setTimeout(() => {\n    if (values.email === 'taken@example.com') reject({ email: 'That email is already registered' });\n    else resolve();\n  }, 600));\n}\n\nfunction App() {\n  const [values, setValues] = useState(INITIAL);\n  const [touched, setTouched] = useState({});\n  const [serverErrors, setServerErrors] = useState({});\n  const [status, setStatus] = useState('editing');\n\n  const errors = { ...validate(values), ...serverErrors };\n  const dirty = values.email !== INITIAL.email;\n  const show = touched.email && errors.email;\n\n  function onChange(e) {\n    setValues({ email: e.target.value });\n    setServerErrors({});          // the server verdict is stale the moment you type\n  }\n\n  function onSubmit(e) {\n    e.preventDefault();\n    setTouched({ email: true });\n    if (Object.keys(validate(values)).length) return;\n    setStatus('saving');\n    fakeSave(values)\n      .then(() => setStatus('saved'))\n      .catch(fromServer => { setServerErrors(fromServer); setStatus('editing'); });\n  }\n\n  return (\n    <form onSubmit={onSubmit} noValidate>\n      <label style={{ display: 'block' }}>\n        Email{' '}\n        <input\n          name="email" value={values.email}\n          onChange={onChange}\n          onBlur={() => setTouched(t => ({ ...t, email: true }))}\n          aria-invalid={show ? 'true' : undefined}\n          placeholder="try taken@example.com"\n        />\n      </label>\n      {show && <p style={{ color: '#8C5A12' }}>{errors.email}</p>}\n      <button type="submit" disabled={!dirty || status === 'saving'}>\n        {status === 'saving' ? 'Saving…' : 'Save'}\n      </button>\n      {status === 'saved' && <p>Saved.</p>}\n    </form>\n  );\n}`,
      why:'Server errors merge on top of client errors rather than replacing them, so a field can show whichever verdict is current, and they are cleared on the next keystroke because the server judged text that no longer exists. Dirtiness is derived by comparing against the initial values, which also gives you the unsaved-changes warning for free. Note that the submit path revalidates from values rather than trusting the errors object computed during render, since that render might predate the latest change in the same tick. React Hook Form gives you dirty, touched, isSubmitting, and server error injection out of the box, and once a form has this many concerns, that is the moment to adopt it.'
    },
    mm:'Values are state, errors are derived, and the timing of a message matters as much as its content.'
  },
  {
    id:'35', t:'TypeScript with React',
    what:[
      'TypeScript describes the shape of your props, state, and events, and checks that callers match. In React that mostly means typing a props object and letting inference do the rest.',
      'The pieces you meet in the first week: an interface or type for props, ReactNode for children, the generic event types for handlers, and generics on a component when its data type varies.'
    ],
    why:[
      'Props are an API between two files, and without types the contract lives in your head. Renaming a prop or making it required is a search-and-hope operation; with types it is an error list.',
      'The payoff is largest exactly where React is weakest: refactoring across a large tree, discriminated unions for a component that has genuinely different modes, and autocomplete for a design system nobody remembers the props of.',
      'The cost is real but smaller than it looks, because inference does most of the work. You annotate the boundaries, props and function arguments, and let TypeScript infer state, return values, and everything in between.'
    ],
    code:`// This playground strips types and runs the JavaScript. It does not\n// type-check, so a deliberate error here will not be reported: use your\n// editor or tsc for that.\n\ntype Status = 'idle' | 'loading' | 'error';\n\ninterface CardProps {\n  title: string;\n  count?: number;                 // optional\n  status: Status;                 // a union, not a string\n  onSelect: (id: string) => void; // a function type, arguments and all\n  children?: React.ReactNode;     // anything renderable\n}\n\nfunction Card({ title, count = 0, status, onSelect, children }: CardProps) {\n  const [open, setOpen] = useState(false);          // inferred as boolean\n  const inputRef = useRef<HTMLInputElement>(null);  // needs the element type\n\n  function handleChange(e: React.ChangeEvent<HTMLInputElement>) {\n    onSelect(e.target.value);\n  }\n\n  return (\n    <div style={{ border: '1px solid #C7CDC3', padding: 8, marginBottom: 8 }}>\n      <strong>{title}</strong> ({count}) — {status}\n      <div>\n        <input ref={inputRef} onChange={handleChange} placeholder="type an id" />\n        <button onClick={() => inputRef.current?.focus()}>focus</button>\n        <button onClick={() => setOpen(o => !o)}>{open ? 'less' : 'more'}</button>\n      </div>\n      {open && children}\n    </div>\n  );\n}\n\n// A generic component: the item type is decided by the caller.\ninterface ListProps<T> {\n  items: T[];\n  getKey: (item: T) => string;\n  renderItem: (item: T) => React.ReactNode;\n}\n\nfunction List<T>({ items, getKey, renderItem }: ListProps<T>) {\n  return <ul>{items.map(i => <li key={getKey(i)}>{renderItem(i)}</li>)}</ul>;\n}\n\ninterface User { id: string; name: string; }\n\nfunction App() {\n  const [picked, setPicked] = useState<string | null>(null);\n  const users: User[] = [{ id: 'u1', name: 'Ada' }, { id: 'u2', name: 'Grace' }];\n\n  return (\n    <div>\n      <Card title="Users" count={users.length} status="idle" onSelect={setPicked}>\n        <List\n          items={users}\n          getKey={u => u.id}\n          renderItem={u => <span>{u.name}</span>}\n        />\n      </Card>\n      <p>picked: {picked ?? 'nothing'}</p>\n    </div>\n  );\n}`,
    anno:[
      ['function Card({ title }: CardProps)','Annotate the destructured props object with your type. This is the modern form; React.FC<CardProps> is older, adds an implicit children prop, and is no longer recommended.'],
      ['count?: number','The question mark makes it optional, so a default in the signature is what fills it in. Optional plus a default is the normal pairing.'],
      ['status: Status','A union of string literals instead of string. Now "loadng" is a compile error and your editor offers the three valid values.'],
      ['onSelect: (id: string) => void','Function props are typed by signature. void as the return type means callers may return something and it will be ignored.'],
      ['children?: React.ReactNode','The type for anything React can render: elements, strings, numbers, arrays, null. Use ReactElement only when you really need a single element.'],
      ['useRef<HTMLInputElement>(null)','The element type cannot be inferred from null, so it is supplied. That is what makes inputRef.current?.focus() typecheck.'],
      ['useState<string | null>(null)','Inference would give null alone, so the union is explicit. Most useState calls need no annotation at all.'],
      ['function List<T>({ items, ... }: ListProps<T>)','A generic component. T is inferred from items at each call site, so renderItem receives a fully typed item instead of any.']
    ],
    mistakes:[
      ['Reaching for any','','It switches the checker off exactly where you were confused. unknown plus a narrowing check is the honest version, and it forces you to handle the shape you were unsure about.'],
      ['Typing a component as React.FC','','It gives every component an implicit children prop whether it accepts one or not, and interacts badly with generics. Annotate the props parameter instead.'],
      ['Using object or Function as a type','','object accepts anything non-primitive and Function accepts any signature, so neither checks what you care about. Write the shape or the signature out.'],
      ['Fighting an event type','Property \'value\' does not exist on type \'EventTarget\'','A bare Event has no target type. Use the React generic that matches: React.ChangeEvent<HTMLInputElement>, React.MouseEvent<HTMLButtonElement>, React.FormEvent<HTMLFormElement>.'],
      ['Believing types checked at runtime','','They are erased at build time, exactly as in this playground. Data crossing a boundary, a fetch response or a form submission, needs a runtime check such as Zod.']
    ],
    ex:{
      task:'Type a Button component that must have either an onClick or an href, but never both, using a discriminated union.',
      start:`// two mutually exclusive shapes, one component\ntype ButtonProps = {\n  // your types\n};\n\nfunction Button(props: ButtonProps) {\n  // your code\n}\n\nfunction App() {\n  return <Button /* ... */ />;\n}`,
      sol:`interface Common {\n  children: React.ReactNode;\n  variant?: 'primary' | 'quiet';\n}\n\ninterface AsButton extends Common {\n  onClick: () => void;\n  href?: never;                  // present in the type, forbidden in practice\n}\n\ninterface AsLink extends Common {\n  href: string;\n  onClick?: never;\n}\n\ntype ButtonProps = AsButton | AsLink;\n\nfunction Button(props: ButtonProps) {\n  const style = {\n    padding: '4px 10px',\n    border: '1px solid #C7CDC3',\n    background: props.variant === 'primary' ? '#2F6B57' : '#FBFCFA',\n    color: props.variant === 'primary' ? '#F2F7F4' : '#17211D'\n  };\n\n  // narrowing: inside this branch, TypeScript knows href is a string\n  if ('href' in props && props.href) {\n    return <a href={props.href} style={style}>{props.children}</a>;\n  }\n  return <button onClick={props.onClick} style={style}>{props.children}</button>;\n}\n\nfunction App() {\n  return (\n    <div style={{ display: 'flex', gap: 6 }}>\n      <Button variant="primary" onClick={() => alert('clicked')}>Save</Button>\n      <Button href="https://react.dev">Read the docs</Button>\n      {/* <Button href="/x" onClick={() => {}}>both</Button>  // a type error */}\n    </div>\n  );\n}`,
      why:'A union of two interfaces says what prose cannot: these are two different components wearing one name, and the compiler enforces the choice. The href?: never members are what make passing both an error rather than merely odd. Inside the component, the in operator narrows the union, so each branch sees only the props that exist in it and no casts are needed. This also produces a better component: the link renders a real anchor, which means keyboard, middle-click, and right-click all behave, the thing lesson 32 warns about. It is the single most useful TypeScript pattern in a design system, because most "component with a mode" props are secretly two components.'
    },
    mm:'Type the boundaries and let inference do the rest, and use unions to make the impossible combinations unrepresentable.'
  }
  ]
});

</script>

<script>
COURSE.push({
  id:'m5', t:'Performance and internals', lvl:'Hard',
  lessons:[
  {
    id:'36', t:'How rendering works: render, commit, reconciliation',
    what:[
      'React works in two phases. In the render phase it calls your components and builds a tree of plain objects describing what the UI should be. In the commit phase it applies the difference between that tree and the previous one to the real DOM.',
      'The tree of description objects is what people call the Virtual DOM. Comparing the new tree against the old one to find the minimal set of changes is reconciliation.'
    ],
    why:[
      'Splitting the work in two is what makes everything else possible. The render phase is pure and interruptible: React can start it, throw the result away, and start again, which is how concurrent features and Suspense work. The commit phase is synchronous and short, because DOM changes must not be half-applied.',
      'The Virtual DOM is not faster than the DOM. Touching the DOM directly, once, with exactly the right change, always wins. What the diff buys you is that you get that minimal update without writing it, from code that simply re-describes the whole screen.',
      'Reconciliation uses two heuristics rather than a general tree-diff, because a real diff is too slow. Different element types mean throw the subtree away and rebuild. Same type means keep the DOM node and update its props. Within a list, identity comes from the key. Everything surprising about remounting follows from those three rules.'
    ],
    code:`function Box({ label }) {\n  const [n, setN] = useState(0);\n  return (\n    <div style={{ border: '1px solid #C7CDC3', padding: 6, marginBottom: 6 }}>\n      {label}: state is {n} <button onClick={() => setN(x => x + 1)}>+1</button>\n    </div>\n  );\n}\n\nfunction App() {\n  const [swap, setSwap] = useState(false);\n  const [wrap, setWrap] = useState(false);\n\n  return (\n    <div>\n      <p><small>Click +1 in each box, then press the buttons and watch which boxes keep their state.</small></p>\n\n      {/* same type, same position: state survives, props update */}\n      <Box label={swap ? 'renamed' : 'original'} />\n\n      {/* type changes: React unmounts and remounts, state is lost */}\n      {swap ? <Box label="B" /> : <section><Box label="A, inside a section" /></section>}\n\n      {/* an extra wrapper appears: the subtree below it remounts */}\n      {wrap ? <div><Box label="wrapped" /></div> : <Box label="unwrapped" />}\n\n      <button onClick={() => setSwap(s => !s)}>Swap the middle</button>\n      <button onClick={() => setWrap(w => !w)}>Toggle a wrapper</button>\n    </div>\n  );\n}`,
    anno:[
      ['<Box label={...} />','Same component type in the same position across renders, so reconciliation keeps the existing instance: the DOM node stays, the props update, and the state is untouched.'],
      ['{swap ? <Box /> : <section><Box /></section>}','The element type at that position changes from Box to section. React discards the whole subtree and builds a new one, so the counter inside resets. This is the rule, not a bug.'],
      ['{wrap ? <div><Box /></div> : <Box />}','Adding a wrapper is the same story: the child is now at a different position under a different parent, so it remounts. It is why conditionally wrapping something in a div can mysteriously clear a form.'],
      ['The render phase','React calls your function. It must be pure, because React may call it twice, discard the result, or pause between components. No DOM writes, no fetches, no mutation of anything outside.'],
      ['The commit phase','React applies the diff, then runs layout effects, paints, then runs effects. Refs are attached here, which is why a ref is null during render.'],
      ['createElement(\'div\', props, children)','What JSX compiles to. The result is a small object, not a DOM node, which is why building it is cheap enough to do on every keystroke.']
    ],
    mistakes:[
      ['Believing the Virtual DOM makes React fast','','It makes React convenient. A hand-written imperative update is faster; the diff is the price of declarative code, and it is usually a price worth paying.'],
      ['Expecting a state reset when props change','','Same type in the same position keeps its state. If you want a reset, change the key, which is the deliberate version of the remount you just saw.'],
      ['Doing side effects during render','','Fetching, logging to a server, or mutating a module variable in the render body will run at unpredictable times and twice in StrictMode. The render phase is a description, not an action.'],
      ['Assuming "re-render" means "touch the DOM"','','A re-render produces a new description. If it matches the old one, the commit does nothing. Renders are usually cheap; commits are what the user sees.']
    ],
    ex:{
      task:'Make a list where a row keeps its own local state when the list is reordered, and then break it deliberately by changing the key. Explain which reconciliation rule you triggered.',
      start:`function Row({ name }) {\n  const [note, setNote] = useState('');\n  return <li>{name} <input value={note} onChange={e => setNote(e.target.value)} placeholder="note" /></li>;\n}\n\nfunction App() {\n  const [names, setNames] = useState(['ada', 'grace', 'alan']);\n  // your code\n}`,
      sol:`function Row({ name }) {\n  const [note, setNote] = useState('');\n  return (\n    <li>\n      {name}{' '}\n      <input value={note} onChange={e => setNote(e.target.value)} placeholder="note" />\n    </li>\n  );\n}\n\nfunction App() {\n  const [names, setNames] = useState(['ada', 'grace', 'alan']);\n  const [byIndex, setByIndex] = useState(false);\n\n  return (\n    <div>\n      <button onClick={() => setNames(n => [...n].reverse())}>Reverse</button>\n      <button onClick={() => setByIndex(b => !b)}>\n        key: {byIndex ? 'index (broken)' : 'name (correct)'}\n      </button>\n      <ul>\n        {names.map((name, i) => (\n          <Row key={byIndex ? i : name} name={name} />\n        ))}\n      </ul>\n    </div>\n  );\n}`,
      why:'Type notes into two rows and press Reverse. With the name as key, React finds the same key in a new position, moves the DOM node, and the state travels with it, because identity within a list comes from the key rather than from the order. Switch to the index and the keys stay 0, 1, 2 while the names move, so React concludes that each row simply changed its name prop: the component instance and its state stay put while the label under it changes. Nothing remounts in that case, which is why the bug looks like data corruption rather than a reset. The remount rule only fires when the type or the key changes, and pressing the key toggle does exactly that, wiping every note at once.'
    },
    mm:'Render describes, commit applies, and reconciliation keeps an instance only when the type, position, and key all match.'
  },
  {
    id:'37', t:'Why a component re-renders',
    what:[
      'A component re-renders for exactly three reasons: its own state changed, a context it reads changed, or its parent re-rendered.',
      'That third reason surprises people. By default a parent re-render re-renders every child, whether or not the child\'s props changed.'
    ],
    why:[
      'Checking whether props changed costs something too. React\'s default is to re-render children rather than compare, because calling a function that returns the same description is usually cheaper than a deep prop comparison, and the commit will find nothing to do anyway.',
      'So the popular claim that parent re-renders cause expensive child work is mostly false. A re-render of a component that returns the same thing costs one function call and a diff that finds no changes. It is only expensive when the child does real work in its body, or when there are thousands of them.',
      'The practical consequence: before memoising anything, find out what is actually slow. Usually it is one component doing heavy work, not the number of renders.'
    ],
    code:`let renders = { parent: 0, cheap: 0, heavy: 0 };\n\nfunction Cheap({ label }) {\n  renders.cheap++;\n  return <p>Cheap child, rendered {renders.cheap} times. Label: {label}</p>;\n}\n\nfunction Heavy() {\n  renders.heavy++;\n  // deliberately slow: the real reason a re-render can hurt\n  let total = 0;\n  for (let i = 0; i < 2_000_000; i++) total += i % 7;\n  return <p>Heavy child, rendered {renders.heavy} times ({total})</p>;\n}\n\nfunction App() {\n  const [n, setN] = useState(0);\n  const [text, setText] = useState('');\n  renders.parent++;\n\n  return (\n    <div>\n      <button onClick={() => setN(x => x + 1)}>Change parent state ({n})</button>\n      <input value={text} onChange={e => setText(e.target.value)} placeholder="type here" />\n      <p>Parent renders: {renders.parent}</p>\n      <Cheap label="unchanged" />\n      <Heavy />\n      <p><small>The cheap child re-renders with the parent and nobody notices. The heavy one is why typing feels slow.</small></p>\n    </div>\n  );\n}`,
    anno:[
      ['renders.cheap++','Instrumentation in a module object rather than state, so counting does not itself cause renders. Fine for a demo; in real code use the Profiler, lesson 43.'],
      ['<Cheap label="unchanged" />','Its props never change, and it still re-renders on every keystroke. That is the default, and it costs almost nothing.'],
      ['for (let i = 0; i < 2_000_000; i++)','The actual problem. The fix is not to render this less often but to make it cheap, or to move the work out of render into useMemo, a worker, or the server.'],
      ['State changed','The component that owns the state re-renders, and so does everything below it.'],
      ['Context changed','Every consumer of that context re-renders, regardless of props, which is lesson 28.'],
      ['Props changed','Not a separate reason. Props change because the parent re-rendered, so the parent is the cause.']
    ],
    mistakes:[
      ['Optimising render counts instead of render cost','','A component rendering 60 times per second is fine if each render is 0.1ms. Measure milliseconds, not counts.'],
      ['Assuming a child re-renders because its props changed','','It re-renders because its parent did. React does not compare props unless you ask it to with React.memo.'],
      ['Moving state up to "share" it and re-rendering the world','','State as high as the root means every change re-renders every branch. Keep state as low as the components that use it allow.'],
      ['Blaming React for a slow list','','Ten thousand rows is not a React problem, it is a "you are rendering ten thousand rows" problem. Lesson 40.']
    ],
    ex:{
      task:'The heavy component above re-renders on every keystroke. Fix it two ways without React.memo: move the state that changes into a smaller component, and move the expensive work out of render.',
      start:`// keep the Heavy component, but stop typing from triggering it\nfunction App() {\n  return <p>your code</p>;\n}`,
      sol:`function Heavy({ size }) {\n  // the work now depends on a prop, and is cached against it\n  const total = useMemo(() => {\n    let t = 0;\n    for (let i = 0; i < size; i++) t += i % 7;\n    return t;\n  }, [size]);\n\n  return <p>Heavy result for {size}: {total}</p>;\n}\n\n// fix 1: the fast-changing state lives in its own component\nfunction Search() {\n  const [text, setText] = useState('');\n  return (\n    <div>\n      <input value={text} onChange={e => setText(e.target.value)} placeholder="type here" />\n      <p>searching for: {text || '—'}</p>\n    </div>\n  );\n}\n\nfunction App() {\n  const [size, setSize] = useState(1_000_000);\n  return (\n    <div>\n      <Search />\n      <button onClick={() => setSize(s => s + 500_000)}>Bigger job</button>\n      <Heavy size={size} />\n    </div>\n  );\n}`,
      why:'The first fix is structural and the one to reach for first: the input\'s state moved into Search, so typing re-renders Search and nothing else. No memoisation, no dependency arrays, and it cannot go stale. The second fix caches the expensive calculation against the only input it has, so even a genuine re-render of Heavy skips the loop unless size changed. Between them they remove the problem without React.memo, which is the point: composition and useMemo handle most performance work, and memo is for the cases where a parent you do not control re-renders often.'
    },
    mm:'A component re-renders because of its own state, its context, or its parent, and only the cost of that render matters.'
