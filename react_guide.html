  {
    id:'27', t:'Custom hooks, and the rules of hooks',
    what:[
      'A custom hook is a function whose name starts with use and which calls other hooks. There is no special API: you extract stateful logic from a component into a function, and it becomes reusable.',
      'Two components using the same hook share the logic and nothing else. Each call site gets its own independent state, exactly as two useState calls would.'
    ],
    why:[
      'Components mix two things: what the screen looks like, and how a piece of behaviour works. A debounced value, a media query, a fetch with its loading and error states, are all behaviour, and they are the parts you want in more than one place.',
      'The naming rule is not decoration. React and its lint rules identify hooks by the use prefix, which is how the exhaustive-deps rule and the compiler know that a call has hook semantics.',
      'The rules of hooks, top level only and same order every render, exist because React stores hook state in a list per component and matches each call to its slot by position. A conditional hook shifts every later slot, so your useState starts reading someone else\'s value.'
    ],
    code:`function useToggle(initial = false) {\n  const [on, setOn] = useState(initial);\n  const toggle = useCallback(() => setOn(o => !o), []);\n  return [on, toggle];\n}\n\nfunction useDebounce(value, delay = 400) {\n  const [debounced, setDebounced] = useState(value);\n  useEffect(() => {\n    const id = setTimeout(() => setDebounced(value), delay);\n    return () => clearTimeout(id);   // the previous timer is cancelled\n  }, [value, delay]);\n  return debounced;\n}\n\nfunction useWindowSize() {\n  const [size, setSize] = useState({ w: window.innerWidth, h: window.innerHeight });\n  useEffect(() => {\n    const onResize = () => setSize({ w: window.innerWidth, h: window.innerHeight });\n    window.addEventListener('resize', onResize);\n    return () => window.removeEventListener('resize', onResize);\n  }, []);\n  return size;\n}\n\nfunction App() {\n  const [open, toggleOpen] = useToggle();\n  const [text, setText] = useState('');\n  const debounced = useDebounce(text, 500);\n  const { w } = useWindowSize();\n\n  return (\n    <div>\n      <button onClick={toggleOpen}>{open ? 'Hide' : 'Show'} details</button>\n      {open && <p>Window is {w}px wide.</p>}\n      <input value={text} onChange={e => setText(e.target.value)} placeholder="type fast" />\n      <p>live: {text || '—'}</p>\n      <p>debounced: {debounced || '—'}</p>\n    </div>\n  );\n}`,
    anno:[
      ['function useToggle(initial = false)','A hook is a plain function. The use prefix is what makes the lint rules treat its internals as hook calls.'],
      ['return [on, toggle];','Return an array when the two values are positional and callers will rename them, like useState. Return an object when there are three or more, so callers can destructure by name and ignore the rest.'],
      ['const id = setTimeout(...); return () => clearTimeout(id);','The whole of debouncing: each new value cancels the pending timer and starts another, so only a pause produces an update.'],
      ['useDebounce(text, 500)','Called at the top level of the component, unconditionally. Everything inside the hook obeys the same rule.'],
      ['const [open, toggleOpen] = useToggle();','Two components calling this get two separate booleans. Hooks share code, never state; sharing state is what context and stores are for.'],
      ['useCallback(() => setOn(o => !o), [])','A stable function identity, so passing toggle to a memoised child does not defeat the memo. Not required for correctness here.']
    ],
    mistakes:[
      ['Calling a hook inside a condition or loop','React has detected a change in the order of Hooks called by App. This will lead to bugs and errors if not fixed.','Move the call to the top level and make the value conditional instead: const x = useThing(); then use it only when needed.'],
      ['Calling hooks from a plain function','Invalid hook call. Hooks can only be called inside of the body of a function component.','Either rename the function to start with use, or call it from a component. This error also appears with two copies of React in the bundle.'],
      ['Expecting shared state from a shared hook','','Two components calling useCounter() do not see each other. If they must, lift the state and pass it down, or put it in a context or a store.'],
      ['Wrapping everything in a hook too early','','A hook used once, in one component, is often just indirection. Extract when there is a second caller, or when the component has become hard to read.']
    ],
    ex:{
      task:'Write useLocalStorage(key, initial) that reads once on mount and writes on every change, and use it for a name field. Handle the case where storage is unavailable.',
      start:`function useLocalStorage(key, initial) {\n  const [value, setValue] = useState(initial);\n  // TODO: read the stored value once, and write it on every change\n  return [value, setValue];\n}\n\nfunction App() {\n  const [name, setName] = useLocalStorage('demo.name', '');\n  return (\n    <div>\n      <input value={name} onChange={e => setName(e.target.value)} placeholder="Type, then reload" />\n      <p>stored as: {JSON.stringify(name)}</p>\n    </div>\n  );\n}`,
      sol:`function useLocalStorage(key, initial) {\n  const [value, setValue] = useState(() => {\n    try {\n      const raw = window.localStorage.getItem(key);\n      return raw === null ? initial : JSON.parse(raw);\n    } catch {\n      return initial;                 // private mode, quota, or no storage at all\n    }\n  });\n\n  useEffect(() => {\n    try {\n      window.localStorage.setItem(key, JSON.stringify(value));\n    } catch {\n      /* nothing sensible to do: the app must still work */\n    }\n  }, [key, value]);\n\n  return [value, setValue];\n}\n\nfunction App() {\n  const [name, setName] = useLocalStorage('demo.name', '');\n  return (\n    <div>\n      <input value={name} onChange={e => setName(e.target.value)} placeholder="Type, then reload" />\n      <p>stored as: {JSON.stringify(name)}</p>\n    </div>\n  );\n}`,
      why:'The initial value is a function, so the read from storage happens once instead of on every render. Both storage calls are wrapped, because localStorage throws rather than returning null in Safari private mode and when the quota is full, and a settings hook should never be able to take the page down. Writing in an effect rather than in the setter keeps the hook honest about being a side effect, and means the value is written whichever way it changed. The same shape is why this course\'s own progress tracking works in a sandbox: try it, and fall back to memory.'
    },
    mm:'A custom hook is reusable behaviour, not shared state, and the use prefix is what makes the tooling treat it as one.'
  },
  {
    id:'28', t:'useContext and its re-render cost',
    what:[
      'Context lets a component read a value provided by an ancestor without every layer in between passing it along. You create a context, wrap a subtree in its Provider, and read it with useContext.',
      'It is a transport mechanism, not a state manager. The state still lives in a component, usually the one that renders the Provider.'
    ],
    why:[
      'Prop drilling is passing a value through components that do not use it. Three levels is tolerable; seven is a maintenance tax where a change to the value touches every file on the path.',
      'Context is for values that a whole subtree needs and that change rarely: the theme, the current user, the locale, a dispatch function. That "rarely" matters, because every component reading the context re-renders whenever the provider value changes, and there is no way to subscribe to part of the value.',
      'So context solves plumbing, not performance. When a value changes often and is read widely, either split it into several contexts, memoise the value object, or use a store with selectors, which is lesson 33.'
    ],
    code:`const ThemeContext = createContext(null);\n\nfunction ThemeProvider({ children }) {\n  const [dark, setDark] = useState(false);\n\n  // memoised so the value is not a new object on every parent render\n  const value = useMemo(\n    () => ({ dark, toggle: () => setDark(d => !d) }),\n    [dark]\n  );\n\n  return <ThemeContext.Provider value={value}>{children}</ThemeContext.Provider>;\n}\n\nfunction useTheme() {\n  const ctx = useContext(ThemeContext);\n  if (ctx === null) throw new Error('useTheme must be used inside a ThemeProvider');\n  return ctx;\n}\n\nfunction ThemedPanel({ children }) {\n  const { dark } = useTheme();          // no props needed, at any depth\n  return (\n    <div style={{\n      background: dark ? '#141C19' : '#FBFCFA',\n      color: dark ? '#DFE7E1' : '#17211D',\n      border: '1px solid #C7CDC3', padding: 10, marginTop: 8\n    }}>{children}</div>\n  );\n}\n\nfunction ToggleButton() {\n  const { dark, toggle } = useTheme();\n  return <button onClick={toggle}>Switch to {dark ? 'light' : 'dark'}</button>;\n}\n\nfunction App() {\n  return (\n    <ThemeProvider>\n      <ToggleButton />\n      <ThemedPanel>\n        <p>Three levels down, and still themed.</p>\n        <ThemedPanel>Nested.</ThemedPanel>\n      </ThemedPanel>\n    </ThemeProvider>\n  );\n}`,
    anno:[
      ['const ThemeContext = createContext(null);','The default value is used only when there is no Provider above. null plus a check gives a clear error instead of silent undefined behaviour.'],
      ['<ThemeContext.Provider value={value}>','In React 19 you can also render <ThemeContext value={value}> directly. Both work; the Provider form is what you will see everywhere.'],
      ['useMemo(() => ({ dark, toggle }), [dark])','Without this, every render of ThemeProvider creates a new object, so every consumer re-renders even when dark has not changed.'],
      ['function useTheme()','Wrapping useContext in a named hook is the convention: consumers do not import the context, the error message is useful, and you can change the implementation later.'],
      ['const { dark } = useTheme();','Reading part of the value does not narrow the subscription. If anything in the value changes, this component re-renders.'],
      ['Splitting contexts','A common fix: one context for the rarely-changing value and one for the dispatch function, so components that only dispatch never re-render.']
    ],
    mistakes:[
      ['A new value object every render','','value={{ user, setUser }} looks harmless and re-renders every consumer on every provider render. Memoise it, or pass a stable object.'],
      ['Putting fast-changing state in a wide context','','Mouse position or form input in a context read by fifty components means fifty re-renders per keystroke. Keep it local, or use a store with selectors.'],
      ['Forgetting the Provider','TypeError: Cannot destructure property \'dark\' of \'useContext(...)\' as it is null.','The component is outside the subtree, often because it is rendered by a portal target or a different root. Add the Provider higher up.'],
      ['Using context as a global variable','','Context is scoped to a subtree and re-renders on change. For a value that is truly constant, a plain module export is simpler and free.']
    ],
    ex:{
      task:'Build a context that holds a list of toasts plus an addToast function, split so that components which only add toasts do not re-render when the list changes.',
      start:`const ToastContext = createContext(null);\n\nfunction ToastProvider({ children }) {\n  // your code\n}\n\nfunction App() {\n  return <ToastProvider>{/* ... */}</ToastProvider>;\n}`,
      sol:`const ToastListContext = createContext([]);\nconst ToastApiContext = createContext(null);\n\nfunction ToastProvider({ children }) {\n  const [toasts, setToasts] = useState([]);\n\n  // stable for the life of the provider: never causes a consumer re-render\n  const api = useMemo(() => ({\n    add: text => setToasts(prev => [...prev, { id: Date.now() + Math.random(), text }]),\n    dismiss: id => setToasts(prev => prev.filter(t => t.id !== id))\n  }), []);\n\n  return (\n    <ToastApiContext.Provider value={api}>\n      <ToastListContext.Provider value={toasts}>\n        {children}\n      </ToastListContext.Provider>\n    </ToastApiContext.Provider>\n  );\n}\n\nfunction AddButtons() {\n  const { add } = useContext(ToastApiContext);   // reads the stable half only\n  return (\n    <div>\n      <button onClick={() => add('Saved')}>Saved</button>\n      <button onClick={() => add('Deleted')}>Deleted</button>\n    </div>\n  );\n}\n\nfunction ToastList() {\n  const toasts = useContext(ToastListContext);\n  const { dismiss } = useContext(ToastApiContext);\n  return (\n    <ul>\n      {toasts.map(t => (\n        <li key={t.id}>\n          {t.text} <button onClick={() => dismiss(t.id)}>dismiss</button>\n        </li>\n      ))}\n    </ul>\n  );\n}\n\nfunction App() {\n  return (\n    <ToastProvider>\n      <AddButtons />\n      <ToastList />\n    </ToastProvider>\n  );\n}`,
      why:'Two contexts, because the two halves change at different rates. The api object is memoised with an empty dependency array and only closes over setToasts, which React guarantees is stable, so it never changes identity and AddButtons never re-renders no matter how many toasts appear. The list context changes constantly, but only ToastList reads it. This split is the standard mitigation for context re-render cost, and the same reasoning is why useReducer pairs so well with context: dispatch is stable, so the action half of your state can be shared for free.'
    },
    mm:'Context removes prop drilling, not re-renders: every consumer wakes up when the provider value changes.'
  },
  {
    id:'29', t:'Error boundaries and graceful failure',
    what:[
      'An error boundary is a component that catches errors thrown while rendering its children, and renders a fallback instead of letting the whole tree unmount.',
      'It is still a class component, because it needs the static getDerivedStateFromError and componentDidCatch lifecycle methods. There is no hook equivalent in React 19.'
    ],
    why:[
      'Without a boundary, an error thrown during render propagates to the root and React unmounts everything. A failure in one widget takes the entire page to a blank screen, which is almost always worse than showing that widget as broken.',
      'Boundaries let you choose the blast radius. One around the whole app catches the unexpected; one around each panel of a dashboard means a bad chart does not cost you the navigation.',
      'They catch errors during rendering, in lifecycle methods, and in constructors of the subtree. They do not catch errors in event handlers, in asynchronous callbacks or promises, during server rendering, or thrown by the boundary itself. Those need try/catch or a rejected-state in your own code.'
    ],
    code:`// The one place a class is still the right answer.\nclass ErrorBoundary extends React.Component {\n  constructor(props) {\n    super(props);\n    this.state = { error: null };\n  }\n\n  static getDerivedStateFromError(error) {\n    return { error };          // render the fallback on the next render\n  }\n\n  componentDidCatch(error, info) {\n    // where you would call your logging service\n    console.log('caught:', error.message, info.componentStack ? '(with stack)' : '');\n  }\n\n  render() {\n    if (this.state.error) {\n      return (\n        <div style={{ border: '1px solid #8C5A12', padding: 10 }}>\n          <p>This panel could not be displayed.</p>\n          <button onClick={() => this.setState({ error: null })}>Try again</button>\n        </div>\n      );\n    }\n    return this.props.children;\n  }\n}\n\nfunction Chart({ broken }) {\n  if (broken) throw new Error('bad data in series 2');\n  return <p>[a working chart]</p>;\n}\n\nfunction Handler() {\n  // NOT caught by a boundary: this happens after render\n  const [msg, setMsg] = useState('');\n  function onClick() {\n    try {\n      throw new Error('event handler errors are yours to catch');\n    } catch (e) {\n      setMsg(e.message);\n    }\n  }\n  return <div><button onClick={onClick}>Throw in a handler</button><p>{msg}</p></div>;\n}\n\nfunction App() {\n  const [broken, setBroken] = useState(false);\n  return (\n    <div>\n      <button onClick={() => setBroken(b => !b)}>Break the chart</button>\n      <p>The navigation survives either way.</p>\n      <ErrorBoundary>\n        <Chart broken={broken} />\n      </ErrorBoundary>\n      <Handler />\n    </div>\n  );\n}`,
    anno:[
      ['class ErrorBoundary extends React.Component','Legacy API, current best practice. Write it once, or take one from a library such as react-error-boundary, and never write another class.'],
      ['static getDerivedStateFromError(error)','Runs during the render phase, so it may only compute state. Put logging in componentDidCatch, which runs in the commit phase where side effects are allowed.'],
      ['componentDidCatch(error, info)','info.componentStack tells you which component threw, which is the part a stack trace usually cannot.'],
      ['onClick={() => this.setState({ error: null })}','Clearing the error retries the render. Pair it with a key on the boundary if the child needs a full reset.'],
      ['if (broken) throw new Error(...)','Throwing during render is what a boundary catches. Notice the button, the text, and the handler demo all keep working.'],
      ['createRoot(el, { onUncaughtError, onCaughtError })','React 19 added these root options for reporting errors globally, alongside boundaries rather than instead of them.']
    ],
    mistakes:[
      ['Expecting a boundary to catch async errors','','A failed fetch inside an effect rejects a promise; nothing throws during render. Catch it and put the failure in state, which is the loading/error/data shape from lesson 21.'],
      ['One boundary at the root and nothing else','','Technically safe, practically the same as a white screen. Put boundaries where a partial failure is survivable.'],
      ['A fallback with no way out','','"Something went wrong" and nothing else strands the user. Offer a retry, a link home, or a reload.'],
      ['Using a boundary for expected failures','','A 404 or a validation error is not an exception. Model it as state and render it deliberately; boundaries are for bugs.']
    ],
    ex:{
      task:'Wrap two independent panels in their own boundaries, give the fallback a retry that fully resets the child, and prove that breaking one leaves the other working.',
      start:`class ErrorBoundary extends React.Component {\n  constructor(p) { super(p); this.state = { error: null }; }\n  static getDerivedStateFromError(error) { return { error }; }\n  render() {\n    return this.state.error ? <p>broken</p> : this.props.children;\n  }\n}\n\nfunction App() {\n  // your code\n}`,
      sol:`class ErrorBoundary extends React.Component {\n  constructor(p) { super(p); this.state = { error: null }; }\n  static getDerivedStateFromError(error) { return { error }; }\n  render() {\n    if (this.state.error) {\n      return (\n        <div style={{ border: '1px solid #8C5A12', padding: 8 }}>\n          <p>{this.props.name} failed: {this.state.error.message}</p>\n          <button onClick={() => this.props.onReset()}>Retry</button>\n        </div>\n      );\n    }\n    return this.props.children;\n  }\n}\n\nfunction Panel({ name, broken }) {\n  const [n, setN] = useState(0);\n  if (broken) throw new Error('render failed');\n  return (\n    <div style={{ border: '1px solid #C7CDC3', padding: 8 }}>\n      <p>{name}: clicked {n} times</p>\n      <button onClick={() => setN(x => x + 1)}>Click</button>\n    </div>\n  );\n}\n\nfunction App() {\n  const [broken, setBroken] = useState({ a: false, b: false });\n  const [gen, setGen] = useState({ a: 0, b: 0 });\n\n  function reset(which) {\n    setBroken(prev => ({ ...prev, [which]: false }));\n    setGen(prev => ({ ...prev, [which]: prev[which] + 1 }));\n  }\n\n  return (\n    <div>\n      <button onClick={() => setBroken(p => ({ ...p, a: true }))}>Break A</button>\n      <button onClick={() => setBroken(p => ({ ...p, b: true }))}>Break B</button>\n\n      <ErrorBoundary key={'a' + gen.a} name="Panel A" onReset={() => reset('a')}>\n        <Panel name="Panel A" broken={broken.a} />\n      </ErrorBoundary>\n      <ErrorBoundary key={'b' + gen.b} name="Panel B" onReset={() => reset('b')}>\n        <Panel name="Panel B" broken={broken.b} />\n      </ErrorBoundary>\n    </div>\n  );\n}`,
      why:'Two boundaries, two blast radii: break A and B keeps its click count. The retry is the interesting part. Clearing the boundary\'s own error state would re-render the same broken child and fail again, so the reset lives in the parent: it fixes the cause and bumps a generation number used as the boundary\'s key, which remounts boundary and child together and guarantees a clean slate. That key-as-remount trick is worth remembering; it is the same mechanism as resetting state with a key in lesson 25, and react-error-boundary\'s resetKeys prop is exactly this idea packaged.'
    },
    mm:'A boundary catches render-time errors in its subtree and lets you choose how much of the page a bug is allowed to take with it.'
  },
  {
    id:'30', t:'Portals for modals, tooltips, and popovers',
    what:[
      'createPortal renders children into a different DOM node while keeping them in the same React tree. Props, context, and state all work normally; only the physical location changes.',
      'Events bubble through the React tree, not the DOM one, so a click inside a portal reaches the handlers of its React parents even though the node lives elsewhere in the document.'
    ],
    why:[
      'CSS traps overlays. A parent with overflow: hidden clips a dropdown, a transform creates a containing block that breaks position: fixed, and a z-index in a stacking context cannot escape it. No amount of care inside the component fixes a parent it does not control.',
      'A portal steps out of the ancestor\'s box, usually to document.body, where the overlay is free of all of it, while the component that owns the modal still owns its state and reads its context. That combination, DOM freedom with tree membership, is the whole point.'
    ],
    code:`function Modal({ open, onClose, children }) {\n  if (!open) return null;\n\n  return createPortal(\n    <div\n      onClick={onClose}\n      style={{\n        position: 'fixed', inset: 0, background: 'rgba(23,33,29,.45)',\n        display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 50\n      }}\n    >\n      <div\n        role="dialog"\n        aria-modal="true"\n        onClick={e => e.stopPropagation()}\n        style={{ background: '#FBFCFA', padding: 18, maxWidth: 320, border: '1px solid #C7CDC3' }}\n      >\n        {children}\n        <p><button onClick={onClose}>Close</button></p>\n      </div>\n    </div>,\n    document.body\n  );\n}\n\nfunction App() {\n  const [open, setOpen] = useState(false);\n  const [clicks, setClicks] = useState(0);\n\n  return (\n    // this clipping parent would break the modal without a portal\n    <div onClick={() => setClicks(c => c + 1)}\n         style={{ overflow: 'hidden', height: 90, border: '1px dashed #C7CDC3', padding: 8 }}>\n      <p>Clicks counted by the parent: {clicks}</p>\n      <button onClick={() => setOpen(true)}>Open the modal</button>\n      <Modal open={open} onClose={() => setOpen(false)}>\n        <p>Rendered into document.body, still a child of App.</p>\n        <p>Clicking me still increments the parent\\u2019s counter, because React events bubble through the React tree.</p>\n      </Modal>\n    </div>\n  );\n}`,
    anno:[
      ['createPortal(node, container)','Imported from react-dom, not react, because it is browser-specific. Returns something you render like any element.'],
      ['document.body','The usual target. In a real app a dedicated <div id="modal-root"> avoids fighting with other libraries that also append to body.'],
      ['if (!open) return null;','Unmounting the modal is what removes it from the DOM. A hidden-but-mounted modal keeps its focus traps and listeners alive.'],
      ['onClick={e => e.stopPropagation()}','The dialog stops the click reaching the overlay\'s close handler. Standard click-outside-to-close, built out of ordinary bubbling.'],
      ['Clicks counted by the parent','Proof of the tree rule: the counter goes up when you click inside the modal, because in the React tree the modal is inside that div, whatever the DOM says.'],
      ['role="dialog" aria-modal="true"','A portal does not make a modal accessible. Focus must move in on open, be trapped while open, and return to the trigger on close: lesson 51.']
    ],
    mistakes:[
      ['Assuming DOM events behave like React events here','','A native listener added with addEventListener on an ancestor DOM node will not see portal clicks, because the node is not a descendant. Only React\'s synthetic events bubble through the tree.'],
      ['Portalling during server rendering','','There is no document. Render the portal only after mount, or let your framework handle it; a bare document.body reference will crash on the server.'],
      ['Forgetting the escape key and focus','','A modal that traps nothing and returns focus nowhere is unusable with a keyboard. The portal is the easy half of the job.'],
      ['Using a portal to escape a layout you could fix','','If the clipping parent is yours and the overflow is accidental, fix the CSS. Portals add a DOM boundary that complicates testing and focus.']
    ],
    ex:{
      task:'Add a tooltip that renders into document.body, positioned next to its trigger using the trigger\'s bounding rect, and closes on Escape.',
      start:`function Tip({ label, children }) {\n  const [open, setOpen] = useState(false);\n  const triggerRef = useRef(null);\n  // your code\n}\n\nfunction App() {\n  return <p>Hover <Tip label="I am portalled">this word</Tip> to see it.</p>;\n}`,
      sol:`function Tip({ label, children }) {\n  const [rect, setRect] = useState(null);\n  const triggerRef = useRef(null);\n\n  function show() {\n    setRect(triggerRef.current.getBoundingClientRect());\n  }\n\n  useEffect(() => {\n    if (!rect) return;\n    const onKey = e => { if (e.key === 'Escape') setRect(null); };\n    window.addEventListener('keydown', onKey);\n    return () => window.removeEventListener('keydown', onKey);\n  }, [rect]);\n\n  return (\n    <>\n      <span\n        ref={triggerRef}\n        tabIndex={0}\n        onMouseEnter={show}\n        onFocus={show}\n        onMouseLeave={() => setRect(null)}\n        onBlur={() => setRect(null)}\n        style={{ textDecoration: 'underline dotted', cursor: 'help' }}\n      >\n        {children}\n      </span>\n\n      {rect && createPortal(\n        <span\n          role="tooltip"\n          style={{\n            position: 'fixed',\n            top: rect.bottom + 6,\n            left: rect.left,\n            background: '#141C19', color: '#DFE7E1',\n            padding: '3px 7px', fontSize: 12, zIndex: 60\n          }}\n        >\n          {label}\n        </span>,\n        document.body\n      )}\n    </>\n  );\n}\n\nfunction App() {\n  return (\n    <div style={{ overflow: 'hidden', height: 60, border: '1px dashed #C7CDC3', padding: 8 }}>\n      <p>Hover <Tip label="I escaped the clipping parent">this word</Tip> to see it.</p>\n    </div>\n  );\n}`,
      why:'The measured rect doubles as the open flag, which removes a redundant piece of state: if there is a rect, the tooltip is showing. Position comes from getBoundingClientRect plus position: fixed, which is why the portal matters, since the tooltip is drawn relative to the viewport rather than to a clipping ancestor. onFocus and onBlur sit alongside the mouse handlers so the tooltip is reachable by keyboard, and tabIndex makes the trigger focusable at all. In production a positioning library such as Floating UI handles the cases this ignores: flipping when there is no room below, shifting away from the viewport edge, and following the trigger on scroll.'
    },
