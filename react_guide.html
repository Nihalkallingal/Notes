    ex:{
      task:'Build an optimistic like button, outside a form, using startTransition for the action. The count must jump immediately, and settle back if the request fails.',
      start:`function fakeLike(n) {\n  return new Promise((resolve, reject) =>\n    setTimeout(() => (Math.random() < 0.4 ? reject(new Error('network')) : resolve(n)), 700)\n  );\n}\n\nfunction App() {\n  const [likes, setLikes] = useState(3);\n  // your code\n}`,
      sol:`function fakeLike(n) {\n  return new Promise((resolve, reject) =>\n    setTimeout(() => (Math.random() < 0.4 ? reject(new Error('network')) : resolve(n)), 700)\n  );\n}\n\nfunction App() {\n  const [likes, setLikes] = useState(3);\n  const [failed, setFailed] = useState(false);\n  const [optimistic, addOptimistic] = useOptimistic(likes, (n, delta) => n + delta);\n  const [isPending, startTransition] = useTransition();\n\n  function like() {\n    setFailed(false);\n    startTransition(async () => {\n      addOptimistic(1);                     // instant feedback\n      try {\n        const saved = await fakeLike(likes + 1);\n        setLikes(saved);\n      } catch {\n        setFailed(true);                    // the optimistic value is dropped for us\n      }\n    });\n  }\n\n  return (\n    <div>\n      <button onClick={like} disabled={isPending}>\n        ♥ {optimistic}{isPending ? ' …' : ''}\n      </button>\n      {failed && <p style={{ color: '#8C5A12' }}>That did not save. The count went back.</p>}\n      <p><small>Fails about 40% of the time, on purpose.</small></p>\n    </div>\n  );\n}`,
      why:'The count changes on the click, before any request has finished, which is the entire user-visible point of optimistic updates. The failure path contains no rollback code, because there is nothing to roll back: the optimistic value only ever existed for the duration of the transition, and when the transition ends React renders from likes again. That is why useOptimistic is safer than the traditional approach of setting real state and undoing it in a catch, where an interleaved second click leaves the counter permanently wrong. Note the async function inside startTransition, which is what makes this an action rather than a plain state update, and the disabled button, which prevents the double submit that would otherwise race.'
    },
    mm:'An action owns its own pending, error, and optimistic state, so you stop hand-rolling those four pieces of state for every submit.'
  },
  {
    id:'46', t:'Server Components and the client boundary',
    what:[
      'A Server Component runs only on the server. It never ships to the browser, can be async and await data directly, and can read files or query a database. It has no state, no effects, and no event handlers.',
      'A Client Component is the kind you have written all course. The \'use client\' directive at the top of a file marks the boundary: that file and everything it imports becomes part of the client bundle.'
    ],
    why:[
      'Two costs motivate this. Every component in the bundle is code the user downloads and parses, and much of it, layout, formatting, static content, never needed to be interactive. And data fetching from the browser means a round trip after the page has loaded, then another for the next level down.',
      'Server Components remove both: the markdown renderer stays on the server, and the data is already in the response. What crosses the boundary is not HTML but a serialised description of the UI, which is why a Server Component can render a Client Component and pass it props.',
      'The direction matters. Server Components may import and render Client Components. The reverse is not possible: a Client Component can only receive server-rendered output as children, passed to it from above. That is why the usual shape is a server page rendering a small client island.'
    ],
    code:`// Server Components need a framework, so this demo tests the rule that\n// governs them: what can and cannot cross the boundary as a prop.\n\nfunction canCross(value) {\n  try {\n    structuredClone(value);   // roughly the same constraint as React's serialiser\n    return true;\n  } catch {\n    return false;\n  }\n}\n\nconst candidates = [\n  ['a string', 'hello'],\n  ['a number', 42],\n  ['a plain object', { id: 1, tags: ['a'] }],\n  ['a Date', new Date()],\n  ['a Map', new Map([['k', 'v']])],\n  ['null', null],\n  ['a function', () => {}],\n  ['a class instance with methods', new (class { go() {} })()],\n  ['a DOM node', typeof document === 'undefined' ? null : document.createElement('div')]\n];\n\nfunction App() {\n  return (\n    <div>\n      <p>Can this be passed from a Server Component to a Client Component?</p>\n      <ul>\n        {candidates.map(([label, value]) => (\n          <li key={label}>\n            {label}: <strong>{canCross(value) ? 'yes' : 'no'}</strong>\n          </li>\n        ))}\n      </ul>\n      <p><small>\n        React also allows JSX elements and, uniquely, references to Server\n        Functions, which structuredClone would reject.\n      </small></p>\n    </div>\n  );\n}`,
    anno:[
      ["'use client'","A directive at the top of a file, before the imports. It marks an entry point into client code, not a per-component annotation, and everything the file imports comes with it."],
      ['async function Page() { const rows = await db.query(...) }','Legal in a Server Component: no useEffect, no loading state, no waterfall. This is the biggest practical difference in day-to-day code.'],
      ['functions cannot cross','Which is why you cannot pass onClick from a server page to a client button. Pass data down, and let the client component own its handlers.'],
      ['JSX can cross','A Server Component can render server output and pass it as children to a client component, which is how a client-side tab bar wraps server-rendered panels.'],
      ['Server Functions can cross','A reference to a \'use server\' function is serialisable by design, so a client form can call it directly: lesson 47.'],
      ['No state, no effects, no context on the server','A Server Component runs once, produces output, and is gone. useState in one is an error, and this is the most common early mistake.']
    ],
    mistakes:[
      ['Adding \'use client\' to fix an error without reading it','','It works, and quietly pulls a subtree into the bundle. Push the directive as far down the tree as possible: a small interactive leaf, not the page.'],
      ['Passing a callback to a Client Component from the server','Error: Functions cannot be passed directly to Client Components unless you explicitly expose it by marking it with "use server".','Move the handler into the client component, or make it a Server Function.'],
      ['Expecting useState in a Server Component','Error: useState only works in Client Components. Add the "use client" directive at the top of the file to use it.','The component is doing something interactive and belongs on the client, or the interactive part should be extracted into a small client island.'],
      ['Assuming Server Components replace SSR','','They are different things. SSR renders your client tree to HTML for the first paint; Server Components decide which components exist on the client at all. A framework typically does both.']
    ],
    ex:{
      task:'Sketch the file layout for an article page with server-rendered content, a client-side comment box, and a client-side tab bar wrapping server-rendered panels. Say where each \'use client\' goes and why.',
      start:`// Write it as comments plus a runnable client-side approximation.\nfunction App() {\n  return <p>your code</p>;\n}`,
      sol:`// app/article/[id]/page.jsx        -- Server Component (no directive)\n//   async: awaits the article and the comments, renders markdown on the server\n//   imports <Tabs> and <CommentBox>, both client islands\n//\n// components/Tabs.jsx              -- 'use client'  (needs useState)\n//   receives server-rendered panels as children and shows one at a time\n//\n// components/CommentBox.jsx        -- 'use client'  (needs an input and a handler)\n//   calls a Server Function to post the comment\n//\n// lib/markdown.js                  -- no directive, imported only by the server\n//   stays out of the bundle entirely, which is the point\n\n// The client-side half, approximated here:\nfunction Tabs({ labels, children }) {\n  const [i, setI] = useState(0);\n  const panels = React.Children.toArray(children);\n  return (\n    <div>\n      <div role="tablist" style={{ display: 'flex', gap: 4 }}>\n        {labels.map((l, n) => (\n          <button key={l} role="tab" aria-selected={i === n} onClick={() => setI(n)}\n                  style={{ borderBottom: i === n ? '2px solid #2F6B57' : '2px solid transparent' }}>\n            {l}\n          </button>\n        ))}\n      </div>\n      <div style={{ paddingTop: 8 }}>{panels[i]}</div>\n    </div>\n  );\n}\n\nfunction CommentBox() {\n  const [text, setText] = useState('');\n  return (\n    <form onSubmit={e => { e.preventDefault(); setText(''); }}>\n      <input value={text} onChange={e => setText(e.target.value)} placeholder="Add a comment" />\n      <button type="submit" disabled={!text.trim()}>Post</button>\n    </form>\n  );\n}\n\nfunction App() {\n  // in the real app these panels are server-rendered output passed as children\n  return (\n    <div>\n      <Tabs labels={['Article', 'Comments']}>\n        <div><h4 style={{ margin: 0 }}>Rendered on the server</h4><p>No markdown library in the bundle.</p></div>\n        <div><p>Two comments, fetched on the server.</p><CommentBox /></div>\n      </Tabs>\n    </div>\n  );\n}`,
      why:'The shape to remember is a server page with client leaves, not a client page with server data. Tabs is a client component because it holds the selected index, but the panels it shows are server-rendered children handed to it, which means the markdown renderer and the article body never reach the browser even though an interactive component sits above them in the tree. That is the trick people miss: children pass through a client boundary as already-rendered output. The markdown library file carries no directive and is imported only by server code, so it is excluded from the bundle by construction rather than by configuration.'
    },
    mm:'Server Components decide what ships to the browser, and only serialisable data plus rendered output crosses the boundary.'
  },
  {
    id:'47', t:'Server Functions',
    what:[
      'A Server Function is a function marked \'use server\' that runs on the server but can be called from client code. The bundler replaces it in the client with a reference; calling it makes a request.',
      'They are most often used as form actions, which is where they meet the Actions mechanism from lesson 45.'
    ],
    why:[
      'The traditional path for a mutation is: write a handler, invent a URL, write a route, parse the body, validate, call the database, return JSON, then write the fetch call on the client and keep both ends in step. Most of that is plumbing that exists only because the two halves are in different files, in different languages of communication.',
      'A Server Function collapses it to a function call with typed arguments and a return value. The network is still there, and pretending otherwise is dangerous, which is why the rules below matter more than the convenience.',
      'The rules: every argument arrives from the network and must be validated; the function is a public endpoint whether or not you linked to it, so it must check authentication and authorisation itself; and arguments and return values must be serialisable.'
    ],
    code:`// A real Server Function lives in server code:\n//\n//   'use server';\n//   export async function createNote(prevState, formData) {\n//     const session = await auth();                  // never trust the client\n//     if (!session) return { error: 'Not signed in' };\n//     const text = String(formData.get('note') ?? '');\n//     if (text.length < 3) return { error: 'Too short' };\n//     await db.notes.insert({ userId: session.id, text });\n//     revalidatePath('/notes');                      // framework cache invalidation\n//     return { ok: true };\n//   }\n//\n// Below is the client half, with the network faked so it runs here.\n\nconst db = { notes: ['welcome'] };\n\nasync function createNote(prevState, formData) {\n  await new Promise(r => setTimeout(r, 700));          // the round trip\n  const text = String(formData.get('note') ?? '').trim();\n  if (text.length < 3) return { error: 'Too short (server said so)' };\n  db.notes.push(text);\n  return { ok: true, count: db.notes.length };\n}\n\nfunction SubmitButton() {\n  const { pending } = useFormStatus();\n  return <button type="submit" disabled={pending}>{pending ? 'Saving…' : 'Save note'}</button>;\n}\n\nfunction App() {\n  const [result, action] = useActionState(createNote, null);\n\n  return (\n    <div>\n      <form action={action}>\n        <input name="note" placeholder="at least 3 characters" />\n        <SubmitButton />\n      </form>\n      {result?.error && <p style={{ color: '#8C5A12' }}>{result.error}</p>}\n      {result?.ok && <p>Saved. The server now holds {result.count} notes.</p>}\n      <ul>{db.notes.map((n, i) => <li key={i}>{n}</li>)}</ul>\n    </div>\n  );\n}`,
    anno:[
      ["'use server';","At the top of a file, or at the top of an async function body. It does not mean that the code runs on the server by default; it means the function is exposed to the client as a callable endpoint."],
      ['action={action}','The action from useActionState. Because it is a real form action, the form works before hydration, and the browser handles the submit if JavaScript has not loaded yet.'],
      ['const session = await auth()','The line people forget. A Server Function is reachable by anyone who can read your JavaScript, so it authenticates and authorises like any other endpoint.'],
      ['String(formData.get(\'note\') ?? \'\')','Arguments arrive over the network as data you did not create. Validate the type and the shape, ideally with a schema library.'],
      ['revalidatePath / revalidateTag','Framework-level cache invalidation after a mutation, so the next render sees the new data. Without it the page can show a stale list.'],
      ['return { error }','Errors as return values, not exceptions, so the form can display them. Same reasoning as useActionState in lesson 45.']
    ],
    mistakes:[
      ['Trusting the arguments','','The single biggest risk. A hidden field, an id, a role, a price: all of it is attacker-controlled. Validate and re-derive anything security-relevant from the session.'],
      ['Assuming it is private because nothing links to it','','It has a stable public endpoint. Treat every Server Function as a documented API route.'],
      ['Returning something unserialisable','','A class instance, a function, or a database cursor cannot cross back. Return plain data.'],
      ['Using one for a read that happens on every render','','A Server Component that awaits directly is simpler and cacheable. Server Functions are for mutations and on-demand calls.']
    ],
    ex:{
      task:'Add validation that runs on both sides, and make the client show the server\'s verdict when the two disagree. Explain why duplicating the rule is not duplication.',
      start:`async function saveEmail(prev, formData) {\n  await new Promise(r => setTimeout(r, 600));\n  // your server-side validation\n}\n\nfunction App() {\n  return <p>your code</p>;\n}`,
      sol:`// one shared rule, imported by both halves in a real app\nfunction validateEmail(value) {\n  if (!value) return 'Email is required';\n  if (!value.includes('@')) return 'That does not look like an email';\n  return null;\n}\n\nconst taken = ['ada@example.com'];\n\nasync function saveEmail(prev, formData) {\n  await new Promise(r => setTimeout(r, 600));\n  const email = String(formData.get('email') ?? '').trim().toLowerCase();\n\n  // the server validates again, because the client can be bypassed entirely\n  const shapeError = validateEmail(email);\n  if (shapeError) return { error: shapeError };\n\n  // and checks what only the server knows\n  if (taken.includes(email)) return { error: 'That email is already registered' };\n\n  taken.push(email);\n  return { ok: true, email };\n}\n\nfunction SubmitButton() {\n  const { pending } = useFormStatus();\n  return <button type="submit" disabled={pending}>{pending ? 'Checking…' : 'Sign up'}</button>;\n}\n\nfunction App() {\n  const [result, action] = useActionState(saveEmail, null);\n  const [email, setEmail] = useState('');\n\n  const clientError = email === '' ? null : validateEmail(email);\n\n  return (\n    <div>\n      <form action={action}>\n        <input\n          name="email" value={email}\n          onChange={e => setEmail(e.target.value)}\n          placeholder="try ada@example.com"\n        />\n        <SubmitButton />\n      </form>\n      {clientError && <p style={{ color: '#8C5A12' }}>{clientError}</p>}\n      {result?.error && !clientError && <p style={{ color: '#8C5A12' }}>Server: {result.error}</p>}\n      {result?.ok && <p>Registered {result.email}.</p>}\n    </div>\n  );\n}`,
      why:'The shape rule is shared code called from both sides, which is why this is not duplication: one definition, two call sites, for two different jobs. On the client it is a courtesy that gives instant feedback; on the server it is a control, because a request can arrive from curl with no client code involved at all. The uniqueness check exists only on the server, since it needs data the browser does not have and must not have. That split, cheap feedback on the client and the real decision on the server, is the answer to "do you validate on the client or the server", and the answer is always both, for different reasons.'
    },
    mm:'A Server Function is a public endpoint with a nice calling convention, so validate and authorise inside it.'
  },
  {
    id:'48', t:'SSR, SSG, ISR, CSR, and hydration',
    what:[
      'Four ways to produce the HTML a browser first receives. CSR sends an empty shell and renders in the browser. SSR renders the HTML per request. SSG renders it at build time. ISR serves a static page and regenerates it in the background after a chosen interval.',
      'Hydration is what happens next in the last three: React walks the server-rendered DOM, attaches event handlers, and takes ownership of it, rather than rebuilding it.'
    ],
    why:[
      'The choice is a trade between freshness, latency, and cost. A blog is the same for everyone and changes rarely: build it once, SSG, and serve from a CDN. A dashboard is per-user and per-second: SSR or CSR, since caching it helps nobody. A product catalogue is shared, huge, and changes hourly: ISR gives you static speed with bounded staleness.',
      'Hydration exists because you want the first paint to be real content and the second moment to be a working application. It is also the source of a distinctive class of bug: if the client\'s first render does not match the server\'s HTML, React cannot attach to it safely.',
      'Mismatches come from a handful of causes: values that differ between machines, such as Date.now, Math.random, locale formatting, and time zones; reading window or localStorage during render; and invalid HTML nesting that the browser silently repairs, such as a div inside a p.'
    ],
    code:`// The safe pattern for anything that can only be known in the browser.\nfunction useMounted() {\n  const [mounted, setMounted] = useState(false);\n  useEffect(() => setMounted(true), []);\n  return mounted;\n}\n\nfunction LocalTime() {\n  const mounted = useMounted();\n  // First render matches the server: no locale, no clock, no mismatch.\n  if (!mounted) return <span>—</span>;\n  return <span>{new Date().toLocaleTimeString()}</span>;\n}\n\nfunction Unsafe() {\n  // In a server-rendered app this is a mismatch waiting to happen:\n  // the server picks one number and the client picks another.\n  return <span>{Math.random().toFixed(3)}</span>;\n}\n\nfunction App() {\n  const mounted = useMounted();\n  return (\n    <div>\n      <p>Local time, rendered only after mount: <LocalTime /></p>\n      <p>A value that would differ between server and client: <Unsafe /></p>\n      <p>Hydrated: {mounted ? 'yes' : 'not yet'}</p>\n      <p><small>\n        This playground is client-only, so nothing mismatches here. The pattern is\n        what matters: render the server-safe version first, then upgrade.\n      </small></p>\n    </div>\n  );\n}`,
    anno:[
      ['hydrateRoot(document.getElementById(\'root\'), <App />)','The client entry point for a server-rendered page, instead of createRoot. It adopts the existing DOM rather than replacing it.'],
      ['useMounted','The standard escape hatch. The first client render deliberately matches the server, and the browser-only value appears one render later.'],
      ['suppressHydrationWarning','A per-element opt-out for cases you cannot avoid, such as a timestamp. It silences the warning for that element\'s text only; it does not fix anything else.'],
      ['Selective hydration','React hydrates the parts the user interacts with first. Click a button in an unhydrated section and React prioritises that subtree, which is what Suspense boundaries buy you during hydration.'],
      ['Progressive hydration','The related idea that the page becomes interactive in pieces as their code and data arrive, rather than all at once at the end.'],
      ['Streaming SSR','renderToPipeableStream sends HTML as it is produced, with Suspense fallbacks in the markup, replaced as the slower parts resolve.']
    ],
    mistakes:[
      ['Reading window during render','ReferenceError: window is not defined','The server has no window. Read it in an effect, or guard with typeof window !== \'undefined\' and accept that the first render must not use it.'],
      ['Formatting dates or currency on both sides','Warning: Text content did not match. Server: "3/4/2026" Client: "04/03/2026"','Server and browser have different locales and time zones. Format on one side, or pass an explicit locale and time zone, or render after mount.'],
      ['Invalid nesting','Warning: In HTML, <div> cannot be a descendant of <p>. This will cause a hydration error.','The browser moves the div out of the paragraph, so the DOM no longer matches what React rendered. Fix the markup.'],
      ['Reaching for suppressHydrationWarning to silence a real bug','','It hides the symptom for one element. If the mismatch is structural, hydration is still broken and the interactive behaviour will be subtly wrong.']
    ],
    ex:{
      task:'Pick a rendering strategy for a dashboard, a blog, and an e-commerce catalogue, and defend each. Then write the component that shows a user-specific greeting without causing a hydration mismatch.',
      start:`function Greeting({ name }) {\n  // must be safe to server-render\n  return <p>your code</p>;\n}\n\nfunction App() { return <Greeting name="Ada" />; }`,
      sol:`// Dashboard: SSR, or CSR behind a login.\n//   Per-user, changes constantly, nothing is cacheable, and it is behind auth\n//   so SEO is irrelevant. SSR for a fast first paint of the shell; the data\n//   itself is fetched per request or streamed with Suspense.\n//\n// Blog: SSG.\n//   Identical for every reader, changes when an author publishes, and wants\n//   to be indexed. Build it once, serve from a CDN, rebuild on publish.\n//\n// Catalogue: ISR.\n//   Shared across users, too large to rebuild per deploy, and prices and stock\n//   change hourly. Serve static, revalidate on an interval or on a tag when\n//   inventory changes. Product pages that must be exact, such as checkout,\n//   fall back to SSR.\n\nfunction useMounted() {\n  const [m, setM] = useState(false);\n  useEffect(() => setM(true), []);\n  return m;\n}\n\nfunction Greeting({ name, timeZone = 'UTC' }) {\n  const mounted = useMounted();\n\n  // name comes from the server with the HTML: safe, and no flash of nothing\n  // the hour is local to the reader: browser-only, so it waits for mount\n  const hour = mounted ? new Date().getHours() : null;\n  const part = hour === null ? '' : hour < 12 ? 'morning' : hour < 18 ? 'afternoon' : 'evening';\n\n  return (\n    <p>\n      Hello, {name}.{' '}\n      {mounted\n        ? <span>Good {part}.</span>\n        : <span>Welcome back.</span>}\n    </p>\n  );\n}\n\nfunction App() { return <Greeting name="Ada" />; }`,
      why:'The name is server data, so it belongs in the server HTML: rendering it after mount would cost a flash of empty space and lose the SEO benefit. The time of day is a property of the reader\'s machine, so it cannot be known on the server without guessing, and guessing is exactly what produces a mismatch. Splitting the greeting into a server-safe sentence and an upgraded one gives correct HTML on the first byte and a personalised version a frame later, with no warning in the console. As for the three strategies, the reasoning to say out loud is the same each time: who is this page for, how often does it change, and does anyone need to index it.'
    },
    mm:'Choose the rendering strategy from freshness and audience, and make the first client render identical to the server\'s.'
  },
  {
    id:'49', t:'Activity: keeping hidden UI alive',
    what:[
      'Activity is a component that renders a subtree in one of two modes. Visible behaves normally. Hidden unmounts the effects and hides the content, but keeps the state, and pre-renders the subtree at a low priority.',
      'It is stable in React 19.2 and imported from react.'
    ],
    why:[
      'There have only ever been two ways to hide something, and both are wrong for some cases. Unmounting it loses the state: the half-typed form, the scroll position, the open accordion. Hiding it with CSS keeps everything, including the effects, the timers, the subscriptions, and the network requests of a screen nobody is looking at.',
      'Activity is the third option: keep the state, stop the effects. That is what you want for a tab the user will probably come back to, a route they just left, or the next step of a wizard.',
      'The pre-rendering half is a performance feature: React can render hidden content while the browser is idle, so revealing it is instant rather than a fresh mount with a fresh spinner.'
    ],
    code:`function Panel({ label }) {\n  const [text, setText] = useState('');\n  const [ticks, setTicks] = useState(0);\n\n  // an effect, so you can watch it stop while hidden\n  useEffect(() => {\n    const id = setInterval(() => setTicks(t => t + 1), 1000);\n    return () => clearInterval(id);\n  }, []);\n\n  return (\n    <div style={{ border: '1px solid #C7CDC3', padding: 8 }}>\n      <p>{label}: the timer has ticked {ticks} times</p>\n      <input value={text} onChange={e => setText(e.target.value)} placeholder="type, then switch away" />\n    </div>\n  );\n}\n\nfunction App() {\n  const [tab, setTab] = useState('a');\n\n  return (\n    <div>\n      <button onClick={() => setTab('a')}>Tab A (Activity)</button>\n      <button onClick={() => setTab('b')}>Tab B (unmounted)</button>\n\n      {/* state kept, effects stopped, ready to show instantly */}\n      <Activity mode={tab === 'a' ? 'visible' : 'hidden'}>\n        <Panel label="Kept alive" />\n      </Activity>\n\n      {/* the old way: gone completely, state and all */}\n      {tab === 'b' && <Panel label="Remounted every time" />}\n\n      <p><small>\n        Type in tab A, switch to B and wait, then come back: the text survives and\n        the tick count has not moved, because the effect was cleaned up.\n      </small></p>\n    </div>\n  );\n}`,
    anno:[
      ['<Activity mode="hidden">','Children stay mounted for state purposes, are hidden with display: none, and their effects are cleaned up as if they had unmounted.'],
      ['mode={cond ? \'visible\' : \'hidden\'}','The only prop you need. Switching back re-runs the effects, so an effect must still be written to be safe to re-run: the same discipline as lesson 20.'],
      ['Pre-rendering','Hidden content is rendered at a lower priority than anything visible, so it never delays the current screen but is ready when you need it.'],
      ['Versus display: none by hand','CSS hiding keeps the effects running: the timer above would keep ticking, and a hidden data table would keep polling.'],
      ['Versus unmounting','Unmounting is still right for anything expensive that the user is unlikely to revisit, since Activity keeps the memory.'],
      ['Not a substitute for a router','A framework may use it to keep the previous route warm, but it does not manage the URL or the history.']
    ],
    mistakes:[
      ['Expecting effects to keep running','','They are cleaned up on hide, deliberately. If you need a background subscription, it belongs above the Activity boundary, in a component that stays visible.'],
      ['Wrapping everything in Activity','','Every hidden subtree is retained memory. Use it where returning to the state matters, not as a default.'],
      ['Assuming hidden content is inert to the browser','','It is display: none, so it is out of the accessibility tree and not focusable, which is what you want, but it is still in the DOM and still costs memory.'],
      ['Confusing it with <ViewTransition>','','View transitions animate between states and are still experimental in 19.2. Activity is stable and unrelated.']
    ],
    ex:{
      task:'Build a three-step wizard where going back and forth preserves each step\'s inputs, using Activity rather than lifting every field into the parent.',
      start:`function Step({ n }) {\n  const [value, setValue] = useState('');\n  return <input value={value} onChange={e => setValue(e.target.value)} placeholder={'step ' + n} />;\n}\n\nfunction App() {\n  const [step, setStep] = useState(1);\n  // your code\n}`,
      sol:`function Step({ n }) {\n  const [value, setValue] = useState('');\n  return (\n    <div style={{ border: '1px solid #C7CDC3', padding: 8 }}>\n      <p>Step {n}</p>\n      <input\n        value={value}\n        onChange={e => setValue(e.target.value)}\n        placeholder={'answer for step ' + n}\n      />\n    </div>\n  );\n}\n\nfunction App() {\n  const [step, setStep] = useState(1);\n  const steps = [1, 2, 3];\n\n  return (\n    <div>\n      <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>\n        <button onClick={() => setStep(s => Math.max(1, s - 1))} disabled={step === 1}>Back</button>\n        <button onClick={() => setStep(s => Math.min(3, s + 1))} disabled={step === 3}>Next</button>\n        <span>step {step} of 3</span>\n      </div>\n\n      {steps.map(n => (\n        <Activity key={n} mode={step === n ? 'visible' : 'hidden'}>\n          <Step n={n} />\n        </Activity>\n      ))}\n    </div>\n  );\n}`,
      why:'Each step owns its own field, and the answers survive navigation because the hidden steps are still mounted. The alternative designs are both worse: unmounting each step means lifting every field into the parent so nothing is lost, which centralises state that has no business being central, and hiding with CSS would leave any validation effects or autosave timers running in steps the user is not on. There is a real cost, which is that all three steps stay in memory, so this is the right tool for a three-step wizard and the wrong one for a forty-tab console. Note that a submit button still needs the values, so a real wizard reports each step\'s answer upward on change, or reads it from a form on submit.'
    },
    mm:'Activity keeps state and stops effects, which is the middle ground between unmounting and hiding with CSS.'
  },
  {
    id:'50', t:'Testing: behaviour, not implementation',
    what:[
      'React Testing Library renders a component into a DOM and gives you queries that find elements the way a user would: by role, by label, by visible text. You then interact with them and assert on what the user can see.',
      'Its guiding rule is that a test should resemble how the software is used. Tests that reach for state, props, or internal function names break when you refactor and pass when the feature is broken.'
    ],
    why:[
      'Implementation-detail tests are worse than no tests, because they cost maintenance and provide false confidence. Renaming a state variable should not break a test; removing the button that saves the form absolutely should.',
      'Querying by accessible role and label has a second benefit that is easy to miss: a component you cannot query is usually a component a screen reader cannot use either. If getByLabelText cannot find your input, it has no label.',
      'The order of preference for queries follows that logic: role, then label text, then placeholder or display value, then test id as a last resort. Reaching for a test id first is the most common way to end up with tests that pass while the page is unusable.'
    ],
    code:`// React Testing Library cannot run in this playground, so the snippet is\n// the component under test, written so that it is easy to test. The test\n// file is in the walkthrough and the solution below.\n\nfunction LoginForm({ onSubmit }) {\n  const [email, setEmail] = useState('');\n  const [error, setError] = useState(null);\n  const [busy, setBusy] = useState(false);\n\n  async function handleSubmit(e) {\n    e.preventDefault();\n    if (!email.includes('@')) { setError('Enter a valid email'); return; }\n    setError(null);\n    setBusy(true);\n    try {\n      await onSubmit(email);\n    } catch (err) {\n      setError(err.message);\n    } finally {\n      setBusy(false);\n    }\n  }\n\n  return (\n    <form onSubmit={handleSubmit}>\n      <label htmlFor="email">Email address</label>{' '}\n      <input id="email" value={email} onChange={e => setEmail(e.target.value)} />\n      <button type="submit" disabled={busy}>{busy ? 'Signing in…' : 'Sign in'}</button>\n      {error && <p role="alert">{error}</p>}\n    </form>\n  );\n}\n\nfunction App() {\n  const [signedIn, setSignedIn] = useState(null);\n  return (\n    <div>\n      <LoginForm onSubmit={async email => {\n        await new Promise(r => setTimeout(r, 500));\n        if (email.endsWith('@blocked.com')) throw new Error('That domain is blocked');\n        setSignedIn(email);\n      }} />\n      {signedIn && <p>Signed in as {signedIn}</p>}\n    </div>\n  );\n}`,
    anno:[
      ['<label htmlFor="email"> with <input id="email">','What makes getByLabelText(/email address/i) work, and what makes the field usable with a screen reader. The same markup serves both.'],
      ['role="alert"','Announces the error to assistive technology, and gives the test findByRole(\'alert\') instead of searching for the exact message string.'],
      ['const user = userEvent.setup()','The modern way to interact. userEvent fires the full sequence of real events, including focus and keydown, where fireEvent fires one synthetic event.'],
      ['await user.type(screen.getByLabelText(/email/i), \'a@b.com\')','A test written in the user\'s vocabulary. Nothing here mentions useState, the component name, or a CSS class.'],
      ['await screen.findByRole(\'alert\')','findBy queries wait for the element to appear, which is how you test something asynchronous without arbitrary timeouts.'],
      ['expect(screen.queryByText(/signing in/i)).not.toBeInTheDocument()','queryBy returns null instead of throwing, so it is the query for asserting absence.']
    ],
    mistakes:[
      ['Testing state instead of output','','Asserting that a state variable changed tells you nothing about what the user sees. Assert on the rendered result.'],
      ['Reaching for getByTestId first','','A test id is invisible to users and hides accessibility problems. Try role and label first; the query you cannot write is often a bug in the markup.'],
      ['act warnings from unawaited updates','Warning: An update to LoginForm inside a test was not wrapped in act(...)','Something updated after the test moved on. Use await with userEvent and findBy queries, which handle act for you, rather than adding act manually.'],
      ['Mocking too deep','','Mocking useState or a child component couples the test to the implementation. Mock the network boundary instead, with MSW or a stubbed fetch.'],
      ['Snapshot tests as the main strategy','','A snapshot asserts that nothing changed, not that anything works, and a broken snapshot is usually updated without being read.']
    ],
    ex:{
      task:'Write the test file for LoginForm: the validation error, the successful submit, and the blocked-domain failure, mocking only the onSubmit boundary.',
      start:`// sketch the test file for the component above\nfunction App() {\n  return <p>your code</p>;\n}`,
      sol:`// LoginForm.test.jsx\n//\n// import { render, screen } from '@testing-library/react';\n// import userEvent from '@testing-library/user-event';\n// import LoginForm from './LoginForm';\n//\n// test('rejects an email with no @', async () => {\n//   const user = userEvent.setup();\n//   const onSubmit = vi.fn();\n//   render(<LoginForm onSubmit={onSubmit} />);\n//\n//   await user.type(screen.getByLabelText(/email address/i), 'nope');\n//   await user.click(screen.getByRole('button', { name: /sign in/i }));\n//\n//   expect(await screen.findByRole('alert')).toHaveTextContent(/valid email/i);\n//   expect(onSubmit).not.toHaveBeenCalled();\n// });\n//\n// test('submits a valid email and shows the pending state', async () => {\n//   const user = userEvent.setup();\n//   let resolve;\n//   const onSubmit = vi.fn(() => new Promise(r => { resolve = r; }));\n//   render(<LoginForm onSubmit={onSubmit} />);\n//\n//   await user.type(screen.getByLabelText(/email address/i), 'ada@example.com');\n//   await user.click(screen.getByRole('button', { name: /sign in/i }));\n//\n//   expect(onSubmit).toHaveBeenCalledWith('ada@example.com');\n//   expect(screen.getByRole('button', { name: /signing in/i })).toBeDisabled();\n//\n//   resolve();\n//   await screen.findByRole('button', { name: /sign in/i });   // back to idle\n// });\n//\n// test('shows the error from a rejected submit', async () => {\n//   const user = userEvent.setup();\n//   const onSubmit = vi.fn().mockRejectedValue(new Error('That domain is blocked'));\n//   render(<LoginForm onSubmit={onSubmit} />);\n//\n//   await user.type(screen.getByLabelText(/email address/i), 'x@blocked.com');\n//   await user.click(screen.getByRole('button', { name: /sign in/i }));\n//\n//   expect(await screen.findByRole('alert')).toHaveTextContent(/blocked/i);\n// });\n\nfunction App() {\n  return (\n    <div>\n      <p>Three tests, no implementation details:</p>\n      <ul>\n        <li>queries by label and role, never by class or test id</li>\n        <li>mocks only onSubmit, the boundary the component does not own</li>\n        <li>asserts on what a user sees: an alert, a disabled button, a label change</li>\n      </ul>\n    </div>\n  );\n}`,
      why:'Each test names a behaviour, not a method. The middle one is the interesting one: holding the promise unresolved lets you assert on the pending state, which is a real user-visible behaviour that a test asserting only the final result would miss, and it needs no timers or arbitrary waits. The mock sits exactly at the boundary the component does not own, so the validation, the error display, and the disabled button are all genuinely exercised. Notice that all three tests would survive a rewrite of the component from useState to useReducer or useActionState, and all three would fail if the button or the error message disappeared, which is the definition of a test worth having.'
    },
    mm:'Query the way a user finds things and assert on what they see, so the test survives a refactor and fails on a regression.'

  {
    id:'51', t:'Accessibility in React components',
    what:[
      'Most accessibility in React is just correct HTML: a button element for an action, a label tied to its input, a heading structure that describes the page. React adds two specific responsibilities, because it owns the DOM: managing focus, and keeping ARIA state in step with your React state.',
      'The hard cases are the ones where you replace a native control: modals, menus, comboboxes, tabs, and anything custom that must be operable with a keyboard.'
    ],
    why:[
      'Native elements come with keyboard behaviour, focus handling, and an accessibility role for free. A div with an onClick has none of it, so every div-as-button is a decision to reimplement, badly, what the browser already did.',
      'Focus is React\'s particular problem because components mount and unmount underneath the user. Open a dialog and focus stays behind on the trigger, so a keyboard user is tabbing through a page they cannot see. Close it and remove the trigger, and focus lands on the body, which loses their place entirely.',
      'ARIA is the last resort, not the first. The rule is that no ARIA is better than bad ARIA: aria-expanded that never updates, or role="button" on something that does not respond to Enter, actively misinforms.'
    ],
    code:`function Dialog({ open, onClose, title, children }) {\n  const panelRef = useRef(null);\n  const returnTo = useRef(null);\n\n  useEffect(() => {\n    if (!open) return;\n    returnTo.current = document.activeElement;      // remember where we came from\n    panelRef.current?.focus();\n\n    function onKey(e) {\n      if (e.key === 'Escape') { onClose(); return; }\n      if (e.key !== 'Tab') return;\n\n      // keep focus inside the dialog\n      const items = panelRef.current.querySelectorAll(\n        'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'\n      );\n      if (items.length === 0) return;\n      const first = items[0], last = items[items.length - 1];\n      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }\n      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }\n    }\n\n    document.addEventListener('keydown', onKey);\n    return () => {\n      document.removeEventListener('keydown', onKey);\n      returnTo.current?.focus();                    // and put focus back\n    };\n  }, [open, onClose]);\n\n  if (!open) return null;\n\n  return createPortal(\n    <div style={{ position: 'fixed', inset: 0, background: 'rgba(23,33,29,.45)', display: 'flex',\n                  alignItems: 'center', justifyContent: 'center', zIndex: 50 }}>\n      <div\n        ref={panelRef} tabIndex={-1} role="dialog" aria-modal="true" aria-labelledby="dlg-title"\n        style={{ background: '#FBFCFA', padding: 16, border: '1px solid #C7CDC3', maxWidth: 320 }}\n      >\n        <h3 id="dlg-title" style={{ marginTop: 0 }}>{title}</h3>\n        {children}\n        <p><button onClick={onClose}>Cancel</button> <button onClick={onClose}>Confirm</button></p>\n      </div>\n    </div>,\n    document.body\n  );\n}\n\nfunction App() {\n  const [open, setOpen] = useState(false);\n  return (\n    <div>\n      <button onClick={() => setOpen(true)}>Delete the thing</button>\n      <Dialog open={open} onClose={() => setOpen(false)} title="Are you sure?">\n        <p>Tab around: focus cannot leave. Press Escape, and focus returns to the button.</p>\n      </Dialog>\n      <p><small>Try it with the keyboard only.</small></p>\n    </div>\n  );\n}`,
    anno:[
      ['returnTo.current = document.activeElement','Saved before focus moves, so the cleanup can send the user back where they were. Forgetting this is the most common modal bug.'],
      ['panelRef.current?.focus() with tabIndex={-1}','A div cannot receive focus without tabIndex="-1". Focusing the panel means the next Tab starts inside the dialog.'],
      ['role="dialog" aria-modal="true" aria-labelledby','Three attributes that tell a screen reader this is a dialog, that the rest of the page is inert, and what it is called.'],
      ['The Tab handler','A focus trap in eight lines. It is also why libraries exist: real traps handle shadow DOM, disabled elements, elements hidden by CSS, and iframes.'],
      ['return () => { ...; returnTo.current?.focus(); }','Cleanup does double duty: remove the listener, restore focus. Both belong to the same lifetime.'],
      ['aria-expanded, aria-selected, aria-invalid','Derive them from state in the render, exactly like className. An ARIA attribute that can go stale is worse than none.']
    ],
    mistakes:[
      ['A div with onClick','','No keyboard, no role, no focus. Use a button, and restyle it. If you truly cannot, you owe it role="button", tabIndex={0}, and handlers for Enter and Space.'],
      ['A placeholder as a label','','It disappears when the user types, is not read reliably, and fails contrast. Use a real label, visually hidden if the design demands it.'],
      ['Removing focus outlines','','outline: none with no replacement makes the app unusable by keyboard. Style :focus-visible instead.'],
      ['Announcing nothing when content changes','','A filtered result count or a saved message that appears silently is invisible to a screen reader user. Use role="status" for polite updates and role="alert" for errors.'],
      ['Trusting an automated audit','','axe and Lighthouse catch missing labels and contrast, not a broken focus order. Unplug the mouse and use the feature.']
    ],
    ex:{
      task:'Make an accessible combobox-style filter: a text input with a list of results, where arrow keys move a highlighted option, Enter selects it, and the result count is announced.',
      start:`const FRUIT = ['apple', 'apricot', 'banana', 'blackberry', 'cherry'];\n\nfunction App() {\n  const [query, setQuery] = useState('');\n  // your code\n}`,
      sol:`const FRUIT = ['apple', 'apricot', 'banana', 'blackberry', 'cherry'];\n\nfunction App() {\n  const [query, setQuery] = useState('');\n  const [active, setActive] = useState(0);\n  const [chosen, setChosen] = useState(null);\n\n  const results = FRUIT.filter(f => f.startsWith(query.toLowerCase()));\n  const listId = 'fruit-list';\n\n  function onKeyDown(e) {\n    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(i => Math.min(results.length - 1, i + 1)); }\n    if (e.key === 'ArrowUp') { e.preventDefault(); setActive(i => Math.max(0, i - 1)); }\n    if (e.key === 'Enter' && results[active]) { setChosen(results[active]); setQuery(results[active]); }\n    if (e.key === 'Escape') { setQuery(''); setActive(0); }\n  }\n\n  return (\n    <div>\n      <label htmlFor="fruit">Find a fruit</label>{' '}\n      <input\n        id="fruit"\n        role="combobox"\n        aria-expanded={results.length > 0}\n        aria-controls={listId}\n        aria-activedescendant={results[active] ? 'opt-' + results[active] : undefined}\n        autoComplete="off"\n        value={query}\n        onChange={e => { setQuery(e.target.value); setActive(0); }}\n        onKeyDown={onKeyDown}\n      />\n\n      {/* announced politely, without stealing focus */}\n      <p role="status" style={{ fontSize: 12 }}>{results.length} matches</p>\n\n      <ul id={listId} role="listbox" style={{ listStyle: 'none', padding: 0 }}>\n        {results.map((f, i) => (\n          <li\n            key={f}\n            id={'opt-' + f}\n            role="option"\n            aria-selected={i === active}\n            onMouseDown={() => { setChosen(f); setQuery(f); }}\n            style={{ background: i === active ? '#E3EBE6' : 'transparent', padding: '2px 4px', cursor: 'pointer' }}\n          >\n            {f}\n          </li>\n        ))}\n      </ul>\n      {chosen && <p>chosen: {chosen}</p>}\n    </div>\n  );\n}`,
      why:'Focus never leaves the input, which is what aria-activedescendant is for: it tells assistive technology which option is current without moving the focus ring, and it is derived from state so it cannot go stale. The count sits in a role="status" region, so it is announced when it changes without interrupting typing, which is the accessible equivalent of the visible "5 matches" a sighted user reads for free. onMouseDown rather than onClick on the options is a deliberate detail, since mousedown fires before the input loses focus. Even so, a production combobox has more cases than this, and the honest recommendation is to build on an accessible primitive library rather than to maintain your own ARIA contract.'
    },
    mm:'Use the native element, manage focus across mounts and unmounts, and derive every ARIA attribute from state.'
  },
  {
    id:'52', t:'Shipping: Vite, architecture, and security',
    what:[
      'A production React app needs a build tool, a way to handle configuration per environment, a folder structure that survives growth, and an honest look at the ways React apps get compromised.',
      'Vite is the default choice for a client-rendered app. A framework such as Next.js is the choice when you want routing, server rendering, and Server Components without assembling them yourself.'
    ],
    why:[
      'The build tool matters because the browser cannot run JSX and should not download your whole app at once. Vite gives you a dev server with instant reloads, and a production build that minifies, splits, and hashes your files for caching.',
      'Environment variables matter because the boundary is easy to get wrong. Anything the browser can read is public. A key in a client-side variable is in the bundle, visible to anyone who opens the network tab, no matter what it is called.',
      'Structure matters because the default, one folder per file type, means every feature is spread across four directories. Grouping by feature keeps the things that change together in one place, and makes it obvious what can be deleted.',
      'Security matters because React\'s defaults protect you from most XSS, and there are exactly a few ways to opt out of that protection by hand.'
    ],
    code:`// React escapes text by default. These are the ways to switch that off.\n\nconst untrusted = '<img src=x onerror="alert(1)"> and <b>bold</b>';\n\n// A real app uses DOMPurify. This is a deliberately crude stand-in.\nfunction sanitize(html) {\n  return html\n    .replace(/<\\s*(script|img|iframe|object|embed|svg)[^>]*>/gi, '')\n    .replace(/on\\w+\\s*=\\s*("[^"]*"|'[^']*'|[^\\s>]+)/gi, '');\n}\n\nfunction App() {\n  const [userUrl, setUserUrl] = useState('javascript:alert(1)');\n\n  // only allow schemes you understand\n  const safeHref = /^https?:\\/\\//i.test(userUrl) ? userUrl : null;\n\n  return (\n    <div>\n      <p><b>Safe by default.</b> Rendered as text, tags and all:</p>\n      <p style={{ fontFamily: 'monospace', fontSize: 12 }}>{untrusted}</p>\n\n      <p><b>Opting out, with sanitising:</b></p>\n      <div dangerouslySetInnerHTML={{ __html: sanitize(untrusted) }} />\n\n      <p><b>A URL from a user is code until you check it:</b></p>\n      <input value={userUrl} onChange={e => setUserUrl(e.target.value)} style={{ width: '100%' }} />\n      {safeHref\n        ? <p><a href={safeHref} rel="noreferrer noopener" target="_blank">Allowed link</a></p>\n        : <p>Blocked: only http and https are allowed.</p>}\n    </div>\n  );\n}`,
    anno:[
      ['{untrusted}','The default. React escapes any string you interpolate, which is why XSS through ordinary rendering is essentially impossible.'],
      ['dangerouslySetInnerHTML={{ __html: ... }}','The deliberate opt-out, named to make you think. The only safe use is with sanitised HTML, and the sanitiser should be DOMPurify rather than a regular expression.'],
      ['href={userUrl}','A javascript: or data: URL in an href executes on click. Validate the scheme against an allow-list; React warns about javascript: URLs but do not rely on that.'],
      ['import.meta.env.VITE_API_URL','Vite only exposes variables prefixed with VITE_ to the client, which is a guard rail, not a secret store. Secrets stay on a server.'],
      ['npm create vite@latest my-app -- --template react','The whole setup. Add the React Compiler plugin, eslint-plugin-react-hooks, and TypeScript, and you have the modern default stack.'],
      ['src/features/invoices/{InvoiceList.jsx, useInvoices.js, api.js}','Group by feature, with a shared components/ and lib/ for things genuinely used everywhere. Lesson 10, at the scale where it starts to matter.']
    ],
    mistakes:[
      ['An API key in a client-side environment variable','','It ships in the bundle. Anything that must stay secret goes behind a server you control, called from a Server Function or an API route.'],
      ['dangerouslySetInnerHTML with user content','','The classic React XSS. If the content comes from a user, from a CMS, or from an API you do not own, sanitise it, and prefer rendering structured data over HTML.'],
      ['Storing a session token in localStorage','','Any XSS on the page can read it. An httpOnly cookie cannot be read by JavaScript, which is the point of it.'],
      ['Assuming the client can enforce a rule','','Hidden fields, disabled buttons, and role checks in the UI are conveniences. Every one of them must be re-checked on the server.'],
      ['Shipping a development build','','Ten times slower, with warnings and dev-only checks included. Always deploy the output of the production build, and check the bundle size while you are there.']
    ],
    ex:{
      task:'Write down the deployment checklist for the app you would build after this course: build tool, linting, types, splitting, environment variables, error reporting, and the three security checks that matter most.',
      start:`function App() {\n  return <p>your code</p>;\n}`,
      sol:`const CHECKLIST = [\n  ['Build', 'Vite for a client app, Next.js if you want SSR, routing, and Server Components. Deploy the production build, and look at the bundle report before you ship.'],\n  ['Lint', 'eslint-plugin-react-hooks with the recommended preset, which now includes the compiler-powered rules. Fix the exhaustive-deps warnings rather than disabling them.'],\n  ['Compiler', 'Enable React Compiler and delete identity-only useMemo and useCallback as you touch files. Keep the ones guarding measured expensive work.'],\n  ['Types', 'TypeScript in strict mode, plus a runtime schema check such as Zod at every boundary where data enters the app.'],\n  ['Splitting', 'Lazy routes by default, plus lazy loading for anything heavy behind an interaction. Preload on hover or intent.'],\n  ['Config', 'Only public values in VITE_ variables. Secrets live on a server. One config module, so nothing reads import.meta.env from a component.'],\n  ['Errors', 'Error boundaries around each independently failing region, plus a reporting service wired to componentDidCatch and onUncaughtError.'],\n  ['Tests', 'React Testing Library for behaviour, queried by role and label. Mock at the network boundary only.'],\n  ['Access', 'Keyboard-only pass over every flow, real labels, managed focus on every dialog and route change.'],\n  ['Security', 'No dangerouslySetInnerHTML without DOMPurify. Allow-list URL schemes. Tokens in httpOnly cookies, never localStorage. Re-check every permission on the server.']\n];\n\nfunction App() {\n  const [open, setOpen] = useState('Security');\n  return (\n    <div>\n      <ul style={{ paddingLeft: 18 }}>\n        {CHECKLIST.map(([k, v]) => (\n          <li key={k} style={{ marginBottom: 4 }}>\n            <button onClick={() => setOpen(o => (o === k ? null : k))}\n                    aria-expanded={open === k}>\n              {k}\n            </button>\n            {open === k && <p style={{ margin: '4px 0 0' }}>{v}</p>}\n          </li>\n        ))}\n      </ul>\n    </div>\n  );\n}`,
      why:'The list is the deliverable, and the three security items worth memorising are at the bottom: never render unsanitised HTML, never trust a URL scheme, and never keep a token where JavaScript can read it. Everything above them is about keeping the app changeable a year from now, which is the part of shipping that is easy to skip and expensive to retrofit. Note the shape of the answer to "how do you deploy React": it is not a tool list, it is a set of decisions with reasons, and an interviewer asking this question is checking whether you have shipped something or only built something.'
    },
    mm:'React escapes by default and the browser trusts nothing else, so ship the production build, keep secrets on a server, and re-check every rule there.'
  }
  ]
});

<script>
/* ============================================================

INTERVIEW.push(
{
  d:'Easy', topic:'Basics',
  q:`What is React, and what problem does it solve?`,
  a:`<p>React is a library for building user interfaces out of components, where you describe what the screen should look like for the current data and React works out the DOM changes needed to get there. The problem it solves is keeping the UI in sync with state: written imperatively, every new piece of state multiplies the number of transitions you have to get right, and the bugs live in the transitions you forgot.</p><p>The nuance worth adding is that it is a library, not a framework. It renders. Routing, data fetching, and styling are separate decisions, which is a strength when you want control and a cost when you would rather be told.</p>`,
  fq:`When would you not use React?`,
  fa:`<p>A static marketing page or a blog, or anything where the interaction is a handful of event handlers. Plain HTML and a little JavaScript loads faster with no build step. React earns its cost when a lot of state changes over time and a lot of UI has to stay in step with it.</p>`
},
{
  d:'Easy', topic:'JSX',
  q:`What is JSX, and what does it compile to?`,
  a:`<p>JSX is a syntax extension that lets you write tag syntax inside JavaScript. It is not HTML and not a string: a compiler turns every tag into a function call before it runs. Classically that is React.createElement; with the modern automatic runtime it is a jsx call imported from react/jsx-runtime, which is why you no longer need React in scope.</p><p>The result is a plain object describing the element, not a DOM node. That is what makes building it cheap enough to do on every keystroke.</p>`,
  code:`// you write\nconst el = <button className="ok" onClick={save}>Save</button>;\n\n// classic runtime compiles to\nconst el = React.createElement('button', { className: 'ok', onClick: save }, 'Save');\n\n// automatic runtime compiles to\nimport { jsx as _jsx } from 'react/jsx-runtime';\nconst el = _jsx('button', { className: 'ok', onClick: save, children: 'Save' });`,
  fq:`Why must a component return a single root element?`,
  fa:`<p>Because a return statement produces one value, and each tag is one function call. A fragment groups siblings without adding a DOM node, which is why fragments exist at all.</p>`
},
{
  d:'Easy', topic:'State',
  q:`Props versus state.`,
  a:`<p>Props are the arguments a component receives from its parent, and they are read-only. State is memory owned by one instance of the component, and changing it asks React to re-render. Data flows one way: a parent passes props down, and a child reports back by calling a function it was given.</p><p>The practical test is who is allowed to change the value. If the component itself changes it, that is state. If someone above owns it, that is a prop, and if the child needs to change it, the parent passes a setter alongside it.</p>`,
  fq:`What happens if you write to props?`,
  fa:`<p>Nothing good. Assigning to a prop either throws in strict mode or mutates an object the parent still owns, and React will not re-render because you never told it anything changed. If a value needs to change, it belongs in state, owned by whoever is entitled to change it.</p>`
},
{
  d:'Easy', topic:'Basics',
  q:`Function components versus class components, and why did hooks win?`,
  a:`<p>A function component is a function that takes props and returns elements, with hooks for state and side effects. A class component extends React.Component, holds state in this.state, and uses lifecycle methods. Both still work; classes are legacy for everything except error boundaries, which have no hook equivalent.</p><p>Hooks won because lifecycle methods split code by timing rather than by concern. A single feature, say a subscription, was spread across componentDidMount, componentDidUpdate, and componentWillUnmount, with three chances to forget one. A custom hook puts that feature in one function, and unlike higher-order components or render props, it shares behaviour without adding layers to the tree.</p>`,
  fq:`So there is no reason to write a class today?`,
  fa:`<p>One: error boundaries need getDerivedStateFromError and componentDidCatch, which have no hook version in React 19. Write it once, or take one from react-error-boundary, and write no others.</p>`
},
{
  d:'Easy', topic:'Internals',
  q:`What is the Virtual DOM, and is it actually faster than the DOM?`,
  a:`<p>The Virtual DOM is the tree of plain JavaScript objects React builds when it renders. It compares the new tree with the previous one and applies the differences to the real DOM. That comparison is reconciliation.</p><p>It is not faster than the DOM. A hand-written imperative update that touches exactly the right node once will always win. What the diff buys you is that you get a near-minimal update for free, from code that simply re-describes the whole screen, so you never write the transitions yourself. Saying this plainly is a good signal, because "the Virtual DOM makes React fast" is the answer interviewers hear all day.</p>`,
  fq:`How does the diff stay cheap, given that tree comparison is expensive in general?`,
  fa:`<p>It does not do a general tree diff. It uses heuristics: different element types mean throw the subtree away and rebuild it, the same type means keep the node and update its props, and within a list identity comes from the key. That makes it linear rather than cubic, and it is why changing a wrapper element remounts everything below it.</p>`
},
{
  d:'Easy', topic:'Lists',
  q:`Why does React need a key in lists, and what breaks with index keys?`,
  a:`<p>The key tells React which item an element corresponds to, so that when the array changes it can tell "this row moved" from "every row changed its text". Without that, position is the only information available.</p><p>An index key means the key is the position, so it never changes when items move. Delete the first row and React sees element zero simply changed its content, so it keeps the existing component instance and its state in place while the data underneath shifts. Anything held by the row, a checkbox, typed text, an open menu, now belongs to the wrong item.</p>`,
  code:`// wrong: identity is the position\n{items.map((item, i) => <Row key={i} item={item} />)}\n\n// right: identity comes from the data\n{items.map(item => <Row key={item.id} item={item} />)}`,
  fq:`When is an index key acceptable, and why is Math.random worse than either?`,
  fa:`<p>An index is fine for a static list that never reorders and only ever appends at the end. Math.random gives a different key on every render, so React throws away every DOM node and every piece of state in the list every time: it silences the warning and produces the worst possible behaviour.</p>`
},
{
  d:'Easy', topic:'Forms',
  q:`Controlled versus uncontrolled components. Build one input as both and state the trade-offs.`,
  a:`<p>A controlled input renders its value from state and routes every keystroke through onChange, so state is the single source of truth. An uncontrolled input keeps its value in the DOM, takes a defaultValue, and you read it when you need it.</p><p>Control when the UI must react as the user types: live validation, a character count, an enabled button, mirroring the value elsewhere. Leave it uncontrolled when you only care at submit time, which costs no renders and less code. File inputs cannot be controlled at all.</p>`,
  code:`// controlled\nconst [name, setName] = useState('');\n<input value={name} onChange={e => setName(e.target.value)} />\n\n// uncontrolled\nconst ref = useRef(null);\n<input defaultValue="Ada" ref={ref} />\n// or read the whole form at once\nnew FormData(formEl)`,
  fq:`What causes the warning about switching a controlled input to uncontrolled?`,
  fa:`<p>Passing value={undefined} or null on some render, usually because the state started as undefined or the data has not arrived. Initialise text state to an empty string, or coerce with value={x ?? ""}.</p>`
},
{
  d:'Easy', topic:'Basics',
  q:`What does StrictMode do?`,
  a:`<p>In development it deliberately double-invokes things that are supposed to be pure or idempotent: it calls your component function twice, calls reducers and state updaters twice, and mounts each component twice by running the effect, the cleanup, and the effect again. It also warns about deprecated APIs.</p><p>It is a free test. An effect with a cleanup that fully undoes its setup is unaffected; one that leaks a subscription or double-counts fails immediately, in development, instead of on the first route change in production. None of it happens in production builds.</p>`,
  fq:`A colleague removes StrictMode because their effect runs twice. What do you say?`,
  fa:`<p>That the bug is still there, just hidden, and it will reappear the moment the component unmounts and remounts. The fix is the cleanup function. Guarding the effect with a hasRun ref is the same mistake with extra steps, because it also breaks legitimate re-runs when dependencies change.</p>`
},
{
  d:'Easy', topic:'Hooks',
  q:`Why can hooks not be called conditionally or in a loop?`,
  a:`<p>React stores hook state in an ordered list per component instance and matches each call to its slot by position, not by name. It has no other way to know which useState you mean. A conditional hook shifts every later slot, so your state reads someone else's value.</p><p>Hence the two rules: call hooks at the top level, and call them in the same order on every render. The corollary is that you make the value conditional rather than the call.</p>`,
  code:`// illegal: the hook count changes between renders\nif (isOpen) {\n  const [x, setX] = useState(0);\n}\n\n// legal: always call it, use the result conditionally\nconst [x, setX] = useState(0);\nreturn isOpen ? <p>{x}</p> : null;`,
  fq:`Is anything exempt from that rule?`,
  fa:`<p>The use hook, which reads a promise or a context during render. It stores nothing in the hook list, so it may be called conditionally. It is the one deliberate exception.</p>`
},
{
  d:'Easy', topic:'Patterns',
  q:`What is prop drilling, and what are the options for avoiding it?`,
  a:`<p>Prop drilling is passing a value through components that do not use it, only to reach one deeper down. Two or three levels is fine and explicit. Seven levels means a change to the value touches every file on the path.</p><p>The escalation, in order: restructure so the consumer is closer to the owner, or pass the rendered element down as children instead of the data; then context, for values a whole subtree needs and that change rarely; then an external store with selectors, when the value changes often and is read widely.</p>`,
  fq:`Does composition really solve it, or just move it?`,
  fa:`<p>Often it genuinely solves it. If the middle layers only forward the prop to a leaf, the parent can render that leaf itself and pass the finished element down as children, so the middle layers stop knowing about the value entirely. That works especially well for layouts.</p>`
},
{
  d:'Easy', topic:'JSX',
  q:`What are fragments and why do they exist?`,
  a:`<p>A fragment groups several elements without adding a node to the DOM. It exists because a component must return one element, and the alternative was wrapping everything in a div, which breaks CSS grid and flex layouts, table markup, and lists, where the parent expects specific children.</p><p>The shorthand is an empty tag pair. The long form, React.Fragment, is needed when the fragment is inside a map and requires a key, since the shorthand cannot take props.</p>`,
  code:`// shorthand\nreturn <><dt>{term}</dt><dd>{def}</dd></>;\n\n// keyed, inside a map\n{rows.map(r => (\n  <React.Fragment key={r.id}>\n    <dt>{r.term}</dt><dd>{r.def}</dd>\n  </React.Fragment>\n))}`,
  fq:`Where does an extra wrapper div actually cause a bug rather than just noise?`,
  fa:`<p>Anywhere the parent styles or validates its direct children: a flex or grid container, a table where a tr must be inside a tbody, a ul expecting li elements, and a select expecting options. It also changes reconciliation, since adding a wrapper remounts the subtree below it.</p>`
},
{
  d:'Easy', topic:'Basics',
  q:`Default or named exports for components?`,
  a:`<p>Named exports, as a default preference. They give the same name at every import site, so search and rename work, and they cannot be accidentally renamed into something meaningless. Default exports allow every file to call the same component something different.</p><p>The real answer is that consistency matters more than the choice, and one thing forces your hand: React.lazy expects a module with a default export, so lazily loaded route components are usually default exports.</p>`,
  fq:`How do you lazy-load a component that only has a named export?`,
  fa:`<p>Map it to a default in the import: lazy(() => import("./Editor").then(m => ({ default: m.Editor }))).</p>`
},
{
  d:'Easy', topic:'Events',
  q:`Synthetic events versus native events.`,
  a:`<p>The event object your handler receives is a SyntheticEvent, a cross-browser wrapper with the same interface as the native event: preventDefault, stopPropagation, target, and so on. The native event is available as e.nativeEvent.</p><p>It existed to smooth over browser differences and to let React attach a small number of listeners at the root rather than one per node. Modern browsers need much less smoothing, and since React 17 listeners attach to the root container rather than to document, which matters when you have several React roots or React inside another app.</p>`,
  fq:`Do you still need event pooling calls like e.persist?`,
  fa:`<p>No. Pooling was removed in React 17, so the event object is no longer reused and e.persist is a no-op. Reading e.target inside an async callback works now, though destructuring the value you need up front is still clearer.</p>`
},
{
  d:'Easy', topic:'Rendering',
  q:`How do you render something conditionally, and what is the classic footgun?`,
  a:`<p>With ordinary JavaScript expressions: a ternary for two branches, logical AND for one, an early return when the whole component becomes something else. There is no template directive, because JSX braces hold an expression.</p><p>The footgun is that React renders 0 and the empty string, while skipping null, undefined, and booleans. So items.length &amp;&amp; &lt;List /&gt; puts a literal 0 on the page when the array is empty. Compare explicitly.</p>`,
  code:`// bug: renders "0" when the list is empty\n{items.length && <List items={items} />}\n\n// fix\n{items.length > 0 && <List items={items} />}`,
  fq:`Is hiding a component with CSS equivalent to not rendering it?`,
  fa:`<p>No. Hidden-but-mounted keeps its state, its effects, its timers, and its requests running. If it should not exist, do not render it. If it should keep its state while hidden but stop working, that is what Activity in React 19.2 is for.</p>`
}
);
INTERVIEW.push(
{
  d:'Medium', topic:'State',
  q:`Why does setting state not update the variable immediately, and what is batching? Predict the output of three setCount(count + 1) calls in a row.`,
  a:`<p>Each render sees its own snapshot of state. A setter does not assign to your variable; it queues an update and asks for a re-render, and the new value only exists in that next render. So three setCount(count + 1) calls all read the same count and all compute the same number: the counter goes up by one, not three.</p><p>Batching is React collecting the updates from one tick and applying them in a single re-render. Since React 18 that happens everywhere, including inside timeouts, promises, and native event handlers. The fix for the counter is the updater form, which receives the latest pending value instead of the snapshot.</p>`,
  code:`// count is 0 in this render\nsetCount(count + 1);  // queue: 0 + 1\nsetCount(count + 1);  // queue: 0 + 1\nsetCount(count + 1);  // queue: 0 + 1  -> final 1\n\n// updater form composes\nsetCount(c => c + 1);\nsetCount(c => c + 1);\nsetCount(c => c + 1);  // -> 3`,
  fq:`When would you deliberately use the value form?`,
  fa:`<p>When the next state has nothing to do with the current one: setStatus("saving"), setSelectedId(id), setQuery(text). If the new value is derived from the old one, the updater form is never wrong, so make it the default.</p>`
},
{
  d:'Medium', topic:'State',
  q:`When would you use useReducer over useState? Write a counter with both.`,
  a:`<p>When several pieces of state change together, when the next state depends on the previous in non-trivial ways, or when the same combination of setter calls appears in more than one handler. A reducer puts every transition in one pure function you can read top to bottom and test without React.</p><p>There is a second, quieter reason: dispatch is stable across renders, so it never needs to appear in a dependency array or defeat a memoised child, which removes a whole class of plumbing.</p>`,
  code:`// useState\nconst [n, setN] = useState(0);\n<button onClick={() => setN(c => c + 1)}>+1</button>\n\n// useReducer\nfunction reducer(state, action) {\n  switch (action.type) {\n    case 'inc': return { n: state.n + 1, changes: state.changes + 1 };\n    case 'reset': return { n: 0, changes: 0 };\n    default: throw new Error('unknown: ' + action.type);\n  }\n}\nconst [state, dispatch] = useReducer(reducer, { n: 0, changes: 0 });\n<button onClick={() => dispatch({ type: 'inc' })}>+1</button>`,
  fq:`What must never go inside a reducer?`,
  fa:`<p>Side effects and impurity: no fetching, no Date.now or Math.random, no mutation of the existing state. StrictMode calls it twice in development precisely to catch that, and React may call it more than once anyway.</p>`
},
{
  d:'Medium', topic:'Effects',
  q:`Explain the dependency array. What happens if you omit a dependency? Fix this buggy interval.`,
  a:`<p>The array is your declaration of what the effect reads from the render that created it. React compares each entry with Object.is and re-runs the effect when one changed, which also refreshes the closure. Omit something the effect reads and the closure is never refreshed, so it uses the first render's value forever: a stale closure.</p><p>The interval below reads n but claims to read nothing, so it computes 0 + 1 on every tick and the display sticks at 1. There are two honest fixes: read nothing, using the updater form, or list n and accept that the timer restarts.</p>`,
  code:`// buggy\nuseEffect(() => {\n  const id = setInterval(() => setN(n + 1), 1000);\n  return () => clearInterval(id);\n}, []);\n\n// fix 1: the effect genuinely reads nothing\nuseEffect(() => {\n  const id = setInterval(() => setN(x => x + 1), 1000);\n  return () => clearInterval(id);\n}, []);\n\n// fix 2: be honest about the dependency\nuseEffect(() => {\n  const id = setTimeout(() => setN(n + 1), 1000);\n  return () => clearTimeout(id);\n}, [n]);`,
  fq:`An effect re-runs on every render and you cannot see why. Where do you look?`,
  fa:`<p>For a dependency whose identity changes every render: an object or array literal, or a function created in the body. The fix is to stabilise it or depend on the primitive inside it, such as [range.min] rather than [range]. Deleting the dependency turns a visible loop into an invisible stale value.</p>`
},
{
  d:'Medium', topic:'Effects',
  q:`How do you fetch data and handle loading, error, and empty states? Build useFetch.`,
  a:`<p>Four states, not three: loading, error, data, and empty, because "no results" is not the same as "not loaded yet". The request goes in an effect keyed on whatever it depends on, with a cleanup that cancels, and the previous error and loading flags reset as the new request starts.</p><p>Extracted into a hook it is reusable, and in a real app I would reach for TanStack Query instead, because caching, deduplication, retries, and revalidation are the parts a hand-rolled hook never gets round to.</p>`,
  code:`function useFetch(url) {\n  const [data, setData] = useState(null);\n  const [error, setError] = useState(null);\n  const [loading, setLoading] = useState(true);\n\n  useEffect(() => {\n    const controller = new AbortController();\n    setLoading(true);\n    setError(null);\n\n    fetch(url, { signal: controller.signal })\n      .then(r => {\n        if (!r.ok) throw new Error('HTTP ' + r.status);\n        return r.json();\n      })\n      .then(json => { setData(json); setLoading(false); })\n      .catch(err => {\n        if (err.name === 'AbortError') return;\n        setError(err.message); setLoading(false);\n      });\n\n    return () => controller.abort();\n  }, [url]);\n\n  return { data, error, loading };\n}`,
  fq:`Why does fetch need the r.ok check?`,
  fa:`<p>Because fetch only rejects on a network failure. A 404 or a 500 resolves normally, so without that check you parse an error page as your data and show it as success.</p>`
},
{
  d:'Medium', topic:'Effects',
  q:`How do you cancel an in-flight request when the component unmounts or the query changes?`,
  a:`<p>Create an AbortController inside the effect, pass its signal to fetch, and return () => controller.abort() as the cleanup. React runs that before the next effect and on unmount, so at most one request is ever live. The catch block must ignore AbortError, since you caused it and it is not something the user should see.</p><p>When the request cannot be cancelled, use an ignore flag captured in the closure and guard every setState with it. That fixes the race but still lets the work finish, so prefer aborting.</p>`,
  code:`useEffect(() => {\n  const c = new AbortController();\n  load(query, c.signal)\n    .then(setResults)\n    .catch(e => { if (e.name !== 'AbortError') setError(e.message); });\n  return () => c.abort();\n}, [query]);\n\n// no cancellation available\nuseEffect(() => {\n  let ignore = false;\n  load(query).then(r => { if (!ignore) setResults(r); });\n  return () => { ignore = true; };\n}, [query]);`,
  fq:`What exactly is the race condition here?`,
  fa:`<p>Two requests in flight, responses arriving in the wrong order, so the slower older one lands last and overwrites the newer. The user sees results for text they have already replaced, and nothing errors, which is why it survives code review.</p>`
},
{
  d:'Medium', topic:'State',
  q:`Two sibling components need to share state. What are your options, in order of escalation?`,
  a:`<p>First, lift the state to their closest common parent and pass the value down with a callback. That is the default and it is usually the end of the conversation.</p><p>If the owner ends up far above the users, next is composition: render the leaf in the owner and pass it down as children, so the middle layers stop carrying the prop. Then context, for a subtree-wide value that changes rarely. Then a store with selectors, when the value changes often and is read widely, since context re-renders every consumer. Server data is a separate category and belongs in a query library rather than any of these.</p>`,
  fq:`What is wrong with each sibling keeping its own copy and syncing them with an effect?`,
